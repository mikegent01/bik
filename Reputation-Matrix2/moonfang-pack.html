<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonfang Pack | The Hunt Eternal</title>
    
    <!-- Global Requirements -->
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    
    <!-- Page Specific -->
    <link rel="stylesheet" href="moonfang-pack.css">
    <script type="module" src="moonfang-pack.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body class="moonfang-theme">
    
    <!-- Ambient Background -->
    <div class="ambient-layer">
        <div class="fog fog-1"></div>
        <div class="fog fog-2"></div>
        <div class="trees-silhouette"></div>
        <div class="floating-particles" id="particles"></div>
    </div>

    <!-- Main Content -->
    <main class="pack-container">
        
        <!-- Header -->
        <header class="pack-header">
            <div class="claw-marks claw-left"></div>
            <div class="header-content">
                <div class="pack-emblem">
                    <div class="emblem-glow"></div>
                    <span class="emblem-icon">🐺</span>
                </div>
                <h1 class="pack-title">
                    <span class="title-accent">The</span>
                    <span class="title-main">Moonfang Pack</span>
                </h1>
                <p class="pack-motto">"We Hunt As One Under The Silver Eye"</p>
            </div>
            <div class="claw-marks claw-right"></div>
        </header>

        <!-- Alert Banner -->
        <div class="alert-banner" id="sovereigntyAlert">
            <div class="alert-icon">⚠️</div>
            <div class="alert-content">
                <strong>SUPERNATURAL SOVEREIGNTY ACT ENACTED</strong>
                <span>The Regal Empire has declared organized werewolves illegal. The Iron Legion hunts the Pack.</span>
            </div>
            <button class="alert-dismiss" aria-label="Dismiss">&times;</button>
        </div>

        <!-- Dynamic Content Container -->
        <div id="moonfang-content">
            <!-- Content rendered by JS -->
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Communing with the moon...</p>
            </div>
        </div>

    </main>

    <!-- Audio (optional) -->
    <audio id="howlAudio" preload="auto">
        <source src="assets/audio/wolf-howl.mp3" type="audio/mpeg">
    </audio>

    <script defer src="wario-site-sounds.js"></script>
</body>
</html>
