<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Inc. — XP Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg-dark: #0a0a0f;
    --bg-card: #111118;
    --bg-card-hover: #16161f;
    --bg-section: #0d0d14;
    --border: #1e1e2e;
    --border-glow: #2a2a3e;
    --text-primary: #e8e6e3;
    --text-secondary: #9a9aad;
    --text-dim: #5a5a72;
    --accent-gold: #d4a853;
    --accent-gold-dim: #7a6230;
    --accent-fire: #e85d3a;
    --accent-fire-glow: #ff7043;
    --accent-emerald: #3aab7c;
    --accent-emerald-glow: #45d99a;
    --accent-blue: #4a7fd4;
    --accent-blue-glow: #5a9af0;
    --accent-purple: #8b5fd4;
    --accent-purple-glow: #a67af0;
    --accent-crimson: #c43a3a;
    --accent-crimson-glow: #e04545;
    --accent-teal: #3ab5b5;
    --accent-teal-glow: #45d4d4;
    --accent-slate: #6a7a8a;
    --accent-slate-glow: #8a9aaa;
    --accent-rose: #d45a8b;
    --accent-rose-glow: #f07aab;
    --accent-amber: #d4953a;
    --accent-amber-glow: #f0b05a;
    --accent-indigo: #5a5ad4;
    --accent-indigo-glow: #7a7af0;
    --xp-combat: #e85d3a;
    --xp-exploration: #3aab7c;
    --xp-social: #d4a853;
    --xp-survival: #4a7fd4;
    --xp-discovery: #8b5fd4;
    --xp-chaos: #c43a3a;
    --xp-stealth: #3ab5b5;
    --xp-faith: #e8c95a;
    --xp-magic: #d45aaf;
    --xp-loyalty: #7aaa5a;
    --bar-bg: #1a1a25;
    --bar-track: #0f0f18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--border-glow) var(--bg-dark);
  }

  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Alegreya', Georgia, serif;
    font-size: 16px;
    line-height: 1.65;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 800px 600px at 20% 10%, rgba(212,168,83,0.03) 0%, transparent 70%),
      radial-gradient(ellipse 600px 800px at 80% 90%, rgba(139,95,212,0.03) 0%, transparent 70%),
      radial-gradient(ellipse 900px 400px at 50% 50%, rgba(58,171,124,0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ═══ HEADER ═══ */
  .site-header {
    position: relative;
    text-align: center;
    padding: 60px 20px 50px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(212,168,83,0.04) 0%, transparent 100%);
  }

  .site-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  }

  .header-ornament {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent-gold-dim);
    margin-bottom: 16px;
  }

  .site-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    color: var(--text-primary);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .site-title span { color: var(--accent-gold); }

  .site-subtitle {
    font-family: 'Alegreya SC', serif;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .total-xp-display {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  .total-stat { text-align: center; }

  .total-stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent-gold);
  }

  .total-stat-label {
    font-family: 'Alegreya SC', serif;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ═══ NAV ═══ */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0;
  }

  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Faction group headers in nav */
  .nav-faction-group {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
  }

  .nav-faction-group:last-child { border-bottom: none; }

  .nav-faction-label {
    font-family: 'Alegreya SC', serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 12px 0;
    user-select: none;
  }

  .nav-faction-tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-faction-tabs::-webkit-scrollbar { display: none; }

  .nav-tab {
    flex-shrink: 0;
    padding: 10px 18px 12px;
    font-family: 'Alegreya SC', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    white-space: nowrap;
    user-select: none;
    position: relative;
  }

  .nav-tab:hover {
    color: var(--text-secondary);
    background: rgba(255,255,255,0.02);
  }

  .nav-tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent-gold);
  }

  .nav-tab .tab-level {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: 6px;
    opacity: 0.7;
  }

  .nav-tab.active .tab-level {
    color: var(--accent-gold-dim);
    opacity: 1;
  }

  .nav-tab .tab-xp-mini {
    display: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-left: 4px;
    opacity: 0.5;
  }

  /* ═══ MAIN ═══ */
  .main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* ═══ PANELS ═══ */
  .player-panel {
    display: none;
    animation: panelFadeIn 0.4s ease;
  }

  .player-panel.active { display: block; }

  @keyframes panelFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ═══ PLAYER HEADER ═══ */
  .player-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 30px;
    align-items: center;
    padding: 36px 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  .player-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--player-accent, var(--accent-gold));
    opacity: 0.6;
  }

  .player-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--player-accent, var(--accent-gold));
    box-shadow: 0 0 20px rgba(0,0,0,0.3), inset 0 0 15px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .player-info h2 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .player-epithet {
    font-family: 'Alegreya', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .player-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .player-level-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--player-accent, var(--accent-gold));
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--player-accent, var(--accent-gold));
    border-radius: 4px;
    padding: 3px 10px;
    opacity: 0.8;
  }

  .player-faction-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
  }

  .player-xp-summary {
    text-align: right;
    flex-shrink: 0;
  }

  .player-xp-current {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 500;
    color: var(--player-accent, var(--accent-gold));
    line-height: 1;
  }

  .player-xp-next {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .player-xp-label {
    font-family: 'Alegreya SC', serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ═══ XP BAR ═══ */
  .xp-bar-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 30px;
    margin-bottom: 30px;
  }

  .xp-bar-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .xp-bar-label {
    font-family: 'Alegreya SC', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .xp-bar-label span {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
  }

  .xp-bar-track {
    width: 100%;
    height: 14px;
    background: var(--bar-track);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .xp-bar-segments {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    border-radius: 7px;
    overflow: hidden;
  }

  .xp-bar-segment {
    height: 100%;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .xp-bar-segment::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: rgba(0,0,0,0.3);
  }

  .xp-bar-segment:last-child::after { display: none; }

  .xp-remaining {
    text-align: center;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .xp-remaining strong {
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* ═══ LEGEND ═══ */
  .xp-legend {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
    margin-bottom: 30px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
  }

  .legend-item:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-glow);
  }

  .legend-item.dimmed { opacity: 0.3; }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }

  .legend-name {
    font-family: 'Alegreya SC', serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-secondary);
    flex: 1;
  }

  .legend-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    font-weight: 500;
  }

  .legend-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* ═══ ENTRIES ═══ */
  .entries-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .entries-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 2px;
  }

  .entries-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .filter-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .filter-btn {
    font-family: 'Alegreya SC', serif;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .filter-btn:hover {
    border-color: var(--border-glow);
    color: var(--text-secondary);
  }

  .filter-btn.active {
    background: rgba(255,255,255,0.05);
    border-color: var(--accent-gold-dim);
    color: var(--text-primary);
  }

  .xp-entries {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .xp-entry {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .xp-entry:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-glow);
  }

  .xp-entry.expanded { background: var(--bg-card-hover); }

  .entry-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .entry-content { min-width: 0; }

  .entry-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .entry-title {
    font-family: 'Alegreya', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-primary);
  }

  .entry-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid;
    opacity: 0.75;
  }

  .entry-description {
    font-family: 'Alegreya', serif;
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 5px;
    line-height: 1.55;
    display: none;
  }

  .xp-entry.expanded .entry-description { display: block; }

  .entry-xp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 1px;
  }

  .entry-xp .plus { opacity: 0.5; font-size: 14px; }

  .entry-expand-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 3px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .xp-entry:hover .entry-expand-hint { opacity: 0.6; }
  .xp-entry.expanded .entry-expand-hint { opacity: 0; }

  /* ═══ EMPTY STATE ═══ */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: 'Alegreya', serif;
    font-style: italic;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  /* ═══ CATEGORY COLORS ═══ */
  .cat-combat .entry-dot    { background: var(--xp-combat); }
  .cat-combat .entry-category { color: var(--xp-combat); border-color: rgba(232,93,58,0.3); background: rgba(232,93,58,0.08); }
  .cat-combat .entry-xp     { color: var(--xp-combat); }

  .cat-exploration .entry-dot    { background: var(--xp-exploration); }
  .cat-exploration .entry-category { color: var(--xp-exploration); border-color: rgba(58,171,124,0.3); background: rgba(58,171,124,0.08); }
  .cat-exploration .entry-xp     { color: var(--xp-exploration); }

  .cat-social .entry-dot    { background: var(--xp-social); }
  .cat-social .entry-category { color: var(--xp-social); border-color: rgba(212,168,83,0.3); background: rgba(212,168,83,0.08); }
  .cat-social .entry-xp     { color: var(--xp-social); }

  .cat-survival .entry-dot    { background: var(--xp-survival); }
  .cat-survival .entry-category { color: var(--xp-survival); border-color: rgba(74,127,212,0.3); background: rgba(74,127,212,0.08); }
  .cat-survival .entry-xp     { color: var(--xp-survival); }

  .cat-discovery .entry-dot    { background: var(--xp-discovery); }
  .cat-discovery .entry-category { color: var(--xp-discovery); border-color: rgba(139,95,212,0.3); background: rgba(139,95,212,0.08); }
  .cat-discovery .entry-xp     { color: var(--xp-discovery); }

  .cat-chaos .entry-dot    { background: var(--xp-chaos); }
  .cat-chaos .entry-category { color: var(--xp-chaos); border-color: rgba(196,58,58,0.3); background: rgba(196,58,58,0.08); }
  .cat-chaos .entry-xp     { color: var(--xp-chaos); }

  .cat-stealth .entry-dot    { background: var(--xp-stealth); }
  .cat-stealth .entry-category { color: var(--xp-stealth); border-color: rgba(58,181,181,0.3); background: rgba(58,181,181,0.08); }
  .cat-stealth .entry-xp     { color: var(--xp-stealth); }

  .cat-faith .entry-dot    { background: var(--xp-faith); }
  .cat-faith .entry-category { color: var(--xp-faith); border-color: rgba(232,201,90,0.3); background: rgba(232,201,90,0.08); }
  .cat-faith .entry-xp     { color: var(--xp-faith); }

  .cat-magic .entry-dot    { background: var(--xp-magic); }
  .cat-magic .entry-category { color: var(--xp-magic); border-color: rgba(212,90,175,0.3); background: rgba(212,90,175,0.08); }
  .cat-magic .entry-xp     { color: var(--xp-magic); }

  .cat-loyalty .entry-dot    { background: var(--xp-loyalty); }
  .cat-loyalty .entry-category { color: var(--xp-loyalty); border-color: rgba(122,170,90,0.3); background: rgba(122,170,90,0.08); }
  .cat-loyalty .entry-xp     { color: var(--xp-loyalty); }

  /* ═══ BAR SEGMENT COLORS ═══ */
  .seg-combat      { background: var(--xp-combat); }
  .seg-exploration  { background: var(--xp-exploration); }
  .seg-social       { background: var(--xp-social); }
  .seg-survival     { background: var(--xp-survival); }
  .seg-discovery    { background: var(--xp-discovery); }
  .seg-chaos        { background: var(--xp-chaos); }
  .seg-stealth      { background: var(--xp-stealth); }
  .seg-faith        { background: var(--xp-faith); }
  .seg-magic        { background: var(--xp-magic); }
  .seg-loyalty      { background: var(--xp-loyalty); }

  /* ═══ RESPONSIVE ═══ */
  @media (max-width: 768px) {
    .player-header {
      grid-template-columns: 1fr;
      text-align: center;
      gap: 16px;
      padding: 24px 20px;
    }
    .player-icon { margin: 0 auto; width: 64px; height: 64px; font-size: 28px; }
    .player-xp-summary { text-align: center; }
    .xp-legend { grid-template-columns: 1fr 1fr; }
    .xp-entry { grid-template-columns: 8px 1fr auto; gap: 10px; padding: 12px 14px; }
    .total-xp-display { gap: 24px; }
    .nav-tab { padding: 8px 12px; font-size: 11px; }
    .player-badges { justify-content: center; }
  }

  @media (max-width: 480px) {
    .xp-legend { grid-template-columns: 1fr; }
    .entry-top { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

// ═══════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════

function computeCategoryTotals(entries) {
  const totals = {};
  for (const e of entries) {
    totals[e.cat] = (totals[e.cat] || 0) + e.xp;
  }
  return totals;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function buildHeader() {
  const statsEl = document.getElementById('header-stats');
  let totalXP = 0;
  let charCount = 0;
  const usedCats = new Set();

  for (const [key, p] of Object.entries(PLAYERS)) {
    totalXP += p.currentXP;
    charCount++;
    for (const e of p.entries) {
      usedCats.add(e.cat);
    }
  }

  // Count player-faction characters vs all
  let playerCount = 0;
  for (const [key, p] of Object.entries(PLAYERS)) {
    const f = FACTIONS[p.faction || 'unknown'] || FACTIONS.unknown;
    if (f.is_player) playerCount++;
  }

  statsEl.innerHTML = `
    <div class="total-stat">
      <div class="total-stat-value">${totalXP.toLocaleString()}</div>
      <div class="total-stat-label">Total Party XP</div>
    </div>
    <div class="total-stat">
      <div class="total-stat-value">${playerCount}</div>
      <div class="total-stat-label">Party Members</div>
    </div>
    <div class="total-stat">
      <div class="total-stat-value">${charCount}</div>
      <div class="total-stat-label">Tracked Characters</div>
    </div>
    <div class="total-stat">
      <div class="total-stat-value">${usedCats.size}</div>
      <div class="total-stat-label">XP Categories</div>
    </div>
  `;
}

function buildNavigation() {
  const navEl = document.getElementById('nav-container');
  navEl.innerHTML = '';

  // Group characters by faction
  const groups = {};
  for (const [key, p] of Object.entries(PLAYERS)) {
    const fid = p.faction || 'unknown';
    if (!groups[fid]) groups[fid] = [];
    groups[fid].push({ key, ...p });
  }

  // Sort factions: player factions first, then by sort_order
  const factionOrder = Object.keys(groups).sort((a, b) => {
    const fa = FACTIONS[a] || FACTIONS.unknown;
    const fb = FACTIONS[b] || FACTIONS.unknown;
    if (fa.is_player !== fb.is_player) return fa.is_player ? -1 : 1;
    return (fa.sort_order || 99) - (fb.sort_order || 99);
  });

  // Sort characters within each faction by level desc, then XP desc
  for (const fid of factionOrder) {
    groups[fid].sort((a, b) => b.level - a.level || b.currentXP - a.currentXP);
  }

  let isFirst = true;

  for (const fid of factionOrder) {
    const faction = FACTIONS[fid] || FACTIONS.unknown;
    const chars = groups[fid];

    const group = document.createElement('div');
    group.className = 'nav-faction-group';

    // Faction label
    const label = document.createElement('div');
    label.className = 'nav-faction-label';
    label.textContent = `${faction.icon} ${faction.name}`;
    group.appendChild(label);

    // Character tabs
    const tabRow = document.createElement('div');
    tabRow.className = 'nav-faction-tabs';

    for (const ch of chars) {
      const disp = getDisplay(ch.key);
      const tab = document.createElement('div');
      tab.className = 'nav-tab' + (isFirst ? ' active' : '');
      tab.dataset.target = ch.key;
      tab.innerHTML = `${disp.icon} ${escapeHtml(ch.name)} <span class="tab-level">Lv.${ch.level}</span>`;
      tab.addEventListener('click', () => activatePanel(ch.key));
      tabRow.appendChild(tab);
      isFirst = false;
    }

    group.appendChild(tabRow);
    navEl.appendChild(group);
  }
}

function buildAllPanels() {
  const container = document.getElementById('panels-container');
  container.innerHTML = '';

  let isFirst = true;

  for (const [key, p] of Object.entries(PLAYERS)) {
    const panel = buildPlayerPanel(key, p, isFirst);
    container.appendChild(panel);
    isFirst = false;
  }
}

function buildPlayerPanel(key, p, isActive) {
  const disp = getDisplay(key);
  const factionId = p.faction || 'unknown';
  const faction = FACTIONS[factionId] || FACTIONS.unknown;
  const remaining = p.nextXP - p.currentXP;
  const pct = p.nextXP > 0 ? ((p.currentXP / p.nextXP) * 100).toFixed(1) : 0;

  const section = document.createElement('section');
  section.className = 'player-panel' + (isActive ? ' active' : '');
  section.id = `panel-${key}`;
  section.dataset.player = key;

  // Apply accent colors via CSS custom properties
  section.style.setProperty('--player-accent', `var(${disp.accentVar})`);
  section.style.setProperty('--player-accent-glow', `var(${disp.accentGlowVar})`);

  section.innerHTML = `
    <div class="player-header">
      <div class="player-icon">${disp.icon}</div>
      <div class="player-info">
        <h2>${escapeHtml(p.name)}</h2>
        ${disp.epithet ? `<p class="player-epithet">${escapeHtml(disp.epithet)}</p>` : ''}
        <div class="player-badges">
          <span class="player-level-badge">◆ Level ${p.level}${disp.class !== 'Unknown' ? ' · ' + escapeHtml(disp.class) : ''}</span>
          <span class="player-faction-badge">${faction.icon} ${escapeHtml(faction.name)}</span>
        </div>
      </div>
      <div class="player-xp-summary">
        <div class="player-xp-current">${p.currentXP.toLocaleString()}</div>
        <div class="player-xp-next">/ ${p.nextXP.toLocaleString()}</div>
        <div class="player-xp-label">Experience Points</div>
      </div>
    </div>

    <div class="xp-bar-container">
      <div class="xp-bar-labels">
        <span class="xp-bar-label">Level ${p.level} · <span>${p.currentXP.toLocaleString()} XP</span></span>
        <span class="xp-bar-label">Level ${p.level + 1} · <span>${p.nextXP.toLocaleString()} XP</span></span>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-segments" id="${key}-bar"></div>
      </div>
      <div class="xp-remaining"><strong>${remaining.toLocaleString()} XP</strong> remaining to Level ${p.level + 1}</div>
    </div>

    <div class="xp-legend" id="${key}-legend"></div>

    <div class="entries-header">
      <span class="entries-title">XP Breakdown</span>
      <span class="entries-count" id="${key}-count"></span>
    </div>
    <div class="filter-buttons" id="${key}-filters"></div>
    <div class="xp-entries" id="${key}-entries"></div>
  `;

  return section;
}

function renderPlayer(key) {
  const p = PLAYERS[key];
  const catTotals = computeCategoryTotals(p.entries);
  const totalXP = p.currentXP;
  const cats = Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]);

  // ── Bar segments ──
  const barEl = document.getElementById(`${key}-bar`);
  if (!barEl) return;
  barEl.innerHTML = '';

  if (cats.length === 0) {
    // Empty bar
  } else {
    for (const cat of cats) {
      const pct = (catTotals[cat] / p.nextXP) * 100;
      const seg = document.createElement('div');
      seg.className = `xp-bar-segment seg-${cat}`;
      seg.style.width = `${pct}%`;
      seg.title = `${CATEGORIES[cat]?.name || cat}: ${catTotals[cat].toLocaleString()} XP`;
      barEl.appendChild(seg);
    }
  }

  // ── Legend ──
  const legendEl = document.getElementById(`${key}-legend`);
  legendEl.innerHTML = '';

  if (cats.length === 0) {
    // No legend for empty characters
  } else {
    for (const cat of cats) {
      const pct = totalXP > 0 ? ((catTotals[cat] / totalXP) * 100).toFixed(1) : '0.0';
      const catInfo = CATEGORIES[cat] || { name: cat, color: '#888', icon: '·' };
      const item = document.createElement('div');
      item.className = `legend-item cat-${cat}`;
      item.dataset.category = cat;
      item.innerHTML = `
        <span class="legend-dot" style="background:${catInfo.color};color:${catInfo.color}"></span>
        <span class="legend-name">${catInfo.icon} ${catInfo.name}</span>
        <span class="legend-value">${catTotals[cat].toLocaleString()}</span>
        <span class="legend-pct">${pct}%</span>
      `;
      item.addEventListener('click', () => toggleFilter(key, cat));
      legendEl.appendChild(item);
    }
  }

  // ── Filter buttons ──
  const filtersEl = document.getElementById(`${key}-filters`);
  filtersEl.innerHTML = '';

  if (p.entries.length > 0) {
    const allBtn = document.createElement('div');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'All';
    allBtn.dataset.category = 'all';
    allBtn.addEventListener('click', () => setFilter(key, 'all'));
    filtersEl.appendChild(allBtn);

    for (const cat of cats) {
      const catInfo = CATEGORIES[cat] || { name: cat };
      const btn = document.createElement('div');
      btn.className = 'filter-btn';
      btn.textContent = catInfo.name;
      btn.dataset.category = cat;
      btn.addEventListener('click', () => setFilter(key, cat));
      filtersEl.appendChild(btn);
    }
  }

  // ── Entries ──
  renderEntries(key, 'all');
}

function renderEntries(key, filterCat) {
  const p = PLAYERS[key];
  const entriesEl = document.getElementById(`${key}-entries`);
  const countEl = document.getElementById(`${key}-count`);
  entriesEl.innerHTML = '';

  if (p.entries.length === 0) {
    entriesEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📜</div>
        <p>No recorded deeds yet.<br>This character's story is still being written.</p>
      </div>
    `;
    countEl.textContent = '0 entries';
    return;
  }

  let entries = [...p.entries];
  if (filterCat !== 'all') {
    entries = entries.filter(e => e.cat === filterCat);
  }

  entries.sort((a, b) => b.xp - a.xp);

  countEl.textContent = `${entries.length} entries · ${entries.reduce((s, e) => s + e.xp, 0).toLocaleString()} XP`;

  for (const entry of entries) {
    const catInfo = CATEGORIES[entry.cat] || { name: entry.cat, color: '#888' };
    const el = document.createElement('div');
    el.className = `xp-entry cat-${entry.cat}`;
    el.innerHTML = `
      <div class="entry-dot" style="background:${catInfo.color}"></div>
      <div class="entry-content">
        <div class="entry-top">
          <span class="entry-title">${escapeHtml(entry.title)}</span>
          <span class="entry-category">${catInfo.name}</span>
        </div>
        <div class="entry-expand-hint">click to expand</div>
        <div class="entry-description">${escapeHtml(entry.desc)}</div>
      </div>
      <div class="entry-xp"><span class="plus">+</span>${entry.xp.toLocaleString()}</div>
    `;
    el.addEventListener('click', () => el.classList.toggle('expanded'));
    entriesEl.appendChild(el);
  }
}

function setFilter(playerKey, cat) {
  const filtersEl = document.getElementById(`${playerKey}-filters`);
  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.category === cat);
  });

  const legendEl = document.getElementById(`${playerKey}-legend`);
  legendEl.querySelectorAll('.legend-item').forEach(item => {
    if (cat === 'all') {
      item.classList.remove('dimmed');
    } else {
      item.classList.toggle('dimmed', item.dataset.category !== cat);
    }
  });

  renderEntries(playerKey, cat);
}

function toggleFilter(playerKey, cat) {
  const filtersEl = document.getElementById(`${playerKey}-filters`);
  const currentActive = filtersEl.querySelector('.filter-btn.active');
  if (currentActive && currentActive.dataset.category === cat) {
    setFilter(playerKey, 'all');
  } else {
    setFilter(playerKey, cat);
  }
}

// ═══════════════════════════════════════════
//  PANEL SWITCHING
// ═══════════════════════════════════════════

function activatePanel(key) {
  // Update tabs
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const targetTab = document.querySelector(`.nav-tab[data-target="${key}"]`);
  if (targetTab) targetTab.classList.add('active');

  // Update panels
  document.querySelectorAll('.player-panel').forEach(p => p.classList.remove('active'));
  const targetPanel = document.getElementById(`panel-${key}`);
  if (targetPanel) targetPanel.classList.add('active');
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  buildHeader();
  buildNavigation();
  buildAllPanels();

  for (const key of Object.keys(PLAYERS)) {
    renderPlayer(key);
  }
});
</script>
