🤝",color:"text-blue-300",bg:"bg-blue-950/40",border:"border-blue-800/50"},heist:{label:"Heist",icon:"🃏",color:"text-yellow-300",bg:"bg-yellow-950/40",border:"border-yellow-800/50"},divine:{label:"Divine",icon:"✨",color:"text-indigo-300",bg:"bg-indigo-950/40",border:"border-indigo-800/50"},faction:{label:"Faction",icon:"🏛️",color:"text-orange-300",bg:"bg-orange-950/40",border:"border-orange-800/50"},tragedy:{label:"Tragedy",icon:"💀",color:"text-slate-300",bg:"bg-slate-950/40",border:"border-slate-700/50"}},ig=[{id:"archie",name:"Archie Miser",title:"The Indebted Pyromaniac",subtitle:"Who Bleeds Entropy",level:5,currentXP:11e3,nextLevelXP:14e3,prevLevelXP:6500,icon:"🔥",colorTheme:{primary:"from-orange-600 to-red-700",secondary:"from-orange-950 to-red-950",accent:"orange-400",glow:"shadow-orange-900/60",bar:"from-orange-500 to-red-600",badge:"bg-orange-900/60 border-orange-700/50 text-orange-300",border:"border-orange-800/40",text:"text-orange-300"},quote:"WAH. Archie is a walking disaster who leaves scorched earth, unpaid bills, and dimensional instability in his wake.",xpEntries:[{category:"combat",amount:1008,label:"Tea Party Fireball — Vigilance Cargo Hold",description:"Deployed a fireball in an enclosed wooden airship to neutralise the Tea Leaf Syndicate's muscle. Devastating effectiveness, questionable wisdom. Killed most of the Syndicate's fighting force in one cast. Sparked the cascade of events that destroyed the Syndicate entirely.",session:"The Vigilance Arc"},{category:"combat",amount:672,label:"Syndicate Showdown — Vigilance Deck",description:"Continued magical assault during the Syndicate confrontation aboard the Vigilance. Contributed to Earl Grey's explosive end and the destruction of the Tea Leaf Syndicate as an organisation.",session:"The Vigilance Arc"},{category:"combat",amount:504,label:"Spider Grove — Ranged Fire Support",description:"Provided ranged fire support during the Spider Grove Battle. War Mage's Staff was claimed on his behalf by Markop, granting access to additional fire capability for future engagements.",session:"Spider Grove"},{category:"combat",amount:294,label:"Raventree Manor — Ghost-Clearing Operations",description:"Provided covering fire for Luigi during the Waltzgeist encounter in the ruined dance hall. Missed. Then missed again. Luigi's vacuum ultimately handled it, but Archie's entropy-bleeding may have weakened the ghost enough to make the vacuum viable.",session:"Raventree Manor"},{category:"exploration",amount:588,label:"Shadowfell Navigation — A Month Alone",description:"Survived approximately one month alone in the Shadowfell without fire magic. Explored the Shadow Estate territories, the vampire manor, surrounding forests, and the crash site of the Deliverance. Navigated a dimension designed to extinguish hope.",session:"Shadowfell Wandering"},{category:"exploration",amount:378,label:"Purple Legion Territory — Crash Site Infiltration",description:"Infiltrated the Deliverance crash site under the alias 'Vin'. Explored the scrapping operation, gathered intelligence on the Purple Legion's holdings in the Vamp Lands, and obtained a purple-tinted Midlands map.",session:"Shadowfell — Purple Legion"},{category:"exploration",amount:252,label:"Rakka's Temple & Ravencreek",description:"Operated from Rakka's hidden temple deep in the enchanted woods. Travelled to Ravencreek, a town under vampire-werewolf conflict. Stayed at the Veilwood Spa under the alias 'Mr. Ash' — the fire mage who called himself ASH.",session:"Pre-Crisis Arc"},{category:"survival",amount:756,label:"Shadowfell Survival Without Fire",description:"Survived the Shadowfell for weeks after the Planar Fracture scattered the party. With fire magic completely suppressed by planar entropy, Archie was forced to rely on disguise, deception, and improvisation. The pyromaniac without pyromancy. He endured.",session:"Shadowfell Wandering"},{category:"survival",amount:420,label:"Shadow Estate Dinner — Vampire Court Survival",description:"Survived an entire vampire lord dinner party under the alias 'Darman Knightly'. Navigated vampiric politics without fire, without combat, through sheer deception in a room full of beings who consume the living as a social activity.",session:"Shadow Estate"},{category:"survival",amount:336,label:"Iron Sky Breach — Interrogation Survival",description:"Survived interrogation by Agent Malissia of the Iron Legion during the Iron Sky Breach aboard the Vigilance. Retained enough composure during active threat to execute the Entropy Ring gambit.",session:"The Vigilance Arc"},{category:"survival",amount:294,label:"Swiftsoul Arrest — Escaped Pursuit",description:"Survived arrest pursuit through Swiftsoul Air Blimp Station service corridors, leaping to a cliffside ledge. Was drugged with Nightshade Bloom extract and still managed to evade capture long enough to make it dramatically inconvenient for the Iron Fists Guild.",session:"Swiftsoul Incident"},{category:"roleplay",amount:504,label:"Darman Knightly — Long-Con Identity",description:"Maintained the 'Darman Knightly' persona across multiple vampire social encounters. Required suppressing every instinct that defines Archie as a person: no fire, no explosions, no reckless decisions. Physically painful by all available evidence.",session:"Shadow Estate"},{category:"roleplay",amount:336,label:"Vampire Guard Disguise — 'Dracacide' & 'Vin'",description:"Operated as a convincing vampire guard under two separate aliases in the Shadowfell. Exploited the vampiric social structure's assumption that anyone following protocols belongs. Neither alias was convincing by reasonable standards. Both worked.",session:"Shadowfell — Purple Legion"},{category:"roleplay",amount:252,label:"Vampire Paperwork — Bureaucratic Compliance",description:"Filed incident reports to maintain cover identity with vampire overlords. Archie Miser, the man who resolves diplomatic disputes with fireballs, completed administrative paperwork in a dimension of death. This deserves recognition.",session:"Shadow Estate"},{category:"discovery",amount:672,label:"Entropy Ring Gambit — Toadburt's Secret",description:"During Iron Legion interrogation, snapped off the 'handler' half of a paired Entropy Ring system. This broken ring gave Archie the ability to sense active Entropy Rings and jam their signal once per day — potentially freeing Toadburt from Iron Legion control.",session:"The Vigilance Arc"},{category:"discovery",amount:420,label:"Mages' Guild Debrief — Bridge Plane Intel",description:"Learned from Guild operatives that the Oracle constructed a 'Regulator Plane' — a Bridge Plane connecting the Shadowfell, Feywild, and Material planes. Carries this knowledge as one of two massive party secrets currently locked inside his head.",session:"Raventree Manor"},{category:"discovery",amount:294,label:"Purple Legion Map — Shadowfell Midlands",description:"Obtained a purple-tinted map of the Midlands reflected through Shadowfell geometry during the Purple Legion crash site infiltration. First cartographic intelligence of Shadowfell territorial organisation.",session:"Shadowfell — Purple Legion"},{category:"discovery",amount:210,label:"Mystic Morel's Stolen Prophecy",description:"Received (involuntarily) a musical prophecy from Mystic Morel: 'The Heir was grown, not born, you see — Root and scale in tapestry.' Morel then stole Archie's watch, keys, and compass, and used them to open a planar portal. Archie now carries knowledge about the Oracle's Heir.",session:"Raventree Manor"},{category:"heist",amount:420,label:"Three-Eyed Bandit — Cursed Artifact Heist",description:"Attempted to steal a cursed artifact that temporarily granted precognitive flashes. Interpreted 'I can see danger coming' as 'I can walk directly into danger and dodge.' Alias 'The Three-Eyed Bandit' stuck because the underworld perceived him as someone touched by strange magic and best approached with caution.",session:"Pre-Crisis Arc"},{category:"heist",amount:294,label:"Checkpoint Bypass — Shadow Estate",description:"Talked his way through vampire checkpoints, convinced a guard the missing prisoner fled in a wrong direction, and navigated social situations that should have blown his cover multiple times. Without fireballs. Without a backup plan. Through words alone.",session:"Shadow Estate"},{category:"diplomacy",amount:336,label:"Onyx Hand Tribunal — Acquittal",description:"Was acquitted of killing Mages' Guild Senior Enforcer Valorian Stormweave by an Onyx Hand tribunal. The ruling was justifiable defense. Surviving an underworld tribunal with your life and reputation nominally intact is a diplomatic achievement, even if nobody calls it that.",session:"Pre-Crisis Arc"},{category:"diplomacy",amount:168,label:"Orvinder Danos — Shadowfell Alliance",description:"Correctly identified mysterious barrister Orvinder Danos (who appeared from nowhere, walked with an unneeded cane, and knew Archie by name) as suspicious — then accepted his portal assistance anyway. Assessment proved correct: Danos was genuinely helpful.",session:"Shadowfell — Purple Legion"},{category:"faction",amount:420,label:"Mages' Guild — Coerced Membership",description:"Was inducted into the Mages' Guild under ultimatum: 'You work for the Mages' Guild now.' His entropy-bleeding magic makes him simultaneously their best tool and their greatest hazard. He didn't have a choice. The man who killed their operative Stormweave now works for the organisation Stormweave served.",session:"Raventree Manor"},{category:"faction",amount:252,label:"Rakka's Agency — Field Operative",description:"Served as a field operative for the mysterious entity Rakka, conducting dangerous retrieval missions from a hidden temple in the enchanted woods. Worked alongside the Sea Dogs smuggling crew and an unidentified horse person.",session:"Pre-Crisis Arc"},{category:"tragedy",amount:378,label:"Usk's Finger — The Necessary Betrayal",description:"Cut off Usk's finger to prove loyalty to vampire lords and maintain the Darman Knightly cover. Understood the tactical necessity — the cover was keeping him alive in a room full of vampires. Usk is still missing a finger. The equation doesn't balance no matter how much context you add.",session:"Shadow Estate"},{category:"tragedy",amount:294,label:"The Overheard Sentence — Acceptable Death",description:"Overheard Agent L tell a Guild operative: 'Even if it may kill Archie?' / 'Yes.' The organisation that now employs him factored his death into operational planning with the casual tone of a budget line item. Then the rope snapped.",session:"Raventree Manor"},{category:"tragedy",amount:252,label:"The Rope Invoice — 2,062 Gold Pieces",description:"Was handed an itemised bill for a broken 50-foot hempen rope: Guild Membership Levy, Ogre Load-Test Certification, Guild Master's Discretionary Gratuity (for his new wyvern saddle), and Sales Tax. Grand Total: 2,062 gold and 5 silver. Archie said he'd pay for it.",session:"Raventree Manor"},{category:"survival",amount:300,label:"Lizardfolk Containment — Unconscious Target",description:"Was unconscious and surrounded by an entire lizardfolk containment team specifically assembled because 'when he wakes up ugly things can happen.' They needed multiple guards, a powerful mech user to knock him out, and a trap involving a fire monster. His reputation preceded him even while sleeping.",session:"4 Harvestside 1040"},{category:"survival",amount:250,label:"Fire Monster Chase — Jurisdictional Trap Evasion",description:"Chased upstairs by a spiritual fire anomaly summoned specifically to bait him into casting fireball for a 'jurisdictional trap' — unauthorized use of high-level spells. Almost said 'fir-' before being yanked into the Astral Altar. Escaped arrest through involuntary planar teleportation.",session:"4 Harvestside 1040"},{category:"diplomacy",amount:400,label:"Toad God Negotiation — Refused the Deal",description:"Stood before the Toad God in the Astral Altar and refused multiple offers: refused to prioritize collecting the Star Shard, refused to care about Remi's contract ('a lot going on'), refused the offer to 'bring it all back in time.' Chose his own path — Shadeward Manor — and walked away from a god.",session:"4 Harvestside 1040"},{category:"combat",amount:200,label:"Freeze Beam — The Newbee",description:"Fired a freeze beam (ICE, not fire) at the lizardfolk newbee in the Astral Altar, tripping him into a portal. The fire mage used ice. The Toad God called it a victory. The newbee escaped into a pond in the Feywild. Archie's combat record remains confusing.",session:"4 Harvestside 1040"},{category:"discovery",amount:350,label:"Toad God Intel — Star Shard & Remi's Contract",description:"Learned from the Toad God that the Oracle 'holds one of my shards' and is 'doing a piss poor job guarding it.' Also learned Remi signed a contract and 'her eyes will be rotted to the core.' Filed both pieces of intelligence. Declined to act on either immediately.",session:"4 Harvestside 1040"},{category:"discovery",amount:50,label:"Lizardfolk Sketch — Intelligence Gathering",description:"Drew a sketch of the lizardfolk newbee on parchment while standing in the Astral Altar, in the presence of a god, mid-negotiation. Archie's priorities remain Archie's priorities.",session:"4 Harvestside 1040"}]},{id:"hjumpik",name:"Hjumpik",title:"The Maze Walker",subtitle:"Navigator of Broken Time",level:6,currentXP:16712,nextLevelXP:23e3,prevLevelXP:14e3,icon:"🌀",colorTheme:{primary:"from-violet-600 to-purple-700",secondary:"from-violet-950 to-purple-950",accent:"violet-400",glow:"shadow-violet-900/60",bar:"from-violet-500 to-purple-600",badge:"bg-violet-900/60 border-violet-700/50 text-violet-300",border:"border-violet-800/40",text:"text-violet-300"},quote:"The Maze Walker. Card IX of the Oracle's Deck. Depicted navigating the Maze of Time itself — which says everything about Hjumpik that needs saying.",xpEntries:[{category:"exploration",amount:2200,label:"Maze of Time — Full Navigation",description:"Successfully navigated the Maze of Time in the Deep Mirror dimension — a space where time decays and the geometry of reality consumes itself. The Oracle's Deck depicts Hjumpik in this exact moment on Card IX: The Maze Walker. No other party member received a card depicting this feat.",session:"Deep Mirror"},{category:"exploration",amount:1100,label:"Deep Mirror — Clockwork Void Traversal",description:"Traversed the Deep Mirror dimension including clockwork voids, impossible geometry, and shifting gravity. A dimension where reality eats itself and time does not function as advertised.",session:"Deep Mirror"},{category:"exploration",amount:800,label:"Three-Dimensional Fracture Zones",description:"Explored areas directly affected by the Planar Fracture, navigating the dangerous overlap zones between the Material Plane, Shadowfell, and Feywild. Survived dimensional bleed events that would disorient most adventurers permanently.",session:"Post-Fracture"},{category:"exploration",amount:500,label:"Shadow Estate — Grounds & Hidden Passages",description:"Mapped and navigated the Shadow Estate's external grounds, hidden passages, and surrounding territory during the vampire crisis. Contributed to the party's spatial understanding of a hostile environment.",session:"Shadow Estate"},{category:"combat",amount:1400,label:"Spider Grove — Full Engagement",description:"Participated in the Spider Grove battle against the Arachnid Matriarch. Contributed to the sustained multi-front engagement that allowed Markop to grow to titan size and grapple the colossal spider toward the banishment circle.",session:"Spider Grove"},{category:"combat",amount:900,label:"Shadow Estate — Undead Encounters",description:"Engaged multiple undead threats throughout the Shadow Estate and its grounds. Contributed to the clearance of threats that would have overwhelmed the separated party fragments.",session:"Shadow Estate"},{category:"combat",amount:600,label:"Vigilance — Iron Sky Breach Defence",description:"Defended against Iron Legion boarding during the Iron Sky Breach aboard the Vigilance. Faced operatives of a militarised supernatural organisation on a moving airship.",session:"The Vigilance Arc"},{category:"discovery",amount:1300,label:"Oracle's Deck — Card IX Recognition",description:"Was depicted on Card IX of the Oracle's Tarot Deck as 'The Maze Walker.' The Oracle — or whatever force controls the deck — chose Hjumpik to represent navigating the Maze of Time. The deck proved it has been watching all of them across all dimensions.",session:"Deep Mirror"},{category:"discovery",amount:750,label:"Deep Mirror — Clockwork Architecture Analysis",description:"Analysed the impossible architecture of the Deep Mirror dimension, contributing to the party's understanding of how the three planar fragments relate to each other and how travel between them might be achieved.",session:"Deep Mirror"},{category:"discovery",amount:500,label:"Planar Fracture — Cause Assessment",description:"Gathered intelligence about the nature of the Planar Fracture — the Oracle's ritual failure, the unstable magical contributions that caused the collapse, and the dimensional consequences that scattered the party across three hostile planes.",session:"Post-Fracture"},{category:"survival",amount:1200,label:"Maze of Time — Temporal Hazard Survival",description:"Survived the time-decay effects of the Maze of Time. A dimension where time consumes itself poses unique survival challenges: decisions made in the wrong temporal sequence can trap or destroy the unwary. Hjumpik navigated it. Hence: The Maze Walker.",session:"Deep Mirror"},{category:"survival",amount:700,label:"Deep Mirror — Reality Consumption Resistance",description:"Survived extended exposure to the Deep Mirror's reality-consuming properties. The weeping flesh-things in lava lamp containers. The clockwork voids. The impossible geometry. Hjumpik came out the other side functional.",session:"Deep Mirror"},{category:"survival",amount:500,label:"Post-Fracture Separation",description:"Survived being scattered by the Planar Fracture into an unknown fragment without the rest of the party, then navigated back to contact with allies. The Fracture scattered everyone. Not everyone found their way back.",session:"Post-Fracture"},{category:"roleplay",amount:900,label:"Party Cohesion — Keeping Disaster Inc. Together",description:"Contributed significantly to party morale and cohesion across multiple high-stress events. When a party contains Archie Miser, Bowser, and whatever Waluigi is, keeping everyone pointed in the same direction is itself a significant achievement.",session:"Ongoing"},{category:"roleplay",amount:600,label:"Deep Mirror — Witness to Abominations",description:"Processed and maintained operational effectiveness after witnessing the Deep Mirror's abomination vats — weeping flesh-things in lava lamp containers, horrific biological experiments in a collapsing dimension. Kept moving. Kept thinking.",session:"Deep Mirror"},{category:"faction",amount:800,label:"Disaster Inc. — Full Member",description:"Established as a full member of Disaster Inc., the most chaotic and statistically improbable adventuring group in the Midlands. Survived the Planar Fracture, the Shadowfell, the Feywild, and Archie Miser, which is its own category of achievement.",session:"Ongoing"},{category:"faction",amount:500,label:"Oracle Collaboration",description:"Participated in the Oracle's ritual and survived the consequences of its failure. Now exists in a world fundamentally altered by the ritual's collapse. Carries the survivor's knowledge of what the Oracle intended and what went wrong.",session:"The Ritual"},{category:"divine",amount:700,label:"Oracle's Deck — Temporal Blessing",description:"The Oracle's Deck depicted Hjumpik navigating the Maze of Time on Card IX. Whether this constitutes divine recognition, prophetic acknowledgment, or just the Oracle's characteristic tendency to watch everyone from a distance — the deck sees Hjumpik. The deck remembers.",session:"Deep Mirror"},{category:"divine",amount:458,label:"Maze of Time — Temporal Attunement",description:"Surviving the Maze of Time appears to leave a mark on those who pass through it. Hjumpik's attunement to temporal fracture zones may provide advantages in further planar navigation — or may simply mean the Maze of Time now recognises him, which is not necessarily a comfortable thing.",session:"Deep Mirror"}]},{id:"markop",name:"Markop",title:"The Titan of the Grove",subtitle:"Centaur of Unwavering Faith",level:7,currentXP:26219,nextLevelXP:34e3,prevLevelXP:23e3,icon:"🪓",colorTheme:{primary:"from-emerald-600 to-teal-700",secondary:"from-emerald-950 to-teal-950",accent:"emerald-400",glow:"shadow-emerald-900/60",bar:"from-emerald-500 to-teal-600",badge:"bg-emerald-900/60 border-emerald-700/50 text-emerald-300",border:"border-emerald-800/40",text:"text-emerald-300"},quote:"Card VIII: The Titan of the Grove — depicted wrestling the Arachnid Matriarch at colossal scale. This is the most accurate tarot card Waluigi has ever encountered.",xpEntries:[{category:"combat",amount:2800,label:"Spider Grove — Titan Grapple vs. Arachnid Matriarch",description:"Accepted the Oracle's blessing and grew to colossal size. Wrestled a building-sized spider in a titan grapple among the trees, using four-legged centaur stability to control the Matriarch's movement and position the final shove into the Oracle's banishment circle. Waluigi ran between his titan-scale legs firing arcane rays at spider joints. This is the most terrifying and awesome combat experience in Waluigi's career.",session:"Spider Grove"},{category:"combat",amount:1800,label:"Vivian Corridor Fight — Death Beam Survived",description:"Woke from unconsciousness mid-drag, barricaded a door against an axe-wielding succession claimant, reared in a too-small maintenance room, deflected blinding smoke, took a crimson disintegration beam through failing armour, prayed, received a divine shield, held. Then scattered Vivian's spell components to prevent a repeat. Every element of this was tactically excellent.",session:"Shadow Estate"},{category:"combat",amount:1400,label:"Shadow Estate Ballroom — Undead Dancers",description:"Charged through boneless, contorted undead dancers using centaur body momentum. Used divine smite. Coordinated Bowser, the Toads, and available party members. Called tactical instructions while fighting. Healed unconscious Toadburt through divine power. Bashed locked doors open with hooves.",session:"Shadow Estate"},{category:"combat",amount:900,label:"Mazebound Skirmish — Hedge Maze Ambush",description:"Was seized and dragged through hedges by singing grey-skinned Mazebounds. His centaur body does not fit through passages designed for humanoid creatures. He was dragged anyway. He fought back. He survived. He found Archie's scattered artifacts while being attacked from multiple directions simultaneously.",session:"Shadow Estate"},{category:"combat",amount:700,label:"Iron Sky Breach — Vigilance Defence",description:"Defended the Vigilance during the Iron Legion boarding action. Engaged Iron Legion operatives while coordinating party positioning on a moving airship. Contributed to repelling an assault by a militarised supernatural organisation.",session:"The Vigilance Arc"},{category:"survival",amount:1500,label:"Death Beam — Whispered Prayer",description:"Survived a crimson disintegration death ray through whispered prayer while his armour buckled and failed. Not a planned invocation. Not a rehearsed phrase. A whispered prayer from the space between impact and annihilation, when the conscious mind has already accepted death. His god answered.",session:"Shadow Estate"},{category:"survival",amount:900,label:"Unconscious Drag — Bowser's Rescue",description:"Was knocked unconscious and dragged across stone corridors by Bowser who grabbed whatever he could reach and pulled. Woke mid-drag. Immediately assessed situation. Immediately began barricading the door. Zero recovery time between 'being dragged unconscious through stone hallways' and 'operational combat effectiveness.'",session:"Shadow Estate"},{category:"survival",amount:600,label:"Deep Mirror — Abomination Vat Ward Analysis",description:"Correctly identified abjuration wards on abomination vats as containment measures built to keep monsters IN, not intruders out. Analytical clarity in a collapsing dimension, surrounded by weeping flesh-things in lava lamp containers. The mind did not stop working.",session:"Deep Mirror"},{category:"divine",amount:1600,label:"Divine Shield — Against Disintegration",description:"Divine shield manifested against Vivian's crimson death beam at the moment of near-annihilation. Golden light against crimson destruction. His hooves found purchase. He held. Waluigi has seen many divine invocations. None were delivered as a whisper while a death beam consumed the speaker's armour. That is not performance. That is faith.",session:"Shadow Estate"},{category:"divine",amount:900,label:"Toadburt Revival — Divine Healing",description:"Revived an unconscious Toadburt through divine power during the ballroom fight. Toadburt was down. Markop was fighting undead dancers. The healing happened anyway because Markop's priorities are clear even under maximum pressure.",session:"Shadow Estate"},{category:"divine",amount:600,label:"Oracle's Blessing — Titan Enlargement",description:"Accepted the Oracle's blessing during the Spider Grove battle, achieving colossal size sufficient to match the Arachnid Matriarch scale-for-scale. The Oracle chose Markop for the titan role. The Oracle was correct.",session:"Spider Grove"},{category:"discovery",amount:900,label:"Archie's Scattered Artifacts — Third Eye Circlet",description:"Found the Third Eye Circlet in the Shadow Estate maze — inscribed with Archie's handwriting: 'The eye sees across — the band keeps me from falling in.' Also recovered the component pouch and cracked Wahbook tablet. Each discovery confirmed Archie had passed through before them.",session:"Shadow Estate"},{category:"discovery",amount:600,label:"War Mage's Staff — Claimed for Archie",description:"Claimed the War Mage's Staff on Archie's behalf during the Spider Grove battle. Strategic foresight: securing enhanced fire capability for the party's primary combat caster, even when that caster is currently trapped in the Shadowfell.",session:"Spider Grove"},{category:"discovery",amount:450,label:"Vivian — Identity Interrogation",description:"Interrogated Vivian after their capture. Professional interrogation: noted contradictions, maintained composure despite having nearly been killed by the person being questioned. Extracted critical intelligence about Corvinarus succession politics and Vivian's nature as an impostor.",session:"Shadow Estate"},{category:"roleplay",amount:1100,label:"Bowser — The Unsent Letter",description:"When Bowser dropped a crumpled letter to Princess Peach — a surprisingly tender document trying to explain his presence at Raventree Manor — Markop picked it up, read it, and returned it. 'Are you actually sorry?' Bowser cried. 'It's okay, man. Let's just find your friends.' A horse-headed centaur comforting a crying turtle-dragon king. Waluigi's chest does something he refuses to call feelings.",session:"Shadow Estate"},{category:"roleplay",amount:700,label:"Dan (Parallel) — Direct Assessment",description:"'Are you the real Dan?' Parallel Dan admitted he was the parallel version. Markop accepted this, assessed it, and moved forward without wasting time on problems he couldn't solve immediately. This is the single most efficient response to encountering your ally's dimensional duplicate.",session:"Shadow Estate"},{category:"roleplay",amount:500,label:"Remi — Protective Leadership",description:"'So you drank a random potion because a guy said you were dead?' / 'I needed some brightness.' / 'Now that I can see you too are alive, well... that's awkward.' Protective without being patronising. Exasperated without being dismissive. Effective leadership.",session:"Shadow Estate"},{category:"faction",amount:800,label:"Disaster Inc. — Operational Leader",description:"Quietly became the operational leader of the Shadow Estate party. Not through charisma or political maneuvering — through reliability. When things go wrong, people look to the centaur. The centaur does not let them down.",session:"Ongoing"},{category:"faction",amount:500,label:"Bowser Alliance — Tactical Partnership",description:"Established functional tactical partnership with Bowser, King of the Koopa Troop. Bowser follows Markop's suggestions not because he recognises authority but because the suggestions are good. This is the highest form of respect Bowser offers.",session:"Shadow Estate"}]},{id:"bowser",name:"Bowser",title:"King of the Koopa Troop",subtitle:"The Reliable Catastrophe",level:6,currentXP:20582,nextLevelXP:23e3,prevLevelXP:14e3,icon:"🐢",colorTheme:{primary:"from-yellow-500 to-amber-600",secondary:"from-yellow-950 to-amber-950",accent:"yellow-400",glow:"shadow-yellow-900/60",bar:"from-yellow-500 to-amber-500",badge:"bg-yellow-900/60 border-yellow-700/50 text-yellow-300",border:"border-yellow-800/40",text:"text-yellow-300"},quote:"Bowser is not the most skilled fighter in Disaster Inc. Bowser is the most INDESTRUCTIBLE. Also he found a necromancer's wand and asked if it was a magic wand. WAH.",xpEntries:[{category:"combat",amount:2200,label:"Orangus Cornelius — Window Tackle & Bat Bite",description:"When Cornelius threatened to turn Bowser's shell into a soup bowl, diplomacy ended. Bowser tackled Cornelius through a dining room gothic window into the courtyard. When Cornelius revealed giant bat form, Bowser BIT THE BAT'S WING. This requires an immune system confidence that Waluigi does not possess and does not want to possess.",session:"Shadow Estate"},{category:"combat",amount:1600,label:"Statue Breach — Shadow Anchor Exposed",description:"Threw Orangus Cornelius INTO a shattered statue, breaking it open to expose the Shadow Anchor inside. Without Bowser's raw physical force, the Anchor might never have been exposed for Green T to shoot. Bowser solved this problem the way Bowser solves all problems: by throwing the vampire at a different problem.",session:"Shadow Estate"},{category:"combat",amount:1200,label:"Vivian — Head Punch & Door Hold",description:"Held a maintenance room door against Vivian's axe with full body weight, claws gouging the frame. When the door breached, struck Vivian across the skull — a blow that staggered the death-magic-wielding succession claimant. Then found a necromancer's wand on the floor and asked 'Is this a magic wand?'",session:"Shadow Estate"},{category:"combat",amount:900,label:"Ballroom Undead — Direct Engagement",description:"Charged through undead dancers and assorted shadow horrors in the ballroom. Bowser's approach to all combat threats is identical: see threat, hit threat, repeat. This approach works with remarkable consistency regardless of whether the threat is undead, vampiric, or a giant spider.",session:"Shadow Estate"},{category:"combat",amount:700,label:"Vigilance — Tea Party & Syndicate Brawl",description:"Participated in the Tea Party Incident and Syndicate Showdown aboard the Vigilance. Bowser in an enclosed space with enemies is essentially a living siege engine. The Syndicate was destroyed partly because the Syndicate tried to fight Bowser.",session:"The Vigilance Arc"},{category:"survival",amount:1800,label:"Shadowfell Indefinite — Vampire Dinner Survival",description:"Was cast into the Shadowfell during the Planar Fracture and survived. Attended a vampire lord dinner party. Ate raw dripping meat in one bite because Bowser has the palate of a garbage disposal. Was threatened with shell-into-soup-bowl conversion. Refused to be intimidated by beings who have been terrifying people for centuries.",session:"Shadow Estate"},{category:"survival",amount:900,label:"Death Dimension Adaptation",description:"Adapted to the Shadowfell's hostile planar physics with characteristic Bowser methodology: ignore the existential horror, focus on immediate threats, punch things that need punching. The Shadowfell did not meaningfully diminish Bowser. The Shadowfell had to deal with Bowser instead.",session:"Shadowfell Wandering"},{category:"roleplay",amount:1400,label:"The Unsent Letter — Peach",description:"Carried a crumpled, surprisingly tender letter to Princess Peach explaining his presence at Raventree Manor. Dropped it. Markop found it and read it. 'Are you actually sorry?' Bowser cried. Bowser — the great villain, the kidnapper of princesses — wept in front of a horse-headed centaur in a death dimension over an unsent love letter to a woman who may be dead. Waluigi refuses to call this feelings.",session:"Shadow Estate"},{category:"roleplay",amount:800,label:"Candle-Man — Archie's Shadow Companion",description:"Served as Archie's companion throughout the Shadowfell, providing commentary and irreverent support. When Archie's fire failed entirely: 'Looks like you're out of fuel, candle-man.' Waluigi loves this nickname more than almost any other thing documented in this encyclopedia.",session:"Shadowfell Wandering"},{category:"roleplay",amount:500,label:"Alliance Adaptation — Working WITH Heroes",description:"Adapted to an alliance with Disaster Inc. with surprising grace. Old rivalries became irrelevant when everyone was trapped in a death dimension together. Bowser chose survival and cooperation over traditional villainy. This is character growth, even if Bowser would never call it that.",session:"Ongoing"},{category:"discovery",amount:1100,label:"Necromancer's Wand — 'Is This a Magic Wand?'",description:"Found a death-aspected necromancer's wand on the floor after the Vivian fight. Picked it up. Turned it over with the innocent curiosity of a child finding something interesting on the ground. Asked 'Ooooh. Is this a magic wand?' Waluigi suspects the wand is more confused by Bowser than Bowser is by the wand.",session:"Shadow Estate"},{category:"discovery",amount:700,label:"Shadow Anchor Location — Statue Interior",description:"Directly contributed to the discovery of the Shadow Anchor's location by throwing Cornelius into the statue that concealed it. Whether this was deliberate strategy or Bowser simply throwing a vampire at the nearest solid object is unclear. The anchor was found regardless.",session:"Shadow Estate"},{category:"faction",amount:900,label:"Disaster Inc. — De Facto Member",description:"Became a de facto member of Disaster Inc. through shared crisis survival. Bowser is traditionally an antagonist. The Planar Fracture threw normal alignments into chaos and created an alliance that should not exist. It functions anyway.",session:"Ongoing"},{category:"faction",amount:500,label:"Koopa Troop — Separated King",description:"Maintains identity and authority as King of the Koopa Troop while separated from his kingdom, his army, and everything that defines his power base. Bowser separated from his Troop is still Bowser. This is not nothing.",session:"Ongoing"},{category:"tragedy",amount:600,label:"Peach — The Absent Princess",description:"Carries grief for Princess Peach — the woman he has pursued, kidnapped, and apparently genuinely loved — who is now dead or missing in the chaos of the planar crisis. The letter existed. The tears were real. Bowser feels things he does not have the vocabulary for.",session:"Ongoing"},{category:"tragedy",amount:420,label:"Kingdom Lost — Dimensional Exile",description:"Was cast into the Shadowfell during the Planar Fracture, separating him from his kingdom at a moment of maximum crisis. The Koopa Troop is leaderless. The Mushroom Kingdom's political situation has destabilised. Bowser cannot help from a death dimension.",session:"Post-Fracture"}]},{id:"remi",name:"Remi",title:"The Master Looter",subtitle:"FNG No More — Card Bearer",level:6,currentXP:18418,nextLevelXP:23e3,prevLevelXP:14e3,icon:"🃏",colorTheme:{primary:"from-pink-600 to-rose-700",secondary:"from-pink-950 to-rose-950",accent:"pink-400",glow:"shadow-pink-900/60",bar:"from-pink-500 to-rose-600",badge:"bg-pink-900/60 border-pink-700/50 text-pink-300",border:"border-pink-800/40",text:"text-pink-300"},quote:"Being quiet and unassuming is a superpower. Remi gathered intelligence the way Wario gathers coins: quietly, thoroughly, and without asking permission. Waluigi approves.",xpEntries:[{category:"heist",amount:2200,label:"Kryn Corvinarus Master Bedroom — The Ultimate Heist",description:"Using casually-acquired keys, bypassed guards and entered Kryn Corvinarus's master bedroom. Checked the medicine cabinet. Stole Hemoglue of the Nightlord (crimson clotting paste) and Leadfang Extractor (bullet wound poultice). Rolled back a rug to discover an incomplete ancient teleportation circle in chalk. While everyone else was fighting giant bats.",session:"Shadow Estate"},{category:"heist",amount:1400,label:"Ryan's Diary — Guest Room Intelligence",description:"Found Ryan's diary in a guest room. Entries confirmed Ryan survived the Vigilance jump, ended up in the Shadowfell, and observed Archie and Bowser before disappearing again. Critical intelligence about a missing party member, obtained through quiet snooping while the vampire fight was happening elsewhere.",session:"Shadow Estate"},{category:"heist",amount:900,label:"Guard Bypass — Key Acquisition",description:"Acquired the master bedroom keys through unspecified means without alerting the guards. The method is unclear. The result is documented. Remi does not explain her heist methodology and Waluigi is not certain he wants to know.",session:"Shadow Estate"},{category:"heist",amount:600,label:"Spider Grove — Combat Looting",description:"Maintained awareness of valuable items during the chaos of the Spider Grove battle. Contributed to post-combat resource management and ensured that strategic items were secured rather than lost to battlefield disorder.",session:"Spider Grove"},{category:"discovery",amount:2e3,label:"Oracle's Deck — Three Cards Drawn",description:"Received 'The Oracle's Deck' from Mystic Morel and drew three cards: The Maze Walker (IX) — Hjumpik navigating the Maze of Time. The Titan of the Grove (VIII) — Markop wrestling the Arachnid Matriarch. The Delicate Host (III) — Lady Aurelian Corvinarus in the Feywild. The cards are Past, Present, Future. The Oracle has been watching all of them across all dimensions. Remi now holds the script.",session:"Shadow Estate"},{category:"discovery",amount:1100,label:"Teleportation Circle — Chalk Under the Rug",description:"Discovered an incomplete ancient teleportation circle hidden under a rug in Kryn Corvinarus's bedroom. Incomplete means unused — but circles can be completed. The strategic implications of a vampire lord's private escape portal are significant.",session:"Shadow Estate"},{category:"discovery",amount:700,label:"Necromancer's Wand — Confirmed Death-Aspected",description:"Confirmed that the wand Bowser found was indeed a necromancer's focus, cold to the touch and death-aspected. This is the kind of intelligence that prevents people from casually waving death artifacts around. Bowser was already casually waving it around, but at least now the party knows what it does.",session:"Shadow Estate"},{category:"discovery",amount:500,label:"Hemoglue & Leadfang — Medical Intelligence",description:"Identified and secured two specialised medical items from Corvinarus's medicine cabinet. Knowledge that a vampire lord keeps bullet wound treatment on hand suggests the Purple Legion's conflicts involve firearms — intelligence about enemy capabilities extracted from a bathroom cabinet.",session:"Shadow Estate"},{category:"survival",amount:1200,label:"Spider Swarm Survival — Shadow Estate Grounds",description:"Survived the spider swarms throughout the Shadow Estate encounter. Maintained operational effectiveness and continued information gathering even while arachnid threats were active. Remi does not stop snooping because spiders are present.",session:"Shadow Estate"},{category:"survival",amount:800,label:"Vampire Guard Evasion — Sustained",description:"Evaded vampire guards across multiple Shadow Estate locations while conducting the heist operation. Sustained evasion while carrying stolen property in a building full of beings with supernatural senses requires skill that most people underestimate in quiet individuals.",session:"Shadow Estate"},{category:"survival",amount:600,label:"Separation from Party — Independent Survival",description:"Was separated from the main group during the Shadow Estate events and did not panic. Assessed the situation. Used the separation productively by snooping through a vampire lord's private quarters. This is the correct response to being separated in hostile territory.",session:"Shadow Estate"},{category:"survival",amount:400,label:"Glowing Potion — Unknown Substance Consumed",description:"Drank an unknown potion because 'I needed some brightness.' It made her glow. She survived. Markop was exasperated. Remi was lit from within. Sometimes the survival decision is aesthetically motivated. It still counts as survival.",session:"Shadow Estate"},{category:"roleplay",amount:1e3,label:"Oracle's Deck Custodianship",description:"Accepted responsibility for the Oracle's Deck — a set of tarot cards that predict the future and prove the Oracle has been watching across dimensions. Remi now carries the script to the universe. This is not a small thing to carry quietly.",session:"Shadow Estate"},{category:"roleplay",amount:700,label:"Mystic Morel Encounter — Musical Fortune",description:"Received a prophetic musical performance from Mystic Morel, a purple Toad fortune teller who speaks in rhyming prophecies. Maintained composure during an encounter that combined prophecy, card magic, and the presence of a singing Toad. Filed the intelligence appropriately.",session:"Shadow Estate"},{category:"roleplay",amount:500,label:"FNG to Full Member — Character Arc",description:"Evolved from 'the FNG' to the party's most effective infiltrator and intelligence gatherer. The quiet one became the one holding the Oracle's cards, the vampire lord's stolen medicine, and the knowledge of a hidden teleportation circle. Do not underestimate Remi.",session:"Ongoing"},{category:"combat",amount:900,label:"Spider Grove — Direct Engagement",description:"Participated in the Spider Grove battle, engaging spider threats directly while Markop grew to titan size. Maintained combat effectiveness across a multi-front engagement involving giant spiders, oracle magic, and at least one titan-scale centaur wrestling match.",session:"Spider Grove"},{category:"combat",amount:600,label:"Shadow Estate — Undead & Guard Engagement",description:"Engaged undead threats and vampire guards throughout the Shadow Estate encounter when evasion was not viable. Remi's combat style prioritises avoidance, but when pressed, engages effectively enough to have survived consistently.",session:"Shadow Estate"},{category:"exploration",amount:700,label:"Shadow Estate — Full Interior Mapping",description:"Explored the Shadow Estate's interior more thoroughly than any other party member, gaining access to private quarters, guest rooms, and restricted areas through a combination of acquired keys, stealth, and the assumption that quiet people belong wherever they are.",session:"Shadow Estate"},{category:"faction",amount:600,label:"Disaster Inc. — Intelligence Specialist",description:"Established role as Disaster Inc.'s primary intelligence gatherer. In a party that includes a pyromaniac, a titan centaur, and Bowser, someone needs to be gathering information quietly. Remi is that someone. The party functions better because Remi doesn't need to be noticed to be effective.",session:"Ongoing"}]}];function ug(A){return A.xpEntries.reduce((H,O)=>H+O.amount,
