<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Holy Midlands Diet</title>
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    
    <!-- System Specific Styles --> 
    <link rel="stylesheet" href="regal-parliament.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        
        <!-- Main App Wrapper (Targeted by JS for panel interactions) -->
        <div id="app">


            <main id="main-content">
                <!-- Header -->
                <div class="directory-header">
                    <h2 class="page-title">Legislative Database</h2>
                    <p class="page-subtitle">Holy Midlands Diet: Session Records, Vote Tally, and Representative Directory.</p>
                </div>

                <!-- Main Visualization Container -->
                <!-- The JS listeners attach to .unique-system-container -->
                <div id="view-container" class="unique-system-container">
                    <!-- JavaScript will inject the Diet System here -->
                    <div class="loading-state">
                        <span class="blink">_INITIALIZING LEGISLATIVE PROTOCOLS...</span>
                    </div>
                </div>
            </main>

            <!-- Slide-out Detail Panel (Targeted by JS) -->
            <div id="detail-panel" class="side-panel">
                <button id="detail-panel-close" class="panel-close-btn">✕</button>
                <div id="detail-panel-content">
                    <!-- Dynamic Representative Content Goes Here -->
                </div>
            </div>

        </div> <!-- End #app -->
    </div> 

    <!-- Floating Tooltip (Targeted by JS) -->
    <div id="parliament-tooltip" class="system-tooltip"></div>

    <!-- Navigation Script -->
    <!-- This runs the sidebar logic provided -->
    <script type="module" src="navigation.js"></script>

    <!-- Initialization Script -->
    <script type="module">
        // Import the logic from your file
        import { renderHolyMidlandsDiet, initHolyMidlandsDietListeners } from './systems/regal-empire-system.js';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('view-container');
            
            if (container) {
                console.log('Rendering Holy Midlands Diet...');
                
                // 1. Render the HTML string into the container
                container.innerHTML = renderHolyMidlandsDiet();
                
                // 2. Initialize the Event Listeners (Tooltip, Click handlers)
                // We wrap this in a slight timeout to ensure DOM is ready, 
                // though usually synchronous execution after innerHTML is fine.
                setTimeout(() => {
                    initHolyMidlandsDietListeners();
                }, 0);
            } else {
                console.error('View container not found');
            }
        });
    </script>
    <script defer src="wario-site-sounds.js"></script>
</body>
</html>
