<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Faction Directory</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="directory.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            
            <main id="main-content">
                <!-- Header -->
                <div class="directory-header">
                    <h2 class="page-title">Faction Relations Database</h2>
                    <p class="page-subtitle">Party standings, faction assessments, and intelligence reports across all known organizations.</p>
                </div>

                <!-- Party Stats Bar -->
                <div id="party-stats-bar" class="party-stats-bar">
                    <!-- Injected by JS -->
                </div>

                <!-- View Controls -->
                <div class="directory-controls">
                    <div class="view-mode-tabs">
                        <button class="view-mode-btn active" data-view="grid">
                            <span>📊</span> Faction Grid
                        </button>
                        <button class="view-mode-btn" data-view="player">
                            <span>👤</span> Player View
                        </button>
                        <button class="view-mode-btn" data-view="standings">
                            <span>📈</span> Standings Matrix
                        </button>
                        <button class="view-mode-btn" data-view="intel">
                            <span>🔍</span> Intel Report
                        </button>
                    </div>
                    
                    <div class="directory-filters">
                        <div class="filter-group">
                            <label>Region:</label>
                            <select id="region-filter" class="filter-select">
                                <option value="all">All Regions</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Standing:</label>
                            <select id="standing-filter" class="filter-select">
                                <option value="all">All Standings</option>
                                <option value="friendly">Friendly (50+)</option>
                                <option value="neutral">Neutral (-50 to 50)</option>
                                <option value="hostile">Hostile (-50-)</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Sort:</label>
                            <select id="sort-filter" class="filter-select">
                                <option value="reputation">Party Reputation</option>
                                <option value="name">Name</option>
                                <option value="intel">Intel Level</option>
                                <option value="notoriety">Notoriety</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <input type="text" id="search-filter" class="filter-search" placeholder="🔍 Search factions...">
                        </div>
                    </div>
                </div>

                <!-- Main Layout -->
                <div id="directory-layout">
                    <!-- Sidebar -->
                   <aside id="directory-sidebar">
    <!-- Party Members --> 
    <div class="sidebar-section" id="party-panel">
        <h4>🎭 Active Party</h4>
        <div id="party-member-list"></div>
    </div>

    <!-- NEW: Notable Figures -->
    <div class="sidebar-section" id="notable-figures-panel">
        <h4>👥 Notable Figures</h4>
        <p class="sidebar-hint">Click to view their perspective</p>
        <div id="notable-figures-list"></div>
    </div>

    <!-- Standing Summary -->
    <div class="sidebar-section" id="standing-summary">
        <h4>📊 Standing Summary</h4>
        <div id="standing-summary-content"></div>
    </div>

    <!-- Recent Events -->
    <div class="sidebar-section" id="recent-events">
        <h4>📜 Recent Events</h4>
        <div id="recent-events-list"></div>
    </div>
</aside>

                    <!-- Main Content -->
                    <div id="view-container">
                        <!-- Content injected here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Faction Detail Modal -->
    <div id="faction-detail-modal" class="faction-modal-overlay">
        <div class="faction-modal">
            <button class="modal-close" id="modal-close-btn">✕</button>
            <div id="faction-modal-content">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="directory-system.js"></script>
</body>
</html>
