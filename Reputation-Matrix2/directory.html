<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faction Directory</title>
    
    <!-- Your existing CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- NEW: Add the Diet System CSS -->
    <link rel="stylesheet" href="css/regal-empire-diet.css">
</head>
<body>

    <!-- Main Content Area -->
    <div id="app">
        <!-- Your navigation, sidebar, etc goes here -->
        
        <div id="main-content">
            <div id="view-container"></div>
        </div>
    </div>

    <!-- FACTION DETAIL MODAL (Existing) -->
    <div id="faction-detail-modal" class="faction-modal-overlay">
        <div class="faction-modal">
            <button class="modal-close" id="modal-close-btn">✕</button>
            <div id="faction-modal-content" class="modal-content-scroll">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <!-- REQUIRED FOR DIET SYSTEM: Tooltip Container -->
    <div id="parliament-tooltip"></div>

    <!-- REQUIRED FOR DIET SYSTEM: Seat Detail Panel -->
    <div id="detail-panel" class="detail-panel">
        <div class="panel-header-wrapper">
            <h3>Representative Details</h3>
            <button id="detail-panel-close">✕</button>
        </div>
        <div id="detail-panel-content">
            <!-- Injected by regal-empire-system.js -->
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="directory-system.js"></script>

</body>
</html>
