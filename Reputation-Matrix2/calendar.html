
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Calendar</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="calendar.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 <div class="calendar-page-header">
                    <h2 class="page-title">Imperial Standard Calendar</h2>
                    <div class="calendar-controls">
                        <button id="today-btn" class="control-btn">Today</button>
                        <div class="nav-group">
                            <button id="prev-year" class="nav-arrow" title="Previous Year">&laquo;</button>
                            <button id="prev-month" class="nav-arrow" title="Previous Month">&lsaquo;</button>
                            <h3 id="current-date-display">Month Year</h3>
                            <button id="next-month" class="nav-arrow" title="Next Month">&rsaquo;</button>
                            <button id="next-year" class="nav-arrow" title="Next Year">&raquo;</button>
                        </div>
                    </div>
                 </div>

                 <div id="calendar-dashboard">
                    <div class="calendar-grid-container">
                        <div class="weekdays-header">
                            <div>Sol</div>
                            <div>Lun</div>
                            <div>Ter</div>
                            <div>Mer</div>
                            <div>Jov</div>
                            <div>Ven</div>
                            <div>Sat</div>
                        </div>
                        <div id="calendar-grid">
                            <!-- Days injected here -->
                        </div>
                    </div>

                    <aside id="calendar-sidebar">
                        <!-- Search Widget -->
                        <div class="info-card search-card">
                            <input type="text" id="calendar-search-input" placeholder="Search holidays, birthdays..." autocomplete="off">
                            <ul id="calendar-search-results" class="event-list" style="display:none; margin-top:10px; max-height: 150px; overflow-y: auto;"></ul>
                        </div>

                        <!-- Selected Day Details -->
                        <div id="day-detail-card" class="info-card">
                            <div class="card-header">
                                <h4 id="selected-date-header">Select a Day</h4>
                                <span id="selected-date-weather" class="weather-icon-large"></span>
                            </div>
                            <div id="selected-day-content">
                                <p class="placeholder-text">Click a day on the grid to view details, weather reports, and liturgy.</p>
                            </div>
                        </div>

                        <!-- Upcoming Events -->
                        <div class="info-card">
                            <h4 class="section-header">Upcoming Events</h4>
                            <ul id="upcoming-events-list" class="event-list">
                                <!-- Injected here -->
                            </ul>
                        </div>

                        <!-- Legend -->
                        <div class="info-card legend-card">
                            <h4 class="section-header">Legend</h4>
                            <div class="legend-grid">
                                <div class="legend-item"><span class="dot holiday"></span> Holiday</div>
                                <div class="legend-item"><span class="dot birthday"></span> Birthday</div>
                                <div class="legend-item"><span class="dot ritual"></span> Liturgy</div>
                                <div class="legend-item"><span class="dot tech"></span> Research</div>
                                <div class="legend-item"><span class="dot history"></span> History</div>
                                <div class="legend-item"><span class="dot battle"></span> Battle</div>
                                <div class="legend-item"><span class="dot rumor-start"></span> New Rumor</div>
                            </div>
                        </div>
                    </aside>
                 </div>
            </main>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="calendar.js"></script>
</body>
</html>
