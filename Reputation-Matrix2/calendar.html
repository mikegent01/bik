<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Calendar</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="calendar.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        
        <div id="app">
            
            
            <main id="main-content" class="calendar-main">
                
                <!-- News Ticker -->
                <div class="news-ticker-container">
                    <div class="ticker-label">📡 LIVE</div>
                    <div id="news-ticker" class="news-ticker"></div>
                </div>

                <!-- Header Controls -->
                <header class="calendar-header">
                    <div class="header-left">
                        <h1 class="calendar-title">Imperial Calendar</h1>
                        <div id="quick-stats" class="quick-stats"></div>
                    </div>
                    
                    <div class="header-center">
                        <nav class="nav-controls">
                            <button id="prev-year" class="nav-btn" title="Previous Year">
                                <span class="nav-icon">«</span>
                            </button>
                            <button id="prev-month" class="nav-btn" title="Previous Month">
                                <span class="nav-icon">‹</span>
                            </button>
                            <h2 id="current-date-display" class="date-display">Month Year</h2>
                            <button id="next-month" class="nav-btn" title="Next Month">
                                <span class="nav-icon">›</span>
                            </button>
                            <button id="next-year" class="nav-btn" title="Next Year">
                                <span class="nav-icon">»</span>
                            </button>
                        </nav>
                        <button id="today-btn" class="today-btn">
                            <span class="today-icon">📍</span> Today
                        </button>
                    </div>
                    
                    <div class="header-right">
                        <div class="search-container">
                            <input type="text" id="calendar-search" class="search-input" placeholder="Search events..." autocomplete="off">
                            <div id="search-results" class="search-results"></div>
                        </div>
                        <div id="filter-toggles" class="filter-toggles"></div>
                    </div>
                </header>

                <!-- Main Dashboard -->
                <div class="calendar-dashboard">
                    
                    <!-- Calendar Grid -->
                    <section class="calendar-grid-section">
                        <div class="weekdays-header">
                            <div class="weekday">Sol</div>
                            <div class="weekday">Lun</div>
                            <div class="weekday">Ter</div>
                            <div class="weekday">Mer</div>
                            <div class="weekday">Jov</div>
                            <div class="weekday">Ven</div>
                            <div class="weekday">Sat</div>
                        </div>
                        <div id="calendar-grid" class="calendar-grid"></div>
                        <div id="calendar-legend" class="calendar-legend"></div>
                    </section>

                    <!-- Sidebar -->
                    <aside class="calendar-sidebar">
                        
                        <!-- Selected Day Header -->
                        <div class="sidebar-header">
                            <div class="sidebar-date">
                                <h3 id="sidebar-date-header">Select a Day</h3>
                                <div id="sidebar-weather-icon" class="sidebar-weather"></div>
                            </div>
                        </div>

                        <!-- Tabs -->
                        <div id="sidebar-tabs" class="sidebar-tabs"></div>

                        <!-- Tab Content -->
                        <div id="sidebar-content" class="sidebar-content"></div>

                        <!-- Upcoming Events -->
                        <div class="upcoming-section">
                            <h4 class="section-title">
                                <span class="section-icon">📆</span>
                                Upcoming
                            </h4>
                            <div id="upcoming-list" class="upcoming-list"></div>
                        </div>

                    </aside>
                </div>

            </main>
        </div>
    </div>

    <!-- Day Preview Popup (injected by JS) -->
    
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="calendar.js"></script>
</body>
</html>
