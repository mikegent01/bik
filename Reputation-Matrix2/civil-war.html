<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Mushroom Succession Crisis</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="styles/civil-war.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            <!-- Sidebar will be populated by navigation.js -->
            
            
            <main id="main-content">
                <!-- The JS class CivilWarUI targets '.civil-war-page' to render the 
                     Header, Navigation Tabs, and Content Sections dynamically -->
                <div class="civil-war-page">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Initializing Strategic Analysis...</p>
                        <p class="text-muted small">Decrypting Succession Archives...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals (Structure required for JS manipulation) -->
    <!-- Note: Specific faction modals are generated dynamically by JS, 
         but having the base overlay structure here is good practice if needed by global scripts -->
    
    <!-- Scripts -->
    <script type="module" src="js/core/common.js"></script>
    <script type="module" src="js/core/navigation.js"></script>
    <script type="module" src="js/pages/civil-war.js"></script>
    <script defer src="js/pages/wario-site-sounds.js"></script>
    <script defer src="js/core/waluipedia-ambient.js"></script>
</body>
</html>
