
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Cultural Database</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="laws.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             
            <main id="main-content">
                 <h2 class="page-title">Cultural Spheres & Traditions</h2>
                 <p class="page-subtitle">An analysis of the dominant cultural blocs across the known worlds, linking population demographics (Pops) to the legal and social traditions they uphold.</p>
                 
                 <div class="culture-dashboard">
                    <div class="chart-panel">
                        <h3>Global Cultural Influence</h3>
                        <div class="canvas-wrapper">
                            <canvas id="culture-chart"></canvas>
                        </div>
                    </div>
                    <div class="stats-panel">
                        <h3>Dominant Values</h3>
                        <div id="cultural-stats-container">
                            <!-- Stats injected by JS -->
                        </div>
                    </div>
                 </div>

                 <div id="codex-container">
                    <!-- Culture cards will be injected here by JS -->
                 </div>
            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="laws.js"></script>
</body>
</html>
