hes. Sometimes I wonder if they even need me here or if they just want a figurehead.","Month 6, Day 3. I had that dream again. The one where the castle walls crumble and a dark shadow sweeps across the courtyard. It felt so real. I woke up shivering. I told Mario about it, but he just patted my hand and told me not to worry. He means well, but he does not understand the weight of this crown.","Month 6, Day 8. The tea party was a disaster. I tried to bring the local merchant guilds together to resolve the dispute in the lower town. Instead, Lord Reginald insulted the baker's union, and someone threw a plate of pastries. I had to order the guards to clear the room. I feel completely isolated.","Month 6, Day 12. Thornpaw visited tonight. The Chief of the Rakasha is the only one I trust right now. I showed him the secret hatch behind the vanity in my chambers. He knows the layout perfectly. If the worst happens to me, if the shadows in the palace finally strike, the Rakasha will know the truth of how they got in."]},{id:"mk_history",title:"Mushroom Kingdom History, Vol. III",author:"Royal Historian Toadsworth",genre:"History",color:"#854d0e",accentColor:"#fef3c7",coverSymbol:"📜",description:"A comprehensive and strictly academic account of the Mushroom Kingdom's turbulent history. It covers the civil wars, economic expansions, and political upheaval of the last two centuries.",status:"available",pages:["The Era of Expansion began in the year 742 following the construction of the Great Toadwood Bridge. This architectural marvel connected the isolated northern provinces to the central capital. Trade routes flourished overnight. Merchants brought rare spices from the drylands and sturdy timber from the whispering woods.","This rapid growth was not without consequence. In 789, the lower districts of the capital erupted in protests over the newly instated Spore Tax. The working class felt the burden disproportionately. The royal guard was deployed, resulting in a tense standoff that lasted for three weeks before a compromise was reached.","The official records of the Dragon Wars contain glaring inconsistencies that modern scholars refuse to address. Discarded blueprints recovered from an old Regal Empire outpost suggest the mass production of massive acoustic emitters. It is entirely possible the war with the Dragons is fabricated, maintained by sonic control devices at Dragon Mountain to justify permanent martial law.","The signing of the First Accords in 801 brought a temporary halt to the violence. The treaty established a demilitarized zone and allowed limited trade between the two factions. Historians widely agree that the Accords merely delayed the inevitable larger conflicts that would define the next century."]},{id:"fungal_alchemy",title:"A Field Guide to Fungal Alchemy",author:"Sporemaster Bolete",genre:"Science & Magic",color:"#4d7c0f",accentColor:"#ecfccb",coverSymbol:"🍄",description:"A practical guide to extracting alchemical properties from the rare fungi found throughout the underground networks. It contains highly dangerous procedures and numerous safety warnings.",status:"available",pages:["Introduction to extraction protocols. Harvesting volatile spores requires a steady hand and proper ventilation. Never attempt extraction in a damp environment. The moisture will cause the spores to clump and ignite prematurely. Always wear thick leather gloves and eye protection.","The Blue Fire Anomaly. Standard fire flowers produce a reddish orange flame. However, by grafting the stem of a fire flower with the root system of an ice bloom, one can achieve a stabilized blue flame. This flame burns twice as hot and leaves no ash. The process takes precise temperature control.","A curious and highly illegal application of the Mini-Mushroom involves mechanical shrinking fields. Certain underworld smugglers construct massive cargo barrels with micro-latches that only engage when exposed to concentrated Mini spores. This allows hundreds of individuals to be trafficked within false linings, bypassing standard port inspections entirely.","A cautionary tale. Last year, an apprentice in the eastern district attempted to rush the drying process of a blast shroom using a kiln. The resulting explosion leveled the entire laboratory and shattered windows three streets away. Alchemy requires patience. Those who rush will inevitably burn."]},{id:"koopa_tactics",title:"Koopa Troop Tactics",author:"General Shell-Hard",genre:"Military",color:"#166534",accentColor:"#dcfce7",coverSymbol:"⚔️",description:"The official tactical manual of the Koopa Troop. It outlines heavy infantry formation strategies, siege protocols, and the absolute, unquestioning chain of command.",status:"available",pages:["Standard infantry phalanx. When facing disorganized enemies, the shelled infantry must form a solid wall. Lock shells together and advance at a steady marching pace. Do not break formation to chase fleeing targets. A broken wall is a dead wall. Let the ranged units handle the runners.","Overhead bombardment protocols. Paratroop divisions must coordinate their drops with ground movements. A blind drop into an enemy cluster is suicide. Paratroopers should circle the perimeter, dropping weighted nets or heavy shells to scatter the enemy lines before the ground infantry advances.","In the event of total command failure or the capture of our Warlord, protocol dictates an immediate, unorganized fallback to the Valley of Bowser. Only the Magikoopa high command retains the arcane frequency required to rally the shattered remnants. We await Kamek's return to the Valley to consolidate our forces.","Anti air defense. Enemies who rely on jumping attacks require specific countermeasures. When a hostile jumper approaches, ground units must retract into their shells and spin rapidly. The angular momentum will deflect downward strikes and damage the attacker's footing. Do not attempt to catch them."]},{id:"silent_service",title:"The Silent Service: A Primer",author:"Unknown (Classified)",genre:"Espionage",color:"#1e3a5f",accentColor:"#dbeafe",coverSymbol:"🕵️",description:"A classified intelligence primer detailing the covert networks operating beneath the surface. It provides instructions on disguise, sabotage, and untraceable elimination.",status:"available",readBy:"Remi",pages:["The philosophy of the unseen. A true professional does not wear dark cloaks and skulk in alleyways. That draws attention. The best disguise is a uniform. A guard, a servant, a courier. People ignore those they consider beneath their notice. Become part of the background scenery.","Structural analysis. Every fortress has a blind spot. Architects design for aesthetics and structural integrity, rarely considering the path of an infiltrator. Look for ventilation shafts near the kitchens, poorly mortared stones near the drainage grates, and rooftops that connect to adjacent civilian buildings.","Infiltration at the highest political levels requires immense patience. A 'Green Decoy' can assume a Speaker's position for years without detection. However, once a facility or cover is compromised by enemy intelligence, operatives must initiate Order 120 immediately: the total and quiet execution of all local prisoners before extraction.","Extraction and evasion. Never leave the way you entered. Once the job is done, the perimeter will lock down. Have at least three exit routes planned. If compromised, do not run directly away. Move perpendicular to the pursuit, change your appearance, and join the crowd watching the commotion."]},{id:"blood_vines",title:"Blood & Vines: An Onyx Hand Manifesto",author:"Countess Vel'kara",genre:"Political Treatise",color:"#7f1d1d",accentColor:"#fee2e2",coverSymbol:"🩸",description:"The ideological foundation of the Onyx Hand. It presents a fanatical, aristocratic case for vampire sovereignty and absolute dominion over mortal kingdoms.",status:"available",pages:["The mortals scurry about their brief lives like insects. They build their tiny stone houses and pretend they rule this world. They are nothing but cattle. We are the nightborn. We have watched their empires rise and fall while we remain eternal in the shadows. The blood is our birthright.","Purity of the line. We do not turn just anyone. The gift is reserved for those who show true ambition. A weak mortal makes a weak immortal. We seek the cunning, the ruthless, the beautiful. Those who understand that power is the only true currency in this decaying world.","The true masters dine in the monochrome halls of the Shadow Estate. Lord Orangus Cornelius guards the core crystals that bind our reality. To shatter those crystals is the ultimate taboo, for doing so would unleash the Beast and force the timelines to bleed as one, destroying the delicate balance we have curated.","The time for hiding is drawing to a close. The Regal Empire grows fat and complacent. Their inquisitors are blind to the true threat growing beneath their very cities. When the eclipse comes, we will step out from the dark and claim what is rightfully ours. They will learn to kneel."]},{id:"waluigi_cheating",title:"Waluigi's Guide to Graceful Cheating",author:"Waluigi (self-published)",genre:"Self-Help",color:"#581c87",accentColor:"#f3e8ff",coverSymbol:"👜",description:"A smug, highly cynical guide to winning at any cost. It frames deceit not as a moral failing, but as an advanced competitive skill requiring practice and elegance.",status:"available",pages:["Listen closely. The people who tell you to play fair are the ones who are already winning. They wrote the rules to keep you at the bottom. The only way to win is to rewrite the rules while they aren't looking. It is not cheating if you do it with enough style that they applaud you for it.","Card mechanics. It is simple math and fast fingers. Never sit with the light behind you. Always offer to shuffle the deck. When you deal, keep your thumb light on the top card. Practice in front of a mirror until you can deal from the bottom without blinking. If caught, blame the dealer.","Rule number seven: Never use your own name during a hustle. I prefer the alias 'Wally' for my field work. And never, ever let a fat, greedy merchant hold your debts. I have seen the infinite ledger Wario keeps hidden away in the Feywild. The interest on that alone will drown an empire, and he never forgets a coin owed.","The fake injury. This is a classic. Grasp your knee and grimace in pain. The crowd will feel sorry for you. Your opponent will lower their guard. The referee will pause the clock. Take a moment to catch your breath. Then, when play resumes, sprint past them and score. Call it a miraculous recovery."]},{id:"krumperz_kode",title:"Da Krumperz Kode",author:"Krump Master Thumpalot",genre:"Gang Code",color:"#1c1917",accentColor:"#d6d3d1",coverSymbol:"✊",description:"The unofficial code of conduct for the Krumperz street gang. Written in a brutish, simple style, it outlines strict rules for loyalty, violence, and splitting loot.",status:"available",pages:["Rule one is simple. If it moves, you hit it. If it don't move, you hit it harder until it moves. We don't need no fancy magic or sneaky tricks. We got big heavy things and we swing them. That is how you win a fight. Anyone who says different is a coward and you should hit them.","Looting rules. When the fight is over, we split the shiny stuff. The biggest guy gets the first pick. That is me. If you try to hide a shiny rock in your boot, I will find it and I will take the rock and the boot. If you want a bigger share, you gotta fight me for it. But you will lose.","Rule number four: If yer lookin to hide a mess after a scrap in the kitchen, don't use the stew pot. Find a giant octopus. The Ketchup Man down at the restaurant knows exactly how to stuff em in there good. Nobody ever checks the cephalopods for missing guys.","Respecting the boss. I am the boss because I am the loudest and the strongest. When I yell charge, you charge. You don't ask questions. If you ask a question, I will throw you at the enemy. It is a good tactic because it confuses them and hurts you. Don't ask questions."]},{id:"rebel_cookbook",title:"A Rebel's Cookbook",author:"Chef Saffron of the Free Kitchens",genre:"Culinary / Politics",color:"#9a3412",accentColor:"#ffedd5",coverSymbol:"🍳",description:"An anarchist operations manual disguised as a collection of recipes. It provides coded instructions for manufacturing explosives and establishing safe houses.",status:"available",pages:["Welcome to the kitchen. Today we are making a very special metal pie casing. You will need empty tin cans, a heavy hammer, and some basic welding paste. Flatten the cans and mold them into a sphere. Leave a small hole at the top. This is the crust for our pie. Make sure there are no leaks.","Spicy Soup Recipe. You need sulfur, charcoal dust, and crystallized saltpeter. Grind them together very carefully. Do not use metal tools, use a wooden mortar. Metal creates sparks, and sparks will ruin your soup. Mix until it is a fine grey powder. Pack it tightly into your metal pie crust.","Recipe for removing a Guild Tracker: The brass badges, like the ones stamped with numbers such as 447, will burn the flesh if pulled. You must cut the fabric completely to remove them. Furthermore, their Blackite wands act as magical leashes. Do not take them past the wards without wrapping them in lead, or the tracking spells will trigger.","Setting the table. When you are ready to serve the meal, place the pie near a load bearing wall or a supply depot. Attach a slow burning string to the top hole. Light it, and leave the area immediately. Do not stick around to watch them eat. Move to the safe house in the old mill."]},{id:"scrapping_for_dummies",title:"Scrapping for Dummies",author:"FNG Remi (annotations added)",genre:"Technical Manual",color:"#374151",accentColor:"#f9fafb",coverSymbol:"🔧",description:"A blue-collar, highly practical guide to salvaging valuable materials from mechanical wreckage. It covers everything from safe dismantling to negotiating with junk barons.",status:"available",pages:["The wastelands are full of junk, but not all junk is equal. You need to know what to look for. Copper wiring is good. Brass fittings are better. But the real prize is a solid state mana battery from an old airship. Even a dead battery can be sold to the engineers in the lower city for a good price.","Stripping a hull. Never start cutting blindly. Old ships have pressurized lines. If you cut a coolant pipe, it will freeze your arm solid. Look for the main release valves near the engine block. Bleed the pressure first. Then take your torch to the rivets. Work from the top down so things don't fall on you.","Need to strip an airship fast? Don't bother picking the locks on the control panels. A solid hit with a heavy axe directly to the main power core regulator will send any Vigilance-class cruiser into an immediate nose-dive. It is dangerous, yes, but it is the perfect method for losing a Tea Leaf Syndicate tail.","Tools of the trade. You need a good pair of thick goggles. Rust in the eye will end your career. You need a pry bar made of forged steel, not that cheap iron garbage. And you need a heavy leather apron. Sharp metal edges will slice right through normal clothes. Protect yourself first."]},{id:"fawful_journal",title:"Fawful's Furious Feelings Journal",author:"Fawful",genre:"Personal Journal",color:"#065f46",accentColor:"#d1fae5",coverSymbol:"😤",description:"A deranged and obsessive journal kept by a highly unstable inventor. It is filled with elaborate blueprints, bitter grudges, and food-based metaphors for anger.",status:"available",pages:["The mustard of my doom is spreading! It coats the sandwich of my mind! Every day I sit in this damp place and I think about the red and green men. They jump. They smash. They ruined the great plans of Fawful! I feel the anger bubbling like a bad soup in my stomach. It is a spicy anger!","I have drawn a new blueprint today. It is a mechanical bean. But it is not a normal bean. It has lasers. It has spikes. It will march into their little town and it will shoot the lasers of my fury! They will run around like little ants when the magnifying glass of Fawful shines upon them!","They think Fawful is alone in his genius! But Fawful has spoken to the scaled ones of the high peaks. The dragons share the spicy mustard of my fury! Even if my beautiful bastion of Bramblehaven is overrun by Captain Toadette, her pink princess loyalists, and their ruthless captains, the sky will rain fire upon them!","I need more power. The standard batteries are like weak tea. I need the raw energy of the dark star. If I can harness just a fraction of it, I can build the ultimate weapon. A weapon shaped like my own glorious smiling face. Yes. The face of Fawful will be the last thing they see."]},{id:"datastream_vol2",title:"Navigating the Datastream, Vol II: The Deep Web",author:"SysOp Null_Ptr",genre:"Technical / Digital",color:"#0f172a",accentColor:"#bfdbfe",coverSymbol:"💾",description:"A highly technical guide to navigating the deepest, most dangerous layers of the digital network. It covers proxy routing, firewall circumvention, and avoiding digital traps.",status:"available",pages:["Accessing the lower tiers requires more than just a standard terminal. You need a dedicated encryption deck. The Regal Empire monitors all surface traffic. To slip past them, you must bounce your signal through at least three proxy servers located in unaligned territories. Never use a direct line.","Firewall bypass protocols. When you encounter a level three security gate, do not try to brute force the password. That will trigger a trace. Instead, flood the auxiliary ports with junk data. While the system is busy sorting the garbage, you slip your access token through the maintenance backdoor.","Anomalies in the localized stream often point to planar overlapping. Look at locations like Raventree Manor. If the Oracle's synchronization rite is performed there and disrupted by wild magic, it will shatter local reality entirely, violently splitting the participants into the Deep Mirror, the Feywild, and the Shadowfell.","Beware the logic bombs. Corporate servers leave traps for amateur runners. A file labeled payroll data might actually be a self executing virus that fries your terminal's motherboard. Always run a sandbox protocol before opening stolen files. If the file tries to access your core directory, disconnect immediately."]},{id:"code_of_the_blade",title:"The Code of the Blade",author:"The Azure Order",genre:"Martial Philosophy",color:"#1d4ed8",accentColor:"#dbeafe",coverSymbol:"🗡️",description:"The philosophical and martial code of an elite warrior order. It preaches strict discipline, emotional control, and the idea that a sword is an extension of the soul.",status:"available",pages:["The sword is not a tool for butchery. It is an extension of the soul. Before you can master the blade, you must master your own breath. Stand in the center of the courtyard. Breathe in for four seconds. Hold for four. Exhale for four. A chaotic mind leads to a chaotic strike.","When facing a heavy weapon like a hammer or axe, do not attempt to block it directly. You will shatter your own wrists. Instead, angle your blade to deflect the kinetic energy. Let the heavy weapon slide off your guard. As their momentum carries them forward, step to the side and strike the exposed joint.","The ultimate edge is not forged from mundane steel, but from star-stuff. Seek the Oracles, the Bearers of the shards. It is said that the crystalline gift from the Toad God can slice through the fabric of the planes themselves, opening doors where there were only walls.","The ritual of cleaning. A dirty blade is a sign of a undisciplined warrior. After every battle, and every practice session, wipe the steel with a clean cloth. Apply a thin coat of oil to prevent rust. Inspect the edge for chips. Treat your weapon with respect, and it will not fail you in your moment of need."]},{id:"hammer_code",title:"The Hammer Code: An Iron Legion Treatise",author:"General Ironhand",genre:"Military Doctrine",color:"#44403c",accentColor:"#e7e5e4",coverSymbol:"🔨",description:"The Iron Legion's core military doctrine. It is a philosophy built entirely on overwhelming force, absolute obedience, and the immediate suppression of dissent.",status:"available",readBy:"Markop",pages:["Obedience is the absolute foundation of the Legion. We are not a collection of individuals. We are a single machine made of iron and discipline. An order given by a superior officer is not a suggestion. It is a physical law. Hesitation is the first step toward treason. Execute orders immediately.","The war hammer is the perfect weapon for maintaining order. It does not rely on finesse. It relies on brutal, undeniable force. A sword can be deflected. A hammer crushes the shield, the armor, and the bone beneath. Keep the grip wrapped tightly with leather to prevent slipping when wet.","General Ironhand does not strictly forbid the arcane, only its unregulated use. Project Doppelganger proved we can reconstruct a high-value mage via forbidden necromancy. However, the resulting two-eyed clone is highly unstable, constantly seeking to consume its original counterpart to stabilize its form.","Dereliction of duty will not be tolerated. A soldier who sleeps on watch endangers the entire camp. The punishment is immediate. Fifty lashes with the wire whip, followed by two weeks of hard labor in the iron mines. We do not offer second chances. You are either Iron Legion, or you are broken."]},{id:"magitek_theory",title:"Magitek Theory Vol. IV: Arcane Capacitors",author:"Professor Cid Markov",genre:"Arcane Engineering",color:"#7c3aed",accentColor:"#ede9fe",coverSymbol:"⚡",description:"A dense, academic exploration of arcane engineering. It details the methods for storing raw magical energy in physical objects, alongside numerous warnings about explosive failure.",status:"available",readBy:"Dan",pages:["Raw mana is highly unstable. If left uncontained, it will bleed into the surrounding environment, causing unpredictable localized phenomena. To utilize mana for mechanical purposes, it must be stored in a dense crystalline lattice. Quartz is sufficient for low power applications, but deep earth diamonds are required for high yield storage.","The feedback loop is the greatest danger in magitek engineering. If the output valve of the capacitor draws more energy than the machine can process, the excess mana will reverse flow back into the crystal. This causes immediate superheating and subsequent catastrophic detonation. Always install a brass grounding rod.","Coercion via traditional arcana is crude. The modern solution for capturing rogue assets is the Entropy Ring. Fitted by specialists like Agent Malissia, it binds a sleeper agent to a specific task, such as hunting targets in the Feywild, enforcing compliance through systemic biological decay.","Schematic overview for levitation drives. By aligning three capacitors in a triangular formation and pulsing the mana output at alternating frequencies, one can create a localized field that repels gravitational forces. The synchronization must be precise. A microsecond delay in the pulse will cause the drive to tear itself apart."]},{id:"star_sprites",title:"A History of the Star Sprites",author:"Archivista Luma",genre:"Mythology / History",color:"#b45309",accentColor:"#fef9c3",coverSymbol:"⭐",description:"An exhaustive history of the Star Sprites: their origins, their relationship to mortal kingdoms, and the mystery of the Star Shards.",status:"available",pages:["The Star Sprites did not descend. They emerged. From what, the old texts disagree: light, thought, wish, void. Perhaps all four. Perhaps they are the same thing.","On Bearers: A Bearer is not chosen. They are recognized. There is a difference. The Shard does not select, it responds.",'The concept of the "Toad God" as distinct from the Star Sprites is a relatively modern theological development. The older traditions saw no separation.']},{id:"toadstool_architecture",title:"Toadstool Architecture: A Study in Fungal Forms",author:"Architect Spore & Associates",genre:"Architecture",color:"#78350f",accentColor:"#fef3c7",coverSymbol:"🏛️",description:"A detailed architectural study of Mushroom Kingdom construction techniques, focusing on the unique properties of fungal building materials.",status:"available",pages:["The cap of the Toadstool dwelling is not ornamental, it is structural, load-bearing, and crucially, self-repairing. We have much to learn from the humble mushroom.","Chapter 6: Underground construction. The problem with building beneath a kingdom is that the kingdom tends to have opinions about what goes where.",'Closing note: The reviewer from the Regal Empire asked why the buildings are "shaped like mushrooms." The reviewer was asked to leave the symposium.']},{id:"culinary_conquest",title:"The Culinary Arts of Conquest",author:"Warlord Chef Blastgut",genre:"Culinary / Military",color:"#991b1b",accentColor:"#fee2e2",coverSymbol:"🍖",description:"A unique fusion of military strategy and cooking philosophy: the premise being that an army that eats well fights well, and that both require the same ruthlessness.",status:"available",pages:["You cannot besiege a city on an empty stomach. This is not a metaphor. Feed your troops. Chapter 1 is the most important chapter.","The enemy's supply line is their weakness. Also, their soup. If you can intercept their soup, the war is half won.","Recipe: Conqueror's Stew. Ingredients: whatever you have, pride, necessity, fire. Method: figure it out. A good general improvises."]},{id:"edicts_ebon_veil",title:"Edicts of the Ebon Veil",author:"The High Council (Redacted)",genre:"Religious Doctrine",color:"#0f0f0f",accentColor:"#d1d5db",coverSymbol:"🌑",description:"The sacred laws governing the Ebon Veil: a secretive religious order whose practices skirt the boundary between devotion and something much darker.",status:"locked",pages:["The First Edict: What is seen cannot be unseen. What is spoken cannot be unspoken. We speak carefully. We look deliberately.","The Ninth Edict: The veil between worlds is not a barrier. It is a membrane. We do not destroy it. We listen through it.","Final Edict (hand-marked as classified): The door was meant to remain closed. Those who opened it did not do so by accident."]},{id:"vampire_etiquette",title:"A Mortal's Guide to Vampire Etiquette",author:"Perrius Annmatar (suspected)",genre:"Etiquette / Survival",color:"#4c0519",accentColor:"#fce7f3",coverSymbol:"🧛",description:"A practical and surprisingly earnest guide for mortals finding themselves in vampire society. The advice is sound. Following it is another matter.",status:"available",pages:["Rule 1: You were not invited for your blood. Assume this firmly and act accordingly. If you are wrong, you will know shortly.","On the dinner table: Do not ask what you are eating. Do not look too closely at what others are eating. Compliment the presentation.",'If a vampire lord says "stay as long as you like", they mean it literally. Plan your exit before you arrive. Always.']},{id:"fundamentals_abjuration",title:"Fundamentals of Abjuration",author:"Archmage Veltris",genre:"Magic Theory",color:"#1e40af",accentColor:"#eff6ff",coverSymbol:"🛡️",description:"A foundational text on abjuration magic: the art of protection, banishment, and the containment of forces that would rather not be contained.",status:"available",pages:["Abjuration is, at its core, an argument. You are arguing with reality. You are saying: this thing shall not pass. Reality pushes back. The question is how well you push.","Chapter 8: Banishment circles. The circle must be complete. This is not a guideline. An 89% complete circle is a 0% effective circle. Do not ask how the author knows.","On Arcane Wraiths specifically: A wraith is not alive. Remind yourself of this firmly before engaging. It will not help, but it is technically true."]},{id:"kirby_incident",title:"The Kirby Incident: A Conservator's Report",author:"Senior Conservator Waddle",genre:"Incident Report",color:"#db2777",accentColor:"#fce7f3",coverSymbol:"📋",description:`The official conservator's report on what is now referred to simply as "The Kirby Incident." The full scope of losses is documented within.`,status:"available",pages:["Item 1: The West Wing. Status: Consumed. Item 2: The East Annex (including load-bearing walls). Status: Consumed. Item 3: The Curator himself. Status: Partially consumed. Currently stable.","Recommended action: Do not leave the subject unattended near archival collections, national treasures, or other buildings. Do not leave the subject unattended.","Final note: The subject appeared cheerful throughout. This is noted without further comment."]},{id:"monetize_datastream",title:"How to Monetize Your Data-Stream",author:"DataBroker Null (self-published)",genre:"Business / Digital",color:"#0369a1",accentColor:"#e0f2fe",coverSymbol:"💰",description:"A guide to extracting financial value from digital data streams, cheerfully ignoring all ethical questions along the way.",status:"available",pages:["Step 1: Collect everything. You don't know what's valuable yet. Neither does anyone else. This is fine. Collect it anyway.","Step 4: Sell the access, not the data. Technically, this is a distinction. Legally, this is also a distinction. Morally, we move on.","Appendix: Frequently Asked Questions. Q: Is this legal? A: This guide is not legal advice. Q: Is this ethical? A: This guide is not ethical advice. Q: What is it? A: Instructions."]},{id:"guide_digital_sea",title:"A Tourist's Guide to the Digital Sea",author:"Rendered Wanderer (anonymous)",genre:"Travel / Digital",color:"#0f766e",accentColor:"#ccfbf1",coverSymbol:"🌊",description:"A whimsical travel guide to the Digital Sea, treating it as a holiday destination while quietly documenting its profound strangeness.",status:"available",pages:["Recommended packing: firewall charm, offline persona, patience. Not recommended: nostalgia. The Digital Sea remembers everything. You may not want it to.","Top attraction: The Archive Shallows. Here you can find data from before the First Compression. Some of it is still running. Say hello. Don't let it follow you home.","On PILGRIM: The locals don't mention it. Neither will this guide. Four stars. Would revisit. Will not."]},{id:"freelancer_manifesto",title:"The Art of the Deal: A Freelancer's Manifesto",author:"Anonymous (several competing claims)",genre:"Self-Help / Business",color:"#92400e",accentColor:"#fef3c7",coverSymbol:"🤝",description:"A freelancer's guide to negotiation, contracts, and survival in a world where every job is a potential trap and every client is a potential enemy.",status:"available",pages:["The first rule of freelancing: get paid. The second rule: get paid before you deliver. The third rule: see rules one and two.","Chapter 5: Impossible clients. Some clients cannot be satisfied. Recognizing this early is the difference between a difficult job and a defining trauma.",`On Iron Legion contracts specifically: Read every line. Then read them again. Then have someone read them who isn't you. The word "optional" does not mean what they say it means.`]},{id:"wario_greed_study",title:"A Study of Wario's Greed: A Psychological Profile",author:"Dr. Koopstein (Mages Guild Research Division)",genre:"Psychology",color:"#713f12",accentColor:"#fef9c3",coverSymbol:"🧠",description:"A serious academic attempt to understand the depths of Wario's legendary avarice. The findings are both illuminating and deeply concerning.",status:"available",pages:["Subject presents with an unusually pure expression of acquisitive motivation uncomplicated by self-consciousness, social consideration, or shame.","Chapter 3: The 2,361-item wish list. Appendix B contains the full list. The author has reviewed it. The author needed a break afterward.","Conclusion: Subject is not pathological. Subject is, by his own internal logic, operating perfectly rationally. This is either reassuring or more concerning. See appendix."]},{id:"banana_war",title:"The Great Banana War: A Kong History",author:"Cranky Kong (as told to a historian)",genre:"Military History",color:"#a16207",accentColor:"#fef9c3",coverSymbol:"🍌",description:"The definitive account of the Great Banana War: as told by someone who was there, who is very tired of being asked about it, and who would like everyone to know he won.",status:"available",pages:["I told them. I told all of them. You don't hoard the bananas. You share the bananas. Does anyone listen? No. Do you know what happens next? A war. Over bananas.","The Kremlings had a plan. I had a plan. The difference was mine worked. Also I had Donkey Kong, which is unfair but also my point.","The aftermath: Three treaties, one very complicated arrangement regarding fruit rights, and an ongoing dispute with King K. Rool that will apparently never end. Never."]},{id:"kremling_ships",title:"Kremling Ship Designs, Vol. II",author:"Chief Engineer Krusha",genre:"Naval Engineering",color:"#166534",accentColor:"#dcfce7",coverSymbol:"⚓",description:'Technical schematics and design notes for the Kremling naval fleet, including the modifications made after the "Bug Incident" that no one speaks of.',status:"locked",pages:["Hull design note: The K. Rool class flagship uses a reinforced keel following the third sinking. The second sinking was the engineers' fault. The third was, technically, the sea's fault.","Chapter 4: Listening device concealment. Integrated compartments behind the starboard instrument panel. Standard on all vessels after Year 18 of the fleet.","DK Crew incident note: The listening device was found. This is documented. The design team has been replaced. The new team is working on a better design."]},{id:"ascended_prophecies",title:"The Prophecies of the Ascended One",author:"Unknown / Transcribed by an unnamed scribe",genre:"Prophecy / Religious",color:"#6d28d9",accentColor:"#ede9fe",coverSymbol:"🔮",description:'A collection of prophecies attributed to a figure called only "the Ascended One", vague enough to be interpreted many ways, specific enough to be unsettling.',status:"locked",pages:["When the mirror shatters, the world inside does not end. It multiplies.","Three eyes where there should be two. Four thrones where there should be one. Count carefully. One seat is already occupied.","The Bearer who carries without knowing carries the most. Do not tell them."]},{id:"yoshi_accords",title:"The Yoshi's Island Accords",author:"The Yoshi Diplomatic Corps",genre:"Political / Treaty",color:"#15803d",accentColor:"#dcfce7",coverSymbol:"🦕",description:"The formal diplomatic accords established between Yoshi's Island and the surrounding factions: a document of surprising legal sophistication.",status:"available",pages:["Article 1: Yoshi's Island is neutral. It has always been neutral. It will remain neutral. Any force that violates this neutrality will be met with a level of response proportional to the violation. See Addendum 7.","Addendum 7 (classified appendix): The response will not be proportional. It has never been proportional. The proportionality clause is a courtesy.","Signing note: All parties agreed. All parties seemed surprised by how easily they agreed. This is attributed to the refreshments provided at the signing ceremony."]},{id:"guide_wonder_flowers",title:"A Field Guide to Wonder Flowers",author:"Botanist Petal Thornwood",genre:"Botany / Magic",color:"#86198f",accentColor:"#fae8ff",coverSymbol:"🌸",description:"A thorough botanical and magical study of Wonder Flowers: the rare blooms that warp reality in their immediate vicinity.",status:"available",pages:["The Wonder Flower does not cause hallucinations. This is a common and dangerous misconception. The things you see when near one are entirely real. That is the problem.","Classification by effect: Type A (mild spatial shifting), Type B (temporal wobble), Type C (categorical reality failure). Type C flowers should not exist. They do.","Field safety note: If the flower appears to be looking at you, you have stayed too long. Leave. Do not look back. Do not think about what you saw."]},{id:"azure_blade_trials",title:"The Trials of the Azure Blade",author:"Grandmaster Serathis",genre:"Martial Philosophy",color:"#1d4ed8",accentColor:"#dbeafe",coverSymbol:"⚔️",description:"The account of the historic Trials that founded the Azure Blade order. Part history, part philosophy, part warning to those who would seek membership casually.",status:"available",pages:["Trial One: The Still Pool. You will stand in the water and you will see yourself. You will not like what you see. You are not meant to like it. You are meant to accept it.","Trial Six: The Impossible Choice. There is no correct answer. That is not the point. The point is that you choose, and that you choose knowing it is wrong, and you live with it.","On the War Mage's Staff: Found in the grove after the Matriarch fell. The Azure Blade would call it a trophy. The staff calls itself nothing. It simply waits."]},{id:"beanbean_tales",title:"Beanbean Folk Tales",author:"Collected by Scholar Esspresso",genre:"Folklore",color:"#065f46",accentColor:"#d1fae5",coverSymbol:"🫘",description:"A collection of folk tales from the Beanbean Kingdom. Charming on the surface, deeply strange underneath, as folk tales should be.",status:"available",pages:["The Tale of the Two Queens: Two queens ruled the same kingdom. One was kind and one was just. They were the same queen on different days. The kingdom prospered.","The Bean Who Grew to the Sky: He climbed and climbed. At the top, he found nothing. He came back and told everyone there was everything. This is why we have stories.","The Cackletta Warning: Some versions of this tale are cautionary. Others are aspirational. The Beanbean people do not see a contradiction in this."]},{id:"philosophy_wah",title:"The Philosophy of WAH",author:"Waluigi (dictated to a reluctant scribe)",genre:"Philosophy",color:"#581c87",accentColor:"#f3e8ff",coverSymbol:"🤔",description:"Waluigi's serious and surprisingly coherent attempt at articulating a personal philosophy. It is coherent in the way a very long scream is coherent.",status:"available",pages:["WAH is not a sound. WAH is a state of being. WAH is the feeling you have when the universe has once again failed to acknowledge that you are the main character.","Chapter 3: On rejection. They said no smash. I say: WAH transcends smash. I am in every game in which I am never included. I am the absence that defines the presence.","Closing statement: I am Waluigi. I am the excluded, the overlooked, the underestimated. Every WAH is a declaration of survival. WAH."]},{id:"wastelands_guide",title:"Surviving the Wastelands: A Raider's Guide",author:"Anonymous (multiple suspected authors)",genre:"Survival",color:"#78350f",accentColor:"#fef3c7",coverSymbol:"🏜️",description:"A practical survival guide for operating in the wastelands beyond the Mushroom Kingdom's borders. Brutal, blunt, and possibly the most honest book in the library.",status:"available",pages:["Rule 1: Water. Rule 2: Food. Rule 3: Do not be out here without having solved rules 1 and 2 first.","On other raiders: Some will try to kill you. Most will try to trade with you. A few will try to do both simultaneously. Learn to tell the difference quickly.","The wastes don't hate you. They don't feel anything. This is either comforting or the most frightening thing imaginable. Experience determines which."]},{id:"art_of_the_wah",title:"The Art of the WAH",author:"Waluigi (illustrated edition)",genre:"Art / Philosophy",color:"#7e22ce",accentColor:"#f3e8ff",coverSymbol:"🎨",description:'A companion piece to "The Philosophy of WAH", this time with illustrations. The illustrations are surprisingly competent.',status:"available",pages:['Plate 1: "The Unacknowledged" (ink on velum). A single purple figure stands at the edge of a stage. The stage is full. No one looks.',"Artist's note on Plate 7: Some have said this piece is sad. I say it is triumphant. I say that every time I am unseen, I see more. WAH is not defeat. It is perspective.",'Final plate: "WAH in Blue." Waluigi, standing in rain, arms spread wide, screaming at the sky. The scribe has noted this one sold.']},{id:"rootkit_grimoire",title:"The Rootkit Grimoire",author:"Hex Witch Nullvoid",genre:"Dark Magic / Technical",color:"#1c1917",accentColor:"#a8a29e",coverSymbol:"🕷️",description:"A grimoire of rootkit spells. Magical intrusions designed to embed themselves invisibly in systems, arcane or digital, and persist without detection.",status:"locked",pages:["A rootkit does not attack. A rootkit waits. This distinction is everything.","Chapter 4: The Entropy Ring. The most elegant device we have developed. It does not track the wearer by position. It tracks them by choice. Every significant decision pings the handler.","Ethics section (torn out)."]},{id:"navigating_datastream",title:"Navigating the Datastream",author:"First Edition - Author Unknown",genre:"Technical / Digital",color:"#1e3a5f",accentColor:"#dbeafe",coverSymbol:"🌐",description:"The first volume of the Datastream series: a foundational guide to digital navigation that predates the Deep Web's emergence by several decades.",status:"available",pages:["The Datastream is a river. You do not control a river. You learn its currents. You learn its moods. You learn what to do when it decides to go somewhere unexpected.","Chapter 2: Early warnings. If the data feels warm, you are near a processing node. If it feels cold, you are near something old. If it feels like it is looking at you, log off.","Note: A second volume became necessary. The author did not expect this. The Datastream did not warn them. This is a pattern."]},{id:"study_in_memetics",title:"A Study in Memetics",author:"Institute for Cognitive Propagation",genre:"Psychology / Philosophy",color:"#0f172a",accentColor:"#e2e8f0",coverSymbol:"🧬",description:"A clinical examination of how ideas spread, mutate, and take on lives of their own, with uncomfortable implications for free will.",status:"available",pages:["A meme is not a joke. A meme is any self-replicating unit of cultural information. You are carrying dozens right now. You did not choose most of them.","Chapter 6: Weaponized memetics. The Iron Legion's propaganda broadcasts are a case study. Compliance orders delivered via airship. The repetition is not accidental.","Final chapter: Can a meme be destroyed? Not directly. You can only replace it. Choose your replacements carefully. Someone will, either way."]},{id:"iron_legion_manual",title:"Iron Legion Field Manual",author:"Legion Intelligence Division",genre:"Military / Operational",color:"#374151",accentColor:"#f3f4f6",coverSymbol:"📖",description:"The operational field manual distributed to Iron Legion agents. It covers everything from infiltration protocols to enemy engagement to the proper use of entropy rings.",status:"locked",pages:["Section 3: Asset Handling. An asset is not an ally. An asset serves a function. When the function is complete, the relationship is complete.","Order 120: Upon confirmed infiltration, do not hesitate. Hesitation is the first casualty of an operation. Enact immediately. Document afterward.","Note on supernatural engagement: The Iron Mandate is not cruelty. It is clarity. Supernatural entities are not citizens under current law. Proceed accordingly."]},{id:"great_libraries",title:"A Guide to the Great Libraries",author:"Librarian Archivus Tall",genre:"Reference / History",color:"#92400e",accentColor:"#fef3c7",coverSymbol:"📚",description:"A comprehensive guide to the Great Libraries of the known world: their collections, their quirks, and their various supernatural inhabitants.",status:"available",pages:["The Grand Archive of the Mages Guild: Magnificent collection. Terrible checkout policy. Books removed without authorization are tracked via arcane signature. Ask how the author knows.","Raventree Manor Library: Not recommended. The books are haunted. Some fight back. The last conservator was partially consumed. Status: unknown.","The Digital Sea Archive Shallows: Accessible only via Datastream interface. The oldest data here predates written language. Some of it is still running."]},{id:"warhammer_histories",title:"The Liber Maleficus: A Study of the Ruinous Powers",author:"Redacted (Mages Guild Restricted)",genre:"Dark History / Occult",color:"#1a0a0a",accentColor:"#f87171",coverSymbol:"💀",description:"A restricted academic study of the Ruinous Powers. Forces of entropy and corruption that predate recorded history and have never fully been defeated.",status:"locked",pages:["The Ruinous Powers do not want what you want. They do not want anything that can be named. They want the wanting itself to stop.","Chapter 9: On the Iron Mandate. Whether the Legion knows it or not, their methods echo certain patterns documented in the Ruin Texts. Patterns do not require awareness.","Final warning: This book was written to understand. Understanding these things is not the same as being safe from them. Read accordingly."]},{id:"codex_punchline",title:"Codex: The Punchline",author:'Unknown (marked "Jester Ascendant")',genre:"Mysterious / Comedic",color:"#7c2d12",accentColor:"#fed7aa",coverSymbol:"🃏",description:"A document that appears to be a joke book, an occult text, and a tactical document simultaneously. Whether this is intentional is unclear.",status:"available",pages:["Q: Why did the Oracle multiply? A: Because the original was insufficient and the copy wasn't either.","The punchline is not at the end of the joke. The punchline is the moment you realize the entire situation was the setup.","Final entry: You've been reading a weapon. Fortunately, the weapon is very funny. Laugh now. The laughter is the point. No further explanation will be provided."]},{id:"mayors_ledger",title:"Mayor's Ledger & Spellbook",author:"The Mayor (name obscured by coffee stain)",genre:"Political / Magic",color:"#1e3a8a",accentColor:"#dbeafe",coverSymbol:"📔",description:"A dual-purpose document. Part municipal budget ledger, part personal spellbook. The blend is deeply chaotic and somehow functional.",status:"available",pages:["Q3 Budget Line 47: Festival costs, 4,000g. Festival magic amplification (see spell pg 34), 2,000g. Emergency reversal of festival spell (see pg 35), 8,000g. Total: disappointing.","Spell (pg 34): Civic Enthusiasm Enhancer. Cast time: 1 action. Components: a speech, a hat, genuine optimism. Duration: until someone reads the footnotes.","Personal note, margin: If anyone finds this book, the conspiracy board in my office is not what it looks like. It is exactly what it looks like. Please don't tell anyone."]}];function fo(){return Ed.filter(p=>p.status!=="hidden")}function iy({book:p,onClose:G}){const[O,d]=ct.useState(-1),[M,j]=ct.useState(null),X=p.pages.length,fe=Math.ceil(X/2)-1,_=ct.useCallback(()=>{M||(O===-1?(j("next"),setTimeout(()=>{d(0),j(null)},300)):O<fe&&(j("next"),setTimeout(()=>{d(Ae=>Ae+1),j(null)},300)))},[O,fe,M]),z=ct.useCallback(()=>{M||(O===0?(j("prev"),setTimeout(()=>{d(-1),j(null)},300)):O>0&&(j("prev"),setTimeout(()=>{d(Ae=>Ae-1),j(null)},300)))},[O,M]);ct.useEffect(()=>{const Ae=Me=>{Me.key==="ArrowRight"&&_(),Me.key==="ArrowLeft"&&z(),Me.key==="Escape"&&G()};return window.addEventListener("keydown",Ae),()=>window.removeEventListener("keydown",Ae)},[_,z,G]);const V=O>=0?p.pages[O*2]:null,U=O>=0?p.pages[O*2+1]:null,P=O>=0?O*2+1:null,_e=O>=0&&U?O*2+2:null,B=O===-1,Te=O===fe;return y.jsx("div",{className:"fixed inset-0 z-50 flex items-center justify-center",style:{background:"rgba(5,5,10,0.92)",backdropFilter:"blur(8px)"},onClick:G,children:y.jsxs("div",{className:"relative flex flex-col items-center",
