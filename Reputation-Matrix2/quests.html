<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Mission Control</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="quests.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame"> 
        <div class="scanline-overlay"></div>
        <div id="app">
            <aside id="sidebar"></aside>
            <main id="main-content" class="quest-page">
                
                <!-- HERO DASHBOARD -->
                <header class="mission-control-header">
                    <div class="header-left">
                        <div class="header-icon">
                            <div class="icon-ring"></div>
                            <span class="icon-glyph">◎</span>
                        </div>
                        <div class="header-text">
                            <h1 class="page-title">MISSION CONTROL</h1>
                            <p class="page-subtitle">Tactical Operations Dashboard</p>
                        </div>
                    </div>
                    <div class="header-stats">
                        <div class="mini-stat urgent" id="stat-urgent">
                            <span class="mini-stat-icon">⚠</span>
                            <span class="mini-stat-value">0</span>
                            <span class="mini-stat-label">URGENT</span>
                        </div>
                        <div class="mini-stat active" id="stat-active">
                            <span class="mini-stat-icon">◉</span>
                            <span class="mini-stat-value">0</span>
                            <span class="mini-stat-label">ACTIVE</span>
                        </div>
                        <div class="mini-stat complete" id="stat-complete">
                            <span class="mini-stat-icon">✓</span>
                            <span class="mini-stat-value">0</span>
                            <span class="mini-stat-label">COMPLETE</span>
                        </div>
                    </div>
                </header>

                <!-- VISUAL DASHBOARD -->
                <section class="dashboard-grid" id="quest-dashboard">
                    <!-- Progress Ring -->
                    <div class="dashboard-card progress-card">
                        <div class="progress-ring-container">
                            <svg class="progress-ring" viewBox="0 0 120 120">
                                <circle class="progress-ring-bg" cx="60" cy="60" r="52"/>
                                <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="overall-progress-ring"/>
                            </svg>
                            <div class="progress-ring-center">
                                <span class="progress-value" id="overall-progress-value">0%</span>
                                <span class="progress-label">Overall</span>
                            </div>
                        </div>
                        <div class="progress-breakdown">
                            <div class="breakdown-item">
                                <span class="breakdown-bar"><span class="breakdown-fill main-story"></span></span>
                                <span class="breakdown-label">Main Story</span>
                            </div>
                            <div class="breakdown-item">
                                <span class="breakdown-bar"><span class="breakdown-fill side-quests"></span></span>
                                <span class="breakdown-label">Side Quests</span>
                            </div>
                        </div>
                    </div>

                    <!-- Party Workload -->
                    <div class="dashboard-card workload-card">
                        <h3 class="card-title"><span class="title-icon">👥</span> Party Assignments</h3>
                        <div class="party-workload-grid" id="party-workload">
                            <!-- Injected by JS -->
                        </div>
                    </div>

                    <!-- Urgent Alert -->
                    <div class="dashboard-card alert-card" id="urgent-alert-card">
                        <div class="alert-pulse"></div>
                        <div class="alert-content">
                            <span class="alert-icon">⚡</span>
                            <div class="alert-text">
                                <span class="alert-title" id="urgent-alert-title">No Critical Missions</span>
                                <span class="alert-subtitle" id="urgent-alert-subtitle">All operations nominal</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- QUEST NAVIGATION TABS -->
                <nav class="quest-tabs" id="quest-tabs">
                    <button class="quest-tab active" data-tab="active" data-count="0">
                        <span class="tab-icon">◉</span>
                        <span class="tab-label">Active</span>
                        <span class="tab-count">0</span>
                    </button>
                    <button class="quest-tab" data-tab="available" data-count="0">
                        <span class="tab-icon">📋</span>
                        <span class="tab-label">Available</span>
                        <span class="tab-count">0</span>
                    </button>
                    <button class="quest-tab" data-tab="completed" data-count="0">
                        <span class="tab-icon">✓</span>
                        <span class="tab-label">Completed</span>
                        <span class="tab-count">0</span>
                    </button>
                    <button class="quest-tab" data-tab="failed" data-count="0">
                        <span class="tab-icon">✗</span>
                        <span class="tab-label">Failed</span>
                        <span class="tab-count">0</span>
                    </button>
                    <button class="quest-tab" data-tab="all" data-count="0">
                        <span class="tab-icon">☰</span>
                        <span class="tab-label">All</span>
                        <span class="tab-count">0</span>
                    </button>
                </nav>

                <!-- FILTER BAR (Compact) -->
                <div class="filter-bar" id="filter-bar">
                    <div class="filter-group-inline">
                        <label>Sort:</label>
                        <select id="sort-select" class="filter-select">
                            <option value="priority">Priority</option>
                            <option value="progress">Progress</option>
                            <option value="deadline">Deadline</option>
                            <option value="date">Date Added</option>
                        </select>
                    </div>
                    <div class="filter-group-inline">
                        <label>Type:</label>
                        <select id="type-filter" class="filter-select">
                            <option value="all">All Types</option>
                            <option value="main">Main Story</option>
                            <option value="side">Side Quest</option>
                            <option value="personal">Personal</option>
                            <option value="bounty">Bounty</option>
                        </select>
                    </div>
                    <div class="filter-group-inline">
                        <label>Assignee:</label>
                        <select id="assignee-filter" class="filter-select">
                            <option value="all">Everyone</option>
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="filter-search">
                        <input type="text" id="quest-search" placeholder="Search missions..." class="search-input">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>

                <!-- QUEST GRID -->
                <section class="quest-grid" id="quest-container">
                    <!-- Quest cards injected by JS -->
                </section>

                <!-- Empty State -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-icon">📭</div>
                    <h3>No Missions Found</h3>
                    <p>Adjust your filters or check back later for new assignments.</p>
                </div>

            </main>
        </div>
    </div>

    <!-- QUEST DETAIL MODAL -->
    <div class="modal-overlay" id="quest-modal">
        <div class="modal-container">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-content" id="modal-content">
                <!-- Quest details injected by JS -->
            </div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="quests.js"></script>
</body>
</html>
