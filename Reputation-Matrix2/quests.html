
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Quest Log</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="quests.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 <div class="quests-header-row">
                     <h2 class="page-title">Mission Control & Quest Log</h2>
                     <div id="quest-counter" class="quest-counter">Syncing...</div>
                 </div>

                 <!-- Dashboard Stats -->
                 <div id="quest-summary">
                     <!-- Injected by JS -->
                 </div>

                 <!-- Filters -->
                 <div id="quest-filterer" class="quest-filters">
                     <!-- Injected by JS -->
                 </div>

                 <div class="quest-layout">
                     <!-- Main Quest List -->
                     <div id="quest-container">
                         <!-- Quests Injected by JS -->
                     </div>

                     <!-- Side Panel / Bounty Board -->
                     <aside class="quest-sidebar">
                         <div class="bounty-board-header">
                             <h3>Wanted / Bounties</h3>
                             <span class="board-icon">📜</span>
                         </div>
                         <div id="quest-board-list" class="bounty-list">
                             <!-- Bounties Injected by JS -->
                         </div>
                     </aside>
                 </div>
            </main>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="quests.js"></script>
</body>
</html>
