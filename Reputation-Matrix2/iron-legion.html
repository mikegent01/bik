<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Iron Legion Dossier</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="iron-legion.css">
    <link rel="stylesheet" href="faction-modal.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            <aside id="sidebar"></aside>
            <main id="main-content">
                <div class="legion-header">
                    <div class="legion-emblem">
                        <img src="faction_iron_legion.png" alt="Iron Legion Emblem">
                    </div>
                    <div class="legion-title-block">
                        <h2 class="page-title">Iron Legion Intelligence Dossier</h2>
                        <p class="page-subtitle">Classification: PRIORITY THREAT | Last Updated: Day 21, 1040 BF</p>
                        <div class="threat-indicator">
                            <span class="threat-label">THREAT LEVEL:</span>
                            <span class="threat-level critical">CRITICAL</span>
                        </div>
                    </div>
                </div>

                <div id="legion-container">
                    <div class="loading-state">Decrypting Legion intelligence files...</div>
                </div>

            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="faction-modal.js"></script>
    <script type="module" src="iron-legion.js"></script>
</body>
</html>
