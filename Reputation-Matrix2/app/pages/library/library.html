<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Locker — Doughnut World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Caveat:wght@400;700&family=Courier+Prime&family=Share+Tech+Mono&family=Patrick+Hand&family=Lora:ital@0;1&family=Spectral:wght@400;600&family=Crimson+Text:ital@0;1&family=Bangers&family=Exo+2:wght@400;600&family=Fira+Code:wght@400;500&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg-primary:#0a0a0f;--bg-secondary:#12121a;--bg-tertiary:#1a1a25;
            --text-primary:#e0ddd5;--text-secondary:#a09d95;--text-muted:#6a675f;
            --accent-gold:#c9a96e;--accent-purple:#9b59b6;--accent-red:#e74c3c;
            --accent-orange:#f39c12;--accent-teal:#1abc9c;--accent-green:#2ecc71;
            --border-dim:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
            --panel-bg:rgba(18,18,26,0.95);--transition-fast:0.2s ease;--transition-med:0.4s ease;
        }
        html{scroll-behavior:smooth}
        body{font-family:'Lora',serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        #particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
        .page-wrapper{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px}

        /* HEADER */
        .page-header{text-align:center;padding:60px 20px 40px}
        .page-header h1{font-family:'Cinzel Decorative',cursive;font-size:clamp(2rem,5vw,3.5rem);color:var(--accent-gold);text-shadow:0 0 30px rgba(201,169,110,0.3);letter-spacing:3px;margin-bottom:10px}
        .page-header .subtitle{font-family:'Cinzel',serif;font-size:clamp(0.85rem,2vw,1.1rem);color:var(--text-muted);letter-spacing:6px;text-transform:uppercase}
        .item-count{display:inline-block;margin-top:15px;padding:6px 20px;border:1px solid var(--border-bright);border-radius:20px;font-family:'Share Tech Mono',monospace;font-size:0.8rem;color:var(--text-secondary);background:rgba(255,255,255,0.03)}
        .header-line{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-gold),transparent);margin:25px auto 0}

        /* CONTROLS */
        .controls-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:20px;margin-bottom:30px;background:var(--panel-bg);border:1px solid var(--border-dim);border-radius:12px;backdrop-filter:blur(10px)}
        .search-box{flex:1;min-width:200px;max-width:400px;position:relative}
        .search-box input{width:100%;padding:10px 16px 10px 40px;background:rgba(255,255,255,0.05);border:1px solid var(--border-bright);border-radius:8px;color:var(--text-primary);font-family:'Lora',serif;font-size:0.9rem;outline:none;transition:border-color var(--transition-fast)}
        .search-box input:focus{border-color:var(--accent-gold)}
        .search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:0.9rem;opacity:0.5}
        .filter-group{display:flex;flex-wrap:wrap;gap:6px}
        .filter-btn{padding:6px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border-dim);border-radius:20px;color:var(--text-secondary);font-family:'Cinzel',serif;font-size:0.75rem;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap}
        .filter-btn:hover{border-color:var(--accent-gold);color:var(--text-primary)}
        .filter-btn.active{background:rgba(201,169,110,0.15);border-color:var(--accent-gold);color:var(--accent-gold)}
        .sort-select{padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border-bright);border-radius:8px;color:var(--text-primary);font-family:'Cinzel',serif;font-size:0.8rem;cursor:pointer;outline:none}
        .sort-select option{background:var(--bg-secondary)}
        .view-toggle{display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:8px;padding:3px}
        .view-btn{padding:6px 10px;background:none;border:none;color:var(--text-muted);cursor:pointer;border-radius:6px;transition:all var(--transition-fast);font-size:1rem}
        .view-btn.active{background:rgba(255,255,255,0.1);color:var(--text-primary)}

        /* GRID */
        .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:10px 0}
        .items-grid.list-view{grid-template-columns:1fr;max-width:900px;margin:0 auto}

        /* CARDS */
        .item-card{position:relative;border-radius:12px;border:1px solid var(--border-dim);overflow:hidden;cursor:pointer;transition:all var(--transition-med);opacity:0;transform:translateY(20px)}
        .item-card.visible{opacity:1;transform:translateY(0)}
        .item-card:hover{transform:translateY(-4px);border-color:var(--border-bright)}
        .item-card.hidden{display:none}
        .card-header{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 10px}
        .card-icon{font-size:2rem;line-height:1;flex-shrink:0}
        .card-title-area{flex:1;min-width:0}
        .card-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;margin-bottom:4px;line-height:1.3}
        .card-badges{display:flex;flex-wrap:wrap;gap:4px}
        .rarity-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-family:'Share Tech Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:1px}
        .rarity-common{background:rgba(150,150,150,0.2);color:#aaa}
        .rarity-uncommon{background:rgba(46,204,113,0.2);color:#2ecc71}
        .rarity-rare{background:rgba(52,152,219,0.2);color:#3498db}
        .rarity-legendary{background:rgba(255,193,7,0.2);color:#ffc107;border:1px solid rgba(255,193,7,0.3)}
        .lore-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.6rem;font-family:'Share Tech Mono',monospace;text-transform:uppercase}
        .lore-critical{background:rgba(231,76,60,0.2);color:#e74c3c}
        .lore-high{background:rgba(243,156,18,0.2);color:#f39c12}
        .lore-moderate{background:rgba(52,152,219,0.2);color:#3498db}
        .lore-personal{background:rgba(155,89,182,0.2);color:#9b59b6}
        .lore-low{background:rgba(46,204,113,0.15);color:#27ae60}
        .lore-none{background:rgba(150,150,150,0.1);color:#777}
        .card-body{padding:0 16px 12px}
        .card-description{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .card-meta{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--border-dim);font-size:0.7rem;color:var(--text-muted);font-family:'Share Tech Mono',monospace}
        .meta-item{display:flex;align-items:center;gap:4px}
        .model-indicator{position:absolute;top:10px;right:10px;padding:3px 8px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:0.65rem;font-family:'Share Tech Mono',monospace;color:#88ddff;backdrop-filter:blur(4px);z-index:2}
        .interaction-indicator{position:absolute;bottom:46px;right:10px;padding:3px 8px;background:rgba(201,169,110,0.15);border:1px solid rgba(201,169,110,0.3);border-radius:6px;font-size:0.6rem;font-family:'Share Tech Mono',monospace;color:var(--accent-gold);text-transform:uppercase}
        .paper-texture{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1;border-radius:12px}
        .effect-coffee-stain::before{content:'';position:absolute;top:15px;right:20px;width:50px;height:50px;background:radial-gradient(circle,rgba(139,115,85,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:2}
        .effect-blood-splatter::before{content:'';position:absolute;top:8px;right:12px;width:25px;height:25px;background:radial-gradient(circle,rgba(139,26,26,0.4) 0%,transparent 70%);border-radius:45% 55% 50% 50%;pointer-events:none;z-index:2}
        .effect-official-seal::after{content:'⚖️';position:absolute;bottom:42px;right:12px;font-size:1.5rem;opacity:0.15;pointer-events:none;z-index:2}

        /* MODAL */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.4s ease;backdrop-filter:blur(8px)}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-container{width:95%;max-width:900px;max-height:90vh;overflow-y:auto;border-radius:16px;border:1px solid var(--border-bright);position:relative;transform:scale(0.9) translateY(20px);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1)}
        .modal-overlay.active .modal-container{transform:scale(1) translateY(0)}
        .modal-container::-webkit-scrollbar{width:6px}
        .modal-container::-webkit-scrollbar-track{background:transparent}
        .modal-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
        .modal-close{position:sticky;top:0;float:right;z-index:10;padding:8px 14px;margin:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text-primary);font-size:1.2rem;cursor:pointer;backdrop-filter:blur(4px);transition:all var(--transition-fast)}
        .modal-close:hover{background:rgba(255,255,255,0.1)}
        .modal-content{padding:30px}
        .modal-top{display:flex;gap:20px;margin-bottom:25px}
        .modal-icon{font-size:3.5rem;flex-shrink:0}
        .modal-title-area{flex:1}
        .modal-title{font-family:'Cinzel Decorative',cursive;font-size:1.6rem;margin-bottom:8px;line-height:1.3}
        .modal-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
        .modal-badges .rarity-badge,.modal-badges .lore-badge{font-size:0.7rem;padding:3px 10px}
        .category-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-family:'Share Tech Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:1px;background:rgba(255,255,255,0.05);color:var(--text-muted)}
        .modal-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:25px;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;border:1px solid var(--border-dim)}
        .modal-meta-item{font-family:'Share Tech Mono',monospace;font-size:0.78rem}
        .modal-meta-item .label{color:var(--text-muted);text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;display:block;margin-bottom:2px}
        .modal-meta-item .value{color:var(--text-primary)}
        .modal-section{margin-bottom:25px}
        .modal-section-title{font-family:'Cinzel',serif;font-size:0.85rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-dim)}
        .modal-description{font-size:0.95rem;line-height:1.8;color:var(--text-secondary)}

        /* 3D VIEWER */
        .model-viewer-container{width:100%;height:350px;border-radius:10px;overflow:hidden;border:1px solid var(--border-dim);margin-bottom:20px;position:relative}
        .model-viewer-container canvas{width:100%!important;height:100%!important;display:block}
        .model-controls-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);padding:4px 12px;background:rgba(0,0,0,0.6);border-radius:12px;font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--text-muted);pointer-events:none;opacity:0.8}
        .model-fallback{width:100%;height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#111,#1a1a2a);border-radius:10px;border:1px dashed var(--border-bright);color:var(--text-muted);gap:10px;margin-bottom:20px}
        .model-fallback .icon-3d{font-size:3rem;opacity:0.4}
        .model-fallback .text{font-family:'Share Tech Mono',monospace;font-size:0.8rem}

        /* STYLED INTERACTION AREA */
        .interaction-area{position:relative;overflow:hidden}
        .interaction-stamp{position:absolute;font-weight:bold;pointer-events:none;z-index:5;opacity:0.4}
        .interaction-stamp.pos-top-right{top:12px;right:16px}
        .interaction-stamp.pos-bottom-center{bottom:12px;left:50%;transform:translateX(-50%)}
        .interaction-stamp.pos-center{top:50%;left:50%;transform:translate(-50%,-50%)}
        .interaction-overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
        .interaction-overlay.overlay-coffee-ring{background:radial-gradient(circle at 75% 25%,rgba(139,115,85,0.12) 0%,transparent 40%)}
        .interaction-overlay.overlay-sauce-splatter{background:radial-gradient(circle at 80% 15%,rgba(139,26,26,0.1) 0%,transparent 30%),radial-gradient(circle at 20% 80%,rgba(139,26,26,0.08) 0%,transparent 25%)}
        .interaction-overlay.overlay-scan-lines{background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.02) 2px,rgba(255,255,255,0.02) 4px)}
        .interaction-overlay.overlay-matrix-rain{background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,0,0.015) 3px,rgba(0,255,0,0.015) 6px)}
        .interaction-overlay.overlay-starfield-micro{background-image:radial-gradient(1px 1px at 10% 20%,rgba(255,255,220,0.5),transparent),radial-gradient(1px 1px at 30% 60%,rgba(255,255,220,0.4),transparent),radial-gradient(1px 1px at 60% 40%,rgba(255,255,220,0.3),transparent),radial-gradient(1px 1px at 80% 70%,rgba(255,255,220,0.4),transparent),radial-gradient(1px 1px at 50% 90%,rgba(255,255,220,0.5),transparent)}
        .interaction-overlay.overlay-starfield-full{background-image:radial-gradient(2px 2px at 10% 20%,rgba(255,255,220,0.7),transparent),radial-gradient(1.5px 1.5px at 30% 60%,rgba(255,255,220,0.5),transparent),radial-gradient(1px 1px at 60% 40%,rgba(255,255,220,0.4),transparent),radial-gradient(2px 2px at 80% 70%,rgba(255,255,220,0.6),transparent),radial-gradient(1px 1px at 50% 90%,rgba(255,255,220,0.5),transparent),radial-gradient(1.5px 1.5px at 15% 75%,rgba(255,255,220,0.6),transparent),radial-gradient(1px 1px at 70% 15%,rgba(255,255,220,0.3),transparent),radial-gradient(2px 2px at 90% 50%,rgba(255,255,220,0.5),transparent)}
        .interaction-overlay.overlay-energy-particles{background:radial-gradient(circle at 50% 50%,rgba(153,102,255,0.08) 0%,transparent 60%)}
        .interaction-overlay.overlay-aged-paper{background:radial-gradient(circle at 70% 30%,rgba(100,80,50,0.1) 0%,transparent 50%)}
        .interaction-overlay.overlay-tarot-shimmer{background:linear-gradient(135deg,transparent 40%,rgba(170,68,221,0.05) 50%,transparent 60%);background-size:200% 200%;animation:shimmerTarot 4s infinite}
        @keyframes shimmerTarot{0%{background-position:200% 200%}100%{background-position:-200% -200%}}
        .interaction-overlay.overlay-sepia-damage{background:linear-gradient(180deg,transparent 60%,rgba(100,70,30,0.15) 100%)}

        .interact-btn-styled{display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:all 0.3s ease;position:relative;z-index:4}
        .interact-btn-styled:hover{transform:scale(1.03)}
        .interact-btn-styled.revealed{opacity:0.5;cursor:default;pointer-events:none}
        .interact-btn-styled .btn-icon{font-size:1.1em}

        .hidden-content-styled{max-height:0;overflow:hidden;transition:max-height 1.2s ease,padding 0.4s ease,opacity 0.6s ease;opacity:0;position:relative;z-index:4}
        .hidden-content-styled.revealed{max-height:2000px;opacity:1}

        .reveal-header{display:block;margin-bottom:12px}
        .reveal-footer{display:block;margin-top:12px}
        .reveal-footer.blink{animation:footerBlink 1.5s infinite}
        @keyframes footerBlink{0%,100%{opacity:1}50%{opacity:0.4}}

        .modal-tags{display:flex;flex-wrap:wrap;gap:6px}
        .tag{padding:3px 10px;background:rgba(255,255,255,0.05);border:1px solid var(--border-dim);border-radius:12px;font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--text-muted)}
        .modal-nav{display:flex;justify-content:space-between;padding:15px 0;border-top:1px solid var(--border-dim);margin-top:20px}
        .nav-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border-dim);border-radius:8px;color:var(--text-secondary);font-family:'Cinzel',serif;font-size:0.8rem;cursor:pointer;transition:all var(--transition-fast)}
        .nav-btn:hover{border-color:var(--accent-gold);color:var(--text-primary)}
        .nav-btn:disabled{opacity:0.3;cursor:not-allowed}
        .evidence-counter{position:fixed;bottom:20px;right:20px;padding:10px 18px;background:var(--panel-bg);border:1px solid var(--border-bright);border-radius:10px;font-family:'Cinzel',serif;font-size:0.8rem;color:var(--accent-gold);z-index:100;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
        .evidence-counter .count{font-family:'Share Tech Mono',monospace;font-weight:bold}
        .no-results{text-align:center;padding:60px 20px;color:var(--text-muted);font-family:'Cinzel',serif;display:none}
        .no-results.visible{display:block}

        @media(max-width:768px){
            .items-grid{grid-template-columns:1fr}
            .controls-bar{flex-direction:column}
            .search-box{max-width:100%}
            .modal-top{flex-direction:column;align-items:center;text-align:center}
            .modal-content{padding:20px}
            .model-viewer-container{height:250px}
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="page-wrapper">
        <header class="page-header">
            <h1>Evidence Locker</h1>
            <p class="subtitle">Collected Items & Intelligence</p>
            <div class="item-count" id="item-count">Loading...</div>
            <div class="header-line"></div>
        </header>
        <div class="controls-bar">
            <div class="search-box"><input type="text" id="search-input" placeholder="Search items, tags, locations..." autocomplete="off"></div>
            <div class="filter-group" id="filter-group"><button class="filter-btn active" data-filter="all">All</button></div>
            <select class="sort-select" id="sort-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="name">Name (A-Z)</option>
                <option value="rarity">Rarity</option>
                <option value="lore">Lore Relevance</option>
            </select>
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" title="Grid View">⊞</button>
                <button class="view-btn" data-view="list" title="List View">☰</button>
            </div>
        </div>
        <div class="items-grid" id="items-grid"></div>
        <div class="no-results" id="no-results">
            <div style="font-size:3rem;margin-bottom:15px;opacity:0.4">🔍</div>
            <div style="font-size:1.1rem;margin-bottom:8px">No items match your search</div>
            <div style="font-size:0.85rem;opacity:0.6">Try different keywords or clear your filters</div>
        </div>
    </div>
    <div class="evidence-counter">Evidence: <span class="count" id="evidence-count">0</span> / <span class="count" id="evidence-total">0</span></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-container" id="modal-container">
            <button class="modal-close" id="modal-close">✕</button>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>
    <style id="injected-styles"></style>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    (function() {
        'use strict';
        let itemsData = null, filteredItems = [], currentFilter = 'all', currentSort = 'newest', currentView = 'grid', currentModalIndex = -1, searchQuery = '';
        const rarityOrder = {legendary:0,rare:1,uncommon:2,common:3};
        const loreOrder = {critical:0,high:1,moderate:2,personal:3,low:4,none:5};
        const $ = id => document.getElementById(id);
        const grid=$('items-grid'), filterGroup=$('filter-group'), searchInput=$('search-input'), sortSelect=$('sort-select'),
              modalOverlay=$('modal-overlay'), modalContainer=$('modal-container'), modalContent=$('modal-content'),
              noResults=$('no-results'), itemCountEl=$('item-count'), evidenceCount=$('evidence-count'), evidenceTotal=$('evidence-total'),
              injectedStyles=$('injected-styles');

        const catIcons={scraps:'📜',artifacts:'🔮',evidence:'🔍',keys:'🔑',curiosities:'✨',consumables:'🧪'};
        function getCatIcon(id){return catIcons[id]||'📦'}
        function getCatLabel(id){if(!itemsData)return id;const c=itemsData.categories.find(x=>x.id===id);return c?c.label:id}

        // LOAD
        async function loadItems(){
            try{
                const r=await fetch('../../../data/commerce/items.json');
                if(!r.ok)throw new Error('HTTP '+r.status);
                itemsData=await r.json(); init();
            }catch(e){
                console.error(e);
                grid.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-muted);grid-column:1/-1"><p style="font-size:1.2rem;margin-bottom:10px">⚠️ Could not load Reputation-Matrix2/commerce/items.json</p><p style="font-size:0.85rem">${e.message}</p></div>`;
            }
        }

        function init(){
            if(!itemsData?.items)return;
            injectCSS(); buildFilters();
            evidenceTotal.textContent=itemsData.items.length;
            evidenceCount.textContent=itemsData.items.length;
            applyFilters();
        }

        // CSS INJECTION
        function injectCSS(){
            let css='';
            itemsData.items.forEach(item=>{
                const s=item.style||{};
                if(s.customCSS)css+=`\n${s.customCSS}\n`;
                if(item.animations?.idle?.css){
                    const ic=item.animations.idle.css;
                    const kfMatch=ic.match(/@keyframes[^{]+\{(?:[^{}]*\{[^}]*\})*[^}]*\}/g);
                    const rest=ic.replace(/@keyframes[^{]+\{(?:[^{}]*\{[^}]*\})*[^}]*\}/g,'').trim();
                    if(kfMatch)css+=kfMatch.join('\n')+'\n';
                    if(rest)css+=`.item-${item.id}{${rest}}\n`;
                }
                if(item.animations?.onHover?.css){
                    const hc=item.animations.onHover.css;
                    const kfMatch=hc.match(/@keyframes[^{]+\{(?:[^{}]*\{[^}]*\})*[^}]*\}/g);
                    const rest=hc.replace(/@keyframes[^{]+\{(?:[^{}]*\{[^}]*\})*[^}]*\}/g,'').trim();
                    if(kfMatch)css+=kfMatch.join('\n')+'\n';
                    if(rest)css+=`.item-${item.id}:hover{${rest}}\n`;
                }
                // Inject interaction reveal keyframes
                if(item.interactionStyle?.customRevealCSS){
                    css+=`\n${item.interactionStyle.customRevealCSS}\n`;
                }
            });
            injectedStyles.textContent=css;
        }

        function buildFilters(){
            filterGroup.innerHTML='';
            const all=document.createElement('button');
            all.className='filter-btn active';all.dataset.filter='all';all.textContent='All';
            filterGroup.appendChild(all);
            itemsData.categories.forEach(c=>{
                const b=document.createElement('button');
                b.className='filter-btn';b.dataset.filter=c.id;b.textContent=`${c.icon} ${c.label}`;
                filterGroup.appendChild(b);
            });
            filterGroup.addEventListener('click',e=>{
                const b=e.target.closest('.filter-btn');if(!b)return;
                filterGroup.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
                b.classList.add('active');currentFilter=b.dataset.filter;applyFilters();
            });
        }

        function parseDate(d){
            const m={Highsun:1,Harvestide:2,Frostfall:3};
            const mt=d.match(/(\w+)\s+(\d+),\s+(\d+)/);
            if(!mt)return 0;
            return parseInt(mt[3])*10000+(m[mt[1]]||0)*100+parseInt(mt[2]);
        }
        function parseTime(t){if(!t)return 0;const p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]||0)}

        function applyFilters(){
            let items=[...itemsData.items];
            if(currentFilter!=='all')items=items.filter(i=>i.category===currentFilter);
            if(searchQuery.trim()){
                const q=searchQuery.toLowerCase();
                items=items.filter(i=>
                    i.name.toLowerCase().includes(q)||
                    i.shortDescription.toLowerCase().includes(q)||
                    i.fullDescription.toLowerCase().includes(q)||
                    i.obtainedBy.toLowerCase().includes(q)||
                    i.obtainedLocation.toLowerCase().includes(q)||
                    (i.tags&&i.tags.some(t=>t.includes(q)))||
                    (i.hiddenContent&&i.hiddenContent.toLowerCase().includes(q))
                );
            }
            switch(currentSort){
                case'newest':items.sort((a,b)=>(parseDate(b.obtainedDate)*1440+parseTime(b.obtainedTime))-(parseDate(a.obtainedDate)*1440+parseTime(a.obtainedTime)));break;
                case'oldest':items.sort((a,b)=>(parseDate(a.obtainedDate)*1440+parseTime(a.obtainedTime))-(parseDate(b.obtainedDate)*1440+parseTime(b.obtainedTime)));break;
                case'name':items.sort((a,b)=>a.name.localeCompare(b.name));break;
                case'rarity':items.sort((a,b)=>(rarityOrder[a.rarity]??99)-(rarityOrder[b.rarity]??99));break;
                case'lore':items.sort((a,b)=>(loreOrder[a.loreRelevance]??99)-(loreOrder[b.loreRelevance]??99));break;
            }
            filteredItems=items;renderGrid();
        }

        function renderGrid(){
            grid.innerHTML='';
            evidenceCount.textContent=filteredItems.length;
            itemCountEl.textContent=`${filteredItems.length} of ${itemsData.items.length} items`;
            noResults.classList.toggle('visible',filteredItems.length===0);
            filteredItems.forEach((item,i)=>{
                const card=createCard(item,i);grid.appendChild(card);
                setTimeout(()=>card.classList.add('visible'),50+i*60);
            });
            grid.classList.toggle('list-view',currentView==='list');
        }

        function createCard(item,index){
            const card=document.createElement('div');
            card.className=`item-card item-${item.id}`;
            const s=item.style||{};
            card.style.background=s.cardBackground||'';
            card.style.borderColor=s.borderColor||'';
            if(s.glowColor)card.style.boxShadow=`0 2px 15px ${s.glowColor}`;
            if(s.specialEffect==='coffee-stain')card.classList.add('effect-coffee-stain');
            if(s.specialEffect==='blood-splatter')card.classList.add('effect-blood-splatter');
            if(s.specialEffect==='official-seal')card.classList.add('effect-official-seal');

            let h='';
            if(s.paperTexture)h+='<div class="paper-texture"></div>';
            if(item.model3d)h+='<div class="model-indicator">🎮 3D</div>';
            h+=`<div class="card-header"><div class="card-icon">${getCatIcon(item.category)}</div>`;
            h+=`<div class="card-title-area"><div class="card-title" style="color:${s.textColor||'inherit'};font-family:${s.fontFamily||'inherit'}">${item.name}</div>`;
            h+=`<div class="card-badges"><span class="rarity-badge rarity-${item.rarity}">${item.rarity}</span>`;
            if(item.loreRelevance&&item.loreRelevance!=='none')h+=`<span class="lore-badge lore-${item.loreRelevance}">${item.loreRelevance}</span>`;
            h+=`</div></div></div>`;
            h+=`<div class="card-body"><p class="card-description" style="color:${s.textColor||''}">${item.shortDescription}</p></div>`;
            if(item.interactable)h+=`<div class="interaction-indicator">${item.interactionType}</div>`;
            h+=`<div class="card-meta"><div class="meta-item">👤 ${item.obtainedBy}</div><div class="meta-item">📅 ${item.obtainedDate}</div></div>`;
            card.innerHTML=h;
            card.addEventListener('click',()=>openModal(item,index));
            return card;
        }

        // MODAL
        function openModal(item,index){
            currentModalIndex=index;
            const s=item.style||{};
            modalContainer.style.background=s.cardBackground||'var(--bg-secondary)';
            modalContainer.style.borderColor=s.borderColor||'';

            let h='';
            h+=`<div class="modal-top"><div class="modal-icon">${getCatIcon(item.category)}</div>`;
            h+=`<div class="modal-title-area"><h2 class="modal-title" style="color:${s.accentColor||s.textColor||''};font-family:${s.fontFamily||''}">${item.name}</h2>`;
            h+=`<div class="modal-badges"><span class="rarity-badge rarity-${item.rarity}">${item.rarity}</span>`;
            h+=`<span class="category-badge">${getCatLabel(item.category)}</span>`;
            if(item.loreRelevance)h+=`<span class="lore-badge lore-${item.loreRelevance}">${item.loreRelevance}</span>`;
            if(item.subcategory)h+=`<span class="category-badge">${item.subcategory}</span>`;
            h+=`</div></div></div>`;

            h+=`<div class="modal-meta-grid">`;
            h+=`<div class="modal-meta-item"><span class="label">Obtained By</span><span class="value">${item.obtainedBy}</span></div>`;
            h+=`<div class="modal-meta-item"><span class="label">Date</span><span class="value">${item.obtainedDate}</span></div>`;
            h+=`<div class="modal-meta-item"><span class="label">Time</span><span class="value">${item.obtainedTime||'Unknown'}</span></div>`;
            h+=`<div class="modal-meta-item"><span class="label">Location</span><span class="value">${item.obtainedLocation}</span></div>`;
            h+=`</div>`;

            // 3D Model
            if(item.model3d){
                h+=`<div class="modal-section"><div class="modal-section-title">3D Model</div>`;
                h+=`<div class="model-viewer-container" id="model-viewer-${item.id}"><div class="model-controls-hint">Click & drag to rotate • Scroll to zoom</div></div></div>`;
            }

            // Description
            h+=`<div class="modal-section"><div class="modal-section-title">Description</div>`;
            h+=`<p class="modal-description" style="color:${s.textColor||''};font-family:${s.fontFamily||''}">${item.fullDescription}</p></div>`;

            // STYLED INTERACTION
            if(item.interactable&&item.hiddenContent){
                h+=`<div class="modal-section"><div class="modal-section-title">Interaction</div>`;
                h+=buildInteractionArea(item);
                h+=`</div>`;
            }

            // Tags
            if(item.tags?.length){
                h+=`<div class="modal-section"><div class="modal-section-title">Tags</div><div class="modal-tags">`;
                item.tags.forEach(t=>h+=`<span class="tag">#${t}</span>`);
                h+=`</div></div>`;
            }

            // Nav
            h+=`<div class="modal-nav">`;
            h+=`<button class="nav-btn" id="nav-prev" ${index<=0?'disabled':''}>← Previous</button>`;
            h+=`<button class="nav-btn" id="nav-next" ${index>=filteredItems.length-1?'disabled':''}>Next →</button></div>`;

            modalContent.innerHTML=h;
            modalOverlay.classList.add('active');
            document.body.style.overflow='hidden';

            // Wire interaction
            const btn=document.querySelector('.interact-btn-styled');
            const hidden=document.querySelector('.hidden-content-styled');
            if(btn&&hidden){
                btn.addEventListener('click',()=>{
                    if(btn.classList.contains('revealed'))return;
                    btn.classList.add('revealed');
                    btn.querySelector('.btn-text').textContent='✓ Revealed';
                    hidden.classList.add('revealed');
                    // Apply reveal animation
                    const is=item.interactionStyle;
                    if(is){
                        const animName=is.revealAnimation?.replace(/[^a-zA-Z]/g,'');
                        if(animName){
                            const inner=hidden.querySelector('.reveal-inner');
                            if(inner){
                                // Map animation names to keyframe names from customRevealCSS
                                const cssAnimName = getCSSAnimationName(is.revealAnimation);
                                if(cssAnimName){
                                    inner.style.animation=`${cssAnimName} ${is.revealDuration||'1s'} ${is.revealEasing||'ease-out'} forwards`;
                                }
                            }
                        }
                    }
                });
            }

            // Nav
            $('nav-prev')?.addEventListener('click',()=>navModal(-1));
            $('nav-next')?.addEventListener('click',()=>navModal(1));

            // 3D
            if(item.model3d)setTimeout(()=>init3D(item),100);
        }

        function getCSSAnimationName(revealAnim){
            const map={
                'paper-unfold':'paperUnfold','napkin-flip':'napkinFlip','rune-glow':'runeGlow',
                'scan-reveal':'scanReveal','energy-surge':'energySurge','unfold-gentle':'unfoldGentle',
                'glitch-decode':'glitchDecode','divine-light':'divineLight','stamp-down':'stampDown',
                'card-fan':'cardFan','photo-flip':'photoFlip','compass-spin':'compassSpin'
            };
            return map[revealAnim]||null;
        }

        function buildInteractionArea(item){
            const is=item.interactionStyle||{};
            let h=`<div class="interaction-area" style="`;
            h+=`background:${is.containerBg||'rgba(0,0,0,0.3)'};`;
            h+=`border:${is.containerBorder||'1px solid var(--border-dim)'};`;
            h+=`border-radius:${is.containerBorderRadius||'10px'};`;
            h+=`box-shadow:${is.containerShadow||'none'};`;
            h+=`padding:${is.containerPadding||'20px'};`;
            h+=`position:relative;overflow:hidden;">`;

            // Overlay effect
            if(is.overlayEffect){
                h+=`<div class="interaction-overlay overlay-${is.overlayEffect}" style="opacity:${is.overlayOpacity||0.1}"></div>`;
            }

            // Stamp
            if(is.stampText){
                const pos=is.stampPosition||'top-right';
                let posClass='pos-top-right';
                if(pos==='bottom-center')posClass='pos-bottom-center';
                if(pos==='center')posClass='pos-center';
                h+=`<div class="interaction-stamp ${posClass}" style="`;
                h+=`color:${is.stampColor||'#ff0000'};`;
                h+=`font-family:${is.stampFont||"'Share Tech Mono',monospace"};`;
                h+=`font-size:${is.stampSize||'0.7rem'};`;
                h+=`transform:rotate(${is.stampRotation||'0deg'})${pos==='bottom-center'?' translateX(-50%)':''}${pos==='center'?' translate(-50%,-50%)':''};`;
                if(is.stampBorder)h+=`border:${is.stampBorder};`;
                if(is.stampPadding)h+=`padding:${is.stampPadding};`;
                if(is.stampOpacity!==undefined)h+=`opacity:${is.stampOpacity};`;
                h+=`">${is.stampText}</div>`;
            }

            // Button
            h+=`<div style="text-align:center;position:relative;z-index:4;margin-bottom:16px;">`;
            h+=`<button class="interact-btn-styled" style="`;
            h+=`background:${is.buttonBg||'rgba(201,169,110,0.1)'};`;
            h+=`border:${is.buttonBorder||'1px solid var(--accent-gold)'};`;
            h+=`color:${is.buttonColor||'var(--accent-gold)'};`;
            h+=`font-family:${is.buttonFont||"'Cinzel',serif"};`;
            h+=`font-size:${is.buttonFontSize||'0.85rem'};`;
            h+=`border-radius:${is.buttonRadius||'8px'};`;
            h+=`padding:${is.buttonPadding||'10px 25px'};`;
            h+=`">`;
            if(is.buttonIcon)h+=`<span class="btn-icon">${is.buttonIcon}</span>`;
            h+=`<span class="btn-text">${item.interactionPrompt||'Examine...'}</span>`;
            h+=`</button></div>`;

            // Hidden content
            h+=`<div class="hidden-content-styled">`;
            h+=`<div class="reveal-inner" style="`;
            h+=`background:${is.contentBg||'rgba(0,0,0,0.3)'};`;
            h+=`border:${is.contentBorder||'none'};`;
            if(is.contentBorderLeft)h+=`border-left:${is.contentBorderLeft};`;
            h+=`border-radius:${is.contentRadius||'8px'};`;
            h+=`padding:${is.contentPadding||'15px'};`;
            h+=`font-family:${is.contentFont||"'Lora',serif"};`;
            h+=`font-size:${is.contentFontSize||'0.9rem'};`;
            h+=`color:${is.contentColor||'var(--text-secondary)'};`;
            h+=`line-height:${is.contentLineHeight||'1.7'};`;
            h+=`letter-spacing:${is.contentLetterSpacing||'0'};`;
            h+=`box-shadow:${is.contentShadow||'none'};`;
            h+=`max-width:${is.contentMaxWidth||'100%'};`;
            if(is.contentTextShadow&&is.contentTextShadow!=='none')h+=`text-shadow:${is.contentTextShadow};`;
            h+=`">`;

            // Header
            if(is.headerText){
                h+=`<span class="reveal-header" style="`;
                h+=`font-family:${is.headerFont||"'Cinzel',serif"};`;
                h+=`color:${is.headerColor||'var(--text-muted)'};`;
                h+=`font-size:${is.headerSize||'0.75rem'};`;
                h+=`font-style:${is.headerStyle||'normal'};`;
                h+=`margin-bottom:${is.headerMarginBottom||'10px'};`;
                if(is.headerBorderBottom)h+=`border-bottom:${is.headerBorderBottom};padding-bottom:${is.headerPaddingBottom||'6px'};`;
                if(is.headerAlign)h+=`text-align:${is.headerAlign};`;
                if(is.headerGlow)h+=`text-shadow:${is.headerGlow};`;
                h+=`">${is.headerText}</span>`;
            }

            // Content
            h+=`<div style="white-space:pre-line;">${item.hiddenContent.replace(/\n/g,'<br>')}</div>`;

            // Footer
            if(is.footerText){
                h+=`<span class="reveal-footer${is.footerBlink?' blink':''}" style="`;
                h+=`font-family:${is.footerFont||"'Lora',serif"};`;
                h+=`color:${is.footerColor||'var(--text-muted)'};`;
                h+=`font-size:${is.footerSize||'0.7rem'};`;
                h+=`font-style:${is.footerStyle||'normal'};`;
                h+=`margin-top:${is.footerMarginTop||'10px'};`;
                h+=`">${is.footerText}</span>`;
            }

            h+=`</div></div></div>`;
            return h;
        }

        function navModal(dir){
            const ni=currentModalIndex+dir;
            if(ni>=0&&ni<filteredItems.length){modalContainer.scrollTop=0;cleanup3D();openModal(filteredItems[ni],ni)}
        }
        function closeModal(){
            modalOverlay.classList.remove('active');document.body.style.overflow='';currentModalIndex=-1;cleanup3D();
        }

        // 3D PROCEDURAL MODELS
        let active3D=[];
        function cleanup3D(){active3D.forEach(r=>r.cleanup());active3D=[];}

        function init3D(item){
            const container=document.getElementById(`model-viewer-${item.id}`);
            if(!container||!item.model3d)return;
            const cfg=item.model3d;
            try{
                const w=container.clientWidth,h=container.clientHeight;
                const scene=new THREE.Scene();
                const envCfg=cfg.environment||{};
                scene.background=new THREE.Color(envCfg.backgroundColor||'#1a1a2e');
                if(envCfg.fog)scene.fog=new THREE.Fog(new THREE.Color(envCfg.fog.color),envCfg.fog.near,envCfg.fog.far);

                const camCfg=cfg.camera||{};
                const camera=new THREE.PerspectiveCamera(camCfg.fov||45,w/h,camCfg.near||0.1,camCfg.far||100);
                const cp=camCfg.position||[0,1.5,3.5];
                camera.position.set(cp[0],cp[1],cp[2]);
                const la=camCfg.lookAt||[0,0,0];
                camera.lookAt(new THREE.Vector3(la[0],la[1],la[2]));

                const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
                renderer.setSize(w,h);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
                renderer.outputColorSpace=THREE.SRGBColorSpace;
                renderer.shadowMap.enabled=true;
                renderer.shadowMap.type=THREE.PCFSoftShadowMap;

                const hint=container.querySelector('.model-controls-hint');
                container.innerHTML='';container.appendChild(renderer.domElement);
                if(hint)container.appendChild(hint);

                const ctrlCfg=cfg.controls||{};
                const controls=new OrbitControls(camera,renderer.domElement);
                controls.enableDamping=ctrlCfg.enableDamping!==false;
                controls.dampingFactor=ctrlCfg.dampingFactor||0.05;
                controls.enableZoom=ctrlCfg.enableZoom!==false;
                controls.enablePan=ctrlCfg.enablePan!==false;
                controls.autoRotate=ctrlCfg.autoRotate!==false;
                controls.autoRotateSpeed=ctrlCfg.autoRotateSpeed||2;
                if(ctrlCfg.minDistance)controls.minDistance=ctrlCfg.minDistance;
                if(ctrlCfg.maxDistance)controls.maxDistance=ctrlCfg.maxDistance;
                if(ctrlCfg.minPolarAngle)controls.minPolarAngle=ctrlCfg.minPolarAngle;
                if(ctrlCfg.maxPolarAngle)controls.maxPolarAngle=ctrlCfg.maxPolarAngle;

                // Lighting
                const lCfg=cfg.lighting||{};
                if(lCfg.ambient)scene.add(new THREE.AmbientLight(new THREE.Color(lCfg.ambient.color),lCfg.ambient.intensity));
                if(lCfg.directional){
                    const dl=new THREE.DirectionalLight(new THREE.Color(lCfg.directional.color),lCfg.directional.intensity);
                    const dp=lCfg.directional.position;dl.position.set(dp[0],dp[1],dp[2]);
                    if(lCfg.directional.castShadow){dl.castShadow=true;dl.shadow.mapSize.set(1024,1024)}
                    scene.add(dl);
                }
                (lCfg.points||[]).forEach(p=>{
                    const pl=new THREE.PointLight(new THREE.Color(p.color),p.intensity,p.distance||10);
                    pl.position.set(p.position[0],p.position[1],p.position[2]);scene.add(pl);
                });
                if(lCfg.hemisphere){
                    scene.add(new THREE.HemisphereLight(new THREE.Color(lCfg.hemisphere.skyColor),new THREE.Color(lCfg.hemisphere.groundColor),lCfg.hemisphere.intensity));
                }

                // BUILD PROCEDURAL MODEL
                const group=buildProceduralModel(cfg);
                if(cfg.scale)group.scale.setScalar(cfg.scale);
                if(cfg.position)group.position.set(cfg.position.x,cfg.position.y,cfg.position.z);
                scene.add(group);

                let animId;
                const rot=cfg.rotation||{x:0,y:0.005,z:0};
                function animate(){
                    animId=requestAnimationFrame(animate);
                    group.rotation.x+=rot.x||0;
                    group.rotation.y+=rot.y||0;
                    group.rotation.z+=rot.z||0;
                    controls.update();renderer.render(scene,camera);
                }
                animate();

                const resizeObs=new ResizeObserver(()=>{
                    const nw=container.clientWidth,nh=container.clientHeight;
                    camera.aspect=nw/nh;camera.updateProjectionMatrix();renderer.setSize(nw,nh);
                });
                resizeObs.observe(container);

                active3D.push({cleanup:()=>{cancelAnimationFrame(animId);renderer.dispose();controls.dispose();resizeObs.disconnect()}});
            }catch(e){
                console.error('3D error:',e);
                container.innerHTML=`<div class="model-fallback"><div class="icon-3d">📦</div><div class="text">${e.message}</div></div>`;
            }
        }

        function buildProceduralModel(cfg){
            const group=new THREE.Group();
            const shape=cfg.shape;
            const p=cfg.params||{};

            function makeMat(matCfg){
                if(!matCfg)return new THREE.MeshStandardMaterial({color:'#888'});
                const isBasic=matCfg.type==='basic';
                const MatClass=isBasic?THREE.MeshBasicMaterial:THREE.MeshStandardMaterial;
                const opts={color:new THREE.Color(matCfg.color||'#888888')};
                if(!isBasic){
                    opts.roughness=matCfg.roughness??0.5;opts.metalness=matCfg.metalness??0.5;
                    if(matCfg.emissive)opts.emissive=new THREE.Color(matCfg.emissive);
                    if(matCfg.emissiveIntensity!==undefined)opts.emissiveIntensity=matCfg.emissiveIntensity;
                }
                if(matCfg.opacity!==undefined&&matCfg.opacity<1){opts.opacity=matCfg.opacity;opts.transparent=true}
                if(matCfg.transparent)opts.transparent=true;
                if(matCfg.wireframe)opts.wireframe=true;
                if(matCfg.side==='double')opts.side=THREE.DoubleSide;
                return new MatClass(opts);
            }

            switch(shape){
                case 'crumpled-paper':{
                    const geo=new THREE.PlaneGeometry(p.size||1.2,p.size||1.2,p.segments||32,p.segments||32);
                    const pos=geo.attributes.position;
                    for(let i=0;i<pos.count;i++){
                        const x=pos.getX(i),y=pos.getY(i);
                        pos.setZ(i,(Math.sin(x*5+y*3)*0.08+Math.cos(x*3-y*7)*0.06+Math.sin(x*11)*0.04)*(p.crumpleIntensity||0.4));
                    }
                    geo.computeVertexNormals();
                    group.add(new THREE.Mesh(geo,makeMat(cfg.material)));
                    break;
                }
                case 'folded-cloth':
                case 'folded-note':{
                    const fw=p.width||1.4, fh=p.height||1.0, seg=p.segments||24;
                    const geo=new THREE.PlaneGeometry(fw,fh,seg,seg);
                    const pos=geo.attributes.position;
                    for(let i=0;i<pos.count;i++){
                        const x=pos.getX(i),y=pos.getY(i);
                        const foldLine=p.foldPosition||0;
                        const foldAmt=p.foldAmount||0.15;
                        const dist=Math.abs(x-foldLine);

                    group.add(pages);
                    // Spine detail
                    const spineGeo=new THREE.BoxGeometry(0.02,bh,bd+0.005);
                    const spineMat=makeMat(p.spineMaterial||{color:'#4a3728',roughness:0.8,metalness:0.1});
                    const spine=new THREE.Mesh(spineGeo,spineMat);
                    spine.position.x=-bw/2;
                    group.add(spine);
                    // Title emboss
                    if(p.titleEmboss){
                        const tGeo=new THREE.PlaneGeometry(bw*0.6,bh*0.15);
                        const tMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.titleEmboss.color||'#ccaa66'),transparent:true,opacity:0.6,side:THREE.DoubleSide});
                        const title=new THREE.Mesh(tGeo,tMat);
                        title.position.set(0,bh*0.2,bd/2+0.005);
                        group.add(title);
                    }
                    break;
                }
                case 'vacuum':
                case 'backpack-device':{
                    // Main tank cylinder
                    const tankGeo=new THREE.CylinderGeometry(p.tankRadius||0.25,p.tankRadius||0.25,p.tankHeight||0.6,24);
                    const tankMat=makeMat(cfg.material);
                    const tank=new THREE.Mesh(tankGeo,tankMat);
                    group.add(tank);
                    // Glass viewport
                    const viewGeo=new THREE.CylinderGeometry((p.tankRadius||0.25)*0.8,(p.tankRadius||0.25)*0.8,p.tankHeight*0.5,24,1,true);
                    const viewMat=new THREE.MeshPhysicalMaterial({color:new THREE.Color(p.glassColor||'#44ff88'),transparent:true,opacity:0.2,roughness:0,clearcoat:1,side:THREE.DoubleSide});
                    const view=new THREE.Mesh(viewGeo,viewMat);
                    group.add(view);
                    // Nozzle
                    const nozzleCurve=new THREE.QuadraticBezierCurve3(
                        new THREE.Vector3(0,p.tankHeight/2,p.tankRadius||0.25),
                        new THREE.Vector3(0,p.tankHeight/2+0.3,p.tankRadius+0.3),
                        new THREE.Vector3(0,p.tankHeight/2+0.1,p.tankRadius+0.6)
                    );
                    const nozzleGeo=new THREE.TubeGeometry(nozzleCurve,12,0.03,8,false);
                    const nozzleMat=new THREE.MeshStandardMaterial({color:0x888888,metalness:0.8,roughness:0.3});
                    group.add(new THREE.Mesh(nozzleGeo,nozzleMat));
                    // Nozzle tip
                    const tipGeo=new THREE.CylinderGeometry(0.06,0.08,0.08,8);
                    const tip=new THREE.Mesh(tipGeo,nozzleMat.clone());
                    tip.position.set(0,p.tankHeight/2+0.1,(p.tankRadius||0.25)+0.6);
                    tip.rotation.x=Math.PI/2;
                    group.add(tip);
                    // Gauge
                    const gaugeGeo=new THREE.CircleGeometry(0.06,16);
                    const gaugeMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.gaugeColor||'#ff4444'),side:THREE.DoubleSide});
                    const gauge=new THREE.Mesh(gaugeGeo,gaugeMat);
                    gauge.position.set((p.tankRadius||0.25)+0.005,0.1,0);
                    gauge.rotation.y=Math.PI/2;
                    group.add(gauge);
                    // Straps
                    [-1,1].forEach(side=>{
                        const strapGeo=new THREE.BoxGeometry(0.03,p.tankHeight*0.8,0.01);
                        const strapMat=new THREE.MeshStandardMaterial({color:0x444444,roughness:0.9});
                        const strap=new THREE.Mesh(strapGeo,strapMat);
                        strap.position.set(0,0,-(p.tankRadius||0.25)-0.01+side*0.1);
                        group.add(strap);
                    });
                    break;
                }
                case 'armor-set':{
                    // Chest piece
                    const chestGeo=new THREE.CylinderGeometry(p.chestTop||0.25,p.chestBottom||0.3,p.chestHeight||0.5,8,1,true);
                    const armorMat=makeMat(cfg.material);
                    const chest=new THREE.Mesh(chestGeo,armorMat);
                    group.add(chest);
                    // Scale texture — overlapping plates
                    if(p.scaleCount){
                        for(let row=0;row<(p.scaleRows||6);row++){
                            const y=-p.chestHeight/2+row*(p.chestHeight/(p.scaleRows||6));
                            const count=p.scaleCount||8;
                            for(let i=0;i<count;i++){
                                const a=(i/count)*Math.PI*2+(row%2?Math.PI/count:0);
                                const sGeo=new THREE.PlaneGeometry(0.06,0.05);
                                const sMat=makeMat(p.scaleMaterial||cfg.material);
                                sMat.side=THREE.DoubleSide;
                                const scale=new THREE.Mesh(sGeo,sMat);
                                const r=(p.chestBottom||0.3)+0.005;
                                scale.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
                                scale.lookAt(new THREE.Vector3(0,y,0));
                                scale.rotateX(0.3);
                                group.add(scale);
                            }
                        }
                    }
                    // Shoulder guards
                    [-1,1].forEach(side=>{
                        const sGeo=new THREE.SphereGeometry(p.shoulderSize||0.12,12,8,0,Math.PI);
                        const shoulder=new THREE.Mesh(sGeo,armorMat.clone());
                        shoulder.position.set(side*(p.chestTop||0.25+0.05),p.chestHeight/2-0.05,0);
                        shoulder.rotation.z=side*0.3;
                        group.add(shoulder);
                    });
                    // Thread lines (spider silk)
                    if(p.threads){
                        for(let t=0;t<(p.threads||8);t++){
                            const a=(t/(p.threads||8))*Math.PI*2;
                            const tPts=[
                                new THREE.Vector3(Math.cos(a)*0.31,-p.chestHeight/2,Math.sin(a)*0.31),
                                new THREE.Vector3(Math.cos(a+0.2)*0.31,p.chestHeight/2,Math.sin(a+0.2)*0.31)
                            ];
                            const tGeo=new THREE.BufferGeometry().setFromPoints(tPts);
                            const tMat=new THREE.LineBasicMaterial({color:new THREE.Color(p.threadColor||'#cccccc'),transparent:true,opacity:0.4});
                            group.add(new THREE.Line(tGeo,tMat));
                        }
                    }
                    break;
                }
                case 'photo':
                case 'card':{
                    const pw=p.width||0.8,ph=p.height||0.6,pd=p.depth||0.005;
                    const cardGeo=new THREE.BoxGeometry(pw,ph,pd);
                    const cardMat=makeMat(cfg.material);
                    group.add(new THREE.Mesh(cardGeo,cardMat));
                    // Image area (lighter rectangle on front)
                    const imgGeo=new THREE.PlaneGeometry(pw*0.85,ph*0.75);
                    const imgMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.imageColor||'#887766'),side:THREE.DoubleSide});
                    const img=new THREE.Mesh(imgGeo,imgMat);
                    img.position.z=pd/2+0.001;
                    img.position.y=pd*2;
                    group.add(img);
                    // Damaged corner
                    if(p.damagedCorner){
                        const dGeo=new THREE.PlaneGeometry(pw*0.25,ph*0.3);
                        const dMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.damageColor||'#554433'),transparent:true,opacity:0.5,side:THREE.DoubleSide});
                        const dmg=new THREE.Mesh(dGeo,dMat);
                        dmg.position.set(pw*0.35,-ph*0.3,pd/2+0.002);
                        dmg.rotation.z=0.1;
                        group.add(dmg);
                    }
                    break;
                }
                case 'badge':
                case 'coin':{
                    const coinGeo=new THREE.CylinderGeometry(p.radius||0.3,p.radius||0.3,p.thickness||0.03,32);
                    const coinMat=makeMat(cfg.material);
                    const coin=new THREE.Mesh(coinGeo,coinMat);
                    coin.rotation.x=Math.PI/2;
                    group.add(coin);
                    // Emblem on front
                    if(p.emblemShape==='book'){
                        const bGeo=new THREE.PlaneGeometry(p.radius*0.6,p.radius*0.7);
                        const bMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.emblemColor||'#ffaa33'),side:THREE.DoubleSide});
                        const emblem=new THREE.Mesh(bGeo,bMat);
                        emblem.position.z=(p.thickness||0.03)/2+0.002;
                        group.add(emblem);
                    }
                    // Ring edge detail
                    const edgeGeo=new THREE.TorusGeometry(p.radius||0.3,p.thickness/2+0.005,8,32);
                    const edgeMat=makeMat(p.edgeMaterial||{color:'#aa8833',metalness:0.8,roughness:0.3});
                    const edge=new THREE.Mesh(edgeGeo,edgeMat);
                    group.add(edge);
                    break;
                }
                case 'bill':
                case 'invoice':{
                    const bw=p.width||1.4,bh=p.height||1.0;
                    const billGeo=new THREE.PlaneGeometry(bw,bh,16,16);
                    const pos=billGeo.attributes.position;
                    for(let i=0;i<pos.count;i++){
                        pos.setZ(i,Math.sin(pos.getX(i)*3)*0.01+Math.cos(pos.getY(i)*5)*0.008);
                    }
                    billGeo.computeVertexNormals();
                    const billMat=makeMat(cfg.material);billMat.side=THREE.DoubleSide;
                    group.add(new THREE.Mesh(billGeo,billMat));
                    // Seal stamp
                    if(p.seal){
                        const sealGeo=new THREE.CircleGeometry(p.seal.radius||0.08,24);
                        const sealMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.seal.color||'#1a3a6a'),transparent:true,opacity:0.7,side:THREE.DoubleSide});
                        const seal=new THREE.Mesh(sealGeo,sealMat);
                        seal.position.set(p.seal.x||0.4,p.seal.y||-0.3,0.005);
                        group.add(seal);
                    }
                    // Text lines (visual representation)
                    for(let l=0;l<(p.lineCount||8);l++){
                        const lGeo=new THREE.PlaneGeometry(bw*0.7*(0.5+Math.random()*0.5),0.008);
                        const lMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.inkColor||'#333333'),transparent:true,opacity:0.4,side:THREE.DoubleSide});
                        const line=new THREE.Mesh(lGeo,lMat);
                        line.position.set(-bw*0.05, bh*0.35-l*bh*0.08, 0.003);
                        group.add(line);
                    }
                    break;
                }
                default:{
                    // Fallback: decorative polyhedron
                    const fallbackGeo=new THREE.IcosahedronGeometry(p.radius||0.5,p.detail||1);
                    const fallbackMat=makeMat(cfg.material||{color:'#888888',wireframe:true,opacity:0.6,transparent:true});
                    group.add(new THREE.Mesh(fallbackGeo,fallbackMat));
                    break;
                }
            }
            return group;
        }

        // EVENT LISTENERS
        searchInput.addEventListener('input',e=>{searchQuery=e.target.value;applyFilters()});
        sortSelect.addEventListener('change',e=>{currentSort=e.target.value;applyFilters()});
        document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',()=>{
            document.querySelectorAll('.view-btn').forEach(x=>x.classList.remove('active'));
            b.classList.add('active');currentView=b.dataset.view;
            grid.classList.toggle('list-view',currentView==='list');
        }));
        $('modal-close').addEventListener('click',closeModal);
        modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)closeModal()});
        document.addEventListener('keydown',e=>{
            if(!modalOverlay.classList.contains('active'))return;
            if(e.key==='Escape')closeModal();
            if(e.key==='ArrowLeft')navModal(-1);
            if(e.key==='ArrowRight')navModal(1);
        });

        // PARTICLES
        (function(){
            const c=document.getElementById('particle-canvas'),ctx=c.getContext('2d');
            let ps=[];
            function resize(){c.width=innerWidth;c.height=innerHeight}
            resize();addEventListener('resize',resize);
            class P{constructor(){this.r()}
                r(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.s=Math.random()*1.5+0.3;this.sx=(Math.random()-0.5)*0.3;this.sy=(Math.random()-0.5)*0.3;this.o=Math.random()*0.3+0.05}
                u(){this.x+=this.sx;this.y+=this.sy;if(this.x<0||this.x>c.width||this.y<0||this.y>c.height)this.r()}
                d(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`rgba(201,169,110,${this.o})`;ctx.fill()}
            }
            for(let i=0;i<50;i++)ps.push(new P);
            (function a(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.u();p.d()});requestAnimationFrame(a)})();
        })();

        loadItems();
    })();
    </script>
        <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>

    <script defer src="../../core/wario-site-sounds.js"></script>
