<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Alliance Monitor</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="alliances.css">
    <link rel="stylesheet" href="app/components/factions/faction-modal.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            
            <main id="main-content">
                <header class="page-header">
                    <h1 class="page-title">🤝 Alliance Monitor</h1>
                    <p class="page-subtitle">Strategic tracking of faction coalitions, treaties, and power blocs across the multiverse.</p>
                </header>
                
                <!-- Stats Bar -->
                <div id="alliance-stats-bar" class="stats-bar">
                    <!-- Populated by JS -->
                </div>
                
                <!-- View Controls -->
                <div id="alliance-controls" class="alliance-controls">
                    <!-- Populated by JS -->
                </div>
                
                <!-- Main Content -->
                <div id="alliance-container" class="alliance-container">
                    <div class="loading-state">
                        <span class="loading-icon">🔄</span>
                        <span>Analyzing diplomatic networks...</span>
                    </div>
                </div>

            </main>
        </div>
    </div>
    
    <script type="module" src="../../core/common.js"></script>
    <script type="module" src="../navigation/navigation.js"></script>
    <script type="module" src="app/components/factions/faction-modal.js"></script>
    <script type="module" src="alliances-page.js"></script>
    <script defer src="../../core/wario-site-sounds.js"></script>
    <script defer src="../../styles/waluipedia-ambient.js"></script>
</body>
</html>
