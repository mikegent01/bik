
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Religious Demographics</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="religion.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             
            <main id="main-content">
                 <h2 class="page-title">Religious Demographics & Influence</h2>
                 <p class="page-subtitle">Analysis of spiritual allegiances, sectarian divisions, and the active edicts of religious leaders across known realms.</p>
                 
                 <div id="religion-layout">
                    <div class="religion-dashboard">
                        <div class="chart-panel">
                            <h3>Global Faith Distribution</h3>
                            <div class="canvas-wrapper">
                                <canvas id="religion-chart"></canvas>
                            </div>
                        </div>
                        <div class="edict-panel">
                            <h3>Active Religious Edicts</h3>
                            <div id="active-edicts-container">
                                <!-- Injected by JS -->
                            </div>
                        </div>
                        <!-- NEW: Daily Rituals Panel -->
                        <div class="ritual-panel" style="grid-column: span 2;">
                            <h3>Today's Liturgy & Observances</h3>
                            <div id="daily-rituals-container">
                                <!-- Injected by JS -->
                            </div>
                        </div>
                    </div>

                    <div class="religion-tree-container">
                        <!-- Groups and denominations injected by JS -->
                    </div>
                 </div>
            </main>
        </div>
    </div>

    <!-- New Full Screen Modal -->
    <div id="religion-modal" class="religion-modal-overlay">
        <div class="religion-modal-content">
            <button id="religion-modal-close" class="modal-close">&times;</button>
            <div id="religion-modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="religion.js"></script>
    <script defer src="../../core/app/core/wario-site-sounds.js"></script>
    <script defer src="waluipedia-ambient.js"></script>
</body>
</html>
