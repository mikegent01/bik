<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waluigi Terminal | Cosmic Council</title>
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/Reputation-Matrix2/app/styles/components.css">
    
    <!-- System Specific Styles -->
    <link rel="stylesheet" href="app/components/factions/faction-modal.css">
    <link rel="stylesheet" href="cosmic-council.css"> <!-- Make sure to save the CSS from the previous step here -->
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            
            <main id="main-content">
                <!-- The JS renders its own header, so we just provide the container -->
                
                <!-- The Cosmic Council System Container -->
                <div id="cosmic-council-container">
                    <!-- Javascript will render content here -->
                    <div class="loading-state">
                        Establishing Diplomatic Uplink...
                        <br>
                        <small>Decrypting Senate Protocols</small>
                    </div>
                </div>

            </main>
        </div>
    </div>
    
<!-- Core Scripts -->
<script type="module" src="common.js"></script>
<script type="module" src="navigation.js"></script>
<script type="module" src="app/components/factions/faction-modal.js"></script>

<!-- Council System Script -->
<script type="module">
    // Adjust the path below if your JS file is in a subfolder like './GlobeHead/cosmic-council.js'
    import { renderCosmicCouncil, initCosmicCouncilListeners } from './cosmic-council.js';
     
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('cosmic-council-container');
        
        // Slight delay to simulate terminal connecting
        setTimeout(() => {
            if (container) {
                container.innerHTML = renderCosmicCouncil();
                initCosmicCouncilListeners();
            }
        }, 300);
    });
</script>
    <script defer src="../../core/app/core/wario-site-sounds.js"></script>
    <script defer src="../../styles/app/styles/waluipedia-ambient.js"></script>
</body>
</html>
