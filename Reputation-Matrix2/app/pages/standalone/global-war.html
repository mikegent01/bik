<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waluigi Terminal | Multiverse Conflict</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="mushroom-kingdom-civil-war.css">
    <link rel="stylesheet" href="app/components/factions/faction-modal.css">  <!-- ADD THIS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Native Walupedia Ecosystem Header -->
    <div style="background: linear-gradient(90deg, #1f1245, #0f0a21); border-bottom: 2px solid #8a4bff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'Roboto Mono', monospace; z-index: 9999; position: relative;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 20px;">⚡</span>
            <div>
                <b style="color: #ffd700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Orbitron', sans-serif;">Walupedia War Monitor</b>
                <div style="color: #a78bfa; font-size: 11px;">Part of the Unified Waluigi Terminal Ecosystem</div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="location.href='battlefield.html#/power'" style="background: #8a4bff; border: 1px solid #c084fc; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.15s; outline: none; font-family: 'Roboto Mono', monospace;">
                📖 View in Wiki App
            </button>
            <button onclick="location.href='battlefield.html'" style="background: transparent; border: 1px solid #4b5563; color: #9ca3af; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.15s; outline: none; font-family: 'Roboto Mono', monospace;">
                🏠 Walupedia Home
            </button>
        </div>
    </div>

    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            
            <main id="main-content">
                <header class="page-header">
                    <h1 class="page-title">Global War Monitor</h1>
                </header>
                
                <!-- The Global War System Container -->
                <div id="global-war-container">
                    <!-- Javascript will render content here -->
                    <div class="loading-state">Initializing Global Satellites...</div>
                </div>

            </main>
        </div>
    </div>
    
<script type="module" src="common.js"></script>
<script type="module" src="navigation.js"></script>
<script type="module" src="app/components/factions/faction-modal.js"></script>  <!-- ADD THIS -->
<script type="module">
    import { renderGlobalWar, initGlobalWarListeners } from './GlobeHead/global-war.js';
    
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('global-war-container');
        if (container) {
            container.innerHTML = renderGlobalWar();
            initGlobalWarListeners();
        }
    });
</script>
    <script defer src="wario-site-sounds.js"></script>
    <script defer src="waluipedia-ambient.js"></script>
</body>
</html>
