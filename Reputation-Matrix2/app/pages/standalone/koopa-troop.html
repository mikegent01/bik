<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Room Terminal | Koopa Troop Command</title>
    <meta name="description" content="Koopa Troop Military Intelligence War Room - Classified Command Interface">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="faction-koopa.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/factions/koopa-troop.png">
    
    <style>
        /* Critical CSS - Prevent flash of unstyled content */
        body {
            background: #050805;
            color: #b8c8b8;
            margin: 0;
            padding: 0;
            font-family: 'Roboto Mono', monospace;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #050805;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-emblem {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loading-text {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #c9a227;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: blink 1s ease-in-out infinite;
        }
        
        .loading-bar {
            width: 200px;
            height: 4px;
            background: #1a211a;
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a472a, #2d5a3d, #c9a227);
            width: 0%;
            animation: loadingProgress 2s ease-out forwards;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes loadingProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-emblem">🐢👑</div>
        <div class="loading-text">Initializing War Room</div>
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        
        <div id="app" class="koopa-theme">
            <!-- Sidebar placeholder (populated by navigation.js if needed) -->
            
            
            <!-- Main Content Area - War Room renders here -->
            <main id="main-content" class="faction-page">
                <!-- 
                    The KoopaWarRoom JavaScript class will render 
                    the entire interface into this container.
                    
                    Structure generated:
                    - Crisis Ticker (top scrolling alerts)
                    - Intel Sidebar (left panel with nav & intel feed)
                    - Main Content:
                        - Crisis Command Center
                        - Strategic Priorities
                        - Chain of Command
                        - Koopalings
                        - Military Forces
                        - Territories
                        - Foreign Relations
                        - Timeline
                        - Codex
                -->
                
                <!-- Fallback content if JS fails -->
                <noscript>
                    <div style="padding: 2rem; text-align: center;">
                        <h1 style="color: #c9a227;">⚠️ JavaScript Required</h1>
                        <p>The Koopa Troop War Room Terminal requires JavaScript to function.</p>
                        <p>Please enable JavaScript and refresh the page.</p>
                    </div>
                </noscript>
            </main>
        </div>
    </div>

    <!-- Core System Scripts -->
    <script type="module">
        // Import and initialize
        import { initKoopaWarRoom } from './faction-koopa.js';
        
        // Hide loading screen after initialization
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => loadingScreen.remove(), 500);
                }
            }, 1500); // Minimum display time for loading screen
        });
    </script>
    
    <!-- Fallback for module loading issues -->
    <script>
        // If modules fail, try direct script loading
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('module')) {
                console.warn('[KoopaWarRoom] Module loading failed, attempting fallback...');
                // Could load a non-module version here if needed
            }
        });
    </script>
    
    <!-- Optional: Additional scripts -->
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script defer src="wario-site-sounds.js"></script>
    <script defer src="waluipedia-ambient.js"></script>
</body>
</html>
