<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regal Empire - Capital Region Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Georgia', serif; overflow: hidden; }
  
  #map-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }
  #map-container:active { cursor: grabbing; }
  
  #map-svg {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: linear-gradient(135deg, rgba(10,8,20,0.97), rgba(25,15,40,0.97));
    border: 1px solid #8b6914;
    border-radius: 4px;
    padding: 12px 16px;
    max-width: 280px;
    color: #d4b896;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8), inset 0 0 30px rgba(100,60,0,0.05);
  }
  #tooltip h3 {
    color: #f0d080;
    font-size: 13px;
    margin-bottom: 6px;
    border-bottom: 1px solid #5a3a0a;
    padding-bottom: 4px;
  }
  #tooltip .type-badge {
    display: inline-block;
    font-size: 9px;
    background: rgba(139,105,20,0.3);
    border: 1px solid #6a4a10;
    color: #c0a060;
    padding: 1px 6px;
    border-radius: 10px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #tooltip p { line-height: 1.5; font-size: 11px; color: #b09070; }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: linear-gradient(135deg, rgba(10,8,20,0.95), rgba(20,12,35,0.95));
    border: 1px solid #6a4a10;
    border-radius: 6px;
    padding: 12px 16px;
    color: #c0a060;
    font-size: 11px;
    z-index: 500;
    min-width: 160px;
  }
  #legend h4 {
    color: #f0d080;
    font-size: 12px;
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Title */
  #map-title {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 500;
    pointer-events: none;
  }
  #map-title h1 {
    font-size: 22px;
    color: #f0d080;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(200,150,0,0.5), 2px 2px 4px rgba(0,0,0,0.9);
  }
  #map-title p {
    font-size: 11px;
    color: #8a7050;
    letter-spacing: 3px;
    margin-top: 4px;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 500;
  }
  .ctrl-btn {
    width: 36px; height: 36px;
    background: rgba(10,8,20,0.95);
    border: 1px solid #6a4a10;
    border-radius: 4px;
    color: #f0d080;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .ctrl-btn:hover { background: rgba(100,60,10,0.4); }

  #compass {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 70px;
    height: 70px;
    z-index: 500;
  }
</style>
</head>
<body>

<div id="map-container">
  <svg id="map-svg" width="2400" height="1600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sky/atmosphere gradient -->
      <radialGradient id="skyGrad" cx="55%" cy="10%" r="60%">
        <stop offset="0%" stop-color="#1a1a3a"/>
        <stop offset="100%" stop-color="#0a0810"/>
      </radialGradient>

      <!-- Ocean/sea gradient - east -->
      <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0d2a4a"/>
        <stop offset="50%" stop-color="#0a1e3a"/>
        <stop offset="100%" stop-color="#061428"/>
      </linearGradient>

      <!-- Aona's Scorn lake gradient -->
      <radialGradient id="aonaGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#4a8fa8"/>
        <stop offset="40%" stop-color="#2a6a80"/>
        <stop offset="100%" stop-color="#1a3a50"/>
      </radialGradient>

      <!-- Black Lake gradient -->
      <radialGradient id="blackLakeGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#0d1520"/>
        <stop offset="60%" stop-color="#080e18"/>
        <stop offset="100%" stop-color="#030608"/>
      </radialGradient>

      <!-- Land gradient - plains -->
      <linearGradient id="plainsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2a3020"/>
        <stop offset="50%" stop-color="#1e2818"/>
        <stop offset="100%" stop-color="#182015"/>
      </linearGradient>

      <!-- Snow/ice terrain -->
      <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d8e8f0"/>
        <stop offset="100%" stop-color="#a0b8c8"/>
      </linearGradient>

      <!-- Mountain gradient -->
      <linearGradient id="mtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e8eef5"/>
        <stop offset="30%" stop-color="#8a9aaa"/>
        <stop offset="70%" stop-color="#5a6a7a"/>
        <stop offset="100%" stop-color="#3a4a5a"/>
      </linearGradient>

      <!-- Permafrost forest gradient -->
      <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a2f22"/>
        <stop offset="100%" stop-color="#0f1e16"/>
      </linearGradient>

      <!-- Golden Slopes gradient -->
      <linearGradient id="goldenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4a3a10"/>
        <stop offset="50%" stop-color="#3a2c0a"/>
        <stop offset="100%" stop-color="#2a2008"/>
      </linearGradient>

      <!-- Glow filter for important POI -->
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Noise texture for terrain -->
      <filter id="terrainNoise">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
        <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
        <feComposite in="blend" in2="SourceGraphic" operator="in"/>
      </filter>

      <!-- Ice texture filter -->
      <filter id="iceFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="4" result="noise"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.85  0 0 0 0 0.95  0 0 0 0.15 0" in="noise" result="colorNoise"/>
        <feBlend in="SourceGraphic" in2="colorNoise" mode="screen"/>
      </filter>

      <!-- Clip paths -->
      <clipPath id="mapBounds">
        <rect x="0" y="0" width="2400" height="1600"/>
      </clipPath>

      <!-- Road dash pattern -->
      <pattern id="roadDash" x="0" y="0" width="20" height="1" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="12" height="1" fill="#8a7040"/>
      </pattern>

      <!-- Tree symbol for forests -->
      <symbol id="tree" viewBox="0 0 10 16">
        <polygon points="5,0 10,10 7,10 7,16 3,16 3,10 0,10" fill="#1a3a22" opacity="0.8"/>
      </symbol>

      <!-- Snow tree -->
      <symbol id="snowTree" viewBox="0 0 10 16">
        <polygon points="5,0 10,10 7,10 7,16 3,16 3,10 0,10" fill="#2a4a30" opacity="0.7"/>
        <polygon points="5,0 9,8 6,8" fill="#dce8f0" opacity="0.5"/>
      </symbol>

      <!-- Mountain symbol -->
      <symbol id="mtnSym" viewBox="0 0 40 30">
        <polygon points="20,0 40,30 0,30" fill="#6a7a8a" stroke="#8a9aaa" stroke-width="0.5"/>
        <polygon points="20,0 28,12 12,12" fill="#d8e8f0" opacity="0.9"/>
        <polygon points="30,8 40,30 20,30" fill="#4a5a6a" opacity="0.6"/>
      </symbol>

    </defs>

    <!-- ===================== BASE TERRAIN ===================== -->
    <g clip-path="url(#mapBounds)">

    <!-- Background - deep night sky/void -->
    <rect width="2400" height="1600" fill="url(#skyGrad)"/>

    <!-- ===== INTERNET SEA (East) ===== -->
    <path d="M 1700,0 L 2400,0 L 2400,1600 L 1700,1600 
             Q 1650,1400 1680,1200 Q 1660,1000 1700,800 
             Q 1680,600 1660,400 Q 1700,200 1700,0 Z"
          fill="url(#seaGrad)" opacity="0.95"/>

    <!-- Sea surface shimmer lines -->
    <g opacity="0.15" stroke="#4a8aba" stroke-width="0.8">
      <path d="M 1720,80 Q 1800,85 1880,80 Q 1960,75 2040,80"/>
      <path d="M 1730,160 Q 1830,165 1930,158 Q 2030,152 2130,158"/>
      <path d="M 1715,240 Q 1820,248 1920,242 Q 2020,236 2120,242"/>
      <path d="M 1725,320 Q 1840,328 1940,322 Q 2040,316 2150,322"/>
      <path d="M 1720,400 Q 1830,408 1940,402 Q 2050,396 2160,402"/>
      <path d="M 1730,480 Q 1840,488 1950,482 Q 2060,476 2170,482"/>
      <path d="M 1718,560 Q 1828,568 1938,562 Q 2048,556 2168,562"/>
      <path d="M 1726,640 Q 1836,648 1946,642 Q 2056,636 2176,642"/>
      <path d="M 1720,720 Q 1840,728 1950,722 Q 2060,716 2180,722"/>
      <path d="M 1728,800 Q 1848,808 1958,802 Q 2068,796 2188,802"/>
      <path d="M 1722,880 Q 1842,888 1952,882 Q 2062,876 2192,882"/>
      <path d="M 1730,960 Q 1850,968 1960,962 Q 2070,956 2200,962"/>
      <path d="M 1724,1040 Q 1844,1048 1954,1042 Q 2064,1036 2204,1042"/>
      <path d="M 1732,1120 Q 1852,1128 1962,1122 Q 2072,1116 2212,1122"/>
      <path d="M 1726,1200 Q 1846,1208 1956,1202 Q 2066,1196 2216,1202"/>
      <path d="M 1734,1280 Q 1854,1288 1964,1282 Q 2074,1276 2224,1282"/>
      <path d="M 1728,1360 Q 1848,1368 1958,1362 Q 2068,1356 2228,1362"/>
      <path d="M 1736,1440 Q 1856,1448 1966,1442 Q 2076,1436 2236,1442"/>
      <path d="M 1730,1520 Q 1850,1528 1960,1522 Q 2070,1516 2240,1522"/>
    </g>

    <!-- Internet Sea label background glow -->
    <ellipse cx="2050" cy="800" rx="250" ry="400" fill="#0a2040" opacity="0.3"/>

    <!-- ===== MAIN LAND MASS ===== -->
    <!-- Central plains and terrain -->
    <path d="M 0,0 L 1700,0 Q 1700,200 1660,400 Q 1680,600 1700,800 
             Q 1660,1000 1680,1200 Q 1650,1400 1700,1600 
             L 0,1600 Z"
          fill="url(#plainsGrad)"/>

    <!-- ===== MOUNTAIN RANGE - Northern Wall ===== -->
    <!-- These mountains run across the top, with Mighdural built into them -->
    <!-- Base mountain mass - dark rock -->
    <path d="M -50,0 L 200,380 L 350,200 L 500,420 L 650,180 L 800,440 
             L 900,260 L 1000,480 L 1100,300 L 1200,500 L 1350,280 
             L 1500,460 L 1600,200 L 1700,350 L 1700,0 Z"
          fill="#2a3040" opacity="0.95"/>

    <!-- Mountain layer 2 - grey rock faces -->
    <path d="M -50,0 L 150,340 L 300,160 L 480,390 L 620,160 L 780,400 
             L 880,230 L 980,450 L 1080,270 L 1180,470 L 1320,250 
             L 1480,430 L 1600,180 L 1700,320 L 1700,0 Z"
          fill="#3a4555" opacity="0.9"/>

    <!-- Snow caps on mountains -->
    <path d="M 150,340 L 200,260 L 250,320 L 300,160 L 350,240 
             L 420,200 L 480,390 L 530,310 L 580,260 L 620,160 L 680,240 
             L 740,200 L 780,400 L 820,310 L 860,260 L 900,220 L 940,290
             L 980,450 L 1020,360 L 1060,310 L 1100,260 L 1140,340
             L 1180,470 L 1220,370 L 1280,290 L 1320,250 L 1370,320
             L 1430,260 L 1480,430 L 1520,330 L 1560,250 L 1600,180 
             L 1640,260 L 1700,320 L 1700,0 L -50,0 Z"
          fill="#c8d8e8" opacity="0.85"/>

    <!-- Snow highlight -->
    <path d="M 300,160 L 340,200 L 350,160 L 370,190 L 400,160 
             M 620,160 L 660,200 L 680,160 L 700,195 L 720,160
             M 1080,270 L 1100,240 L 1120,260 L 1140,240 L 1160,260
             M 1320,250 L 1350,220 L 1370,240 L 1390,220"
          stroke="#e8f0f8" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Individual mountain peaks - rendered as triangles for detail -->
    <!-- Far west peaks -->
    <polygon points="80,350 120,120 160,350" fill="#4a5060" opacity="0.8"/>
    <polygon points="120,120 140,80 160,120" fill="#d0dde8" opacity="0.9"/>
    
    <polygon points="200,380 250,140 300,380" fill="#3a4555" opacity="0.85"/>
    <polygon points="250,140 270,90 290,140" fill="#c8d8e8" opacity="0.9"/>
    
    <polygon points="340,200 390,60 440,200" fill="#4a5060" opacity="0.8"/>
    <polygon points="390,60 405,20 420,60" fill="#dde8f0" opacity="0.95"/>

    <!-- Central peaks near Mighdural -->
    <polygon points="720,300 780,80 840,300" fill="#3a4555" opacity="0.9"/>
    <polygon points="780,80 800,30 820,80" fill="#e0ecf5" opacity="0.95"/>
    
    <polygon points="820,320 880,100 940,320" fill="#4a5060" opacity="0.85"/>
    <polygon points="880,100 900,40 920,100" fill="#d8e8f0" opacity="0.9"/>

    <!-- East peaks -->
    <polygon points="1200,400 1260,140 1320,400" fill="#3a4555" opacity="0.85"/>
    <polygon points="1260,140 1285,70 1310,140" fill="#dde8f0" opacity="0.9"/>
    
    <polygon points="1400,340 1460,110 1520,340" fill="#4a5060" opacity="0.8"/>
    <polygon points="1460,110 1480,50 1500,110" fill="#c8d8e8" opacity="0.9"/>

    <!-- ===== AONA'S SCORN LAKE ===== -->
    <!-- Large frozen lake, western-central, partially frozen -->
    <path d="M 100,500 Q 80,550 70,620 Q 50,700 60,780 
             Q 40,860 60,940 Q 50,1020 80,1080 
             Q 120,1150 200,1180 Q 280,1200 360,1190 
             Q 440,1195 510,1170 Q 570,1140 580,1080 
             Q 600,1010 580,940 Q 600,870 580,800 
             Q 560,730 540,660 Q 510,590 470,550 
             Q 420,510 360,500 Q 280,490 200,495 Q 150,498 100,500 Z"
          fill="url(#aonaGrad)" opacity="0.9"/>

    <!-- Ice sheet on lake surface -->
    <path d="M 150,520 Q 200,510 280,515 Q 360,510 430,530 
             Q 480,560 500,620 Q 520,680 510,750 
             Q 520,820 500,890 Q 490,950 460,1000 
             Q 420,1050 360,1070 Q 290,1085 220,1075 
             Q 160,1060 130,1010 Q 100,960 110,900 
             Q 90,840 110,780 Q 100,720 120,660 
             Q 140,600 150,560 Z"
          fill="#a8ccd8" opacity="0.4"/>

    <!-- Ice cracks on lake -->
    <g stroke="#c8dde8" stroke-width="1" opacity="0.5" fill="none">
      <path d="M 200,550 L 220,600 L 240,620 L 260,680"/>
      <path d="M 350,520 L 370,580 L 360,640 L 380,700"/>
      <path d="M 150,750 L 180,780 L 200,830 L 190,880"/>
      <path d="M 450,700 L 430,750 L 440,810 L 420,860"/>
      <path d="M 280,900 L 310,940 L 300,980 L 320,1020"/>
    </g>

    <!-- Frozen shore ice chunks -->
    <ellipse cx="130" cy="540" rx="30" ry="12" fill="#b8d5e0" opacity="0.7" transform="rotate(-15,130,540)"/>
    <ellipse cx="500" cy="640" rx="25" ry="10" fill="#b0cdd8" opacity="0.6" transform="rotate(10,500,640)"/>
    <ellipse cx="120" cy="920" rx="20" ry="8" fill="#b8d5e0" opacity="0.65"/>
    <ellipse cx="540" cy="880" rx="22" ry="9" fill="#b0cdd8" opacity="0.6" transform="rotate(-8,540,880)"/>
    <ellipse cx="200" cy="1140" rx="28" ry="11" fill="#b8d5e0" opacity="0.65" transform="rotate(12,200,1140)"/>

    <!-- Lake shore gradient -->
    <path d="M 100,500 Q 80,550 70,620 Q 50,700 60,780 
             Q 40,860 60,940 Q 50,1020 80,1080 
             Q 120,1150 200,1180 Q 280,1200 360,1190 
             Q 440,1195 510,1170 Q 570,1140 580,1080 
             Q 600,1010 580,940 Q 600,870 580,800 
             Q 560,730 540,660 Q 510,590 470,550 
             Q 420,510 360,500 Q 280,490 200,495 Q 150,498 100,500 Z"
          fill="none" stroke="#5a9ab8" stroke-width="2" opacity="0.5"/>

    <!-- ===== BLACK LAKE - Far South-East ===== -->
    <path d="M 1380,1300 Q 1340,1280 1310,1310 Q 1280,1340 1270,1380 
             Q 1260,1420 1280,1460 Q 1300,1500 1340,1520 
             Q 1380,1540 1430,1530 Q 1480,1515 1510,1480 
             Q 1540,1440 1530,1400 Q 1520,1360 1490,1335 
             Q 1450,1310 1420,1300 Z"
          fill="url(#blackLakeGrad)" opacity="0.95"/>

    <!-- Dark mist around black lake -->
    <ellipse cx="1400" cy="1415" rx="160" ry="100" fill="#050810" opacity="0.4"/>
    <path d="M 1380,1300 Q 1340,1280 1310,1310 Q 1280,1340 1270,1380 
             Q 1260,1420 1280,1460 Q 1300,1500 1340,1520 
             Q 1380,1540 1430,1530 Q 1480,1515 1510,1480 
             Q 1540,1440 1530,1400 Q 1520,1360 1490,1335 
             Q 1450,1310 1420,1300 Z"
          fill="none" stroke="#1a0a28" stroke-width="3" opacity="0.8"/>

    <!-- Eerie glow from black lake -->
    <ellipse cx="1400" cy="1415" rx="120" ry="80" fill="none" stroke="#2a0a3a" stroke-width="8" opacity="0.3"/>

    <!-- ===== MIGHDURLAN PERMAFROST FOREST ===== -->
    <!-- North-east region, between mountains and coast -->
    <path d="M 900,380 Q 1000,360 1100,370 Q 1200,360 1300,370 
             Q 1400,360 1500,370 Q 1600,360 1700,380 
             L 1700,600 Q 1600,610 1500,600 Q 1400,610 1300,600 
             Q 1200,610 1100,600 Q 1000,610 900,600 Z"
          fill="url(#forestGrad)" opacity="0.9"/>

    <!-- Forest extending south-east -->
    <path d="M 1100,600 Q 1200,590 1300,600 Q 1400,590 1500,600 
             Q 1600,590 1700,600 L 1700,800 
             Q 1600,810 1500,800 Q 1400,810 1300,800 
             Q 1200,810 1100,800 Q 1050,810 1000,800 
             Q 970,790 980,750 Q 990,700 1000,680 
             Q 1020,640 1050,620 Q 1080,605 1100,600 Z"
          fill="#162210" opacity="0.85"/>

    <!-- ===== GOLDEN SLOPES - South of permafrost ===== -->
    <path d="M 900,800 Q 1000,780 1100,800 Q 1200,780 1300,800 
             Q 1400,780 1500,800 Q 1600,780 1700,800 
             L 1700,1100 Q 1600,1090 1500,1100 Q 1400,1090 1300,1100 
             Q 1200,1090 1100,1100 Q 1000,1090 900,1100 
             Q 850,1090 820,1060 Q 800,1020 810,980 
             Q 820,940 840,900 Q 870,850 900,800 Z"
          fill="url(#goldenGrad)" opacity="0.9"/>

    <!-- Golden slopes terrain variation -->
    <path d="M 950,820 Q 1050,810 1150,820 Q 1250,810 1350,820 
             Q 1450,810 1550,820 Q 1650,810 1700,820 
             L 1700,860 Q 1600,870 1500,860 Q 1400,870 1300,860 
             Q 1200,870 1100,860 Q 1000,870 950,860 Z"
          fill="#5a4820" opacity="0.3"/>

    <!-- ===== RIVER SYSTEM ===== -->
    <!-- Main River from mountains flowing through plains -->
    <!-- River 1: From mountain pass near Mighdural to Aona's Scorn -->
    <path d="M 900,430 Q 860,500 820,560 Q 790,620 770,680 
             Q 750,740 720,780 Q 690,820 660,860 
             Q 620,900 570,930 Q 530,950 510,980 
             Q 510,1010 530,1040 Q 555,1070 555,1080"
          stroke="#4a8ab8" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 900,430 Q 860,500 820,560 Q 790,620 770,680 
             Q 750,740 720,780 Q 690,820 660,860 
             Q 620,900 570,930 Q 530,950 510,980 
             Q 510,1010 530,1040 Q 555,1070 555,1080"
          stroke="#6aaad8" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- River 2: Through central plains east to the sea -->
    <path d="M 950,450 Q 980,520 1000,600 Q 1020,680 1030,760 
             Q 1040,840 1060,900 Q 1080,960 1100,1020 
             Q 1120,1080 1150,1130 Q 1180,1170 1220,1200 
             Q 1280,1230 1350,1240 Q 1450,1248 1560,1250 
             Q 1640,1252 1700,1250"
          stroke="#4a8ab8" stroke-width="3.5" fill="none" opacity="0.65"/>

    <!-- River delta near coast -->
    <path d="M 1640,1245 Q 1660,1230 1680,1215 Q 1700,1200 1710,1185"
          stroke="#4a8ab8" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 1655,1252 Q 1675,1258 1695,1265 Q 1705,1268 1710,1260"
          stroke="#4a8ab8" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- River 3: Smaller stream from west mountains -->
    <path d="M 350,380 Q 370,440 380,510 Q 385,560 375,600 
             Q 365,640 350,670 Q 330,700 310,720 
             Q 280,750 250,760 Q 200,770 160,760 
             Q 120,750 100,730 Q 80,710 80,700"
          stroke="#4a8ab8" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- ===== CENTRAL PLAINS TERRAIN ===== -->
    <!-- Rolling hills indicators -->

<script>
  const container = document.getElementById('map-container');
  const svg = document.getElementById('map-svg');
  const tooltip = document.getElementById('tooltip');

  let scale = 0.45;
  let panX = 0;
  let panY = 0;
  let isDragging = false;
  let lastX, lastY;
  const minScale = 0.2;
  const maxScale = 3.0;

  function applyTransform() {
    svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  // Initialize view centered
  function initView() {
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const sw = 2400 * scale;
    const sh = 1600 * scale;
    panX = (cw - sw) / 2;
    panY = (ch - sh) / 2;
    applyTransform();
  }

  // Zoom controls
  document.getElementById('zoomIn').addEventListener('click', () => {
    const cx = container.clientWidth / 2;
    const cy = container.clientHeight / 2;
    const newScale = Math.min(scale * 1.3, maxScale);
    panX = cx - (cx - panX) * (newScale / scale);
    panY = cy - (cy - panY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  });

  document.getElementById('zoomOut').addEventListener('click', () => {
    const cx = container.clientWidth / 2;
    const cy = container.clientHeight / 2;
    const newScale = Math.max(scale / 1.3, minScale);
    panX = cx - (cx - panX) * (newScale / scale);
    panY = cy - (cy - panY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  });

  document.getElementById('resetView').addEventListener('click', () => {
    scale = 0.45;
    initView();
  });

  // Mouse wheel zoom
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.12 : 0.88;
    const newScale = Math.max(minScale, Math.min(maxScale, scale * delta));
    panX = mx - (mx - panX) * (newScale / scale);
    panY = my - (my - panY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Pan
  container.addEventListener('mousedown', (e) => {
    if (e.target.closest('.poi-marker')) return;
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    container.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    applyTransform();
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    container.style.cursor = 'grab';
  });

  // Touch pan
  let touchLastX, touchLastY, pinchDist = null;
  container.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchLastX = e.touches[0].clientX;
      touchLastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && pinchDist === null) {
      panX += e.touches[0].clientX - touchLastX;
      panY += e.touches[0].clientY - touchLastY;
      touchLastX = e.touches[0].clientX;
      touchLastY = e.touches[0].clientY;
      applyTransform();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const newScale = Math.max(minScale, Math.min(maxScale, scale * (dist / pinchDist)));
      panX = midX - (midX - panX) * (newScale / scale);
      panY = midY - (midY - panY) * (newScale / scale);
      scale = newScale;
      pinchDist = dist;
      applyTransform();
    }
  }, { passive: false });

  container.addEventListener('touchend', () => { pinchDist = null; });

  // Tooltip on POI markers
  const markers = document.querySelectorAll('.poi-marker');
  markers.forEach(marker => {
    marker.style.cursor = 'pointer';

    marker.addEventListener('mouseenter', (e) => {
      const name = marker.dataset.name || '';
      const type = marker.dataset.type || '';
      const desc = marker.dataset.desc || '';

      document.getElementById('tt-name').textContent = name;
      document.getElementById('tt-type').textContent = type.replace(/_/g,' ');
      document.getElementById('tt-desc').textContent = desc;

      tooltip.style.display = 'block';
      positionTooltip(e);
    });

    marker.addEventListener('mousemove', positionTooltip);

    marker.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });

  function positionTooltip(e) {
    const tw = tooltip.offsetWidth || 280;
    const th = tooltip.offsetHeight || 120;
    let tx = e.clientX + 15;
    let ty = e.clientY - 10;
    if (tx + tw > window.innerWidth - 10) tx = e.clientX - tw - 15;
    if (ty + th > window.innerHeight - 10) ty = e.clientY - th;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  }

  window.addEventListener('resize', initView);
  initView();
</script>

    <script defer src="../../styles/waluipedia-ambient.js"></script>
