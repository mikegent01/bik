AURELIAN CORVINARUS: Feyward lady of the manor. Plays the delicate host. The broken magic circle is in her domain.`}]}],Ea=[...fy,...dy,...hy];function Aa(v){try{const D=new(window.AudioContext||window.webkitAudioContext),R=D.currentTime,c=D.createOscillator(),C=D.createGain();c.connect(C),C.connect(D.destination),v==="page"?(c.frequency.setValueAtTime(220,R),c.frequency.exponentialRampToValueAtTime(110,R+.15),C.gain.setValueAtTime(.1,R),C.gain.exponentialRampToValueAtTime(.001,R+.18),c.start(R),c.stop(R+.18)):v==="dice"?(c.type="sawtooth",c.frequency.setValueAtTime(400,R),c.frequency.exponentialRampToValueAtTime(80,R+.3),C.gain.setValueAtTime(.12,R),C.gain.exponentialRampToValueAtTime(.001,R+.3),c.start(R),c.stop(R+.3)):v==="lock"?(c.type="square",c.frequency.setValueAtTime(800,R),c.frequency.setValueAtTime(600,R+.05),c.frequency.setValueAtTime(900,R+.1),C.gain.setValueAtTime(.08,R),C.gain.exponentialRampToValueAtTime(.001,R+.18),c.start(R),c.stop(R+.2)):v==="secret"?(c.type="sine",c.frequency.setValueAtTime(300,R),c.frequency.exponentialRampToValueAtTime(800,R+.4),c.frequency.exponentialRampToValueAtTime(400,R+.7),C.gain.setValueAtTime(.07,R),C.gain.setValueAtTime(.09,R+.3),C.gain.exponentialRampToValueAtTime(.001,R+.8),c.start(R),c.stop(R+.8)):v==="alert"?(c.type="square",c.frequency.setValueAtTime(880,R),C.gain.setValueAtTime(.07,R),C.gain.exponentialRampToValueAtTime(.001,R+.12),c.start(R),c.stop(R+.12)):(c.frequency.setValueAtTime(440,R),C.gain.setValueAtTime(.04,R),C.gain.exponentialRampToValueAtTime(.001,R+.1),c.start(R),c.stop(R+.1))}catch{}}const yo={"party-004":[{dc:14,label:"Arcana — Mirror Inscription",partial:"The marks are abjuration and conjuration in origin. Complex interaction.",success:"The back of the mirror holds a planar travel inscription — modified dimensional doorway. Transforms the mirror into a PERSISTENT gateway linking to a partner mirror.",critical:"The calibration marks show the partner mirror is NOT in this plane. Temporal decay coefficients indicate a destination with significantly different temporal flow — likely the Shadowfell or Feywild. The mirror was USED, repeatedly, before something shattered it from the other side.",crossRef:{entryId:"post-lore",label:"→ Three Manors Compendium"}},{dc:18,label:"Investigation — Under Display Cases",partial:"Something dark glints under one of the cases.",success:"Four small black crystals, unnaturally dark, warm to the touch. They numb the fingers through gloves. Erudite Passage components.",critical:"A folded page torn from Darius' journal: 'On Forging An Arcane Tether' — describes binding a living anchor to a planar gateway so it remains open even after the caster departs. The cost: the anchor remains tethered indefinitely.",crossRef:{entryId:"pre-012",label:"→ PL1 Classification Entry"}}],"pre-011":[{dc:15,label:"Arcana — The Hidden Circle",partial:"This circle was once used to create a doorway to a specific location, modified from standard teleportation circles.",success:"Where normally magic circles only serve as anchoring points, this one designates a target itself — drawing power from an outside source, allowing it to send a user to a set point when activated without a caster.",critical:"The target coordinates encoded in the remaining symbols match the Feyward Manor. Built by Darius to reach Orantha after the mirror gateway closed. Never finished. If repaired — estimated 4 days — it would activate automatically at month's end.",crossRef:{entryId:"post-004",label:"→ Planar Shards Entry"}}],"pre-015":[{dc:16,label:"Investigation — Shadow Burns",partial:"The chairs have shadowy silhouettes burned permanently into their surfaces. Something terrible happened here.",success:"Shadow burns — like nuclear shadows but arcane. Permanent. One profile is unmistakably screaming. Multiple people were merged into a single entity by magical catastrophe.",critical:"The carved words on the Burn Room walls are from merged consciousnesses — the Seneschal and several se
