ey were not locked. That is the first thing I noted."},{type:"text",content:"Captain Danos assessed the exterior in under ten minutes — she moves through an environment the way a surgeon moves through an incision. Precise, deliberate, already composing the report before she's finished looking. She told me to set up inside, told Apprentice Fennick to catalogue the grounds, told Surveyor Mott to take spectral readings from the courtyard, and told Apprentice Yael to stop touching things. This took her approximately thirty seconds."},{type:"box",style:"lore",label:"Lore Note — The Cornelius Family",content:`Guild records indicate the manor belonged to the Cornelius line for at least four generations — the last confirmed occupant being one Orantha Cornelius, referred to in older documents as "the Oracle of Raventree." What the Oracle did here, exactly, is not recorded in public Guild files. The private files I was given access to describe her work as "planar cartography" — mapping dimensional boundaries from a fixed location. The initials OC appear throughout the house. The initials AC have also appeared in unexpected places. I don't have a name for AC yet.`},{type:"box",style:"assessment",label:"Captain Byscilla Danos — Initial Notes",content:"Danos family — old money, Guild-connected for generations. Byscilla is the working kind, not the inherited kind. She earned her captaincy through field operations, not patronage, which makes her unusual among Guild leadership and makes her squad trust her in a way most Guild squads don't trust their captains. She is efficient, direct, and will drag a grown man out of a room by his helmet if she decides he's wasting her time. I have already seen her do this to Fennick. I suspect it will not be the last time."},{type:"text",content:"I have set up a base of operations in a relatively intact room on the ground floor — the one with the bathtub, as it happens, which was the only room with a functioning door latch. I reset the arcane lock on my journal. DC 15 to breach. I reset it every night. Field protocol."},{type:"text",content:"The building smells of damp stone, old cloth, and something I cannot immediately identify — faintly sweet, like incense that burned out decades ago. It is coming from upstairs. I did not go upstairs on the first night. I am methodical, not brave."}]},{id:"pre-002",date:"14 Harvestide, 1040",time:"14:30",title:"Ground Floor Survey — The Foyer & Beyond",tags:["THORNBURY","RAVENTREE MANOR","ROOMS","RECONNAISSANCE","MANOR LAYOUT"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Conducted a full ground floor survey with Surveyor Mott. Captain Danos remained outside coordinating spectral baseline readings. Recording conditions as found."},{type:"box",style:"room",label:"R02 — The Foyer",content:"Beyond the great oaken doors — ten feet wide and nearly twice as tall, carved with the likeness of a great oak, varnish stripped by decades of weather — the foyer lies in absolute ruin. Exquisitely-crafted marble floor tiles cracked and stained. Everything caked in filth. A pair of grand marble staircases dominate the far wall, leading up. Two sets of double doors stand in opposition. In the centre of the chamber: a pile of rubble with the twisted wreckage of an iron chandelier atop it. A half-crumbled marble arm juts from the debris — once an imposing statue, now fragments. A pair of planters in the corners contain only foul-smelling sludge where something once grew. A stone balcony overhead, unreachable from below. The western door to the library is barred by root growth — gnarled, grey, impenetrable. I tested it with my blade. No effect whatsoever. Whatever grew over that doorway is not natural."},{type:"text",content:"I searched the chandelier debris carefully. Found a weathered guest book in the remains of a shattered table. The last entry is dated twenty years ago. The last guest to arrive was one Perrius Annmatar. I have noted this name for follow-up."},{type:"box",style:"room",label:"R03 — The Hallways",content:"The hallways are more treacherous than useful. Floors rotten, warped, uneven — they creak violently with every step. Moving quietly is impossible without magic. Holes that would gladly swallow a foot. Shattered oil lamps on the floor everywhere, glass and dried oil stains. The WEST hallway is barely traversable — the floor above has collapsed entirely, filling the corridor with rubble and rotted timbers. Only the section between the Office and Workshop remains mostly clear. The EAST hallway was once finer — faded unrecognizable portraits line the walls, many trampled underfoot in some long-forgotten panic. All the doors are locked, rusted shut, cannot be picked. Sturdy enough that breaking them down would be very difficult. I spotted a discreet door in the southern wall — hidden hallway back to the foyer. Good to know."},{type:"box",style:"room",label:"R09 — The Sitting Room / Lounge",content:"The once fine portraits that line the walls are faded and discoloured. The marble busts — ears and noses removed by blows with a blunt object. I looked at them closely. The damage is targeted. Orantha's face specifically, always her face. Someone who knew who she was came in here and removed her from the walls. Not rage. Methodical removal. The pool table split from a fallen beam. Drinks cabinet ransacked. Broken glass, alcohol smell still faintly present. A soot-stained fireplace ringed by ruined couches, upholstery shredded with a sharp object — scored and attacked, not worn. Someone did this deliberately. I found a small secret door by the fireplace leading to the private collection — the wallpaper decay revealed the hinges. It only opens from the other side."},{type:"text",content:"Signs throughout the ground floor of a rapid departure — furniture left mid-arrangement, a cup still on a side table, an open book left face-down on an armchair. Whatever ended the Cornelius occupation of this house, it was not planned. Someone left in a hurry and did not return."}]},{id:"pre-003",date:"15 Harvestide, 1040",time:"09:00",title:"The Mirror — Oracle's Formulae Identified",tags:["ORACLE","ARCANE","PLANAR FRACTURE","RAVENTREE MANOR","INTELLIGENCE NOTE"],classification:"INTELLIGENCE NOTE",phase:"pre",sections:[{type:"text",content:"Returned to the curio room with magnification lens and a proper light source. Mott confirmed residual conjuration and abjuration signatures throughout. The gouges on the wall behind the mirror are not damage. They are formulae. I spent four hours confirming this before I was willing to write it down."},{type:"box",style:"intel",label:"R08 — Gallery / Curio Room — Mirror Assessment",content:"The mirror frame is enormous — ten feet tall, easily fifteen wide. Tarnished gold, bent, glass shattered INWARD rather than outward. Something pushed through from the other side. Behind it, the wall inscription: a complex magical formula involving planar travel. Similar to a dimensional doorway spell but modified to make a mirror a PERSISTENT gateway — not temporary, but ongoing — linking to a corresponding mirror elsewhere. Calibration marks suggest the partner mirror is not in this plane. Temporal decay coefficients put the destination somewhere with significantly different temporal flow. I also found the Dragonus Cornelius statuette nearby. And a grotesque stone statuette of a mummified king on a throne made of grey stone under one of the display cases — warm to the touch, unnaturally dark. I did not move it."},{type:"text",content:"Also located the pendant stone — smooth grey stone in an ornate brass frame. Warm. Pulses with faint inner light irregularly. Brass bears archaic script I cannot read. I have retained it."},{type:"box",style:"lore",label:"Lore Note — The Oracle's Mirror Network",content:"The Oracle wasn't simply mapping planar boundaries — she was USING them. The mirror gateway was an operational tool. The inscription medium shows wear patterns consistent with active magical cycling — this mirror was used dozens, possibly hundreds of times. Then something shattered the glass from the other side and it stopped being used at all."}]},{id:"pre-004",date:"15 Harvestide, 1040",time:"15:00",title:"The Library — Root-Blocked, Explored Via Secret Door",tags:["RAVENTREE MANOR","MANOR LAYOUT","LIBRARY","THORNBURY"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"The library's foyer doors are completely blocked by that unnatural root growth — thick, gnarled, grey roots twined around door handles, worked into keyholes, wound along hinges. Impenetrable. Fennick spent twenty minutes trying before Danos told him to stop embarrassing himself. We found the servant's passage instead — a secret door behind a bookshelf in the gallery, masked by vine overgrowth. The mechanism is a book titled 'Useful Passages.' Pull it and the shelf swings. I appreciate the humour."},{type:"box",style:"room",label:"R04 — The Library",content:"An immense cavern of a room. Oaken bookshelves fill every wall — where they haven't collapsed. A balcony once overlooked from the second floor but has mostly fallen away, leaving large gaps above the shelves. Many shelves are sagging, surrendering to weight. Others have given out entirely, spilling books onto stone floor. Trodden underfoot, covers separated from pages, contents smeared and illegible. Great shattered windows let the elements have their way with the delicate pages. Ragged curtains do nothing. The floor around the edges is littered with refuse from outside. A pair of rotting armchairs sit in the centre aside a sagging table. In the front, remnants of desks and chairs, most broken. A staircase in the northeast that once led to the balcony has fallen in a single large piece into a bookshelf beneath."},{type:"text",content:"I searched the reading area. Found a silver letter opener between the cushion and armrest of the western armchair — on closer inspection, it's actually a silvered dagger. Thin, small, well-made. Hilt bears engraved monogram 'DC.' Darius Cornelius? I also found a torn piece of parchment under the table — an unsent letter to someone named Elscieth."},{type:"text",content:"The display case in the southeast corner drew my attention most. An old iron case, rusted, with a lock pick fused into the lock by corrosion. Someone tried to break in and failed. Inside: three pages of fine parchment on an ornate scapus. Protected by abjuration enchantment — the runes are carved into the metal frame. The contents survived where nothing else did. I could not get it open. I made a note of the key locations to check. Captain Danos told me not to waste time on it yet."},{type:"text",content:"Of particular note: a section on planar boundary theory with three books missing from an otherwise complete series. Someone removed specific volumes selectively. Not looting. Research."}]},{id:"pre-005",date:"16 Harvestide, 1040",time:"Evening",title:"First Ghost — West Corridor, Unresponsive",tags:["THORNBURY","GHOSTS","ARCANE","RAVENTREE MANOR"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"I saw my first ghost at approximately 22:00. West corridor, ground floor — a woman in forty-year-old fashion moving from the sitting room toward the library. She did not acknowledge me. She passed within arm's reach. She was cold — not dramatically, just the kind of cold that registers wrong. She stopped at a defaced portrait — one of Orantha's — and stood for eleven seconds before continuing. That is interactive behaviour. She is aware."},{type:"text",content:"Mott confirmed her on the spectral baseline as a bound remnant — conscious, anchored, not aggressive. But the readings from the upper floor are different. Something substantial. Something fed by the fracture."},{type:"box",style:"assessment",label:"Ghost Classification — Initial Framework",content:"BOUND REMNANTS: Conscious, anchored, non-aggressive. The corridor woman. The sewing figure I'll encounter later. These pre-date the fracture or are anchored to stable objects. AGGRESSIVE MANIFESTATIONS: Upper floor. Drawing on the planar fracture for energy. More substantial, more dangerous. The fracture feeds them, their destabilisation feeds the fracture. Self-reinforcing loop. CLOTHING HAUNTS: Reported by an unknown visitor (the spy, later). Flying jackets. Documented phenomenon but uncommon."},{type:"text",content:"I did not attempt to interact with her. Apprentice Yael wanted to. Danos said no. I went back to my room and reset the arcane lock."}]},{id:"pre-006",date:"17 Harvestide, 1040",time:"11:00",title:"Library Records — Cornelius Family & The Kitchen",tags:["ORACLE","RAVENTREE MANOR","LORE","MANOR LAYOUT"],classification:"INTELLIGENCE NOTE",phase:"pre",sections:[{type:"text",content:"Spent the morning in the library cataloguing correspondence. The afternoon was spent surveying remaining ground floor rooms."},{type:"box",style:"lore",label:"Cornelius Family Summary (from letters)",content:"Dragonus Cornelius — patriarch, three generations back. His children, then Orantha Cornelius and at least one sibling. Orantha's letters span approximately thirty years. She is addressed as 'Oracle' formally and as 'Ran' personally by someone who signs with a circle-and-line symbol. The personal letters are warm. They become urgent in the final years. The last letter: 'Come home before the door closes. The calibration is drifting. If the anchor goes, I cannot reach you from this side.' No reply. Also found a letter to 'A.' in Orantha's handwriting: 'You cannot keep carving your name into things and expecting that to mean something permanent. Stone forgets too, in time. Come inside.' Affectionate, mildly exasperated. AC appears in the bedframe upstairs, windowsill carvings, behind a defaced portrait."},{type:"box",style:"room",label:"R11 — The Kitchen",content:"Mott and Fennick surveyed the kitchen from the veranda entrance. There are insects the size of large dogs perched on nearly every flat surface — huge, knobby creatures sweeping long antennae over metal pots and pans, causing swathes of rust to appear. They scrape it off with large spiked mandibles. Rust Monsters. Five of them. They seemed unconcerned with us until Fennick's belt buckle got too close. Danos pulled us out. The kitchen is not accessible while they remain. Ironically they may be the best preservation mechanism in this building — they consume all the metal, leaving everything else untouched. Danos noted they could be useful for opening the library display case if we could lure them to it. I noted this as 'creative but logistically absurd.' She gave me a look."},{type:"text",content:"The library's missing books are from a very specific section — planar anchor theory and dimensional tethering. Someone who knew what they were looking for came and took exactly those volumes. This was not looting. This was research."}]},{id:"pre-007",date:"18 Harvestide, 1040",time:"Various",title:"Upper Floor — First Attempt, Retreat",tags:["THORNBURY","GHOSTS","RAVENTREE MANOR","COMBAT","MANOR LAYOUT"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Attempted the upper floor today. I got as far as the collapsed room — the Office — where the ceiling formed a ramp to the second floor. Something threw a piece of broken furniture at me from across the room. I retreated in a manner I would describe as brisk and purposeful."},{type:"box",style:"room",label:"R05 — The Office / Collapsed Room",content:"The floor above has partially collapsed, falling so it rests on this floor on the west side and against the ceiling on the east — a veritable ramp up. Dangerous. Could finish collapsing at any moment. Dim light from a drafty doorway above illuminates destruction. West side: pile of rubble, broken furniture, ruined stone and wood. Whatever was here when the ceiling collapsed is unrecoverable. I noted a damaged bed with pink curtains in the rubble — a young woman's room fell through. The wire footboard held initials 'EC.' Also found a battered journal under rubble — barely legible passages about a young woman growing up in this estate, bullied by her little brother. A tarnished gold bracelet missed by looters. And a disused tome in a drawer — an academic textbook on arcane practices with flowery handwriting notes. Inside: 'To my beloved daughter, that she may follow in my footsteps.' Orantha teaching EC — Elscieth Cornelius? — the family trade."},{type:"box",style:"assessment",label:"Upper Floor Ghost Assessment",content:"The aggressive manifestations are drawing on the planar fracture. I could feel it — pressure behind the eyes, a smell like ozone and something older. The fracture is not visible to standard detection but it is present. These ghosts are being FED. The fracture functions like a well. They draw from it. Every active manifestation reduces planar stability further. They are a symptom and they are also making the disease worse."},{type:"text",content:"The incense smell is strongest near the ramp. Cedar and dried flowers. It comes from the second floor. I noted the initials OC and AC carved into a bedframe near the base — together, same height. Either at the same time or by someone the same height as whoever made the first carving."}]},{id:"pre-008",date:"19 Harvestide, 1040",time:"Afternoon",title:"Tensor Survey — Ground Floor Clearances",tags:["THORNBURY","GHOSTS","ARCANE","MAGES GUILD","RAVENTREE MANOR"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Used the Tensor detection configuration today. The ground floor showed four active presences: the corridor woman (confirmed bound remnant), something in the workshop, something attached to the drinks cabinet in the sitting room, and a consistent reading from behind a false wall section in the east corridor."},{type:"box",style:"room",label:"Clearance Log — Ground Floor",content:"Cleared the drinks cabinet presence — a fragment of emotional residue attached to an object. Dissipated without resistance. The workshop presence was more significant — a partial figure sitting in a chair that isn't there anymore, sewing something that exists in a slightly offset reality. She became aware of me. She looked at me. I did not attack. She did not attack. We reached a draw. I am not counting it as a clearance."},{type:"box",style:"lore",label:"The False Wall — East Corridor",content:"Not a ghost. A structural anomaly — bricked in after original construction. The Tensor reading behind it is arcane, not spectral. Something has been stored or sealed behind this wall. I have not opened it. I am noting its location and choosing not to open it alone. Some decisions benefit from witnesses."},{type:"box",style:"room",label:"R06 — Storage Room",content:"Surveyed the small storeroom while sweeping. Cleaning supplies and bed linens, mostly decayed. Found paper-wrapped bars of soap, some glass vials. And a barrel. Fennick opened the barrel. A spring-loaded trap smashed a vial of acid — Fennick took the splash across his left forearm. Danos treated him while explaining, at length, what 'don't touch things' means. The acid ate whatever had been stored in the barrel. Melted beyond recognition. Someone wanted the contents destroyed if the barrel was opened. Why trap your own storage?"}]},{id:"pre-009",date:"20 Harvestide, 1040",time:"Morning",title:"The Veranda & Exterior — Wight Evidence",tags:["RAVENTREE MANOR","MANOR LAYOUT","THORNBURY","BYSCILLA DANOS"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Danos ordered a full exterior survey today. The team split — Mott took the eastern grounds with Yael, I took the northern paths with Fennick (arm bandaged, still sheepish about the barrel)."},{type:"box",style:"room",label:"R10 — The Veranda",content:"Masoned stone in remarkably good condition, though overgrown with weeds, vines, moss. Parts covered in broken glass and rubble from wall collapses above. Seating remains but seized by dry rot. Eastern side has the most notable broken glass — scattered outward from the house in a north-westerly direction. Something was thrown or propelled through these windows with tremendous force — the glass from the northeast window traveled at least twenty-five feet. The rear doors into the Lounge are unlocked, reasonably intact. The kitchen door remains locked. Boot prints to-and-from the Lounge doors — humanoid, heavy footfalls, at least two people moving side-by-side. Recent. REPEATED travel."},{type:"box",style:"room",label:"Northern Grounds — The Fountain & Mass Grave",content:"An old fountain at the path split, badly abused. The statue at centre is headless — head removed by repeated heavy blows. Slashes, cuts, cracks throughout. Boot prints ring the statue, facing it. Someone stood on the fountain's rim to deface it. Southward from the fountain: flowerbeds overtaken by weeds, earth tilled and mounded in uneven lumpy patches. At first it looks like poor gardening. It is not. The mounds are human-shaped. This is a mass grave. Dozens of bodies beneath the soil. The earth hasn't been disturbed in years. Near the southeast edge: the exposed remains of a body, skeletal, wrapped in plant growth. A cleric. Still clutching a religious libram in one hand and a rusted spiked mace in the other. They dragged themselves to safety before expiring. Deep cuts from ragged swords on the bones. Someone consecrated this ground with divine energy to prevent rising. That cleric probably did it, and then died."},{type:"box",style:"room",label:"R34 — Groundskeeper's Cottage (NOT ENTERED)",content:"An impassable wall of overgrown hedge blocks the path to a sagging cottage — barely visible over the foliage. Dense enough to be a stone wall. Would take hours to clear with slashing weapons. Danos felt the dread emanating from the cottage and pulled us back. She said: 'Whatever lives there is not part of our survey today or any day I'm filing paperwork for.' I agreed. The cottage stays on the map as 'do not approach.' The boot prints at the fountain lead from this direction."},{type:"text",content:"Mott's report from the eastern grounds: a rusting greenhouse, a hedge maze gone wild, and a great dead tree at the grove's heart with webs coating every branch. Something large lives in that tree. We are not going near it."}]},{id:"pre-010",date:"21 Harvestide, 1040",time:"Various",title:"Perrius Annmatar — Not a Ghost",tags:["PERRIUS ANNMATAR","RAVENTREE MANOR","LORE","THORNBURY"],classification:"INTELLIGENCE NOTE",phase:"pre",sections:[{type:"text",content:"I met someone today who is not a ghost, which I mention because in this house the distinction requires explicit confirmation."},{type:"text",content:"His name is Perrius Annmatar — the same name from the guest book, dated twenty years ago. He has been living in the manor, eating and sleeping, and finding the whole situation deeply inconvenient. He said he simply wants peace and quiet and that everyone who keeps arriving is making it considerably more difficult."},{type:"box",style:"lore",label:"Perrius Annmatar — Background",content:"I asked how long he'd been here. He said 'longer than you.' I asked if he knew Orantha. Quiet for a moment, then: 'Everyone who stayed here long enough knew the Oracle.' He would not say more about her directly. He confirmed the incense smell — said it 'comes and goes, like it has somewhere to be.' He was not here when the mirror shattered. He returned afterward to find it already broken. He said this with the flat tone of someone recounting a thing they have not finished grieving. He navigates the upper floor manifestations with practiced ease — 'I don't bother them and they don't bother me.' Either very simple or very meaningful."},{type:"text",content:"He is not Guild, not Legion. He expressed significant displeasure about soldiers arriving — reassuring in a collegial sense. Neutral asset. Potentially useful. Definitely watching."}]},{id:"pre-011",date:"22 Harvestide, 1040",time:"Various",title:"Second Floor Breach & The Master Bedroom",tags:["THORNBURY","RAVENTREE MANOR","MANOR LAYOUT","RECONNAISSANCE"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Third attempt via the Office ramp — made it up. Fennick spotted me from below and took notes on my route, which I found either helpful or mildly insulting. Danos sent Mott up after me."},{type:"box",style:"room",label:"Second Floor Hallways — R16",content:"Landing at the top of the grand staircase. Hallways splitting east and west. The west hallway opens into a small nook — once cozy, now smashed. A collapsed stairway leads to the third floor but looks treacherous. The east hallway: more holes than floor. Most of it has collapsed into rooms below. Thick gouges in the walls — something scratched deep rents, leaving chunks of construction material hanging. The guest room wing extends north — five doors in various states of disrepair. Glass crunches underfoot from a shattered mirror on the west wall."},{type:"box",style:"room",label:"R21 — The Master Bedroom",content:"Beyond the collapsed double doors — mostly untouched by looters. Thick layer of undisturbed dust. Two plush geometric-patterned rugs, fine wooden parquet flooring. The furniture appears undisturbed. The longer you stare the more unsettling it becomes. This room is under the effect of a faltering preservation spell — warding runes along the borders have faded but the space remains in good shape. Not a single pane of glass broken in the windows. The desk is immaculately organised — leather blotter pad, three writing styluses in a rectangular tray, three capped ink bottles in a square container. A bone white folder of papers. A locked book with a clasp. Three oil lamps positioned for even illumination. A pipe and tobacco jar. A bookcase with over forty volumes. The organisation is a monument to someone exerting control over the uncontrollable. Darius Cornelius, after losing his wife Ylana. A perfectionist controlling the only thing he could."},{type:"text",content:"Under the circular rug in the centre of the master bedroom: a broken teleportation circle. Chalk and charcoal geometric etchings. Two-thirds damaged — not deliberately, but by time and the estate's decay. What remains still radiates faint, faltering conjuration magic. This wasn't a standard teleportation circle — it designates a TARGET rather than just an anchoring point. Drawing power from an outside source. I need more time with this."},{type:"box",style:"room",label:"R18 — Western Landing / Secret Closet",content:"The reading nook has a hidden closet — once used by servants for cleaning supplies, it backs against the Master Bathroom wall. Inside: a concealed peephole. The stone-tile lavatory acts as an echo chamber. Someone — the notes suggest Kryn and Vivesna, house staff or family — used this to spy on Darius in the master bedroom. I marked the peephole location. Later, this will matter."}]},{id:"pre-012",date:"23 Harvestide, 1040",time:"Night",title:"PL1 Classification — Guild Responds at Last",tags:["PLANAR FRACTURE","ORACLE","ARCANE","MAGES GUILD","HIGH PRIORITY"],classification:"HIGH PRIORITY INTELLIGENCE",phase:"pre",sections:[{type:"text",content:"Communication from the Guild at 23:00. The situation has been escalated to PL1 — Planar Fracture, Class One. I am to assess and report. Not authorised to attempt closure without reinforcement."},{type:"box",style:"critical",label:"⚠ PL1 — Classification Notes",content:"A Class One Planar Fracture is self-reinforcing dimensional instability — not simply a hole, but an actively widening tear. The fracture draws spectral energy from adjacent planes, feeds the manifestations, which generate more energy as they destabilise, which feeds the fracture further. A loop. Breaking it requires either closing the fracture directly or clearing all active manifestations simultaneously before the fracture can feed on their dispersal energy. Both carry significant risk."},{type:"box",style:"lore",label:"Oracle's Connection to PL1",content:"I believe the Oracle created this fracture. The mirror gateway required a stable anchor point — a dimensional tether to Raventree. If she went through and the anchor failed or was disrupted, the connection would have collapsed inward. An inward collapse tears the local boundary. She didn't just leave through the mirror. Something went wrong while she was on the other side. The fracture is the scar. The letter saying 'come home before the door closes' — that person knew. And something ELSE happened too. The shattered ritual on Highsun 21 — the one the party attempted with the Oracle before my arrival — catastrophically failed and tore local reality into three planar shards: Feyward, Shadeward, and Material. The house now exists in three overlapping realities. The PL1 was already bad. That made it worse."},{type:"text",content:"Captain Danos received a separate communication — I saw her face change as she read it. She did not share the contents. She said only that reinforcements would be arriving and that our role would be shifting from survey to operational support. When I asked what that meant, she said: 'It means we stop counting ghosts and start moving them.'"}]},{id:"pre-013",date:"24 Harvestide, 1040",time:"Afternoon",title:"Upper Floor — The Oracle's Study & Cracked Sending Stone",tags:["THORNBURY","RAVENTREE MANOR","RECONNAISSANCE","MAGES GUILD"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Made it to the Oracle's study on the second floor. The door was ajar. Inside: a desk, shelves, papers. The papers were moving — turning pages without hands. Not a draft. Purpose. Something is searching through those papers. I closed the door quietly and retreated."},{type:"text",content:"In the hallway I nearly stepped on a sending stone — Guild-issue, cracked clean in half. The twin to my model. Someone from the Guild was here before me. I pocketed both halves. Sent a query to administration. No response."},{type:"box",style:"room",label:"The Guest Rooms — R19 Survey Notes",content:"Five guest rooms on the north wing, each once colour-coded. The Black Room opens without issue. The Blue Room door collapses to splinters at the slightest touch. The Red Room opens but hinges come loose. The Green Room door falls into the hallway when pulled. The Yellow Room is wedged shut, frame collapsed. Between the Blue and Red rooms: an illusory wall. A toppled plant-stand table lays THROUGH it — the wall isn't solid. Beyond: a narrow hidden room. The Watcher's Hall. One-way mirrors into both the Blue and Red rooms, silence spell markings along every surface. Someone was spying on guests. The mirrors were enchanted — illumination and silence maintained by ritual markings. Old but active. This family trusted no one and had the resources to act on that distrust."},{type:"box",style:"room",label:"The Attic — Solarium (S01)",content:"Mott scouted the attic access — reported a long room that was once a grand solarium. The iron-and-glass ceiling is mostly intact but rusting. Exposed to the sky through gaps. Overgrown planters with plants killing each other. The floor: thousands of glass shards, but the stonework is oddly clean compared to the rest of the attic. Most notable: half a dozen free-standing mirrors facing one another in a ring at the eastern end. Two more on the walls. A third flat on the floor. Brought up here deliberately. By who, for what purpose — unknown. Danos flagged this room as HIGH PRIORITY and told us not to enter it without her direct authorisation."}]},{id:"pre-014",date:"25 Harvestide, 1040",time:"Various",title:"The Spy — First Sighting",tags:["THE SPY","THORNBURY","RAVENTREE MANOR"],classification:"INTELLIGENCE NOTE",phase:"pre",sections:[{type:"text",content:"I spotted someone in the manor today who is neither Guild, nor Legion, nor Perrius Annmatar. Caught him in the sitting room going through the drinks cabinet — methodically, not desperately. Looking for something, not alcohol. When he noticed me he nodded like we had an appointment and he was early. Said he was looking for a toad. No time to talk. Left."},{type:"text",content:"He is good. He knew where to step to avoid broken glass without looking at it — he's been in this specific room before. If he's been here before, he's been here independently. Before me, before the Guild team."},{type:"box",style:"assessment",label:"Assessment — Unknown Subject (The Spy)",content:"Looking for a toad. Specifically. Someone sent him, or he knows a toad is here. The purple toad mentioned in intercepted Legion communications is apparently of interest to multiple parties. I have added 'locate and identify toad' to my operational priorities. He mentioned flying jackets — clothing haunts I'd noted. He is on my watch list. I am calling him THE SPY because he has not offered his name."}]},{id:"pre-015",date:"26 Harvestide, 1040",time:"Various",title:"The Attic — Servants' Quarters & Shadow Burns",tags:["RAVENTREE MANOR","MANOR LAYOUT","GHOSTS","THORNBURY"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"Danos authorised a full attic survey today. She sent Mott and me while she and Yael continued second-floor documentation. Fennick remained on ground floor watch — his arm is healing but he's been reassigned to 'looking at things from a safe distance,' which is, I believe, Danos's way of being kind without admitting to kindness."},{type:"box",style:"room",label:"R24 — Butler's Quarters / Staff Lounge",content:"Reasonably good condition — roof intact, heavy curtains blocking shattered windows. A quartet of couches, a table with a long-abandoned card game. The game was abandoned mid-hand. I collected the cards — a full deck minus two. A feather pile in the southern corner, a down pillow torn open. Shelves of books, a chessboard, a coffee table. One book on the east wall is fake — wood with glued-on panels. Pulling it unlatches a secret passage to the servant hallways beyond. Mott noted this was 'the third secret passage in this building' and asked if anyone in the Cornelius family had ever used a regular door."},{type:"box",style:"room",label:"R25 — The Burn Room",content:"Debris pushed south, piled against walls to block broken windows. A metal washtub has been used as a campfire housing. The only intact piece is a full-height mirror in the northwest. Every inch of floor, wall, and ceiling has been scratched and carved with words: 'incomplete,' 'still here,' 'broken,' 'together,' 'suffering,' 'trapped,' 'not ourselves,' 'surviving,' 'not safe,' 'not me,' 'alive,' 'not alone,' 'shattered,' 'bound,' 'not free,' 'us,' 'many,' 'alone,' 'abandoned,' 'monsters.' I copied every word. I did not stay long."},{type:"box",style:"room",label:"R26 — The Seneschal's Room",content:"Standing in this room brings a profound sinking feeling. Once divided by ornate mirror-embedded screens. Six armchairs in an oval in the centre. Strange dark smears — shadowy silhouettes burned into the surfaces. One cuts a profile of a face SCREAMING. These are permanent shadows — something like the burn marks from an arcane detonation, but on furniture and floor instead of stone. Full-height framed mirrors on every non-windowed wall, caked in dust and grime. Several have large handprints, faded under dust layers. One mirror has a narrow sliver of dust stripped from the bottom — fresh, no more than a few days old. Someone was here recently. And a framed canvas on the south wall: the household servants, seated and standing on the manor grounds. None of them have faces. Someone scratched the paint from every face with a knife."},{type:"text",content:"This is where the mirror entity was created — I believe that now, after seeing the burn shadows. Magical energies tore through the house and melded the old Seneschal with a group of servants into a single tortured being. The words on the walls of the Burn Room are from those merged consciousnesses. 'Not me.' 'Not alone.' 'Many.' Still here."}]},{id:"pre-016",date:"27 Harvestide, 1040",time:"Full Day",title:"The Day Before — Orantha's Letter, The Toad, Final Prep",tags:["PURPLE TOAD","THORNBURY","RAVENTREE MANOR","ORACLE","BYSCILLA DANOS"],classification:"FIELD OBSERVATION",phase:"pre",sections:[{type:"text",content:"The day before the party arrived. I spent it completing survey notes in the library. Two weeks in this house. I have learned a great deal and understood very little."},{type:"text",content:"Captain Danos received operational orders this morning. She briefed us: an external party will be arriving for the ghost-clearing operation. Agent L from the Guild will be making direct contact. Our role shifts from survey to support and observation. She told us — all four of us, standing in the ruined foyer — that our job is to stay alive, document everything, and not get in the way. Then she said: 'Thornbury, you're going embedded with the party. You're the observer. Don't get attached.' She looked at me when she said it in a way that suggested she already knew I would."},{type:"box",style:"quote",label:"Found Letter — Undated, Author: Orantha Cornelius",content:`"If you are reading this then the lock held and the mirror didn't, which means the door closed with me on the wrong side of it. The house is yours. Don't let them dismantle anything — the formulae on the mirror wall are the map back. Someone will come who knows how to read them. Keep the toad safe. He knows more than he says, which is more than most people know at all. The fracture will grow if no one tends it. I'm sorry I couldn't come home. — O."`},{type:"text",content:'"Keep the toad safe." I have been in this building for two weeks and seen no toad. I went back through every room again this evening. Nothing.'},{type:"text",content:"At approximately 23:40, I saw something purple in the corner of my eye near the library doorway. When I turned, it was gone."},{type:"text",content:"I reset the arcane lock. Checked my kit — supplies, potions, scroll of Sending, the invisibility potion reserved for extraction. Reviewed my notes one final time. The external party arrives tomorrow. Danos told me to sleep. I did not sleep well."}]}],dy=[{id:"party-001",date:"28 Harvestide, 1040",time:"~07:00",title:"Ration Break — Meet Agent L, Reveal My Name",tags:["ARCHIE MISER","LUIGI","MAGES GUILD","DEPLOYMENT","THORNBURY"],classification:"FIELD OBSERVATION",phase:"party",sections:[{type:"text",content:"The party has been in the manor for some time already — they arrived during the events of Highsun, weeks before my deployment began. What I know of their prior activities comes from Guild briefing files and the timeline provided by Danos: they explored the manor, fought haunted books, encountered the Oracle, attempted a ritual that catastrophically failed and tore local reality into three planar shards. Most of the party was scattered across dimensions. What remains here in the material manor is a smaller group — Archie Miser, and eventually Luigi, who arrived through Guild channels."},{type:"text",content:"This morning. Archie and Luigi resting. Luigi opened a military ration pack — scratched manufacturing marks, multilingual labels. Smell: neutral. Luigi commented it could be worse than Bowser's army rations. Archie wanted to move on. He pointed to me — the Mages Guild guard — and asked if I was joining. Said he'd only checked five rooms, more floors to explore."},{type:"text",content:"He called me 'Placeman.' I told him my name is Thornbury. I have been here for two weeks. He has known me for less than a day."}]},{id:"party-002",date:"28 Harvestide, 1040",time:"~07:10",title:"Servants' Dining Room — Stash, Lock, Tensor Ghost",tags:["ARCHIE MISER","LUIGI","MAGES GUILD","COMBAT","ITEMS"],classification:"FIELD OBSERVATION",phase:"party",sections:[{type:"text",content:"Explored the ruined servants' recreational/dining room — tarnished tableware, valuables gone. Agent L positioned at the door. I uncovered a secret stash: 35 gold pieces and a pearl necklace. I offered the gold to Miser. He accepted, then — without prompting — suggested splitting it with Luigi, who was still eating his ration pack. Miser's instinct to share before being asked. I noted this."},{type:"text",content:"Miser tried to pick the stash lock. He couldn't manage it. Luigi helped — then said 'I don't know, this could belong to the Oracle.' Moral hesitation. I produced my field notes — the Guild manual on accessing unoccupied rooms. The moment I mentioned the Guild by name, Miser visibly perspired. He composed himself quickly, but not quickly enough. There is history between him and the Guild."},{type:"box",style:"assessment",label:"Combat Observation — First Engagement",content:"I set up the Tensor box — Miser didn't know what it was. It pinged. A ghost manifested, lurched at Miser. He said 'bring it on.' The guard slashed. Luigi's Poltergust roared — began absorbing the ghost with efficient composure. Miser screamed, ran, hurled fire bolts — ALL THREE MISSED. What I am noting: bravado is real in the moment but outpaces execution under stress. The gap between courage and capability is the most useful thing I've observed in this first hour. The Guild member asked Miser if he'd ever use the compass — said he had a matching one. Prior Guild relationship confirmed."}]},{id:"party-003",date:"28 Harvestide, 1040",time:"17:00",title:"Compass Follow — Spy Encounter & Hidden Door",tags:["ARCHIE MISER","THE SPY","NAVIGATION","RAVENTREE MANOR"],classification:"FIELD OBSERVATION",phase:"party",sections:[{type:"text",content:"Miser followed the Guild compass. 17:00 — opened a door. The spy from my day twenty-five sighting was on the other side."},{type:"box",style:"room",label:"R09 — Sitting Room (Revisited with Party)",content:"Same condition as my initial survey. Faded portraits, broken busts, ruined pool table, ransacked drinks cabinet, broken glass, alcohol smell. The party is seeing it fresh. I am seeing it for the fourth time. The defaced portraits of Orantha — targeted damage — are behind me as I write this. No one else has noticed the pattern. I have decided not to mention it yet."},{type:"text",content:"The spy mentioned flying jackets, said no time to talk, looking for a toad. Left. He did not look at me differently, which means either he doesn't know I'm Guild or doesn't care. Miser found the hidden door. When not under immediate threat, his environmental observation is above average."}]},{id:"party-004",date:"28 Harvestide, 1040",time:"~17:10",title:"Gallery — Mirror Formulae & Dragonus Cornelius",tags:["ORACLE","ARCANE","MAGES GUILD","ITEMS","RAVENTREE MANOR"],classification:"INTELLIGENCE NOTE",phase:"party",sections:[{type:"box",style:"room",label:"R08 — Gallery / Curio Room (with Party)",content:"Toppled statues, broken vases, green carpet. North wall collapsed exposing the private collection. The massive mirror frame — tarnished gold, shattered glass, bent — resting against the southeast wall. Thick gouges in the wall behind it. Miser spotted a small statuette. I picked it up — 'Dragonus Cornelius.' I looked at the mirror back. The inscription — I have been studying this for thirteen days. I let the guard read it fresh. He reached the same conclusion I did: dimensional gateway, not a research prop."},{type:"text",content:"Deep gouges and marks in the backing wood. At first it looks like vandals. On second glance: magical formulae. The guard said 'let me mark it.' I used the pendant stone to mark the location — the smooth grey stone in ornate brass, still warm, still pulsing. I have been carrying it for thirteen days and have not mentioned it to the party. I am reconsidering this."}]},{id:"party-005",date:"28 Harvestide, 1040",time:"~17:20",title:"Workshop — The Ring. Miser Saw.",tags:["ARCHIE MISER","THORNBURY","ITEMS","TRUST ASSESSMENT"],classification:"PERSONAL NOTE [ENCRYPTED]",phase:"party",sections:[{type:"box",style:"room",label:"R07 — Workshop/Storage (with Party)",content:"Contents confusing at first glance — two rooms combined. Tools scattered (workshop), mixed with mirror on a dressing table, adorned divan, floral-panel wooden screen, armoire and stool. Jewelry box empty on the floor. Ruined dresses and regal feminine clothing in broken crates. This was Ylana's furniture — moved here after her death, covered in sheets by servants who didn't want to trouble the grieving lord further. I know this from the master bedroom survey. The party does not."},{type:"box",style:"personal",label:"Personal Notation — NOT for Guild Review",content:"I spotted a ring on the floor and pocketed it. Standard field practice — unknown objects get catalogued privately first. But Miser SAW me. I was watching him at the moment I did it. He registered it and said nothing. He looked away. He stored the information. That is not naivety — that is patience. He is watching me. The observation runs both directions."}]},{id:"party-006",date:"28 Harvestide, 1040",time:"~17:25",title:"Collapsed Room — Climbing Failures & The Rope",tags:["ARCHIE MISER","LUIGI","THORNBURY","RAVENTREE MANOR"],classification:"FIELD OBSERVATION",phase:"party",sections:[{type:"box",style:"room",label:"R05 — Collapsed Floor Room (with Party)",content:"Utter ruin. The floor above has partially collapsed into a ramp. Dangerous. Dim light from above. West side: pile of rubble, broken furniture, stone and wood. I noted the OC and AC initials in the bedframe. Said I smelled incense from upstairs. All prepared to climb."},{type:"text",content:"Miser volunteered to climb first. He fell onto the Mages Guild observer. Luigi climbed up. Miser told the person he'd fallen on to be careful — as he fell back onto them. I produced my hempen rope — Guild property — and threw it up. They began climbing. Miser fell from the rope. The rope snapped."},{type:"text",content:"That rope cost the Guild significantly. Luigi simply suggested going around. He was correct. He did not attempt to climb. He expressed this with the flat practical tone of someone for whom unnecessary difficulty is simply uninteresting."},{type:"box",style:"assessment",label:"Supplies Note — My Kit",content:"I carry a practical adventurer's kit: bedroll, mess kit, tinderbox, 10 torches, 10 days rations, waterskin, 50 feet hempen rope (now destroyed), healer's kit with 8 uses. Two healing potions (2d4+2 each). One potion of invisibility — reserved strictly for extraction. One scroll of Sending for emergencies. I will share supplies if it serves the mission but I track every expenditure for later reimbursement. The invisibility potion is NOT for the party. If they are overwhelmed, I extract and file the report. Surviving to file the report takes priority over dying heroically alongside subjects."}]},{id:"party-007",date:"29 Harvestide, 1040",time:"02:37",title:"The Encrypted Conversation — PL1 Mortality Risk",tags:["ARCHIE MISER","LUIGI","MAGES GUILD","PLANAR FRACTURE","HIGH PRIORITY"],classification:"HIGH PRIORITY INTELLIGENCE",phase:"party",sections:[{type:"text",content:"Miser felt footsteps approach. Mages Guild members walked in, saw the rope, looked up, asked for Agent L. Miser called out. Luigi and the Guild representative entered a nearby room. Miser listened in. I know he listened because I was also listening."},{type:"box",style:"critical",label:"⚠ Intercepted PL1 Communication — Partial Decode",content:"The conversation was partially encrypted. The substance: the planar fracture, PL1, is destabilising. The ghosts must be cleared regardless of what that does to the fracture. Even if it destabilises it further. Then the critical line, decoded: 'Even if it may kill Archie — yes.' I will get it done. Report back tomorrow. The Guild has modelled the risk to Miser specifically. His arcane signature creates a resonance interaction with PL1-class fractures that is potentially lethal under a mass clearance scenario. He does not know this. I am not going to tell him. This is an operational decision, not a moral one. I have made this decision clearly and I find I am not entirely comfortable with how easily I made it."},{type:"text",content:"The rope snapped during Miser's climb. He said 'oww.' I was upset — rope is Guild property. It's expensive. He told me to come down since the rope was broken. He called out 'THORNBERRY' — incorrect spelling, noted — as he heard the door open and me talking to Agent L. He clawed upward for five minutes, gave up. Opened the door to the Guild representative. Time: 17:06. She said she was unable to find the toad on the first floor. She handed him the bill for the rope."}]},{id:"party-008",date:"29 Harvestide, 1040",time:"~05:06",title:"The Rope Invoice — 2,062 Gold, 5 Silver",tags:["ARCHIE MISER","EXPENSES","MAGES GUILD","ROPE"],classification:"ADMINISTRATIVE",phase:"party",sections:[{type:"text",content:"The invoice was presented in full. Miser laughed and said he'd pay. He will not pay. I filed it anyway."},{type:"table",label:"Guild Rope Replacement Invoice",content:"",rows:[["Guild Membership Levy (annual dues)","50 gp","Only Guild-approved fibres. Non-membership is a public hazard."],["Master Weaver's Inspection (3hr ritual, 12 witnesses)","200 gp","Certified by Loremaster Flaxenbeard himself."],["Arcane Certification Seal (anti-theft glow)","150 gp","Rope screams if stolen. Valid 1 adventure or until wet."],["Load-Test Certification (500-lb ogre, 7 drops)","300 gp","800 lb capacity proven. Ogre rental NOT included."],["Environmental Impact Assessment (fairy circle audit)","75 gp","2% donated to Dryad Preservation Fund."],["Quality Assurance Audit (sniffed, tugged, blessed x5)","100 gp","Detects invisible mimetic poly pocket lint."],["Expedited Processing Fee (skipped 6-month wait)","250 gp","Because adventurers think 'urgent' means 'now.'"],["Admin Stamp & Wax (triple-layer, gold-embossed)","40 gp","Hand-carved by orphaned gnome apprentices."],["Hazardous Material Surcharge (used for climbing)","80 gp","Guild liability for 'acts of heroism.'"],["Inflation Adjustment (post-dragon-hoard-crash)","100 gp","Prices subject to change if a lich sneezes."],["Guild Master's Discretionary Gratuity (wyvern saddle)","500 gp","Recommended. Refusal may cause 'accidental' fraying."],["Sales Tax (15%, King's Rope Monopoly)","217 gp","Because royals need new hangings too."],["GRAND TOTAL","2,062 gp 5 sp","Verbal agreement from Miser. Non-binding. Filed anyway."]]}]},{id:"party-009",date:"29 Harvestide, 1040",time:"~05:10",title:"Archie Ambushed — Perrius Reappears, Head Trauma",tags:["ARCHIE MISER","USK","PERRIUS ANNMATAR","COMBAT","MEDICAL"],classification:"FIELD OBSERVATION",phase:"party",sections:[{type:"text",content:"Miser was alone. He explored the library where we'd previously fought. Ignus indicated Luigi went upstairs. He opened a door and was ambushed. Started bleeding, said 'shoot,' ran away, locked the door, stared at it for thirty seconds. Then he composed himself. That thirty seconds matters — he processed and moved forward. That is a specific kind of resilience."},{type:"text",content:"He spotted Usk passing by — 'you were with Miss Ignus' — and begged him to help. 'Fine.' They went to the door. Usk screamed — Perrius Annmatar appeared instead of the ghost. Not a ghost, as I established on day twenty-one. He simply wants peace and quiet. He pointed to the monster behind Miser. Miser was struck from behind. Head trauma. Unconscious. Bleeding."},{type:"text",content:"He woke hours later in a bed. Agent L and I were watching him. 'What happened? I thought I died.' We'd stabilised him, tucked him in, cleared some more ghosts while he was unconscious. His first coherent request: rotating watch shifts. Situationally aware through head trauma and blood loss. I have revised his resilience assessment upward again."}]},{id:"party-010",date:"30 Harvestide, 1040",time:"00:29",title:"THE PURPLE TOAD — Portal Opened, Compass Stolen",tags:["PURPLE TOAD","PLANAR PORTAL","ORACLE","COMPASS","HIGH PRIORITY"],classification:"CRITICAL INCIDENT REPORT",phase:"party",sections:[{type:"text",content:"On day twenty-seven I saw something purple in the corner of my eye. Now I understand what it was."},{type:"text",content:"The purple toad entered the recovery room while Miser was bedridden. He started singing — 'Shuffle the Deck, Dear Hero.' Accordion and plucked strings. A fortune-telling performance. Cards, prophecy, imagery: a tower cracking, a compass lost, a Ring that regulates day and night, an Heir 'grown, not born.' He asked: 'Have you ever seen a planar portal open where it was never meant to?'"},{type:"text",content:"During the performance he took Miser's watch, keys, and other items from his bag. Miser tried to get up — great pain — Luigi and the guard held him down. The toad opened a planar portal using the compass and tools from Miser's pocket. Stepped through. The portal closed. 30 Harvestide, 1040, 00:29."},{type:"box",style:"critical",label:"⚠ Toad Identity Assessment",content:"The Oracle's letter said 'keep the toad safe.' The toad quoted the Oracle's letter in performance. He opened a planar portal using a Guild compass — either he understands the mirror gateway formulae or has independently developed equivalent tools. He knew about PL1, the ghost-clearing plan, and Miser's specific situation. His performance was structured intelligence delivery, not randomness. 'Unless it served a greater play' — he said this to me. Not to the room. To me. Current status: through a planar portal. Unknown destination. THE SINGLE MOST SIGNIFICANT UNKNOWN IN THIS OPERATION."}]}],hy=[{id:"post-001",date:"30 Harvestide, 1040",time:"00:30",title:"BONES & SPEAKER L — Pond Patrol Arrives",tags:["BONES","SPEAKER L","LUCKY T","POND PATROL","IRON LEGION"],classification:"NEW ACTORS — THREAT ASSESSMENT",phase:"post",sections:[{type:"text",content:"Two new actors. BONES and SPEAKER L of the Pond Patrol. Speaker L carries cipher-locked intelligence files — the Patrol's accumulated dossiers. Bones arrived to help decode them. Their files designate our group as the 'Vigilance Group.' They know about PL1 — which means Patrol intelligence is significantly better than the Guild's awareness of their awareness. Speaker L is thorough. His work is good."},{type:"text",content:"A guard approached — 'what's all this singing going on? I heard you say Archie.' Just assisting Speaker L. 'Do you know where you are?' Bones said Raventree Manor, ruled by a toad. 'Wrong,' the guard said. 'Ruled by Mages Guild in collaboration with the Legion.' He pointed at the Vigilance hovering above — 'it's under Legion control now. The Vigilance is now the Legionlance.' Bones grunted, stormed up, almost grabbed Speaker L. They both walked off to discuss entry."},{type:"box",style:"assessment",label:"SPEAKER L — Profile",content:"Before Aegis Command he was an institutional loyalist. Order 120 ended that — mass harm to toad populations under an impersonator using his face. He maintained the forms while it happened. He knows this. Results-driven now, rule-agnostic. He carries a concealed hand crossbow I did not detect until he fired it. This is noted with professional irritation."},{type:"box",style:"assessment",label:"BONES — Profile",content:"Combat-first. Modified rapier — official insignia on guard, dark metal enhancement on the blade edge. Refused healing after combat twice. Pride, distrust, or something else. Do not engage directly without significant numerical advantage and a plan for the suplex."}]},{id:"post-002",date:"30 Harvestide, 1040",time:"21:21 – 23:40",title:"Library Infiltration — Bones Operates at Night",tags:["BONES","SPEAKER L","LUCKY T","IRON LEGION","COMBAT"],classification:"FIELD OBSERVATION",phase:"post",sections:[{type:"text",content:"Bones and Speaker L entered through a window — exterior thorns blocked other approaches. Pitch black, 21:21. Bones grabbed Lucky T from the shadows — 'who do you work for?' Speaker L. Happy reunion. A Legion member entered the library, picked up a book. They hid behind a bookshelf. Bones went behind the guard, knocked him unconscious, stole his torch. Closed the exits by 23:40. Clean."},{type:"text",content:"They entered the workshop/storage room — Speaker L recognised the furniture. 'This furniture belonged to a lord. I would know that.' Then the curio room — and there was the Mole. He was scratching out the Oracle's inscriptions. The same formulae I spent two weeks studying. He destroyed them. I have my copy but the loss is significant. Speaker L told Lucky T to guard a door. He ran past Bones — 'secure the other door, make sure he doesn't leave.' A chase ensued until Bones reached a door, spotted Legion, stopped giving chase."},{type:"box",style:"assessment",label:"External Combat — 2 vs 3",content:"A guard asked if they were with Hargram Fidger. Bones maced him — parried, blocked. A whistle blown, not too loud. Reinforcements. Lucky T got a clean hit. Speaker L fired the concealed hand crossbow — wounded a guard who fled. Bones suplex'd a guard from behind. An arrow from an unknown position dropped the last guard — headshot. Bodies hidden, military horn recovered. Speaker L healed Lucky T. Bones refused healing. Third time."}]},{id:"post-003",date:"30 Harvestide, 1040",time:"~04:23",title:"Second Floor — The Mole vs. Miser, Hargram Fidger",tags:["BONES","ARCHIE MISER","LUIGI","THE MOLE","HARGRAM FIDGER"],classification:"FIELD OBSERVATION",phase:"post",sections:[{type:"text",content:"The Mole opened the upstairs door just in time. He pulled out his knife and full-sprinted toward Miser's recovery room. Bones tackled him mid-air. 'What's going on?' Miser asked. The guard said 'stay still.' Bones said 'this guy is trying to kill you but I stopped him.' Miser sighed as Speaker L entered with manacles. Miser dodged. Bones jumped off the Mole, tried to intercept Speaker L, sidekicked the Mole."},{type:"text",content:"Luigi flashed his light. Just... flashed it. They went away — both the Mole and Lucky T disappeared. 'What did you do to them?' 'Just flash a light...' Lucky T said he'd gotten what he wanted. He left."},{type:"text",content:"Bones pointed at Lucky T: 'I don't trust him.' Lucky T: 'You'd rather I kill you?' Miser: 'I can just fire a ball at you.' 'Fine, I'll leave.' Guards entered — 'we came to protect the injured.' Miser: 'There was a disturbance but we handled it, please come back another day, I'm recovering.' I remained quiet."},{type:"box",style:"assessment",label:"Hargram Fidger — Arrival",content:"Fidger entered immediately after. 'I'm here to work with you.' Miser: 'Please don't come closer, I'm recovering.' 'We will meet again. My name is Hargram Fidger, I'm with the local Legion chapel.' He noted the guards around Miser. 'I think you're important with these guards.' 'We will have a better meeting another time.' He left. I have known Fidger since day twenty. His questions have always been too specific. He identified Miser as 'important' before any real conversation. Miser handled the interaction cleanly — cited recovery, deferred politely, dismissed without antagonising. Social competency under pressure: genuinely high."}]},{id:"post-004",date:"30 Harvestide, 1040",time:"Evening",title:"Thornbury Reports — Aemenor Evenflight & The Portal Events",tags:["THORNBURY","MAGES GUILD","PLANAR FRACTURE","LORE"],classification:"INTELLIGENCE NOTE",phase:"post",sections:[{type:"text",content:"Before bed I told the group what I knew. Something is happening in the planar realms. I asked if they had met Aemenor Evenflight — the Guild called for reinforcements and he should be here. They said they'd met one of the Legion's captains. The timeline is confused. There are so many factions in this house now."},{type:"box",style:"lore",label:"The Planar Shards — What I Understand Now",content:"The shattered ritual on Highsun 21 — the party attempted a synchronisation rite with the Oracle to align the physical world, mirror-space, and the 'Deep Layers.' It catastrophically failed, tearing local reality into three planar shards. The FEYWARD Manor — a Feywild reflection where Lady Aurelian Corvinarus holds court, satyrs drink endlessly, and time moves strangely. The SHADEWARD Manor — a Shadowfell reflection where Orangus Cornelius hosts vampire dinners and the Onyx Hand operates. And the MATERIAL Manor — where we are, where the Iron Legion has established control and renamed the Vigilance to the Legionlance. The party was scattered across all three. Archie and Bowser went to the Shadowfell. Waluigi and Toad Lee to the Feywild. Markop and Remi into the Deep Mirror. Toadburt was captured by the Legion in the physical antechamber — they fitted him with an Entropy Ring and sent him into the Feywild as a coerced agent with orders to capture the Oracle within three days."},{type:"box",style:"lore",label:"Sergeant Varn Coldbrook — Legion Fey Operations",content:"The Legion sent their own team through. Sergeant Varn Coldbrook — nineteen-year veteran who never expected to find himself in an impossible forest where the sun doesn't move. A practical man who believes in cold iron, hot meals, and following orders. His mission: locate and secure the Oracle. His squad entered the Feyward shard on Highsun 24 through a mirror-door a Legion wizard stabilised briefly. The door collapsed behind them. They've been trapped since. He started with eight soldiers. Private Henwick disappeared — found his boots arranged neatly beside a stream, facing upstream, no tracks. Corporal Dain started laughing during watch and hasn't stopped smiling — his eyes went the wrong colour. Private Marsh was replaced by something wearing his face. Coldbrook is down to five functional soldiers, none sleeping well, all jumping at sounds. He doesn't know we're in the same dimensional shard. He's been tracking unknown movement through the manor — building a picture of capabilities and intentions. He's also noticed the month-end deadline everyone keeps mentioning."}]},{id:"post-005",date:"29 Harvestide, 1040",time:"Morning",title:"A New Day — Baths, Robes, and Byscilla Danos",tags:["ARCHIE MISER","BONES","LUIGI","THORNBURY","BYSCILLA DANOS"],classification:"GENERAL LOG",phase:"post",sections:[{type:"text",content:"29 Harvestide, 1040. Soldas. Golden Summer. Overcast, 28°C. I shook hands with Bones — a real handshake, firm, acknowledged — as he cleared out the bathtub. I told Miser I would bring water from the well outside. I ran out, fetched two buckets, bubble bath, and rubber duckies. Morale is operational effectiveness by another name. I have been in this house for two weeks. I thought it would be welcome."},{type:"text",content:"Miser showered first. Clean dark blue mage's robe, brown belt, brown shoes, staff, third eye visible, hood down. He looked considerably more composed than someone who was unconscious and bleeding twelve hours ago has any right to look. Bones said 'you look handsome.' Miser: 'what — it can't be that — umm — impressive right?' He was flustered. The most unguarded I've seen him."},{type:"text",content:"Bones went for a mirror, ran into someone. Byscilla Danos — part of the Danos family. She wanted to know where the water-powered fans had gone. Her soldiers outside had heatstroke. Miser said 'it's just a bit of water, just a quick minute.' She was not persuaded. Then she saw ME."},{type:"box",style:"critical",label:"Cover Compromised — Byscilla Danos",content:"She said 'wait a minute — YOU!' and took me by the ear, dragging me out by my helmet. My cover with the Danos family is burned. My captain recognised me. She dragged me out of a room by my own helmet. Miser called after me: 'Thank you for helping us.' He had previously told the others he thought I might betray them. He thanked me in public while I was being dragged away. He is simultaneously suspicious and grateful and holds both states without needing to resolve them."},{type:"text",content:"Bones emerged from his shower unrecognisable — the mushroom had been obscuring him. He was genuinely happy. No one recognised him. Luigi came out last, mentioned he'd expelled ectoplasm in the bath, and no one reacted."}]},{id:"post-006",date:"29 Harvestide, 1040",time:"12:10",title:"⚠ BREACH — They Found My Notes. They Read Everything.",tags:["ARCHIE MISER","BONES","LUIGI","THORNBURY","META"],classification:"⚠ BREACH EVENT",phase:"post",sections:[{type:"box",style:"critical",label:"⚠ CONTAINMENT FAILURE",content:"After Danos removed me, Miser noticed something on the ground. I believe it fell from my kit during the dragging. He picked it up. He read the field notes. He described them as 'detailed notes on everything they did to the tee.' That is accurate. They were."},{type:"text",content:"Bones: 'He was a spy, wasn't he?' Silence. Cricket noises. Luigi walked out of the bath: 'huh?' 'He was spying on us.' 'How was the bath?' 'Bath was good, expelled ectoplasm too.' 'Well those notes are interesting I guess.' They all pulled up chairs and reviewed the contents of the notebook."},{type:"box",style:"personal",label:"Self-Assessment — Final Entry as Active Observer",content:`My cover is burned. Two weeks of careful observation, and they found the notes on the day I was dragged out by my own helmet. What they have read: everything. Every profile, every assessment, the ring I pocketed, the PL1 mortality note about Miser specifically. They have read that I know the clearing event might kill him and chose not to tell him.

If I am writing my own profile — and I am, because consistency requires it — I would note: subject was thorough and accurate. Subject concealed potentially fatal intelligence from a party member for operational reasons. Subject pocketed items without full disclosure. Subject fetched bubble bath and rubber duckies. Subject was dragged out by his helmet.

I do not assign morality scores. I assess effectiveness and reliability only. Being read was not effective. I need to do better.

What I am less certain about: whether 'better' means tighter operational security or something else. Miser thanked me. He knew I might betray him and he thanked me anyway. I am not used to that. I don't have a category for it.`}]},{id:"post-profiles",date:"Ongoing — Cross-Referenced",title:"SUBJECT PROFILES — Full Clinical Assessments",tags:["PROFILES","ALL SUBJECTS","GUILD INTELLIGENCE"],classification:"PRIORITY DOCUMENT",phase:"post",sections:[{type:"text",content:"These profiles are compiled from direct observation across the full deployment — including fourteen days of solo observation before the party's arrival. No moral judgments are made. Effectiveness and reliability only."},{type:"heading",content:"ARCHIE MISER — Arcane caster / party lead"},{type:"box",style:"assessment",label:"ARCHIE MISER — Full Assessment",content:`Prior Guild contact confirmed (compass, name recognition). Elevated PL1 resonance risk.

STRENGTHS: Environmental observation when calm — found hidden doors without guidance. De-escalation under social pressure — the Fidger interaction was genuinely impressive. Resilience after trauma — requested watch shifts while bleeding. Extends trust early and does not obviously regret it.

WEAKNESSES: Magical offensive accuracy collapses under fear — zero for three on the ghost. Bravado precedes capability. Agreed to pay 2,062 gold for a rope. Will not pay.

INTERPERSONAL: Generous before being asked. Suspicious but patient — saw me pocket the ring and said nothing. Read notes describing his potential death and thanked me anyway. Either exceptional discipline or an unusual kind of grace.

GUILD COOPERATION: MODERATE TO HIGH. Follows the compass. Has prior connections. Fear of the Guild name is workable.

IF MISSION GOES WRONG: Will retreat, regroup, attempt to negotiate. Manageable through information — but he has now demonstrated he finds and reads field notes.`},{type:"heading",content:"LUIGI — Support / Poltergust handler"},{type:"box",style:"assessment",label:"LUIGI — Full Assessment",content:`Affiliation unclear. Bioluminescent flash capability.

STRENGTHS: Ghost absorption — the Poltergust is the most reliable anti-ghost capability in this party. Composure under all conditions. The flash clears rooms of multiple parties simultaneously. Correctly identified the practical solution (go around) while others climbed and fell.

WEAKNESSES: I haven't found any. This IS the concern.

INTERPERSONAL: Minimal verbal output. Expelled ectoplasm in the bath and mentioned it conversationally. Responded to discovering I was a spy with 'interesting I guess.'

GUILD COOPERATION: UNCERTAIN. No lever identified. No financial appetite, no institutional loyalty. He may simply continue operating regardless.

IF MISSION GOES WRONG: Do not underestimate the flash. Do not underestimate the Poltergust. Quietness is not passivity.`},{type:"heading",content:"BONES — Melee combatant / Pond Patrol"},{type:"box",style:"assessment",label:"BONES — Full Assessment",content:`Modified rapier. Refuses healing (unexplained, three times now).

STRENGTHS: Suplex, tackle, knockout — all confirmed. Environmental stealth when motivated. Makes tactically correct decisions without being asked. Warming to Miser genuinely.

WEAKNESSES: Default answer to obstacles is force. Was stopped by a checkpoint during a chase. Refuses healing.

INTERPERSONAL: Distrusts Lucky T openly. Called me nice and I have filed this incorrectly twice.

GUILD COOPERATION: LOW. Loyalty is personal and individual. Do not engage directly without numerical advantage and a plan for the suplex.`},{type:"heading",content:"SPEAKER L — Pond Patrol leadership"},{type:"box",style:"assessment",label:"SPEAKER L — Full Assessment",content:`Concealed hand crossbow. Results-driven, rule-agnostic post-Aegis Command.

STRENGTHS: Weekly cipher rotation, thorough dossiers. Concealed crossbow I did not detect. Political leverage from knowing how institutions fail. He sings operational briefings — genuinely effective for morale.

WEAKNESSES: Low night vision — Bones had to steady him. Cover burned with at least one guard. Emotionally compromised around Aegis Command.

GUILD COOPERATION: VERY LOW. Will choose toad survival over Guild interests without hesitation. I would do the same in his position.

IF MISSION GOES WRONG: Will extract information and prioritise toad survival. Will not sacrifice himself for the party. Fully independent actor.`},{type:"heading",content:"BYSCILLA DANOS — Mages Guild Captain"},{type:"box",style:"assessment",label:"BYSCILLA DANOS — Assessment",content:`My captain. Danos family — old money, Guild-connected for generations. She is the working kind, not the inherited kind. Earned her captaincy through field operations, not patronage. Her squad trusts her in a way most Guild squads don't trust their captains.

She arrived with me on day one. She ran the survey. She told me not to get attached. She dragged me out by my helmet when she recognised me helping the party use Guild water resources for personal bathing. She was correct to do so. Guild resources are Guild resources.

She has been running the Guild's operational build-up at the manor quietly, in parallel with the party's activities. While the party explored, she mapped. While they fought ghosts, she catalogued. While they bathed, she reported. She is the person who will decide what happens to the PL1 fracture if the party fails. She has not shared her contingency plans with me. She does not share contingency plans with observers.

I trust her. I also know that trust is not something she factors into operational decisions. She factors effectiveness. And she is very, very effective.`}]},{id:"post-lore",date:"Compiled — Full Deployment",title:"LORE COMPENDIUM — Manor Layout & Intelligence Summary",tags:["RAVENTREE MANOR","MANOR LAYOUT","ORACLE","PLANAR FRACTURE","LORE"],classification:"INTELLIGENCE NOTE",phase:"pre",sections:[{type:"text",content:"Compiled from eighteen days of observation, library research, direct interaction with Perrius Annmatar, and Guild briefing materials. This represents the most complete intelligence on Raventree Manor currently held by any single operative."},{type:"heading",content:"MANOR LAYOUT — GROUND FLOOR"},{type:"box",style:"room",label:"Ground Floor Summary",content:"R02 FOYER — Ruined marble, collapsed chandelier, grand staircases, root-blocked library doors. The guest book with Perrius Annmatar's entry 20 years ago. R03 HALLWAYS — West collapsed, east locked solid. Hidden passage to foyer. R04 LIBRARY — Immense, ransacked. Secret servant stair behind 'Useful Passages' book. Display case with three protected spell scrolls. Silver dagger (DC monogram). R05 OFFICE — Collapsed ceiling forms ramp to second floor. EC initials on bedframe. R06 STORAGE — Acid-trapped barrel. R07 WORKSHOP — Ylana's furniture stored after her death. The ring I pocketed. R08 GALLERY — The mirror. The formulae. The Oracle's gateway. The Mole destroyed part of the inscription. R09 LOUNGE — Defaced portraits, ransacked drinks cabinet. Secret door to gallery. R10 VERANDA — Boot prints, shattered glass thrown 25+ feet. R11 KITCHEN — Five rust monsters. Danos says useful, I say absurd."},{type:"heading",content:"MANOR LAYOUT — SECOND FLOOR"},{type:"box",style:"room",label:"Second Floor Summary",content:"R16 HALLWAY LANDING — Grand staircase landing, east/west split. R18 WESTERN LANDING — Reading nook, collapsed stairs to attic. Secret closet with peephole into Master Bathroom. R19 GUEST ROOMS — Five colour-coded rooms, Watcher's Hall between Blue and Red (illusory wall, one-way mirrors, silence enchantment). Guest lavatory. Secret collapsed stair to first floor. R20 LORD'S CHAMBERS — Ruined audience chamber, collapsed ceiling, grim host of spectral servants at night. Ochre Jelly in the lavatory. Spiral stair doors sealed. Servant's stairs end at hidden latch. R21 MASTER BEDROOM — Preserved by faltering spell. Immaculate desk. The Hidden Circle — broken teleportation circle under the rug. Key in desk drawer for library display case."},{type:"heading",content:"MANOR LAYOUT — ATTIC"},{type:"box",style:"room",label:"Attic Summary",content:"S01 SOLARIUM — Rusting iron-and-glass ceiling, thousands of glass shards, mirrors arranged in a ring. Where the mirror entity was confronted. R24 BUTLER'S QUARTERS — Staff lounge, abandoned card game, secret passage via fake book. R25 BURN ROOM — Words carved into every surface by merged consciousness: 'trapped,' 'not me,' 'many,' 'alone.' R26 SENESCHAL'S ROOM — Shadow-burn silhouettes on furniture. A screaming face. Faceless servant portrait. Dust recently disturbed on mirrors. R23 SERVANT HALLWAYS — Trapped bathroom (thunder detonation). Most floors collapsed."},{type:"heading",content:"MANOR LAYOUT — EXTERIOR / GROUNDS"},{type:"box",style:"room",label:"Grounds Summary",content:"COURTYARD — Wide, stone landing, great oaken doors with Corvinarus oak crest. Empty windows flank the entrance. NORTHERN PATH — Fountain with headless defaced statue. Mass grave in the flowerbeds — dozens of bodies, consecrated by a cleric who died afterward. GROUNDSKEEPER'S COTTAGE — Impassable hedge wall. Ten Wights shelter inside. DO NOT APPROACH. GREENHOUSE — Rusting, eastern grounds. Danos noted but did not enter. THE GREAT TREE — Dead, webbed canopy, wrapped creatures hanging from branches. Giant spiders. Golden Knight statuette at base (mirror puzzle piece). MEMORIAL FOUNTAIN — In the hedge maze. Consecrated safe haven. Memorial to Ylana Annmatar. Magical water font. Small wooden bunny toy with 'Y.A.' and 'E.C.' initials."},{type:"heading",content:"THE THREE MANORS — PLANAR SHARDS"},{type:"box",style:"intel",label:"Feyward / Shadeward / Material",content:`MATERIAL MANOR: Where we are. Iron Legion has established control. The Vigilance renamed the Legionlance. Guild operates in support role. PL1 fracture centred here.

FEYWARD MANOR: Feywild reflection. Lady Aurelian Corvinarus holds court. Eternal parties, drunken satyrs, sprites in greenhouses, a giant Guardian Butterfly, Wario's catalogue of absurd merchandise. The broken magic circle under the master bedroom rug connects here — estimated 4 days to repair, aligning with month-end. Sergeant Coldbrook's Legion squad is trapped here with five of original eight soldiers.

SHADEWARD MANOR: Shadowfell reflection. Orangus Cornelius hosts vampire dinners. The Onyx Hand operates. Monochrome reality. Fire magic doesn't work — Archie's primary offensive capability was nullified. Green T was held as a 'guest.' The Onyx Knight Kyrn offered friendship to Remi after her allies fled. Vivian haunts the corridors.`},{type:"heading",content:"THE CORNELIUS FAMILY — COMPILED"},{type:"box",style:"lore",label:"Family Tree & Key Figures",content:`DRAGONUS CORNELIUS: Patriarch, 3 generations back. The statuette in the gallery bears his name.

DARIUS CORNELIUS: Orantha's contemporary — possibly husband or brother. Master wizard. The master bedroom desk, the component cabinet, the research journal. Obsessive organiser after losing Ylana. The inscription 'To my beloved daughter, that she may follow in my footsteps' in EC's textbook.

YLANA CORNELIUS (née Annmatar?): Lady of the house. Died — circumstances in the journal. Her furniture was moved to the workshop. Memorial fountain in the hedge maze. The gold bracelet. The music box in the closet. Perrius Annmatar's connection — family name match.

ELSCIETH CORNELIUS (EC): Daughter. Young woman. The battered journal. The pink curtains. Bullied by her little brother. 'AC' — the little brother?

ORANTHA CORNELIUS: The Oracle. Planar cartographer. Built the mirror gateway. Went through twelve years ago and did not return. Her letter says keep the toad safe.

ORANGUS CORNELIUS: Shadowfell host. Vampire dinner party. Connected to AC? The painting Remi found — a toad petting a dog, possibly Orangus.
