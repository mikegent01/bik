<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | The Onyx Hand</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/systems/onyx-hand-system.css">
    <link rel="stylesheet" href="onyx-hand.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">

            <main id="main-content">

                <!-- Faction Header -->
                <header class="faction-hero onyx-theme">
                    <div class="hero-backdrop"></div>
                    <div class="hero-content">
                        <div class="faction-emblem">
                            <img src="assets/factions/faction_onyx_hand.png" alt="Onyx Hand Emblem">
                        </div>
                        <div class="faction-title">
                            <h1>The Onyx Hand</h1>
                            <p class="faction-tagline">"In darkness, we are eternal. In blood, we are bound."</p>
                        </div>
                        <div class="faction-status">
                            <span class="status-badge status-hunted">⚠️ HUNTED</span>
                            <span class="status-reason">Supernatural Sovereignty Act in Effect</span>
                        </div>
                    </div>
                </header>

                <!-- Moon Phase Banner -->
                <div id="moon-phase-banner" class="moon-banner">
                    <!-- Injected by JS -->
                </div>

                <!-- Navigation Tabs -->
                <nav class="faction-nav">
                    <button class="faction-nav-btn active" data-section="overview">Overview</button>
                    <button class="faction-nav-btn" data-section="covens">The Covens</button>
                    <button class="faction-nav-btn" data-section="court">Crimson Court</button>
                    <button class="faction-nav-btn" data-section="bloodlines">Bloodlines</button>
                    <button class="faction-nav-btn" data-section="territories">Territories</button>
                    <button class="faction-nav-btn" data-section="threats">Threats</button>
                    <button class="faction-nav-btn" data-section="shadow-estate">Shadow Estate</button>
                </nav>

                <!-- Content Sections -->
                <div class="faction-sections">

                    <!-- Overview Section -->
                    <section id="section-overview" class="faction-section active">
                        <div id="overview-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                    <!-- Covens Section -->
                    <section id="section-covens" class="faction-section">
                        <div id="covens-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                    <!-- Crimson Court Section -->
                    <section id="section-court" class="faction-section">
                        <div id="court-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                    <!-- Bloodlines Section -->
                    <section id="section-bloodlines" class="faction-section">
                        <div id="bloodlines-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>
    <section id="section-shadow-estate" class="faction-section">
        <div id="shadow-estate-content">
            <!-- Injected by JS -->
        </div>
    </section>
                    <!-- Territories Section -->
                    <section id="section-territories" class="faction-section">
                        <div id="territories-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                    <!-- Threats Section -->
                    <section id="section-threats" class="faction-section">
                        <div id="threats-content">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                </div>

            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="onyx-hand.js"></script>
    <script defer src="../../core/wario-site-sounds.js"></script>
    <script defer src="../../styles/waluipedia-ambient.js"></script>
</body>
</html>
