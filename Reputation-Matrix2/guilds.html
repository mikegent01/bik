
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Guilds & Charters</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="guilds.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             
            <main id="main-content">
                 <div class="guilds-header">
                     <h2 class="page-title">Guilds & Charters Registry</h2>
                     <div class="guild-controls">
                         <button class="filter-btn active" data-filter="all">All</button>
                         <button class="filter-btn" data-filter="guild">Guilds</button>
                         <button class="filter-btn" data-filter="charter">Charters</button>
                         <button class="filter-btn" data-filter="my-guilds">My Memberships</button>
                     </div>
                 </div>

                 <div id="guilds-dashboard">
                     <!-- User's Guild Membership Panel (Dynamic) -->
                     <div id="my-membership-container"></div>

                     <!-- Main Grid -->
                     <div class="section-label">Directory Listing</div>
                     <div id="guilds-grid" class="guilds-grid">
                         <!-- Injected by JS -->
                     </div>
                 </div>
            </main>
        </div>
    </div>

    <!-- Guild Detail Modal -->
    <div id="guild-modal" class="modal" style="display: none;">
        <div class="modal-content guild-modal-content">
            <button class="modal-close guild-modal-close">&times;</button>
            <div id="guild-modal-body">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="guilds.js"></script>
    <script defer src="wario-site-sounds.js"></script>
</body>
</html>
