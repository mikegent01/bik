
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Demographics</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="species.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 <h2 class="page-title">Demographics & Population Analysis</h2>
                 <p class="page-subtitle">A comprehensive breakdown of population distribution, species density, and regional demographics based on the latest Vigilance reconnaissance data.</p>
                 
                 <div id="dashboard-grid">
                    <div class="chart-container full-width">
                        <h3>Global Species Distribution</h3>
                        <div class="canvas-wrapper">
                            <canvas id="global-species-chart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container half-width">
                        <h3>Population by Region</h3>
                        <div class="canvas-wrapper">
                            <canvas id="regional-population-chart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container half-width">
                        <h3>Key Faction Manpower Estimates</h3>
                        <div class="canvas-wrapper">
                            <canvas id="faction-strength-chart"></canvas>
                        </div>
                    </div>
                 </div>

                 <div id="species-grid-container">
                    <!-- Detailed species cards will be injected here by JS -->
                 </div>
            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="species.js"></script>
</body>
</html>
