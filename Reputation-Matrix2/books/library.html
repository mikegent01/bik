<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Public Libraries</title>
    <link rel="stylesheet" href="../app/styles/global.css">
    <link rel="stylesheet" href="../app/styles/layout.css">
    <link rel="stylesheet" href="../app/styles/components.css">
    <link rel="stylesheet" href="library.css">
    <link rel="stylesheet" href="../app/styles/shop-wallet-sync.css">
    <script type="module" src="../app/styles/shop-wallet-sync.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             
            <main id="main-content">
                 <div class="page-header" style="background: rgba(138,75,255,0.12); border: 1px solid var(--accent); border-radius: 12px; padding: 18px; margin-bottom: 20px; display: flex; gap: 16px; align-items: flex-start">
                   <div style="font-size: 36px; line-height: 1">📜</div>
                   <div>
                     <h2 class="page-title" style="margin: 0; font-size: 22px; color: var(--accent2)">Master Scribe Inkwell's Royal Scriptorium Terminal</h2>
                     <p class="page-subtitle" style="margin-top: 4px; color: var(--muted); font-size: 13px">Curated by Master Scribe Inkwell — Chief Genealogist to House Toadstool & Royal Archivist of the Midlands.</p>
                     <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px">
                       <a href="../../index.html#/books" style="color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; text-decoration: none; font-size: 11px; background: var(--bg2)">📚 Native Waluipedia Reader</a>
                       <a href="../app/pages/library/bookshelf.html" style="color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; text-decoration: none; font-size: 11px; background: var(--bg2)">📜 Royal Bookshelf Portal</a>
                       <a href="../../index.html#/dynasties" style="color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; text-decoration: none; font-size: 11px; background: var(--bg2)">👑 Dynasty Genealogies</a>
                     </div>
                   </div>
                 </div>
                 <div id="library-collections-container">
                    <!-- Library collections will be injected here by JS -->
                 </div>
            </main>
        </div>
    </div>

    <div id="book-reader-modal" class="book-modal-overlay">
        <div class="book-modal-content">
            <button id="book-modal-close" class="book-modal-close">&times;</button>
            <h3 id="book-modal-title"></h3>
            
            <div id="book-cover-view">
                <img id="book-cover-image" src="" alt="Book Cover">
                <div id="book-description-container"></div>
                <button id="open-book-btn">Open Book</button>
            </div>

            <div class="book-reader-body" id="book-pages-view">
                <div class="book-page left-page" id="book-page-left"></div>
                <div class="book-page right-page" id="book-page-right"></div>
            </div>
            <div class="book-navigation">
                <button id="prev-page-btn">&laquo; Previous</button>
                <span id="page-indicator"></span>
                <button id="next-page-btn">Next &raquo;</button>
            </div>
        </div>
    </div>

    <script type="module" src="../app/core/common.js"></script>
    <script type="module" src="../app/pages/navigation/navigation.js"></script>
    <script type="module" src="library.js"></script>
    <script defer src="../app/core/wario-site-sounds.js"></script>
    <script defer src="../app/styles/waluipedia-ambient.js"></script>
</body>
</html>
