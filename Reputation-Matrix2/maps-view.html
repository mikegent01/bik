<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Integrated Tactical Map</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="maps.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            <!-- Native Walupedia Ecosystem Header inside standalone view -->
            <div style="background: linear-gradient(90deg, #1f1245, #0f0a21); border-bottom: 2px solid #8a4bff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'Roboto Mono', monospace; z-index: 9999; position: relative; color: #fff;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 20px;">🗺️</span>
                    <div>
                        <b id="unified-header-title" style="color: #ffd700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Orbitron', sans-serif;">Integrated Tactical Map</b>
                        <div style="color: #a78bfa; font-size: 11px;">Part of the Unified Waluigi Terminal Ecosystem</div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="location.href='battlefield.html#/atlas'" style="background: #8a4bff; border: 1px solid #c084fc; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.15s; outline: none; font-family: 'Roboto Mono', monospace;">
                        🍩 View World Atlas
                    </button>
                    <button onclick="location.href='battlefield.html'" style="background: transparent; border: 1px solid #4b5563; color: #9ca3af; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.15s; outline: none; font-family: 'Roboto Mono', monospace;">
                        🏠 Walupedia Home
                    </button>
                </div>
            </div>
             
            <main id="main-content" style="padding-top: 10px;">
                 <h2 class="page-title" id="unified-page-title" style="margin-top: 10px;">Tactical Maps</h2>
                 <div id="maps-layout">
                    <div id="map-view-container">
                        <div id="map-controls">
                            <div id="dynamic-map-controls">
                                <!-- Tabs and modes will be rendered here by map-ui.js -->
                            </div>
                        </div>
                        <button id="edit-map-btn" class="control-btn" style="display: none; width: 100%; margin-top: 16px;">Edit Map</button>
                        <div id="map-editor-toolbar" style="display: none;">
                            <div id="poi-palette"></div>
                            <div class="toolbar-actions">
                                <button id="draw-fog-btn" class="control-btn">Draw Fog</button>
                                <button id="remove-item-btn" class="control-btn">Remove Item</button>
                                <button id="generate-code-btn" class="control-btn positive">Generate Code</button>
                            </div>
                        </div>
                        <div id="map-display-area">
                            <!-- Map will be rendered here -->
                        </div>
                    </div>
                    <aside id="map-detail-panel" class="card">
                        <div id="map-detail-content">
                            <p class="panel-placeholder">Select a point of interest for details.</p>
                        </div>
                    </aside>
                 </div>
            </main>
        </div>
    </div>

    <!-- Modal for Popups -->
    <div id="map-modal" class="modal">
        <div class="modal-content">
            <button id="map-modal-close" class="modal-close">&times;</button>
            <h3 id="map-modal-title"></h3>
            <div id="map-modal-content"></div>
        </div>
    </div>

    <div id="poi-editor-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>Add Point of Interest</h2>
            <form id="poi-form">
                <div class="form-group">
                    <label>Type:</label>
                    <p id="poi-form-type"></p>
                </div>
                <div class="form-group">
                    <label for="poi-name">Name:</label>
                    <input type="text" id="poi-name" required>
                </div>
                <div class="form-group">
                    <label for="poi-description">Description:</label>
                    <textarea id="poi-description"></textarea>
                </div>
                <div class="form-group">
                    <label for="poi-faction">Associated Faction (Optional):</label>
                    <select id="poi-faction"></select>
                </div>
                <div class="form-group">
                    <label for="poi-intel">Intel Level Required (Optional):</label>
                    <input type="number" id="poi-intel" min="0" max="100" placeholder="e.g., 50">
                </div>
                <button type="submit" class="startup-btn">Add Point</button>
            </form>
        </div>
    </div>

    <div id="code-output-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>Generated Map Code</h2>
            <p>Copy the code below and replace the corresponding arrays in the specified file.</p>
            <div class="code-output-group">
                <label for="poi-code-output">pointsOfInterest:</label>
                <textarea id="poi-code-output" class="code-output-textarea" readonly></textarea>
            </div>
             <div class="code-output-group">
                <label for="fog-code-output">fogOfWar:</label>
                <textarea id="fog-code-output" class="code-output-textarea" readonly></textarea>
            </div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="maps.js"></script>
    <script defer src="wario-site-sounds.js"></script>
</body>
</html>
