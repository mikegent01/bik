<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XP Emporium | Wario's Warehouse</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="shop.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            <!-- Sidebar will be populated by navigation.js -->
            <aside id="sidebar"></aside>
            
            <main id="main-content">
                <div class="shop-page">
                    <!-- Header -->
                    <header id="shop-header" class="shop-header">
                        <div class="loading-state">
                            <div class="loading-spinner"></div>
                            <p>Opening the Vault...</p>
                        </div>
                    </header>
                    
                    <!-- Main Shop Layout -->
                    <div class="shop-layout">
                        <!-- Left Sidebar - Categories & Cart -->
                        <aside class="shop-sidebar">
                            <div class="sidebar-section">
                                <h3 class="section-title">📂 Categories</h3>
                                <div id="shop-categories"></div>
                            </div>
                            
                            <div class="sidebar-section">
                                <div id="shop-cart"></div>
                            </div>
                            
                            <div class="sidebar-section">
                                <div id="purchase-history"></div>
                            </div>
                        </aside>
                        
                        <!-- Main Content - Items Grid -->
                        <section class="shop-main">
                            <div id="shop-items" class="shop-grid">
                                <div class="loading-state">
                                    <div class="loading-spinner"></div>
                                    <p>Loading inventory...</p>
                                </div>
                            </div>
                        </section>
                        
                        <!-- Faction Tab Content (Hidden by default) -->
                        <section id="faction-content" class="faction-content" style="display: none;">
                            <div class="loading-state">
                                <div class="loading-spinner"></div>
                                <p>Loading Faction Data...</p>
                            </div>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Receipt Modal -->
    <div id="receipt-modal" class="modal-overlay" style="display: none;">
        <div class="receipt-modal-content">
            <div id="receipt-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="shop.js"></script>
</body>
</html>
