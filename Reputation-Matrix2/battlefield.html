reat and Underappreciated","race":"Human (Magnificent)","status":"Active — currently in the Feywild, surviving through sheer stubbornness","affiliation":"Wario's Enterprise / Disaster Inc. (reluctantly)","summary":"Waluigi is the author of this encyclopedia, the greatest athlete in the Mushroom Kingdom, a master of ice magic and arcane rays, and the single most underappreciated individual in recorded history. He is tall, handsome, and possesses a sense of style that lesser beings cannot comprehend. This article is completely objective because Waluigi wrote it and Waluigi is incapable of bias regarding himself.","description":"Waluigi stands before you—or would, if you were worthy of standing in his presence—as the definitive example of excellence ignored. While Mario gets parades and Luigi gets sympathy and Wario gets... whatever Wario gets (money, usually), Waluigi receives nothing but the satisfaction of knowing he is superior to everyone who overlooks him.\\n\\nThis is not bitterness. This is FACT.\\n\\n## Athletic Excellence\\n\\nWaluigi has competed in every sporting event the Mushroom Kingdom has ever hosted and has been ROBBED of victory in approximately ninety percent of them. The referees are biased. The scoring systems are rigged. The other competitors—particularly a certain pair of PLUMBER BROTHERS—receive preferential treatment that would be scandalous if anyone bothered to investigate.\\n\\nDespite this institutional opposition, Waluigi has achieved remarkable athletic success through sheer determination and physical gifts that include exceptional height, superior reflexes, and legs that can kick a tennis ball through a CASTLE WALL. Waluigi's specialty is tennis, though he excels at go-karting, party games, soccer, baseball, golf, and any other competition that allows him to demonstrate his obvious supremacy.\\n\\n## Magical Capabilities\\n\\nWaluigi's magical abilities have proven critical during the 1040 BF crisis. His ice magic—capable of freezing web structures, creating frozen corridors through hostile terrain, and shattering obstacles—was instrumental during the Battle of the Spider Grove. His arcane rays weakened the Arachnid Matriarch during the final phase of that engagement, targeting joint structures and contributing directly to the banishment victory.\\n\\nThese magical capabilities are ENTIRELY self-taught, which makes them more impressive than the pampered spellcasting of Mages' Guild graduates who learned their craft in COMFORTABLE TOWERS with INDOOR PLUMBING. Waluigi learned magic the hard way—through experimentation, failure, and the refusal to accept that anything is beyond his reach.\\n\\n## Role in the Current Crisis\\n\\nWaluigi has been an active participant in the events surrounding Raventree Manor, the Planar Fracture, and the multi-dimensional catastrophe that has scattered Disaster Inc. across hostile planes. His contributions include:\\n\\n- Clearing paths with ice magic during the Spider Grove rescue operation\\n- Providing sustained arcane ray fire during the Arachnid Matriarch engagement\\n- Surviving the Planar Fracture and maintaining operational effectiveness in the Feywild\\n- Navigating Lady Aurelian Corvinarus's fey court without accidentally selling his soul, shadow, or naming rights\\n- Documenting the entire crisis through this encyclopedia, which future historians will recognize as the definitive account\\n\\nWaluigi is currently trapped in the Feywild with Toad Lee, dealing with fairy politics that make Mushroom Kingdom diplomacy look straightforward. He is handling this situation with characteristic grace, determination, and only moderate amounts of screaming into pillows when nobody is watching.\\n\\n## Personal Philosophy\\n\\nWaluigi's worldview can be summarized simply: the universe owes Waluigi recognition, the universe has failed to provide that recognition, and Waluigi will TAKE what is owed through excellence so undeniable that even the biased machinery of reality cannot ignore it.\\n\\nThis is not arrogance. Arrogance is unearned confidence. Waluigi's confidence is EXTREMELY earned through decades of athletic achievement, magical development, and survival against odds that would have crushed lesser individuals. Waluigi has fought dragons (indirectly). Waluigi has battled giant spiders (directly). Waluigi has endured fairy court politics (EXHAUSTINGLY). What has MARIO done lately? Jumped on a turtle? WAH.\\n\\n## Relationships\\n\\nWaluigi's primary partnership is with Wario, his business associate and the only person Waluigi trusts with money. Wario is greedy, loud, and smells like garlic, but he is also HONEST about what he is, which Waluigi respects more than the false nobility of so-called heroes.\\n\\nWaluigi's relationship with the rest of Disaster Inc. is complicated. He respects Markop's combat capabilities. He tolerates Archie's pyromania (from a safe distance). He appreciates Remi's determination. He finds the Oracle mysterious in ways that are either intriguing or infuriating depending on the day. He considers Green T a kindred spirit—someone who has been underestimated, dismissed, and ultimately proven MORE dangerous than anyone expected.\\n\\nWaluigi's relationship with Luigi is... Waluigi does not wish to discuss his relationship with Luigi. The article is over. WAH.","keyEvents":["spider_grove_battle","planar_fracture"],"relatedArticles":["wario_enterprise","disaster_inc","house_corvinarus"]},{"id":"archie_miser","name":"Archie Miser","title":"The Indebted Pyromaniac","race":"Human","status":"Active — Escaped Shadow Estate; Magic restored; Financially ruined","affiliation":"Disaster Inc.","summary":"Archie Miser survived the Shadowfell, got his fire magic back, and immediately incurred a 2,062 gold piece debt to the Mages' Guild for breaking a single rope. He also uncovered that Toadburt is a sleeper agent wearing an Iron Legion Entropy Ring, and that the Oracle has built a 'Bridge Plane' to collapse reality. Waluigi considers Archie a walking disaster, but admits his paranoia is finally entirely justified.","description":"Archie's time in the Shadowfell tested him in the cruelest way possible: it took away his fire. Forced to rely on actual wits instead of explosions, Archie disguised himself as a vampire guard (choosing the painfully uncreative name 'Dracacide' and later 'Vin'). \\n\\n**The Mages' Guild Audit**\\nAfter the Shadow Anchor shattered and Archie regained his magic, he became separated from the party and stumbled into Mages' Guild operatives (Agent L and Thornbury) clearing the ruined manor. Archie eavesdropped on them and learned terrifying intelligence: the Guild was perfectly willing to let Archie die to destabilize the planar ghosts. \\n\\nWorse, when Archie tried to climb a rope provided by Thornbury, the rope snapped. Thornbury immediately handed Archie an itemized bill for 2,062 gold and 5 silver. The bill included a 'Master Weaver's Inspection,' an 'Ogre Load-Test Certification,' and a 'Guild Master's Discretionary Gratuity.' Waluigi wept tears of joy reading this bill. The Mages' Guild are bureaucratic extortionists, and Waluigi respects the sheer grift of charging a man two thousand gold for a broken rope. Archie is now financially ruined.\\n\\n**The Burden of Knowledge**\\nArchie carries two massive secrets. First, he holds the cracked 'handler' half of an Entropy Ring. He learned that the Iron Legion forced the other half onto Toadburt, turning the poor Toad into a sleeper agent programmed to capture the Oracle. Archie kept this secret, hoping to use the handler ring to jam the signal and free Toadburt. \\n\\nSecond, he learned from the Guild spies that the Oracle has constructed a 'Regulator Plane' (a Bridge Plane) that connects the Shadowfell, Feywild, and Material planes, which she potentially intends to collapse entirely.\\n\\nArchie is exhausted, hunted by rogue Mages' Guild operatives (including a Toad named Purple T), and carrying the weight of multiple dimensional conspiracies. Waluigi advises standing even further away from Archie now. Stress makes him combustible. WAH.","keyEvents":["shattering_shadow_anchor","planar_fracture"],"relatedArticles":["disaster_inc","toadburt","mages_guild","dan_the_toad"]},{"id":"luigi","name":"Luigi","title":"The Reluctant Ghostbuster","race":"Human","status":"Active — Conscripted by the Mages' Guild","affiliation":"Mushroom Kingdom / Mages' Guild (Contractor)","summary":"Luigi is Mario's taller, greener, infinitely more anxious brother. Armed with the Poltergust, he has been conscripted by the Mages' Guild to clear the ghosts out of Raventree Manor alongside Archie Miser. He complains, he shivers, he cries in corners, but he gets the job done. Waluigi refuses to admit Luigi is competent, attributing all of his success to the vacuum cleaner.","description":"Waluigi finds writing this entry physically painful, but historical accuracy demands it. Luigi arrived at the Ruined Manor working under a contract for Agent L of the Mages' Guild. His job is simple: use his mechanical vacuum (the Poltergust) to suck up the spectral anomalies destabilizing the physical plane.\\n\\n**Ghost Hunting Mechanics**\\nLuigi's combat style is entirely fear-based. When confronted by a 'Waltzgeist' in the ruined dance hall, Luigi clapped his hands, sparked a green fireball, missed, got punched by a ghost, and then frantically vacuumed the entity out of the air while Archie provided covering fire. \\n\\nThe Poltergust currently holds seven minor ghosts and two 'Red Zone' entities that Luigi absolutely refuses to talk about. He treats the machine like a bomb, checking its integrity seals obsessively. \\n\\n**The Bubble Bath Incident**\\nDespite his cowardice, Luigi is practical. He picked a locked door using Iron Legion currency (knowing that local currency draws less suspicion) and successfully blinded a squad of animated, zombie-like coats using the Poltergust's strobe light. Most offensively, while Archie and Bones were engaged in tense espionage, Luigi took a luxurious bubble bath in the ruins, claiming it helped him 'expel ectoplasm.' Waluigi hates him so much. WAH.","keyEvents":["planar_fracture"],"relatedArticles":["archie_miser","mages_guild"]},{"id":"thornbury","name":"Thornbury","title":"The Quartermaster Spy","race":"Human","status":"Active — Dragged away by his ear","affiliation":"Mages' Guild","summary":"Thornbury is a stuffy, penny-pinching Mages' Guild operative who charged Archie 2,000 gold for a broken rope. He later brought Archie and Bones rubber duckies for a bubble bath, only to be dragged away by the ear by a disgruntled noblewoman. He left behind a notebook proving he was spying on the party the entire time. Waluigi has zero respect for a spy who is defeated by a bath time interruption.","description":"Thornbury is the embodiment of everything wrong with modern magical espionage. He accompanied Agent L, Luigi, and Archie through the ruined manor, constantly tracking expenses. When his 50-foot hempen rope snapped under Archie's weight, Thornbury produced an absurd, itemized bill that included a 'Master Weaver's Inspection' and an 'Ogre Load-Test Certification.' \\n\\nDespite this bureaucratic nonsense, Thornbury was secretly gathering detailed intelligence on Archie and the party. His espionage came to an abrupt, humiliating end when Byscilla Danos (a commander) caught him using generator-heated well water for a luxury bath while soldiers suffered heatstroke outside. She grabbed him by the ear and dragged him away. In his haste, he dropped his field notes, revealing his true motive. The man is a professional spy who was bested by an angry aristocrat and a rubber duck.","keyEvents":[],"relatedArticles":["mages_guild","archie_miser","luigi"]},{"id":"hargram_fidger","name":"Hargram Fidger","title":"The Chapel Commander","race":"Unknown","status":"Active — Operating in the Ruined Manor","affiliation":"Iron Legion","summary":"Hargram Fidger is an Iron Legion official associated with the 'local Legion chapel.' He attempted to recruit or interrogate Archie Miser shortly after an assassination attempt, but was turned away. He seems to command a significant guard presence. Waluigi assumes he is just another cog in the Legion's oppressive, paperwork-obsessed machine.","description":"Not much is known about Hargram Fidger yet, other than his impeccable timing for interrupting people who have just survived an assassination attempt. Following the Mole's attack on Archie Miser (thwarted by Bones), Hargram entered the room flanked by guards, claiming he was there to 'protect the injured.'\\n\\nArchie, wisely recognizing that the Iron Legion's 'protection' usually involves indefinite detainment and execution orders, told Hargram to leave. Hargram politely backed off, introduced himself as being with the local Legion chapel, and promised they would have a 'better meeting another time.' \\n\\nThe fact that he backed down suggests he either respects diplomatic boundaries or, more likely, is waiting to catch Archie in a more vulnerable position. Waluigi advises extreme caution. Iron Legion officials who smile and retreat are usually just going to fetch more forms for you to fill out before they kill you.","keyEvents":[],"relatedArticles":["iron_legion","archie_miser"]},{"id":"green_t","name":"Green T","title":"The Giant from the Children's Table","race":"Toad (with transformation capabilities)","status":"Active — surviving and thriving against all odds","affiliation":"Independent (formerly Tea Leaf Syndicate)","summary":"Green T is the most impressive individual Waluigi has encountered during the entire 1040 BF crisis, and Waluigi does not say that lightly because Waluigi has encountered HIMSELF during this crisis. Green T ran a criminal empire with the demeanor of a garden party host, survived its complete destruction, was dragged through a mirror dimension, reappeared in the Shadowfell, got insulted to the children's table at a vampire dinner party, and used that insult as cover to shoot a vampire lord with a silver bullet. His story is proof that being underestimated is a weapon, and Waluigi—who has been underestimated his entire life—finds that deeply inspiring.","description":"Green T was the leader of the Tea Leaf Syndicate, which operated aboard the Vigilance as the classiest criminal organization Waluigi has ever encountered. The Syndicate served excellent tea, maintained tasteful décor, and conducted criminal enterprises with an aesthetic sensibility that Waluigi respected enormously. Green T ran this operation with supernatural calm—meetings were conducted over tea, threats were delivered with impeccable politeness, and violence was reserved for situations where other options had been exhausted.\\n\\nNobody knew Green T could turn into a giant.\\n\\nNOBODY.\\n\\n## The Transformation\\n\\nDuring the Syndicate Showdown—the final confrontation that destroyed the Tea Leaf Syndicate—Green T revealed a capability that nobody had suspected. When the fighting started, Green T GREW. Not just bigger—ENORMOUS. His body expanded until he filled the corridor like a living wall, and he used that massive form to crush an Iron Legion soldier with a single blow.\\n\\nWaluigi's jaw dropped. Waluigi's jaw does NOT drop easily. But watching the calm tea merchant who had always seemed like the most reasonable person in any room transform into a TITAN was one of the most shocking moments of the campaign. Green T had been hiding this ability the ENTIRE TIME—running a criminal empire, hosting meetings, serving tea—while possessing the power to become a colossus.\\n\\nThe restraint this represents is remarkable. Green T COULD have used his giant form to crush enemies, intimidate rivals, or dominate through raw physical power. Instead, he kept it hidden, using it only when the Syndicate's existence was already ending. That's discipline. That's strategy. That's the kind of long-term thinking that Waluigi aspires to but rarely achieves because Waluigi's emotions are POWERFUL and IMMEDIATE.\\n\\n## The Mirror Dimension\\n\\nGreen T's story took a dark turn during the Siege of Raventree Manor when a glass monster emerged from one of the manor's mirrors and targeted him specifically. During the chaos, the entity seized Green T and pulled him bodily through a mirror surface into a mirror dimension—a layer of reflected reality that existed alongside the physical world.\\n\\nWitnesses described it as violent and instantaneous. One moment Green T was there. The next, he was gone—dragged through glass like someone being pulled underwater. The mirror surface rippled, then went still, reflecting only an empty hallway.\\n\\nGreen T was presumed lost. Another casualty of Raventree Manor's supernatural hostility. Another victim of a building that eats people through its own décor.\\n\\nThen he reappeared in the Shadowfell.\\n\\n## The Shadow Estate Dinner\\n\\nGreen T's presence at the Shadow Estate dinner party is itself remarkable—he had been dragged through a mirror dimension, transited through unknown planar layers, and emerged in the Shadowfell's reflection of the manor, apparently intact and ready to cause problems for vampires. Waluigi does not know the details of this journey. Green T has not been forthcoming. What matters is that he SURVIVED when survival seemed impossible.\\n\\nAt the dinner, the vampire lords placed Green T at the children's table. This was intended as an insult—a dismissal of someone they considered beneath the dignity of adult conversation. The vampires saw a survivor, a refugee from the broken Tea Leaf Syndicate, someone with no faction backing and no obvious threat capability.\\n\\nThis was the single greatest mistake they could have made.\\n\\nGreen T used the insult as cover. While the vampires focused their attention on Archie's diplomatic performance at the main table, Green T spent the dinner observing, planning, and preparing. He mapped the room. He identified exits and guard positions. He waited for the exact moment when everyone's attention was elsewhere.\\n\\nThen he stood up from the children's table, produced a firearm loaded with silver bullets—how he smuggled it into a vampire dinner party remains unexplained—and shot Orangus Cornelius, the senior vampire lord, in front of everyone.\\n\\nTHE CHILDREN'S TABLE SHOT THE HOST.\\n\\nWaluigi WISHES he could have seen Orangus's face. The moment of comprehension when a centuries-old vampire lord realized he'd dismissed the most dangerous person in the room to sit with the CHILDREN. The fraction of a second between 'this cannot be happening' and 'this is absolutely happening.'\\n\\n## Assessment\\n\\nGreen T is what Waluigi aspires to be: someone who gets knocked down repeatedly, loses everything, and comes back MORE dangerous each time. He lost his organization to Archie's fireball and Earl Grey's explosion. He lost his freedom to the mirror dimension. He lost any pretense of belonging to a faction or having backup. And yet he kept going—surviving, adapting, and ultimately delivering one of the most satisfying moments of the entire campaign.\\n\\nWaluigi respects very few people unconditionally. Green T has earned that respect. He is proof that being underestimated is not a weakness—it's a weapon. And Waluigi, who has been underestimated his entire life, finds that deeply, personally meaningful.\\n\\nWaluigi would buy Green T a drink. Several drinks. And then Waluigi would ask him how he smuggled that gun into the dinner party, because Waluigi NEEDS to know. WAH.","keyEvents":["tea_party_incident","syndicate_showdown","siege_raventree","dinner_climax_vote"],"relatedArticles":["tea_leaf_syndicate","onyx_hand","archie_miser"]},{"id":"lady_bloomia","name":"Lady Bloomia","title":"The Keeper of the Secret Heir","race":"Toad","status":"Alive (Missing/Hiding) — Somewhere 'where roses grow in winter'","affiliation":"Princess Peach (Personal Handmaiden)","summary":"Lady Bloomia is the missing link to the greatest conspiracy in the Mushroom Kingdom. She was Princess Peach's handmaiden and the last person to see her alive. She didn't orchestrate the assassination—she smuggled out the evidence, and more importantly, she likely smuggled out Peach's secret half-Rakasha child. She has been running for 85 years, holding the truth in a leather case.","description":"Waluigi loves a good scandal, but the 'Bloomia Hypothesis' is a geopolitical earthquake. Newly uncovered journals reveal that Peach knew she was going to be assassinated. She prepared a leather case hidden behind a loose stone for Bloomia to take. \\n\\nBloomia survived the assassination night only because a figure known as 'The Silent One' sacrificed themselves in the servant passages to hold off Mages' Guild assassins. Bloomia fled the capital with proof that Toadsworth Sr. and the Regency orchestrated the murder to prevent Peach's hybrid child (fathered by Chief Thornpaw of the Rakasha) from taking the throne. \\n\\nBloomia is currently hiding using the cipher: 'I AM ALIVE. I AM WAITING. FIND ME IN THE PLACE WHERE ROSES GROW IN WINTER.' Waluigi intends to find her, if only to charge admission to the greatest historical reveal of the century.","keyEvents":["the_assassination_of_peach"],"relatedArticles":["princess_peach","mushroom_kingdom"]},{"id":"speaker_l","name":"Speaker L","title":"The Mastermind of the First Cohort","race":"Toad","status":"Active — Orchestrating containment at Raventree Manor","affiliation":"Liberated Toads / Pond Patrol","summary":"Speaker L is no longer a naive politician. He is a ruthless, brilliant tactician who just engineered the greatest prison break in Iron Legion history. He purposefully allowed himself to be captured just to plant a virus in Aegis Command, coordinating the escape of 158 Toads. He then marched to Raventree Manor, singing a legal decree, to place Archie Miser under arrest. Waluigi is officially intimidated.","description":"Speaker L has fully embraced the philosophy that institutions only respect power. During the Aegis Command riot, he utilized smuggled mini-mushrooms, biological peppermint gas that only affects Imperial lungs, and deep-cover sleeper agents to humiliate General Ironhand. \\n\\nImmediately after, he arrived at Raventree Manor. He didn't sneak in. He marched his Pond Patrol down the halls, utilizing a choreographed, musical reading of 'Emergency Resolution Seventeen-A' to legally and theatrically place Archie Miser and the rest of Disaster Inc. under arrest for unauthorized magic and reckless endangerment. He is acting less like a rebel leader and more like the founding father of a new, uncompromising military state.","keyEvents":["aegis_command_riot"],"relatedArticles":["liberated_toads","iron_legion","archie_miser"]},{"id":"the_oracle","name":"The Oracle (Orantha Cornelius?)","title":"The Metaphysical Custodian","race":"Unknown","status":"Active — Conducting the Separation Ritual","affiliation":"House Corvinarus / Raventree Manor","summary":"The Oracle is not a person; it is a role, a custodian of timelines, and currently, the most dangerous entity in Raventree Manor. He (or she, as the original builder of the portal was Orantha Cornelius) is rushing to complete a Separation Ritual to sever the bleeding timelines. He was shot in the head by Green T and didn't die—he just checkpointed reality. Waluigi does not trust anyone who survives a bullet to the brain without complaining.","description":"The Oracle's true motives are finally clear: he does not care about the party's survival, he cares about the integrity of the timeline. The Manor is a broken interplanar transit hub, and the Oracle is trying to close the blast doors.\\n\\nHe has led the party to the Summoning Room for the final ritual. He requires twelve participants to stand in geometric opposition (Ice vs Force, Memory vs Chaos). He explicitly warned them that the mirror will interrogate their truths, and any lies will rupture the circle. The Oracle is terrified of the Iron Legion and the Mages' Guild interfering, knowing that if the ritual fails, the timelines won't just explode—they will merge into a mundane, easily conquerable reality. He is racing the clock, and he requires blood to finish the spell.","keyEvents":["battle_of_the_mirror_room","planar_fracture"],"relatedArticles":["raventree_manor","corvinarus_family"]},{"id":"kamek","name":"Kamek","title":"The Fallen Regent","race":"Magikoopa","status":"Imprisoned — Stripped of power by Bowser","affiliation":"Koopa Troop (Formerly)","summary":"Kamek decided that Bowser's methods were obsolete, so he dug under the castle and awoke a world-eating space worm. It went poorly. He sacrificed hundreds of troops, declared himself the 'Regent Sorcerer', and was ultimately defeated by his own construction workers. Bowser has now sentenced him to eternal imprisonment in the very pit he opened. Waluigi thinks Kamek should have just stuck to kidnapping plumbers.","description":"Believing that brute force could not win the coming wars against the Iron Legion and the Regal Empire, Kamek sought absolute, ancient power. He broke the seals holding the Primordial Wyrm beneath the Valley of Bowser. The magic corrupted him, turning him into a 30-foot-tall puppet of the entity. \\n\\nHe was defeated by the 'Koopa Resistance'—a group of blue-collar workers, Goombas, and a heroic Demolitions Bob-omb who blew up the anchor crystals sustaining Kamek's power. Bowser returned, stripped Kamek of his titles, and threw him in the dungeon. The greatest wizard in Koopa history was brought down by unionized labor.","keyEvents":["primordial_wyrm_awakening"],"relatedArticles":["koopa_troop","bowser"]},{"id":"general_ironhand","name":"General Ironhand","title":"The Administrator of Atrocities","race":"Human","status":"Active — commanding the Iron Legion from Aegis Command","affiliation":"Iron Legion","summary":"General Ironhand is the commander of the Iron Legion and the person responsible for Order 120—the execution of all Toad prisoners in Legion custody. He is not a ranting warlord or a cackling villain. He is an administrator who happens to have the authority to sign orders for mass murder, and that makes him more terrifying than any dragon. Waluigi would like General Ironhand to go sit on a Thwomp. Waluigi would like this noted for the record.","description":"Waluigi has called many people villains in this encyclopedia. Waluigi has called HIMSELF a villain, usually as a joke, sometimes as branding. General Ironhand is not a villain in the way Waluigi uses the word. Villains have PERSONALITY. They monologue. They have aesthetic flair. They are defeated by heroes in dramatic confrontations.\\n\\nIronhand is not a villain. He's a SYSTEM wearing a general's uniform.\\n\\n## Character\\n\\nIronhand does not rant about conquest or destiny or the superiority of his cause. He does not make speeches. He does not cackle. He is a military administrator who runs an army the way a clerk runs an office—with schedules, protocols, efficiency metrics, and complete indifference to the human cost of his decisions.\\n\\nWhen Bones infiltrated Aegis Command and was caught, Ironhand handled the interrogation personally. Not because he was angry—anger would require emotional investment. He handled it because a successful infiltration of his headquarters was an administrative problem that required a personal solution. He stabbed Bones with precision, making a professional point about consequences, the way someone else might send a strongly-worded memo.\\n\\nThen he signed Order 120 with the same pen he probably used to approve equipment requisitions that morning.\\n\\n## Order 120\\n\\nWaluigi has written about Order 120 extensively in other articles and does not want to repeat the full horror here. The summary: Ironhand ordered the immediate execution of all Toad prisoners in Iron Legion custody because one infiltrator got caught and his security was embarrassed.\\n\\nThe order was carried out with the same efficiency that characterizes everything the Legion does. Guards who had been feeding prisoners, processing their paperwork, maintaining the routine, carried out executions because their general signed a document. The prisoners were variables. The variables were eliminated. The spreadsheets were updated.\\n\\nThis is what makes Ironhand terrifying. Not cruelty—INDIFFERENCE. He doesn't hate his enemies. Hatred would be personal. He PROCESSES them. He treats mass murder as a logistics problem and solves it accordingly.\\n\\n## Assessment\\n\\nWaluigi has fought dragons. Waluigi has battled giant spiders. Waluigi has navigated fairy courts and survived vampire dinner parties (secondhand, but still). None of those threats scare Waluigi the way General Ironhand scares him.\\n\\nDragons are dangerous but COMPREHENSIBLE. They want treasure or territory or to burn things. You can understand a dragon. You can predict a dragon. You can, if you're skilled or lucky, defeat a dragon.\\n\\nIronhand is dangerous because he's not comprehensible in the way monsters are comprehensible. He's comprehensible the way a MACHINE is comprehensible—you understand what each part does but the total effect is something that doesn't care about you at all. He will kill you, document the killing, file the documentation, and move to the next item on his agenda without the killing having affected him in any way.\\n\\nWaluigi does not know how to fight that. You can't outmaneuver a bureaucracy. You can't outfight a system. You can only survive until the system breaks or decides you're not worth processing.\\n\\nWaluigi wants General Ironhand to experience consequences for Order 120. Waluigi wants him to face the kind of justice he denied the prisoners. Waluigi wants him to sit on a THWOMP.\\n\\nWaluigi does not know if any of this will happen. But Waluigi wants it. WAH.","keyEvents":["iron_sky_breach","massacre_aegis"],"relatedArticles":["iron_legion","liberated_toads","aegis_command"]},{"id":"captain_toadette","name":"Captain Toadette","title":"The Ruthless Restorer","race":"Toad","status":"Active — commanding Peach Loyalist forces","affiliation":"Peach Loyalists","summary":"Captain Toadette is the military commander of the Peach Loyalists and the scariest person in the Mushroom Kingdom who isn't a dimensional horror or a kaiju. She plans operations with tactical brilliance, executes them with total commitment, and maintains a no-prisoners policy that would make the Iron Legion uncomfortable. Waluigi has arm-wrestled Bowser and felt LESS uneasy than he does contemplating Captain Toadette.","description":"Waluigi has met Toadette before the current crisis, in the context of sports events and party games. She was competitive, capable, and had excellent sportsmanship. The Toadette who commands the Peach Loyalists is... different. Something happened—the death of Princess Peach, the circumstances surrounding it, the feeling of being unable to prevent a catastrophe that should have been preventable—and the result is a military commander who has replaced sportsmanship with zealotry.\\n\\n## Military Capabilities\\n\\nToadette is a BRILLIANT tactician. This is not an exaggeration or a concession—it's a statement of fact that makes everything else about her more dangerous. The Fall of Bramblehaven was a masterpiece of siege warfare: sappers tunneling overnight, three simultaneous breach attacks, coordinated assault teams that took a fortified bastion in a single day. That level of planning requires intelligence, patience, and strategic vision.\\n\\nShe also shot one of her own sergeants for suggesting a tactical retreat.\\n\\nThis combination—tactical brilliance plus absolute moral certainty—is what makes Toadette terrifying. She's not cruel for the sake of cruelty. She genuinely believes that Princess Peach's cause demands total commitment, and total commitment means NO compromise. No retreats. No prisoners. Everything sacrificed on the altar of a dead princess's memory.\\n\\n## The No-Quarter Policy\\n\\nAfter Bramblehaven fell, fifteen garrison troops attempted to surrender. They put down their weapons, raised their hands, and gave up. Toadette's standing orders were clear: no prisoners from Fawful's forces. The surrendering troops were executed in the keep's courtyard.\\n\\nSome individual Loyalist soldiers reportedly hesitated or refused. They were overruled. The executions proceeded. By nightfall, Bramblehaven was silent.\\n\\nWaluigi has done questionable things in his life. He's cheated at tennis. He's participated in schemes with Wario that skirted the boundaries of law and good taste. But there are LINES, and executing surrendering enemies is so far past the line that the line is a dot on the horizon. Toadette crosses that line as a matter of policy. Deliberately. Repeatedly.\\n\\n## The Peach Connection\\n\\nWhat makes Toadette tragic—and Waluigi uses that word deliberately—is that she's doing all of this for Princess Peach, and Waluigi knew Peach. Waluigi COMPETED against Peach. Princess Peach was kind, gracious, and had the kind of sportsmanship that made losing to her slightly less infuriating than it should have been.\\n\\nPeach would not have approved of what is being done in her name. Waluigi is absolutely certain of this. Princess Peach would not have ordered prisoners executed. She would not have shot her own soldiers for suggesting retreat. She would not have demanded the kind of total war that Toadette wages.\\n\\nBut Peach is dead, and the Loyalists aren't asking her opinion. They're asking her MEMORY, and memory doesn't talk back. Toadette is fighting for a Princess Peach who exists only in her own grief—a version of Peach who would approve of atrocities, who would demand blood for blood, who would see total war as justice. This version never existed. But Toadette has built a military movement on serving it.\\n\\n## Assessment\\n\\nWaluigi fears Captain Toadette in a way he fears very few people. General Ironhand is terrifying because he's indifferent—he'll kill you and feel nothing. Toadette is terrifying because she BELIEVES—she'll kill you and feel righteous. The Iron Legion is a machine. The Peach Loyalists are a crusade.\\n\\nMachines can be broken. Crusades are harder to stop.\\n\\nWaluigi hopes Toadette finds something—a piece of evidence, a surviving memory, a ghost of the real Peach telling her to STOP—that brings her back from the edge she's standing on. But Waluigi also knows that people who have committed atrocities often can't turn back because turning back would mean confronting what they've done. It's easier to keep going, to add more sins to the pile, to believe that eventual victory will justify everything.\\n\\nWaluigi does not think victory justifies everything. Waluigi thinks some things CANNOT be justified, only done or not done. Toadette has chosen to do them.\\n\\nWAH.","keyEvents":["fall_bramblehaven"],"relatedArticles":["peach_loyalists","princess_peach","fawful_forces"]},{"id":"markop","name":"Markop","title":"The Titan Wrestler","race":"Unknown (capable of accepting Oracle blessings that cause ENORMOUS growth)","status":"Active — trapped in the Deep Mirror","affiliation":"Disaster Inc.","summary":"Markop is the combat specialist of Disaster Inc. and the person who grappled a building-sized spider while temporarily transformed into a TITAN through the Oracle's blessing. Waluigi fought alongside Markop during the Battle of the Spider Grove and came away genuinely impressed, which Waluigi does not say about many people because Waluigi's standards are VERY high. Markop hits things REALLY hard and this turns out to be extremely valuable when the things that need hitting are giant arachnids.","description":"Waluigi's first extensive interaction with Markop came during the Spider Grove battle, and that battle tells you everything you need to know about Markop as a person: when a giant spider appeared, Markop accepted a mysterious blessing from the Oracle, grew to TITAN size, and wrestled the monster while the rest of the party scrambled around at foot level trying not to get crushed.\\n\\nThat's Markop. When the problem is too big, Markop becomes bigger.\\n\\n## Combat Capabilities\\n\\nMarkop's primary contribution to Disaster Inc. is raw combat effectiveness. He can take hits that would kill normal people, deliver hits that would concern abnormal people, and maintain fighting effectiveness under conditions that would break most warriors. During the Spider Grove battle, he maintained a titan-scale grapple with the Arachnid Matriarch while trees cracked and the ground churned beneath them—a feat of sustained physical effort that Waluigi, despite his own considerable athletic gifts, does not think he could match.\\n\\nThe Oracle's blessing is the wildcard in Markop's capabilities. The blessing allowed him to grow to colossus size, matching the Matriarch's scale and engaging her in the only way possible—as an equal. Whatever the Oracle did, it involved cryptic words that didn't quite sound like language and a transformation that shouldn't have been biologically possible. Markop accepted it without hesitation, which tells Waluigi that Markop either trusts the Oracle implicitly or doesn't care about the risks when there's a monster to fight.\\n\\nWaluigi suspects it's the latter. Markop doesn't strike Waluigi as someone who thinks about long-term consequences when there's an immediate problem. This is both a strength—he acts decisively when action is needed—and a weakness—he may have agreed to things he doesn't fully understand.\\n\\n## The War Mage's Staff\\n\\nAfter the Matriarch was banished, Markop claimed the War Mage's Staff from the spider's hoard on Archie's behalf. This means Archie will eventually receive MORE fire capability, which Waluigi finds concerning. Markop apparently made this decision because the party needed Archie at full magical strength to deal with future threats, which is STRATEGICALLY sound even if it makes Waluigi's pyromania-related anxiety worse.\\n\\n## Current Status\\n\\nMarkop is currently trapped in the Deep Mirror—the most hostile of the three planar fragments—alongside Remi and the Oracle. The Deep Mirror is a dimension where physics don't work properly, time decays, and the entire realm appears to be consuming itself. Of all the places to be trapped, this is the worst.\\n\\nWaluigi worries about Markop in the Deep Mirror. Not because Markop isn't capable—he is—but because the Deep Mirror isn't the kind of threat you can wrestle. You can't grapple collapsing reality. You can't punch temporal decay. Markop's greatest strengths may be useless in a dimension that attacks you through the fundamental nature of existence rather than through anything as straightforward as a monster.\\n\\nWaluigi hopes Markop survives. Waluigi hopes the whole Deep Mirror team survives. And Waluigi hopes that when they reunite, Markop remembers that Waluigi's arcane rays HELPED bring down the Matriarch and maybe gives him some credit. Just a little credit. That's all Waluigi asks. WAH.","keyEvents":["spider_grove_battle","planar_fracture"],"relatedArticles":["disaster_inc","the_oracle","raventree_manor"]},{"id":"remi","name":"Remi","title":"The Master Looter and Card Bearer","race":"Unknown","status":"Active — Navigating the Shadow Estate; Possessor of The Oracle's Deck","affiliation":"Disaster Inc.","summary":"Remi has evolved from the 'FNG' to the party's most effective infiltrator and looter. While everyone else was fighting giant bats or singing zombies, Remi casually looted the vampire lord's bathroom, discovered Ryan's diary, outsmarted guards, and acquired a set of magical Tarot cards that predict the future. Waluigi is incredibly jealous. Waluigi wants cards that predict winning lottery numbers, not dimensional collapse.","description":"Remi's actions following the Shadow Estate dinner prove that being quiet and unassuming is a superpower. When separated from the main group, she didn't panic. She snooped.\\n\\n**The Ultimate Heist**\\nUsing a set of keys she casually acquired, Remi bypassed guards and entered Kryn Corvinarus's master bedroom. She checked the medicine cabinet and stole 'Hemoglue of the Nightlord' (a crimson paste that clots bleeding) and 'Leadfang Extractor' (a poultice for bullet wounds). She also rolled back a rug to discover an incomplete, ancient teleportation circle etched in chalk. \\n\\nLater, in a guest room, she found Ryan's diary. The entries confirmed Ryan had survived the Vigilance jump, ended up in the Shadowfell, and observed Archie and Bowser before disappearing again. Remi gathers intelligence the way Wario gathers coins: quietly, thoroughly, and without asking permission. Waluigi approves.\\n\\n**The Oracle's Deck**\\nRemi's most significant acquisition came from an encounter with Mystic Morel, a purple Toad fortune teller who speaks in rhyming prophecies. Morel gave Remi 'The Oracle's Deck', a set of magical tarot cards. \\n\\nRemi drew three cards: \\n- *The Maze Walker (IX)*, depicting Hjumpik navigating the Maze of Time.\\n- *The Titan of the Grove (VIII)*, depicting Markop wrestling the Arachnid Matriarch.\\n- *The Delicate Host (III)*, depicting Lady Aurelian Corvinarus lounging in the Feywild.\\n\\nThe cards represent the Past, Present, and Future. They prove that the Oracle (or whatever force controls the deck) has been watching all of them, across all dimensions. Remi is now the custodian of this deck, making her one of the most important pieces on the board. She survived the spider swarms, she survived the vampire guards, and now she holds the script to the universe. Do not underestimate Remi.","keyEvents":["skirmish_mazebound","spider_grove_battle"],"relatedArticles":["disaster_inc","ryan","the_oracle"]},{"id":"bowser","name":"Bowser","title":"The Fire-Breathing Constant","race":"Koopa (giant, fire-breathing, occasionally apocalyptic)","status":"Active — trapped in the Shadowfell, breathing fire at vampires","affiliation":"Disaster Inc. (ally of convenience) / Koopa Kingdom","summary":"Bowser is a giant fire-breathing turtle dragon who has been allied with Disaster Inc. through the current crisis, though 'allied' may be too strong a word—Bowser does what Bowser wants, and what Bowser wants often happens to align with the party's needs. He is currently trapped in the Shadowfell alongside Archie, where his biological fire—which the plane cannot suppress the way it suppresses magical fire—is proving surprisingly effective against vampire lords.","description":"Waluigi has a complicated relationship with Bowser. On one hand, Bowser has kidnapped Princess Peach numerous times, threatens the Mushroom Kingdom regularly, and represents a constant source of regional instability. On the other hand, Bowser has been on Waluigi's TEAM for various sports events and party games, and during those events, Bowser has proven to be a reliable (if terrifying) ally.\\n\\nBowser does not operate on the same scale as other people. When most people have a problem, they try to solve it with reasonable force. When Bowser has a problem, he tries to solve it by BEING ENORMOUS and BREATHING FIRE. This approach is not subtle, but it is effective against problems that respond to enormity and fire, which turns out to include vampire lords.\\n\\n## Biological Fire vs. Planar Suppression\\n\\nThe Shadowfell suppresses fire magic through planar physics. Archie Miser, whose entire magical approach depends on fire, finds himself neutered in the Shadowfell—his spells fizzle, his flames sputter, his primary capability simply doesn't work.\\n\\nBowser's fire is not magical. Bowser's fire is BIOLOGICAL. It comes from organs, from physiology, from whatever internal anatomy allows a giant turtle dragon to project flames hot enough to melt stone. The Shadowfell's planar suppression affects magic, not biology.\\n\\nThis means Bowser can still breathe fire in the Shadowfell. This means Archie is stuck with a neutered spellbook while Bowser is operating at full capacity. The irony of this situation is not lost on Waluigi.\\n\\nDuring the Shadow Estate dinner party's chaotic conclusion, Bowser demonstrated this capability by staying behind after Archie and Green T escaped through a window. While they fled into the rose garden, Bowser engaged multiple vampire lords with sustained fire breath. He was buying time for the others to escape, and he was probably ENJOYING it, because Bowser's idea of fun involves fire and things that are on fire.\\n\\n## Combat Philosophy\\n\\nBowser's approach to combat can be summarized simply: be the biggest, most dangerous thing in the room, and make sure everyone knows it. This is not a sophisticated philosophy, but it has kept Bowser alive through decades of conflict with Mario, the Mushroom Kingdom, and various other powers.\\n\\nWaluigi respects Bowser's directness. In a world full of factions that dress up their motivations in noble language, Bowser just says 'I want that castle' or 'I'm going to crush you' and then attempts to do exactly what he said. There's an honesty to it. Bowser is never going to cut off your finger to maintain a cover identity. Bowser is never going to bureaucratically process your execution. If Bowser wants to hurt you, he'll just try to hurt you, directly, with claws and fire and his own considerable bulk.\\n\\n## Current Status\\n\\nBowser is trapped in the Shadowfell alongside Archie, which creates an interesting dynamic. Archie has theoretical knowledge and magical capabilities that are currently suppressed. Bowser has biological fire-breathing and physical power that work fine. The two of them need to cooperate to survive, which probably involves a lot of Archie pointing at things and Bowser setting those things on fire.\\n\\nWaluigi suspects Bowser is handling the Shadowfell better than most of the party would. Vampires? Bowser has fought scarier things. Dark dimension? Bowser's castle isn't exactly sunny. Hostile aristocrats trying to kill him? Bowser IS a hostile aristocrat trying to kill people; he understands the dynamic.\\n\\nWaluigi hopes Bowser survives. Waluigi also hopes Bowser doesn't accidentally burn down the entire Shadowfell, because Waluigi is not entirely sure what happens to a dimension when you set ALL of it on fire, and Waluigi would prefer not to find out.\\n\\nWAH.","keyEvents":["planar_fracture","dinner_climax_vote"],"relatedArticles":["archie_miser","onyx_hand","disaster_inc"]},{"id":"toad_lee","name":"Toad Lee","title":"The Defenestrated Diplomat","race":"Toad","status":"Active — Exploring the Overgrown Manor","affiliation":"Liberated Toads / Disaster Inc.","summary":"Toad Lee continues to be the only reason Disaster Inc. hasn't been completely consumed by the Feywild. He reads the lore, manages the incredibly drunk Rakasha, and initiates combat when necessary. He recently survived being thrown out of a high-story window by a goblin guard, which Waluigi finds highly amusing but respects the commitment to the fight.","description":"Toad Lee is proving to be a surprisingly aggressive diplomat. While he initially served as the quiet, observant foil to Waluigi's loud magnificence, the Feywild is wearing on him.\\n\\n**The Combat Pragmatist**\\nWhen Remi's mechanical dog was stolen by goblin servants looking for scrap metal, Toad Lee didn't bother with fey riddles. He barged into the servant's quarters (interrupting a goblin on the toilet) and demanded the dog back. In the ensuing sword fight, Toad Lee's shield was stolen by the guard Gregory. Toad Lee attempted a heroic acrobatic maneuver, failed spectacularly, and fell out the window. He was only saved because Azure manifested a spectral hand to catch him.\\n\\n**The Lore Keeper**\\nWhile Hjumpik is busy throwing axes at bombs, Toad Lee is actually paying attention to the environment. He uncovered Lady Aurelian's diary, reading critical lore about 'The Grafting' and the arrival of the Iron Legion. Toad Lee is the brain of the Feywild operation, even if his acrobatic skills need serious work. Waluigi will offer him tennis lessons if they survive this.","keyEvents":["rescue_of_steely"],"relatedArticles":["overgrown_manor","waluigi","lady_aurelian"]},{"id":"ryan","name":"Ryan","title":"The Man Who Jumped","race":"Human","status":"Active — location uncertain, last known contact with Rakasha spirit-walkers","affiliation":"Liberated Toads / Disaster Inc. (separated)","summary":"Ryan is the person who jumped off the Vigilance during the Iron Sky Breach rather than be captured by the Iron Legion. He jumped. Off an airship. In the sky. He survived—somehow—and was taken in by a Rakasha spirit-walker. Waluigi does not know Ryan's current status or location, but anyone who survives a jump like that has earned Waluigi's respect forever.","description":"Waluigi was not aboard the Vigilance when the Iron Legion boarded and captured it. He learned about Ryan's escape secondhand, and the account makes his stomach clench every time he thinks about it.\\n\\nRyan was cornered on the observation deck. Iron Legion troops closing from two directions. No exit except the door they were coming through and the railing behind him. Most people, in that situation, would surrender. Most people would calculate the odds—capture versus certain death—and choose capture.\\n\\nRyan jumped.\\n\\n## The Jump\\n\\nWaluigi needs to emphasize how INSANE this decision was. The Vigilance was flying. The drop to the ground was... Waluigi doesn't actually know how far, but it was FAR ENOUGH that surviving should have been impossible. Physics says you die. Biology says you die. Basic common sense says you die.\\n\\nRyan jumped anyway.\\n\\nSomething about the angle of descent, the air currents, hitting tree canopy in a way that distributed the impact across multiple surfaces—Ryan survived. Injured but alive. Waluigi does not fully understand the mechanics. Waluigi suspects Ryan doesn't either. What matters is that Ryan chose certain death over uncertain captivity and somehow found a third option that nobody knew existed.\\n\\nWaluigi has been in desperate situations before. He has faced enemies, monsters, fairy courts, and mirror dimensions. He does not know if he would have the courage to jump off an airship with no guarantee of survival. He does not know if that's courage or desperation or something else entirely. What he knows is that Ryan did it, and Ryan lived, and that makes Ryan one of the bravest people Waluigi has ever encountered.\\n\\n## The Rakasha Spirit-Walker\\n\\nAfter the jump, Ryan was found by a Rakasha spirit-walker—a being associated with spiritual traditions and dimensional sensitivities that Waluigi does not have extensive knowledge of. The spirit-walker took Ryan in, treated his injuries, and... then what? Waluigi does not know. Ryan's thread diverged from the main narrative of the crisis at that point.\\n\\nThe Rakasha connection is intriguing. Spirit-walkers presumably have knowledge of dimensional boundaries, planar transitions, and the kind of metaphysical mechanics that might be relevant to repairing the Planar Fracture. Whether Ryan's encounter with the spirit-walker was coincidence or something more deliberate, Waluigi cannot say.\\n\\n## Assessment\\n\\nRyan is out there somewhere. Separated from the rest of Disaster Inc., possibly learning things from Rakasha spirit-walkers, possibly preparing to rejoin the fight. Waluigi hopes he's healing. Waluigi hopes he's gathering strength. And Waluigi hopes that when the party reunites—and they WILL reunite, Waluigi refuses to accept otherwise—Ryan comes back with whatever wisdom or power the spirit-walkers have to offer.\\n\\nAnyone who jumps off an airship and survives deserves to come back as something MORE than they were before. That's just narrative justice. WAH.","keyEvents":["iron_sky_breach"],"relatedArticles":["iron_legion","vigilance","disaster_inc"]},{"id":"bones","name":"Bones","title":"The Infiltrator Who Triggered the Massacre","race":"Unknown (skilled at disguise, so identification is uncertain)","status":"Injured — captured, stabbed by General Ironhand, fate uncertain","affiliation":"Liberated Toads","summary":"Bones was one of the most capable operatives among the Liberated Toads—skilled in disguise, infiltration, and the kind of sustained deception that allowed him to pass as an Iron Legion soldier for days. His infiltration of Aegis Command was brilliant. His capture triggered Order 120. Bones carries the knowledge that his actions—however well-intentioned—led to the massacre of every Toad prisoner in Legion custody. Waluigi does not know how anyone carries that weight.","description":"Waluigi has to write about Bones carefully because the story of Bones is also the story of Order 120, and Waluigi has already written about Order 120 more than he wanted to.\\n\\nBones was skilled. REMARKABLY skilled. After the Vigilance fell to the Iron Legion, most people scattered or were captured. Bones grabbed equipment from a fallen Legionnaire, adopted their bearing, and BECAME a Legionnaire. He walked through checkpoints on forged credentials and sheer nerve. He attended briefings. He ate in Legion mess halls. He saluted officers who would have killed him if they knew who he was.\\n\\nThe Iron Legion's greatest weakness is its rigidity—it assumes that anyone following protocols belongs. Bones exploited this assumption with the precision of someone who understood exactly how to be invisible in plain sight. Waluigi could never do what Bones did; Waluigi is too DISTINCTIVE. But Waluigi can recognize skill, and Bones had skill in quantities that most infiltrators can only dream of.\\n\\n## The Infiltration\\n\\nBones penetrated Aegis Command—the Iron Legion's primary fortress, their command center, their administrative heart. He passed through three security layers. He documented prisoner facilities. He witnessed the industrial efficiency with which the Legion processed captured Toads—case numbers, categorization, storage conditions that treated people as inventory.\\n\\nThe intelligence Bones gathered was valuable. It confirmed what many suspected: the Iron Legion was not just fighting a war; it was processing people through a system designed to strip away personhood and replace it with logistics. The lower levels of Aegis Command were organized for efficiency, and the efficiency was pointed at something horrible.\\n\\n## The Capture\\n\\nBones was caught. Whether a biometric check flagged an inconsistency, or an informant sold him out, or simple bad luck intervened—the details are uncertain. What's certain is that his cover failed and he was detained.\\n\\nGeneral Ironhand handled the interrogation personally. Ironhand stabbed Bones during the questioning—not fatally, but precisely, making a professional point about consequences. The blade went where it would cause maximum pain without death, because Ironhand wanted Bones alive enough to understand exactly how badly he had failed.\\n\\nThe interrogation also revealed the Green Decoy—a duplicate posing as Speaker L. This discovery suggested that the intelligence war was deeper and messier than anyone had realized. Both sides had been deceiving each other at levels that neither fully understood.\\n\\n## Order 120\\n\\nGeneral Ironhand's response to Bones' infiltration was Order 120: immediate execution of all Toad prisoners in Iron Legion custody.\\n\\nWaluigi has written about this order extensively elsewhere. The summary: every prisoner, everywhere, killed because one infiltrator got caught. Administrative retaliation disguised as security response.\\n\\nBones was alive when the order was issued. Bones presumably heard the order, or heard about the order, or was told about the order as part of Ironhand's psychological pressure. Bones knows that his capture—however unavoidable it might have been—triggered the massacre.\\n\\nWaluigi does not know how Bones carries this. The knowledge that your actions, even heroic actions, even necessary actions, led to the deaths of everyone you were trying to save... that is a weight that Waluigi cannot imagine bearing. Bones was doing the RIGHT thing. He was gathering intelligence that could have helped the Liberated Toads survive. He was taking impossible risks for his people. And the result was the worst outcome imaginable.\\n\\nWaluigi hopes Bones survives whatever the Iron Legion does to him next. Waluigi hopes Bones eventually escapes. And Waluigi hopes that if Bones ever reads this, he understands that the fault lies with Ironhand, not with him. Ironhand CHOSE to issue Order 120. Ironhand could have chosen differently. The massacre was Ironhand's decision, not Bones'.\\n\\nBut Waluigi suspects Bones already knows this, and it doesn't help. Logic doesn't defeat guilt. Facts don't silence the voice that says 'if only I had done something different.' Bones will carry this forever, and all Waluigi can do is acknowledge that the burden is not his to carry alone.\\n\\nWAH.","keyEvents":["iron_sky_breach","massacre_aegis"],"relatedArticles":["liberated_toads","iron_legion","general_ironhand"]},{"id":"earl_grey","name":"Earl Grey","title":"The Man Who Exploded","race":"Unknown (deceased, physiology apparently volatile)","status":"Deceased — literally exploded during the Syndicate Showdown","affiliation":"Tea Leaf Syndicate (deceased)","summary":"Earl Grey was the primary enforcer for the Tea Leaf Syndicate—a skilled fighter whose loyalty to Green T was matched only by his combat effectiveness. His death during the Syndicate Showdown was the single most dramatic exit Waluigi has ever witnessed: Roger's poisoned dagger interacted with something in Earl Grey's biology, and the man DETONATED. Waluigi's favorite hat was in the blast radius. Waluigi is still upset about the hat.","description":"Earl Grey was the Tea Leaf Syndicate's muscle—the person who handled problems that couldn't be solved with tea and conversation. While Green T maintained the Syndicate's refined image, Earl Grey enforced its will with the kind of physical capability that made people reconsider disagreeing with the organization.\\n\\nWaluigi did not know Earl Grey well. Their interactions were limited to the tense period between the Tea Party Incident and the Syndicate Showdown, when the Syndicate was hemorrhaging power and Earl Grey was fighting desperately to preserve what remained. Waluigi respected his determination even while recognizing that the Syndicate was already doomed.\\n\\n## Combat Capabilities\\n\\nEarl Grey was, by all accounts, one of the best pure fighters aboard the Vigilance. He moved with efficiency that suggested extensive training, engaged multiple opponents simultaneously without apparent strain, and possessed physical capabilities that exceeded what his frame would suggest. During the Syndicate Showdown, he held his own against several attackers at once, buying time for Green T to do... whatever Green T was planning.\\n\\nThe fight might have gone differently if the poison hadn't intervened.\\n\\n## The Explosion\\n\\nRoger's poisoned dagger struck Earl Grey during the melee. Under normal circumstances, the poison would have caused paralysis, unconsciousness, or death through conventional means. Earl Grey's physiology was not conventional.\\n\\nThe poison interacted with SOMETHING in Earl Grey's body chemistry. An alchemical compound in his blood? A latent magical instability? A mutation from years of sampling the Syndicate's more experimental tea blends? Nobody has ever adequately explained what happened or why. What Waluigi knows is the RESULT.\\n\\nEarl Grey exploded.\\n\\nNot figuratively. Not 'he was hit so hard he flew apart.' His body DETONATED. Outward. In all directions. The sound was somewhere between a thunderclap and a wet pop—a sound that Waluigi heard clearly and wishes he hadn't. People ten feet away were knocked off their feet. Items scattered across the marketplace. Biological matter went everywhere.\\n\\nWaluigi's favorite hat was in the blast radius. The hat—custom made, carefully maintained, one of Waluigi's most treasured possessions—was SPLATTERED. By EARL GREY. Waluigi knows this is a petty concern compared to the death of a person, but the hat was IMPORTANT to Waluigi and he's allowed to grieve.\\n\\n## Legacy\\n\\nEarl Grey's death ended the Syndicate Showdown effectively. The remaining Syndicate members—those few who hadn't been killed by Archie's fireball days earlier—either surrendered or fled. Green T survived, but his organization died with Earl Grey's detonation.\\n\\nThe marketplace where Earl Grey exploded reportedly smelled strange for days afterward. Nobody could agree on what exactly the smell was—ozone, chemicals, something organic, something else. The uncertainty made it worse. Waluigi avoided that part of the Vigilance until the smell faded, and even then, he found himself checking the floor for... residue.\\n\\nWaluigi does not know what to say about Earl Grey as a person. He was loyal to his organization, fought hard for it, and died in a way that nobody expected. His death was the exclamation point on the Tea Leaf Syndicate's collapse—a dramatic, horrible, unexplainable end that matched the dramatic, horrible, unexplainable events of the entire campaign.\\n\\nRest in pieces, Earl Grey. Waluigi means that LITERALLY. WAH.","keyEvents":["syndicate_showdown"],"relatedArticles":["tea_leaf_syndicate","green_t","vigilance"]},{"id":"dan_the_toad","name":"Dan (The Parallel Paradox)","title":"The Multi-Dimensional Headache","race":"Toad","status":"Active — Split between 'Original', 'Parallel', and 'Purple T'","affiliation":"Liberated Toads / Mages' Guild (Coerced)","summary":"There are too many Dans. The cautious survivor Waluigi knew has been replaced by a dimensional duplicate. The 'Parallel Dan' traveling with Markop admitted he shoved the original Dan into a Mages' Guild null cage to silence him. Meanwhile, another Toad operative ('Purple T') is hunting Archie. Waluigi is deeply frustrated by this. One bureaucrat is annoying; a multiverse of bureaucrats is a nightmare.","description":"Waluigi must attempt to explain a situation that gives him a migraine. \\n\\nDuring a rest in the Shadowfell forest, Markop cast a Zone of Truth and confronted Dan. Dan confessed that he was NOT the original Dan. He is a 'Parallel Dan' from the mirror dimension. He swapped places with the original Dan during a restaurant raid weeks ago.\\n\\n**The Fate of the Original**\\nParallel Dan admitted he didn't kill the original Dan. Instead, he handed the original over to the Mages' Guild, who locked him in a 'null cage'—a magical containment unit that nullifies all arcane abilities. The original Dan is currently trapped in a Mages' Guild barrack, wearing an associate badge (Number 447) that tracks his movements and burns him if he tries to remove it. He is a prisoner disguised as an initiate, hiding coded notes in his mattress.\\n\\n**The Motive**\\nParallel Dan claims he disrupted the Oracle's ritual because if the ritual had succeeded, the parallel reality would have collapsed, killing him. He replaced the original to ensure his own survival. It is a selfish, cowardly act that perfectly aligns with Dan's core philosophy of survival at any cost. Even across dimensions, Dan is consistent.\\n\\n**Purple T and the Rogue Mages**\\nTo make matters infinitely worse, another operative known as 'Purple T' (who may or may not be another variant of Dan, or just a very sneaky Toad) has gone rogue. Purple T, along with a zealot named Bryan (servant of the 'Toad God'), ripped off their Mages' Guild tracking badges. They are currently hunting Archie Miser, using Archie's 'Wahbook' tablet posts to track his location across dimensions. \\n\\nWaluigi's assessment is simple: Trust no Toad named Dan. If you see a Dan, assume he is a spy, a clone, or about to lock you in a cage. WAH.","keyEvents":["skirmish_mazebound","planar_fracture"],"relatedArticles":["liberated_toads","mages_guild","archie_miser"]},{"id":"eager","name":"Eager","title":"The Magnet for Catastrophe","race":"Unknown","status":"Active — recovered from spider grove capture","affiliation":"Disaster Inc. (situational)","summary":"Eager is the person whose rescue from the spider grove triggered the Battle of the Spider Grove. He has a supernatural gift for finding the worst possible place to be and BEING there. If there's a giant spider nest within ten miles, Eager will be inside it. If there's a bottomless pit, Eager will be sitting on its edge. Waluigi has mixed feelings about Eager—gratitude that rescuing him led to an excellent battle, frustration that the rescue was necessary in the first place.","description":"Waluigi does not know how Eager ended up cocooned in the Silent Grove. Waluigi suspects even EAGER doesn't fully know how Eager ended up cocooned in the Silent Grove. What Waluigi knows is that when the party needed to mount a rescue operation, Eager was suspended fifteen feet off the ground between two dead oaks, wrapped in spider silk like the world's worst piñata.\\n\\nThis is TYPICAL for Eager.\\n\\n## The Catastrophe Magnet Effect\\n\\nEager seems to attract dangerous situations the way Wario attracts coins. It's not that Eager SEEKS danger—he doesn't seem to have a death wish or a thrill-seeking personality. Danger just FINDS him. He walks into rooms and discovers they're on fire. He takes shortcuts that lead through forbidden territories. He sits down to rest and ends up in a spider queen's web.\\n\\nWaluigi has met unlucky people before. Waluigi considers himself somewhat unlucky (though Waluigi believes his 'bad luck' is actually SYSTEMATIC UNFAIRNESS). But Eager's relationship with catastrophe exceeds normal unluckiness. It's almost supernatural. If Eager ever figures out how to CONTROL this effect—direct it at enemies instead of himself—he'd be one of the most dangerous people in the setting.\\n\\n## The Rescue and After\\n\\nThe party rescued Eager from the spider grove through a multi-phase battle that included titan wrestling, arcane rays, exploding spiders, and a banishment circle. Eager, for his part, contributed by deploying pepper spray against clusters of smaller arachnids while stuck in an enlarged form.\\n\\nPepper spray. Against spiders. And it WORKED.\\n\\nWaluigi has to give Eager credit for creative thinking. Most people, stuck in a giant form in the middle of a spider battle, would not think to use pepper spray. Eager apparently carries pepper spray into situations where pepper spray should be useless, and then finds situations where it becomes useful. This is either preparation or luck, and Waluigi cannot tell which.\\n\\n## Assessment\\n\\nEager is an asset and a liability in equal measure. His tendency to end up in dangerous situations creates opportunities for dramatic battles and valuable loot (the Spider Grove yielded excellent items). It also creates rescue obligations that drain resources and attention.\\n\\nWaluigi has decided to view Eager as a quest generator. Wherever Eager is, there's probably a problem. That problem probably has treasure attached. So following Eager is, in a weird way, a viable strategy for acquiring wealth and experience, as long as you're prepared to fight whatever horrible thing has captured Eager THIS time.\\n\\nWAH.","keyEvents":["spider_grove_battle"],"relatedArticles":["disaster_inc","raventree_manor"]},{"id":"smoking_j","name":"Smoking J","title":"The Venomous Casualty","race":"Unknown","status":"Active — recovering from spider venom","affiliation":"Disaster Inc. (situational)","summary":"Smoking J was bitten during the Battle of the Spider Grove and suffered a severe venomous reaction that forced his withdrawal from the front line. His incapacitation at a critical moment reduced the party's fighting strength during the most dangerous phase of the battle. Waluigi hopes Smoking J has fully recovered, though the long-term effects of arachnid venom are unpredictable.","description":"Smoking J was an active combatant during Phase 2 of the Spider Grove battle—the period when the grove's defenses were fracturing and smaller arachnids were converging from all directions. He was fighting alongside the main group when one of the dog-sized spiders landed a bite.\\n\\nThe venom hit FAST. Swelling. Disorientation. The kind of systemic reaction that says 'this biological agent does not belong in your body and your body knows it.' Smoking J had to be pulled back from the front line, reducing the party's combat strength at exactly the wrong moment.\\n\\n## Impact on the Battle\\n\\nSmoking J's incapacitation was one of several factors that made the Spider Grove battle so desperate. With Smoking J down, the remaining fighters had to cover more ground with fewer people. The toad squad got cut off partly because there weren't enough fighters to maintain a continuous line. Remi had to hold her position with only her mechanical dog as backup.\\n\\nWaluigi is not assigning blame—Smoking J didn't CHOOSE to be bitten, and arachnid venom is not something you can shrug off through determination. But the tactical consequences of his withdrawal rippled through the rest of the engagement.\\n\\n## Recovery\\n\\nWaluigi does not know Smoking J's current status. The Planar Fracture scattered the party before Waluigi could confirm whether the venom's effects had fully resolved. Arachnid venoms are unpredictable—some cause immediate effects that fade quickly, others linger in the system for days or weeks, and some leave permanent damage.\\n\\nWaluigi hopes Smoking J is fully recovered. Waluigi also hopes that if there ARE lingering effects, Smoking J has access to proper medical attention, though 'proper medical attention' is hard to find when reality has shattered into three pieces and everyone is trapped in hostile dimensions.\\n\\nWAH.","keyEvents":["spider_grove_battle"],"relatedArticles":["disaster_inc","raventree_manor"]},{"id":"captain_syrup","name":"Captain Syrup","title":"The Pirate Queen of Rogueport","race":"Human","status":"Active — Shelling everything in sight at Rogueport Bay","affiliation":"Black Sugar Pirates","summary":"Captain Syrup is the undisputed Pirate Queen of the seas, leader of the Black Sugar Pirates, and one of the few people whose greed might actually rival Wario's. She is currently engaged in a massive naval war in Rogueport Bay against the Iron Legion and the Mushroom Regency. Waluigi has a professional rivalry with Syrup. She thinks she's the best thief in the world. Waluigi *knows* he is.","description":"Waluigi respects Captain Syrup, though he would never admit it to her face. She runs a pirate empire with the kind of ruthless efficiency that Wario wishes he had. She doesn't bother with political ideologies or dimensional fractures. She sees a ship full of gold, she shoots cannons at it, she takes the gold. It is a wonderfully simple business model.\\n\\n**The Battle of Rogueport**\\nSyrup and her fleet are currently the wildcard in the Coastal Provinces. The Iron Legion wants to blockade and tax the oceans. The Mushroom Regency wants to maintain order. Syrup just wants to sink both of them and loot the wreckage. \\n\\nWhen the Rakasha priest accidentally teleported the Toad scouts (Mystivl and Big R) directly onto a ship in Rogueport Bay, they arrived exactly as Captain Syrup yelled, 'Fire the cannons!' This is the quintessential Captain Syrup experience: arriving anywhere near her usually means you are about to explode.\\n\\n**Assessment**\\nIf the civil war continues to escalate, Syrup's naval superiority will become a massive factor. Whoever controls the sea controls the trade routes, and right now, Syrup is making sure nobody controls anything without paying her a toll in blood and cannonballs. Waluigi hopes to avoid Rogueport Bay until the smoke clears, but he fully intends to steal her ship someday just to see the look on her face. WAH.","keyEvents":[],"relatedArticles":["rogueport_bay","wario","mushroom_kingdom"]},{"id":"orvinder_danos","name":"Orvinder Danos","title":"The Barrister of Truth","race":"Human","status":"Active — In the Shadowfell, tracking planar anomalies","affiliation":"Independent / Justice","summary":"Orvinder Danos is a lawyer in the Shadowfell. Yes, really. He is a barrister who values truth, justice, and the law, which makes him the single most out-of-place entity in a dimension ruled by manipulative, blood-sucking vampires. He assisted Archie in finding a dimensional portal. Waluigi profoundly distrusts lawyers, especially ones who claim to be honest and don't charge exorbitant fees.","description":"Orvinder Danos looks exactly like a well-to-do merchant or noble: neat dark hair, a mustache, keen eyes, and well-tailored clothing that lacks flashy ornamentation. He walks with a cane he does not actually need, which Waluigi recognizes as a classic theatrical prop to make opponents underestimate you.\\n\\n**The Honest Lawyer**\\nOrvinder's defining trait is that he does not lie. Ever. He believes that laws must be upheld universally and unjust laws must be changed. He defends common folk against nobles. In the Shadowfell, where deceit is the primary currency, a man who strictly tells the truth is either completely insane or so powerful that he doesn't need to lie. Waluigi leans toward the latter.\\n\\n**Planar Capabilities**\\nOrvinder encountered Archie while Archie was disguised as a guard. Orvinder saw right through it. More importantly, Orvinder demonstrated a staggering magical capability: he can open planar portals at certain 'reflection points.' He opened a portal to the ruined physical manor for Archie, explaining that it takes immense concentration but allows transit across the boundaries the Oracle broke.\\n\\nOrvinder also seems to be acting as a guide or protector for Usk, attempting to reunite Usk's fragmented essence across the three manors. Why a barrister is involving himself in dimensional rescue operations is unclear. Perhaps he considers the Planar Fracture a violation of cosmic law. \\n\\nWaluigi would rather fight three dragons than be cross-examined by Orvinder Danos in a courtroom. WAH.","keyEvents":["shattering_shadow_anchor"],"relatedArticles":["archie_miser","usk","shadow_estate"]},{"id":"vivian","name":"Vivian","title":"The Heir in the Shadows","race":"Unknown (Disguised)","status":"Active — Patiently waiting for his rivals to die","affiliation":"House Corvinarus (Claimant)","summary":"Vivian is playing the longest, most dangerous game in the Shadowfell. After dropping his disguise as the female thrall 'Vivesna' and claiming the title of Heir during a gunfight, he has retreated to the shadows. When confronted by Remi, Vivian calmly admitted he is just waiting for Orangus Cornelius and Kryn to die so he can take over. Waluigi respects the hustle, but waiting for immortals to die of natural causes seems inefficient.","description":"Vivian's dramatic reveal during the Shadow Estate dinner party was a masterclass in timing. But what he did *after* the reveal is even more telling: absolutely nothing.\\n\\nWhile the estate devolved into chaos, the Anchor shattered, and the Mazebound attacked intruders in the gardens, Vivian simply walked the halls. Remi encountered him and noticed he was still wearing his fake hair. When she called him out on it, Vivian didn't attack. He smiled. He told her he was simply waiting for both Kryn and Cornelius to be dead so he could ascend as the new heir. He told Remi to leave and 'let nature take its course.'\\n\\n**The Strategy of Inaction**\\nVampire politics is usually loud and violent. Vivian’s approach is terrifyingly passive. He knows Cornelius was shot with silver. He knows the Mages' Guild is infiltrating the estate. He knows Disaster Inc. is tearing the place apart. Vivian doesn't need to assassinate his rivals; he just needs to stay out of the way while everyone else does the work for him.\\n\\nHe has secured keys to the Lord's chambers and is casually navigating the collapsing power structure. He even appeared before the toads to offer them a deal: he would send them home if they swore not to interfere with his coronation.\\n\\nWaluigi has seen many villains monologue about their grand plans to conquer the world. Vivian is the first person Waluigi has seen whose grand plan is to stand in a hallway and wait for his enemies to trip and break their own necks. It is chillingly practical.","keyEvents":["dinner_climax_vote"],"relatedArticles":["house_corvinarus","onyx_hand","remi"]},{"id":"orangus_cornelius","name":"Orangus Cornelius","title":"The Defenestrated Lord","race":"Vampire (Giant Bat Form)","status":"Active (Barely) — Shot with silver, tackled out a window, and deeply humiliated","affiliation":"Onyx Hand / House Corvinarus (Shadowfell branch)","summary":"Orangus Cornelius was the senior vampire lord of the Shadow Estate and a figure of absolute authority. Then Green T shot him with a silver bullet from the children's table. Unfortunately, Cornelius survived. Instead of dying gracefully, he turned into a giant bat, got tackled through a window by Bowser, and watched his precious dimensional Anchor get shattered. Waluigi considers surviving this sequence of events physically impressive but socially fatal.","description":"Orangus Cornelius represented everything Waluigi finds irritating about aristocracy: the assumption of superiority, the elaborate social rituals designed to remind everyone of their place, the casual cruelty dressed up as tradition. He hosted dinner parties where guests were forced to vote on who would die. He seated guests at a CHILDREN'S TABLE as a deliberate insult. He maintained a court of thralls and servants and vampiric subordinates who existed to affirm his magnificence.\\n\\nAnd then the children's table shot him.\\n\\nWaluigi cannot stress enough how PERFECT this initial moment was. Orangus spent centuries cultivating an image of untouchable power. He probably thought he was the most dangerous thing in any room he entered. But as Waluigi recently learned from the survival accounts of Disaster Inc., a silver bullet to the chest was only the BEGINNING of Cornelius's terrible, horrible, no-good, very bad evening.\\n\\n## The Dinner Party and the Shot\\n\\nOrangus's dinner parties were exercises in vampire social dominance. The formal settings, the elaborate courses, the vote tradition—all of it designed to remind guests that they existed at Orangus's pleasure. He could kill anyone at any time. Archie had to cut off Usk's finger to prove loyalty in this environment. The entire evening was designed to break down the guests' sense of moral autonomy and replace it with submission to Orangus's will.\\n\\nGreen T disrupted this dynamic with a firearm and silver ammunition. Silver is anathema to vampires. It doesn't heal properly. It burns. It ruins the aesthetic. Orangus took a silver bullet from someone he had dismissed as a minor nuisance, proving once again that arrogance is a terminal disease.\\n\\n## The Defenestration of Cornelius\\n\\nBecause vampires are dramatic, Cornelius did not simply fall over and die from the silver bullet. Instead, he dropped the aristocratic pretense and transformed into a giant bat monster. Waluigi finds this incredibly cliché, but it did escalate the situation rapidly.\\n\\nThis transformation prompted Bowser to do what Bowser does best: apply overwhelming physical force. Bowser tackled the giant bat-vampire lord straight through the dining room window and into the courtyard. Getting thrown out of a window in your own house is objectively the most embarrassing thing that can happen to a host. In the ensuing wrestling match, Bowser actually bit Cornelius's wing. A gian
