function relationGraph(item,opts){
  opts=opts||{};
  const centerType=(INDEX[item.id]&&INDEX[item.id].typeKey)||'';
  const characterWebOnly=centerType==='characters';
  const conns=new Map(); // id -> {id,label,exists,rel,style}  (rel: 'ally'|'enemy'|'link')
  const ALLY='#2fae8a', ENEMY='#e5484d';
  const consider=(id,rel)=>{
    if(!id||id===item.id||conns.has(id)) return;
    const rec=INDEX[id];
    if(!rec) return;               // skip dangling references to non-existent entities
    // Character pages should not show events/battles/trials/locations in the character web.
    // Those belong in Related Articles / Timeline, not in the social association graph.
    if(characterWebOnly && !['characters','factions'].includes(rec.typeKey)) return;
    const st=nodeKindStyle(id);
    conns.set(id,{ id, label:displayName(rec.item), exists:true,
      rel, color: rel==='ally'?ALLY : rel==='enemy'?ENEMY : st.c, emoji: st.e,
      typeLabel: TYPE_BY_KEY[rec.typeKey].singular });
  };
  // 1) explicit ally/enemy (override, colored)
  (item.allies||[]).forEach(r=>consider(typeof r==='string'?r:r&&r.id,'ally'));
  (item.enemies||[]).forEach(r=>consider(typeof r==='string'?r:r&&r.id,'enemy'));
  // 2) forward references (classified by target's real type)
  [].concat(item.keyEvents||[],item.keyBattles||[],item.relatedArticles||[],item.articles||[])
    .forEach(r=>consider(typeof r==='string'?r:r&&r.id,'link'));
  // 3) reverse references — who points back at this entity
  (BACKLINKS[item.id]?[...BACKLINKS[item.id]]:[]).forEach(id=>consider(id,'link'));
  // 4) co-participants: others who share a battle/event this entity is in
  const myEvents=[].concat(item.keyEvents||[],item.keyBattles||[]);
  myEvents.forEach(evId=>{ const rec=INDEX[evId]; if(!rec)return; const ev=rec.item;
    [].concat(ev.participatingCharacters||[], (ev.participants||[]).map(p=>typeof p==='string'?p:p&&p.id))
      .forEach(id=>consider(id,'link'));
  });
  if(conns.size<2) return '';
  // order: allies, enemies, then others; cap for legibility
  const arr=[...conns.values()].sort((a,b)=>{const o={ally:0,enemy:1,link:2};return (o[a.rel]-o[b.rel])||a.label.localeCompare(b.label);}).slice(0,14);
  const W=560, H=Math.max(300, 160+arr.length*6), cx=W/2, cy=H/2, R=Math.min(cx,cy)-78;
  let edges='',nodes='';
  arr.forEach((c,i)=>{
    const ang=(i/arr.length)*Math.PI*2 - Math.PI/2;
    const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
    const dash=c.rel==='link'?'':''; // solid for ally/enemy, solid for links too
    edges+=`<line class="rl-line" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${c.color}"/>`;
    const short=c.label.length>20?c.label.slice(0,19)+'…':c.label;
    const right=Math.cos(ang)>=0; const tx=x+(right?11:-11); const anchor=right?'start':'end';
    nodes+=`<g class="rl-node" ${c.exists?`onclick="openId('${esc(c.id)}')"`:''} opacity="${c.exists?1:.45}"><title>${esc(c.emoji+' '+c.label+' — '+c.typeLabel+(c.rel!=='link'?(' ('+c.rel+')'):''))}</title>
      <circle cx="${x}" cy="${y}" r="7" fill="${c.color}" stroke="var(--panel2)" stroke-width="2"/>
      <text x="${tx}" y="${y+4}" text-anchor="${anchor}" font-size="11">${c.emoji} ${esc(short)}</text></g>`;
  });
  const centerName=displayName(item); const cShort=centerName.length>22?centerName.slice(0,21)+'…':centerName;
  const center=`<g><circle cx="${cx}" cy="${cy}" r="14" fill="var(--accent)" stroke="var(--panel2)" stroke-width="3"/><text x="${cx}" y="${cy+32}" text-anchor="middle" font-size="12" font-weight="700">${esc(cShort)}</text></g>`;
  // legend shows the types actually present + ally/enemy if used
  const present=new Set(arr.map(c=>c.rel==='link'?c.typeLabel:c.rel));
  const typeColors={};
  arr.forEach(c=>{ if(c.rel==='link') typeColors[c.typeLabel]=c.color; });
  let legendItems='';
  if(arr.some(c=>c.rel==='ally')) legendItems+=`<span><i style="background:${ALLY}"></i>Ally</span>`;
  if(arr.some(c=>c.rel==='enemy')) legendItems+=`<span><i style="background:${ENEMY}"></i>Enemy</span>`;
  Object.keys(typeColors).sort().forEach(t=>legendItems+=`<span><i style="background:${typeColors[t]}"></i>${esc(t)}</span>`);
  const webNote=characterWebOnly
    ? `${centerName}'s character/faction association web. Events, battles, trials, and locations stay in Related Articles so the social map does not become a timeline salad.`
    : `${centerName}'s tangled connections, mapped by Waluigi so the reader can see who owes what to whom. Nodes are colored by what they are; hover for detail, click to travel.`;
  return `<div class="wsys"><div class="wsys-title">🕸️ Waluigi's Web of Association</div>
    <div class="wsys-note">${esc(webNote)}</div>
    <svg class="relsvg" viewBox="0 0 ${W} ${H}" role="img">${edges}${center}${nodes}</svg>
    <div class="rel-legend">${legendItems}</div></div>`;
}

/* ===== INLINE ANNOTATIONS: characters comment on specific passages ===== */
let ANNOT_BY_ARTICLE={};   // articleId -> [annotation,...]
let ANNOT_ACTIVE=[];       // annotations for the article currently rendered (indexed for the drawer)
function buildAnnotations(){
  ANNOT_BY_ARTICLE={};
  (DATA.annotations||[]).forEach(a=>{ if(!a.articleId||!a.quote)return; (ANNOT_BY_ARTICLE[a.articleId]=ANNOT_BY_ARTICLE[a.articleId]||[]).push(a); });
}
function annotationStats(articleId){
  const anns=(ANNOT_BY_ARTICLE&&ANNOT_BY_ARTICLE[articleId])||[];
  const comments=anns.reduce((n,a)=>n+((a.comments||[]).length),0);
  return {notes:anns.length,comments};
}
function annotationBadge(articleId, mode){
  const s=annotationStats(articleId);
  if(!s.notes) return '';
  const cls=mode==='mini'?'annmark mini':'annmark';
  return `<span class="${cls}" title="${s.notes} annotated passage${s.notes===1?'':'s'} · ${s.comments} comment${s.comments===1?'':'s'}"><span class="bubble">💬</span>${s.notes}</span>`;
}
function normQuote(s){return String(s||'').replace(/\s+/g,' ').trim();}
/* Wrap any annotated quote found in already-rendered prose HTML with a clickable highlight.
   Works on text between tags so it never breaks existing links/bold. */
function applyAnnotations(html, articleId){
  if(!PREFS.comments){ ANNOT_ACTIVE=[]; return html; }
  const anns=ANNOT_BY_ARTICLE[articleId];
  if(!anns||!anns.length) return html;
  ANNOT_ACTIVE = anns;   // register for the drawer (index = position in this list)
  const decode=s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  anns.forEach((ann,ai)=>{
    const target=normQuote(decode(ann.quote));
    if(!target) return;
    // tokenize html into text/tag pieces; build a plaintext map so we can match a quote
    // even when it spans links/bold/datelinks inserted earlier.
    const parts=html.split(/(<[^>]+>)/);
    // build cumulative plaintext (decoded, whitespace-normalized) with index map back to parts
    let plain=''; const map=[]; // map[k] = {pi, from, len} for text pieces
    for(let i=0;i<parts.length;i++){
      if(parts[i].startsWith('<')) continue;
      const t=decode(parts[i]).replace(/\s+/g,' ');
      if(!t) continue;
      // record where this piece starts in plain
      const start=plain.length;
      plain+=t;
      map.push({pi:i, plainStart:start, plainEnd:plain.length});
    }
    const pos=plain.indexOf(target);
    if(pos<0) return;                 // quote not found
    const endPos=pos+target.length;
    const count=(ann.comments||[]).length;
    const badge=`<sup class="annot-badge">💬${count}</sup>`;
    const openTag=`<span class="annot" data-ai="${ai}" title="${count} comment${count===1?'':'s'} — click to open discussion">`;
    const overlaps=map.filter(s=>s.plainStart<endPos && s.plainEnd>pos);
    if(!overlaps.length) return;
    // helper to cut a raw (possibly entity-containing) text piece at a decoded-plaintext offset
    const cutAt=(raw,decodedOffset)=>{ // returns [before,after] of raw at the point where decoded length == offset
      let dLen=0,i=0; while(i<raw.length && dLen<decodedOffset){ if(raw[i]==='&'){const semi=raw.indexOf(';',i); if(semi>-1&&semi-i<=6){i=semi+1;dLen++;continue;}} i++;dLen++; }
      return [raw.slice(0,i), raw.slice(i)];
    };
    overlaps.forEach((seg,oi)=>{
      const raw=parts[seg.pi];
      const isFirst=oi===0, isLast=oi===overlaps.length-1;
      let pre='',mid=raw,post='';
      // where the highlight starts/ends within THIS piece, in decoded-plaintext offsets
      const midStartInPlain = isFirst ? pos : seg.plainStart;      // plain index where mid begins
      if(isFirst && pos>seg.plainStart){ const [b,a]=cutAt(raw, pos-seg.plainStart); pre=b; mid=a; }
      if(isLast && endPos<seg.plainEnd){ const [b,a]=cutAt(mid, endPos-midStartInPlain); mid=b; post=a; }
      parts[seg.pi]= pre + openTag + mid + (isLast?badge:'') + '</span>' + post;

/* =============== TIMELINE (derived from dates) =============== */
/* ---- date parsing for the timeline ----
   The world's "BF" counts UP toward the present: 722 BF is oldest, 1040 BF is current.
   Month names (incl. data variants/aliases) map to a 1..12 ordinal for correct sorting. */
let MONTH_ORD = {};
function buildMonthOrd(){
  const m={};
  (DATA.calendarMonths||[]).forEach(x=>{ if(x&&x.name){ m[x.name.toLowerCase()]=x.ordinal; if(x.abbreviation) m[x.abbreviation.toLowerCase()]=x.ordinal; } });
  // aliases / spelling variants that appear in the data but aren't in the official calendar
  const alias={ 'harvestside':'harvestide', 'bloomtide':'bloom', 'faystyl':'floria', 'frostmere':'frostfall', 'snowfall':'deepwinter' };
  Object.keys(alias).forEach(a=>{ const t=alias[a]; if(m[t]!=null) m[a]=m[t]; });
  MONTH_ORD=m;
}
function parseYear(s){if(!s)return null;const m=String(s).match(/(\d{3,4})\s*BF/i)||String(s).match(/\b(\d{3,4})\b/);return m?parseInt(m[1],10):null;}
function parseMonth(s){
  if(!s)return 99;
  const t=String(s).toLowerCase();
  // Match whole month words/aliases only. This prevents abbreviations like "Ver" matching "Feyward-relative"/"never",
  // and "Flo" matching "flows sluggishly" before Highsun.
  const keys=Object.keys(MONTH_ORD).sort((a,b)=>b.length-a.length);
  for(const name of keys){
    const pat=new RegExp('(^|[^a-z])'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i');
    if(pat.test(t)) return MONTH_ORD[name];
  }
  if(/\bday\s+\d/i.test(t)) return MONTH_ORD['highsun']!=null?MONTH_ORD['highsun']:7;
  return 99;
}
function parseDay(s){
  if(!s)return 99;
  const raw=String(s).replace(/\b\d{3,4}\s*BF\b/ig,'');
  // "Day 30" campaign counter -> day 30
  const dm=raw.match(/\bday\s+(\d{1,2})/i);
  if(dm) return parseInt(dm[1],10);
  // otherwise first small number that isn't the year, e.g. "Highsun 21", "21 Harvestide"
  const m=raw.match(/\b(\d{1,2})(?:st|nd|rd|th)?\b/);
  return m?parseInt(m[1],10):99;
}
function monthName(ord){ const x=(DATA.calendarMonths||[]).find(m=>m.ordinal===ord); return x?x.name:(ord===99?'Undated (year only)':('Month '+ord)); }

function view_timeline(){
  renderSidebar('timeline');
  const entries=[];
  const push=(src,kind,cls,idprefix,go)=> (DATA[src]||[]).forEach(it=>{
    const dateStr=it.date||it.era||'';
    const y=parseYear(it.date)||parseYear(it.era);
    if(y==null) return;
    entries.push({y, mo:parseMonth(dateStr), d:parseDay(dateStr), kind, cls, id:idprefix+it.id,
      name:it.name||it.title||it.id, meta:dateStr, go});
  });
  push('events','e','','',null);
  push('battles','b','b','',null);
  push('trials','t','t','',null);
  // major battles use a different route
  (DATA.majorBattles||[]).forEach(b=>{const dateStr=b.date||'';const y=parseYear(dateStr);if(y==null)return;
    entries.push({y,mo:parseMonth(dateStr),d:parseDay(dateStr),kind:'b',cls:'b',id:'mb:'+b.id,name:b.name,meta:dateStr,go:()=>Router.go('#/mbattle/'+encodeURIComponent(b.id))});});
  // resolve go() for the standard kinds
  entries.forEach(e=>{ if(!e.go){ const rid=e.id; e.go=()=>openId(rid); } });

  // chronological ascending: earliest year first, then month, then day
  entries.sort((a,b)=> a.y-b.y || a.mo-b.mo || a.d-b.d || a.name.localeCompare(b.name));

  // group: year -> month -> [entries]
  const years=[];
  const yearMap={};
  entries.forEach(e=>{

/* Collect every dated event/battle/trial for a given year, grouped by month. Fully dynamic:
   whatever you add to the data shows up here automatically. */
function collectYear(year){
  const out=[];
  const push=(src,kind)=> (DATA[src]||[]).forEach(it=>{
    const dateStr=it.date||it.era||'';
    const y=parseYear(it.date)||parseYear(it.era);
    if(y!==year) return;
    out.push({y, mo:parseMonth(dateStr), d:parseDay(dateStr), kind, id:it.id,
      name:it.name||it.title||it.id, sub:it.title&&it.title!==it.name?it.title:'',
      date:dateStr, summary:it.summary||'', route:routeForKind(kind==='trial'?'article':kind, it.id)});
  });
  push('events','event'); push('battles','battle'); push('trials','trial');
  (DATA.majorBattles||[]).forEach(b=>{const dateStr=b.date||'';if(parseYear(dateStr)!==year)return;
    out.push({y:year,mo:parseMonth(dateStr),d:parseDay(dateStr),kind:'battle',id:b.id,name:b.name,sub:b.conflict||'',date:dateStr,summary:b.description||'',route:'#/mbattle/'+encodeURIComponent(b.id)});});
  out.sort((a,b)=>a.mo-b.mo||a.d-b.d||a.name.localeCompare(b.name));
  return out;
}
function allYears(){
  const ys=new Set();
  const addFrom=(src)=> (DATA[src]||[]).forEach(it=>{const y=parseYear(it.date)||parseYear(it.era);if(y)ys.add(y);});
  addFrom('events');addFrom('battles');addFrom('trials');
  (DATA.majorBattles||[]).forEach(b=>{const y=parseYear(b.date);if(y)ys.add(y);});
  return [...ys].sort((a,b)=>a-b);
}
const kindEmojiSimple=k=>k==='event'?'📜':k==='trial'?'⚖️':k==='battle'?'🗡️':'📄';
/* Dynamic Waluigi-voice intro generated from the year's actual contents. */
function yearIntro(year,entries){
  if(!entries.length) return `Waluigi has no dated records for ${year} BF. Either nothing happened, or nothing that happened survived Waluigi's filing standards. Both are possible. WAH.`;
  const n=entries.length;
  const battles=entries.filter(e=>e.kind==='battle').length;
  const trials=entries.filter(e=>e.kind==='trial').length;
  const events=entries.filter(e=>e.kind==='event').length;
  const months=[...new Set(entries.map(e=>e.mo).filter(m=>m<99))].length;
  const biggest=entries.slice().sort((a,b)=>(b.summary||'').length-(a.summary||'').length)[0];
  const isCurrent = year===CUR.year;
  let lead;
  if(n>=40) lead=`${year} BF is, by Waluigi's exacting count, the single most catastrophic year in recorded history — ${n} documented happenings and still counting.`;
  else if(n>=10) lead=`${year} BF was a busy and largely unpleasant year, with ${n} events Waluigi considered worth filing.`;
  else if(n>=3) lead=`${year} BF was a quieter year on the record — ${n} documented happenings, though quiet in this world is a relative and usually temporary condition.`;
  else lead=`${year} BF left only ${n===1?'a single entry':'a handful of entries'} in the chronicle, which is either mercy or missing paperwork.`;
  const breakdown=[];
  if(events)breakdown.push(`${events} event${events>1?'s':''}`);
  if(battles)breakdown.push(`${battles} battle${battles>1?'s':''}`);
  if(trials)breakdown.push(`${trials} trial${trials>1?'s':''}`);
  let body=` The year spans ${months||'an unknown number of'} month${months===1?'':'s'} of the calendar and comprises ${breakdown.join(', ')}.`;
  if(biggest) body+=` Its most heavily documented entry is **${biggest.name}**.`;
  if(isCurrent) body+=` This is the current year of the chronicle — the present tense of the catastrophe — so this page updates as the disaster does.`;
  return lead+body+` WAH.`;
}

/* ================= DATA LOADER (fetch ./data/*.json, fall back to embedded) ================= */
/* Files that live in ./data/ as separate JSON. Keys map 1:1 to DATA fields. */
const DATA_FILES = ['characters','events','battles','locations','races','nations','factions','collections',
  'trials','mainPage','congress_votes','conflicts','majorBattles','factionColors','currentDate','calendarMonths','artifacts','congress','annotations'];

async function loadData(){
  const embedded = window.WALUPEDIA_EMBEDDED || {};
  // If we can't fetch (file:// or sandbox), fetch throws and we fall back per-file.
  const out = {};
  let fetchedAny = false, failedAny = false;
  await Promise.all(DATA_FILES.map(async key=>{
    try{
      const res = await fetch('./data/'+key+'.json', {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      out[key] = await res.json();
      fetchedAny = true;
    }catch(e){
      failedAny = true;
      if(key in embedded) out[key] = embedded[key];   // fall back to baked-in copy
    }
  }));
  // Safety net: make sure every key exists, using embedded where fetch didn't provide it.
  for(const key of DATA_FILES){ if(out[key]===undefined && key in embedded) out[key]=embedded[key]; }
  window.__DATA_SOURCE = failedAny ? (fetchedAny ? 'mixed (fetch + embedded fallback)' : 'embedded fallback')
                                   : 'fetched ./data/*.json';
  return out;
}

    pv.innerHTML=`<div class="lp-head"><span class="lp-emoji">${p.emoji}</span><span class="lp-name">${esc(p.name)}</span></div>${p.sub?`<div class="lp-sub">${esc(p.sub).slice(0,60)}</div>`:''}<div class="lp-sum">${esc(p.summary)}${p.summary&&p.summary.length>=220?'…':''}</div><div class="lp-go">Click to open →</div>`;
    pv.classList.add('show');
    positionPreview(x,y);
  }
  function hidePreview(){ pv.classList.remove('show'); }
  document.addEventListener('mouseover',e=>{
    const a=e.target.closest && e.target.closest('a.xlink');
    if(a){ clearTimeout(hideTimer); showPreview(a,e.clientX,e.clientY); }
  });
  document.addEventListener('mousemove',e=>{
    if(pv.classList.contains('show')){ const a=e.target.closest&&e.target.closest('a.xlink'); if(a) positionPreview(e.clientX,e.clientY); }
  });
  document.addEventListener('mouseout',e=>{
    const a=e.target.closest && e.target.closest('a.xlink');
    if(a){ hideTimer=setTimeout(hidePreview,80); }
  });
  document.addEventListener('click',e=>{
    const a=e.target.closest && e.target.closest('a.xlink');
    if(a){ e.preventDefault(); hidePreview();
      if(a.hasAttribute('data-date')){ Router.go(a.getAttribute('href')||'#/years'); return; }
      const id=a.getAttribute('data-id'); const p=LINK_PREVIEW[id]; if(p) Router.go(p.route);
    }
  });
  window.addEventListener('hashchange',hidePreview);
  // inline-annotation open/close
  document.addEventListener('click',e=>{
    // like button inside the discussion drawer
    const lk=e.target.closest && e.target.closest('.acmt-like');
    if(lk){ e.preventDefault(); e.stopPropagation();
      if(lk.classList.contains('liked')) return;
      lk.classList.add('liked');
      const nEl=lk.querySelector('.lk-n'); if(nEl) nEl.textContent=(parseInt(nEl.textContent,10)||0)+1;
      return;
    }
    if(e.target.closest && e.target.closest('a.xlink')) return;   // let inner links navigate instead of opening the drawer
    const sp=e.target.closest && e.target.closest('.annot');
    if(sp){ e.preventDefault(); const ai=parseInt(sp.getAttribute('data-ai'),10); openAnnotation(ai); }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAnnotation(); });
  window.addEventListener('hashchange',closeAnnotation);
})();

async function boot(){
  DATA = await loadData();
  // rebuild the derived globals + indexes now that DATA exists
  FCOLORS = DATA.factionColors||{};
  MONTHS = (DATA.calendarMonths||[]).map(m=>m.name||m);
  CUR = DATA.currentDate||{year:1040,monthIndex:7,day:18};
  buildIndexes();
  buildAtlasIndex();
  el('statline').textContent = ALL_ITEMS.length+' articles · '+Object.keys(DATA.conflicts||{}).length+' conflicts · '+(DATA.majorBattles||[]).length+' battles · '+(DATA.congress_votes||[]).length+' votes · '+(((DATA.artifacts||{}).star_bearers||[]).length)+' bearers · '+window.__DATA_SOURCE+' · / search · H links · C comments';
  Router.render();
}
boot();
