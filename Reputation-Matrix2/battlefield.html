me and all of them are negative. 'Legionlance' sounds like something you'd find in a medical supply catalogue. 'Have you tried the Legionlance for your chronic bureaucracy? Apply directly to occupied territory. Side effects may include loss of freedom, forced compliance, and having your personal belongings catalogued and stored in a sealed compartment.'\\n\\nBecause that's what they DID—they boxed up everyone's personal effects, labeled them, and stored them in a sealed room. The Legion DOCUMENTED everything. They probably filed a report on Waluigi's spare hats. They probably CATALOGUED the emergency tennis racket. This is what evil looks like when it has a filing system.\\n\\nThe Legionlance was later seen flying over Raventree Manor during the Spider Grove battle, broadcasting propaganda and compliance orders at maximum volume while Waluigi was trying to fight a GIANT SPIDER. The audacity. The absolute, bureaucratic, loudspeaker-equipped AUDACITY. WAH!","aftermath":"The Liberated Toads lost their mobile headquarters, their communications hub, and the symbolic center of their movement in a single afternoon. Without the Vigilance, they lost the ability to project force, maintain central coordination, and provide a neutral meeting ground for allied factions. Ryan was separated from everyone and picked up by a Rakasha spirit-walker. Bones went deep undercover inside Legion territory, setting the stage for the catastrophe at Aegis Command. The Iron Legion gained air superiority, surveillance capability, and a mobile command platform—advantages that no other faction could match.\\n\\nWaluigi lost his spare hats, his emergency tennis racket, and a framed photograph of himself that he'd hung in his quarters. The photograph was signed. By Waluigi. To Waluigi. Because nobody else was going to do it. The Iron Legion probably filed it under 'Confiscated Personal Effects: Category W.' WAH!","relatedArticles":["vigilance","iron_legion","liberated_toads"]},{"id":"massacre_aegis","name":"Massacre at Aegis Command","date":"Day 21, 1040 BF (14:30)","location":"Aegis Command, Iron Legion Fortress","type":"Infiltration / Massacre","result":"Catastrophic failure; Order 120 issued","belligerents":{"attackers":{"name":"Bones (Liberated Toads infiltrator)","factionId":"liberated_toads","commander":"Bones (operating solo)"},"defenders":{"name":"Iron Legion","factionId":"iron_legion","commander":"General Ironhand"}},"casualties":{"attackers":"Bones (stabbed by General Ironhand personally), ALL Toad prisoners in Legion custody (Order 120)","defenders":"None"},"summary":"Bones' infiltration of Aegis Command ended in discovery. General Ironhand stabbed him and issued Order 120—the immediate execution of every Toad prisoner in Iron Legion custody. Every single one. Waluigi doesn't have jokes for this entry. Some things are beyond jokes.","description":"Waluigi has written about battles where terrible things happened. The fireball at the Tea Party. The executions at Bramblehaven. Events where violence spiraled beyond control or where commanders made cold decisions in combat's heat. Order 120 was different. Order 120 was an administrative decision to kill prisoners who were already captured, already disarmed, already helpless. It was signed at a desk by a man who then went to lunch.\\n\\nWaluigi is going to tell this story straight because it deserves that.\\n\\nBones had been operating inside the Iron Legion since the fall of the Vigilance. His Legionnaire disguise held through days of checkpoint passes, mess hall meals, briefings, and the constant low-level tension of knowing that one wrong word, one misremembered protocol, one unfamiliar face recognizing that YOUR face was unfamiliar, meant death. Waluigi cannot imagine the sustained nerve this required. Waluigi is brave—Waluigi has fought giant spiders and mirror monsters and vampire lords—but courage in combat is DIFFERENT from the courage of pretending to be your enemy while eating breakfast next to people who would execute you for existing.\\n\\nAegis Command was the prize. The Legion's primary fortress. Their command center, strategic planning hub, and—critically—their prisoner holding facilities. Bones entered as part of a routine personnel rotation, passed through three security layers, and started documenting everything he could access.\\n\\nWhat he found in the lower levels confirmed what the Imperial Processing Facility had suggested: the Legion treated prisoners as logistical problems. Toads captured during various operations were catalogued, categorized, and stored in conditions that prioritized space efficiency over anything that might be confused with compassion. The documentation was meticulous. Every prisoner had a case file. Every case file had a number. The numbers were organized by date of capture, faction of origin, and assessed threat level. It was genocide's rough draft disguised as a spreadsheet.\\n\\n**Discovery**\\nBones was caught. The exact mechanism isn't fully clear—some accounts say a biometric check flagged an inconsistency, others suggest an informant within the Liberated Toads sold him out. What's clear is that the disguise failed and Bones was detained.\\n\\nGeneral Ironhand handled the interrogation personally. Ironhand is not the kind of officer who delegates anything he considers personally important, and a successful infiltration of his headquarters was, to him, an insult that demanded a personal response. He stabbed Bones during the interrogation. Not fatally—deliberately not fatally. With the precision of someone making a point about what happens to spies. The blade went in where it would cause maximum pain without death, because Ironhand wanted Bones alive enough to understand exactly how badly he had failed.\\n\\nThe interrogation also uncovered a Green Decoy—a duplicate that had been posing as Speaker L. This revealed that the intelligence war was deeper and messier than anyone had realized. The Legion had been deceived about Toad leadership. The Toads hadn't known the Legion knew enough about Speaker L to build a convincing fake. Everyone was lying to everyone and nobody could trust the information they had.\\n\\n**Order 120**\\nGeneral Ironhand's response to the security breach was Order 120.\\n\\nWaluigi is going to write it plainly: Order 120 was the command to immediately execute all Toad prisoners held in Iron Legion facilities.\\n\\nAll of them.\\n\\nNot combatants. Not spies. Not threats. Prisoners. People who had already been captured. People who were sitting in cells. People who had surrendered, been disarmed, been processed through the Legion's own bureaucracy, been given case files and prisoner numbers, been fed meals on a schedule—those people were ordered killed because ONE infiltrator got caught.\\n\\nThe order was carried out with the efficiency that characterized everything the Iron Legion did. Guards who had been watching over prisoners for days—who had handed them food through bars, who had maybe exchanged words, who had maintained the routine that the Legion valued above all things—carried out executions because their commanding general signed a document. The routine continued. The paperwork was filed. The numbers in the spreadsheets were updated from 'active' to 'terminated.'\\n\\nWaluigi doesn't know the exact number of casualties. The Legion's own records from that period were either destroyed or sealed—one of the very few times the Iron Legion's documentation instinct failed, which tells Waluigi they knew what they did was indefensible even by their own standards. But the scope was devastating. Every Toad prisoner in every Legion holding facility. People who had been captured weeks ago. People who had been captured days ago. People who were captured during the boarding of the Vigilance—people who had been Waluigi's NEIGHBORS on the ship—gone.\\n\\nWaluigi sat with this for a long time before writing it. He's sat with it again now. It doesn't get easier.\\n\\nGeneral Ironhand signed an order and people who were already caged and helpless died for it. That's not war. That's not strategy. That's not even cruelty in the heat of the moment. That's a man choosing to kill defenseless people because his security was embarrassed, and doing it through the same administrative channels he uses to order boot polish.\\n\\nWaluigi has called a lot of people villains in this encyclopedia. Waluigi has called HIMSELF a villain, usually as a joke, sometimes as branding. General Ironhand is not a villain in the way Waluigi uses the word. He's something worse. He's a monster who files his atrocities alphabetically.\\n\\n**Speaker L After**\\nThe news reached Speaker L through channels that Waluigi does not have the specifics of. The effect was immediate and permanent.\\n\\nWaluigi had known Speaker L as a political leader. Measured. Strategic. The kind of person who built coalitions, negotiated compromises, maintained the Liberated Toads as a legitimate movement with legitimate political aims. After Order 120, that person was gone.\\n\\nSpeaker L began chanting war anthems. Not the kind of songs you sing to boost morale—the kind of songs that come from a place where hope used to be and now there's just iron and purpose. He vowed to hunt down the Green Decoy that had worn his face—viewing the impostor not just as an intelligence threat but as a personal violation, someone who had used his identity while his people died.\\n\\nWaluigi watched someone he respected lose the part of themselves that believed in a future worth negotiating for. It was one of the worst things Waluigi has ever witnessed, and Waluigi has witnessed Earl Grey explode.\\n\\nThe Speaker L who existed before Order 120 believed the conflict could end with something other than total destruction. The Speaker L who existed after believed the only acceptable outcome was the Iron Legion's complete annihilation. Waluigi cannot say he was wrong. Waluigi is not sure he has the right to say ANYTHING about it. Some grief belongs to the people carrying it, and Waluigi can only stand nearby and be angry on their behalf.\\n\\nWah.\\n\\nJust... wah.","aftermath":"Mass execution of Toad prisoners. The single deadliest day for the Liberated Toads. Speaker L's transformation from political leader to war leader. The conflict between the Liberated Toads and the Iron Legion escalated from territorial dispute to existential war—no more negotiations, no more compromises, no more pretending the other side was anything other than an enemy to be destroyed.\\n\\nGeneral Ironhand's decision also fractured something within the Legion itself. The order was obeyed, but not every Legionnaire obeyed it comfortably. Some accounts describe soldiers who carried out the executions mechanically and then couldn't eat for days afterward. Others describe soldiers who requested transfers. The Iron Legion's internal cohesion—its greatest asset—developed hairline cracks that would widen over time. A machine that asks its parts to do monstrous things will eventually find that some of its parts are still human.\\n\\nBones survived his injuries. The physical ones, anyway. The knowledge that his capture triggered the massacre—that his infiltration, however well-intentioned, was the proximate cause of Order 120—is a weight that Waluigi suspects Bones carries every day. It wasn't his fault. Ironhand made the decision. Ironhand signed the order. But Waluigi knows from personal experience that logic doesn't always win arguments with guilt, and guilt doesn't care about who's technically responsible.","relatedArticles":["iron_legion","liberated_toads","speaker_l"]},{"id":"planar_fracture","name":"The Planar Fracture","date":"Day 21, 1040 BF (01:30-01:45)","location":"Raventree Manor (all planes)","type":"Catastrophic Magical Event","result":"Reality shattered into three planar shards. Waluigi ended up in the Feywild.","belligerents":{"attackers":{"name":"N/A — Magical catastrophe","factionId":null,"commander":"The Oracle (ritual leader)"},"defenders":{"name":"N/A","factionId":null,"commander":"N/A"}},"casualties":{"attackers":"Party scattered across three hostile dimensions","defenders":"Physical ritual room seized by Iron Legion; Toadburt coerced via Entropy Ring"},"summary":"The Oracle attempted a synchronization ritual to stabilize Raventree Manor's dimensional instability. It failed catastrophically. Local reality shattered into three planar shards—Shadowfell, Feywild, Deep Mirror—and the party was scattered across them. Waluigi landed in the Feywild with Toad Lee, which involved fairy courts, giant insects, and the most EXHAUSTING social politics Waluigi has ever experienced, and Waluigi has been to Mario Party TWELVE TIMES.","description":"Fifteen minutes. That's how long the ritual lasted before everything broke. Waluigi wants that number on the record: FIFTEEN MINUTES from 'let's fix reality' to 'reality is in three pieces and Waluigi is in a fairy dimension surrounded by sentient mushrooms.'\\n\\nThe Oracle's synchronization rite was supposed to align three layers of reality—the physical world, mirror-space, and the 'Deep Layers.' The theory was that Raventree Manor's escalating supernatural instability could be resolved by harmonizing the overlapping planes. Pull them into alignment, smooth out the dimensional wrinkles, stop the wraiths and mirror monsters and general architectural hostility. On paper, it probably made sense. Waluigi wouldn't know because nobody showed Waluigi the paper.\\n\\nThe ritual required three things it didn't have: coordinated participants, all required personnel present, and a stable magical field. What it HAD was a group of people who were arguing with each other before the ritual started, several key positions in the geometric array left empty because people were missing or refusing to participate, and Archie Miser's magic serving as the primary power source.\\n\\nWaluigi needs to pause on that last point. ARCHIE MISER'S magic was the foundation of a ritual designed to STABILIZE REALITY. Archie. The man who resolves diplomatic disputes with fireballs. The man whose magical signature is about as stable as a house of cards in a hurricane. THAT was the foundation they built the ritual on.\\n\\nWaluigi SAID something. Waluigi raised his hand—his beautiful, well-manicured hand—and said 'Is anyone else concerned about this?' And people SHUSHED him. They SHUSHED Waluigi. The great Waluigi, who was RIGHT, was SHUSHED.\\n\\nThe ritual began at approximately 01:30 in the morning because apparently nobody considered that maybe reality-altering magic should be performed during BUSINESS HOURS when people are ALERT.\\n\\nFor fifteen minutes, it seemed to be working. The dimensional boundaries around the manor shimmered, flexed, and began to align. There was a moment—brief, fragile—where Waluigi could feel the planes settling into harmony. It felt like the world exhaling after holding its breath.\\n\\nThen Archie's contribution destabilized. Because of COURSE it did.\\n\\nThe feedback was instant. The alignment didn't slip gently out of sync—it SHATTERED. The dimensional boundaries that were supposed to harmonize instead broke apart like glass, and Raventree Manor—already a nexus of overlapping realities—split into three separate planar fragments.\\n\\nThe room spun. The floor wasn't the floor anymore. Colors inverted. Sound became light and light became pressure and PRESSURE became a force that picked Waluigi up and threw him sideways through a crack in reality that shouldn't have existed.\\n\\nFifteen minutes. From stability to apocalypse. WAH.\\n\\n**The Shadowfell — Shadow Estate**\\nArchie and Bowser were cast into the Shadowfell shard. Waluigi learned about their experience afterward and honestly, it's fitting that Archie ended up in the ONE dimension where fire magic doesn't work properly. The Shadowfell's planar physics suppressed fire. Archie in the Shadowfell was like Waluigi without his hat—technically functional but missing the thing that defines him.\\n\\nThe Shadow Estate was a monochrome version of Raventree Manor. Same architecture, same layout, but drained of color and warmth. Everything in shades of grey and black. The air pressed down on you like the dimension itself was trying to flatten you into a shadow.\\n\\nThe estate was controlled by the Onyx Hand and their vampire lords—the Corvinarus family's undead branch. Centuries of vampiric political intrigue condensed into a single haunted manor. The vampires viewed the sudden arrival of living visitors as either an intrusion to be punished or a diversion to be enjoyed, and their idea of 'enjoyment' involved forced dinner parties and death-vote traditions. Waluigi has seen Bowser's dinner parties and they're bad, but at least nobody gets voted to die at BOWSER'S table. Usually.\\n\\n**The Feywild — Overgrown Manor**\\nWaluigi ended up HERE. With Toad Lee. In the FEYWILD.\\n\\nThe Feywild version of Raventree Manor had been consumed by nature in the way that nature consumes things when given unlimited time and zero supervision. Walls cracked open by root systems the size of Waluigi's arm. Corridors choked with flowering vines that MOVED when you weren't looking at them directly. Rooms that had become self-contained ecosystems hosting giant insects, bioluminescent fungi, and fairy creatures that spoke in riddles and got OFFENDED if you solved them too quickly.\\n\\nThe Overgrown Manor was ruled by Lady Aurelian Corvinarus—the fey counterpart to the Shadowfell's vampire lords. Same family, different dimensional branch. Where the Shadowfell Corvinarus operated through undead hierarchy and blood politics, Lady Aurelian ran her court through fey logic. Obligations. Favors. Riddles. Social debts that multiplied if you acknowledged them and TRIPLED if you didn't. Waluigi found fey court politics more exhausting than any battle he fought during the entire campaign.\\n\\nAt least with spiders, you know where you stand. You're standing in a web and the spider wants to eat you. SIMPLE. With fey? You're standing in a conversation and the fairy wants you to owe them something, but they won't tell you WHAT you owe or WHEN it's due, and if you ask, that's ANOTHER obligation. Waluigi spent what felt like DAYS navigating social dynamics that changed based on the time of day, the phase of the moon, and apparently the ambient mood of the local butterfly population.\\n\\nToad Lee was a surprisingly good companion for this ordeal. Quiet. Observant. Didn't trigger any accidental fairy obligations by making eye contact with the wrong flower. Waluigi appreciated Toad Lee's competence more than he had time to express.\\n\\n**The Deep Mirror — Fractured Atrium**\\nMarkop, Remi, and the Oracle vanished into the Deep Mirror, which was the worst of the three by a significant margin. The Deep Mirror was a dimension of crystalline structures, gravity that changed direction without warning, and time that DECAYED. Not just moved differently—decayed. Like fruit left on a counter. Things aged visibly. Edges frayed. The dimension was consuming itself.\\n\\nWaluigi did not end up in the Deep Mirror and he is GRATEFUL. The Feywild was exhausting but at least it was ALIVE. The Deep Mirror was dying, and it wanted to take everything inside it along for the ride. Markop and Remi and the Oracle had to navigate a collapsing reality while searching for a way back, which makes Waluigi's fey court problems seem like a mild inconvenience by comparison. Waluigi can at least admit that.\\n\\n**The Physical Plane**\\nThe ritual room—the only piece of Raventree Manor that stayed in normal reality—was seized by the Iron Legion within hours. Because the Iron Legion has the tactical instincts of a vulture and the moral compass of a calculator. They recognized the room as an anchor point connecting the three fractured dimensions and immediately secured it.\\n\\nThey also sent Toadburt into the Feywild shard as a coerced operative. Toadburt had been fitted with an Entropy Ring—a device that ensured compliance through the threat of very bad things happening to the wearer if they disobeyed. Waluigi has strong feelings about strapping obedience collars on people and sending them into alien dimensions. Those feelings can be summarized as: the Iron Legion is AWFUL and General Ironhand specifically can go sit on a Thwomp.\\n\\nThe Planar Fracture became the defining catastrophe of everything that followed. Every subsequent battle, alliance, betrayal, and desperate scramble for survival happened in its shadow. The party was separated across three hostile dimensions with no way to communicate, no way to coordinate, and no way to know if the others were even alive. Waluigi spent every moment in the Feywild wondering whether Archie was dead in the Shadowfell, whether Markop was lost in the Deep Mirror, whether anyone was coming to help or whether 'help' was a concept that had fractured along with reality.\\n\\nFifteen minutes. One failed ritual. Everything broken.\\n\\nWaluigi will never forgive whoever shushed him.","aftermath":"The party was scattered across three hostile dimensions with no reliable means of communication or transit. Archie and Bowser faced vampiric politics in a plane that neutralized their best weapons. Waluigi and Toad Lee navigated fey court politics that made Mushroom Kingdom diplomacy look straightforward. Markop, Remi, and the Oracle fought to survive in a dimension that was actively decomposing around them. The Iron Legion controlled the only stable anchor point, because the Iron Legion ALWAYS controls the thing you need most.\\n\\nThe Planar Fracture ensured that nothing that followed was simple. Every problem became three problems—one per dimension. Every solution required coordination between groups that couldn't talk to each other. And every day that passed deepened the fractures, making eventual repair more difficult and more dangerous.\\n\\nWaluigi survived the Feywild. Waluigi survived the fairy courts and the giant insects and the sentient vegetation and Lady Aurelian's INTERMINABLE riddle games. Waluigi survived because Waluigi is TOO STUBBORN to be destroyed by a dimensional catastrophe. The universe has tried to break Waluigi many times and it has NEVER SUCCEEDED. WAH!","relatedArticles":["raventree_manor","the_oracle","corvinarus_family","onyx_hand","iron_legion"]},{"id":"solarium_detonation","name":"The Solarium Detonation","date":"Faystyl 24, Year 722 of the Eternal Bloom (Time is Broken)","location":"The Solarium, Overgrown Manor (Feywild)","type":"Explosive Heist / Friendly Fire Incident","result":"Tactical Draw — Bramblefly scorched; Wario plummeted through the floor but secured the loot","belligerents":{"attackers":{"name":"Wario & Hjumpik","factionId":"wario_enterprise","commander":"Wario (Self-Appointed)"},"defenders":{"name":"Giant Bramblefly","factionId":"onyx_hand","commander":"None (It's a giant bug)"}},"casualties":{"attackers":"Wario (minor singeing, fell through a floor), Solarium Architecture (destroyed)","defenders":"Giant Bramblefly (caught in blast radius)"},"summary":"This 'battle' consisted of Wario attempting to assassinate a giant dragonfly with a beautifully wrapped time-bomb, solely because he wanted to steal the treasure it was guarding. Hjumpik, attempting to be the voice of reason, threw an axe at the bomb and detonated it early. Wario was blown through the floor. Waluigi was not present, but he fully supports Wario's commitment to prioritizing gold over structural integrity.","description":"Waluigi must first establish the setting: The party had discovered a hidden pathway leading to the Overgrown Manor's Solarium, which had been turned into a nest for a massive, terrifying insect known as the Bramblefly. More importantly, the nest was full of silver and loot.\\n\\n**Phase 1: The Wario Bash**\\nWario approached the situation with his signature subtlety. He dusted off his overalls, slipped on his custom 'W' brass knuckles, and began loudly announcing his intention to buy a castle while kicking humanoid bones out of his way. When the Bramblefly executed an 'Air Strike' dive bomb, Wario performed a perfect greasy combat roll, famously stuffing a golden candlestick into his pocket mid-dodge. Waluigi has always admired Wario's ability to multitask greed and violence simultaneously.\\n\\n**Phase 2: The Ticking Present**\\nInstead of simply punching the insect, Wario reached into his chaotic bag of holding and pulled out a beautifully wrapped present box with an elaborate bow. It was ticking. Wario cheerfully offered it to the winged freak. \\n\\nHjumpik, who apparently possesses an allergy to effective explosions, decided this was too dangerous. He revealed himself and threw a hand axe directly at the present. \\n\\n**Phase 3: Explosive Decompression**\\nThe axe struck the ticking box mid-air. Waluigi knows exactly what a Wario-brand explosive sounds like, and the resulting *BOOOOOM* was textbook. The explosion engulfed Wario, the Bramblefly, and whatever remained of the Solarium's rotted wooden floor. \\n\\nWario plummeted to the lower level, screaming his iconic *'WAAAAAHHHH!'* But because Wario's body actively rejects the concept of taking falling damage, he landed in a pile of treasure downstairs, slightly smoking but entirely intact. He immediately began scooping up the gold, declaring it 'Still... worth it!' Waluigi considers this a flawless tactical operation.","aftermath":"The floor of the Solarium was destroyed, creating a convenient, if highly dangerous, shortcut between floors. Wario secured his loot and scurried off. The Bramblefly was severely damaged but apparently survived, proving that Feywild insects are ridiculously durable. Hjumpik learned a valuable lesson: never interrupt Wario when he is conducting an explosive transaction.","relatedArticles":["wario","overgrown_manor","wario_enterprise"]},{"id":"rescue_of_steely","name":"The Rescue of Steely","date":"Faystyl 24, Year 722 of the Eternal Bloom","location":"Servant's Quarters, Overgrown Manor (Feywild)","type":"Close-Quarters Skirmish","result":"Victory — Dog recovered; Goblin guard neutralized","belligerents":{"attackers":{"name":"Toad Lee, Hjumpik, Azure (Rakasha)","factionId":"disaster_inc","commander":"Toad Lee"},"defenders":{"name":"Gregory (Goblin Guard) & Staff","factionId":"onyx_hand","commander":"Gregory"}},"casualties":{"attackers":"Toad Lee (temporarily lost a shield, fell out a window), Hjumpik (minor stab wounds)","defenders":"Gregory the Goblin (unconscious/bleeding out), Another guard (squished by Azure)"},"summary":"Remi's mechanical dog (which Hjumpik has inexplicably renamed 'Steely') was abducted by manor staff who wanted to dismantle it for scrap metal. Toad Lee and Hjumpik breached the servant's quarters to get it back. The fight involved toilet ambushes, stolen shields, and Azure pulling Toad Lee up from a lethal drop. Waluigi approves of this violence; nobody steals a party pet and gets away with it.","description":"The Feywild operates on a strict lack of metal. The Overgrown Manor is all wood, vines, and magic. Consequently, when the goblin staff found Remi's steam-powered mechanical dog running around, they didn't see a pet—they saw premium scrap metal to help them advance to the 'Guilded Age.' Waluigi finds this entrepreneurial spirit commendable, but stealing from Disaster Inc. is a bad business model.\\n\\n**Phase 1: The Bathroom Breach**\\nToad Lee, displaying a remarkable lack of his usual caution, tracked the dog to the servant's quarters. He barged into a room clearly marked 'OCCUPIED,' discovering a servant on the toilet. Toad Lee politely apologized, backed out, and then immediately breached the correct room across the hall. \\n\\n**Phase 2: Shield Theft and Gravity**\\nThe fight devolved into a chaotic brawl. Gregory, a shockingly competent goblin guard, managed to catch Toad Lee's longsword in his own shield. Hjumpik intervened, using his 'Morning Glory' weapon (a flower bud that blooms into a milky gray steel blade) to stab the goblin. \\n\\nGregory, unfazed, used his sword to completely wrench Toad Lee's shield out of his hands, mockingly thanking him for the upgrade. Toad Lee attempted a retaliatory acrobatic jump to get behind the goblin, completely misjudged the distance, and plummeted out the window. Waluigi has done this before (usually in Mario Kart), but it is never not embarrassing.\\n\\n**Phase 3: The Rakasha Intervention**\\nToad Lee would have plummeted to the library below, but Azure (the incredibly intoxicated Rakasha) manifested a giant, glowing blue ghost-hand and snatched him out of the air. She hauled him back inside, then casually walked over an unconscious staff member (*SQUISH*) and grabbed the mechanical dog.\\n\\nHjumpik finished the fight by perfectly striking Gregory's stolen shield with his warhammer, knocking it out of the goblin's hands. Hjumpik then de-escalated the situation, offering Gregory a truce. Toad Lee immediately looted Gregory's pockets while Hjumpik wasn't looking. Flawless teamwork.","aftermath":"The mechanical dog ('Steely' / Mossy) was safely recovered, though it sounded like a boiling tea kettle. Toad Lee survived his embarrassing fall, and the party successfully escaped the servant's quarters. The goblin guard Gregory was left unconscious but alive, possessing a profound new respect for Toads.","relatedArticles":["toad_lee","mossy","overgrown_manor"]},{"id":"shattering_shadow_anchor","name":"The Shattering of the Shadow Anchor","date":"Day 23, 1040 BF","location":"Dining Hall and Courtyard, Shadow Estate","type":"Assassination / Supernatural Sabotage","result":"Strategic Victory — Anchor destroyed, color and fire magic restored","belligerents":{"attackers":{"name":"Disaster Inc. (Depowered Wing)","factionId":"disaster_inc","commander":"Green T (Tactical MVP)"},"defenders":{"name":"Orangus Cornelius (Giant Bat Form) & Vampire Court","factionId":"onyx_hand","commander":"Orangus Cornelius"}},"casualties":{"attackers":"Archie (temporarily lost his dignity floating like a feather)","defenders":"The Shadow Anchor (SHATTERED), Orangus Cornelius (severe blunt force trauma and silver poisoning)"},"summary":"This is the climax of the infamous Shadow Estate dinner party. Stripped of his fire magic, Archie Miser had to rely on Bowser's fists and Green T's absolute ruthlessness. The battle involved a giant vampire bat, a defenestration, and Green T sniping a magical purple crystal hidden inside a hollow statue. The destruction of the Anchor brought color and fire back to the Shadowfell. Waluigi was not there, but he considers this the single greatest piece of property damage in the campaign's history, and Waluigi knows property damage.","description":"Waluigi must remind the reader of the stakes: Archie Miser woke up on a marble floor without his magic. The Shadowfell's entropy was so high, and its energy so low, that Archie couldn't even conjure a spark. Waluigi finds the idea of Archie without fire hilarious, but practically speaking, it meant Disaster Inc. was walking into a vampire lord's dining room completely unarmed. Except for Bowser, who is genetically a weapon, and Green T, who had apparently smuggled a flintlock pistol in his trousers.\\n\\n**Phase 1: The Raw Meat and the Ultimatum**\\nThe dinner began with Orangus Cornelius serving raw, dripping meat. Bowser ate it in one bite because Bowser has the palate of a garbage disposal. Cornelius then demanded a debt from Archie for burning his greenhouse in the material plane. This is typical aristocratic behavior—they invite you to dinner, serve you terrible food, and then ask you to pay for landscaping. When Cornelius threatened to turn Bowser's shell into a soup bowl, diplomacy officially ended.\\n\\nGreen T, sitting at the CHILDREN'S TABLE wearing a bib, kicked his table over, drew his weapon, and declared he had the key to the 'Anchor'. Cornelius panicked. This was the moment Waluigi wishes he could have painted and hung in the Louvre.\\n\\n**Phase 2: The Defenestration of Cornelius**\\nBowser flipped the main dining table, sending raw meat and coagulated blood-wax flying. Archie, realizing he was useless in a magical fight, grabbed a silver candlestick and actually hit a vampire with it. Waluigi respects the improvisation. Silver burns vampires, which is a universally known fact that vampires arrogantly ignore until someone hits them with the tableware.\\n\\nBowser then tackled Orangus Cornelius straight through the dining room window and into the courtyard. Waluigi has thrown people out of rings, off karts, and into bottomless pits, but tackling a vampire lord through a gothic window is objectively excellent showmanship.\\n\\n**Phase 3: The Bat and the Crystal**\\nIn the courtyard, Cornelius revealed his true form: a giant bat monster. Bowser, unfazed, simply bit the bat's wing. Waluigi wants to note that biting a giant undead bat requires a level of immune system confidence that Waluigi does not possess. \\n\\nArchie jumped out the window to help, but because the Shadowfell's gravity is fundamentally broken, he floated down slowly like a dandelion. Undignified! But this slow descent allowed Archie to see the battlefield from a tactical angle. When Bowser threw Cornelius into a winged statue, the statue shattered, revealing it was hollow. Inside pulsed a glowing purple crystal. The Anchor.\\n\\n**Phase 4: The Shot**\\nArchie realized the crystal was maintaining the plane's suppression. He yelled for Bowser to smash it, but Cornelius lunged to protect it. Time slowed down. Green T, standing at the shattered window above like a sniper in a tuxedo, took aim. \\n\\nThe bullet hit the crystal. The Anchor shattered into dust.\\n\\nThe effect was instantaneous. Reality cracked. Colors—reds, oranges, yellows—bled violently back into the monochrome world. The planar suppression collapsed. Archie felt heat return to his hands and immediately ignited. The Shadow Estate's absolute control over the local dimension was broken. Disaster Inc. had successfully lobotomized a vampire stronghold, and they did it before dessert.","aftermath":"The shattering of the Shadow Anchor permanently altered the local physics of the Shadow Estate. Color returned, making the gothic architecture look incredibly tacky in Waluigi's opinion. More importantly, it restored the party's magical capabilities. Orangus Cornelius was severely wounded, opening the door for Vivian's succession claim and throwing the Onyx Hand into utter chaos. It also attracted the Mages' Guild, who showed up to 'manage the anomaly' and immediately started billing people for property damage. Typical.","relatedArticles":["shadow_estate","archie_miser","green_t","bowser"]},{"id":"skirmish_mazebound","name":"Skirmish in the Mazebound Grove","date":"Day 28, 1040 BF","location":"The Mazebound Grove, Shadow Estate","type":"Ambush / Unwanted Musical Number","result":"Survival — Party escaped, but Dan was captured","belligerents":{"attackers":{"name":"The Mazebound","factionId":"onyx_hand","commander":"Lead Mazebound"},"defenders":{"name":"Markop, Remi, Dan (Parallel), Salam, Eager","factionId":"disaster_inc","commander":"Markop"}},"casualties":{"attackers":"Several Mazebound (melted by undead remedy)","defenders":"Parallel Dan (Captured), Party Morale (damaged by terrible rhyming)"},"summary":"Waluigi hates musicals. He especially hates musicals where the chorus tries to strangle you. Markop's rescue team was ambushed in a petrified hedge maze by the 'Mazebound'—grey-skinned ghouls who sing theatrical patter-songs while ripping you apart. The party survived, but Dan was dragged away into the hedges. Waluigi considers this the most undignified battle of the campaign.","description":"After the Shadow Anchor shattered, the estate's grounds became even more hostile. Markop, leading Remi, Dan, Salam, and Eager, ventured into the estate's hedge maze looking for Archie. Instead of Archie, they found the Mazebound.\\n\\n**The Ambush**\\nThe Mazebound are hunched, snub-nosed humanoids with glowing white eyes and sharp nails. But their physical threat is secondary to their psychological warfare: they sing. They leaped out of the hedges doing 'jazz hands' and immediately launched into a rhyming chorus: *'Welcome to the grove, welcome to the gray! You'll never find the fountain so you might as well stay!'*\\n\\nWaluigi finds this deeply offensive. If you are going to taunt your enemies, do it with a sharp laugh or a magnificent monologue. Do not do a choreographed routine in a hedge maze.\\n\\n**The Choreographed Violence**\\nThe fight was chaotic. The Mazebound encircled the party, specifically targeting their weaknesses while singing a rapid patter-song: *'Check the Turtle! Big and loud! Check the Archer! Check the Whip! Check the Toads—one blue, one green? Or is he purple? Is he mean?'*\\n\\nMarkop, proving his absolute pragmatism, ignored the music and coated his sword in an 'undead remedy.' When a Mazebound lunged, Markop struck, melting the creature's grey skin off its bones. Remi, still suffering from blood loss (vampire taxes, essentially), tried to stab a Mazebound, but her dagger had no effect on its thick skin. The creature mocked her, attempting to give her a 'goodbye kiss' before Remi dodged and Salam provided covering fire.\\n\\n**The Abduction of Dan**\\nThe tragedy of this skirmish was Dan. Or rather, the 'Parallel Dan' (Waluigi will elaborate on this dimensional headache in Dan's character entry). While Markop was bashing heads and Eager was tripping ghouls with his whip, the Mazebound swarmed Dan. They dragged him backward into the impenetrable petrified hedges. \\n\\nBowser arrived moments later, entirely missing the musical number, and completely incinerated a section of the maze with his fire breath. But it was too late. Dan was gone, and the Mazebound retreated into the shadows, leaving only the echo of their terrible singing.","aftermath":"The party was forced to press forward without Dan, deeply unnerved by the encounter. They eventually found the groundskeeper's cottage (belonging to Tymnas the Satyr) and discovered Archie's discarded pouch and watch, proving Archie had survived but was on the run. Waluigi hopes he never has to fight the Mazebound. Waluigi refuses to participate in a duet with a zombie.","relatedArticles":["shadow_estate","markop","dan_the_toad","remi"]},{"id":"aegis_command_riot","name":"The Aegis Command Riot (Order 120)","date":"Highsun 21, 1040 BF","location":"Aegis Command, Imperial Processing Facility","type":"Prison Break / Sabotage","result":"Decisive Toad Victory — 158 Prisoners Escaped; Aegis Compromised","belligerents":{"attackers":{"name":"The Liberated Toads (Infiltrators & Prisoners)","factionId":"liberated_toads","commander":"Speaker L (Mastermind)"},"defenders":{"name":"The Iron Legion","factionId":"iron_legion","commander":"General Marcus Ironhand"}},"casualties":{"attackers":"12 KIA, 17 recaptured, Bones (severely wounded and exposed)","defenders":"32 KIA, massive infrastructure damage, total loss of narrative control"},"summary":"General Ironhand issued Order 120 to execute all Toad prisoners. Speaker L responded by proving he had already rigged the entire fortress to explode. Using peppermint gas, mini-mushrooms baked into bread crusts, and a decoy Speaker L painted green, 158 Toads broke out of the Legion's most secure facility. Waluigi has never respected Speaker L more. It was a masterclass in chaotic logistics.","description":"Waluigi must correct the historical record: The Iron Legion thought they were conducting a purge. Speaker L was conducting a symphony of sabotage.\\n\\n**Phase 1: The Bread Code and the Green Fog**\\nSpeaker L, operating through a hacked terminal, synchronized a flawless prison break. Kitchen sympathizers smuggled 'Mini-Mushrooms' inside the prisoners' hardtack rations. At the ringing of the third bell, the laundry vents began spewing a custom-synthesized peppermint gas designed specifically to choke Imperial lungs while leaving Toads unharmed. \\n\\n**Phase 2: The Miniature Escape**\\nAs the guards choked, the prisoners consumed the Mini-Mushrooms, shrinking to a fraction of their size to slip out of their cuffs and down the floor drains. They followed paths of bioluminescent moss planted weeks in advance by Noki smugglers. It was an underground highway of tiny, angry amphibians.\\n\\n**Phase 3: Boiler Sabotage and Extraction**\\nToads jammed the boiler pressure valves with discarded Imperial service medals—a touch of poetic irony that Waluigi deeply appreciates. The resulting steam explosion blew out the east wall, blinding the Legion's drones and snipers. The prisoners poured out, utilizing makeshift ziplines made of bedsheets, and dove off a 50-foot cliff into the river where Noki submersibles were waiting.\\n\\n**The Aftermath:**\\nGeneral Ironhand's 'Order 120' was meant to erase a problem. Instead, it exposed the Iron Legion as hollow. They lost 158 prisoners, their base was humiliated, and they discovered their 'Speaker L' captive was just a decoy dyed green. However, Bones was unmasked and stabbed by Ironhand during the chaos, leaving his fate uncertain. Waluigi takes notes: never put Waluigi in a cell, because Waluigi will turn the plumbing into a weapon. WAH!","aftermath":"The myth of the Iron Legion's invincibility was shattered. The refugees fled toward the Whispering Caves and eventually the Mushroom Kingdom borders. The Legion is now out for blood, and Speaker L has solidified his position as a terrifyingly competent tactical mastermind.","relatedArticles":["liberated_toads","iron_legion","general_ironhand","speaker_l"]},{"id":"battle_of_the_mirror_room","name":"Battle of the Mirror Room","date":"Highsun 21, 1040 BF","location":"The Solarium, Raventree Manor","type":"Supernatural Containment","result":"Complicated Draw — Monster shattered; Red Hjumpik manifested","belligerents":{"attackers":{"name":"Disaster Inc. & The Oracle","factionId":"disaster_inc","commander":"Hjumpik"},"defenders":{"name":"The Shard Stalker (Mirror Terror)","factionId":null,"commander":"None"}},"casualties":{"attackers":"Green T (temporarily lost in the mirror), Dan (injured hands), Party Trust (severely damaged)","defenders":"The Shard Stalker (Turned to stone by Mages' Guild)"},"summary":"The party engaged a Shard Stalker inside a solarium filled with mirrors. The monster bounced between reflections, creating an infinitely frustrating game of whack-a-mole. Bowser punched the glass until his knuckles bled. Hjumpik was pulled into the mirror realm, faced a blue copy of himself, and eventually, a 'Red Hjumpik' stepped out into the real world. Waluigi officially declares mirrors to be the worst invention in history.","description":"Waluigi hates reflections. They are never as handsome as the original. But in Raventree Manor, reflections actively try to kill you.\\n\\n**The Engagement**\\nThe Shard Stalker teleported between the dozen free-standing mirrors in the ruined Solarium, attacking from impossible angles. Archie, showing incredible restraint, threw flaming twigs and controlled bonfires instead of his signature Fireball, earning nods from the Mages' Guild observers. Dan, despite having only one functional arm, swung his axe at the glass while Toad Lee tried to coordinate defensive formations.\\n\\n**The Mirror Realm**\\nBowser, furious that the monster was using trickery, began physically punching the mirrors, shattering them with his bare hands. During the chaos, Hjumpik was pulled THROUGH the glass into a floating, inverse library. There, he encountered a 'Blue Hjumpik' that warned him: 'If you strike me, you strike yourself.'\\n\\n**The Red Emergence**\\nBack in the physical world, as the final mirrors shattered, a 'Red Hjumpik' stepped out. He looked identical, but his demeanor was... off. He smiled too much. The Mages' Guild, swooping in like the bureaucratic vultures they are, captured the remains of the Shard Stalker in a null cage, turning it to stone. They also demanded to study the Red Hjumpik. \\n\\nWaluigi watched from a safe distance. The party survived, but they are now traveling with a version of their friend who might just be a reflection wearing his skin. Waluigi is keeping one hand on his tennis racket at all times.","aftermath":"The Mages' Guild claimed the petrified monster, removing evidence of the anomaly. The Oracle, annoyed that the monster wasn't truly 'killed,' ushered the party toward the final Summoning Room, noting that the ritual would now require blood to complete.","relatedArticles":["raventree_manor","hjumpik","archie_miser","the_oracle"]},{"id":"primordial_wyrm_awakening","name":"The Awakening of the Primordial Wyrm","date":"Highsun 22-27, 1040 BF","location":"Valley of Bowser, Dark Lands","type":"Cosmic Containment Failure / Resistance Campaign","result":"Koopa Resistance Victory — Wyrm re-sealed; Kamek captured; Valley ruined","belligerents":{"attackers":{"name":"Kamek & Corrupted Legion","factionId":"koopa_troop","commander":"Regent Sorcerer Kamek"},"defenders":{"name":"Koopa Resistance (Workers & Soldiers)","factionId":"koopa_troop","commander":"General Hammer Bro"}},"casualties":{"attackers":"Kamek (power stripped, imprisoned), Corrupted Koopa forces (eradicated)","defenders":"38 Resistance members KIA (including Demolitions Bob-omb and the Heroic Shy Guy), The entire Valley ecosystem"},"summary":"While Bowser was away, Kamek decided to play god. He dug under the castle and awakened the Primordial Wyrm—a cosmic parasite older than the stars that the Koopa Dynasty was originally founded to keep locked up. A ragtag resistance of Goombas, Shy Guys, and Hammer Bros had to blow up seven anchor crystals to re-seal the beast. Waluigi respects the sheer, apocalyptic ambition of Kamek, but it was a terrible real estate decision.","description":"Waluigi must clarify the true nature of the Koopa Kingdom. Bowser’s ancestors were not just tyrants who liked lava; they were *wardens*. Their castle was built as a lid on a metaphysical prison holding the Primordial Wyrm, a reality-eating entity. Kamek, believing he could harness this power to defeat the Iron Legion and Mario, reversed the polarity of the prison seals.\\n\\n**The Coup and the Corruption**\\nDeclaring himself the 'Regent Sorcerer,' Kamek began feeding loyal troops to the Wyrm, turning them into purple-veined, hollowed-out husks. The valley sky turned purple, and the earth vibrated with the creature's hunger. \\n\\n**The Working-Class Resistance**\\nWith Bowser weeks away in the Midlands, the kingdom was saved not by royalty, but by the construction crew. A Koopa Foreman, a Hammer Bro Sergeant, a Demolitions Bob-omb, and a deeply traumatized Shy Guy formed the 'Koopa Resistance.' They discovered the original blueprints for the seven seals holding the Wyrm. \\n\\n**The Seven Seals**\\nIn a desperate, multi-day campaign, the Resistance struck the anchors. The final battle took place at the Volcanic Shrine. Kamek, now thirty feet tall and warping reality, erased entire squads from existence. The detonator broke, forcing the Demolitions Bob-omb to sacrifice himself to shatter the final crystal. The Shy Guy walked directly into the Wyrm's light to detonate another anchor from the inside. \\n\\nWith the anchors destroyed, the prison reformed, dragging the Wyrm—and Kamek's borrowed power—back into the earth.","aftermath":"Bowser returned to find his valley in ruins, but his kingdom saved by the grunts he usually ignores. He promoted the Hammer Bro to General and sentenced Kamek to eternal imprisonment in the very pit he opened. The Koopa Troop is battered, but unified by trauma. Waluigi sheds a single tear for the Bob-omb. What a way to go.","relatedArticles":["koopa_troop","bowser"]},{"id":"escape_from_the_hag","name":"The Escape from the Hag's Hut","date":"Faystyl 24, Year 722","location":"The Hag's Hut, Overgrown Manor Grounds (Feywild)","type":"Trap Recovery / Hostage Negotiation","result":"Pyrrhic Victory — Waluigi severely injured but rescued; Party escaped","belligerents":{"attackers":{"name":"The Cannibal Hag","factionId":"onyx_hand","commander":"The Hag"},"defenders":{"name":"Waluigi, Hjumpik, Toad Lee, Rakasha","factionId":"disaster_inc","commander":"Hjumpik"}},"casualties":{"attackers":"One shattered window","defenders":"Waluigi (Leg caught in bear trap, bone exposed, dignity bruised)"},"summary":"Waluigi was victimized by a bear trap inside a cannibal hag's kitchen. While Rakasha slept upstairs, the Hag attempted to cook Waluigi and Toad Lee for dinner. Hjumpik engaged in tense negotiations, trading an antitoxin for Waluigi's life. The party ultimately threw themselves out of a second-story glass window to escape. Waluigi considers this the darkest moment of his magnificent life.","description":"The party, exhausted from avoiding fairy nobles, sought refuge in a circular hut on the manor grounds. It was a terrible idea. The hut featured a bubbling cauldron, a table set with rotted brains on wooden plates, and iron cages. Rakasha, oblivious to danger, went upstairs to sleep in a bed stained with suspicious fluids. \\n\\n**The Bear Trap Incident**\\nWaluigi, possessing the long, graceful legs of a dancer, accidentally stepped into a hidden bear trap. The trap slammed shut with terrifying force, exposing bone. Waluigi did not cry. Waluigi merely expressed extreme, vocal displeasure. \\n\\nThe Hag—a horrifying old woman with bulging red eyes—returned from the party to find Toad Lee attempting to free Waluigi. She casually threw Toad Lee into a rusted iron cage alongside Waluigi, declaring them 'tonight's dinner.' She then condescendingly explained to Toad Lee how the trap's mechanism worked, nearly chopping off Toad Lee's hand in the process.\\n\\n**The Negotiation and the Defenestration**\\nHjumpik descended the stairs and leveled his warhammer. Instead of a brawl, a tense negotiation ensued. The Hag, noticing Hjumpik had raided her bedroom upstairs, demanded her stolen items back. Hjumpik traded a vial of antitoxin for Waluigi's release. \\n\\nToad Lee successfully unlocked the cage and dragged the profusely bleeding Waluigi toward the stairs. Hjumpik woke the snoring Rakasha, and realizing the Hag was charging up the stairs in a murderous rage, the entire party leaped backward through a closed glass window, plummeting into the leaf-covered forest floor below. Waluigi's bone was later magically mended by Hjumpik, leaving only a small scar and a massive grudge against all hags.","aftermath":"The party escaped into the greenhouse, completely traumatized. Waluigi was healed but remains highly suspicious of all circular architecture. The Hag is still at large, presumably looking for someone else to put in her stew.","relatedArticles":["waluigi","toad_lee","overgrown_manor"]},{"id":"dinner_climax_vote","name":"The Dinner's Climax: The Vote","date":"Day 23, 1040 BF (20:00)","location":"Shadow Estate, Shadowfell","type":"Political Assassination / Escape","result":"Orangus Cornelius shot with silver; Vivian claims title of Heir","belligerents":{"attackers":{"name":"Green T & Archie Miser","factionId":null,"commander":"Green T (the absolute LEGEND)"},"defenders":{"name":"Onyx Hand / Vampire Lords","factionId":"onyx_hand","commander":"Orangus Cornelius"}},"casualties":{"attackers":"Usk (finger severed by Archie as proof of loyalty — Waluigi has FEELINGS about this)","defenders":"Orangus Cornelius (shot with silver bullet by Green T)"},"summary":"The Shadow Estate dinner party—a horrifying vampiric social ritual where guests were forced to vote on who would be killed—ended when Green T pulled a gun loaded with silver bullets from the CHILDREN'S TABLE and shot the head vampire lord. Archie had to cut off Usk's finger to maintain his cover. Vivian revealed himself and claimed the Heir title. Bowser breathed fire at vampires. People jumped through windows. Waluigi was stuck in the FEYWILD during all of this and he is DEVASTATED he missed it because it sounds like the greatest moment of the entire campaign.","description":"Waluigi was not at this battle. Waluigi was in the Feywild negotiating with a fairy countess about whether shadows count as personal property. So everything in this account comes from Archie, Green T, and Bowser, each of whom tells the story differently depending on who's buying the drinks.\\n\\nArchie's version emphasizes the political complexity and his masterful navigation of vampiric social dynamics. Green T's version emphasizes the part where he shot a vampire. Bowser's version emphasizes fire. Waluigi has attempted to combine these accounts into something coherent while noting that he trusts approximately forty percent of what Archie says, eighty percent of what Green T says, and one hundred percent of what Bowser says because Bowser is too straightforward to lie convincingly.\\n\\nThe dinner itself was a formal affair in the Shadow Estate's dining hall. Candelabras. Elaborate place settings. Food that the vampire hosts couldn't eat but served to their living guests as a gesture of either hospitality or mockery—and with vampires, those words might mean the same thing. The vampires sat at the head of the table looking ELEGANT and IMMORTAL and HUNGRY in a way that had nothing to do with the food.\\n\\nArchie attended as 'Darman Knightly,' the fake identity he'd constructed to survive Shadow Estate politics. Maintaining this cover meant suppressing every natural Archie instinct—no fireballs, no arguments with authority, no setting things on fire when conversations got uncomfortable. By all accounts, the effort was ENORMOUS. Archie pretending to be a calm, reasonable person is like Waluigi pretending to be SHORT. The disguise only holds if nobody looks too closely.\\n\\nGreen T had been placed at the CHILDREN'S TABLE.\\n\\nThe children's table. The vampire lords dismissed Green T—a man who can transform into a giant, who survived the destruction of the Tea Leaf Syndicate, who was dragged through a mirror dimension and came back—as a minor figure not worthy of the adults' table. They sat him with whatever children or subordinates attend vampire dinner parties.\\n\\nThis was their mistake. Their CATASTROPHIC mistake. Because Green T used the insult as cover. While the vampires focused on Archie's diplomatic performance at the main table, Green T spent the dinner observing. The room's layout. The exits. The guard positions. The load-bearing social dynamics. He sat at the children's table eating whatever they served and PLOTTING, and nobody watched him because nobody watches the children's table.\\n\\nWaluigi loves this. Waluigi loves EVERYTHING about this. The arrogance of the vampires dismissing someone to the children's table. The patience of Green T sitting there planning violence. The irony of the greatest threat in the room being the one they didn't think was important enough to watch. This is why you NEVER underestimate people. Waluigi knows this because Waluigi has been underestimated his ENTIRE LIFE and look what he's accomplished.\\n\\n**The Vote**\\nThe dinner's true purpose emerged during the final course. The vampire lords announced a tradition: a vote among the guests to determine which attendee would be killed.\\n\\nJust—a VOTE. To decide who DIES. Over dessert.\\n\\nThe vote was mandatory. Refusing to participate meant you were volunteering yourself. Each guest had to name someone, and the person with the most votes would be taken. The vampires presented this with the casual formality of someone suggesting after-dinner charades, except instead of charades it was MURDER and instead of fun it was HORRIFYING.\\n\\nWaluigi has been to some bad dinner parties. Waluigi has been to dinners where the food was terrible, where the conversation was awkward, where Wario told the same story about his garlic investments for the FIFTH time. But Waluigi has never been to a dinner where the dessert course included voting for someone's execution. The Corvinarus family's social calendar operates on a different moral plane than anything Waluigi has previously encountered, and that plane is BAD.\\n\\nArchie, maintaining his Darman cover, voted for the Archivist. Waluigi has thought about this choice extensively and he still can't decide if it was calculated survival or panicked finger-pointing. With Archie, the honest answer is probably 'yes to both simultaneously.' The man operates on instincts that he rationalizes afterward, and his instincts said 'vote for someone other than myself,' which is logical if morally questionable.\\n\\n**The Finger**\\nTo prove his loyalty to the vampire lords—because apparently voting for someone's death wasn't ENOUGH proof—Archie was required to sever Usk's finger.\\n\\nUsk. An ally. Someone who had fought beside Archie. Trusted Archie. And Archie was told: cut off his finger, or your cover is blown, and blown covers mean blown EVERYTHING.\\n\\nArchie did it.\\n\\nWaluigi has complicated feelings about this. On one hand, Archie was in an impossible situation. The cover was keeping him alive. Dropping the cover meant death—not just his death but potentially everyone's death. The finger was the price of survival, and in war, prices like that get paid.\\n\\nOn the other hand: he cut off a friend's FINGER.\\n\\nYou can rationalize it. You can explain the tactical necessity. You can argue there was no other choice. But at the end of the day, Usk is missing a finger and Archie is the one who took it, and no amount of strategic justification changes the fact that trust, once cut, doesn't grow back any more than the finger does.\\n\\nWaluigi has been betrayed before. Waluigi has been left off team rosters, excluded from parties, forgotten by people he thought were friends. But nobody has ever cut off Waluigi's finger to impress a vampire, and if they DID, Waluigi would have a hard time hearing their apology over the sound of his MISSING FINGER.\\n\\nThe look on Usk's face, according to witnesses, was not the look of someone who understood tactical necessity. It was the look of someone who had just learned something terrible about someone they thought they knew. Waluigi wonders if Usk and Archie have spoken since. Waluigi wonders what that conversation would even sound like. 'Sorry about the finger, but you understand, there were vampires'? Some things don't have adequate apologies.\\n\\n**The Shot Heard Across the Shadowfell**\\nGreen T chose the moment of maximum chaos—everyone reeling from the vote, from Archie's gruesome loyalty demonstration, from the casual monstrousness of vampire dinner traditions—to act.\\n\\nHe stood up from the children's table.\\n\\nHe produced a firearm.\\n\\nWaluigi needs to address the question everyone asks: HOW did Green T smuggle a gun into a vampire dinner party? Waluigi has asked Green T this directly. Green T smiled and changed the subject. Waluigi respects a man who keeps his methods private. Waluigi ALSO keeps his methods private, mostly because people react badly when Waluigi explains his methods.\\n\\nThe gun was loaded with SILVER bullets. Silver. The one material that vampires cannot shrug off. The one weakness in their immortal, arrogant, dinner-party-hosting, children's-table-assigning aristocratic existence. And Green T had brought it to dinner in his pocket.\\n\\nHe aimed at Orangus Cornelius—senior vampire lord, Onyx Hand authority figure, centuries-old undead aristocrat who had survived wars and revolutions and the collapse of empires—and fired.\\n\\nThe bullet hit.\\n\\nThe CHILDREN'S TABLE shot the HEAD VAMPIRE.\\n\\nWaluigi WISHES he could have seen Orangus Cornelius's face. The expression of a vampire lord who has spent centuries being the most dangerous person in every room, realizing that the LEAST important guest just put a silver bullet in him. The moment of comprehension. The fraction of a second between 'this cannot be happening' and 'this is absolutely happening.'\\n\\nWaluigi would pay—would pay ACTUAL COINS—for a painting of that moment. He would hang it in his bedroom. He would hang it EVERYWHERE. He would commission MULTIPLE paintings in different artistic styles. Impressionist Orangus getting shot. Cubist Orangus getting shot. One of those paintings made entirely of dots, showing Orangus getting shot. The artistic possibilities are ENDLESS.\\n\\n**Vivian's Revelation**\\nIn the middle of the chaos—because this story apparently did not have ENOUGH going on—the thrall known as 'Vivesna' chose this moment to make a revelation. Vivesna was actually Vivian. Male, not female as the vampires had believed. And Vivian claimed the title of Heir to the Corvinarus line.\\n\\nDuring a gunfight. At a dinner party. In the Shadowfell. After someone just shot the host.\\n\\nThe TIMING. Waluigi appreciates dramatic timing more than almost anyone—Waluigi has spent his entire life perfecting dramatic timing—and even HE thinks Vivian's reveal was a masterclass. You wait for the exact moment when everyone is too busy dodging silver bullets to process what you've just said, and you claim a hereditary title. By the time the vampires recovered enough to object, the claim was already on the record. Brilliant. Insane. Possibly both.\\n\\nVivian had apparently been hiding in plain sight for—how long? Years? Decades? Time gets weird with vampires. However long it was, Vivian had maintained a false identity within the Corvinarus household, waiting for the right moment to reveal the truth. And the right moment, apparently, was 'immediately after Green T shoots the senior lord with silver.'\\n\\nWaluigi respects the audacity. Waluigi questions the sanity. Waluigi acknowledges that, in the vampire world, audacity and sanity might be less distinguishable than they are elsewhere.\\n\\n**The Escape**\\nArchie and Green T made for the nearest window. Not the nearest DOOR—the nearest WINDOW. They went through it—glass, frame, decorative molding, and all—and landed in the rose garden below.\\n\\nWaluigi has jumped through a lot of windows in his career. Party exits, sports mishaps, that one incident at Wario's house that nobody talks about. He knows from experience that rose bushes are NOT ideal landing surfaces. They have thorns. The thorns go through clothing. The landing is undignified. You spend the next week finding thorns in uncomfortable places.\\n\\nBut rose bushes are significantly better than a room full of angry vampires, so Waluigi supports the decision. Strategic window exit is a valid tactical choice when the alternative is being eaten by immortal aristocrats.\\n\\nBowser stayed. Because Bowser is BOWSER. Bowser does not fit through windows. Bowser does not flee from fights. Bowser does not understand the concept of tactical withdrawal. What Bowser DOES understand is fire, and he employed that understanding generously.\\n\\nBowser breathed fire at the vampire lords.\\n\\nNow, the Shadowfell suppresses MAGICAL fire. Archie's fire spells were useless in this plane—the dimensional physics simply wouldn't allow it. But Bowser's fire isn't magical. Bowser's fire is BIOLOGICAL. It comes from his gut, not his spellbook. And the Shadowfell, apparently, cannot suppress the fire of a giant turtle dragon who is genetically MADE of fury.\\n\\nThe distinction between magical fire and biological fire is academic in most situations. In THIS situation, it was the difference between 'helpless against vampires' and 'BREATHING FIRE AT VAMPIRES WHILE YOUR FRIENDS ESCAPE THROUGH A WINDOW.' Bowser's flames bought time. They created chaos. They forced the vampire lords to deal with a fire-breathing dinosaur in their dining room instead of pursuing the people who had just shot their leader and dived into the rosemary.\\n\\n**The Rose Garden**\\nArchie and Green T landed in the Shadow Estate's rose garden—a monochrome nightmare of grey roses and black thorns that had clearly been designed by someone who thought 'cheerful' was a disease. The garden provided temporary cover but not safety. Vampire thralls were mobilizing. The lords who weren't currently on fire were organizing pursuit.\\n\\nThe escape from the garden to the estate's perimeter involved more running than fighting—moving fast through hedge mazes and ornamental arrangements while pursuers closed from multiple directions. Green T's knowledge of the estate's layout, gathered during his time at the children's table, proved invaluable. He'd mapped the exits. He'd identified the guard positions. He'd done reconnaissance while everyone assumed he was eating appetizers and feeling sorry for himself.\\n\\nThe lesson here is one Waluigi has known his entire life: never dismiss anyone. The person you think is least important might be the one who destroys everything you've built. Green T was seated at the children's table because the vampires thought he didn't matter. Green T shot their leader because they gave him time to plan. Arrogance is expensive. The vampires paid in silver.\\n\\n**Bowser's Exit**\\nBowser eventually extracted himself from the dining hall through a combination of fire, physical force, and what witnesses described as 'enthusiastic property damage.' The wall he exited through reportedly did not survive the experience. Neither did several pieces of furniture, two decorative pillars, and a portrait of some Corvinarus ancestor who probably deserved it.\\n\\nBowser rejoined the others outside the estate proper, and the group made for the dimensional boundary that would eventually allow return to the physical plane. The pursuit continued but grew disorganized—the vampires were dealing with injuries, succession chaos, and the basic question of what had just happened to their nice dinner party.\\n\\nWaluigi wasn't there. Waluigi was in the Feywild arguing with a mushroom about property rights. But hearing about this afterward—Green T at the children's table, the silver bullet, the window escape, Bowser breathing biological fire at immortal aristocrats—Waluigi felt something he doesn't feel often.\\n\\nHe felt PROUD. Proud of his allies. Proud of Green T's patience and courage. Proud of Bowser's unmovable stubbornness. Even grudgingly proud of Archie, who kept a cover alive long enough for the moment to matter, even if the price was a friend's finger.\\n\\nWaluigi missed the greatest dinner party exit in the history of dinner parties, and that will bother him for the rest of his life. But knowing it HAPPENED—knowing that the people Waluigi fights alongside are capable of THAT—makes Waluigi feel like maybe being on this team isn't the cosmic insult he usually considers it to be.\\n\\nMaybe.\\n\\nDon't tell anyone Waluigi said that. WAH.","aftermath":"Orangus Cornelius took a silver bullet, which for a vampire lord is considerably worse than a regular bullet—silver wounds don't heal the way normal damage does, and the metaphysical implications within the Corvinarus power structure were severe. A wounded patriarch is a vulnerable patriarch, and vampire politics does not treat vulnerability kindly. Factions within the Onyx Hand began positioning themselves to take advantage before the blood from the gunshot had even dried.\\n\\nVivian's claim to the Heir title threw the family's succession into chaos, creating fractures within the Onyx Hand that multiple parties would attempt to exploit. A legitimate heir emerging from the thrall population raised questions about bloodline, about who else might be hiding in plain sight, about the entire social order the Corvinarus had maintained for centuries. The claim couldn't be ignored, and it couldn't be easily dismissed.\\n\\nThe Shadow Estate dinner marked the absolute end of any diplomatic pretense between the party and the vampire lords—from this point forward, the relationship was pure hostility. The vampires had been shot, embarrassed, set on fire, and had their walls broken. These are not injuries that immortal aristocrats forgive. Ever.\\n\\nArchie's severing of Usk's finger remained an open wound—figuratively and literally—in the party's internal trust. Some costs cannot be justified retroactively. Some debts cannot be repaid. Archie maintained his cover and probably saved lives, but he did it by maiming someone who trusted him, and that mathematics doesn't balance cleanly.\\n\\nGreen T's reputation reached legendary status. A man who had survived the destruction of his criminal empire, been dragged through a mirror dimension, escaped the Deep Mirror, and then shot a vampire lord with silver from the children's table was not someone anyone would underestimate again. Green T proved that dismissal is dangerous. He proved that patience and planning can defeat age and power. He proved that sometimes the most important person in the room is the one you're ignoring.\\n\\nBowser's fire proved that the Shadowfell's anti-magic properties had limits, which would inform tactical planning for any future operations in the plane. Biological abilities function where magical ones don't. This is useful information for anyone planning Shadowfell incursions, though Waluigi hopes he never needs it.\\n\\nAnd Waluigi, stuck in the Feywild, heard about all of it secondhand and experienced the unique agony of knowing he missed the single coolest thing any of his friends had ever done. Every version of the story he's heard has been slightly different. Every retelling has added details or embellished moments. By now, the legend of the dinner party assassination has probably grown beyond the actual event.\\n\\nWaluigi doesn't mind. Some stories deserve to grow. Some moments deserve to become legends. Green T shooting Orangus Cornelius from the children's table is one of those moments, and Waluigi will tell that story at every opportunity, adding his own embellishments, making sure the world knows what happened at the Shadow Estate.\\n\\nBecause the world SHOULD know. The world should know that arrogance has consequences. The world should know that the person you dismiss might be the person who destroys you. The world should know that Waluigi's allies are MAGNIFICENT, even when Waluigi isn't there to see it.\\n\\nWAH!","relatedArticles":["shadow_estate","planar_fracture","onyx_hand","corvinarus_family","green_t","archie_miser"]}]`);function Sn({articleId:A,navigate:_,children:L,className:c}){const M=Yo.find(x=>x.id===A),O=Vo.find(x=>x.id===A),k=Ko.find(x=>x.id===A),j=An.find(x=>x.id===A);let E=null,b=A;return M?(E={type:"article",articleType:"faction",id:A},b=M.name):O?(E={type:"article",articleType:"character",id:A},b=O.name):k?(E={type:"article",articleType:"location",id:A},b=k.name):j&&(E={type:"battle",id:A},b=j.name),E?l.jsx("a",{href:"#",onClick:x=>{x.preventDefault(),_(E)},className:c,style:{color:"#5B2C8E"},title:`Go to ${b}`,children:L||b}):l.jsx("span",{className:c,children:L||b})}function Fo({ids:A,navigate:_}){return l.jsx(l.Fragment,{children:A.map((L,c)=>l.jsxs("span",{children:[l.jsx(Sn,{articleId:L,navigate:_}),c<A.length-1&&" · "]},L))})}function wf(A,_){return A.split(`
