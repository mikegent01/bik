ee_manor",excerpt:"Raventree Manor is a architectural disaster that exists in three places at once, which is very confusing for real estate value. It has a 'Shadow' version (too dark), a 'Feywild' version (too many plants), and a 'Material' version (full of ghosts). I got stuck in a bear trap here! 0/5 Stars. Would not loot again."},yy=["...that Archie Miser calls himself 'Darman Knightly' in the Shadowfell? It's the stupidest name I've ever heard. Also, he cut off a guy's finger!","...that the Airship was full of Toads in barrels? The Iron Legion calls it 'Trafficking,' Wario calls it 'Efficient Packaging.' Potay-to, Potah-to.","...that the Dragon War is a total scam? The Empire uses sound waves to fake it! I respect the hustle, but they owe me royalties for the idea.","...that Green T shot a Vampire Lord at dinner? Very rude! I hadn't even finished stealing the silverware yet!","...that Markop turned into a giant to wrestle a spider? Show-off! I was casting ice magic to help, but nobody clapped for me!","...that I froze Eager solid with a 'Cone of Cold'? It wasn't an accident, it was 'Cryogenic Preservation'! He should thank me!","...that Hjumpik smashed our airship with an axe? Who gives an axe to a guy with anger issues?! Now we have to walk!","...that Wario priced a Star Rod at 900 trillion coins? That is a very fair market price. No low-ball offers! I know what I have!","...that the Oracle keeps bodies in tanks? Disgusting! Science is for nerds who can't get rich honest ways (like stealing).","...that Wario gave Remi a bomb as a welcome gift? It's called 'Initiation'! If she can't survive an explosion, she can't work in customer service!"],gy=["955 BF — Princess Peach takes a permanent nap. Everyone is still crying about it. Get over it!","1035 BF — The Iron Legion starts ruining everyone's fun with 'laws' and 'taxes'.","1040 BF — We killed a dragon! Well, *they* did, but I provided moral support (and looted the hoard).","1040 BF — The Planar Fracture happens. ted_toads","name":"Liberated Toads","title":"Survivors of the Vigilance","type":"Refugee / Resistance Faction","status":"Active but under severe pressure","affiliation":"Loosely aligned with anti-Legion forces","summary":"A loose community of freed toads struggling to survive trafficking, infiltration, and constant attacks. They are divided between caution, revenge, and the need to hold themselves together under impossible circumstances.","description":"The Liberated Toads emerged as a major faction after the discovery that over 150 trafficked toads were hidden individually in barrels across the Vigilance. Since then, they have dealt with internal sabotage, outside manipulation, and repeated attacks by the Iron Legion and other hostile groups.\\n\\nLeadership inside the faction is unstable. Dan regained influence after the Scavenging Doctrine vote, pushing safer and more collective survival strategies, while harder-line voices argue for bolder action. Despite being poorly armed and often caught in larger conflicts, the faction has become central to the moral stakes of the campaign: trafficking, exploitation, and whether ordinary people can survive the ambitions of empires, syndicates, and mages.","keyEvents":["barrel_secret_revealed","scavenging_doctrine_vote","betrayal_on_the_airship","dinner_that_broke_time"],"relatedArticles":["toad_trafficking","vigilance","dan_the_toad"]},{"id":"iron_legion","name":"Iron Legion","title":"The Midlands War Machine","type":"Military State / Imperial Power","status":"Expanding emergency authority","affiliation":"Regal Empire / Midlands state apparatus","summary":"A former mercenary force that evolved into one of the dominant powers of the age. Ruthless, bureaucratic, and highly adaptable, the Iron Legion is now using legal mandates and military force to purge enemies and consolidate control.","description":"The Iron Legion rose in the Midlands as a mercenary company and transformed into a state superpower. In the present era, it acts as both army and political engine, using spies, boarding actions, false flags, interrogation, and emergency law to dominate events.\\n\\nIts agents have repeatedly targeted the Vigilance, pursued hidden agendas aboard the ship, infiltrated rival groups, and manipulated the manor crisis. The passage of the Iron Mandate granted the Legion sweeping powers to purge supernatural threats, dramatically escalating conflict across the region. Its internal discipline, intelligence network, and willingness to exploit chaos make it one of the greatest threats in the setting.","keyEvents":["rise_of_the_iron_legion","legions_ruse","iron_sky_breach","iron_mandate_enacted","massacre_at_aegis_command"],"relatedArticles":["general_ironhand","aegis_command","supernatural_sovereignty_act"]},{"id":"pond_patrol","name":"Pond Patrol","title":"Order, Containment, Apprehension","type":"Paramilitary / Investigative Faction","status":"Militarized and radicalizing","affiliation":"Speaker L","summary":"A toad-led enforcement faction focused on containment, investigation, and survival in a collapsing world. Once procedural and restrained, it is becoming harder and more vengeful after infiltration, massacre, and repeated betrayal.","description":"The Pond Patrol operates as a disciplined toad-led force under Speaker L. It has taken an increasingly central role in events around Raventree Manor, intelligence gathering, and responses to Iron Legion actions. The faction values accountability and structure, but the scale of recent atrocities has pushed it toward harsher methods.\\n\\nAfter the Green Decoy incident and the massacre at Aegis Command, Speaker L became notably more ruthless, vowing to hunt impostors and enemies with uncompromising force. The Patrol now balances genuine protective instincts with a growing culture of siege mentality and revenge.","keyEvents":["standoff_at_raventree_manor","siege_of_raventree","pond_patrol_intelligence","speaker_ls_vow"],"relatedArticles":["speaker_l","green_decoy","aegis_command"]},{"id":"mages_guild","name":"Mages' Guild","title":"Custodians of Arcane Order","type":"Arcane Institution","status":"Influential, divided, and morally compromised","affiliation":"Independent magical authority","summary":"A powerful magical institution attempting to control dangerous knowledge, investigate anomalies, and preserve its own authority. It is deeply entangled in surveillance, containment, planar instability, and questionable experimentation.","description":"The Mages' Guild presents itself as a stabilizing force, but its conduct reveals a more complicated reality. It has clashed with Archie Miser, investigated ghost phenomena, tracked assets with magical badges, maintained null cages, and involved itself heavily in the Raventree crisis.\\n\\nGuild operatives such as Agent L are practical and sometimes heroic, yet the institution as a whole often treats people as variables in magical containment problems. It is studying planar instability even when doing so may worsen conditions on the ground. The faction is valuable, dangerous, and not entirely trustworthy.","keyEvents":["underworld_politics","archies_confession","agent_l_devices","agent_l_guild_encrypted_talk"],"relatedArticles":["agent_l","null_cage","planar_fracture"]},{"id":"peach_loyalists","name":"Peach Loyalists","title":"The Ruthless Restorationists","type":"Political-Military Faction","status":"Resurgent and uncompromising","affiliation":"Princess Peach's legacy","summary":"A hardline faction committed to uncovering the truth of Princess Peach's death and restoring her cause. Their methods are increasingly brutal, and their victories are beginning to redefine them as feared zealots rather than noble loyalists.","description":"The Peach Loyalists are driven by the assassination of Princess Peach and the unresolved secrets surrounding her death. Scouts such as Embercap and Mistveil continue to pursue hidden leads, including revelations tied to Peach's private chambers and past relationships.\\n\\nMilitarily, the faction has shown extreme ruthlessness. The fall and capture of Bramblehaven cemented their reputation for refusing quarter and executing surrendering enemies. They are effective, ideologically driven, and increasingly willing to commit atrocities in pursuit of their version of justice.","keyEvents":["princess_is_dead","secrets_at_the_gala","fall_of_bramblehaven","capture_of_bramblehaven"],"relatedArticles":["princess_peach","captain_toadette","bramblehaven"]},{"id":"wario_enterprise","name":"Wario's Enterprise","title":"Profit Over Reality","type":"Criminal-Commercial Venture","status":"Thriving in chaos","affiliation":"Wario and Waluigi","summary":"A self-serving treasure, debt, and opportunity cartel operating wherever disorder creates profit. Unreliable as allies but extremely effective at improvisation, theft, demolition, and opportunistic logistics.","description":"Wario's Enterprise is one of the strangest but most resilient factions in the setting. It combines looting, mercenary opportunism, contraband, absurd accounting, and theatrical destruction into a surprisingly durable business model.\\n\\nIts members have stolen valuable tomes, weaponized bombs as gifts, maintained debt ledgers on major figures, and repeatedly inserted themselves into major crises for money or loot. Though often comic in style, the faction has real influence because it can move quickly, adapt instantly, and profit from situations that collapse more rigid organizations.","keyEvents":["explosive_proposition","tome_heist","warios_infinite_catalogue","merchant_of_chaos","wario_vs_bramblefly"],"relatedArticles":["wario","waluigi","debt_ledger"]},{"id":"onyx_hand","name":"Onyx Hand","title":"The Night Court","type":"Vampiric Power Bloc","status":"Threatened but active","affiliation":"Shadowfell nobility","summary":"A shadowy vampire-aligned faction with legal, social, and predatory power. It operates through tribunals, dinner politics, hostage etiquette, and old aristocratic violence.","description":"The Onyx Hand blends criminal authority, supernatural influence, and aristocratic ritual. It first appears in direct political relevance through the acquittal of Archie Miser by an Onyx Hand tribunal, angering the Mages' Guild. Later, in the Shadowfell reflection of the manor, its members host formal dinners where status, blood, and murder are negotiated at the same table.\\n\\nThough elegant on the surface, the faction is dangerous and unstable, especially under pressure from anti-supernatural laws and succession struggles within the Corvinarus-linked household. It remains one of the major supernatural powers in the campaign.","keyEvents":["underworld_politics","dinner_with_the_damned","shadow_estate_dinner","dinners_climax_vote"],"relatedArticles":["orangus_cornelius","supernatural_sovereignty_act","shadowfell"]},{"id":"tea_leaf_syndicate","name":"Tea Leaf Syndicate","title":"The Broken Tea Table","type":"Criminal Syndicate","status":"Shattered","affiliation":"Green T and former underworld networks","summary":"An underworld organization whose influence aboard the Vigilance collapsed in spectacular violence. Though its formal power base has been broken, its surviving members still affect the wider conflict.","description":"The Tea Leaf Syndicate was a notable criminal power before a chain of disasters broke its strength. Its attempted dealings with Archie Miser spiraled into the infamous Tea Party Incident, and later confrontations aboard the Vigilance devastated its remaining muscle and command structure.\\n\\nGreen T survived and remains personally dangerous, but the faction as a stable organization is no longer what it was. It now functions more as scattered survivors, grudges, and half-collapsed networks than a coherent syndicate.","keyEvents":["tea_party_incident","syndicate_showdown","green_ts_rebellion"],"relatedArticles":["green_t","earl_grey","vigilance"]},{"id":"corvinarus_house","name":"House Corvinarus","title":"The Fractured Manor Line","type":"Ancient Supernatural House","status":"Contested across multiple realities","affiliation":"Orangus, Aurelian, the Oracle, and competing heirs","summary":"An ancient lineage tied to Raventree/Shadeward Manor, planar instability, succession conflict, forbidden research, and the collapse of local reality. Different branches or reflections of the house appear across multiple dimensions.","description":"House Corvinarus is at the center of the planar crisis. Its members or reflections include Orangus Cornelius in the Shadowfell, Aurelian in the Feywild, and the Oracle-like researcher tied to the ruined manor and the failed synchronization rite. The line is entangled with old experiments, dragon-linked rituals, inheritance struggles, and a reality-breaking system of mirrored estates.\\n\\nThe faction is not unified. It is a family, a metaphysical structure, and a succession war all at once. Anyone trying to survive the manor crisis must eventually deal with Corvinarus politics, whether through diplomacy, sabotage, ritual repair, or murder.","keyEvents":["many_oracles_revealed","shattered_ritual","heir_of_rot","vision_of_the_grafting","dinners_climax_vote"],"relatedArticles":["raventree_manor","orangus_cornelius","aurelian_corvinarus"]}]`),Zi=JSON.parse(`[{"id":"archie_miser","name":"Archie Miser","title":"The Third-Eyed Arsonist","race":"Unknown (Humanoid with Third Eye)","status":"Missing / Displaced Across Planes","affiliation":"Independent (formerly Liberated Toads)","summary":"A volatile battle-mage whose reliance on fire magic is matched only by his paranoia. Archie is the central figure of the Planar Fracture, targeted by the Iron Legion for his 'Third Eye' and hunted by the Mages' Guild for his unstable magic. He was last seen stepping through a portal opened by a Purple Toad fortune teller.","description":"Archie Miser is a study in escalation. Acquitted of killing a mage by an Onyx Hand tribunal on Day 2, he quickly became a liability to his allies and a terror to his enemies. His magical signature is defined by excessive force, most notably the 'Tea Party Incident' where he incinerated a room of syndicate enforcers, and the 'Greenhouse Inferno' at Raventree Manor, an act he confessed to on Wahbook to 'control the narrative.'\\n\\n**The Third Eye & Paranoia:** Archie possesses a functioning third eye on his forehead, a trait that has drawn the attention of forbidden necromancers. During the 'Blue Dragon's Bargain,' he encountered a two-eyed clone of himself created by the Iron Legion, which sought to harvest his eye to complete itself. This trauma led Archie to craft a 'Brass Circlet' inscribed with the mantra: 'The eye sees across – the band keeps me from falling in.'\\n\\n**The Shadowfell & 'Darman Knightly':** When the Planar Fracture occurred, Archie was cast into the Shadowfell. Stripped of his fire magic by the plane's entropy, he survived by adopting the persona of 'Darman Knightly,' a flamboyant adventurer. At a dinner party hosted by the Vampire Lords, he successfully bluffed his way through high-stakes social deduction, though he was forced to sever the prisoner Usk's finger to prove his loyalty—a grim act of pragmatism.\\n\\n**The End of the Line:** After escaping the Shadowfell, Archie was 'rescued' by Agent L (Luigi) of the Mages' Guild. He spent his final known hours clearing ghosts from the manor with a vacuum device, only to be billed 2,062 gold pieces for a broken rope. Physically exhausted and magically drained, he was cornered by a Purple Toad Fortune Teller who sang 'Shuffle the Deck' before opening a portal. Archie stepped through, vanishing from the timeline.","keyEvents":["tea_party_incident","greenhouse_inferno","dinner_climax_vote","purple_toad_fortune"],"relatedArticles":["mages_guild","raventree_manor","iron_legion"]},{"id":"hjumpik","name":"Hjumpik","title":"The Walker of the Maze","race":"Dwarf (Presumed)","status":"Alive — Active in Feywild","affiliation":"The Party (De Facto Leader)","summary":"The pragmatic core of the party, Hjumpik is a warrior-diplomat who navigates the insanity of the Feywild with a warhammer in one hand and a magical flower-sword in the other. He is currently burdened with the knowledge of the Corvinarus bloodline's dark origins.","description":"While others in the party succumb to chaos, Hjumpik attempts to harness it. He first gained notoriety during the 'Syrup Schism' by physically hacking the Vigilance's power core with an axe to prevent a mutiny, sending the airship into a nose-dive. This decisiveness defined his role during the Raventree Manor Crisis.\\n\\n**Feywild Diplomacy:** Cast into the Feywild reflection of the manor, Hjumpik acted as the handler for the chaotic duo of Waluigi and Toad Lee. He negotiated a tense truce with a Hag (using a rock to trigger her bear trap), broke his allies out of cages, and secured sanctuary in a Sprite-guarded greenhouse.\\n\\n**The Morning Glory & The Duel:** Hjumpik wields the 'Morning Glory,' a two-handed weapon that blooms into a steel blade in sunlight. He used this to defeat Guard-Captain Thistle in single combat under the Dreaming Tree. Despite Rakasha's attempt to melt the Captain with wild magic, Hjumpik showed mercy, cementing his reputation as honorable.\\n\\n**The Grafting Vision:** Hjumpik is the sole bearer of the truth regarding the Corvinarus line. After touching a statue in the manor, he witnessed a vision from 988 BF: an orange-robed figure cutting their palm over a screaming dragon egg. This 'Grafting' created the sorcerous bloodline that rules the manor, a secret the Archmage Perrius Annmatar has ordered him to kill to protect.","keyEvents":["syrup_schism","duel_dreaming_tree","vision_grafting","hags_hut_heist"],"relatedArticles":["morning_glory","corvinarus_family","waluigi"]},{"id":"green_t","name":"Green T","title":"The Giant-Killer","race":"Toad (Mutated)","status":"Missing (Last seen in Shadowfell)","affiliation":"Independent (formerly Tea Leaf Syndicate)","summary":"A former crime boss turned revolutionary, Green T possesses the ability to grow to giant size. After his criminal empire was destroyed, he became a key player in the Shadowfell, orchestrating the assassination of the Vampire Lord Orangus Cornelius.","description":"Green T's trajectory is one of survival. As leader of the Tea Leaf Syndicate, he ruled the Vigilance's underworld until the 'Syndicate Showdown,' where his enforcer Earl Grey was killed and his organization shattered. In that battle, he revealed his ability to grow to a colossal size, crushing an Iron Legion soldier in a single blow.\\n\\n**The Shadowfell Rebellion:** Pulled into a mirror dimension during the siege, Green T re-emerged in the Shadowfell as a 'guest' at the Vampire Lord's dinner, forced to sit at the children's table. While Archie played the diplomat, Green T plotted violence. He communicated his plan via a napkin drawing (using ketchup) depicting 'Kill Vampires' and 'Unleash the Beast.'\\n\\n**The Silver Bullet:** During the dinner's climax, Green T signaled the attack by kicking over the table. Using a stolen flintlock pistol loaded with a silver bullet, he shot Orangus Cornelius, shattering the diplomatic veneer and triggering the final chaotic brawl. He was last seen escaping through a window with Archie, having handed Markop a mysterious key that may unlock the secrets of the manor's timeline.","keyEvents":["syndicate_showdown","dinner_climax_vote","green_t_lost"],"relatedArticles":["tea_leaf_syndicate","shadowfell","iron_legion"]},{"id":"the_oracle","name":"The Oracle / Orangus Cornelius","title":"The Fractured Host","race":"Unknown (Shapeshifter/Construct)","status":"Fractured / Multiple Simultaneous Existences","affiliation":"House Corvinarus","summary":"The Oracle is not a single person, but a fractured entity existing across multiple timelines. Whether appearing as the benevolent host 'The Oracle' or the vampiric lord 'Orangus Cornelius,' he is the architect of the Planar Convergence and a practitioner of forbidden bio-mancy.","description":"The entity known as the Oracle is the source of the temporal rot afflicting Raventree Manor. In the physical realm, he appeared as a helpful guide, using a 'Star Shard' (a crystalline gift from the Toad God) to aid the party against the Arachnid Matriarch. However, this benevolence masked a darker truth.\\n\\n**The Necromancer:** In the Deep Mirror dimension, Markop and Remi discovered the Oracle's 'Clockwork Room' and a hidden laboratory filled with tanks of malformed humanoids. The Oracle was revealed to be researching 'The Grafting'—the fusion of mortal and dragon blood—attempting to stabilize his own fractured existence.\\n\\n**Orangus Cornelius:** In the Shadowfell, the Oracle manifests as Orangus Cornelius, a vampire lord who rules the 'Shadow Estate.' This version is cruel, decadent, and obsessed with 'The Revel,' a gluttonous feast of corpses. It was Orangus who presided over the dinner party where Archie and Green T launched their assassination attempt.\\n\\n**The Failed Ritual:** The Oracle's ultimate goal was a 'Synchronization Rite' to merge the physical, mirror, and shadow planes. This ritual catastrophically failed on Day 21 due to the party's interference, shattering local reality and trapping the Oracle(s) in a loop of trying to repair the timeline by killing his other selves.","keyEvents":["planar_fracture","spider_grove_battle","many_oracles_revealed"],"relatedArticles":["raventree_manor","star_shard","corvinarus_family"]},{"id":"speaker_l","name":"Speaker L","title":"The Vengeful Voice","race":"Toad","status":"Alive — Radicalized / Rogue","affiliation":"Pond Patrol (The First Cohort)","summary":"Once a by-the-book intelligence officer, Speaker L has been radicalized by the theft of his identity and the massacre of his people. He now leads the Pond Patrol on a ruthless hunt for the 'Green Decoy' and Archie Miser, guided by a grim new war anthem.","description":"Speaker L was the lawful head of the Liberated Toads' intelligence wing until the 'Aegis Command Massacre.' While Speaker L was imprisoned, a 'Green Decoy' wore his face and authorized 'Order 120'—the execution of all Toad prisoners. This violation shattered Speaker L's faith in protocols.\\n\\n**The Radicalization:** Upon his escape/rescue by Bones, Speaker L discarded his diplomatic approach. He composed a rhythmic war anthem ('Contain! Account! Apprehend!') that he now chants during operations, turning the Pond Patrol into a fanatical hunting force. He maintains a 'Black Ledger' of targets, with the imposter who stole his face at the top.\\n\\n**The Hunt for Archie:** Speaker L holds Archie Miser personally responsible for the chaos at Raventree. He personally led a stealth infiltration of the manor with Bones, utilizing a hidden hand-crossbow and advanced healing magic to bypass Legion security. During the infiltration, he displayed a new ruthlessness, prioritizing the mission over the lives of Legion guards.","keyEvents":["massacre_aegis","siege_raventree","raid_on_cohort_command"],"relatedArticles":["liberated_toads","aegis_command","green_decoy"]},{"id":"markop","name":"Markop","title":"The Titan of the Grove","race":"Human (Warrior)","status":"Alive — Active in Deep Mirror","affiliation":"The Party / Vigilance Crew","summary":"A warrior searching for his lost father, Markop is the party's moral compass and physical shield. He is best known for growing to kaiju-size to wrestle a giant spider and for his protective bond with Remi.","description":"Markop is a grounded warrior in a world of magic. His journey is driven by the search for his father, Robinson, whose photograph he recovered from the ruins of the manor's east wing. Despite his lack of magical talent, Markop has repeatedly engaged supernatural threats through sheer grit.\\n\\n**The Titan:** His defining moment occurred during the 'Battle of the Spider Grove.' Accepting a desperate blessing from the Oracle, Markop grew to a colossal size, engaging the Arachnid Matriarch in a titan-scale wrestling match that allowed his allies to banish the creature. This event earned him the title 'Titan of the Grove' in the Oracle's tarot deck.\\n\\n**The Deep Mirror:** Markop was cast into the 'Deep Mirror' dimension, a realm of decaying time and clockwork. There, he acted as the guardian for Remi, physically clearing paths through broken glass and holding back 'Mazebound' monsters. He carries 'Undead Remedy' oil on his blade, a specialized coating he used to melt the faces of the shadow-creatures attacking his friends.","keyEvents":["spider_grove_battle","maze_of_time","greenhouse_inferno"],"relatedArticles":["raventree_manor","fng_remi","robinson"]},{"id":"remi","name":"FNG Remi","title":"The Reluctant Smith","race":"Human / Unknown","status":"Alive — Active in Deep Mirror","affiliation":"Wario's Crew (Contractual)","summary":"The 'FNG' (F*cking New Guy) who survived an explosion on her first day. Remi is a smith and survivalist accompanied by 'Steely' (aka Mossy), a mechanical hound. She is currently navigating the Deep Mirror dimension while trying to fulfill a contract with Wario.","description":"Remi's introduction was a trial by fire: found in a crate on the Vigilance, she was immediately blown up by a bomb Wario disguised as a gift. Instead of fleeing, she accepted Wario's offer of employment, showing a bizarre resilience. She was later frozen solid by Waluigi in a 'Friendly Fire Incident,' yet continues to fight alongside the party.\\n\\n**The Smith:** Remi is a talented crafter. She recovered 'Web-Woven Scale Armor' from the Spider Grove and sent a formal application to the Deephold Smithing Guild in the middle of a dungeon crawl. Her companion, a mechanical construct dog named Steely (or Mossy), fights by her side, though it requires constant repair.\\n\\n**The Detective:** In the Deep Mirror, Remi has taken on an investigative role. She picked locks (breaking several picks), analyzed spent bullet casings to link Green T to the shooting, and discovered the 'Napkin Battle Plan' that revealed the party's strategy. She currently holds Wario's 'debt ledger,' giving her dangerous leverage over powerful figures.","keyEvents":["explosive_proposition","spider_grove_battle","library_ambush"],"relatedArticles":["wario","steely","deephold_guild"]},{"id":"dan_the_toad","name":"Dan the Toad","title":"The Parallel Pragmatist","race":"Toad","status":"Complicated (Parallel Active / Original Imprisoned)","affiliation":"Liberated Toads / Mages' Guild (Coerced)","summary":"A political leader whose existence is a lie. The 'Dan' currently traveling with the party is a parallel version from another timeline, while the original Dan is held in a 'Null Cage' by the Mages' Guild. He wields fire magic through a Guild-issued Blackite Wand that doubles as a tracking leash.","description":"Dan the Toad was a hero of the Vigilance liberation, but the toad currently wearing his face is an impostor from a doomed timeline. This 'Parallel Dan' confessed to Markop in the forest that he sabotaged the synchronization ritual to prevent his own timeline from being overwritten, effectively choosing his own survival over the stability of reality.\\n\\n**The Guild's Leash:** The original Dan (and by extension, the Parallel Dan who assumed his gear) was conscripted by the Mages' Guild. He wears Badge #447, which burns the skin if removed, and wields a 'Blackite Wand'—a powerful focus for fire magic that also tracks his location. Parallel Dan keeps a collection of coded notes hidden in his gear, documenting his suspicion that the Guild is using him as a disposable asset.\\n\\n**Political Shift:** Under Parallel Dan's influence, the Liberated Toads have shifted toward caution. He won the 'Scavenging Doctrine Vote' against Archie, moving the faction away from high-risk raids. He remains a wild card: a capable leader who is fundamentally serving his own existential interests.","keyEvents":["great_betrayal","scavenging_vote","parallel_dan_confession"],"relatedArticles":["mages_guild","liberated_toads","planar_fracture"]}]`),ki=[{id:"raventree_manor",name:"Raventree Manor",type:"Haunted Mess / Free Real Estate?",region:"Everywhere (It's complicated)",status:"Broken / Occupied / On Fire",owner:"Disputed (Me vs. Everyone)",summary:"A creepy mansion that exists in three places at once. Wario says we can flip it for profit if we fix the timeline. It has ghosts, vampires, fairies, and terrible plumbing.",description:`Raventree is the worst hotel I've ever stayed in. One minute you're in a nice hallway, the next you're falling into a void or getting eaten by a spider. 

**The Three Versions:**
1.  **The Ruined Dump (Material):** Full of ghosts. Archie broke the greenhouse here with a fireball. I tried to help put it out with ice magic, but they complained! Ungrateful! Now the Mages' Guild and Iron Legion are squatting here.
2.  **The Shadowfell (Goth Edition):** Everything is black and white. Boring! Vampires live here. They have nice silverware, but they bite if you try to take it. Green T shot the owner at dinner. Rude!
3.  **The Feywild (Too Much Salad):** Overgrown with plants. I fought a Hag here! She trapped me in a bear trap (cheating!), and Toad Lee had to drag me to a greenhouse. Sprites healed my leg, which hurt a lot. 

**The Clockwork Room:** Somewhere deep inside (the 'Deep Mirror'), time is broken. Markop is stuck there. He says he's 'fixing it.' I say he's wasting time he doesn't have! Wah ha ha!`,keyEvents:["me_getting_trapped","greenhouse_fire","vampire_dinner_disaster"],relatedArticles:["bad_hotels","fire_hazards","insurance_fraud"]},{id:"vigilance",name:"The Vigilance (aka The Crash Site)",type:"Airship (Formerly)",region:"The Ground (Currently)",status:"Stolen by the Fun Police",owner:"Iron Legion (Stolen from Us!)",summary:"A nice airship that we totally owned legitimately. Hjumpik smashed the engine with an axe (crazy!), and then the Iron Legion stole it and painted it purple. Hey, that's my color!",description:`This ship was great until Hjumpik decided to play lumberjack with the power core during the 'Syrup Schism.' We crashed! It was awesome, but also expensive.

**The Secret Cargo:** Turns out the ship was full of barrels with Toads inside. Wario said, 'Look, pre-packaged employees!' But the Iron Legion got mad about 'trafficking' or whatever. Boring! 

**The Theft:** On Day 20, the Legion boarded the ship while we were busy saving the world (or looting the manor, same thing). They stole it! Renamed it the 'Legionlance.' Terrible name! They fly it over the manor now, blasting propaganda. I'm going to steal it back and paint a giant 'Γ' on the side.`,keyEvents:["crashing_the_ship","hjumpik_axe_incident","legion_stealing_my_ride"],relatedArticles:["air_piracy","waluigi_symbol","crash_landings"]},{id:"mushroom_kingdom",name:"The Mushroom Kingdom",type:"Kingdom of Losers",region:"East",status:"On Fire (Civil War)",owner:"Nobody (Free for the taking!)",summary:"A place obsessed with mushrooms. Princess Peach died 100 years ago, and they're still crying about it. It's smaller than the Empire, but has better loot.",description:`This place is a mess. Everyone is fighting. 

*   **The Loyalists:** Led by Toadette. They execute people. Scary!
*   **Fawful:** Weird guy with glasses. Has robots. 
*   **DK Crew:** Monkeys. They caused a diplomatic incident because Lanky Kong acted weird at a summit. Classic Lanky! 

The Kingdom is basically a free-for-all. Wario says war is good for business. I say war is loud, but looting the battlefield afterwards is quiet and profitable.`,keyEvents:["princess_kicked_the_bucket","monkey_diplomacy_fail"],relatedArticles:["toadette","gold_coins","chaos"]},{id:"bramblehaven",name:"Bramblehaven",type:"Fortress (Ruined)",region:"Mushroom Kingdom",status:"Destroyed",owner:"Peach Loyalists",summary:"A town that got absolutely wrecked by Toadette. She took no prisoners. Remind me never to make her mad.",description:`I heard about this place. Fawful owned it. Then Toadette showed up on Day 15 and just... erased it. They executed everyone! Even the guys who surrendered! 

That's too intense, even for me. I usually just cheat at tennis or steal wallets. These guys are playing for keeps. Note to self: Sell weapons to Toadette, but do not play cards with her.`,keyEvents:["total_destruction","no_mercy"],relatedArticles:["war_crimes","scary_toads"]},{id:"aegis_command",name:"Aegis Command",type:"The Boring Fortress",region:"Midlands",status:"Active ( unfortunately)",owner:"Iron Legion",summary:"The HQ of the Iron Legion. Full of rules, regulations, and metal men. Bones tried to sneak in and got stabbed. Ouch.",description:`This is where General Ironhand lives. He has no sense of humor. 

**The Incident:** Bones sneaked in disguised as a guard. Clever! But Ironhand saw right through it and stabbed him. Not clever! 

**The Fake Toad:** They found a 'Green Decoy' pretending to be Speaker L. Ironhand got so mad he issued 'Order 120' to kill all Toads. Talk about an overreaction! He needs to relax. Maybe play some golf. I'd win, of course.`,keyEvents:["bones_getting_stabbed","general_ironhand_tantrum"],relatedArticles:["iron_legion","stabbing","bad_security"]}],An=JSON.parse(`[{"id":"fall_bramblehaven","name":"The Fall of Bramblehaven","date":"Day 15, 1040 BF","location":"Bramblehaven, Mushroom Kingdom","type":"Siege","result":"Decisive Peach Loyalist Victory","belligerents":{"attackers":{"name":"Peach Loyalists","factionId":"peach_loyalists","commander":"Captain Toadette"},"defenders":{"name":"Fawful's Forces","factionId":"fawful_forces","commander":"Unknown Garrison Commander"}},"casualties":{"attackers":"Heavy","defenders":"Near-total (survivors executed)"},"summary":"The Fall of Bramblehaven was a brutal, day-long siege conducted by Captain Toadette's Peach Loyalist forces against the Fawful-held bastion of Bramblehaven. The assault is considered one of the defining engagements of the 1040 BF conflict season.","description":"In a meticulously planned operation, Captain Toadette's Peach Loyalist forces launched a dawn assault on Bramblehaven, a key Fawful stronghold in the Mushroom Kingdom. The attack was characterized by its overwhelming ferocity—the Loyalists showed no mercy to surrendering troops, executing prisoners and leaving no quarter.\\n\\nThe battle raged for the entire day, with heavy casualties on both sides. Fawful's garrison, though well-fortified, was unable to withstand the fanatic determination of the Loyalist attackers. By nightfall, Bramblehaven had fallen.\\n\\nThe victory yielded valuable intelligence for the Loyalist cause, though the methods employed—particularly the execution of prisoners—cemented the Loyalists' reputation as ruthless fanatics. The battle sent shockwaves through the political landscape, demonstrating that the Loyalists were willing to employ total war tactics.\\n\\nThe fall of Bramblehaven significantly weakened Fawful's territorial control in the Mushroom Kingdom and emboldened other factions to challenge his remaining strongholds.","aftermath":"The capture of Bramblehaven provided the Peach Loyalists with valuable intelligence and a strategic foothold. The execution of prisoners drew international condemnation but deterred future resistance. Fawful's territorial integrity was severely compromised.","relatedArticles":["peach_loyalists","fawful_forces","mushroom_kingdom"]},{"id":"tea_party_incident","name":"The Tea Party Incident","date":"Day 9, 1040 BF","location":"Aboard the Vigilance","type":"Urban Skirmish / Multi-faction Brawl","result":"Pyrrhic — All parties suffered losses; Syndicate devastated","belligerents":{"attackers":{"name":"Multiple factions (chaotic)","factionId":null,"commander":"None (spontaneous)"},"defenders":{"name":"Tea Leaf Syndicate","factionId":"tea_leaf_syndicate","commander":"Syndicate leadership"}},"casualties":{"attackers":"Moderate (Toad Gang, Iron Legion)","defenders":"Severe — Most of the Syndicate's muscle killed by fireball"},"summary":"The Tea Party Incident was a catastrophic multi-faction brawl that erupted aboard the Vigilance when Archie Miser's attempt to meet with the Tea Leaf Syndicate went disastrously wrong.","description":"What began as a diplomatic meeting between Archie Miser and the Tea Leaf Syndicate devolved into one of the most chaotic engagements aboard the Vigilance. A panic button was pressed—the identity of who triggered it remains disputed—which summoned both Toad Gang and Iron Legion forces to the location.\\n\\nThe resulting three-way brawl engulfed the meeting area. In the chaos, Archie Miser unleashed a fireball that killed numerous combatants, including most of the Syndicate's muscle. The indiscriminate nature of the attack drew condemnation from all sides but effectively eliminated the Syndicate as a fighting force.\\n\\nThe incident demonstrated the volatile nature of factional politics aboard the Vigilance, where multiple armed groups operated in close proximity with competing agendas. It also established Archie Miser's reputation for dangerous, unpredictable magical escalation—a pattern that would repeat throughout the campaign.","aftermath":"The Tea Leaf Syndicate lost most of its fighting capability. The incident set the stage for the Syndicate Showdown three days later, which would destroy the organization entirely. Archie Miser's use of area-effect magic in a crowded space became a recurring concern.","relatedArticles":["archie_miser","tea_leaf_syndicate","vigilance","iron_legion"]},{"id":"syndicate_showdown","name":"The Syndicate Showdown","date":"Day 12, 1040 BF (13:45)","location":"Aboard the Vigilance","type":"Factional Engagement","result":"Tea Leaf Syndicate destroyed","belligerents":{"attackers":{"name":"The Party / Iron Legion","factionId":null,"commander":"Various"},"defenders":{"name":"Tea Leaf Syndicate","factionId":"tea_leaf_syndicate","commander":"Green T, Earl Grey"}},"casualties":{"attackers":"One Iron Legion soldier (crushed by Green T)","defenders":"Earl Grey (exploded), remaining Syndicate forces neutralized"},"summary":"The decisive engagement that destroyed the Tea Leaf Syndicate as an organization. Green T revealed a giant form and Earl Grey literally exploded after being poisoned.","description":"Three days after the Tea Party Incident had gutted their fighting force, the Tea Leaf Syndicate faced its final confrontation. Green T, the Syndicate's enigmatic leader, revealed a previously unknown giant form, using his massive size to crush an Iron Legion soldier.\\n\\nHis enforcer, Earl Grey, was poisoned by Roger's dagger during the melee. The poison interacted catastrophically with Earl Grey's physiology, causing him to literally explode. The detonation scattered items across the combat area and marked the definitive end of the Syndicate's power base aboard the Vigilance.\\n\\nGreen T survived the destruction of his organization and went on to become an important independent operative, particularly during the events at Raventree Manor and the Shadow Estate dinner.","aftermath":"The Tea Leaf Syndicate ceased to exist as an organization. Green T became an independent agent. The power vacuum aboard the Vigilance shifted the balance toward the Iron Legion.","relatedArticles":["tea_leaf_syndicate","vigilance","green_t","iron_legion"]},{"id":"spider_grove_battle","name":"Battle of the Spider Grove","date":"Day 20-21, 1040 BF","location":"The Silent Grove, Raventree Manor Grounds","type":"Monster Hunt / Multi-phase Battle","result":"Victory — Arachnid Matriarch banished","belligerents":{"attackers":{"name":"The Party & Allies","factionId":null,"commander":"Markop, assisted by Waluigi & The Oracle"},"defenders":{"name":"Arachnid Matriarch & Brood","factionId":null,"commander":"Arachnid Matriarch"}},"casualties":{"attackers":"FNG Remi (unconscious, revived), Smoking J (bitten), mechanical companion damaged","defenders":"Arachnid Matriarch (banished), brood scattered"},"summary":"A prolonged, multi-phase battle against a massive Arachnid Matriarch in the web-choked Silent Grove of Raventree Manor. The battle culminated in the Oracle using a banishment circle to destroy the creature.","description":"The Battle of the Spider Grove was one of the most dramatic engagements during the Raventree Manor crisis. It began when Markop and Remi ventured into the web-choked grove to rescue Eager, who had been trapped by the Matriarch's brood.\\n\\n**Phase 1: The Rescue**\\nMarkop, Remi, and allies fought through layers of webbing and smaller arachnids to reach Eager. Waluigi provided chaotic assistance alongside the stolen Mages' Guild construct named Mossy.\\n\\n**Phase 2: The Grove Fractures**\\nThe battle expanded as Remi and her mechanical dog held off the giant spider. Smoking J was bitten during the melee, and the toad squad became separated in a dark, flooded fountain area. The Oracle appeared, casting a massive illumination spell while Waluigi cleared paths with ice magic.\\n\\n**Phase 3: Titan Fight**\\nMarkop accepted a cryptic blessing from the Oracle, growing to colossal size to match the Matriarch. Eager, stuck in a massive form, used pepper spray on smaller arachnids. The fight was briefly interrupted when the Vigilance flew overhead broadcasting Iron Legion propaganda.\\n\\n**Phase 4: The Banishment**\\nRemi was swarmed by minispiders and fell unconscious. Markop grappled the Matriarch in a titan-scale deadlock while Waluigi weakened it with arcane rays. Salem landed a critical crossbow bolt through the creature's eye. The Oracle fired an arrow into its abdomen as Mossy bit into its legs. When the spider crashed into the Oracle's hastily-drawn banishment circle, it was consumed by light and vanished.\\n\\nThe battle yielded significant loot, including a War Mage's Staff (claimed by Markop for Archie), Web-Woven Scale armor (recovered by Remi), and three healing potions (desperately claimed by Rodger).","aftermath":"The party divided the Matriarch's hoard and returned to Raventree Manor, where they discovered the existence of multiple Oracles. The victory in the grove directly preceded the Shattered Ritual and the Planar Fracture.","relatedArticles":["raventree_manor","the_oracle","markop","archie_miser"]},{"id":"siege_raventree","name":"The Siege of Raventree","date":"Day 18-19, 1040 BF","location":"Raventree Manor","type":"Siege / Supernatural Event","result":"Inconclusive — Manor defenses activated","belligerents":{"attackers":{"name":"Pond Patrol","factionId":"liberated_toads","commander":"Speaker L"},"defenders":{"name":"Archie Miser & Hjumpik / Manor Wraiths","factionId":null,"commander":"Archie Miser (reluctant)"}},"casualties":{"attackers":"Unknown (wraith attacks)","defenders":"Green T (pulled into mirror dimension)"},"summary":"Speaker L's Pond Patrol besieged Raventree Manor after a failed healing attempt on Eager. The manor itself responded by manifesting powerful wraiths, and Green T was lost to a mirror dimension.","description":"The Siege of Raventree began when Speaker L's Pond Patrol surrounded the manor following tensions over a failed healing attempt on Eager. The siege created a containment perimeter around the building.\\n\\nThe manor, however, proved to have defenses of its own. In response to the military presence, the building began manifesting powerful wraiths—supernatural entities that attacked both the besieging forces and the occupants indiscriminately.\\n\\nArchie surrendered to Speaker L to buy time, but the supernatural escalation could not be contained. A glass monster emerged from one of the manor's mirrors, and during the ensuing chaos, Green T was violently pulled into a mirror dimension by a supernatural entity.\\n\\nThe siege demonstrated that Raventree Manor was not merely a building but an active supernatural entity with its own defenses and agenda. This realization would prove critical in the days to come, as the manor's dimensional instability became the central crisis of the campaign.","aftermath":"Green T's loss to the mirror dimension set the stage for his reappearance in the Shadowfell. The siege revealed the manor's supernatural nature and contributed to the escalating dimensional instability that would culminate in the Planar Fracture.","relatedArticles":["raventree_manor","archie_miser","liberated_toads","green_t"]},{"id":"iron_sky_breach","name":"The Iron Sky Breach","date":"Day 20, 1040 BF (16:30)","location":"Aboard the Vigilance (airspace)","type":"Boarding Action","result":"Decisive Iron Legion Victory","belligerents":{"attackers":{"name":"Iron Legion","factionId":"iron_legion","commander":"Unknown Legion Commander"},"defenders":{"name":"Liberated Toads / Party","factionId":"liberated_toads","commander":"Various"}},"casualties":{"attackers":"Light","defenders":"Ship captured, crew scattered; Ryan forced to jump"},"summary":"The Iron Legion boarded and captured the airship Vigilance, the mobile headquarters of the Liberated Toads. The ship was subsequently renamed the 'Legionlance.'","description":"In a swift and decisive boarding action, the Iron Legion seized control of the Vigilance, the airship that had served as the Liberated Toads' mobile headquarters throughout the 1040 BF crisis.\\n\\nThe boarding was well-coordinated, catching the defenders off-guard. Ryan was forced to jump from the ship to avoid capture, surviving the fall and eventually being taken in by a Rakasha spirit-walker. Other crew members were scattered or captured.\\n\\nBones, utilizing his infiltration skills, managed to avoid capture by disguising himself as a Legionnaire, eventually penetrating an Imperial Processing Facility where he uncovered a horrifying industrial complex.\\n\\nThe captured Vigilance was renamed the 'Legionlance' and repurposed as an Iron Legion asset. The ship was later seen flying over Raventree Manor, broadcasting Legion propaganda and compliance orders. The loss of the Vigilance represented the single greatest strategic defeat for the Liberated Toads.","aftermath":"The Liberated Toads lost their mobile base of operations. The Vigilance was renamed the 'Legionlance.' Ryan was separated from the group. Bones went deep undercover within Legion facilities.","relatedArticles":["vigilance","iron_legion","liberated_toads"]},{"id":"massacre_aegis","name":"Massacre at Aegis Command","date":"Day 21, 1040 BF (14:30)","location":"Aegis Command, Iron Legion Fortress","type":"Infiltration / Massacre","result":"Catastrophic failure; Order 120 issued","belligerents":{"attackers":{"name":"Bones (Liberated Toads infiltrator)","factionId":"liberated_toads","commander":"Bones"},"defenders":{"name":"Iron Legion","factionId":"iron_legion","commander":"General Ironhand"}},"casualties":{"attackers":"Bones (stabbed by Ironhand), all Toad prisoners (Order 120)","defenders":"None"},"summary":"Bones' infiltration of the Iron Legion fortress ended in disaster. His discovery led General Ironhand to issue 'Order 120'—the immediate execution of all Toad prisoners.","description":"Following the capture of the Vigilance, Bones infiltrated Aegis Command—the Iron Legion's primary fortress—disguised as a Legionnaire. His mission was to gather intelligence on Legion operations and locate captured toads.\\n\\nThe infiltration ended catastrophically when Bones was identified and stabbed by General Ironhand personally. During the confrontation, a Green Decoy posing as Speaker L was discovered, revealing the depth of the Legion's intelligence operations.\\n\\nIn response to the security breach and the discovery of the decoy, Ironhand issued 'Order 120': the immediate execution of all Toad prisoners held in Legion facilities. This order represented one of the most devastating single decisions of the entire conflict, resulting in mass casualties among captured Liberated Toads.\\n\\nThe massacre profoundly affected Speaker L, who adopted a grimmer, more ruthless ideology following the event. He chanted a war anthem reflecting his new worldview and vowed to hunt down the impostor who had worn his face.","aftermath":"Mass execution of Toad prisoners. Speaker L radicalized. The event escalated the conflict between the Liberated Toads and the Iron Legion to a war of annihilation.","relatedArticles":["iron_legion","liberated_toads","speaker_l"]},{"id":"planar_fracture","name":"The Planar Fracture","date":"Day 21, 1040 BF (01:30-01:45)","location":"Raventree Manor (all planes)","type":"Catastrophic Magical Event","result":"Reality shattered into three planar shards","belligerents":{"attackers":{"name":"N/A — Magical catastrophe","factionId":null,"commander":"The Oracle (ritual leader)"},"defenders":{"name":"N/A","factionId":null,"commander":"N/A"}},"casualties":{"attackers":"Party scattered across dimensions","defenders":"Physical room seized by Iron Legion"},"summary":"A failed synchronization ritual shattered local reality around Raventree Manor into three distinct planar shards, scattering the party across the Shadowfell, the Feywild, and the Deep Mirror.","description":"The Oracle attempted a synchronization rite designed to align the physical world, mirror-space, and the 'Deep Layers.' The ritual was doomed from the start—internal conflict among participants, missing key individuals, and the inherently unstable nature of Archie Miser's magic combined to create a catastrophic failure.\\n\\nWhen the ritual collapsed, local reality shattered into three distinct planar shards:\\n\\n**The Shadowfell (Shadow Estate):** Archie and Bowser were cast into a monochrome version of the manor controlled by the Onyx Hand and their vampire lords. Fire magic was suppressed by the plane's physics.\\n\\n**The Feywild (Overgrown Manor):** Waluigi and Toad Lee fell into a version of the manor overtaken by wild nature, giant insects, and fairy creatures under the rule of Lady Aurelian Corvinarus.\\n\\n**The Deep Mirror (Fractured Atrium):** Markop, Remi, and the Oracle vanished into a dimension of unstable physics, decaying time, and crystalline energy.\\n\\n**The Physical Plane:** The room where the ritual was performed was immediately seized by the Iron Legion, who deployed Toadburt as a coerced agent (fitted with an Entropy Ring) into the Feywild.\\n\\nThe Planar Fracture became the defining event of the latter half of the campaign, as various party members struggled to survive, navigate, and ultimately reunite across hostile dimensions.","aftermath":"The party was scattered across three hostile dimensions. Each group faced unique challenges: vampires in the Shadowfell, fey courts in the Feywild, and reality decay in the Deep Mirror. The Iron Legion seized the physical anchor point.","relatedArticles":["raventree_manor","the_oracle","corvinarus_family","onyx_hand","iron_legion"]},{"id":"dinner_climax_vote","name":"The Dinner's Climax: The Vote","date":"Day 23, 1040 BF (20:00)","location":"Shadow Estate, Shadowfell","type":"Political Assassination / Escape","result":"Orangus Cornelius shot; Vivian claims title of Heir","belligerents":{"attackers":{"name":"Green T & Archie Miser","factionId":null,"commander":"Green T"},"defenders":{"name":"Onyx Hand / Vampire Lords","factionId":"onyx_hand","commander":"Orangus Cornelius"}},"casualties":{"attackers":"Usk (finger severed by Archie as proof of loyalty)","defenders":"Orangus Cornelius (shot with silver bullet)"},"summary":"The Shadow Estate dinner party ended in violence when Green T shot Orangus Cornelius with a silver bullet after a forced vote determined who would die.","description":"The climax of the Shadowfell dinner party represented the convergence of multiple conspiracies. The vampire lords forced a vote among the guests to determine who would be killed—a grotesque tradition of the Shadow Estate.\\n\\nArchie, still operating under his 'Darman Knightly' persona, voted for the Archivist. However, to prove his loyalty to the vampires, he was forced to sever Usk's finger—an act that cost him a crucial ally's trust.\\n\\nGreen T, who had been secretly plotting rebellion from the children's table, chose this moment to strike. He produced a firearm loaded with silver bullets—anathema to vampires—and shot Orangus Cornelius directly.\\n\\nIn the ensuing chaos, the thrall known as 'Vivesna' revealed himself to actually be 'Vivian,' a male, and claimed the title of Heir to the Corvinarus line. This revelation threw the succession crisis into further turmoil.\\n\\nArchie and Green T escaped through a window, landing in rose bushes, while Bowser remained behind, breathing fire at the vampire lords. The rest of the party scattered through the manor's corridors.","aftermath":"Orangus Cornelius was shot. Vivian claimed the title of Heir. The party escaped the Shadow Estate dinner but the vampires turned hostile. The succession crisis of House Corvinarus deepened.","relatedArticles":[
