<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waluipedia — The Objective Encyclopedia (Written by Waluigi)</title>
<style>
:root{
  --bg:#0d0a15; --bg2:#151022; --panel:#1b1430; --panel2:#231838;
  --border:#38295a; --text:#ece7f5; --muted:#a99cc6; --accent:#8a4bff;
  --accent2:#e0b400; --green:#2fae8a; --danger:#e5484d; --link:#c8a6ff;
  --shadow:0 8px 30px rgba(0,0,0,.45); --radius:14px;
}
html[data-theme="light"]{
  --bg:#f5f1fb; --bg2:#ece5f7; --panel:#ffffff; --panel2:#f6f1fd;
  --border:#dccff0; --text:#241a38; --muted:#6b5e86; --accent:#6b2bbd;
  --accent2:#9a6c00; --green:#1f8f70; --danger:#c3282d; --link:#5b239e;
  --shadow:0 8px 24px rgba(90,0,140,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(138,75,255,.14),transparent 60%),
      radial-gradient(900px 500px at -10% 10%,rgba(224,180,0,.07),transparent 55%),var(--bg);
  color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit}
.animate-fade-in{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* topbar */
header.topbar{position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;padding:12px 18px;
  background:linear-gradient(90deg,rgba(27,20,48,.96),rgba(35,24,56,.96));border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
html[data-theme="light"] header.topbar{background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(246,241,253,.96))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:900;color:#fff;font-size:21px;box-shadow:var(--shadow)}
.brand b{font-size:18px;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:11px;display:block;margin-top:-4px}
.searchwrap{position:relative;flex:1;max-width:640px;margin:0 auto}
#search{width:100%;padding:11px 40px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;outline:none;transition:.15s}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,75,255,.25)}
.searchwrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.searchwrap .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--bg2)}
.results{position:absolute;top:52px;left:0;right:0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;display:none;z-index:60}
.results.show{display:block}
.res-item{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.res-item:last-child{border-bottom:none}
.res-item.active,.res-item:hover{background:rgba(138,75,255,.16)}
.res-item .rtitle{font-weight:600}
.res-item .rtype{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);margin-left:6px}
.res-item .rsum{color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-empty{padding:16px;color:var(--muted);text-align:center}
.topbtns{display:flex;gap:8px}
.iconbtn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
/* layout */
.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;max-width:1280px;margin:22px auto;padding:0 18px}
aside.sidenav{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.navsec{margin-bottom:6px}
.navsec>.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 8px 4px}
.navlink{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--text)}
.navlink:hover{background:rgba(138,75,255,.14)}
.navlink.active{background:linear-gradient(90deg,rgba(138,75,255,.28),rgba(138,75,255,.06));font-weight:600}
.navlink .cnt{font-size:11px;color:var(--muted);background:var(--bg2);border-radius:20px;padding:1px 8px}
.navlink .emoji{margin-right:2px}
main.content{min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
/* home */

.home-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.home-action{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none}.home-action:hover{border-color:var(--accent);color:var(--link);text-decoration:none}.home-feature-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:16px}.feature-panel{border:1px solid var(--border);border-radius:14px;background:var(--panel2);padding:16px;cursor:pointer;min-height:170px}.feature-panel:hover{border-color:var(--accent);box-shadow:var(--shadow)}.feature-panel .kicker,.update-card .kicker,.comment-card .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);font-weight:900}.feature-panel h2{margin:5px 0}.mini-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}.mini-stat{border:1px solid var(--border);border-radius:10px;background:var(--bg2);padding:10px}.mini-stat b{display:block;color:var(--accent2);font-size:21px}.update-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.update-card,.comment-card,.path-card{border:1px solid var(--border);border-radius:12px;background:var(--panel2);padding:13px;cursor:pointer}.update-card:hover,.comment-card:hover,.path-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}.update-card h3,.comment-card h3,.path-card h3{margin:4px 0 6px;font-size:16px}.update-card p,.comment-card p,.path-card p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.update-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.update-tags span{border:1px solid var(--border);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:11px}.comment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.comment-card blockquote{margin:8px 0;padding:8px 10px;border-left:3px solid var(--accent2);background:rgba(224,180,0,.08);font-size:13px}.path-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.home-section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}.home-section-head h2{margin:0}.home-section-head p{margin:0;color:var(--muted);font-size:13px}@media(max-width:850px){.home-feature-grid{grid-template-columns:1fr}}
.article-layout{grid-template-columns:minmax(0,1fr) 330px}
.infobox .row{display:block}.infobox .k{display:block;margin-bottom:2px}.infobox .v{display:block;text-align:left;font-weight:500;line-height:1.35;overflow-wrap:anywhere}.event-context-grid.single{grid-template-columns:1fr}.event-context-panel .related-list{gap:7px}.event-context-panel{overflow:hidden}
@media(max-width:1050px){.article-layout{grid-template-columns:1fr}}

.hero{background:linear-gradient(135deg,rgba(138,75,255,.18),rgba(224,180,0,.08));border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-bottom:20px}
.hero h1{margin:0 0 6px;font-size:30px}
.hero p{margin:0;color:var(--muted)}
.datechip{display:inline-block;margin-top:10px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--accent2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:8px}
.catcard{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.15s}
.catcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.catcard .cemoji{font-size:26px}
.catcard .cname{font-weight:700;margin-top:4px}
.catcard .ccount{color:var(--muted);font-size:12px}
.feat{cursor:pointer}
.feat .badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--accent);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.dyk li,.otd li{margin-bottom:10px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin:0 0 12px;font-weight:800}
/* list */
.listhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.listhead h2{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.arttile{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:15px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;border-left:4px solid var(--border)}
.arttile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.arttile .tt{font-weight:700;font-size:15.5px}
.arttile .tsub{color:var(--accent2);font-size:12px;margin:2px 0 6px}
.arttile .tsum{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.arttile .tmeta{margin-top:8px;font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
/* article */
.article-layout{display:grid;grid-template-columns:1fr 250px;gap:22px;align-items:start}
.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:10px}
.art-title{font-size:32px;margin:0 0 2px}
.art-subtitle{color:var(--accent2);font-style:italic;margin:0 0 14px;font-size:16px}
.metabar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.readtime{color:var(--muted);font-size:13px;margin-bottom:14px}
.infobox{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13.5px;margin-bottom:16px}
.infobox h4{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2)}
.infobox .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.infobox .row:last-child{border-bottom:none}
.infobox .k{color:var(--muted)}
.infobox .v{text-align:right;font-weight:600}
.toc{position:sticky;top:78px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13.5px}
.toc h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2)}
.toc a{display:block;padding:3px 0;color:var(--muted);border-left:2px solid transparent;padding-left:8px}
.toc a:hover{color:var(--text)}
.toc a.h3{padding-left:18px;font-size:12.5px}
.toc a.active{color:var(--link);border-left-color:var(--accent);font-weight:600}
.prose{font-size:16px}
.prose h2{color:var(--accent);margin-top:28px;scroll-margin-top:84px;border-bottom:1px solid var(--border);padding-bottom:6px}
.prose h3{color:var(--accent2);margin-top:22px;scroll-margin-top:84px}
.event-details-section{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:16px;margin:18px 0}.event-details-section h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2)}.event-details-section ul{margin:0;padding-left:20px;font-size:14px;color:var(--text)}.event-details-section li{margin-bottom:8px}
.prose blockquote{background:rgba(224,180,0,.10);border-left:4px solid var(--accent2);margin:16px 0;padding:10px 16px;border-radius:8px}
.event-details-section{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:16px;margin:18px 0}.event-details-section h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2)}.event-details-section ul{margin:0;padding-left:20px;font-size:14px;color:var(--text)}.event-details-section li{margin-bottom:8px}
.waluigi-comment, .waluigi-rant { border-left: 4px solid #8b5fd4; background: rgba(139, 95, 212, 0.05); padding: 12px 18px; border-radius: 8px; margin: 20px 0; color: #d8c6ff; font-style: italic; }
.xp-preview-box { background: rgba(139, 95, 212, 0.08); border: 2px solid #8b5fd4; border-radius: 12px; padding: 20px; margin: 25px 0; font-family: 'JetBrains Mono', monospace; }
.prose p{margin:12px 0}
.related-list{display:flex;flex-wrap:wrap;gap:8px}
.rel-chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.rel-chip:hover{border-color:var(--accent);color:var(--text)}
.rel-chip .rt{font-size:10px;color:var(--muted);margin-right:6px;text-transform:uppercase}
.deadlink{opacity:.5;cursor:default}
.wnote{background:linear-gradient(135deg,rgba(138,75,255,.12),rgba(224,180,0,.06));border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin:14px 0;font-style:italic}
.wnote b{color:var(--accent);font-style:normal}
/* timeline */
.tl-year-block{margin-bottom:26px}
.tl-year-h{font-size:26px;font-weight:900;color:var(--accent);letter-spacing:1px;padding:4px 0 2px;border-bottom:2px solid var(--accent);margin-bottom:12px}
.tl-month{margin-bottom:14px}
.tl-month-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent2);margin:0 0 6px 26px}
.tl{position:relative;margin-left:10px;padding-left:26px;border-left:2px solid var(--border)}
.tl-item{position:relative;margin-bottom:20px}
.tl-item::before{content:"";position:absolute;left:-33px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--panel)}
.tl-item.b::before{background:var(--danger)}
.tl-item.t::before{background:var(--accent2)}
.tl-year{font-weight:800;color:var(--accent2);font-size:13px}
.tl-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:4px;cursor:pointer;transition:.15s}
.tl-card:hover{border-color:var(--accent)}
.tl-card .tl-name{font-weight:700}
.tl-card .tl-meta{color:var(--muted);font-size:12.5px;margin-top:2px}
/* conflicts */
.conflict-card{background:var(--panel2);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px}
.conflict-card h3{margin:0 0 4px}
.status-tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-radius:20px;padding:2px 10px;font-weight:700}
.status-active{background:rgba(229,72,77,.18);color:#ff8b8f;border:1px solid var(--danger)}
.status-concluded,.status-resolved{background:rgba(47,174,138,.16);color:#5fd6b4;border:1px solid var(--green)}
.status-other{background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
.combatant-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12.5px;margin:3px 4px 0 0;cursor:pointer}
.combatant-chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.phase{border-left:3px solid var(--accent2);padding:4px 0 4px 12px;margin:8px 0;font-size:14px}
.phase b{color:var(--accent2)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin:12px 0}
.side{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px}
.side h5{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.vs .versus{align-self:center;font-weight:900;color:var(--danger)}
/* congress */
.vote-tally{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tally{border-radius:10px;padding:8px 14px;text-align:center;border:1px solid var(--border);flex:1;min-width:80px}
.tally .n{font-size:22px;font-weight:900}
.tally .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tally.yea{background:rgba(47,174,138,.12)}.tally.yea .n{color:var(--green)}
.tally.nay{background:rgba(229,72,77,.12)}.tally.nay .n{color:var(--danger)}
.tally.abs{background:var(--bg2)}
.bar{height:10px;border-radius:20px;overflow:hidden;background:var(--bg2);display:flex;margin:6px 0 2px}
.bar .y{background:var(--green)}.bar .n{background:var(--danger)}.bar .a{background:var(--muted)}
footer{max-width:1280px;margin:10px auto 40px;padding:0 18px;color:var(--muted);font-size:12.5px;text-align:center}
.imgcap{color:var(--muted);font-size:12.5px;font-style:italic;margin-top:6px}
mark{background:var(--accent2);color:#111;border-radius:3px;padding:0 2px}
/* ===== in-world visual systems ===== */
.wsys{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;margin:16px 0}
.wsys-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.wsys-note{color:var(--muted);font-size:12.5px;font-style:italic;margin:0 0 12px}
/* congress tally board */
.tally-board{display:flex;flex-direction:column;gap:10px}
.tally-row{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.tally-row .tlabel{color:var(--muted);text-align:right}
.tally-track{background:var(--bg2);border-radius:6px;height:20px;overflow:hidden;border:1px solid var(--border)}
.tally-fill{height:100%;display:flex;align-items:center;padding-left:8px;color:#0b0b12;font-weight:800;font-size:11px;white-space:nowrap}
.tally-row .tnum{font-weight:800;text-align:right}
.bloc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.bloc-card{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px}
.bloc-card h6{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.bloc-card .b-list{color:var(--muted);line-height:1.45}
/* battle VS infographic */
.vs-wrap{display:grid;grid-template-columns:1fr 46px 1fr;gap:8px;align-items:stretch;margin-top:4px}
.vs-side{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg2)}
.vs-side.att{border-top:3px solid var(--danger)}
.vs-side.def{border-top:3px solid var(--green)}
.vs-side h5{margin:0 0 4px;font-size:14px}
.vs-side .vs-cmd{color:var(--muted);font-size:12px}
.vs-mid{display:grid;place-items:center;font-weight:900;color:var(--accent);font-size:18px}
.vs-outcome{margin-top:10px;text-align:center;font-weight:800;padding:6px;border-radius:8px;background:linear-gradient(90deg,rgba(229,72,77,.15),rgba(47,174,138,.15));border:1px solid var(--border);font-size:13px}
.cas-bar{margin-top:8px;font-size:12px;color:var(--muted)}
/* relation graph (SVG) */
.relsvg{width:100%;height:auto;display:block}
.relsvg .rl-line{stroke-width:1.6;opacity:.55}
.relsvg .rl-node{cursor:pointer}
.relsvg .rl-node circle{transition:.12s}
.relsvg .rl-node:hover circle{stroke:var(--accent);stroke-width:2.5}
.relsvg text{font-family:inherit;fill:var(--text)}
.rel-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.rel-legend span{display:inline-flex;align-items:center;gap:5px}
.rel-legend i{width:14px;height:3px;display:inline-block;border-radius:2px}
/* inline annotations */

xpenses but stable enough for bank counters to bother counting. Rural banks often prefer silver to exotic scrip because farmers trust a coin they can bite. Backing: assayed silver weight. Bank note: universal small tender.","stability":"steady","liquidity":"universal"},"copper":{"name":"Copper Bit","icon":"icon_copper.png","base_value":0.01,"home_faction":null,"description":"Low-value street currency for bread, candles, cart fees, ferry tips, and market change. Banks accept copper reluctantly in sacks, then charge handling fees because bankers believe suffering should be itemized. Backing: copper weight. Bank note: legal small tender.","stability":"steady","liquidity":"universal"},"midland_ducat":{"name":"Midland Ducat","icon":"icon_midland_ducat.png","base_value":0.9,"home_faction":"regal_empire","description":"The Regal Empire’s main bank coin: stable, standardized, taxable, and boring in the way successful money often is. Imperial banks like it because every coin has a known weight, issue date, and paperwork trail. Backing: imperial tax authority and gold reserves. Bank note: legal tender in imperial courts.","stability":"steady","liquidity":"wide"},"imperial_crown":{"name":"Imperial Crown","icon":"factions/empire.png","base_value":1.1,"home_faction":"the_empire","description":"A heavy state coin backed by census, army, tax office, and a treasury that thinks confidence is a military doctrine. Midlands banks accept Crowns as strong foreign exchange when the paperwork is clean. Backing: state reserves and military payroll. Bank note: recognized foreign exchange.","stability":"steady","liquidity":"wide"},"archive_writ":{"name":"Archive Writ","icon":"icon_currency.png","base_value":4.5,"home_faction":"regal_empire","description":"A Regal court writ redeemable for archive fees, sealed copies, transcript searches, and restricted legal documents. Banks treat it like a service draft rather than coin, but it is accepted because courts enforce it. Backing: court service obligations. Bank note: bankable government draft.","stability":"steady","liquidity":"specialized"},"mushroom_coin":{"name":"Mushroom Coin","icon":"icon_mushroom_coin.png","base_value":0.5,"home_faction":"mushroom_regency","description":"The old Mushroom Regency coin still circulates in markets, inns, warehouses, and tax offices. Its problem is not metal; its problem is trust. Banks accept it, but many now check which political faction stamped the last transfer. Backing: royal treasury remnants. Bank note: politically strained legal tender.","stability":"shaky","liquidity":"regional"},"peach_crown":{"name":"Peach Crown","icon":"icon_mushroom_coin.png","base_value":1.4,"home_faction":"peach_loyalists","description":"A restoration coin issued by Peach Loyalists to pay soldiers, scouts, surgeons, and supply caravans. Loyalist banks honor it at full confidence; Regency banks accept it only when nobody official is watching. Backing: captured stores and restoration claims. Bank note: rebel tender; bankable in Loyalist areas.","stability":"volatile","liquidity":"regional"},"toad_bond":{"name":"Toad Bond","icon":"icon_mushroom_coin.png","base_value":0.75,"home_faction":"liberated_toads","description":"A serious rebuilding bond issued by Liberated Toad councils after the Vigilance barrel-trafficking crisis. It funds food, medicine, shelter, tools, prosthetics, and legal defense. Banks that refuse it are usually making a political statement. Backing: donations, recovered cargo, and community repayment. Bank note: bankable community bond in friendly markets.","stability":"shaky","liquidity":"regional"},"relief_stamp":{"name":"Relief Stamp","icon":"icon_mushroom_coin.png","base_value":0.2,"home_faction":"liberated_toads","description":"A ration and shelter voucher used by displaced Toad communities. Banks do not love vouchers, but relief banks and Loyalist quartermasters honor them because people need soup before monetary theory. Backing: ration stores and aid ledgers. Bank note: redeemable relief voucher.","stability":"steady","liquidity":"local"},"decree_strip":{"name":"Decree Strip","icon":"icon_currency.png","base_value":1.25,"home_faction":"liberated_toads","description":"A narrow legal note used to pay messengers, advocates, witnesses, and safehouse clerks connected to Speaker L’s resistance network. Bankers treat it as risky but real because witness networks can be stronger than kings. Backing: service promises and witness networks. Bank note: restricted resistance note.","stability":"volatile","liquidity":"specialized"},"beanbean_bean":{"name":"Beanbean Bean","icon":"icon_currency.png","base_value":0.55,"home_faction":"beanbean_kingdom","description":"A bean-shaped regional coin accepted along Mushroom trade roads. It is cheerful, annoying to stack, and surprisingly reliable. Banks like the consistency even when they dislike the joke molded into the edge. Backing: regional taxes and crop trade. Bank note: recognized regional tender.","stability":"steady","liquidity":"regional"},"wario_coin":{"name":"Wario Coin","icon":"faction_wario.png","base_value":1.2,"home_faction":"wario_land","description":"A private gold-weight coin stamped with Wario’s face. Wario Land banks honor it aggressively; other banks accept it after verifying weight and after sighing at the portrait. Wario insists the portrait increases value. Backing: private hoard reserves. Bank note: bankable private tender.","stability":"managed","liquidity":"regional"},"wario_points":{"name":"Wario Points","icon":"icon_quests.png","base_value":1,"home_faction":"wario_land","description":"Quest-board points spendable at Wario’s shop economy. These are not XP and not normal coin; banks only honor them if they have a direct Wario settlement account. Wario likes this because it keeps customers trapped in his ecosystem. Backing: future shop inventory. Bank note: closed-loop shop credit.","stability":"managed","liquidity":"closed"},"bowser_bux":{"name":"Bowser Bux","icon":"faction_koopa_troop.png","base_value":0.4,"home_faction":"koopa_troop","description":"Koopa military scrip backed by fortresses, supply depots, and Bowser’s ability to make refusal feel unwise. Koopa banks accept it cleanly; outside banks apply discounts for political risk and fire damage. Backing: military stores and royal authority. Bank note: bankable in Koopa territory.","stability":"managed","liquidity":"regional"},"shell_credit":{"name":"Shell Credit","icon":"faction_koopa_troop.png","base_value":0.65,"home_faction":"koopa_troop","description":"A Koopa quartermaster credit redeemable for rations, repairs, ammunition, shell polish, and fortress supplies. Banks near Koopa territory accept it because supply credits can be converted into real goods quickly. Backing: warehouse inventory. Bank note: military supply credit.","stability":"steady","liquidity":"regional"},"banana_medallion":{"name":"Banana Medallion","icon":"icon_dk_banana.png","base_value":2.4,"home_faction":"dk_crew","description":"A durable Kong Island token representing stored banana value. It exists because actual bananas vanish before long negotiations end. Banks like it more than fruit and less than gold, which is fair. Backing: stored harvest reserves. Bank note: bankable island token.","stability":"seasonal","liquidity":"regional"},"coconut_bar":{"name":"Coconut Bar","icon":"icon_dk_banana.png","base_value":1.1,"home_faction":"dk_crew","description":"Pressed coconut oil and fiber value sealed into cargo bars for port exchange. Coastal banks accept it because it stores better than bananas and sells well to ships, kitchens, soap-makers, and potion shops. Backing: stored coconut oil and cargo demand. Bank note: bankable port commodity.","stability":"seasonal","liquidity":"port"},"kremling_koin":{"name":"Kremling Koin","icon":"icon_kremling_koin.png","base_value":0.6,"home_faction":"kremling_krew","description":"A crude raider coin. Most banks refuse it openly, but port banks with private rooms may exchange it at punishing rates after checking whether the coins were recently stolen from their own customers. Backing: stolen metal and raider markets. Bank note: black-market exchange only.","stability":"volatile","liquidity":"black market"},"doubloon":{"name":"Syrup Doubloon","icon":"icon_gold.png","base_value":1.8,"home_faction":"syrup_pirates","description":"A heavy coin used in pirate ports, shipyards, taverns, and cargo auctions. Legitimate banks discount it; port banks accept it because pretending pirates do not trade has never stopped pirates from trading. Backing: plunder shares and port trust. Bank note: bankable in ports; suspect inland.","stability":"volatile","liquidity":"port"},"cargo_share":{"name":"Cargo Share","icon":"icon_currency.png","base_value":3.2,"home_faction":"syrup_pirates","description":"A draft against a specific cargo haul, prize, or warehouse lot. Banks accept it if the ship, cargo, captain, and dockmaster can all be verified, which means banks accept it less often than pirates claim. Backing: future cargo proceeds. Bank note: conditional port draft.","stability":"wild","liquidity":"port"},"arcane_shard":{"name":"Arcane Shard","icon":"icon_magic.png","base_value":3,"home_faction":"mages_guild","description":"Crystallized magical energy used in enchanting, spellwork, repairs, and academy labs. Guild banks accept shards by grade. Ordinary banks accept them only if a mage signs that they will not explode. Backing: usable magical energy. Bank note: bankable graded component.","stability":"volatile","liquidity":"specialized"},"guild_seal":{"name":"Guild Seal","icon":"icon_magic.png","base_value":5,"home_faction":"mages_guild","description":"A stamped Mages’ Guild credit redeemable for components, archive access, repairs, tutoring, containment circles, and sanctioned spell services. It is respectable because the Guild says so loudly. Backing: guild labor and component stock. Bank note: bankable guild credit.","stability":"steady","liquidity":"specialized"},"transit_stamp":{"name":"Transit Stamp","icon":"icon_magic.png","base_value":9,"home_faction":"mages_guild","description":"A regulated planar transit credit used to reserve portal work, stabilize crossings, or pay emergency return fees. Banks treat it like a high-value travel draft because portal access is expensive and measurable. Backing: regulated portal services. Bank note: restricted bankable travel draft.","stability":"volatile","liquidity":"specialized"},"kivotos_credit":{"name":"Kivotos Credit","icon":"factions/kivotos_gsu.png","base_value":1.2,"home_faction":"general_student_union","description":"A stable academy-city credit used for tuition, cafeterias, weapons maintenance, club budgets, and student government emergencies. Midlands banks accept it only through digital-clearing partners. Backing: academy budgets and digital accounts. Bank note: bankable where digital clearing exists.","stability":"steady","liquidity":"networked"},"data_chit":{"name":"Data Chit","icon":"factions/kivotos_gsu.png","base_value":2.6,"home_faction":"millennium_science_school","description":"A Millennium Science School chit redeemable for compute time, lab hours, robotics parts, and technical services. Banks exchange it when they can verify the ledger; otherwise it is a shiny rectangle with attitude. Backing: compute access and lab inventory. Bank note: bankable digital service credit.","stability":"steady","liquidity":"networked"},"credstick":{"name":"Credstick","icon":"icon_currency.png","base_value":1.1,"home_faction":"internet_federation","description":"Encrypted portable digital value. Excellent in networked markets, useless in a haunted swamp with no signal. Banks accept credsticks if they can authenticate the ledger and if nobody has chewed the port. Backing: encrypted account balances. Bank note: bankable digital money.","stability":"stable until offline","liquidity":"networked"},"tea_chit":{"name":"Tea Chit","icon":"icon_currency.png","base_value":1.6,"home_faction":"tea_leaf_syndicate","description":"A coded Tea Leaf Syndicate chit. Legal banks refuse it at the counter and sometimes clear it through back doors. Big T and Chai understand the marks; that is the difference between currency and suspicious paper. Backing: syndicate ledgers and favor credit. Bank note: private-bank/black-market credit.","stability":"managed","liquidity":"black market"},"broker_mark":{"name":"Broker Mark","icon":"icon_currency.png","base_value":7,"home_faction":"freelancer_underworld","description":"An underworld mark redeemable for information, introductions, silence, or discreet delivery. It is accepted by shadow banks because secrets are liquid assets if the Broker says they are. Backing: verified secrets and underworld trust. Bank note: black-market bankable marker.","stability":"volatile","liquidity":"black market"},"spirit_bead":{"name":"Spirit Bead","icon":"icon_magic.png","base_value":2.2,"home_faction":"rakasha_tribes","description":"A Rakasha bead of shell, bone, amber, or spirit-touched stone. Banks near Rakasha territory accept bead strands by maker and story mark; foreign banks undervalue them because foreign banks lack manners. Backing: craft value and clan recognition. Bank note: bankable cultural token in local markets.","stability":"steady","liquidity":"regional"},"fey_acorn":{"name":"Promise Acorn","icon":"icon_magic.png","base_value":6,"home_faction":"feywild_courts","description":"A sealed Feywild promise condensed into an acorn. Banks accept it only in branches that understand fey contracts, and yes, Waluigi knows how that sentence sounds. Backing: binding fey obligation. Bank note: restricted bankable fey contract.","stability":"wild","liquidity":"specialized"},"court_leaf":{"name":"Court Leaf","icon":"icon_magic.png","base_value":3.8,"home_faction":"feywild_courts","description":"A gilded Feyward court leaf used for hospitality debts, formal apologies, and witnessed favors. It is bankable only when provenance is intact, because fey money without context is just a leaf with legal teeth. Backing: court favor and etiquette debt. Bank note: restricted court credit.","stability":"volatile","liquidity":"specialized"},"autumn_leaf":{"name":"Autumnwood Mark","icon":"icon_currency.png","base_value":0.85,"home_faction":"autumnwood_province","description":"A provincial mark used in Autumnwood orchards, timber markets, harvest tolls, and local court fees. Banks accept it because Lady Toriel’s administration has made local accounts boring, which is praise in finance. Backing: harvest taxes and timber rights. Bank note: local legal tender.","stability":"seasonal","liquidity":"regional"},"blood_vial":{"name":"Blood Vial","icon":"faction_onyx_hand.png","base_value":2.5,"home_faction":"onyx_hand","description":"A sealed vial of preserved blood used in vampire markets and certain ritual economies. Normal banks refuse it; Crimson Ledger-style banks accept it by potency, age, source, and whether the clerk survives opening the drawer. Backing: ritual potency and vampire demand. Bank note: restricted occult bank commodity.","stability":"volatile","liquidity":"black market"},"soul_coin":{"name":"Soul Coin","icon":"faction_onyx_hand.png","base_value":20,"home_faction":null,"description":"A lower-plane coin containing a trapped soul. It is bankable only in the worst banks, which means it is very bankable somewhere and should make everyone feel worse about economics. Backing: bound soul value. Bank note: banned except occult banks.","stability":"volatile","liquidity":"black market"},"shadow_obol":{"name":"Shadow Obol","icon":"faction_onyx_hand.png","base_value":3.5,"home_faction":"shadow_estate","description":"Cold Shadow Estate scrip used by servants, hunters, archivists, imps, and other residents of a local economy that considers sunlight an auditing failure. Specialized banks accept it; cheerful banks do not. Backing: local service economy and fear. Bank note: bankable only in Shadowfell markets.","stability":"shaky","liquidity":"local"},"vampire_marker":{"name":"Vampire Marker","icon":"faction_onyx_hand.png","base_value":15,"home_faction":"onyx_hand","description":"A formal favor marker from a vampire house. It is not cash, but old banks understand that enforceable social debt can be priced. The danger is that the price may include you. Backing: enforceable social debt. Bank note: predatory but bankable favor credit.","stability":"wild","liquidity":"specialized"},"index_token":{"name":"Index Token","icon":"icon_currency.png","base_value":5.5,"home_faction":"shadow_estate","description":"An Archivist token redeemable for indexed records, memory files, auction proofs, and restricted documentation inside Shadow Estate systems. Banks accept it only if they already trade in blackmail. Backing: restricted records and leverage. Bank note: specialized archive credit.","stability":"shaky","liquidity":"local"},"dwarf_oathgold":{"name":"Oathgold","icon":"factions/dwarfs.png","base_value":4,"home_faction":"kingdoms_of_the_dwarves_wh","description":"Dwarven gold stamped with enforceable oath marks. Banks love the metal and fear the cultural consequences of mishandling it, which is exactly why Dwarven clients prefer it. Backing: gold weight and oath law. Bank note: premium bank reserve.","stability":"steady","liquidity":"wide"},"warpstone":{"name":"Warpstone Token","icon":"factions/skaven.png","base_value":10,"home_faction":"skaven","description":"A refined token of magical chaos. Almost every lawful bank refuses it at the counter; arcane black banks buy it through containment windows and charge enough fees to imply moral panic. Backing: dangerous magical power. Bank note: illegal hazardous commodity.","stability":"wild","liquidity":"black market"},"astral_pearl":{"name":"Astral Pearl","icon":"icon_magic.png","base_value":12,"home_faction":null,"description":"A pearl formed in astral currents around divine, psychic, or planar turbulence. Mages, navigators, and high-end banks value it because rarity plus utility equals collateral. Backing: rare planar navigation value. Bank note: bankable rare commodity.","stability":"volatile","liquidity":"specialized"},"rupee":{"name":"Rupee","icon":"icon_rupee.png","base_value":0.7,"home_faction":"kingdom_of_gondor","description":"A cut gemstone currency from Hyrulean-style markets. Banks accept rupees as gem currency after grading color and clarity, then pretend they understood the color-value chart all along. Backing: cut gemstone value. Bank note: bankable foreign gem tender.","stability":"seasonal","liquidity":"regional"},"poke_dollar":{"name":"PokéDollar","icon":"icon_pokedollar.png","base_value":0.6,"home_faction":"pokemon_league","description":"League-regulated trainer currency used for clinics, travel, prize payouts, and shops. Banks accept it where League accounts can clear; elsewhere it becomes a novelty until a trainer pays in bulk. Backing: league taxes and clinic economy. Bank note: bankable foreign fiat.","stability":"steady","liquidity":"regional"},"mora":{"name":"Mora","icon":"icon_mora.png","base_value":1.3,"home_faction":"teyvat_hegemony","description":"Teyvat’s common mint coin. It is popular with banks because it has deep trade habits, reliable minting, and enough merchant tradition to make arguments short. Backing: continental trade confidence. Bank note: bankable foreign fiat.","stability":"steady","liquidity":"wide"},"toad_whistle":{"name":"Courier Whistle","icon":"icon_mushroom_coin.png","base_value":0.3,"home_faction":"toad_network","description":"A Toad Network token redeemable for courier priority, route notes, civic messages, and small delivery favors. Local banks accept batches from known couriers because movement has measurable value. Backing: delivery labor and trusted routes. Bank note: bankable civic service token.","stability":"steady","liquidity":"local"}},"banking":{"_README":"Edit this file to update bank accounts, loans, and debts WITHOUT rebuilding. Just save and refre const MK_POIS=[{"id":"poi_mk_castle","x":50.54,"y":30.88,"type":"castle","name":"Peach's Castle (Fawful's Fortress)","description":"The heart of the conflict. Fawful has twisted the once-gleaming castle into a fortress of fury. The outer walls are scarred by catapult impacts and overgrown with sinister, pulsating beanstalks. Strange green energy arcs between the spires, powering a defensive field that hums with maniacal energy. The grounds are patrolled by Fawful's bizarre mechanical minions, while the grand moat is now a bubbling, purple sludge. The air itself seems to crackle with unpredictable magic and the faint sound of chortling.","factionId":"fawfuls_furious_freaks"},{"id":"poi_mk_toadtown","x":52.0,"y":24.5,"type":"town","name":"Toad Town (Occupied)","description":"A town under siege. The sections closest to the castle are a war-torn no-man's-land. The remaining areas are under the strict martial law of the Mushroom Regency, but their control is tenuous. Loyalist sympathizers operate in the shadows, while the Toad Gang's extortion rackets prey on desperate citizens. The town is a grim tapestry of refugee camps, military checkpoints, and whispered rumors.","factionId":"mushroom_regency"},{"id":"poi_mk_starhill","x":55.09,"y":24.76,"type":"shrine","name":"Star Hill Shrine","description":"A place of eerie tranquility overlooking the chaos. This ancient shrine, with its softly glowing flora, seems to exist in a pocket of calm amidst the war. It's considered neutral ground, used for clandestine meetings between factions. However, its powerful celestial energies have begun to attract the attention of Kamek's Magikoopas and Fawful's scouts, who believe it could be used as a potent weapon.","factionId":"unaligned"},{"id":"poi_mk_loyalist_camp","x":45.0,"y":35.0,"type":"siege_camp","name":"Loyalist Camp 'Vengeance'","description":"The main staging ground for the Peach Loyalists' crusade. The camp is a mix of military discipline and fanatical zeal. Siege engines are constantly being constructed and repaired, while soldiers like the fiery Embercap drill recruits for the next assault. Scouts like Mistveil slip out under cover of darkness to probe Fawful's defenses. Morale is high, fueled by righteous fury.","factionId":"peach_loyalists"},{"id":"poi_mk_fawful_lab","x":48.0,"y":27.0,"type":"workshop","name":"Fawful's Chortle-Charge Workshop","description":"A repurposed royal observatory buzzing with unstable energy. This is the primary factory for Fawful's mechanical army. The dome is cracked open, venting green steam and strange noises. It's a place of mad science, where Fawful's fury is given metallic form.","factionId":"fawfuls_furious_freaks"},{"id":"poi_mk_bramblehaven","x":48.0,"y":38.0,"type":"town","name":"Bramblehaven (Loyalist Occupied)","description":"A grim testament to the Loyalists' ruthlessness. Once a Fawful-held village, Bramblehaven is now a conquered ruin under the iron-fisted rule of the Peach Loyalists. The streets are stained with blood, and the gallows in the town square stand as a stark warning to any who would defy them. The town is being converted into a forward operating base, with interim mayor Big R overseeing the 'pacification' of the remaining populace.","factionId":"peach_loyalists"},{"id":"poi_mk_koopa_outpost","x":44.0,"y":28.0,"type":"outpost","name":"Koopa Remnant Observation Post","description":"A well-camouflaged outpost in the western hills where Kamek directs the Koopa Remnants' intelligence operations. From this vantage point, Magikoopas use scrying spells to monitor the siege, analyzing both Fawful's and the Loyalists' tactics, patiently waiting for the perfect moment of weakness to strike for Bowser's glory.","factionId":"koopa_troop"},{"id":"poi_mk_guffaw_bridge","x":57.47,"y":32.55,"type":"bridge","name":"The Guffaw Bridge","description":"A vital stone bridge providing the main southern approach to Peach's Castle. It's now a grim, contested chokepoint, constantly shelled by both sides. The bridge is littered with the wreckage of Fawful-Bots and Loyalist barricades. Its name comes from the eerie way the wind whistles through the shell holes, sounding like faint, manic laughter.","factionId":"unaligned"},{"id":"poi_mk_whispering_market","x":56.39,"y":29.21,"type":"market","name":"The Whispering Market","description":"A makeshift black market that has sprung up in a series of interconnected cellars beneath the ruined part of Toad Town. Run by the Freelancer Underworld, it's a place where deserters, spies, and war profiteers trade information, stolen supplies, and forbidden goods. The only currency accepted is secrets or rare items.","factionId":"freelancer_underworld"},{"id":"poi_mp_pleasant_hill","x":45.18,"y":41.29,"type":"village","name":"Pleasant Hill Village","description":"A once-peaceful farming village now swollen with refugees from the fighting. It's a tense, crowded place under the loose control of the Mushroom Regency, with Loyalist sympathizers hiding among the populace.","factionId":"mushroom_regency"},{"id":"poi_mp_toadstool_farms","x":50.8,"y":42.9,"type":"farm","name":"Toadstool Farms","description":"The primary food source for Toad Town. These fertile fields are now a contested region, with both Regency and Loyalist patrols attempting to control the harvest.","factionId":"unaligned"},{"id":"poi_mp_regency_checkpoint","x":56.1,"y":36.91,"type":"outpost","name":"Regency Checkpoint Alpha","description":"A fortified checkpoint on the main road into the capital region. It is heavily guarded by the Toadstool Guard, who inspect all travelers for Loyalist contraband or Fawful's minions.","factionId":"mushroom_regency"},{"id":"poi_mp_goomba_grove","x":43.8,"y":31.97,"type":"forest","name":"Goomba Grove","description":"A small, dense forest known for its unusually aggressive and territorial Goomba population. Both sides of the conflict avoid it, making it a haven for deserters and those wishing to stay hidden.","factionId":"unaligned"},{"id":"poi_mp_whispering_falls","x":61.8,"y":39.02,"type":"waterfall","name":"Whispering Falls","description":"A beautiful, secluded waterfall with a hidden cave behind it. It's rumored to be a secret meeting place for Regency spies and informants from the Freelancer Underworld.","factionId":"mushroom_regency"},{"id":"poi_mp_loyalist_artillery","x":48.0,"y":22.5,"type":"siege_camp","name":"Loyalist Artillery Position","description":"A well-hidden battery of trebuchets and catapults operated by the Peach Loyalists. From this position, they maintain a constant, harassing bombardment on the western walls of Fawful's occupied castle.","factionId":"peach_loyalists"},{"id":"poi_mp_fungal_blight","x":62.0,"y":26.5,"type":"swamp","name":"The Fungal Blight Zone","description":"An area scarred by a magical plague from a past war. The land is marshy and the fungi here grow in twisted, aggressive forms. It is home to dangerous Fuzzies and Gloombas.","factionId":"unaligned"},{"id":"poi_mp_shy_guy_crossing","x":60.0,"y":43.0,"type":"bridge","name":"Shy Guy's Crossing","description":"A rickety and treacherous rope bridge spanning the Great Chasm. It's often 'tolled' by a gang of Shy Guy bandits who prey on anyone desperate enough to use this shortcut.","factionId":"freelancer_underworld"},{"id":"poi_mp_piranha_patch","x":63.0,"y":34.0,"type":"lair","name":"Piranha Plant Patch","description":"A notoriously overgrown and dangerous patch of land infested with giant, hungry Piranha Plants. Valuable herbs are said to grow in the center, but few are brave or foolish enough to try and harvest them.","factionId":"unaligned"},{"id":"poi_mp_guard_tower","x":59.0,"y":23.0,"type":"ruins","name":"Abandoned Guard Tower","description":"A ruined stone tower from a previous war. It offers a commanding strategic view of the entire Mushroom Plains region, making it a valuable, if exposed, observation post for any faction.","factionId":"unaligned"},{"id":"poi_mp_giggle_meadow","x":42.5,"y":23.5,"type":"farm","name":"Giggle Grass Meadow","description":"A serene meadow where a strange type of grass grows. When disturbed, it releases spores that cause uncontrollable, debilitating laughter. Alchemists pay a high price for it.","factionId":"unaligned"},{"id":"poi_mp_propaganda_tower","x":44.5,"y":38.5,"type":"watchtower","name":"Regency Propaganda Tower","description":"A heavily modified watchtower now equipped with loudspeakers that broadcast pro-Regency messages and morale-boosting music across the plains. A prime target for Loyalist sabotage.","factionId":"mushroom_regency"},{"id":"poi_mp_cheep_cheep_lake","x":59.5,"y":36.0,"type":"waterfall","name":"Cheep Cheep Lake","description":"A large, clear lake that serves as a vital source of fresh water and food. However, it is infested with unusually large and aggressive Cheep Cheeps, making fishing a dangerous profession.","factionId":"unaligned"},{"id":"poi_mp_koopa_battlefield","x":52.0,"y":21.5,"type":"battlefield","name":"Forgotten Battlefield","description":"The site of a major battle from the First Koopa War, littered with the rusted shells and crumbling bones of fallen soldiers. The area is said to be haunted by their restless spirits.","factionId":"unaligned"},{"id":"poi_mp_windmill_station","x":43.0,"y":26.0,"type":"village","name":"Windmill Waystation","description":"A series of large windmills that power the irrigation systems for the surrounding farms. Controlling this waystation means controlling the region's food supply, making it a key strategic objective.","factionId":"unaligned"},{"id":"poi_mp_loyalist_hospital","x":46.5,"y":32.0,"type":"outpost","name":"Loyalist Field Hospital","description":"A makeshift but well-organized field hospital where Loyalist medics like Dewdrop tend to the wounded. It is fiercely defended and considered a sanctuary by Toadette's troops.","factionId":"peach_loyalists"},{"id":"poi_mp_warp_pipe_junction","x":54.0,"y":43.5,"type":"ley_line","name":"Warp Pipe Junction","description":"A major hub of interconnected Warp Pipes, some leading to other parts of the kingdom, others to stranger, unknown dimensions. Controlling it offers unparalleled strategic mobility.","factionId":"unaligned"},{"id":"poi_mp_yoshi_respite","x":64.0,"y":29.5,"type":"ruins","name":"Yoshi's Respite (Abandoned)","description":"A series of abandoned stables and race tracks, once home to a thriving community of Yoshis who fled during the war. Their colorful eggs can still sometimes be found in hidden nests.","factionId":"unaligned"},{"id":"poi_mp_weeping_grove","x":56.5,"y":42.0,"type":"forest","name":"The Weeping Grove","description":"A small, unnerving grove of willow-like trees that perpetually drip a sap that induces profound sorrow and despair in those who linger too long. Alchemists of the Onyx Hand are rumored to harvest it.","factionId":"unaligned"},{"id":"poi_mp_king_bobomb_perch","x":58.0,"y":20.5,"type":"lair","name":"King Bob-omb's Perch","description":"A high, flat-topped mesa where a rogue King Bob-omb has taken up residence. It considers itself the true monarch of the plains and occasionally lobs its subjects at passersby to assert its authority.","factionId":"unaligned"}];

/* global id index (wiki articles + trials) — populated by buildIndexes() after data loads */
const INDEX={};
let ALL_ITEMS=[];
const SEARCH_DOCS=[];
function buildIndexes(){
  // reset (in case of reload)
  for(const k of Object.keys(INDEX)) delete INDEX[k];
  SEARCH_DOCS.length=0;
  TYPES.forEach(t=>(DATA[t.key]||[]).forEach(it=>{ if(it&&it.id) INDEX[it.id]={typeKey:t.key,item:it}; }));
  ALL_ITEMS=Object.values(INDEX);
  // search docs: articles + congress votes + conflicts + major battles
  ALL_ITEMS.forEach(({typeKey,item})=>{
    const hay=[item.name,item.title,item.summary,item.type,item.affiliation,item.race,item.leader,item.era,item.location,item.region,item.defendant,item.prosecutor].filter(Boolean).join(' ').toLowerCase();
    SEARCH_DOCS.push({kind:'article',id:item.id,typeKey,name:displayName(item),summary:previewText(item,160),hay});
  });
  (DATA.congress_votes||[]).forEach(v=>SEARCH_DOCS.push({kind:'vote',id:v.id,typeKey:'congress',name:v.title,summary:v.description||'',hay:[v.title,v.description,v.category,v.proposedBy].filter(Boolean).join(' ').toLowerCase()}));
  Object.keys(DATA.conflicts||{}).forEach(name=>{const c=DATA.conflicts[name];SEARCH_DOCS.push({kind:'conflict',id:name,typeKey:'battlefield',name,summary:c.summary||'',hay:[name,c.summary,c.rootCause,c.status].filter(Boolean).join(' ').toLowerCase()});});
  (DATA.majorBattles||[]).forEach(b=>SEARCH_DOCS.push({kind:'majorbattle',id:b.id,typeKey:'battlefield',name:b.name,summary:b.description||'',hay:[b.name,b.description,b.location,b.conflict,b.outcome].filter(Boolean).join(' ').toLowerCase()}));
  const A=DATA.artifacts||{};
  (A.main_artifacts||[]).forEach(a=>SEARCH_DOCS.push({kind:'artifact',id:a.id,typeKey:'artifacts',name:a.name,summary:a.description||'',hay:[a.name,a.description,a.lore,(a.abilities||[]).join(' '),a.locations].filter(Boolean).join(' ').toLowerCase()}));
  Object.entries((INVENTORY_SYSTEM&&INVENTORY_SYSTEM.items)||{}).forEach(([iid,it])=>{ if(iid!=='hidden_item_slot') SEARCH_DOCS.push({kind:'invitem',id:iid,typeKey:'items',name:it.name,summary:it.summary||it.description||'',hay:[it.name,it.type,it.rarity,it.summary,it.description,(it.relatedArticles||[]).join(' ')].filter(Boolean).join(' ').toLowerCase()}); });
  const allBearers=(A.star_bearers||[]).concat(A.god_toad?[A.god_toad]:[]);
  allBearers.forEach(b=>SEARCH_DOCS.push({kind:'bearer',id:b.id,typeKey:'artifacts',name:(b.name||'')+(b.title?(' — '+b.title):''),summary:b.powers||'',hay:[b.name,b.title,b.species,b.element,b.powers,b.history,b.fragment_name].filter(Boolean).join(' ').toLowerCase()}));
  const CG=DATA.congress||{};
  (CG.members||[]).forEach(m=>SEARCH_DOCS.push({kind:'member',id:m.id,typeKey:'congress',name:m.name,summary:m.summary||'',hay:[m.name,m.bloc,m.status,m.delegate,m.summary,m.description].filter(Boolean).join(' ').toLowerCase()}));
  (CG.sessions||[]).forEach(s=>SEARCH_DOCS.push({kind:'session',id:s.id,typeKey:'congress',name:s.name,summary:s.summary||'',hay:[s.name,s.host,s.status,s.summary,s.description].filter(Boolean).join(' ').toLowerCase()}));
  (CG.crises||[]).forEach(c=>SEARCH_DOCS.push({kind:'crisis',id:c.id,typeKey:'congress',name:c.name,summary:c.summary||'',hay:[c.name,c.severity,c.status,c.summary,c.description].filter(Boolean).join(' ').toLowerCase()}));
  buildMonthOrd();
  buildBacklinks();
  buildAnnotations();
  buildDateRegex();
  buildLinkRegistry();
}

/* helpers */
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);
const displayName=it=>it.name||it.title||it.id;
/* Best available short preview: summary, else first sentence(s) of description (markdown/links stripped). */
function stripMd(s){return String(s||'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\*\*|\*|`|_/g,'').replace(/^#+\s*/gm,'').replace(/\s+/g,' ').trim();}
function previewText(it,max){max=max||200;let s=it.summary||it.powers||it.description||it.overview||'';s=stripMd(s);if(s.length>max){s=s.slice(0,max).replace(/\s+\S*$/,'')+'…';}return s;}
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
const readingTime=t=>Math.max(1,Math.round(words(t)/220));
function factionColor(id){ return FCOLORS[id]|| (INDEX[id]&&FCOLORS[id]) || '#8a4bff'; }
function prettyId(id){ const rec=INDEX[id]; if(rec)return displayName(rec.item); return String(id||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

/* mini markdown */
function slug(s){return 'h-'+String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

   Maps entity names + safe aliases -> {route, id, kind, preview}. Used to turn
   plain prose into inline hyperlinks with hover previews. */

let LINK_PREVIEW={};            // id -> {name, sub, summary, emoji, route}

let LINK_TOTAL_COUNT=0;        // per-render link counter used by low-link mode
const PREF_DEFAULTS={linkLevel:'normal',comments:true};
let PREFS=loadReaderPrefs();
function loadReaderPrefs(){
  try{const raw=localStorage.getItem('waluipedia-reader-prefs'); if(raw){return Object.assign({},PREF_DEFAULTS,JSON.parse(raw));}}catch(e){}
  return Object.assign({},PREF_DEFAULTS);
}
function saveReaderPrefs(){try{localStorage.setItem('waluipedia-reader-prefs',JSON.stringify(PREFS));}catch(e){}}
function prefToast(msg){
  let t=document.getElementById('settingsToast');
  if(!t){t=document.createElement('div');t.id='settingsToast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');clearTimeout(t._hide);t._hide=setTimeout(()=>t.classList.remove('show'),1400);
}
function setLinkLevel(level){
  if(!['low','normal','aggressive'].includes(level)) level='normal';
  PREFS.linkLevel=level;saveReaderPrefs();LINK_ONCE=new Set();LINK_TOTAL_COUNT=0;closeAnnotation();Router.render();
  prefToast('Hyperlinks: '+level);
}
function setComments(on){
  PREFS.comments=!!on;saveReaderPrefs();closeAnnotation();Router.render();
  prefToast(PREFS.comments?'Comments on':'Comments off');
}
function cycleLinkLevel(){const order=['low','normal','aggressive'];setLinkLevel(order[(order.indexOf(PREFS.linkLevel)+1)%order.length]);}
function copyCurrentLink(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>prefToast('Article link copied')).catch(()=>{prompt('Copy link',url);});}
  else prompt('Copy link',url);
}

function xpStats(articleId){ return (XP_SUMMARY&&XP_SUMMARY[articleId])||null; }
function xpUrl(articleId){ const x=xpStats(articleId); return x ? `xp.html#/player/${encodeURIComponent(x.xpKey)}` : 'xp.html'; }
function xpPill(articleId){ const x=xpStats(articleId); return x ? `<span class="pill xp-pill" title="${x.remainingXP.toLocaleString()} XP to Level ${x.level+1}">✦ XP Level ${x.level}</span>` : ''; }
function xpMiniPanel(articleId){
  const x=xpStats(articleId); if(!x) return '';
  const pct=x.nextXP>0?Math.min(100,(x.currentXP/x.nextXP)*100):0;
  return `<div class="xp-mini-panel"><h4>XP Ledger Link</h4><div class="xpbig">Level ${x.level}</div><div class="xpsub">${x.currentXP.toLocaleString()} / ${x.nextXP.toLocaleString()} XP · ${x.remainingXP.toLocaleString()} to Level ${x.level+1}</div><div class="xpbar"><span style="width:${pct}%"></span></div><div class="xpsub">${x.entryCount} ledger entries · Power ${x.powerLevel} · Fame ${x.fameScore}</div><a class="xplink" href="${xpUrl(articleId)}">Open full XP dossier →</a></div>`;
}

function autoArtKind(item,kind){

function safeAliases(name,kind){
  // Generate conservative aliases. Full name always included.
  // IMPORTANT: we do NOT create bare first-word aliases (that caused "Commander G" -> "Commander"
  // and "Raventree Manor" -> "Raventree operation" mismatches). Real nicknames are handled via
  // manual [text](id) links in the JSON instead.
  const out=new Set([name]);
  let n=name.trim();
  // "The Iron Legion" -> also "Iron Legion" (drop a leading article; keep it specific)
  if(/^the\s+/i.test(n)){ const dropped=n.replace(/^the\s+/i,''); if(dropped.length>=5) out.add(dropped); }
  // Title-prefix aliases: strip a leading honorific to expose the person's name (people only).
  // e.g. "Princess Peach" -> "Peach", "General Ironhand" -> "Ironhand". The stripped remainder
  // must itself be a real multi-letter name (>=5 chars) to be kept.
  if(kind==='article' || kind==='bearer'){
    const TITLES=/^(princess|prince|king|queen|general|captain|commander|admiral|chancellor|chief|lord|lady|sir|dame|doctor|professor|master|elder|judge)\s+/i;
    if(TITLES.test(n)){ const bare=n.replace(TITLES,'').trim(); if(bare.length>=5) out.add(bare); }
  }
  // strip trailing " — Full Record" / " (Suspected)" style suffixes -> shorter canonical name
  out.add(n.replace(/\s*[—(].*$/,'').trim());
  // final filter: min length 5, not stoplisted, and never a single generic word
  const SINGLE_GENERIC=new Set(['iron','shadow','star','dark','general','captain','commander','admiral','king','queen','prince','council','order','house','city','guild','legion','empire','crown','kingdom','land','people','battle','siege','manor','tower','tree','grove','estate','raventree']);
  return [...out].filter(a=>{
    if(!a) return false;
    const low=a.toLowerCase();
    if(low.length<5 && low!=='usk') return false;
    if(LINK_STOP.has(low)) return false;
    if(!/\s/.test(a) && SINGLE_GENERIC.has(low)) return false; // single generic word
    return true;
  });
}
function buildLinkRegistry(){
  LINK_ENTRIES=[]; LINK_PREVIEW={};
  // Priority: when several entities claim the same alias, the higher-priority one wins the link.
  // Wiki articles (real pages) outrank congress delegations, votes, etc.
  const PRI={ article:100, nation:95, artifact:80, invitem:76, bearer:78, conflict:70, majorbattle:68, member:40, session:38, crisis:36, vote:30 };
  const claims={}; // aliasLower -> [{id,kind,name,exact,pri}]
  const add=(name,id,kind,typeKey,summary,sub)=>{
    if(!name||!id)return;
    LINK_PREVIEW[id]={name, sub:sub||'', summary:(summary||'').slice(0,220), emoji:kindEmoji(kind,typeKey), route:routeForKind(kind,id), kind};
    safeAliases(name,kind).forEach(a=>{
      const key=a.toLowerCase();
      (claims[key]=claims[key]||[]).push({id,kind,name:a,exact:(key===name.trim().toLowerCase()),pri:(PRI[kind]||10)});
    });
  };
  // wiki articles (characters/factions/events/battles/locations/races/nations/collections/trials)
  TYPES.forEach(t=>(DATA[t.key]||[]).forEach(it=>add(displayName(it),it.id, t.key==='nations'?'nation':'article', t.key, previewText(it,220), it.title)));
  // congress
  const CG=DATA.congress||{};
  (CG.members||[]).forEach(m=>add(m.name,m.id,'member',null,m.summary,m.bloc));
  (CG.sessions||[]).forEach(s=>add(s.name,s.id,'session',null,s.summary,s.date));
  (CG.crises||[]).forEach(c=>add(c.name,c.id,'crisis',null,c.summary,c.severity));
  (DATA.congress_votes||[]).forEach(v=>add(v.title,v.id,'vote',null,v.description,('Vote #'+v.number)));
  // public inventory items
  Object.entries((INVENTORY_SYSTEM&&INVENTORY_SYSTEM.items)||{}).forEach(([iid,it])=>{ if(iid!=='hidden_item_slot') add(it.name,iid,'invitem',null,it.summary||it.description,it.rarity||it.type); });
  // battlefield
  Object.keys(DATA.conflicts||{}).forEach(name=>{const c=DATA.conflicts[name];add(name,name,'conflict',null,c.summary,c.status);});
  (DATA.majorBattles||[]).forEach(b=>add(b.name,b.id,'majorbattle',null,b.description,b.date));
  // artifacts + bearers
  const A=DATA.artifacts||{};
  (A.main_artifacts||[]).forEach(a=>add(a.name,a.id,'artifact',null,a.description,a.rarity));
  (A.star_bearers||[]).concat(A.god_toad?[A.god_toad]:[]).forEach(b=>add(b.name,b.id,'bearer',null,b.powers,b.title));
  // Resolve each alias to a single winner: highest priority, then exact-name, then longest name.
  const entries=[];
  Object.keys(claims).forEach(key=>{
    if(LINK_STOP.has(key)) return;
    const cands=claims[key];
    cands.sort((a,b)=> b.pri-a.pri || (b.exact?1:0)-(a.exact?1:0) || b.name.length-a.name.length);
    const top=cands[0];
    // Ambiguity guard: if the top two are the SAME priority, NEITHER is an exact-name match,
    // and they point to different targets, the alias is genuinely ambiguous -> skip it.
    if(cands.length>1 && cands[1].pri===top.pri && !top.exact && cands[1].id!==top.id) return;
    entries.push({id:top.id, kind:top.kind, name:top.name});
  });
  // Match longer aliases before shorter ones so "The Mushroom Kingdom" is consumed before "Mushroom Kingdom".
  entries.sort((a,b)=>b.name.length-a.name.length);
  entries.forEach(e=>{
    const pat='\\b'+e.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b';
    try{ LINK_ENTRIES.push({re:new RegExp(pat), id:e.id, route:routeForKind(e.kind,e.id)}); }catch(_){}
  });
}

/* Turn already-escaped inline HTML into linked HTML.
   currentId = the article being viewed (skip self-links). Runs on paragraph text only. */
/* Date regex, built from the calendar months + aliases. Matches things like:
   "Efferd 26th", "26th Efferd", "Highsun 1-4", "Harvestside 15", "955 BF", "Day 21". */
let DATE_RE=null;
function buildDateRegex(){
  const monthWords=Object.keys(MONTH_ORD||{}).filter(w=>w.length>3); // month names + aliases (skip short abbrevs)
  if(!monthWords.length){ DATE_RE=null; return; }
  const months='(?:'+monthWords.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')';
  // month+day, day+month, "Day N", or bare "NNN BF"
  const pat=[
    months+'\\s+\\d{1,2}(?:st|nd|rd|th)?(?:\\s*[-–]\\s*\\d{1,2}(?:st|nd|rd|th)?)?', // Efferd 26th / Highsun 1-4
    '\\d{1,2}(?:st|nd|rd|th)?\\s+'+months,                                          // 26th Efferd
    '\\bDay\\s+\\d{1,2}(?:\\s*[-–]\\s*\\d{1,2})?\\b',                                // Day 21 / Day 20-21
    '\\b\\d{3,4}\\s*BF\\b'                                                           // 955 BF
  ].join('|');
  try{ DATE_RE=new RegExp('('+pat+')','gi'); }catch(_){ DATE_RE=null; }
}
function linkify(escapedHtml, currentId){
  if(!escapedHtml) return escapedHtml;
  // Split on existing tags so we never inject links inside <strong>/<em>/<code>/attributes.
  const parts=escapedHtml.split(/(<[^>]+>)/);
  let insideAnchor=false;                         // track existing <a>…</a> (manual links) to avoid double-linking
  for(let i=0;i<parts.length;i++){
    const seg0=parts[i];
    if(seg0.startsWith('<')){
      if(/^<a\b/i.test(seg0)) insideAnchor=true;
      else if(/^<\/a>/i.test(seg0)) insideAnchor=false;
      continue;                                    // leave tags untouched
    }
    if(insideAnchor) continue;                     // don't re-link text already inside a manual link
    // 1) entity links. Work on plain-text pieces and re-split after each match so a later
    //    (shorter) alias can NEVER match text inside an anchor an earlier (longer) alias just made.
    //    This fixes "The Iron Legion" splitting into <a>The </a><a>Iron Legion</a>.
    //    Each entity is linked only ONCE per article (first mention) via LINK_ONCE.
    let pieces=[seg0];
    const linkMode=(PREFS&&PREFS.linkLevel)||'normal';
    const lowCap=10;
    for(const ent of LINK_ENTRIES){
      if(ent.id===currentId) continue;            // never self-link
      if(linkMode==='low' && LINK_TOTAL_COUNT>=lowCap) break;
      if(linkMode!=='aggressive' && LINK_ONCE.has(ent.id)) continue; // normal/low: first mention only
      const next=[]; let done=false;
      for(const piece of pieces){
        if(piece.startsWith('<') || (linkMode!=='aggressive' && done)){ next.push(piece); continue; } // inserted anchor/tag or already linked once
        let last=0, out='', mm;
        const g=new RegExp(ent.re.source, ent.re.flags.includes('g')?ent.re.flags:ent.re.flags+'g');
        while((mm=g.exec(piece))!==null){
          if(linkMode==='low' && LINK_TOTAL_COUNT>=lowCap) break;
          out+=piece.slice(last,mm.index);
          out+='\u0001<a class="xlink" data-id="'+esc(ent.id)+'" href="'+ent.route+'">'+mm[0]+'</a>\u0001';
          last=mm.index+mm[0].length;
          LINK_TOTAL_COUNT++;
          if(linkMode!=='aggressive'){ done=true; LINK_ONCE.add(ent.id); break; } // normal/low: one per entity per article
        }
        out+=piece.slice(last);
        out.split('\u0001').forEach(p=>{ if(p) next.push(p); });
      }
      pieces=next;
    }
    let seg=pieces.join('');
    // 2) date links -> Timeline. Run AFTER entity links, and skip any text now inside an <a> we just made.
    if(DATE_RE){
      const sub=seg.split(/(<[^>]+>)/); let inA=false;
      for(let k=0;k<sub.length;k++){
        if(sub[k].startsWith('<')){ if(/^<a\b/i.test(sub[k]))inA=true; else if(/^<\/a>/i.test(sub[k]))inA=false; continue; }
        if(inA) continue;
        sub[k]=sub[k].replace(DATE_RE, m=>{
          if(linkMode==='low' && LINK_TOTAL_COUNT>=lowCap) return m;
          const y=parseYear(m) || LINK_YEAR_CTX || CUR.year; // date strings w/o a year default to the article's year context / current
          const mo=parseMonth(m);
          const route = mo&&mo<99 ? `#/year/${y}/${mo}` : `#/year/${y}`;
          LINK_TOTAL_COUNT++;
          return `<a class="xlink datelink" data-date="1" data-year="${y}"${mo&&mo<99?` data-month="${mo}"`:''} href="${route}">${m}</a>`;
        });
      }
      seg=sub.join('');
    }
    parts[i]=seg;
  }
  return parts.join('');
}

function inlineMd(t,opts){
  t=esc(t);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Manual markdown links written in the JSON: [visible text](target_id) or full wiki URL ending in #/article/target_id.
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,text,target)=>{
    const tm=String(target).match(/#\/article\/([a-zA-Z0-9_:-]+)/);
    const tid=tm?tm[1]:target;
    const p=LINK_PREVIEW[tid];
    if(p){ LINK_ONCE.add(tid); return `<a class="xlink" data-id="${esc(tid)}" href="${p.route}">${text}</a>`; }
    if(/^https?:\/\//i.test(target)) return `<a href="${esc(target)}" target="_blank" rel="noopener">${text}</a>`;
    return text;
  });
  if(opts&&opts.link){ t=linkify(t,opts.currentId); }
  return t;
}
function mdToHtml(md,linkCtx){
  if(!md)return'';const lines=md.replace(/\r/g,'').split('\n');let html='',para=[],quote=[];
  const opt=linkCtx?{link:true,currentId:linkCtx}:null;
  // Pre-register every manual-link target so the auto-linker won't also link that entity elsewhere.
  if(opt){ let mm2; const re2=/\[[^\]]+\]\(([^)]+)\)/g; while((mm2=re2.exec(md))!==null){ const tm=String(mm2[1]).match(/#\/article\/([a-zA-Z0-9_:-]+)/); const tid=tm?tm[1]:mm2[1]; if(LINK_PREVIEW[tid]) LINK_ONCE.add(tid); } }
  const fp=()=>{if(para.length){html+='<p>'+inlineMd(para.join(' '),opt)+'</p>';para=[];}};
  const fq=()=>{if(quote.length){html+='<blockquote>'+inlineMd(quote.join(' '))+'</blockquote>';quote=[];}}; // no links inside summary/quote
  for(const raw of lines){const line=raw.trimEnd();
    if(/^###\s+/.test(line)){fp();fq();const t=line.replace(/^###\s+/,'');html+='<h3 id="'+slug(t)+'">'+inlineMd(t)+'</h3>';continue;}
    if(/^##\s+/.test(line)){fp();fq();const t=line.replace(/^##\s+/,'');html+='<h2 id="'+slug(t)+'">'+inlineMd(t)+'</h2>';continue;}
    if(/^>\s?/.test(line)){fp();quote.push(line.replace(/^>\s?/,''));continue;}
    if(line.trim()===''){fp();fq();continue;}
    fq();para.push(line);}
  fp();fq();return html;
}

function headings(md){if(!md)return[];const out=[];md.split('\n').forEach(l=>{let m;if((m=l.match(/^##\s+(.+)/)))out.push({level:2,text:m[1].trim()});else if((m=l.match(/^###\s+(.+)/)))out.push({level:3,text:m[1].trim()});});return out;}

/* =============== SEARCH (SEARCH_DOCS built in buildIndexes after data loads) =============== */
const SEARCH_META={article:t=>TYPE_BY_KEY[t]?TYPE_BY_KEY[t].emoji:'📄',vote:()=>'🏛️',conflict:()=>'💥',majorbattle:()=>'🗡️',artifact:()=>'⭐',invitem:()=>'🎒',bearer:()=>'✴️',member:()=>'🏳️',session:()=>'📋',crisis:()=>'⚠️'};
function searchTypeLabel(d){ if(d.kind==='article')return TYPE_BY_KEY[d.typeKey].singular; if(d.kind==='vote')return 'Congress Vote'; if(d.kind==='conflict')return 'Conflict'; if(d.kind==='majorbattle')return 'Battle'; if(d.kind==='artifact')return 'Artifact'; if(d.kind==='invitem')return 'Item'; if(d.kind==='bearer')return 'Star Bearer'; if(d.kind==='member')return 'Congress Member'; if(d.kind==='session')return 'Congress Session'; if(d.kind==='crisis')return 'Congress Crisis'; return ''; }
function search(q){
  q=q.trim().toLowerCase(); if(!q)return[];
  const terms=q.split(/\s+/);const out=[];
  for(const d of SEARCH_DOCS){let score=0,ok=true;
    for(const t of terms){const inName=d.name.toLowerCase().includes(t),inHay=d.hay.includes(t);
      if(!inName&&!inHay){ok=false;break;}
      if(d.name.toLowerCase()===t)score+=120;if(d.name.toLowerCase().startsWith(t))score+=40;if(inName)score+=30;if(inHay)score+=6;}
    if(ok){if(d.name.toLowerCase()===q)score+=200;out.push({...d,score});}}

const searchInput=el('search'),resultsBox=el('results');let activeIdx=-1,currentResults=[];
function renderResults(list,q){
  currentResults=list;activeIdx=-1;

const listState={};
function typeFilterField(k){return {characters:'affiliation',factions:'type',events:'era',battles:'type',locations:'region',races:'type',nations:'type',collections:'type',trials:'status'}[k];}
/* Normalize a messy field value into a clean, groupable filter label.
   The raw value is still shown on the tile/article; only the filter chip is normalized. */
function filterGroup(key, item){
  const field=typeFilterField(key);
  let raw=item[field];
  if(raw==null||raw==='') return null;
  raw=String(raw);
  // 1) take the primary segment before the first separator ( / , — , –, " - ", ";", ",")
  let g=raw.split(/\s*(?:\/|—|–|;|,| - )\s*/)[0];
  // 2) strip parentheticals and trailing qualifiers
  g=g.replace(/\s*\(.*$/,'').replace(/\s*\[.*$/,'').trim();
  // 3) collapse "Formerly X ..." / "Former X" to X
  g=g.replace(/^Formerly\s+/i,'').replace(/^Former\s+/i,'').trim();
  // 4) per-type cleanup
  if(key==='trials'){
    if(/^Concluded/i.test(raw)) return 'Concluded';
    if(/Ongoing|Charged|At Large/i.test(raw)) return 'Ongoing';
    return g||'Other';
  }
  if(key==='locations'){
    const r=raw.toLowerCase();
    if(/feywild|feyward|overgrown/.test(r)) return 'The Feywild';
    if(/shadowfell|shadow estate|shadeward|mirror/.test(r)) return 'The Shadowfell';
    if(/midland/.test(r)) return 'The Midlands';
    if(/dreamland/.test(r)) return 'Dreamland';
    if(/mushroom kingdom|toad town|central/.test(r)) return 'Mushroom Kingdom';
    if(/eastern/.test(r)) return 'Eastern Territories';
    if(/coastal|isle|delfino|bay/.test(r)) return 'Coastal / Isles';
    if(/airborne|airship/.test(r)) return 'Airborne';
    if(/contested/.test(r)) return 'Contested Territories';
    if(/interplanar|dimensional|astral|nexus/.test(r)) return 'Interplanar / Dimensional';
  }
  if(key==='characters'){
    if(/^Disaster Inc\.?/i.test(g)) return 'Disaster Inc.';
    if(/liberated toad/i.test(g)) return 'Liberated Toads';
    if(/koopa/i.test(g)) return 'Koopa Troop';
    if(/iron legion/i.test(g)) return 'Iron Legion';
    if(/mages'? guild/i.test(g)) return "Mages' Guild";
    if(/onyx hand|corvinarus|shadow estate/i.test(g)) return 'Onyx Hand / Shadow';
    if(/fawful/i.test(g)) return "Fawful's Forces";
    if(/regency|mushroom kingdom/i.test(g)) return 'Mushroom Regency';
    if(/loyalist/i.test(g)) return 'Peach Loyalists';
    if(/rakasha|rakka/i.test(g)) return 'Rakasha';
  }
  if(key==='races'){
    // keep the broad category word before any qualifier already handled; title-case tidy
    g=g.replace(/\s+Entities?$/i,'').replace(/\s+Humanoid$/i,' Humanoid');
  }
  return g||'Other';
}

function view_list(key){

/* Waluigi's Tally Board — a Congress vote rendered as bars + per-bloc breakdown. */
function congressTallyBoard(v){
  const y=v.yea||0,n=v.nay||0,a=v.abstain||0,tot=y+n+a||1;
  const bar=(label,val,color)=>{const pct=Math.round(val/tot*100);return `<div class="tally-row"><span class="tlabel">${label}</span><div class="tally-track"><div class="tally-fill" style="width:${Math.max(val?6:0,pct)}%;background:${color}">${val?(pct+'%'):''}</div></div><span class="tnum">${val}</span></div>`;};
  let blocHtml='';
  const vb=v.votingBreakdown;
  if(vb && typeof vb==='object' && !Array.isArray(vb)){
    const groups=[['notable_yea','Voted Yea','var(--green)'],['notable_nay','Voted Nay','var(--danger)'],['notable_abstain','Abstained','var(--muted)']];
    const cards=groups.filter(([k])=>Array.isArray(vb[k])&&vb[k].length).map(([k,label,col])=>
      `<div class="bloc-card" style="border-left:3px solid ${col}"><h6 style="color:${col}">${label} (${vb[k].length})</h6><div class="b-list">${vb[k].map(x=>esc(String(x))).join(' · ')}</div></div>`).join('');
    if(cards) blocHtml=`<div class="bloc-grid">${cards}</div>`;
  }
  const passed=/pass/i.test(v.result||'');
  return `<div class="wsys"><div class="wsys-title">🗳️ Waluigi's Tally Board</div>
    <div class="wsys-note">The chamber's arithmetic, laid bare. ${passed?'It passed':'It failed'}${v.required?` (needed ${v.required})`:''}. Waluigi counted twice; the numbers refuse to improve.</div>
    <div class="tally-board">${bar('Yea',y,'var(--green)')}${bar('Nay',n,'var(--danger)')}${bar('Abstain',a,'var(--muted)')}</div>
    ${blocHtml}</div>`;
}

/* Waluigi's Order of Battle — a VS infographic for a battle's belligerents + casualties + outcome. */
function battleVsInfographic(b){
  const bel=b.belligerents;
  if(!bel || typeof bel!=='object' || Array.isArray(bel) || !(bel.attackers||bel.defenders)) return '';
  const side=(s,cls,role)=>{ if(!s)return `<div class="vs-side ${cls}"><h5>${role}</h5><div class="vs-cmd">Unknown</div></div>`;
    const nm=s.name||s.faction||'Unknown';

    return `<div class="vs-side ${cls}"><h5>${link}</h5>${s.commander?`<div class="vs-cmd">⚔ ${esc(s.commander)}</div>`:''}</div>`;
  };
  let cas='';
  if(b.casualties&&typeof b.casualties==='object'){

    if(b.casualties.defenders)parts.push(`<b style="color:var(--green)">Defenders:</b> ${esc(String(b.casualties.defenders).slice(0,120))}`);

  return `<div class="wsys"><div class="wsys-title">⚔️ Waluigi's Order of Battle</div>

/* Waluigi's Web of Association — an SVG hub-and-spoke of an entity's connections (allies/enemies/related/events). */
/* Reverse-reference index: id -> Set of ids that point at it (for richer relation webs). */
let BACKLINKS={};
function buildBacklinks(){
  BACKLINKS={};
  const link=(from,toId)=>{ if(!toId||!INDEX[toId])return; (BACKLINKS[toId]=BACKLINKS[toId]||new Set()).add(from); };
  const scan=(it)=>{
    const from=it.id; if(!from)return;
    ['relatedArticles','keyEvents','keyBattles','articles','allies','enemies'].forEach(fld=>{
      (it[fld]||[]).forEach(r=>{const id=typeof r==='string'?r:(r&&r.id);link(from,id);});
    });
    // battle belligerents -> factions
    if(it.belligerents&&typeof it.belligerents==='object'){
      ['attackers','defenders'].forEach(k=>{const s=it.belligerents[k];if(s&&s.factionId)link(from,s.factionId);});
    }
    // participating characters (major battles / events)
    (it.participatingCharacters||[]).forEach(id=>link(from,id));
    (it.participants||[]).forEach(p=>{const id=typeof p==='string'?p:(p&&p.id);link(from,id);});
  };
  TYPES.forEach(t=>(DATA[t.key]||[]).forEach(scan));
  (DATA.majorBattles||[]).forEach(scan);
}
/* Node type -> {emoji,color} for classifying web nodes by what they ACTUALLY are. */
