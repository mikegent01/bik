<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Chronicle of Battles</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="battlefield.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 
                 <!-- NEW: Tab Controls -->
                 <div class="view-controls">
                    <button class="view-btn active" data-target="battles">Tactical Log</button>
                    <button class="view-btn" data-target="conflicts">Active Conflicts</button>
                 </div>

                 <!-- Battle Log Container (Default) -->
                 <div id="battlefield-container" class="view-section active">
                    <!-- Battle information injected by JS -->
                 </div>

                 <!-- Conflicts Container (Hidden by default) -->
                 <div id="conflicts-container" class="view-section" style="display: none;">
                    <!-- Conflict dossiers injected by JS -->
                 </div>
            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="battlefield.js"></script>
</body>
</html>
