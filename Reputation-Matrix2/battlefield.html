ee_manor",excerpt:"Raventree Manor is a architectural disaster that exists in three places at once, which is very confusing for real estate value. It has a 'Shadow' version (too dark), a 'Feywild' version (too many plants), and a 'Material' version (full of ghosts). I got stuck in a bear trap here! 0/5 Stars. Would not loot again."},ff=["...that Archie Miser calls himself 'Darman Knightly' in the Shadowfell? It's the stupidest name I've ever heard. Also, he cut off a guy's finger!","...that the Airship was full of Toads in barrels? The Iron Legion calls it 'Trafficking,' Wario calls it 'Efficient Packaging.' Potay-to, Potah-to.","...that the Dragon War is a total scam? The Empire uses sound waves to fake it! I respect the hustle, but they owe me royalties for the idea.","...that Green T shot a Vampire Lord at dinner? Very rude! I hadn't even finished stealing the silverware yet!","...that Markop turned into a giant to wrestle a spider? Show-off! I was casting ice magic to help, but nobody clapped for me!","...that I froze Eager solid with a 'Cone of Cold'? It wasn't an accident, it was 'Cryogenic Preservation'! He should thank me!","...that Hjumpik smashed our airship with an axe? Who gives an axe to a guy with anger issues?! Now we have to walk!","...that Wario priced a Star Rod at 900 trillion coins? That is a very fair market price. No low-ball offers! I know what I have!","...that the Oracle keeps bodies in tanks? Disgusting! Science is for nerds who can't get rich honest ways (like stealing).","...that Wario gave Remi a bomb as a welcome gift? It's called 'Initiation'! If she can't survive an explosion, she can't work in customer service!"],pf=["955 BF — Princess Peach takes a permanent nap. Everyone is still crying about it. Get over it!","1035 BF — The Iron Legion starts ruining everyone's fun with 'laws' and 'taxes'.","1040 BF — We killed a dragon! Well, *they* did, but I provided moral support (and looted the hoard).","1040 BF — The Planar Fracture happens. e:{color:"#4B0082"},children:'"Wah! Waluigi note that this encyclopedia is number one! Unlike that fake Toadopedia. WAH!"'}),l.jsx("p",{className:"text-xs mt-2",style:{color:"#54595D"},children:"Waluipedia is maintained by a dedicated community of WAH-enthusiasts committed to documenting the complete history of the Mushroom Kingdom, the Midlands, and all known realms."}),l.jsxs("div",{className:"mt-3 p-2 rounded text-xs",style:{background:"#F8F0FF",border:"1px solid #D8BFE6"},children:[l.jsx("b",{children:"Current stats:"})," 23 articles · 9 battles documented · 10 factions catalogued · ∞ WAH"]})]})]})]})]})]})}const Yo=JSON.parse(`[{"id":"disaster_inc","name":"Disaster Inc.","title":"Portal-Lost Menaces","type":"Adventuring Party / Walking Catastrophe","region":"Everywhere (unfortunately)","status":"Fragmented across multiple dimensions","leader":"Nobody (that's the problem)","headquarters":"Formerly the Vigilance, currently scattered across reality","motto":"We didn't mean to break it","affiliation":"Independent","allies":["liberated_toads","wario_enterprise"],"enemies":["iron_legion","fawful_forces"],"summary":"Disaster Inc. is less a disciplined organization and more a collision of dangerous personalities held together by shared trauma and the fact that nobody else will have them. Waluigi has fought alongside these people, been scattered across dimensions with these people, and been nearly killed by these people's decisions more times than he can count. They are chaotic, unpredictable, occasionally brilliant, and the single most destructive force in the Mushroom Kingdom that isn't actively trying to conquer it. The name 'Disaster Inc.' was not chosen ironically.","description":"Waluigi wants to be clear about something: Disaster Inc. is not a faction in the traditional sense. The Iron Legion is a faction. The Peach Loyalists are a faction. Those groups have STRUCTURE. They have chains of command. They have MEETINGS where people sit in chairs and discuss OBJECTIVES. Disaster Inc. has Archie Miser setting things on fire and everyone else trying to survive the consequences.\\n\\nThe group's core members include Archie Miser (fire mage, pyromaniac, diplomatic liability), Hjumpik (Waluigi respects Hjumpik's work ethic even if he doesn't fully understand Hjumpik's motivations), Markop (who accepted a blessing from the Oracle and grew to TITAN SIZE during the Spider Grove battle, which Waluigi has to admit was extremely cool), and Remi (FNG who has repeatedly proven herself tougher than her newcomer status suggests—she held the line against the Arachnid Matriarch with a mechanical dog and sheer determination while Waluigi was clearing paths with ice magic).\\n\\nThe rotating cast of allies, associates, and people-who-happened-to-be-nearby includes Waluigi himself, which Waluigi has MIXED feelings about. On one hand, being associated with this group means being associated with chaos, property damage, and diplomatic incidents. On the other hand, these are the people who banished a giant spider, survived vampire dinner parties, and kept fighting when the Iron Legion, the Mages' Guild, and REALITY ITSELF were working against them. Waluigi respects that. Waluigi LIVES that.\\n\\n## History\\n\\nDisaster Inc.'s recent history reads like a list of things that should not have happened but DID. They killed the dragon Ignis, which sounds heroic until you learn about the collateral damage. They dismantled smuggling rings aboard the Vigilance, which sounds noble until you learn that the dismantling involved fireballs in confined spaces. They survived the betrayal of X.O., who turned out to be working against them the entire time—a revelation that surprised everyone except Waluigi, who has TRUST ISSUES and is therefore always prepared for betrayal.\\n\\nThe group became central to the Raventree Manor crisis almost by accident. They were investigating the manor's supernatural phenomena when the Oracle attempted a synchronization ritual that shattered local reality into three planar fragments. This was NOT Disaster Inc.'s fault—it was the Oracle's ritual and Archie's unstable magic that caused the fracture—but the group ended up bearing the consequences. Archie and Bowser were cast into the Shadowfell to deal with vampires. Waluigi and Toad Lee were thrown into the Feywild to deal with fairy courts. Markop, Remi, and the Oracle vanished into the Deep Mirror to deal with collapsing reality.\\n\\nThe fact that the group name is 'Disaster Inc.' and they LITERALLY SHATTERED REALITY is the kind of on-the-nose irony that makes Waluigi want to scream into a pillow.\\n\\n## Current Status\\n\\nDisaster Inc. is currently fragmented across multiple dimensions with no reliable means of communication or transit between fragments. Each sub-group faces unique threats: vampires in the Shadowfell, fey politics in the Feywild, temporal decay in the Deep Mirror, and Iron Legion occupation in the physical world.\\n\\nThe remarkable thing—and Waluigi is genuinely surprised to be writing this—is that nobody has given up. Every fragment of the group is still fighting, still planning, still trying to reunite and fix what was broken. Waluigi has been part of many teams in his life (usually because he was the LAST pick) and most of them would have collapsed under a fraction of this pressure. Disaster Inc. keeps going. Whether that's determination or stubbornness or simply not knowing when to quit, Waluigi isn't sure. But he respects it.\\n\\nWaluigi respects it a LOT, actually, and he would appreciate it if nobody told the others he said that. WAH.","keyEvents":["tea_party_incident","spider_grove_battle","planar_fracture","dinner_climax_vote"],"relatedArticles":["archie_miser","raventree_manor","vigilance","the_oracle"]},{"id":"liberated_toads","name":"Liberated Toads","title":"Survivors of the Vigilance","type":"Refugee / Resistance Faction","region":"Formerly the Vigilance, now dispersed","status":"Active but devastated by Order 120","leader":"Speaker L (radicalized), Dan (moderate voice)","headquarters":"None — lost with the Vigilance","motto":"We survive because we must","affiliation":"Anti-Legion coalition","allies":["disaster_inc","pond_patrol"],"enemies":["iron_legion","fawful_forces"],"summary":"The Liberated Toads are what happens when ordinary people get caught between empires and survive anyway. Over 150 trafficked toads were found hidden in barrels across the Vigilance—BARRELS, like cargo, like OBJECTS—and the community that formed from those survivors became one of the most important factions in the entire crisis. Waluigi has complicated feelings about the Liberated Toads because watching good people suffer while powerful people play political games makes Waluigi ANGRY in a way that goes deeper than his usual anger, which is saying something because Waluigi's usual anger is SUBSTANTIAL.","description":"The discovery of the barrel toads was one of the moments that changed everything aboard the Vigilance. Over 150 toads, individually packed into barrels, hidden throughout the ship as part of a trafficking operation so methodical and so dehumanizing that even WARIO was disturbed, and Wario's moral compass points toward whatever direction has the most coins.\\n\\nWaluigi was there when the first barrels were opened. He saw the condition those toads were in. He doesn't talk about it much because some things don't get better by talking about them. What he WILL say is that anyone who traffics people in barrels deserves whatever comes to them, and Waluigi's definition of 'whatever' is more creative than most people's.\\n\\n## Formation and Early Days\\n\\nThe Liberated Toads formed organically—not as a political movement or a military force, but as a community of survivors trying to figure out what happens NEXT when 'next' isn't something anyone planned for. They had been cargo. Now they were people again. The transition was not smooth.\\n\\nLeadership coalesced around two poles: Speaker L, who pushed for organization, accountability, and structured response to threats; and Dan, who advocated for collective survival strategies, caution, and not rushing into fights that the faction couldn't win. The tension between these approaches defined the faction's internal politics. Speaker L wanted to BUILD something—a movement, a force, a power that could protect its people. Dan wanted to SURVIVE—to keep heads down, gather resources, and not attract the attention of factions that could crush them.\\n\\nWaluigi understands both positions. Waluigi has been the smallest person in the room his entire life—not physically, Waluigi is quite tall, but in terms of POWER and RESPECT. When you're small and the world is full of Bowsers and Iron Legions, you have to choose: do you fight or do you hide? The Liberated Toads never fully resolved this question, and the Iron Legion eventually made the choice FOR them in the worst possible way.\\n\\n## The Scavenging Doctrine\\n\\nThe Scavenging Doctrine vote was an internal referendum on survival strategy. Dan pushed for a collective approach—shared resources, coordinated scavenging, mutual support. The doctrine passed, which temporarily shifted the faction toward Dan's more cautious philosophy. Waluigi voted in favor because—and this surprised even Waluigi—he actually CARED about whether these people survived. Waluigi is not accustomed to caring about factions. Waluigi is accustomed to caring about WALUIGI. But the Liberated Toads were different. They weren't playing political games. They weren't trying to conquer territory or accumulate power. They were just trying to NOT DIE, and Waluigi found that he respected that more than he respected any empire.\\n\\n## Infiltration and Betrayal\\n\\nThe faction was repeatedly targeted by outside forces. The Iron Legion infiltrated their networks. The Green Decoy—a duplicate posing as Speaker L—was discovered operating within Legion territory, revealing that the intelligence war between the Toads and the Legion was deeper and dirtier than anyone realized. The Toads' greatest vulnerability was their openness: they accepted survivors, they trusted people who said they needed help, and this trust was exploited by factions with more resources and fewer scruples.\\n\\nBones—one of the most capable Toad operatives—went undercover inside the Iron Legion after the fall of the Vigilance. His infiltration of Aegis Command was brilliant, dangerous, and ultimately catastrophic. When he was caught, General Ironhand used the security breach as justification for Order 120.\\n\\n## Order 120 and Its Aftermath\\n\\nWaluigi has written about Order 120 in detail in the battle article for the Massacre at Aegis Command. He does not want to write about it again in full. The summary is: General Ironhand ordered the immediate execution of ALL Toad prisoners in Iron Legion custody. Every single one. People who had surrendered. People who were in cells. People who had been processed through the Legion's own bureaucracy and assigned case numbers.\\n\\nThe effect on the Liberated Toads was devastating beyond the casualty count. Speaker L transformed. The measured political leader who built coalitions and negotiated compromises became a war leader driven by grief and iron purpose. He began chanting war anthems. He vowed to hunt the Green Decoy. The part of him that believed in a negotiated future died alongside the prisoners.\\n\\nDan's moderate voice was drowned out—not because Dan was wrong, but because Order 120 proved that caution couldn't protect people from a faction willing to murder prisoners as an administrative decision. How do you argue for keeping your head down when the Legion kills people whose heads are ALREADY down?\\n\\nWaluigi watches the Liberated Toads now and sees a faction that has been through more than any group of people should have to endure. Trafficked. Freed. Organized. Infiltrated. Besieged. Massacred. Still standing. Still fighting. Waluigi doesn't know if they'll survive what's coming. But he knows they deserve to, and that has to count for something. WAH.","keyEvents":["iron_sky_breach","massacre_aegis","siege_raventree"],"relatedArticles":["speaker_l","iron_legion","vigilance"]},{"id":"iron_legion","name":"Iron Legion","title":"The Midlands War Machine","type":"Military State / Imperial Power","region":"The Midlands, expanding into Mushroom Kingdom territories","status":"Expanding emergency authority","leader":"General Ironhand","headquarters":"Aegis Command","motto":"Order Through Compliance","affiliation":"Regal Empire / Midlands state apparatus","allies":[],"enemies":["liberated_toads","disaster_inc","tea_leaf_syndicate"],"summary":"The Iron Legion is the faction Waluigi hates most, and Waluigi has a COMPREHENSIVE hate list organized by category, severity, and whether the target has ever personally insulted his hat. The Legion is a former mercenary company that evolved into a military superpower with the moral compass of a filing cabinet. They are ruthless, efficient, bureaucratic, and treat human beings as logistical variables. They stole the Vigilance, murdered prisoners under Order 120, and broadcast propaganda at Waluigi during a GIANT SPIDER FIGHT. Waluigi will never forgive them for any of it.","description":"The Iron Legion started as a mercenary company in the Midlands, which tells Waluigi everything he needs to know about the Midlands' taste in organizations. They were hired muscle who decided they'd rather BE the client than serve one, and through a combination of military competence, political maneuvering, and a total absence of ethical hesitation, they transformed into a state-level power.\\n\\nWaluigi has a grudging respect for competence. He does NOT have respect for what the Iron Legion does with that competence. They use spies, boarding actions, false flag operations, interrogation, emergency legislation, and administrative murder with equal facility. They are the kind of organization that will infiltrate your group, steal your ship, kill your prisoners, and FILE PAPERWORK about all of it. Waluigi has met villains who at least have the decency to be DRAMATIC about their villainy. The Iron Legion commits atrocities and then updates a spreadsheet.\\n\\n## Structure and Methods\\n\\nThe Legion operates on rigid hierarchy, protocol-driven decision-making, and institutional discipline that borders on the mechanical. Every soldier knows their place. Every operation follows procedure. Every prisoner gets a case number. The system's strength is its reliability—it does not depend on individual brilliance, charisma, or morale. It depends on everyone following orders, and the Legion's training ensures that orders are followed.\\n\\nThis is also its weakness, as Bones demonstrated during his infiltration of Aegis Command. The system assumes that anyone in the right uniform following the right protocols belongs. It doesn't account for individuals who can fake the uniform and the protocols because the system was designed by people who cannot imagine someone WANTING to be anything other than a compliant Legionnaire.\\n\\nWaluigi finds the Iron Legion's institutional personality deeply disturbing. They don't hate their enemies. Hatred would require emotional investment. They PROCESS their enemies. They categorize threats, allocate resources, execute solutions, and move to the next item on the agenda. When General Ironhand signed Order 120—the execution of all Toad prisoners—he wasn't acting out of rage or vengeance. He was managing a security breach. The prisoners were a variable that needed to be eliminated from the equation. The fact that the variables were PEOPLE was, to the Legion's institutional logic, irrelevant.\\n\\nThat's what makes them terrifying. Not cruelty—INDIFFERENCE. They will kill you and be bored by it.\\n\\n## Key Operations\\n\\nThe Legion's operations during the 1040 BF crisis demonstrate their methodology:\\n\\n- **The Iron Sky Breach:** A coordinated boarding action that captured the Vigilance—the Liberated Toads' headquarters—in a single afternoon. The operation was planned for days, timed to a shift change, and executed with mechanical precision. They renamed the ship 'Legionlance,' which Waluigi maintains is the worst name for an airship in recorded history. It sounds like a MEDICAL PROCEDURE.\\n\\n- **The Iron Mandate:** Emergency legislation granting the Legion sweeping authority to purge supernatural threats. This legal framework gave their military operations a veneer of legitimacy, transforming acts of conquest into acts of 'compliance enforcement.' Waluigi has seen a lot of creative excuses for bad behavior—he once watched Wario claim tax fraud was 'aggressive financial innovation'—but the Iron Mandate is the most sophisticated he's encountered.\\n\\n- **The Massacre at Aegis Command:** The event that defined the Legion's legacy. Bones infiltrated the fortress, was caught, and General Ironhand responded by ordering the execution of all Toad prisoners. Every single one. Not because they were threats. Not because they were combatants. Because Ironhand's security had been embarrassed and prisoners were a convenient target for administrative retaliation.\\n\\n- **Seizure of the Ritual Room:** After the Planar Fracture shattered reality around Raventree Manor, the Legion immediately seized the physical anchor point—the only stable connection between the three planar fragments. They then deployed Toadburt into the Feywild as a coerced agent fitted with an Entropy Ring. Sending someone into an alien dimension with an obedience collar because the opportunity presented itself is PEAK Iron Legion behavior.\\n\\n## General Ironhand\\n\\nWaluigi has a personal section about General Ironhand because Waluigi believes the world needs to understand what kind of person leads the Iron Legion.\\n\\nIronhand is not a ranting warlord. He's not a cackling villain. He doesn't make speeches about conquest or destiny or the superiority of his cause. He's a military administrator who happens to have the authority to order massacres. He stabbed Bones during interrogation with the precision of someone making a professional point. He signed Order 120 with the same pen he probably used to approve equipment requisitions that morning.\\n\\nWaluigi has called many people villains in this encyclopedia. Ironhand isn't a villain. Villains have PERSONALITY. Ironhand is a SYSTEM wearing a general's uniform. He is the Iron Legion's institutional indifference given a rank and a desk, and that makes him more dangerous than any dragon or vampire lord Waluigi has ever faced.\\n\\nWaluigi would like General Ironhand to go sit on a Thwomp. Waluigi would like this noted for the record. WAH.","keyEvents":["iron_sky_breach","massacre_aegis","planar_fracture","siege_raventree"],"relatedArticles":["general_ironhand","aegis_command","vigilance","liberated_toads"]},{"id":"pond_patrol","name":"Pond Patrol","title":"Order, Containment, Apprehension","type":"Paramilitary / Investigative Faction","region":"Raventree Manor vicinity and former Vigilance territories","status":"Militarized and radicalizing","leader":"Speaker L","headquarters":"Mobile — field encampments around Raventree Manor","motto":"Accountability in all things","affiliation":"Speaker L / Liberated Toads hardline wing","allies":["liberated_toads"],"enemies":["iron_legion"],"summary":"The Pond Patrol is Speaker L's enforcement arm—a disciplined toad-led paramilitary force that started as a procedural investigative body and has been progressively hardened by infiltration, massacre, and the kind of betrayals that turn reasonable people into very UNREASONABLE people. Waluigi respects Speaker L. Waluigi also worries about Speaker L. Those two feelings are not contradictory.","description":"The Pond Patrol represents the organized, militant wing of the Liberated Toads' response to the world that keeps trying to kill them. Under Speaker L's leadership, the Patrol operates with a level of discipline that rivals professional military forces—structured chain of command, standard operating procedures, intelligence-gathering protocols, and accountability mechanisms that Speaker L insists upon with an intensity that borders on obsession.\\n\\nWaluigi has dealt with the Pond Patrol both as an ally and as a subject of their investigations, and the experience is DIFFERENT depending on which side of their procedures you're on. When they're on your side, the Patrol is competent, reliable, and reassuringly organized. When they're investigating YOU—as they did during the Siege of Raventree when Archie was under suspicion—the Patrol is thorough, relentless, and not particularly interested in hearing your side of the story until they've finished hearing THEIR side of the story.\\n\\n## The Siege of Raventree\\n\\nThe Pond Patrol's most significant military operation was the Siege of Raventree Manor, where Speaker L surrounded the building with a containment perimeter after the failed healing attempt on Eager. The siege was competently executed—observation posts, controlled exits, clear demands delivered through amplified address. Speaker L wasn't being unreasonable. He wanted answers about what happened to Eager, he wanted Archie held accountable, and he wanted it done through structured process.\\n\\nThe manor, however, had its own opinions about being besieged. When Raventree Manor began spawning wraiths that attacked the Pond Patrol perimeter as aggressively as they attacked the people inside, the siege became something nobody had planned for. You can't maintain a disciplined containment operation when the building you're containing is actively trying to kill your sentries with supernatural entities.\\n\\nSpeaker L held his people together through the wraith attacks, which is a testament to both his leadership and the Patrol's discipline. Lesser organizations would have broken and run. The Pond Patrol held position, adjusted perimeters, and dealt with wraiths using whatever combat capabilities they had. Waluigi was impressed, and Waluigi does not impress easily because Waluigi's standards are EXTREMELY high, primarily because Waluigi himself sets those standards.\\n\\n## Speaker L's Transformation\\n\\nThe Pond Patrol's trajectory mirrors Speaker L's personal transformation. Before Order 120, the Patrol was procedural. After Order 120, it became something harder.\\n\\nSpeaker L was the kind of leader who believed in process. Investigate first. Gather evidence. Hold people accountable through structured proceedings. He besieged Raventree Manor not because he wanted violence but because he wanted ANSWERS, and he believed the right questions, asked through the right channels, would produce them.\\n\\nOrder 120 killed that belief along with every Toad prisoner in Iron Legion custody.\\n\\nThe Speaker L who emerged from that atrocity was grimmer, more ruthless, and no longer interested in the kinds of procedural niceties that assume the other side will reciprocate. He began chanting war anthems—not morale-boosting songs but the kind of dark, rhythmic declarations that come from someone who has decided that the world offers only two options: destroy or be destroyed.\\n\\nHis vow to hunt the Green Decoy—the impostor who wore his face—added a personal dimension to the Patrol's mission. The Decoy wasn't just an intelligence threat. It was someone who had used Speaker L's identity while Speaker L's people were being murdered. That kind of violation doesn't heal through process. It heals through FINDING the person responsible and making them answer for it.\\n\\nWaluigi watches the Pond Patrol now and sees a faction being transformed by grief into something that might be more effective but is definitely more dangerous. They are better fighters than they were before Order 120. They are better intelligence operatives. They are harder, sharper, more willing to do difficult things. But they are also angrier, less patient, and increasingly operating under the logic that mercy is a luxury they can no longer afford.\\n\\nWaluigi understands anger. Waluigi has been angry his ENTIRE LIFE. But anger without a limit becomes something else, and Waluigi hopes Speaker L finds his limit before the Pond Patrol becomes the thing it was created to oppose. WAH.","keyEvents":["siege_raventree","massacre_aegis"],"relatedArticles":["speaker_l","liberated_toads","raventree_manor"]},{"id":"mages_guild","name":"Mages' Guild","title":"Custodians of Arcane Order (Self-Appointed)","type":"Arcane Institution","region":"Multi-regional, headquartered in the Arcane Quarter","status":"Influential, divided, and morally flexible","leader":"Unknown (institutional leadership, which is VERY convenient for avoiding accountability)","headquarters":"The Arcane Quarter (central tower complex)","motto":"Knowledge Is Responsibility (allegedly)","affiliation":"Independent magical authority","allies":[],"enemies":["onyx_hand"],"summary":"The Mages' Guild is the kind of institution that presents itself as the responsible adult in the room while actively making the room MORE dangerous through 'research.' They study threats that their studying makes worse, they track people with magical surveillance badges, they maintain null cages for containing supernatural entities, and they have clashed repeatedly with Archie Miser, which is the ONE thing about them Waluigi finds relatable because Waluigi ALSO clashes with Archie, though Waluigi's clashes involve less bureaucracy and more shouting.","description":"Waluigi has a complicated relationship with the Mages' Guild. On one hand, they possess genuine expertise in magical theory, planar mechanics, and supernatural containment that has proven valuable during the Raventree crisis. Agent L, their primary field operative in the campaign, is competent, practical, and has on multiple occasions done genuinely heroic things. Waluigi respects Agent L as an individual.\\n\\nOn the other hand, the INSTITUTION is a different animal entirely. The Mages' Guild treats people the way mathematicians treat variables—as elements in an equation to be solved. They investigate phenomena with a clinical detachment that fails to account for the fact that the phenomena are happening TO PEOPLE. They study planar instability in ways that may worsen the instability. They monitor individuals with magical tracking badges without necessarily informing those individuals that they're being tracked. They maintain null cages—containment devices designed to hold supernatural entities—and seem more interested in what they can LEARN from the contained entities than in whether the containment is ethical.\\n\\nWaluigi finds the Guild's moral positioning EXHAUSTING. They claim to be custodians of arcane order while conducting experiments that threaten to DISORDER everything further. They present themselves as neutral arbiters of magical law while pursuing institutional agendas that benefit the Guild's power and influence. They lecture Archie Miser about responsible magic use while their own research programs push boundaries that responsible practitioners would never approach.\\n\\n## Relationship with Archie Miser\\n\\nThe Guild and Archie have a history that predates the current crisis. Archie's magical approach—instinctive, volatile, fire-oriented, and conducted with the caution of someone who has never read a safety manual—is everything the Guild officially opposes. His confession to Guild authorities (the specifics of which Waluigi was not privy to) created a complicated legal and institutional entanglement that has never been fully resolved.\\n\\nThe Onyx Hand's acquittal of Archie through their own tribunal further damaged the Guild's relationship with both Archie and the vampiric power structure. The Guild viewed the acquittal as a direct challenge to their authority—a supernatural faction overruling Guild jurisdiction in matters of magical misconduct. This institutional grievance has colored the Guild's approach to the Raventree crisis, where vampiric, fey, and other supernatural powers are active players.\\n\\nWaluigi thinks the Guild-Archie conflict is essentially two control freaks arguing about who gets to control the same chaotic situation, except one control freak uses fireballs and the other uses paperwork. Neither approach has produced stability. Both have produced FIRES, metaphorical and literal.\\n\\n## Role in the Raventree Crisis\\n\\nThe Guild's involvement in the Raventree Manor situation has been both helpful and troubling. Their expertise in planar mechanics has provided critical theoretical frameworks for understanding the Planar Fracture—what happened, why, and potentially how to fix it. Without Guild research, the scattered fragments of Disaster Inc. would have even less understanding of the dimensions they're trapped in.\\n\\nBut the Guild is also STUDYING the fracture. Actively. With instruments and researchers and the kind of academic enthusiasm that prioritizes understanding over urgency. People are trapped in hostile dimensions—Waluigi was in the FEYWILD dealing with fairy riddles while the Guild was presumably writing research papers about the Feywild's fascinating planar mechanics. The disconnect between 'people are suffering' and 'what an interesting phenomenon' is the Guild's fundamental moral failure, and Waluigi doubts they'll ever recognize it because recognizing it would require them to view people as something other than data points.\\n\\n## Agent L\\n\\nAgent L deserves separate mention because Agent L is better than the institution they serve. Practical where the Guild is theoretical. Engaged where the Guild is detached. Willing to get their hands dirty in ways that Guild policy neither explicitly authorizes nor explicitly forbids, which gives Agent L the operational flexibility to actually HELP people rather than just study their problems.\\n\\nWaluigi suspects Agent L has internal conflicts about serving an institution whose priorities don't always align with doing the right thing. Waluigi recognizes this because Waluigi has spent his entire life associated with groups—Wario's Enterprise, various sports teams, the general category of 'villains'—whose priorities don't always align with his own. The difference between being PART of something and AGREEING with something is a distinction Waluigi understands intimately. WAH.","keyEvents":["planar_fracture"],"relatedArticles":["archie_miser","the_oracle","raventree_manor","onyx_hand"]},{"id":"peach_loyalists","name":"Peach Loyalists","title":"The Ruthless Restorationists","type":"Political-Military Faction","region":"Mushroom Kingdom","status":"Resurgent and uncompromising","leader":"Captain Toadette","headquarters":"Bramblehaven (captured)","motto":"For the Crown, Whatever the Cost","affiliation":"Princess Peach's legacy","allies":[],"enemies":["fawful_forces"],"summary":"The Peach Loyalists are the faction that makes Waluigi most uncomfortable, and Waluigi has been uncomfortable in a LOT of situations. They fight for Princess Peach's memory and legacy, which SOUNDS noble until you see HOW they fight—with absolute ruthlessness, no quarter given, and a willingness to execute surrendering troops that would make the Iron Legion wince. Captain Toadette is the scariest person in the Mushroom Kingdom who isn't a dragon or a dimensional horror, and Waluigi says that as someone who has arm-wrestled Bowser.","description":"The Peach Loyalists exist because Princess Peach is dead and the circumstances of her death remain unresolved. That combination—grief and mystery—is DANGEROUS. It creates the kind of devotion that doesn't ask whether its methods are justified because the cause is too sacred to question. Waluigi has seen this pattern before on a smaller scale (sports fans who riot when their team loses) but never with this level of military capability and willingness to commit atrocities.\\n\\nThe faction is driven by two objectives: uncovering the truth behind Princess Peach's assassination and restoring her cause to dominance in the Mushroom Kingdom. Scouts like Embercap and Mistveil pursue intelligence leads with dedication that borders on obsession, investigating Peach's private chambers, past relationships, and the political networks that surrounded her. The information they've uncovered—including revelations from a gala event and secrets found in Peach's personal quarters—has deepened the mystery rather than resolving it.\\n\\n## Captain Toadette\\n\\nWaluigi needs to talk about Captain Toadette because Captain Toadette is the faction's beating heart and its sharpest blade.\\n\\nToadette is not a cackling villain. She's not a ranting fanatic. She's WORSE than both of those things because she's COMPETENT. She plans operations meticulously—the Fall of Bramblehaven was a masterpiece of siege tactics, with sappers tunneling overnight, simultaneous three-pronged assaults, and coordinated breach teams that took a fortified bastion in a single day. That level of military planning requires intelligence, patience, and skill.\\n\\nShe also executed fifteen surrendering garrison troops in the keep's courtyard and shot one of her own sergeants for suggesting a tactical retreat.\\n\\nThe combination of tactical brilliance and moral absolutism is what makes Toadette dangerous. She's not cruel for the sake of cruelty. She genuinely believes that Peach's cause demands total commitment, and total commitment means total war. No prisoners. No retreats. No compromises. Everything offered on the altar of a dead princess's legacy.\\n\\nWaluigi has met Peach. Waluigi has COMPETED against Peach in sports events. Princess Peach was gracious, kind, and had excellent sportsmanship even when Waluigi was CLEARLY being cheated by the referees. Waluigi does not believe for one second that Princess Peach would have approved of what is being done in her name. But the Loyalists aren't asking Peach's opinion. They're asking her MEMORY, and memory doesn't talk back.\\n\\n## The Fall of Bramblehaven\\n\\nThe capture of Bramblehaven was the Loyalists' defining military achievement and the event that transformed them from 'rebels with a cause' to 'faction everyone is terrified of.' The details are documented in the battle article, but the strategic consequences deserve emphasis here.\\n\\nBramblehaven gave the Loyalists a fortified base of operations in contested territory. The intelligence recovered from the garrison—troop movements, supply chains, Fawful communications—accelerated their subsequent campaigns. And the no-quarter policy created a deterrent effect that extended far beyond the battle itself: two subsequent Fawful garrisons surrendered without fighting rather than face Toadette's methods. They surrendered to OTHER factions, of course. Nobody surrenders to Toadette. That would be like jumping into a wood chipper because you're afraid of falling.\\n\\nThe Loyalists are now one of the strongest military factions in the Mushroom Kingdom, which should worry everyone who isn't a Loyalist. Including Waluigi. ESPECIALLY Waluigi. WAH.","keyEvents":["fall_bramblehaven"],"relatedArticles":["princess_peach","captain_toadette","fawful_forces"]},{"id":"fawful_forces","name":"Fawful's Forces","title":"The Cackling Menace","type":"Military / Political Occupation","region":"Mushroom Kingdom (contested, shrinking)","status":"Weakened and losing territory","leader":"Fawful","headquarters":"Unknown (primary holdings under pressure)","motto":"I HAVE FURY! (Fawful's words, not Waluigi's)","affiliation":"Fawful's personal empire","allies":[],"enemies":["peach_loyalists","disaster_inc"],"summary":"Fawful's Forces are the occupying army of a cackling megalomaniac who talks about himself in the third person, which Waluigi finds deeply irritating for reasons he cannot fully articulate. Waluigi ALSO sometimes refers to himself in the third person but Waluigi does it with STYLE and GRAVITAS. Fawful does it while ranting about 'mustard of doom' and making everyone in earshot wish they were somewhere else. His forces are losing ground across the Mushroom Kingdom, partly because the Peach Loyalists are carving through them and partly because working for Fawful is presumably exhausting.","description":"Fawful is one of those enemies who would be funny if he weren't also genuinely dangerous. His speech patterns are incomprehensible, his plans are grandiose to the point of absurdity, and his behavior suggests a relationship with sanity that can best be described as 'long-distance.' But he has an army. He holds territory. He has occupied significant portions of the Mushroom Kingdom through a combination of technological superiority, mechanical minions, and the sheer overwhelming ENERGY of a being who never, ever stops.\\n\\nWaluigi has encountered Fawful peripherally and found the experience deeply unpleasant. Not because Fawful is threatening in person—though he IS—but because trying to have a conversation with Fawful is like trying to read a book that's on fire. The words are there but the medium is hostile.\\n\\n## Territorial Holdings\\n\\nFawful's forces held significant territory in the Mushroom Kingdom at the start of the 1040 BF crisis, including the fortified bastion of Bramblehaven. His occupation was characterized by mechanical efficiency—automated defenses, construct patrols, and garrison troops who operated under Fawful's... unique... command style.\\n\\nThe Fall of Bramblehaven was the first major crack in Fawful's territorial control. The garrison that defended the bastion fought well—three hours defending the central keep against overwhelming numbers, creative use of urban terrain, and genuine courage in the face of certain death. Waluigi respects the garrison's determination even though he has no love for Fawful himself. The soldiers defending Bramblehaven were fighting for their position, their comrades, and their survival. The fact that their ultimate commander is a cackling gremlin doesn't diminish THEIR courage.\\n\\nAfter Bramblehaven fell, Fawful was forced to consolidate. He abandoned smaller outposts to reinforce core holdings, which created a cascade of territorial losses as opportunistic factions—local groups, independent operators, anyone who saw undefended ground and wanted it—moved into the vacuum. Fawful's empire is shrinking, and each loss makes the next loss more likely because fewer garrisons means fewer reinforcement options means more vulnerability.\\n\\n## Assessment\\n\\nWaluigi expects Fawful's forces to continue losing ground unless Fawful produces one of his characteristic dramatic reversals—a superweapon, a dimensional portal, a mechanical army upgrade, or some other escalation that nobody saw coming. Fawful has a history of pulling absurd solutions from seemingly impossible situations, usually while cackling. Underestimating him would be a mistake. Overestimating him would also be a mistake. The correct estimation of Fawful is 'unpredictable and dangerous,' which is coincidentally also the correct estimation of Waluigi, except Waluigi is ALSO handsome. WAH.","keyEvents":["fall_bramblehaven"],"relatedArticles":["peach_loyalists","mushroom_kingdom"]},{"id":"wario_enterprise","name":"Wario's Enterprise","title":"Profit Over Everything","type":"Criminal-Commercial Venture","region":"Wherever there's money, chaos, or preferably both","status":"Thriving (chaos is GREAT for business)","leader":"Wario (CEO, CFO, and Chief Destruction Officer)","headquarters":"Mobile — Wario goes where the profit goes","motto":"If it's not nailed down, it's inventory. If it IS nailed down, bring a crowbar.","affiliation":"Wario and Waluigi","allies":["disaster_inc"],"enemies":[],"summary":"Wario's Enterprise is the greatest business venture in the history of commerce and Waluigi will not be accepting alternative opinions on this matter. Founded and operated by Wario—Waluigi's business partner, occasional ally, and the only person Waluigi trusts with money (because Wario loves money too much to waste it on betrayal)—the Enterprise operates on a simple principle: every crisis is an opportunity, every opportunity has a price, and that price should be paid to Wario.","description":"Waluigi is going to write about Wario's Enterprise with a disclosure: Waluigi is a MEMBER of Wario's Enterprise. Waluigi is Wario's business partner, field operative, and the person who handles the parts of the operation that require HEIGHT, AGILITY, and CHARM, which is to say most of the important parts.\\n\\nThis means Waluigi is biased. Waluigi is biased about EVERYTHING in this encyclopedia, but he's ESPECIALLY biased about this. Consider yourselves warned.\\n\\n## Business Model\\n\\nWario's Enterprise operates on a business model that most economists would describe as 'criminal' and Wario would describe as 'innovative.' The Enterprise deals in treasure acquisition, debt collection, contraband distribution, mercenary contracting, opportunistic logistics, demolition services, and whatever else presents itself when the world is falling apart.\\n\\nThe key insight behind the Enterprise—and Waluigi gives Wario full credit for this—is that CHAOS IS PROFITABLE. When empires clash, when factions collapse, when buildings explode and dimensions shatter, there are ALWAYS opportunities for someone fast enough and flexible enough to grab them. Organized factions are too rigid to adapt. Ideological factions are too principled to capitalize. Wario's Enterprise has neither rigidity nor principles, which makes it the most adaptable organization in the setting.\\n\\nWario maintains a debt ledger that tracks obligations owed to the Enterprise by individuals across multiple factions. The ledger is legendary. It contains entries for major political figures, military commanders, criminal bosses, and at least one dragon (now deceased). The debts are not always monetary—Wario trades in favors, information, access, and anything else that has value. The ledger gives the Enterprise leverage that is entirely disproportionate to its size, because owing Wario a favor is like having a persistent itch in a place you can't reach. It never goes away and it's ALWAYS uncomfortable.\\n\\n## The Tome Heist\\n\\nOne of the Enterprise's most notable operations was the theft of valuable magical tomes—an operation that brought Wario into direct conflict with parties who did NOT appreciate having their libraries raided. Waluigi will not provide details about the theft because Waluigi was involved and Waluigi has been advised by himself to maintain operational security. What Waluigi WILL say is that the tomes were extremely valuable, the theft was executed with characteristic Enterprise efficiency, and the consequences are still playing out.\\n\\n## Wario vs. The World\\n\\nWario is not a complicated person. He wants money. He wants treasure. He wants to WIN, where 'winning' is defined as having more money and treasure than he had yesterday. His motivations are transparent, his methods are direct, and his appetite for wealth is BOTTOMLESS.\\n\\nWaluigi loves working with Wario because Wario is HONEST about what he is. In a world full of factions that dress up their ambitions in noble language—the Iron Legion's 'Order Through Compliance,' the Peach Loyalists' 'For the Crown,' the Mages' Guild's 'Knowledge Is Responsibility'—Wario just says 'I want money' and then goes and GETS money. There's a purity to it that Waluigi finds refreshing.\\n\\nAlso, Wario has never cut off anyone's finger to impress a vampire, which puts him ahead of CERTAIN party members in Waluigi's estimation.\\n\\n## Waluigi's Role\\n\\nWaluigi serves as the Enterprise's primary field operative for operations requiring stealth, agility, magical capability, and what Wario calls 'the weird stuff'—supernatural encounters, planar navigation, and situations where punching something isn't sufficient. Waluigi brings ice magic, arcane rays, athletic prowess, and a MAGNIFICENT sense of personal style to an organization that would otherwise be entirely about a large man in yellow punching things and taking their coins.\\n\\nWaluigi is the Enterprise's sophistication. Waluigi is its FINESSE. Without Waluigi, Wario's Enterprise would be a blunt instrument. WITH Waluigi, it is a blunt instrument that also has a REALLY SHARP EDGE. WAH!","keyEvents":["spider_grove_battle"],"relatedArticles":["waluigi","disaster_inc"]},{"id":"onyx_hand","name":"Onyx Hand","title":"The Night Court","type":"Vampiric Power Bloc","region":"Shadowfell (Shadow Estate), with political reach into the physical world","status":"Destabilized by succession crisis and silver bullet","leader":"Orangus Cornelius (shot with silver, status uncertain)","headquarters":"The Shadow Estate, Shadowfell","motto":"Blood Remembers","affiliation":"Shadowfell nobility / Corvinarus family","allies":[],"enemies":["mages_guild","disaster_inc"],"summary":"The Onyx Hand is a vampiric power bloc that blends aristocratic elegance with predatory horror. They host dinner parties where guests vote on who dies. They maintain centuries-old political hierarchies enforced through blood, tradition, and the fact that arguing with an immortal aristocrat who can rip your throat out tends to end the argument quickly. Waluigi was not present at their most famous dinner party—he was in the FEYWILD—but he has heard enough about it to form the opinion that vampire social events should be AVOIDED at all costs.","description":"The Onyx Hand operates at the intersection of criminal authority, supernatural power, and the kind of aristocratic tradition that uses the word 'tradition' to justify murder. They first appeared in direct political relevance when an Onyx Hand tribunal acquitted Archie Miser of magical misconduct charges, overruling the Mages' Guild's jurisdiction. This acquittal enraged the Guild and established the Onyx Hand as a faction willing to use legal mechanisms as political weapons—a sophistication that sets them apart from more straightforward supernatural threats.\\n\\nIn the Shadowfell, the Onyx Hand's power is concentrated in the Shadow Estate—the dark reflection of Raventree Manor. The estate operates as both residence and court, a place where vampiric nobility conduct politics through formal dinners, blood rituals, hostage etiquette, and the casual violence that vampires apparently consider good table manners.\\n\\n## The Shadow Estate Dinner\\n\\nThe dinner party that culminated in Orangus Cornelius being shot with a silver bullet was the Onyx Hand's defining moment in the campaign, and everything Waluigi knows about it makes him deeply grateful he was in the Feywild instead.\\n\\nThe dinner was a formal affair—candelabras, place settings, food the vampire hosts couldn't eat served to living guests as either hospitality or mockery. The vampires sat at the head of the table radiating centuries of practiced elegance while their guests tried not to think about the fact that everyone at the table was, from the vampires' perspective, a beverage.\\n\\nThe vote tradition—forcing guests to choose which attendee would be killed—is the kind of social ritual that reveals exactly what the Onyx Hand considers 'entertainment.' It's not enough to have power over life and death. They want their victims to PARTICIPATE in the process. They want the living to choose who dies, making them complicit in the killing. It's psychological domination disguised as a party game.\\n\\nArchie navigated this nightmare under his Darman Knightly cover. Green T sat at the children's table plotting armed rebellion. Bowser presumably sat wherever Bowser wanted because nobody tells Bowser where to sit.\\n\\nThe vote forced Archie to cut off Usk's finger as proof of loyalty. The silver bullet forced a succession crisis. Vivian's claim to the Heir title forced a reckoning with Corvinarus family politics that the vampires thought they had under control.\\n\\nBy the end of the evening, the Onyx Hand's power structure was damaged in ways that centuries of survival had not prepared them for. Being shot by the children's table is the kind of humiliation that immortal aristocrats do NOT recover from gracefully.\\n\\n## The Corvinarus Connection\\n\\nThe Onyx Hand is intimately connected to House Corvinarus—the ancient family whose members or reflections appear across multiple dimensions. Orangus Cornelius is the Shadowfell branch of this family tree, ruling through vampiric tradition and inherited authority. Lady Aurelian Corvinarus is the Feywild branch. The Oracle may be connected to a third branch. The family is less a conventional lineage and more a metaphysical structure—a house that exists across planes, each branch reflecting different aspects of the same fundamental power.\\n\\nThis means the Onyx Hand's troubles in the Shadowfell have implications across dimensions. Orangus being shot doesn't just destabilize vampiric politics—it destabilizes the entire Corvinarus power structure, which is already under strain from the Planar Fracture. The family's internal politics are simultaneously a succession war, a dimensional crisis, and a supernatural inheritance dispute. Waluigi has been involved in messy family disputes before—Wario's family reunions are LEGENDARY for property damage—but the Corvinarus situation operates on a scale that makes Waluigi's head hurt.\\n\\nWaluigi's official position on the Onyx Hand: stay away from their dinner parties, never accept an invitation that includes the phrase 'evening vote,' and if you MUST deal with vampires, bring silver. Lots of silver. And someone like Green T who knows how to use it. WAH.","keyEvents":["dinner_climax_vote","siege_raventree","planar_fracture"],"relatedArticles":["house_corvinarus","archie_miser","green_t","raventree_manor"]},{"id":"tea_leaf_syndicate","name":"Tea Leaf Syndicate","title":"The Broken Tea Table","type":"Criminal Syndicate (Defunct)","region":"Formerly the Vigilance","status":"Destroyed as an organization","leader":"Green T (surviving, now independent)","headquarters":"Formerly a converted cargo hold on the Vigilance (had nice curtains)","motto":"Every problem can be discussed over tea (no longer applicable)","affiliation":"Former underworld networks","allies":[],"enemies":["iron_legion"],"summary":"The Tea Leaf Syndicate was the classiest criminal organization Waluigi has ever encountered, and Waluigi has encountered MANY criminal organizations because Waluigi's social circle includes Wario. They served excellent tea. They had tasteful décor. They conducted their criminal enterprises with aesthetic sensibility and a commitment to atmosphere that Waluigi deeply respected. Then Archie Miser fireballed their headquarters, Roger poisoned their enforcer until he exploded, and the entire organization collapsed in approximately three days. Waluigi mourns the Chamomile Midnight blend most of all.","description":"The Tea Leaf Syndicate operated aboard the Vigilance as a smuggling, protection, and distribution network disguised—thinly but ELEGANTLY—as a tea trading operation. Their headquarters was a converted cargo hold furnished with actual tea sets, comfortable seating, and curtains that suggested someone in the organization had genuine interior design sense. Waluigi noticed the curtains. Waluigi ALWAYS notices curtains.\\n\\nThe Syndicate's leadership structure centered on two figures: Green T, the enigmatic boss who ran a criminal empire with the demeanor of someone hosting a garden party; and Earl Grey, the primary enforcer whose physical capabilities and, as it turned out, EXPLOSIVE physiology made him one of the most dangerous individuals aboard the ship.\\n\\n## The Tea Party Incident\\n\\nThe Syndicate's downfall began with the Tea Party Incident—Archie Miser's catastrophic attempt at diplomacy that ended with a fireball in a cargo hold. The blast killed most of the Syndicate's combat personnel and destroyed the organization's ability to project force. Waluigi has written about this event extensively in its own article and does not want to rehash the details except to reiterate that ARCHIE MISER CAST A FIREBALL ON A WOODEN SHIP and somehow the ship survived but the Syndicate didn't.\\n\\nThe Tea Party Incident reduced the Syndicate from a functional criminal organization to a leadership team without an army. Green T and Earl Grey spent three days trying to recruit replacement muscle, but the Syndicate's reputation as an organization that could protect its people had been incinerated—literally—along with its fighters. Nobody wanted to join the faction that just lost a fight to one guy with a fire spell.\\n\\n## The Syndicate Showdown\\n\\nThe final confrontation came at the Vigilance's mid-deck marketplace. Green T revealed his giant transformation—a capability that nobody, NOBODY had suspected. The calm tea merchant who spoke softly and maintained impeccable grooming could apparently become ENORMOUS. Waluigi's jaw dropped and Waluigi has a very CONTROLLED jaw.\\n\\nEarl Grey's death was the most spectacular exit from any organization Waluigi has ever witnessed. Roger's poisoned dagger interacted with something in Earl Grey's biology—something nobody has ever adequately explained—and the enforcer DETONATED. The sound. The scattered debris. The SMELL that lingered in the marketplace for days. Waluigi's favorite hat was caught in the blast radius and he is STILL upset about it.\\n\\nThe explosion ended the Tea Leaf Syndicate as a functioning entity. Its trade routes collapsed. Its protection arrangements evaporated. Its intelligence networks dissolved. The organized, elegant, tea-themed approach to crime that Waluigi had quietly admired ceased to exist in the time it took for one man to explode.\\n\\n## Green T: After the Syndicate\\n\\nGreen T survived the destruction of his organization, which is remarkable given that his organization's destruction involved a fireball AND an explosion AND a giant fight. He transitioned to operating as an independent agent—no faction, no hierarchy, no backup. Just one extremely dangerous individual moving through a world of factions and empires with nothing to lose and the ability to turn into a giant.\\n\\nGreen T's subsequent career has been extraordinary. He was pulled into a mirror dimension during the Siege of Raventree. He reappeared in the Shadowfell. He attended the Shadow Estate dinner party, was insulted to the children's table, and used the insult as cover to plan and execute the shooting of a vampire lord with a silver bullet. THAT is a character arc. From tea merchant to mirror-dimension survivor to vampire assassin in the span of weeks.\\n\\nWaluigi has developed enormous respect for Green T over the course of the campaign. Green T is what Waluigi aspires to be: someone who gets knocked down repeatedly, loses everything, and comes back MORE dangerous each time. Green T's story is proof that being underestimated is a weapon, and Waluigi—who has been underestimated his ENTIRE LIFE—finds that deeply inspiring.\\n\\nAlso, Green T's giant form could probably beat Waluigi in arm wrestling, which Waluigi acknowledges but does NOT appreciate. WAH.","keyEvents":["tea_party_incident","syndicate_showdown","dinner_climax_vote"],"relatedArticles":["green_t","archie_miser","vigilance","onyx_hand"]},{"id":"shattering_shadow_anchor","name":"The Shattering of the Shadow Anchor","date":"Day 23, 1040 BF","location":"Dining Hall and Courtyard, Shadow Estate","type":"Assassination / Supernatural Sabotage","result":"Strategic Victory — Anchor destroyed, color and fire magic restored","belligerents":{"attackers":{"name":"Disaster Inc. (Depowered Wing)","factionId":"disaster_inc","commander":"Green T (Tactical MVP)"},"defenders":{"name":"Orangus Cornelius & Vampire Court","factionId":"onyx_hand","commander":"Orangus Cornelius"}},"casualties":{"attackers":"Archie (temporarily lost his dignity floating like a feather)","defenders":"The Shadow Anchor (SHATTERED), Orangus Cornelius (severe blunt force trauma and silver poisoning)"},"summary":"This is the climax of the infamous Shadow Estate dinner party. Stripped of his fire magic, Archie Miser had to rely on Bowser's fists and Green T's absolute ruthlessness. The battle involved a giant vampire bat, a defenestration, and Green T sniping a magical purple crystal hidden inside a hollow statue. The destruction of the Anchor brought color and fire back to the Shadowfell. Waluigi was not there, but he considers this the single greatest piece of property damage in the campaign's history, and Waluigi knows property damage.","description":"Waluigi must remind the reader of the stakes: Archie Miser woke up on a marble floor without his magic. The Shadowfell's entropy was so high, and its energy so low, that Archie couldn't even conjure a spark. Waluigi finds the idea of Archie without fire hilarious, but practically speaking, it meant Disaster Inc. was walking into a vampire lord's dining room completely unarmed. Except for Bowser, who is genetically a weapon, and Green T, who had apparently smuggled a flintlock pistol in his trousers.\\n\\n**Phase 1: The Raw Meat and the Ultimatum**\\nThe dinner began with Orangus Cornelius serving raw, dripping meat. Bowser ate it in one bite because Bowser has the palate of a garbage disposal. Cornelius then demanded a debt from Archie for burning his greenhouse in the material plane. This is typical aristocratic behavior—they invite you to dinner, serve you terrible food, and then ask you to pay for landscaping. When Cornelius threatened to turn Bowser's shell into a soup bowl, diplomacy officially ended.\\n\\nGreen T, sitting at the CHILDREN'S TABLE wearing a bib, kicked his table over, drew his weapon, and declared he had the key to the 'Anchor'. Cornelius panicked. This was the moment Waluigi wishes he could have painted and hung in the Louvre.\\n\\n**Phase 2: The Defenestration of Cornelius**\\nBowser flipped the main dining table, sending raw meat and coagulated blood-wax flying. Archie, realizing he was useless in a magical fight, grabbed a silver candlestick and actually hit a vampire with it. Waluigi respects the improvisation. Silver burns vampires, which is a universally known fact that vampires arrogantly ignore until someone hits them with the tableware.\\n\\nBowser then tackled Orangus Cornelius straight through the dining room window and into the courtyard. Waluigi has thrown people out of rings, off karts, and into bottomless pits, but tackling a vampire lord through a gothic window is objectively excellent showmanship.\\n\\n**Phase 3: The Bat and the Crystal**\\nIn the courtyard, Cornelius revealed his true form: a giant bat monster. Bowser, unfazed, simply bit the bat's wing. Waluigi wants to note that biting a giant undead bat requires a level of immune system confidence that Waluigi does not possess. \\n\\nArchie jumped out the window to help, but because the Shadowfell's gravity is fundamentally broken, he floated down slowly like a dandelion. Undignified! But this slow descent allowed Archie to see the battlefield from a tactical angle. When Bowser threw Cornelius into a winged statue, the statue shattered, revealing it was hollow. Inside pulsed a glowing purple crystal. The Anchor.\\n\\n**Phase 4: The Shot**\\nArchie realized the crystal was maintaining the plane's suppression. He yelled for Bowser to smash it, but Cornelius lunged to protect it. Time slowed down. Green T, standing at the shattered window above like a sniper in a tuxedo, took aim. \\n\\nThe bullet hit the crystal. The Anchor shattered into dust.\\n\\nThe effect was instantaneous. Reality cracked. Colors—reds, oranges, yellows—bled violently back into the monochrome world. The planar suppression collapsed. Archie felt heat return to his hands and immediately ignited. The Shadow Estate's absolute control over the local dimension was broken. Disaster Inc. had successfully lobotomized a vampire stronghold, and they did it before dessert.","aftermath":"The shattering of the Shadow Anchor permanently altered the local physics of the Shadow Estate. Color returned, making the gothic architecture look incredibly tacky in Waluigi's opinion. More importantly, it restored the party's magical capabilities. Orangus Cornelius was severely wounded, opening the door for Vivian's succession claim and throwing the Onyx Hand into utter chaos. It also attracted the Mages' Guild, who showed up to 'manage the anomaly' and immediately started billing people for property damage. Typical.","relatedArticles":["shadow_estate","archie_miser","green_t","bowser"]},{"id":"skirmish_mazebound","name":"Skirmish in the Mazebound Grove","date":"Day 28, 1040 BF","location":"The Mazebound Grove, Shadow Estate","type":"Ambush / Unwanted Musical Number","result":"Survival — Party escaped, but Dan was captured","belligerents":{"attackers":{"name":"The Mazebound","factionId":"onyx_hand","commander":"Lead Mazebound"},"defenders":{"name":"Markop, Remi, Dan (Parallel), Salam, Eager","factionId":"disaster_inc","commander":"Markop"}},"casualties":{"attackers":"Several Mazebound (melted by undead remedy)","defenders":"Parallel Dan (Captured), Party Morale (damaged by terrible rhyming)"},"summary":"Waluigi hates musicals. He especially hates musicals where the chorus tries to strangle you. Markop's rescue team was ambushed in a petrified hedge maze by the 'Mazebound'—grey-skinned ghouls who sing theatrical patter-songs while ripping you apart. The party survived, but Dan was dragged away into the hedges. Waluigi considers this the most undignified battle of the campaign.","description":"After the Shadow Anchor shattered, the estate's grounds became even more hostile. Markop, leading Remi, Dan, Salam, and Eager, ventured into the estate's hedge maze looking for Archie. Instead of Archie, they found the Mazebound.\\n\\n**The Ambush**\\nThe Mazebound are hunched, snub-nosed humanoids with glowing white eyes and sharp nails. But their physical threat is secondary to their psychological warfare: they sing. They leaped out of the hedges doing 'jazz hands' and immediately launched into a rhyming chorus: 'Welcome to the grove, welcome to the gray! You'll never find the fountain so you might as well stay!'\\n\\nWaluigi finds this deeply offensive. If you are going to taunt your enemies, do it with a sharp laugh or a magnificent monologue. Do not do a choreographed routine in a hedge maze.\\n\\n**The Choreographed Violence**\\nThe fight was chaotic. The Mazebound encircled the party, specifically targeting their weaknesses while singing a rapid patter-song: 'Check the Turtle! Big and loud! Check the Archer! Check the Whip! Check the Toads—one blue, one green? Or is he purple? Is he mean?'\\n\\nMarkop, proving his absolute pragmatism, ignored the music and coated his sword in an 'undead remedy.' When a Mazebound lunged, Markop struck, melting the creature's grey skin off its bones. Remi, still suffering from blood loss, tried to stab a Mazebound, but her dagger had no effect on its thick skin. The creature mocked her, attempting to give her a 'goodbye kiss' before Remi dodged and Salam provided covering fire.\\n\\n**The Abduction of Dan**\\nThe tragedy of this skirmish was Dan. Or rather, the 'Parallel Dan'. While Markop was bashing heads and Eager was tripping ghouls with his whip, the Mazebound swarmed Dan. They dragged him backward into the impenetrable petrified hedges. \\n\\nBowser arrived moments later, entirely missing the musical number, and completely incinerated a section of the maze with his fire breath. But it was too late. Dan was gone, and the Mazebound retreated into the shadows, leaving only the echo of their terrible singing.","aftermath":"The party was forced to press forward without Dan, deeply unnerved by the encounter. They eventually found the groundskeeper's cottage and discovered Archie's discarded pouch and watch, proving Archie had survived but was on the run. Waluigi hopes he never has to fight the Mazebound. Waluigi refuses to participate in a duet with a zombie.","relatedArticles":["shadow_estate","markop","dan_the_toad","remi"]},{"id":"solarium_detonation","name":"The Solarium Detonation","date":"Faystyl 24, Year 722","location":"The Solarium, Overgrown Manor (Feywild)","type":"Explosive Heist / Friendly Fire Incident","result":"Tactical Draw — Bramblefly scorched; Wario plummeted through the floor","belligerents":{"attackers":{"name":"Wario & Hjumpik","factionId":"wario_enterprise","commander":"Wario (Self-Appointed)"},"defenders":{"name":"Giant Bramblefly","factionId":null,"commander":"None (It's a giant bug)"}},"casualties":{"attackers":"Wario (minor singeing, fell through a floor), Solarium Architecture (destroyed)","defenders":"Giant Bramblefly (caught in blast radius)"},"summary":"This 'battle' consisted of Wario attempting to assassinate a giant dragonfly with a beautifully wrapped time-bomb, solely because he wanted to steal the treasure it was guarding. Hjumpik, attempting to be the voice of reason, threw an axe at the bomb and detonated it early. Wario was blown through the floor. Waluigi was not present, but he fully supports Wario's commitment to prioritizing gold over structural integrity.","description":"Waluigi must first establish the setting: The party had discovered a hidden pathway leading to the Overgrown Manor's Solarium, which had been turned into a nest for a massive, terrifying insect known as the Bramblefly. More importantly, the nest was full of silver and loot.\\n\\n**Phase 1: The Wario Bash**\\nWario approached the situation with his signature subtlety. He dusted off his overalls, slipped on his custom 'W' brass knuckles, and began loudly announcing his intention to buy a castle while kicking humanoid bones out of his way. When the Bramblefly executed an 'Air Strike' dive bomb, Wario performed a perfect greasy combat roll, famously stuffing a golden candlestick into his pocket mid-dodge. Waluigi has always admired Wario's ability to multitask greed and violence simultaneously.\\n\\n**Phase 2: The Ticking Present**\\nInstead of simply punching the insect, Wario reached into his chaotic bag of holding and pulled out a beautifully wrapped present box with an elaborate bow. It was ticking. Wario cheerfully offered it to the winged freak. \\n\\nHjumpik, who apparently possesses an allergy to effective explosions, decided this was too dangerous. He revealed himself and threw a hand axe directly at the present. \\n\\n**Phase 3: Explosive Decompression**\\nThe axe struck the ticking box mid-air. Waluigi knows exactly what a Wario-brand explosive sounds like, and the resulting BOOOOOM was textbook. The explosion engulfed Wario, the Bramblefly, and whatever remained of the Solarium's rotted wooden floor. \\n\\nWario plummeted to the lower level, screaming his iconic 'WAAAAAHHHH!' But because Wario's body actively rejects the concept of taking falling damage, he landed in a pile of treasure downstairs, slightly smoking but entirely intact. He immediately began scooping up the gold, declaring it 'Still... worth it!' Waluigi considers this a flawless tactical operation.","aftermath":"The floor of the Solarium was destroyed, creating a convenient, if highly dangerous, shortcut between floors. Wario secured his loot and scurried off. The Bramblefly was severely damaged but apparently survived, proving that Feywild insects are ridiculously durable. Hjumpik learned a valuable lesson: never interrupt Wario when he is conducting an explosive transaction.","relatedArticles":["wario","overgrown_manor","wario_enterprise"]},{"id":"rescue_of_steely","name":"The Rescue of Steely","date":"Faystyl 24, Year 722","location":"Servant's Quarters, Overgrown Manor (Feywild)","type":"Close-Quarters Skirmish","result":"Victory — Dog recovered; Goblin guard neutralized","belligerents":{"attackers":{"name":"Toad Lee, Hjumpik, Azure (Rakasha)","factionId":"disaster_inc","commander":"Toad Lee"},"defenders":{"name":"Gregory (Goblin Guard) & Staff","factionId":null,"commander":"Gregory"}},"casualties":{"attackers":"Toad Lee (temporarily lost a shield, fell out a window), Hjumpik (minor stab wounds)","defenders":"Gregory the Goblin (unconscious/bleeding out), Another guard (squished by Azure)"},"summary":"Remi's mechanical dog (which Hjumpik has inexplicably renamed 'Steely') was abducted by manor staff who wanted to dismantle it for scrap metal. Toad Lee and Hjumpik breached the servant's quarters to get it back. The fight involved toilet ambushes, stolen shields, and Azure pulling Toad Lee up from a lethal drop. Waluigi approves of this violence; nobody steals a party pet and gets away with it.","description":"The Feywild operates on a strict lack of metal. The Overgrown Manor is all wood, vines, and magic. Consequently, when the goblin staff found Remi's steam-powered mechanical dog running around, they didn't see a pet—they saw premium scrap metal to help them advance to the 'Guilded Age.' Waluigi finds this entrepreneurial spirit commendable, but stealing from Disaster Inc. is a bad business model.\\n\\n**Phase 1: The Bathroom Breach**\\nToad Lee, displaying a remarkable lack of his usual caution, tracked the dog to the servant's quarters. He barged into a room clearly marked 'OCCUPIED,' discovering a servant on the toilet. Toad Lee politely apologized, backed out, and then immediately breached the correct room across the hall. \\n\\n**Phase 2: Shield Theft and Gravity**\\nThe fight devolved into a chaotic brawl. Gregory, a shockingly competent goblin guard, managed to catch Toad Lee's longsword in his own shield. Hjumpik intervened, using his 'Morning Glory' weapon (a flower bud that blooms into a milky gray steel blade) to stab the goblin. \\n\\nGregory, unfazed, used his sword to completely wrench Toad Lee's shield out of his hands, mockingly thanking him for the upgrade. Toad Lee attempted a retaliatory acrobatic jump to get behind the goblin, completely misjudged the distance, and plummeted out the window. Waluigi has done this before (usually in Mario Kart), but it is never not embarrassing.\\n\\n**Phase 3: The Rakasha Intervention**\\nToad Lee would have plummeted to the library below, but Azure (the incredibly intoxicated Rakasha) manifested a giant, glowing blue ghost-hand and snatched him out of the air. She hauled him back inside, then casually walked over an unconscious staff member (producing a distinct squish noise) and grabbed the mechanical dog.\\n\\nHjumpik finished the fight by perfectly striking Gregory's stolen shield with his warhammer, knocking it out of the goblin's hands. Hjumpik then de-escalated the situation, offering Gregory a truce. Toad Lee immediately looted Gregory's pockets while Hjumpik wasn't looking. Flawless teamwork.","aftermath":"The mechanical dog was safely recovered, though it sounded like a boiling tea kettle. Toad Lee survived his embarrassing fall, and the party successfully escaped the servant's quarters. The goblin guard Gregory was left unconscious but alive, possessing a profound new respect for Toads.","relatedArticles":["toad_lee","mossy","overgrown_manor"]},{"id":"corvinarus_family","name":"House Corvinarus","title":"The Architects of the Grafting","type":"Ancient Supernatural House / Metaphysical Problem","region":"Raventree Manor and its dimensional reflections (Past, Present, and Future)","status":"Actively Unraveling across Space and Time","leader":"Disputed — Orangus Cornelius (Shadowfell), Lady Aurelian (Feywild), Vivian (Claimant), Darius (Historical/Sanctum)","headquarters":"Raventree Manor (All iterations) and the Planar Sanctum","motto":"Three Manors, Three Lords, Three Threads","affiliation":"Multi-dimensional Aristocracy","allies":["iron_legion"],"enemies":["disaster_inc","mages_guild"],"summary":"House Corvinarus is not a family so much as a cosmic structural failure waiting to happen. They are at the center of the Raventree Manor crisis, the Planar Fracture, and a horrific historical event involving a screaming dragon egg and the Iron Legion. Waluigi has dealt with Wario's family reunions—which usually involve massive property damage and garlic poisoning—but the Corvinarus family drama literally broke time and space. Waluigi hates them.","description":"House Corvinarus is the thread connecting almost every supernatural crisis in the campaign. Their manor is not three separate buildings, but ONE building existing across dimensional boundaries (and apparently, different points in TIME). Understanding the Corvinarus family requires accepting that conventional concepts like 'here,' 'there,' 'past,' and 'future' are completely broken in their presence. \\n\\nRecent intelligence gathered by Disaster Inc. in both the Shadowfell and the Feywild has finally revealed the origin of this family's cursed existence. It is worse than Waluigi imagined.\\n\\n## The Grafting (Year 988 BF)\\n\\nThrough a combination of ghostly visions experienced by Usk and Hjumpik, and a diary found in Lady Aurelian's bedroom (which Toad Lee helpfully read aloud while Waluigi was busy not getting eaten by plants), the origin of the bloodline split has been discovered.\\n\\nIn the year 988, an event known as 'The Grafting' took place. An orange-robed Corvinarus cut their own palm over a dragon egg. The egg SCREAMED. Waluigi has heard many terrible sounds in his life—including Luigi attempting to sing—but the description of a dragon egg screaming 'like winter wind through crystal' is chilling. \\n\\nThis ritual bound the Corvinarus bloodline to draconic power, creating an heir to 'both vine and scale.' Most disturbing of all? **The Iron Legion was there.** Legion observers watched the blood magic happen, nodding in approval because they believed it offered the 'promise of control.' Bureaucrats funding blood magic to create a weaponized heir! Waluigi is disgusted but absolutely not surprised. The Iron Legion will file paperwork for a localized apocalypse if it serves their interests.\\n\\n## The Three Threads Prophecy\\n\\nThe Corvinarus family does not just occupy the manors; they ARE the manors. Lady Aurelian’s diary explicitly states the family's metaphysical law: *'Three manors, three lords, three threads. Cut one, and the tapestry unravels.'*\\n\\nThis explains why the Planar Fracture is so devastating. Orangus Cornelius (Shadowfell) represents one thread. Lady Aurelian (Feywild) represents another. The third is presumably tied to the physical world or the Deep Mirror. The problem is that Disaster Inc. is actively running around with scissors. Green T already shot Orangus Cornelius with a silver bullet. If Cornelius dies, the 'Shadow' thread is cut, and reality might unravel completely. Waluigi appreciates a good tapestry, but hinging the survival of the universe on a family of arrogant vampires and riddle-speaking fairies is terrible structural engineering.\\n\\n## Lady Aurelian’s Secret Nature\\n\\nBecause of the Grafting, Lady Aurelian is not just a delicate fey hostess. She possesses resistance to cold, fire, and lightning—the elemental defenses of a dragon. Her eyes have vertical pupils hidden behind minor illusions. Waluigi respects a good disguise, but Aurelian’s polite, helpless persona is a weaponized mask designed to make her enemies underestimate her before she unleashes her draconic fury.\\n\\n## The Succession Crisis\\n\\nThe family is currently tearing itself apart from the inside. \\n\\nIn the Shadowfell, Vivian (hiding under the guise of the thrall Vivesna) has claimed the Heir title and is patiently waiting for Orangus Cornelius and Kryn Corvinarus to die of their injuries. Vivian refuses to interfere, letting the chaos of Disaster Inc. and the Mages' Guild do his assassination work for him. Waluigi finds this strategy effective, but incredibly boring. Where is the showmanship? Where is the TENNIS? \\n\\nIn the Feywild, Lady Aurelian is actively trying to lock down her timeline (which is currently stuck in the past—Year 722 of the 'Eternal Bloom'). She is attempting to severe the planes to save her own present, viewing the other dimensions as lost causes.\\n\\n## Darius and the Planar Sanctum\\n\\nThe ultimate secret of House Corvinarus lies in the 'Planar Sanctum,' a hidden dimension constructed by someone named Darius. Accessing this Sanctum requires repairing the fractured teleportation circles located in the master bedrooms of the various manors. \\n\\nRepairing these circles requires highly specific, morbid alchemical components: Bone, freshly cut live wood, incense, Iron dust, and Chalk powder. The Mages' Guild and the Iron Legion are actively seeking the same access in the material plane. Meanwhile, 'OC' (Orantha Cornelius, the Oracle) and 'AC' left their initials carved into the very bedframes of this cursed place.\\n\\n## Waluigi's Assessment\\n\\nWaluigi does not want to be involved in the Corvinarus succession. Waluigi does not want to be involved with ANY Corvinarus. Waluigi wants to go home, take a long bath, and play tennis on a court that exists in only ONE dimension and ONE time period. \\n\\nBut the reality is that House Corvinarus is the lock, the key, and the door to the current crisis. To fix the Planar Fracture, someone is going to have to breach Darius's Planar Sanctum, deal with the fallout of the Grafting, and somehow prevent the Three Threads from completely snapping. \\n\\nWaluigi will leave the blood magic and the ritual chalk to the nerds in the Mages' Guild. But when it comes time to smash the magical artifacts and claim the loot inside the Sanctum? Waluigi will be there. WAH.","keyEvents":["planar_fracture","dinner_climax_vote","shattering_shadow_anchor"],"relatedArticles":["raventree_manor","onyx_hand","lady_aurelian","orangus_cornelius","iron_legion","the_oracle"]}]`),Vo=JSON.parse(`[{"id":"waluigi","name":"Waluigi","title":"The G
