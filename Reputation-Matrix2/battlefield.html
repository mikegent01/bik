y documents the PLACE, and the place deserves its own attention because the place tried to KILL everyone.\\n\\nThe Grove occupies the northwestern boundary of Raventree Manor's grounds, where the manicured estate gardens give way to wild forest. Once—probably centuries ago—this was ordinary woodland. Then the Arachnid Matriarch established her nest, and over time, ordinary woodland became something else entirely.\\n\\n**The Webs**\\nEverything in the Silent Grove was webbed. Trees wrapped in silk until the bark was invisible. Undergrowth bound into solid masses. The ground itself carpeted with layered webbing that shifted underfoot like a living membrane. Moving through the Grove meant navigating a three-dimensional maze of silk structures that blocked paths, concealed hazards, and transmitted vibrations to the spiders that called this place home.\\n\\nThe webs weren't random. Waluigi noticed patterns during the approach: defensive barriers positioned at chokepoints, sensor strands that alerted the brood to movement, structural supports that held larger web-constructs in place. The Matriarch had engineered her territory with arachnid intelligence—not human planning, but effective nonetheless.\\n\\nCutting through the webs was possible but attracted attention. Every severed strand sent vibrations through the network, alerting nearby spiders to the intrusion. Moving WITHOUT cutting was barely possible—the webs were too dense, the paths too narrow. The party had to balance speed against stealth, which is never a comfortable position in hostile territory.\\n\\nWaluigi's solution was ICE MAGIC. Freeze the web strands, and they become brittle. Brittle strands shatter instead of vibrating. Shattered strands don't alert anyone. It was elegant, effective, and—Waluigi will say it because nobody else will—BRILLIANT. Waluigi created frozen corridors through the silk maze, paths that the party could traverse without announcing their presence to every spider in a quarter-mile radius. This contribution saved lives. Waluigi expects this contribution to be remembered. Waluigi is not holding his breath.\\n\\n**The Darkness**\\nLight struggled to penetrate the Grove's canopy. Layers of webbing filtered the sky until only the faintest illumination reached ground level. Visibility was maybe twenty feet under optimal conditions, less when web-structures blocked sightlines. The party brought light sources, but light sources in the Grove created as many problems as they solved: illumination helped you see, but it also helped everything else see YOU.\\n\\nThe darkness wasn't just physical—it was psychological. The Grove pressed in on you. Shadows moved at the edges of vision. Every sound could be something approaching or nothing at all. Waluigi has competed in high-pressure situations his entire life—championship matches, tournament finals, that one time he had to dance against a professional while Wario heckled from the audience—but the Silent Grove's darkness tested even Waluigi's legendary nerves.\\n\\nThe Oracle's illumination spell during Phase 2 of the battle changed everything temporarily. She flooded the Grove with magical light that turned perpetual twilight into artificial noon. The effect was dramatic—not just revealing the terrain, but driving back the smaller spiders that had adapted to darkness and couldn't tolerate sudden brightness. For a few precious minutes, the party could SEE, and seeing made fighting possible.\\n\\nBut magic fades. The light dimmed. The darkness returned, patient and hungry. And the spiders, driven back temporarily, came back too—angrier, if spiders can be angry, and certainly more coordinated.\\n\\n**The Egg Sacs**\\nThe ground throughout the Grove was carpeted with egg sacs. Thousands of them. Maybe tens of thousands. Each sac contained dozens of unhatched spiderlings, and the sacs themselves were fragile enough that careless footsteps could rupture them.\\n\\nWaluigi learned VERY quickly to watch where he stepped. Rupturing an egg sac wasn't just disgusting—though it WAS disgusting, viscerally and memorably disgusting—it also released pheromones that attracted adult spiders. Step on the wrong sac and suddenly you had three or four dog-sized arachnids converging on your position, responding to what they interpreted as a threat to their offspring.\\n\\nThe tactical implications were significant. You couldn't run through the Grove. You couldn't fight carelessly. Every movement had to be deliberate, every step calculated. Combat in the Grove was like fighting while also playing the world's deadliest game of hopscotch. Waluigi is EXCELLENT at hopscotch—superior balance, precise footwork, athletic grace—but hopscotch doesn't usually involve fangs.\\n\\n**The Flooded Fountain**\\nNear the Grove's center, the party discovered a stone fountain—an artifact from when this forest was presumably a garden, before the Matriarch claimed it. The fountain had long since stopped flowing. Its basin was filled with stagnant black water and organic debris that Waluigi chose not to examine closely. Some mysteries are better left unsolved, and 'what's floating in spider water' is definitely one of them.\\n\\nRemi and her mechanical dog established a defensive position at the fountain during Phase 2 of the battle. The stone structure provided cover. The open space around it—relatively open, meaning only moderately web-choked—gave room to maneuver. For a while, it served as a rally point where separated party members could regroup.\\n\\nBut the fountain was also where Smoking J got bitten. The venom hit him fast—disorientation, swelling, the symptoms cascading while the fight continued around him. He had to be pulled back from the line, which reduced defensive capability at exactly the wrong moment. Waluigi helped drag him to cover, which meant Waluigi wasn't on the front line for approximately thirty seconds, which meant Waluigi missed thirty seconds of fighting, which he STILL thinks about sometimes.\\n\\nThe fountain probably still stands somewhere in the cleared Grove. Waluigi has no intention of verifying this. Some architectural features don't need revisiting.\\n\\n**The Matriarch's Lair**\\nThe Grove's center—the deepest, darkest, most web-dense section—was where the Arachnid Matriarch made her home. The webs here weren't just structures; they were architecture. Chambers formed from layered silk. Passages that twisted through three dimensions. A nest that had been growing and elaborating for decades, maybe centuries, shaped by an intelligence that was alien but undeniably sophisticated.\\n\\nThe Matriarch herself was ENORMOUS. Waluigi documented her in the battle entry, but the scale bears repeating: thirty feet across, legs spanning between trees like living bridges, carapace scarred from fights older than anyone present. She was ancient. She was intelligent in a way that went beyond animal instinct. And she was, until the party banished her, the undisputed ruler of everything within the Grove's boundaries.\\n\\nHer lair contained trophies. Bones of creatures she'd consumed over the years—some recognizable, some not. Equipment from adventurers who'd made the mistake of entering her territory and never left. The remnants of what might have been a research expedition—journals too damaged to read, instruments corroded beyond function, personal effects that suggested scholars had once tried to study the Grove and had become part of its ecosystem instead.\\n\\nWaluigi found a tennis racket in the debris. Old. Warped. Webbed to a tree trunk like a decoration. Someone had brought a tennis racket into the Silent Grove, and that someone had died here. Waluigi doesn't know who they were. He doesn't know their name or their story. But he took a moment—just a moment, in the middle of a battle—to acknowledge them. One athlete to another. A silent recognition that the Grove had claimed someone who understood the importance of proper equipment.\\n\\nThen Waluigi went back to fighting because the Matriarch wasn't going to banish herself.\\n\\n**The Brood**\\nThe Matriarch commanded thousands of smaller spiders—her brood, her army, her immune system. They ranged from fist-sized scouts to dog-sized hunters to the horse-sized elite guards that protected the inner lair. Each category required different tactics. Each category could kill you in different ways.\\n\\nThe scouts were fast and numerous. They swarmed. Individual scouts weren't dangerous, but 'individual' isn't how they operated. They came in waves, dozens at once, overwhelming defenses through sheer numbers. Fighting scouts meant area attacks, sustained defense, accepting that you'd be bitten and hoping the bites weren't venomous.\\n\\nThe hunters were smarter. They flanked. They coordinated. They waited for targets to separate from groups and then struck from multiple angles. Waluigi learned to watch his flanks after nearly being ambushed by three hunters who had somehow positioned themselves ABOVE him without anyone noticing. Spiders should not be tactical. Spiders should be small and manageable. These spiders had clearly never received that memo.\\n\\nThe elite guards were the worst. Big enough to block corridors. Strong enough to crash through web barriers that would stop normal creatures. And absolutely, fanatically devoted to the Matriarch's protection. Fighting the elite guards was like fighting small angry buildings. Waluigi's ice magic barely slowed them. Only concentrated firepower—Markop's strength, Salem's precision shots, Waluigi's sustained arcane rays—could bring them down.\\n\\n**Current Status**\\nThe Matriarch is gone, banished through the Oracle's circle into whatever dimension accepts banished spider gods. The brood she commanded has scattered—leaderless, disorganized, operating on instinct rather than coordinated intelligence. The Grove is safer than it was, but 'safer' is relative.\\n\\nSmaller spiders still inhabit the area. The webs remain, though without the Matriarch's direction they're decaying rather than expanding. The egg sacs are hatching, producing new generations of arachnids that don't have their progenitor's size or intelligence but do have numbers and hunger.\\n\\nWaluigi recommends avoiding the Silent Grove unless absolutely necessary. The major threat has been eliminated. The minor threats remain numerous. And the Grove itself—the darkness, the webs, the silence that absorbs sound—hasn't changed. The environment that produced one Matriarch could produce another, given sufficient time and prey.\\n\\nSomeone should probably do something about that. Someone who isn't Waluigi, because Waluigi has done his part and his part was SUBSTANTIAL.\\n\\n**Waluigi's Assessment**\\nThe Silent Grove was where Waluigi proved himself. Not to others—Waluigi stopped caring about proving himself to others a long time ago, because others have consistently failed to appreciate Waluigi's excellence regardless of evidence—but to himself. When the spiders swarmed. When Remi went down. When the Matriarch emerged and everyone realized how outmatched they were. Waluigi didn't run. Waluigi FOUGHT.\\n\\nIce magic through the webs, creating paths. Arcane rays into the Matriarch's joints, weakening her structure. Holding the line while the Oracle prepared the banishment circle. Buying time when time was the most precious resource anyone had. Waluigi contributed, and the contribution mattered, and that's something Waluigi will carry with him regardless of whether anyone else acknowledges it.\\n\\nThe Grove tried to kill Waluigi. The Grove surrounded Waluigi with spiders and darkness and webs and every horror an arachnid nightmare could produce. And the Grove FAILED. Waluigi walked out of that forest—covered in ichor, exhausted, still finding spider silk in his hat weeks later—but he walked out VICTORIOUS.\\n\\nThat makes the Silent Grove one of the few places in this encyclopedia that Waluigi can write about with something approaching pride. Not comfortable pride. Not the pride of easy achievement. The pride of having faced something terrible and having refused to let it win.\\n\\nWAH. Waluigi conquered the spider forest. What have YOU done lately?","notableFeatures":["Web-choked forest on Raventree Manor grounds","Former lair of the Arachnid Matriarch","Perpetual darkness due to web-filtered canopy","Ground carpeted with thousands of egg sacs","Sound-absorbing environment creates unnatural silence","Abandoned fountain serving as landmark","Contains remains of previous failed expeditions","Currently cleared of major threat but remains dangerous"],"relatedArticles":["spider_grove_battle","raventree_manor","the_oracle","markop"]},{"id":"toad_town","name":"Toad Town","type":"Location/Capital City (Former)","region":"Mushroom Kingdom (Central)","controllingFaction":"Contested — changes hands regularly between factions","population":"Drastically reduced — civilian evacuation ongoing; current occupants primarily military","climate":"Temperate valley; giant mushroom microclimate creates unusual humidity patterns","status":"Active combat zone; former capital infrastructure heavily damaged","summary":"Toad Town was the heart of the Mushroom Kingdom. The capital. The center of culture, commerce, and governance. Now it's a contested ruin where three factions fight over rubble while the civilians who made it home have fled to wherever they could find safety. Waluigi grew up hearing stories about Toad Town's wonders. He never imagined he'd document its destruction.","description":"Waluigi visited Toad Town before the war. During the good days. When the biggest concerns were whether Princess Peach would appear at the summer festival and which team would win the annual Mushroom Cup tournament. Toad Town in peacetime was VIBRANT—colorful buildings clustered around the central square, mushroom-houses in every shade imaginable, residents who smiled and waved and actually seemed HAPPY to see you.\\n\\nThat Toad Town is gone. The physical structures might still stand—some of them, anyway—but the place that gave those structures meaning has been burned, bombed, and fought over until only the geography remains.\\n\\nPre-War Toad Town\\nUnderstanding what was lost requires understanding what existed. Toad Town before the war was a city built for joy. The architecture emphasized color, whimsy, and community. Mushroom-houses clustered in neighborhoods where everyone knew everyone. Public spaces encouraged gathering, celebration, and the spontaneous kindness that characterized Toad culture.\\n\\nThe central square—dominated by the fountain where Toads gathered for news, gossip, and public celebrations—served as the city's social heart. Markets lined the surrounding streets, selling everything from produce to handcrafted goods to those mysterious power-up items that Waluigi never fully understood but learned not to question.\\n\\nPeach's Castle rose above everything else, its pink-and-white towers visible from any point in the city. The castle wasn't just the seat of government—it was a symbol, a landmark, a promise that someone was watching over the kingdom and keeping it safe. That promise turned out to be hollow, but while it lasted, people believed in it.\\n\\nThe city's infrastructure included an extensive pipe network—the famous warp pipes that allowed rapid transit between districts and, for the mechanically inclined, between dimensions. Waluigi used those pipes regularly during his athletic career, though he never felt entirely comfortable with the physics involved. You jump into a pipe in one location and emerge from a different pipe somewhere else, and nobody has ever satisfactorily explained how that WORKS.\\n\\nThe Fall\\nWhen Princess Peach vanished, Toad Town became the first battleground. The Toad Council attempted to maintain order, but their authority depended on Peach's legitimacy, and legitimacy is hard to maintain when the source has disappeared without trace.\\n\\nThe Peach Loyalists emerged from the castle's military garrison, claiming to defend the throne until the princess returned. Their definition of 'defense' expanded rapidly to include suppressing dissent, controlling movement, and establishing the authoritarian apparatus that Captain Toadette would later perfect.\\n\\nResistance began in the outer districts—neighborhoods where Legion influence was weaker and community bonds were stronger. What became the Liberated Toads started as block-by-block organizing, mutual aid networks that became mutual defense networks that became armed resistance.\\n\\nFawful's forces entered from the east, seizing the industrial districts and the pipe transit hub before defenders could organize. His mechanical troops didn't discriminate between Loyalist and Liberator—they attacked everyone, turning a political crisis into a three-way war.\\n\\nThe fighting damaged everything. The central fountain was destroyed in the first week—shelled by Loyalist artillery targeting Liberator positions nearby. The market district burned during street fighting when someone—nobody admits who—knocked over an alchemical supply stall and the resulting fire spread across three blocks. Peach's Castle was besieged, relieved, besieged again, and eventually partially collapsed when undermining operations compromised its foundations.\\n\\nCurrent State\\nToad Town in its current state resembles no city Waluigi would want to live in. The central districts are rubble. The residential neighborhoods are empty—civilians who could flee have fled, and those who couldn't have learned to hide. The pipe network is partially functional but dangerous, with some pipes leading to contested zones and others having been deliberately sabotaged.\\n\\nControl of the city changes regularly. The Loyalists hold the castle ruins and the northern approaches. Fawful's forces maintain presence in the eastern industrial zone. The Liberators control pockets throughout the southern and western districts but can't consolidate. Combat is constant—not the organized battles of formal warfare, but the grinding attrition of urban conflict where every street corner is potentially hostile.\\n\\nInfrastructure has collapsed. Water supply is sporadic. Power—the magical-mechanical hybrid systems that Toad Town relied on—functions in some areas and fails in others. The remaining civilian population survives through improvisation, trading, and the occasional mercy of whichever faction controls their block this week.\\n\\nThe Refugee Crisis\\nThe destruction of Toad Town created a refugee crisis that has strained every surrounding region. Toads fled in waves—first the wealthy and connected, who saw the coming storm and left before it broke. Then the middle classes, when fighting reached their neighborhoods. Finally the poor and the stubborn, when even denial couldn't ignore that home had become uninhabitable.\\n\\nThe Vigilance—when it existed as a Liberator asset—served as a destination for many refugees. Temporary housing became permanent residence. The ship's population swelled beyond design capacity. When the Legion seized the Vigilance, those refugees became captives, and many of them died under Order 120.\\n\\nOther refugees scattered across the kingdom and beyond. Sarasaland took some. The wilderness communities absorbed others. Some fled so far that they're effectively lost to Mushroom Kingdom affairs—starting new lives in places where the war is a distant rumor rather than daily reality.\\n\\nWaluigi's Memories\\nWaluigi competed in Toad Town. Tennis tournaments in the public courts near the eastern gate. Go-kart races that wound through the streets while crowds cheered from mushroom-house windows. Dance competitions in the central square, with judges seated at the fountain's edge and the whole city watching.\\n\\nThose memories feel like they belong to someone else now. Someone who lived in a world where Toad Town was eternal, where the fountain would always flow, where the castle would always rise above the skyline promising protection. That world ended, and Waluigi was too busy surviving to mourn it properly.\\n\\nWaluigi mourns it now. Writing this entry. Documenting what was lost. The courts where Waluigi won his third amateur championship are rubble. The streets where he set his best kart time are contested combat zones. The square where he ALMOST won the regional dance competition—ALMOST, the judges were WRONG—is a crater.\\n\\nWaluigi didn't love Toad Town the way native Toads loved it. Waluigi was always an outsider there, tolerated rather than welcomed. But he respected it. He enjoyed competing there. He appreciated that even a place that didn't fully accept him still gave him chances to prove himself.\\n\\nNow there are no chances. Now there is only wreckage and war and the distant hope that someday, somehow, someone might rebuild.\\n\\nWaluigi's Assessment\\nToad Town cannot be saved in its current state. The physical damage is too extensive. The factional divisions are too deep. Even if the war ended tomorrow—which it won't—rebuilding would take decades and require resources that nobody currently possesses.\\n\\nWhat CAN be saved is what Toad Town represented: community, culture, the belief that people can live together in something better than fear. Those things don't require a specific city. They require people who remember what peace looked like and are willing to work toward it again.\\n\\nWaluigi is not optimistic about the Mushroom Kingdom's immediate future. But Waluigi has learned that optimism isn't required for action. You don't have to believe things will get better to fight for improvement. You just have to be too stubborn to accept that things will stay this bad forever.\\n\\nWaluigi is VERY stubborn.\\n\\nWAH. Someday there will be tennis courts again. Waluigi has to believe that, or what's the point of any of this?","notableFeatures":["Former Mushroom Kingdom capital","Central square and fountain (destroyed)","Peach's Castle (partially collapsed)","Warp pipe transit network (partially functional)","Three-way contested zone","Massive refugee displacement","Heavy infrastructure damage"],"relatedArticles":["mushroom_kingdom","peach_loyalists","liberated_toads","fawful_forces"]},{"id":"fawful_fortress","name":"Fawful's Fortress","type":"Location/Military Installation","region":"Eastern Territories (formerly Mushroom Kingdom periphery)","controllingFaction":"fawful_forces","population":"Unknown — primarily mechanical forces with limited organic personnel","climate":"Artificial environment; internal climate controlled; external area affected by industrial pollution","status":"Active military headquarters; primary Fawful command center","summary":"Fawful's Fortress is the cackling heart of Fawful's mechanical empire—a sprawling industrial complex where robots are manufactured, evil is planned, and someone really needs to do something about the ventilation because the fumes are VISIBLE from a mile away. Waluigi has never approached the Fortress directly because Waluigi is not STUPID, but he's gathered enough intelligence to know it's exactly as ridiculous and dangerous as you'd expect from Fawful.","description":"Fawful has always been theatrical. The man cannot simply BUILD something—he has to build it dramatically, with unnecessary flourishes and self-aggrandizing design choices that serve no practical purpose beyond feeding his ego. The Fortress is Fawful's personality made architectural: bombastic, overcomplicated, dangerous, and somehow functional despite everything suggesting it shouldn't be.\\n\\nThe complex occupies a mountain valley in the eastern territories, far enough from the Mushroom Kingdom's core that Fawful could construct it without immediate interference. The location offers natural defenses—steep approaches, limited access routes—augmented by Fawful's own engineering. What was once a remote mountain pass is now an industrial nightmare.\\n\\nExterior Appearance\\nThe Fortress is VISIBLE. Not just visible—AGGRESSIVELY visible. Fawful has constructed towers that serve no defensive purpose but ensure his flag flies higher than any surrounding terrain. The main complex is built in a style that Waluigi can only describe as 'evil carnival'—bright colors, clashing patterns, and architectural choices that seem designed to disorient anyone who approaches.\\n\\nSmoke constantly rises from multiple industrial stacks. The air for miles around smells of metal and ozone and whatever chemicals Fawful uses in his manufacturing processes. Local wildlife has fled. Local vegetation has died. The Fortress has terraformed its surroundings into a wasteland that declares 'FAWFUL WAS HERE' to anyone unfortunate enough to wander close.\\n\\nDefensive installations ring the perimeter: automated turrets, mechanical patrol units, sensor arrays that track movement across multiple spectrums. Approaching the Fortress without being detected is essentially impossible. Approaching the Fortress and SURVIVING detection requires either an army or the kind of luck that Waluigi doesn't trust.\\n\\nInterior Organization\\nIntelligence on the Fortress's interior is limited—few people enter voluntarily, and fewer leave to share what they've seen. What Waluigi has gathered comes from intercepted communications, defector testimony, and the occasional captured Fawful unit with retrievable memory cores.\\n\\nThe Fortress appears to contain:\\n\\nManufacturing Levels: Multiple floors dedicated to producing Fawful's mechanical forces. Assembly lines churning out combat robots, maintenance drones, and the specialized units that Fawful deploys for particular missions. The manufacturing capacity is substantial—Fawful can replace losses faster than most factions can inflict them.\\n\\nResearch Facilities: Laboratories where Fawful develops new technologies. His mechanical innovations have outpaced everyone else's for years, and this is where that advantage originates. What exactly he's researching at any given time is usually a nasty surprise for whoever encounters the results.\\n\\nCommand Center: Fawful's personal domain, reportedly decorated in a style that defies description. Multiple accounts mention thrones—plural, multiple thrones in the same room—and portraits of Fawful in various heroic poses. The egotism is architectural.\\n\\nPrisoner Facilities: The Fortress holds captives, though their fate varies. Some are kept for information extraction. Some are used in experiments. Some simply disappear. Rescue operations targeting the Fortress have been discussed but never executed—the logistics are too difficult, the defenses too strong.\\n\\nPower Core: Whatever powers the Fortress, it's substantial. The facility's energy demands are enormous—manufacturing, defense systems, climate control, Fawful's personal quarters probably have seventeen different lighting schemes—and something has to meet those demands. Reports suggest a centralized power core in the lower levels, though its exact nature is unknown.\\n\\nFawful's Presence\\nFawful reportedly spends most of his time in the Fortress, emerging only for major military operations or theatrical announcements. His management style is hands-on and micromanaging—he reportedly reviews production quotas personally, adjusts manufacturing specifications, and delivers lengthy speeches to his mechanical workforce despite them lacking the capacity to appreciate rhetoric.\\n\\nThe Fortress is an extension of Fawful's personality in ways that go beyond architecture. It reflects his obsessions, his paranoia, his overwhelming need to be acknowledged as the most brilliant mind in any room. Defeating Fawful probably requires destroying the Fortress, and destroying the Fortress probably requires defeating Fawful. The two are inseparable.\\n\\nStrategic Significance\\nThe Fortress is Fawful's center of gravity. His mechanical armies flow from it. His strategies originate from it. His ability to sustain operations depends on its continued function. Neutralizing the Fortress would cripple Fawful's war-making capability more effectively than any battlefield victory.\\n\\nThis is why no one has attempted it. The Fortress is too well-defended. The approaches are too dangerous. The resources required would strip other fronts of desperately needed assets. Fawful chose his location well, or more likely stumbled into a good location while looking for somewhere sufficiently dramatic.\\n\\nThe Fortress remains active, producing robots and projecting threat across the eastern territories. Every day it operates, Fawful's strength grows while his enemies exhaust themselves against each other. It's strategically sound, even if it wasn't strategically planned.\\n\\nWaluigi's Assessment\\nWaluigi is not going to assault Fawful's Fortress alone. Waluigi is not going to assault Fawful's Fortress with an army. Waluigi is going to stay as far from Fawful's Fortress as circumstances allow and hope that someone with more resources and less sense decides to do something about it.\\n\\nFawful is dangerous because he's brilliant, unpredictable, and completely detached from anything resembling conscience. His Fortress is dangerous because it turns those qualities into industrial-scale output. The combination is... concerning.\\n\\nIf Waluigi HAD to approach the Fortress—if circumstances absolutely demanded it—he would focus on the power core. Everything runs on power. Disrupt the power, and the manufacturing stops, the defenses weaken, the whole edifice becomes vulnerable. But reaching the power core would require penetrating multiple defensive layers, navigating a complex designed by a paranoid madman, and probably fighting approximately ten thousand robots.\\n\\nWaluigi's tennis racket is good, but it's not THAT good.\\n\\nWAH. Some locations you document because they're historically significant. Some you document as warnings. Fawful's Fortress is both.","notableFeatures":["Fawful's primary headquarters","Massive mechanical manufacturing capacity","Research and development facilities","Theatrical architectural style","Heavy automated defenses","Environmental devastation in surrounding area","Centralized power core (location uncertain)"],"relatedArticles":["fawful_forces","mushroom_kingdom"]}]`),An=JSON.parse(`[{"id":"fall_bramblehaven","name":"The Fall of Bramblehaven","date":"Day 15, 1040 BF","location":"Bramblehaven, Mushroom Kingdom","type":"Siege","result":"Decisive Peach Loyalist Victory","belligerents":{"attackers":{"name":"Peach Loyalists","factionId":"peach_loyalists","commander":"Captain Toadette"},"defenders":{"name":"Fawful's Forces","factionId":"fawful_forces","commander":"Unknown Garrison Commander"}},"casualties":{"attackers":"Heavy — multiple squads wiped during wall breaches","defenders":"Near-total (survivors executed on Captain Toadette's standing orders)"},"summary":"The Fall of Bramblehaven was a brutal day-long siege where Captain Toadette's Peach Loyalist forces absolutely demolished a Fawful-held bastion. Waluigi wasn't there—nobody INVITED Waluigi—but even from a distance this one sent chills down Waluigi's magnificent spine. The no-prisoners policy cemented Toadette as the scariest person in the Mushroom Kingdom, and Waluigi does NOT say that lightly because Waluigi has arm-wrestled Bowser.","description":"Waluigi wants to start by saying he has no love for Fawful. Fawful is a cackling gremlin who talks about himself in the third person, which Waluigi finds deeply irritating for reasons he cannot fully explain. BUT what Captain Toadette did at Bramblehaven makes Fawful look like a preschool bully by comparison. This battle is the reason Waluigi sleeps with one eye open whenever the Loyalists are mentioned.\\n\\nToadette's forces had been camping in the hills for two days before the assault. Scouts from the garrison spotted the campfires but apparently nobody thought 'hey, maybe we should tell someone about the ARMY sitting on our doorstep.' Whether that was incompetence or sabotage, Waluigi doesn't know. What Waluigi DOES know is that if HE had been running that garrison, there would have been a proper watch rotation. Waluigi is VERY good at staying awake all night because Waluigi has trust issues developed over a LIFETIME of being underestimated.\\n\\nThe dawn assault hit from three directions simultaneously because Toadette doesn't believe in doing things halfway. She's like Waluigi in that respect, except Waluigi channels his intensity into SPORTS and SHOWMANSHIP, not into executing prisoners of war.\\n\\n**Phase 1: The Breach**\\nThe eastern wall came down in two hours. Loyalist sappers had tunneled under it OVERNIGHT—while the garrison was sleeping—and packed the foundation with explosives. WAH! That's actually terrifying when you think about it. Imagine going to sleep knowing there's an enemy army nearby, and while you're dreaming about whatever Fawful's goons dream about, someone is digging UNDER YOUR BED and filling the basement with bombs.\\n\\nThe detonation buried an entire defensive squad alive. Loyalist infantry poured through before the dust settled because Toadette apparently thinks things like 'waiting for visibility' are for people who aren't FANATICALLY DEVOTED to Princess Peach.\\n\\nThe western and northern breaches took longer and cost the Loyalists dearly. Crossbow fire, boiling oil—the garrison fought HARD on those walls. Toadette reportedly executed one of her own sergeants for suggesting they pull back from the northern approach. She EXECUTED her own soldier for recommending a tactical retreat. Waluigi has coached sports teams with more compassion than this woman commands an army.\\n\\n**Phase 2: Street Fighting**\\nOnce inside, the battle turned into a street-by-street nightmare. Fawful's troops knew the layout and used it cleverly—collapsing buildings to create chokepoints, flooding intersections with alchemical smoke, rigging doorways with spring-loaded traps. Smart tactics! Waluigi respects smart tactics! The Loyalists lost entire squads to ambushes in the market district, which proves that determination without intelligence gets you killed.\\n\\nBut Toadette just kept feeding reinforcements through the breaches. She had numbers and she had zealotry, and in urban warfare those two things together are nearly impossible to stop. Waluigi knows this from extensive experience with Mario Party board games, where sheer stubbornness beats skill about sixty percent of the time and it makes Waluigi FURIOUS.\\n\\n**Phase 3: The Keep**\\nBy late afternoon, the fighting was pushed back to the central keep. The garrison commander—whose name was NEVER recovered from any surviving records, which Waluigi finds deeply suspicious because the Iron Legion documents people's LUNCH ORDERS but somehow nobody wrote down this person's name—made a final stand with about forty troops.\\n\\nThey barricaded the keep entrance and held for nearly three hours. THREE HOURS against an army. That's determination. That's grit. Waluigi respects that deeply. When the Loyalists finally broke through using a battering ram improvised from a market stall beam, the fighting inside was hand-to-hand. Close quarters. The kind of fighting where everyone gets bloody and nobody comes out feeling good about it.\\n\\n**Phase 4: No Quarter**\\nThis is where Waluigi stops making jokes.\\n\\nFifteen garrison troops tried to surrender. They put down their weapons. They raised their hands. They gave up.\\n\\nToadette's standing orders were clear: no prisoners from Fawful's forces. The surrendering troops were executed in the keep's courtyard. Some individual Loyalist soldiers reportedly hesitated or refused, which tells Waluigi that even fanatics have lines—they just got overruled by officers who didn't.\\n\\nBy nightfall, Bramblehaven was silent.\\n\\nWaluigi has done a lot of questionable things in his life. He's cheated at tennis. He's rigged go-kart races. He once stole Luigi's hat just to see the look on his face. But there are LINES, and killing people who have surrendered is so far past the line that the line is a DOT. Captain Toadette scares Waluigi, and Waluigi is not someone who scares easily. Waluigi once played a horror board game and didn't flinch ONCE. Okay, maybe once. The point stands.\\n\\nThe intelligence recovered from the garrison was apparently valuable—troop movements, supply chains, communications with Fawful's command. So the Loyalists got what they came for. Whether it was WORTH what they did to get it is a question that Waluigi thinks has a pretty obvious answer, but Waluigi has been told his moral opinions are 'surprisingly nuanced for someone who once tried to monetize standing in a doorway,' so take that for what it's worth.","aftermath":"Bramblehaven gave the Peach Loyalists a strategic foothold and a pile of intelligence. The prisoner executions drew condemnation from almost every faction—even groups nominally allied with the Loyalists were privately horrified. But here's the thing that makes Waluigi's stomach turn: it WORKED. Two subsequent Fawful garrisons surrendered without fighting rather than face the same fate. They surrendered to OTHER factions, mind you—nobody wanted to surrender to Toadette, for obvious reasons—but the fear accomplished what diplomacy couldn't. Fawful's territorial integrity in the Mushroom Kingdom was shattered. He had to abandon smaller outposts that were immediately grabbed by opportunistic local factions. The balance of power shifted, though whether it shifted toward anything resembling PEACE is a question Waluigi suspects the answer to is 'no.' WAH.","relatedArticles":["peach_loyalists","fawful_forces","mushroom_kingdom"]},{"id":"tea_party_incident","name":"The Tea Party Incident","date":"Day 9, 1040 BF","location":"Aboard the Vigilance","type":"Urban Skirmish / Multi-faction Brawl","result":"Pyrrhic — All parties suffered losses; Syndicate devastated","belligerents":{"attackers":{"name":"Multiple factions (chaotic)","factionId":null,"commander":"None (spontaneous)"},"defenders":{"name":"Tea Leaf Syndicate","factionId":"tea_leaf_syndicate","commander":"Syndicate leadership"}},"casualties":{"attackers":"Moderate — Toad Gang and Iron Legion both lost people","defenders":"Severe — Most of the Syndicate's muscle incinerated by Archie's fireball"},"summary":"The Tea Party Incident is what happens when you let Archie Miser handle diplomacy. A meeting with the Tea Leaf Syndicate turned into a three-faction brawl after someone pressed a panic button, and Archie resolved the situation by casting a FIREBALL inside a WOODEN AIRSHIP. The Syndicate lost most of its fighters. Archie lost any remaining credibility as a diplomat. Waluigi lost faith in the decision-making capabilities of everyone involved.","description":"Waluigi needs everyone to understand something before he describes this battle: the Vigilance was made of WOOD. It was a WOODEN ship. That FLEW. Through the AIR. And Archie Miser cast a fireball inside it. Waluigi wants that context front and center because apparently it wasn't front and center in ARCHIE'S mind when he decided to become the world's worst firefighter.\\n\\nThe meeting was supposed to be simple. Archie arranged to sit down with the Tea Leaf Syndicate's leadership to discuss... something. Trade? Territory? Mutual defense? Archie has never been clear about what the actual agenda was, and Waluigi suspects this is because there WASN'T one. Archie probably walked in with a vague notion of 'making friends' and a fireball loaded in the chamber just in case the friendship didn't take. That's Archie's approach to everything. Hope for the best, prepare for the worst, and define 'worst' as 'the moment when fire becomes necessary.'\\n\\nThe Syndicate operated out of a converted cargo hold in the lower decks. They'd decorated it with actual tea sets and comfortable furniture, because the Syndicate had CLASS. Say what you want about their criminal enterprises—and Waluigi has said PLENTY—but they understood that aesthetics matter. You can run a protection racket and still have nice curtains. Waluigi respected this about them enormously. Waluigi ALSO has excellent taste in interior decoration, which is yet another of his many underappreciated qualities.\\n\\nThe meeting started fine. Tea was served. Pleasantries happened. Normal diplomatic stuff that doesn't require fire.\\n\\nThen someone pressed a panic button.\\n\\n**The Panic Button Mystery**\\nWho pressed the button? GREAT question. Nobody knows. The Syndicate blamed Archie's people. Archie's people blamed the Syndicate. Some theorists think an Iron Legion operative triggered it deliberately to cause exactly the chaos that followed, which is the kind of sneaky calculated move the Legion would absolutely pull.\\n\\nWaluigi has his own theory. Waluigi thinks it was an accident—someone leaned on the wrong panel, bumped the wrong switch, sat on the wrong button. Because in Waluigi's experience, most catastrophes aren't caused by evil masterminds. They're caused by someone's elbow. But the last time Waluigi shared a theory without hard evidence, he got a forty-minute lecture about 'responsible information sharing' from someone who lets ARCHIE MISER carry a spellbook. So Waluigi will keep his theory to himself. Mostly.\\n\\n**The Escalation**\\nThe panic button summoned both Toad Gang enforcers AND an Iron Legion patrol from the adjacent corridor. Within seconds, a diplomatic tea meeting became a three-faction standoff in a cargo hold. The Toad Gang came in already swinging—they heard their alarm, they showed up, they started hitting. No questions, no assessment, just fists. Waluigi admires the commitment even if he questions the strategy.\\n\\nThe Iron Legion troops attempted to 'establish order,' which in Legion terms means pointing weapons at everyone and demanding paperwork. Someone threw a punch. Someone drew a blade. The cargo hold turned into a blender full of angry people.\\n\\nWaluigi wants to note that if HE had been handling the diplomacy, none of this would have happened. Waluigi's diplomatic approach is simple: be so magnificent that people are too impressed to fight. It has a mixed success rate, but it has NEVER resulted in a fireball.\\n\\n**The Fireball**\\nArchie's solution to the three-way brawl was to cast a fireball.\\n\\nWaluigi is going to let that sentence sit there for a moment.\\n\\nA fireball. In a cargo hold. On a wooden ship. That was flying. Through the air. Full of people.\\n\\nThe blast killed most of the Syndicate's combat personnel instantly. Several Toad Gang and Iron Legion fighters were caught in the radius. The fact that the fireball didn't ignite the hull and send the entire Vigilance plummeting to the ground in a ball of flame is either a miracle or evidence that the universe has a sick sense of humor and wanted to see what Archie would do NEXT.\\n\\nArchie has never expressed remorse about the fireball. He HAS expressed annoyance that people keep bringing it up, which tells Waluigi everything he needs to know about Archie's relationship with consequences. Waluigi makes a point of never standing within thirty feet of Archie during ANY conversation that might go badly, which, with Archie, is ALL conversations.\\n\\nWAH! The man is a walking fire hazard and everyone just ACCEPTS it!","aftermath":"The Tea Leaf Syndicate lost nearly all their fighters in one blast. The organization that controlled smuggling, protection rackets, and—Waluigi wants to emphasize—EXCELLENT tea distribution across the Vigilance was crippled beyond recovery. Three days later, the Syndicate Showdown finished them off entirely. The Toad Gang and Iron Legion took losses but stayed operational. Archie's reputation as someone who escalates to magical violence at the drop of a hat became a known factor that every faction had to plan around. It's like having a tornado as an ally—technically on your side, but you can't control where it goes or what it destroys. Waluigi has been on the same TEAM as Archie and he still checks for exits whenever the man reaches into his spell component pouch. WAH.","relatedArticles":["archie_miser","tea_leaf_syndicate","vigilance","iron_legion"]},{"id":"syndicate_showdown","name":"The Syndicate Showdown","date":"Day 12, 1040 BF (13:45)","location":"Aboard the Vigilance","type":"Factional Engagement","result":"Tea Leaf Syndicate destroyed as an organization","belligerents":{"attackers":{"name":"The Party / Iron Legion","factionId":null,"commander":"Various"},"defenders":{"name":"Tea Leaf Syndicate","factionId":"tea_leaf_syndicate","commander":"Green T, Earl Grey"}},"casualties":{"attackers":"One Iron Legion soldier (crushed by Green T's giant form — Waluigi saw it happen)","defenders":"Earl Grey (literally exploded), remaining Syndicate forces neutralized"},"summary":"The battle that destroyed the Tea Leaf Syndicate forever. Green T revealed he could turn into a GIANT, which Waluigi thinks he should have mentioned EARLIER. Earl Grey got poisoned by Roger's dagger and EXPLODED like a biological firework. Waluigi has seen a lot of strange things in his life but a man detonating at a marketplace was a new one.","description":"Three days after Archie's fireball gutted the Syndicate's fighting force, everyone knew it was only a matter of time before the final confrontation. Green T and Earl Grey had been trying to recruit new muscle, but the Syndicate's reputation as an organization that could protect its people had been shattered—literally—by the fireball. Nobody wanted to join the faction that just lost a fight to ONE GUY WITH FIRE MAGIC.\\n\\nWaluigi actually felt bad for them, in a way. The Tea Leaf Syndicate was classy. They had standards. They served GOOD tea. In a world full of brutes and bureaucrats and fire-happy maniacs, the Syndicate represented a kind of civilized criminality that Waluigi could appreciate. You know how rare it is to find villains with aesthetic sensibility? Waluigi knows. Waluigi IS a villain with aesthetic sensibility, at least according to people who don't understand the difference between 'villain' and 'misunderstood genius.'\\n\\nThe confrontation kicked off in the Vigilance's mid-deck marketplace—a neutral zone where factions maintained an uneasy commercial truce. Who started it is disputed. What ISN'T disputed is that Green T decided this was where he'd make his stand, and what a stand it was.\\n\\n**Green T's Transformation**\\nWaluigi has seen big things before. Waluigi has played sports against Bowser. Waluigi has been in the same ROOM as Petey Piranha. But when Green T transformed—when his body just EXPANDED, growing and growing until he filled the corridor like a living wall—Waluigi's jaw dropped. And Waluigi's jaw does NOT drop easily. Waluigi has a very controlled jaw.\\n\\nNobody knew Green T could do this. NOBODY. He'd been running a criminal empire with the demeanor of someone hosting a book club, and the whole time he was hiding the ability to become a COLOSSUS. The transformation froze the entire fight. Everyone—allies, enemies, marketplace shoppers who were just trying to buy apples—stopped and STARED.\\n\\nGreen T used those seconds of stunned silence perfectly. He brought one massive fist down on an Iron Legion soldier and the man just... crumpled. The armor folded like tin foil. It was the most dramatic display of raw physical power Waluigi had seen up to that point, and Waluigi wants everyone to know he was IMPRESSED but also SLIGHTLY OFFENDED because Waluigi has been training his whole life and this guy just GROWS? Just like that? WHERE IS THE FAIRNESS? WAH!\\n\\n**Earl Grey's Spectacular Exit**\\nWhile Green T was demonstrating his new building-sized physique, Earl Grey was fighting like a man with nothing left to lose—because he WAS a man with nothing left to lose. His organization was dying around him. His boss had just turned into a giant, which probably wasn't in the employee handbook. And he was surrounded.\\n\\nRoger landed a hit with his poisoned dagger. Under normal circumstances, the poison would have caused paralysis or death in the conventional, quiet, undramatic way that poisons usually work. Earl Grey's body had OTHER ideas.\\n\\nThe poison interacted with something in Earl Grey's physiology. Nobody has ever explained what, exactly. Some kind of alchemical compound in his blood? A latent magical instability? A tea-related mutation from years of sampling the Syndicate's more experimental blends? Whatever it was, the reaction was NOT subtle.\\n\\nEarl Grey EXPLODED.\\n\\nWaluigi needs to be very clear about this: he did not explode FIGURATIVELY. He did not get hit so hard he 'exploded' across the room. His body DETONATED. Outward. In all directions. The sound was somewhere between a thunderclap and a wet pop—a sound Waluigi can still hear when he closes his eyes and a sound he wishes he COULDN'T.\\n\\nPeople ten feet away were knocked off their feet. Items and... other things... scattered across the marketplace. The vendors' stalls were splattered. Waluigi's favorite hat was splattered. WAH! That hat was CUSTOM MADE!\\n\\nThe explosion ended the fight. The remaining Syndicate members—those pitiful few who survived Archie's fireball AND Earl Grey's detonation—either surrendered or ran. Green T, despite his massive form, could read the writing on the wall. His organization was gone. His enforcer was, in the most literal sense possible, everywhere.\\n\\nBut Green T survived. That guy is RESILIENT. He went on to become one of the most important independent operators in the campaign—showing up at the Spider Grove, getting dragged into mirror dimensions, and eventually shooting a vampire lord at dinner. Waluigi has come to deeply respect Green T, partly because of his capabilities and partly because anyone who sits at a children's table plotting vampire assassination has earned Waluigi's eternal admiration.","aftermath":"The Tea Leaf Syndicate ceased to exist. Its trade routes, protection networks, and excellent tea distribution all collapsed overnight. Waluigi mourns the tea most of all—the Syndicate sourced a Chamomile Midnight blend that Waluigi has NEVER been able to find anywhere else. The power vacuum aboard the Vigilance shifted hard toward the Iron Legion, who moved in on the Syndicate's former territory with the speed of bureaucrats who had been waiting for exactly this opportunity. The marketplace where Earl Grey exploded reportedly smelled strange for days. Waluigi can confirm this. It smelled like ozone and regret and something else that nobody could identify, which made it WORSE. Green T's transition to independent agent actually worked out better for him than anyone expected—freed from running an organization, he could focus on being a terrifyingly competent individual, which is what he always should have been. WAH.","relatedArticles":["tea_leaf_syndicate","vigilance","green_t","iron_legion"]},{"id":"spider_grove_battle","name":"Battle of the Spider Grove","date":"Day 20-21, 1040 BF","location":"The Silent Grove, Raventree Manor Grounds","type":"Monster Hunt / Multi-phase Battle","result":"Victory — Arachnid Matriarch banished (you are WELCOME)","belligerents":{"attackers":{"name":"The Party & Allies (featuring WALUIGI)","factionId":null,"commander":"Markop, assisted by THE GREAT WALUIGI & The Oracle"},"defenders":{"name":"Arachnid Matriarch & Brood","factionId":null,"commander":"Arachnid Matriarch"}},"casualties":{"attackers":"FNG Remi (unconscious, revived thanks to Waluigi buying time), Smoking J (bitten, venomous reaction), mechanical companion heavily damaged","defenders":"Arachnid Matriarch (BANISHED via Oracle's circle), brood scattered and leaderless"},"summary":"THIS is the one. This is Waluigi's battle. A prolonged multi-phase fight against a massive Arachnid Matriarch in the web-choked Silent Grove. Waluigi cleared paths with ice magic, weakened the Matriarch with arcane rays during the final phase, and generally held the entire operation together while everyone else was getting bitten, swarmed, or separated. The Oracle landed the finishing blow with a banishment circle, which was admittedly impressive, but Waluigi's contributions made that finishing blow POSSIBLE and he will die on this hill.","description":"The Silent Grove was the kind of place that makes sensible people turn around and walk home. Webs so thick they blocked out the sky. Egg sacs carpeting the ground like nature's worst welcome mat. Sounds from deep inside that were less 'forest ambience' and more 'something large and hungry shifting its weight.' Every instinct Waluigi had said DO NOT ENTER.\\n\\nNaturally, the party walked directly in because Eager—who has a supernatural gift for finding the worst possible place to be and BEING there—had gotten himself trapped inside the spider nest. Of COURSE he had. If there's a bottomless pit within ten miles, Eager will find it. If there's a dragon's mouth within walking distance, Eager will be sitting on its tongue. The man is a MAGNET for catastrophe and Waluigi says this with a mixture of frustration and grudging affection.\\n\\nMarkop and Remi led the push in. Waluigi was right there with them, alongside Mossy—a Mages' Guild construct that had been 'acquired' earlier in the campaign through methods that Waluigi will describe as 'creative procurement.' Mossy was a good companion: it didn't complain, it didn't argue about strategy, and it bit things when you pointed at them. Waluigi wishes MORE of his allies had these qualities.\\n\\n**Phase 1: The Rescue**\\nGetting to Eager meant navigating a three-dimensional maze of webbing patrolled by arachnids the size of large dogs. These things moved in PATTERNS—coordinated, deliberate, reacting to vibrations in the web network. Step on the wrong strand and three of them would come skittering from different angles. It was like playing the world's deadliest game of don't-touch-the-floor, and Waluigi is EXCELLENT at that game because Waluigi has superior agility developed through decades of competitive athletics.\\n\\nMarkop cut through the main web barriers with brute force. Remi's mechanical dog provided early warning when flanking spiders approached. And WALUIGI—this is the part the historians always underreport—used ICE MAGIC to freeze and shatter web clusters, opening alternative routes when the main path got too dangerous. This was DELICATE work. Too much force and the vibrations would attract the big one early. Too little and the webbing would just re-seal itself. Waluigi found the balance because Waluigi has the kind of precision that comes from years of practicing trick shots in tennis, and if you think freezing individual web strands isn't harder than a cross-court backhand, you've never tried either.\\n\\nEager was found cocooned near the grove's center, hanging fifteen feet off the ground between two dead oaks like the world's worst piñata. He was alive but completely immobilized. Getting him down required careful cutting and even more careful catching, because dropping Eager from fifteen feet onto a floor covered in egg sacs would have been catastrophic in at least three different ways.\\n\\n**Phase 2: The Grove Fractures**\\nThe rescue attracted attention. Of COURSE it did. The brood started converging from all directions and the careful, precise stealth mission became a running battle across the entire grove.\\n\\nRemi and her mechanical dog held a position near a flooded stone fountain—an old structure choked with black water and dead vegetation that looked like it hadn't seen sunlight in decades. The smaller spiders probed their defensive line looking for weaknesses, testing and retreating and testing again with an intelligence that was DEEPLY unsettling. Spiders should not have tactical patience. Spiders should be small and manageable and afraid of Waluigi's boots.\\n\\nSmoking J got bitten during this phase. The venom hit him FAST—swelling, disorientation, the works. He had to be pulled back from the front line, which reduced their fighting strength at exactly the wrong moment. The toad squad got cut off when a web barrier dropped behind them like a curtain—one second there was a path, the next second there was a wall of silk with toads on the wrong side of it. Communication devolved into shouted fragments across barriers of webbing and darkness.\\n\\nThen the Oracle appeared, because the Oracle has a GIFT for dramatic timing. She materialized from somewhere—she was always watching from somewhere, and Waluigi finds it equal parts reassuring and creepy—and cast a massive illumination spell that turned the entire grove bright as noon. The light didn't just reveal the battlefield; it drove the smaller spiders back, buying precious seconds.\\n\\nWaluigi used those seconds BRILLIANTLY. He channeled ice magic through the webbing, creating frozen corridors that the separated groups could use to regroup. The ice held the web rigid, preventing it from re-sealing, while also creating a surface cold enough to deter the spiders from crossing. It was innovative. It was effective. It was the kind of creative magical application that would get Waluigi a MEDAL in any army that appreciated talent, which is apparently NONE of them. WAH!\\n\\n**Phase 3: Titan Fight**\\nThe Arachnid Matriarch showed herself and Waluigi's stomach dropped.\\n\\nShe was ENORMOUS. Thirty feet across easily, her legs spanning the gaps between trees like living bridges. Her carapace was dark and ridged and scarred from fights that happened before anyone present was born. And her EYES—reflecting the Oracle's light with a cold intelligence that said this wasn't just an animal. This was something OLD. Something that had been ruling this grove for a long time and did not appreciate visitors.\\n\\nMarkop accepted a blessing from the Oracle—words that didn't quite sound like language, more like the noise reality makes when it bends—and grew to colossal size. COLOSSAL. Matching the Matriarch's scale. The sight of two titan-sized combatants grappling among the trees while normal-sized people scrambled between their feet was SURREAL. Waluigi has played sports in some unusual venues but running between the legs of a fifty-foot-tall friend while he wrestles a building-sized spider was a new experience even for him.\\n\\nEager, still stuck in an enlarged form from earlier events that Waluigi doesn't fully understand, contributed by spraying pepper spray on clusters of smaller arachnids. PEPPER SPRAY. On SPIDERS. And it WORKED—the capsaicin apparently disrupted whatever chemical communication the brood used to coordinate, causing them to scatter in confused circles. Waluigi has to give Eager credit for this one. It was the kind of unorthodox thinking that Waluigi appreciates because Waluigi's ENTIRE LIFE is unorthodox thinking.\\n\\nThe battle was then—and Waluigi cannot stress enough how ANNOYING this was—interrupted by the Vigilance flying overhead. Except it wasn't the Vigilance anymore. It was the LEGIONLANCE, under Iron Legion control, and it was broadcasting propaganda through amplified speakers. Compliance orders. Faction registration demands. BUREAUCRATIC ANNOUNCEMENTS during a GIANT SPIDER FIGHT.\\n\\nWaluigi was dodging spider legs, blasting ice magic, trying not to get crushed by his own titan-sized ally, and a loudspeaker above was telling him to 'report to the nearest processing center for administrative review.' The Iron Legion's commitment to paperwork in the face of existential arachnid combat was, in its own horrible way, the most Iron Legion thing that has ever happened. WAH!\\n\\n**Phase 4: The Banishment**\\nThe final phase was DESPERATE and Waluigi is not too proud to admit it.\\n\\nRemi went down. A wave of miniature spiders—hundreds of them, each barely bigger than a fist but collectively a FLOOD—swarmed over her position and she disappeared under a writhing carpet of tiny bodies. She went unconscious. Her mechanical dog fought over her prone body but was taking damage faster than it could clear the swarm.\\n\\nMarkop had the Matriarch in a titan-scale grapple, each of them straining against the other while trees cracked like matchsticks beneath them. But he couldn't deliver a killing blow without releasing his grip, and if he released his grip, the Matriarch would be free to do what giant spiders do to normal-sized people, which is NOTHING GOOD.\\n\\nSo Waluigi stepped up. WALUIGI. The guy nobody picks first. The guy who gets left off the invite list. The guy who Luigi LITERALLY pretends doesn't exist at parties. THAT Waluigi poured sustained arcane rays into the Matriarch, targeting the joints where her legs met her thorax. The magical energy burned through carapace and disrupted the internal structure keeping her upright. Each hit made her legs buckle a little more, her grip on Markop weaken a little further.\\n\\nSalem—perched in the surviving trees like the world's most lethal bird watcher—landed a crossbow bolt through the Matriarch's primary eye cluster. The shot threaded through the chaos of the titan grapple and hit a target the size of a dinner plate at sixty feet. Waluigi will admit that was an INCREDIBLE shot. Waluigi is generous enough to acknowledge excellence in others, UNLIKE certain plumber brothers who shall remain nameless.\\n\\nThe Oracle fired an arrow into the Matriarch's abdomen carrying some kind of magical payload that made the creature convulse and shriek at a frequency Waluigi felt in his TEETH. Mossy, battered but still functioning with the mindless determination that only a construct can muster, clamped its mechanical jaws onto one of the Matriarch's rear legs and HELD ON.\\n\\nThe combined assault—Waluigi's arcane rays, Salem's crossbow bolt, the Oracle's enchanted arrow, Mossy's mechanical death grip—destabilized the Matriarch enough for Markop to shift the grapple. He SHOVED the massive creature backward, and the Oracle—who had been drawing a banishment circle on the ground WITH ONE HAND while fighting with the other, which is a level of multitasking that Waluigi genuinely and unreservedly respects—watched as the Matriarch crashed into the circle's boundary.\\n\\nThe sigils ignited. Light consumed the spider from the ground up—carapace, silk, venom, everything dissolving into brilliance. The sound wasn't a scream. It was a vibration, a frequency that Waluigi felt in his bones and his teeth and the fillings in the tooth he chipped playing baseball that one time.\\n\\nThen she was gone. The grove went silent. Actually SILENT, for the first time in hours.\\n\\nWaluigi stood there in the quiet, breathing hard, covered in web residue and spider ichor, and thought: THAT is why you bring Waluigi.\\n\\nThe loot was excellent, which helped. A War Mage's Staff that Markop claimed on Archie's behalf—and Waluigi has OPINIONS about giving Archie MORE magical firepower but nobody asked. Web-Woven Scale armor that Remi recovered once she regained consciousness and stopped screaming about the tiny spiders. And three healing potions that Rodger grabbed with the desperate speed of a man who had been counting his remaining vitality on one hand for the last hour. Waluigi didn't take any of the healing potions because Waluigi was FINE. Waluigi is ALWAYS fine. Waluigi is built DIFFERENT.\\n\\n(Waluigi was not fine. Waluigi was exhausted and terrified and his hands were shaking from sustained spellcasting. But Waluigi has a REPUTATION to maintain.)","aftermath":"The party divided the Matriarch's hoard and limped back to Raventree Manor looking like they'd been through a washing machine full of cobwebs. The victory in the grove turned out to be one of the last uncomplicated wins before everything went sideways. Upon returning, the party discovered there were MULTIPLE Oracles—not one mysterious guide but several, which raised questions that made Waluigi's head hurt. Who had been guiding them? How many Oracles were there? Were they all on the same side? Waluigi doesn't trust ONE Oracle. MULTIPLE Oracles is a nightmare scenario for anyone with trust issues, which is to say, for Waluigi.\\n\\nThe grove victory directly preceded the Shattered Ritual and the Planar Fracture. Within twenty-four hours of banishing a giant spider, reality itself would shatter around them and Waluigi would find himself in the FEYWILD dealing with fairy court politics. In retrospect, the spider was the easy part. WAH.","relatedArticles":["raventree_manor","the_oracle","markop","archie_miser"]},{"id":"siege_raventree","name":"The Siege of Raventree","date":"Day 18-19, 1040 BF","location":"Raventree Manor","type":"Siege / Supernatural Event","result":"Inconclusive — The manor started fighting EVERYONE and nobody won","belligerents":{"attackers":{"name":"Pond Patrol","factionId":"liberated_toads","commander":"Speaker L"},"defenders":{"name":"Archie Miser & Hjumpik / Manor Wraiths","factionId":null,"commander":"Archie Miser (deeply unhappy about it)"}},"casualties":{"attackers":"Unknown — wraith attacks hit the Pond Patrol perimeter hard","defenders":"Green T (pulled bodily into a mirror dimension by a glass entity)"},"summary":"Speaker L's Pond Patrol surrounded Raventree Manor after a healing attempt on Eager went wrong. Tensions were high. Arguments were had. Then the MANOR ITSELF started spawning wraiths that attacked everyone—besiegers AND defenders—because Raventree Manor is not a building, it's a HOSTILE SUPERNATURAL ENTITY that hates everyone equally. Green T got dragged into a mirror by a glass monster. Waluigi hates this house. Waluigi has ALWAYS hated this house. WAH.","description":"Waluigi knew Raventree Manor was bad news from the MOMENT he first saw it. The architecture was wrong. The shadows fell at angles that didn't match the light sources. Rooms felt larger from the inside than they looked from the outside. And the MIRRORS—every hallway had mirrors, every room had mirrors, and they all reflected things just slightly differently from what was actually there. Waluigi noticed this immediately because Waluigi spends a LOT of time looking in mirrors—for GROOMING purposes—and when a mirror shows you a version of yourself that's standing two inches to the left of where you actually are, that is NOT a grooming mirror, that is a WARNING.\\n\\nBut did anyone listen to Waluigi's concerns? Does anyone EVER listen to Waluigi? The answer is no. The answer has ALWAYS been no.\\n\\nThe siege started because of a breakdown in trust between Speaker L's faction and the people inside the manor. The failed healing attempt on Eager—details documented elsewhere because Waluigi is trying to stay focused—created a rupture. Speaker L concluded that the manor's occupants were either incompetent or hostile, and honestly, he wasn't entirely wrong about the incompetent part. His response was to surround the building with the Pond Patrol and demand answers.\\n\\nFrom a military perspective, the Pond Patrol's encirclement was solid. Speaker L established a perimeter fifty yards from the walls, set up observation posts, controlled visible exits. The man knows how to run a siege. Waluigi will give him that. Speaker L positioned himself at the main approach and made demands through amplified address: surrender Archie for questioning, explain what happened to Eager, submit to Pond Patrol authority.\\n\\nArchie, trapped inside with Hjumpik and a few others, faced limited options. No known secret exits. Outnumbered. Outgunned. So Archie surrendered himself to Speaker L, reasoning that compliance would buy time. This was either smart diplomacy or the instinct of someone who knew the manor had tricks up its sleeve that the Pond Patrol hadn't seen yet. With Archie, Waluigi has learned that the line between 'clever strategy' and 'panicked improvisation' is invisible and possibly fictional.\\n\\n**The Manor Fights Back**\\nWhat happened next is why Waluigi will never set foot in Raventree Manor again. Not voluntarily. Not for money. Not even if Luigi personally BEGGED him, which Luigi would never do because Luigi doesn't know Waluigi EXISTS apparently.\\n\\nRaventree Manor began to defend itself.\\n\\nThe building. Defended. ITSELF.\\n\\nIt started small. Cold spots in hallways. Shadows moving wrong. Whispers in rooms that should have been empty—not words exactly, more like the memory of words, or the threat of words, or the sound a word would make if it hated you. Then the wraiths appeared.\\n\\nThey came from the walls. The floors. The spaces between rooms that shouldn't have had spaces. Translucent, hostile, and—this is the important part—completely INDIFFERENT to which side anyone was on. They attacked Pond Patrol sentries on the perimeter with the same violence they directed at people inside the manor. The building didn't care about factions. It didn't care about politics. It had been provoked, and its response was to try to kill EVERYONE.\\n\\nWaluigi has been in haunted houses before. Waluigi has done the haunted house event at Mario Party TWELVE TIMES. But those were haunted houses with RULES—the ghosts had patterns, the scares were predictable, and at the end you got coins. Raventree Manor had no rules. The wraiths appeared where they wanted, attacked who they wanted, and dissolved back into the architecture when they were done. You can't fight a BUILDING.\\n\\nThe wraiths behaved less like ghosts and more like antibodies—the manor's immune system responding to a perceived infection. The military encirclement had triggered something in the building's supernatural architecture, and that something had decided every living creature in range was a pathogen that needed to be eliminated. Waluigi finds this deeply offensive. Waluigi has excellent hygiene.\\n\\n**The Glass Monster and Green T's Disappearance**\\nAs if wraiths weren't enough—and they were PLENTY, thank you—a GLASS MONSTER crawled out of one of the manor's mirrors.\\n\\nWaluigi needs to explain how disturbing this was. Imagine looking in a mirror—which Waluigi does frequently and with good reason—and instead of seeing your own magnificent reflection, you see something ELSE pushing through the glass from the other side. Something that shouldn't exist. Something made of reflections and sharp edges and wrong angles. Something that enters your world through the mirror like a hand pushing through a soap bubble, except the soap bubble is REALITY and the hand wants to GRAB YOU.\\n\\nThis entity was different from the wraiths. Bigger. More deliberate. It moved through the corridors with purpose—not the random hostility of the wraith antibodies, but the focused intent of something hunting a specific target.\\n\\nThat target was Green T.\\n\\nGreen T had been inside the manor when the siege started. Maybe he was investigating the supernatural phenomena independently—Green T was always investigating things—or maybe he was just in the wrong room at the wrong time. Regardless, the glass monster converged on him.\\n\\nWhat happened next was violent and instant. The entity seized Green T and PULLED him through a mirror surface. Witnesses described it as—one moment Green T was there, fighting, his feet on solid ground. The next moment he was being dragged backward through glass that rippled like water, his expression shifting from combat focus to shock to something Waluigi doesn't want to name. Then he was gone. The mirror surface went still. It reflected nothing but an empty hallway.\\n\\nGreen T had been taken into what would later be identified as a mirror dimension—a layer of reflected reality that existed alongside the physical manor. The same dimensional layer that the manor's mirrors had been subtly connecting to all along. The mirrors that Waluigi had SAID were wrong. The mirrors that Waluigi had WARNED people about. But nobody listens to Waluigi about ANYTHING.\\n\\nSpeaker L, to his credit, maintained discipline among the Pond Patrol even as wraiths attacked his perimeter and reports came in of people being eaten by the architecture. The man has steel nerves. Waluigi respects steel nerves. But the siege's original objectives had become irrelevant. You can't negotiate a prisoner exchange with a building that's spawning ghosts and absorbing people through mirrors. The situation had outgrown politics.\\n\\nThe wraith manifestations eventually subsided—either the manor's defenses ran out of energy or whatever triggered them was satisfied by Green T's capture. The Pond Patrol pulled back to a safer distance but maintained observation. Nobody went inside voluntarily for a while, which Waluigi considers the first SMART decision anyone made regarding Raventree Manor.","aftermath":"Green T's disappearance into the mirror dimension set up his eventual reappearance in the Shadowfell, suggesting the mirror dimension was a transit layer between planes. This would become critical information during the Planar Fracture. The siege revealed Raventree Manor's true nature—not a building but an active supernatural entity with defenses, agendas, and the ability to devour people through its own décor. Speaker L's relationship with the manor's occupants remained badly strained. The event fed his growing conviction that conventional approaches—military, political, diplomatic—were inadequate for the threats they faced. A conviction that would deepen terribly after the Massacre at Aegis Command.\\n\\nWaluigi's position on Raventree Manor, for the record, is that it should be burned to the ground. Waluigi is aware that Archie would probably volunteer for this task and that is ONE context in which Waluigi would fully support Archie's pyromaniac tendencies. WAH.","relatedArticles":["raventree_manor","archie_miser","liberated_toads","green_t"]},{"id":"iron_sky_breach","name":"The Iron Sky Breach","date":"Day 20, 1040 BF (16:30)","location":"Aboard the Vigilance (airspace)","type":"Boarding Action","result":"Decisive Iron Legion Victory (and Waluigi is STILL mad about it)","belligerents":{"attackers":{"name":"Iron Legion","factionId":"iron_legion","commander":"Unknown Legion Commander"},"defenders":{"name":"Liberated Toads / Party","factionId":"liberated_toads","commander":"Various (needed Waluigi)"}},"casualties":{"attackers":"Light — the operation was disgustingly efficient","defenders":"Ship captured, crew scattered or detained; Ryan forced to jump from the airship"},"summary":"The Iron Legion stole the Vigilance. Waluigi's HOME. The airship that everyone lived on, organized from, and relied on was seized in a coordinated boarding action and renamed the 'Legionlance,' which is a TERRIBLE name that sounds like a medical device. Ryan had to jump off the ship to survive. Bones went undercover inside the Legion. This was the worst day of the crisis until Order 120 made it look like a minor inconvenience. WAH!","description":"This battle makes Waluigi angrier than almost anything else in the entire campaign, and Waluigi is someone who maintains a COMPREHENSIVE list of things that make him angry. The Vigilance wasn't just a ship. It was where people LIVED. It was where factions met, where deals were made, where Waluigi kept his spare hats and his emergency tennis racket. The Iron Legion didn't just capture a military asset—they took people's HOME and turned it into a propaganda platform.\\n\\nThe Legion had been planning this for a long time. Intelligence recovered afterward showed they'd had operatives aboard for DAYS before the assault—mapping patrol routes, cataloguing defensive weaknesses, identifying where key people slept and ate and went to the bathroom. Because the Iron Legion is the kind of organization that considers 'bathroom schedules' a legitimate category of military intelligence. Waluigi finds them infuriating precisely BECAUSE they're competent. Incompetent enemies are annoying. Competent enemies are DANGEROUS. And the Iron Legion is dangerously, boringly, relentlessly competent.\\n\\nThe boarding launched at 16:30, timed to hit during a shift change in the Vigilance's defensive crew. Waluigi wants everyone to note that—DURING A SHIFT CHANGE. They knew the rotation schedule. They knew the exact twelve-minute window when the fewest defenders would be in position. They rehearsed this. They probably had a FLOWCHART.\\n\\nLegion assault teams breached from multiple points simultaneously—cargo bay, observation deck, engine access corridors. Each team had specific objectives. Specific targets. The whole operation moved like clockwork, and Waluigi hates clockwork because it implies a world where everything goes according to someone else's plan.\\n\\nThe defenders were caught in the worst possible configuration. Between shifts. Scattered. Focused on external threats when the real danger was already inside the walls. The Liberated Toads had been worried about Fawful, about the Loyalists, about the factional tensions that were daily life aboard the Vigilance. Nobody had prepared for the Iron Legion to stop being 'that annoying faction that demands paperwork' and start being 'the faction that takes your ship.'\\n\\n**Ryan's Jump**\\nRyan's escape is the part of this story that makes Waluigi's chest tight.\\n\\nRyan was cornered on the observation deck. Legion troops closing from two directions. No other exit. And Ryan—who is braver than Waluigi will ever be, and Waluigi does not say that about many people—chose the third option.\\n\\nHe jumped.\\n\\nOff the observation deck. Off the Vigilance. Off an AIRSHIP that was flying through the SKY.\\n\\nThe fall should have killed him. By any reasonable measure of physics and biology and the basic unfairness of gravity, Ryan should have died. But he didn't. Something about the angle, the air currents, hitting the tree canopy in a way that broke his fall across multiple impacts instead of one—Waluigi doesn't fully understand the mechanics and honestly doesn't want to because if he thinks about it too hard he starts hyperventilating.\\n\\nRyan survived with injuries. A Rakasha spirit-walker found him and took him in, which opened an entirely new chapter of the story. But the IMAGE—Ryan going over the railing, falling, getting SMALLER—that stays with Waluigi. Nobody should have to jump off their own home to survive. Nobody.\\n\\n**Bones Goes Under**\\nBones made a different choice and Waluigi respects it equally. Instead of running, Bones grabbed equipment off a fallen Legionnaire and BECAME a Legionnaire. Just like that. He stepped into the enemy's uniform, adopted their bearing, and walked through three security checkpoints on forged credentials and sheer nerve.\\n\\nThe disguise worked because the Iron Legion's greatest strength is also its greatest weakness: rigidity. As long as someone had the right uniform, the right papers, and followed the right protocols, the system assumed they belonged. Bones exploited this flaw brilliantly. He attended briefings. He ate in Legion mess halls. He saluted officers who would have killed him if they knew who he was. Waluigi could NEVER do this because Waluigi is too distinctive—you can't disguise six feet of purple magnificence in grey Legion armor. But Waluigi recognizes the skill.\\n\\nBones penetrated deeper and deeper into Legion territory, eventually reaching an Imperial Processing Facility. What he found inside was disturbing in ways that Waluigi does not have adequate language for. The facility treated prisoners with an industrial efficiency that stripped away personhood and replaced it with paperwork. People became case numbers. Lives became logistics problems. It was evil dressed up as administration, and it was the first clear sign that the Iron Legion wasn't just an annoying military faction—it was something much worse.\\n\\n**The Legionlance**\\nThe captured Vigilance was renamed the 'Legionlance.' THE LEGIONLANCE. Waluigi has OPINIONS about this na
