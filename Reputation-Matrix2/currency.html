
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Regional Markets</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="currency.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 <h2 class="page-title">Regional Markets & Currencies</h2>
                 <p class="page-subtitle">Analyze exchange rates from major economic hubs across the Doughnut World. Currency acceptance and local economic strength heavily influence trading outcomes.</p>
                 <div id="currency-container">
                    <div id="market-selector-container">
                        <label for="market-selector">Select Trading Market</label>
                        <select id="market-selector"></select>
                    </div>
                    <div class="currency-card market-rates-card">
                        <h3 id="market-rates-title">Market Rates</h3>
                        <div id="market-rates-container"></div>
                    </div>
                    <div class="currency-card converter-card">
                        <h3>Currency Converter</h3>
                        <div id="exchange-rate-converter"></div>
                    </div>
                    <h3 class="page-title" style="margin-top: 32px; font-size: 1.5rem; color: var(--text-secondary); grid-column: 1 / -1;">Party Wallets</h3>
                    <div id="wallets-container" class="currency-grid"></div>
                 </div>
            </main>
        </div>
    </div>
    <div id="currency-tooltip" class="tooltip"></div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="currency.js"></script>
</body>
</html>
