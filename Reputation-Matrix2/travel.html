
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Travel Guide</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="travel.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
             <aside id="sidebar"></aside>
            <main id="main-content">
                 <h2 class="page-title">Inter-Regional Travel Guide</h2>
                 <p class="page-subtitle">Advisories, border laws, and cultural expectations for travelers navigating the fractured realms of the Doughnut World.</p>
                 
                 <div id="travel-container">
                    <div class="travel-controls">
                        <input type="text" id="travel-search" placeholder="Search for a realm or city...">
                        <div class="filter-pills">
                            <button class="pill-btn active" data-filter="all">All</button>
                            <button class="pill-btn" data-filter="safe">Safe</button>
                            <button class="pill-btn" data-filter="restricted">Restricted</button>
                            <button class="pill-btn" data-filter="hostile">Hostile</button>
                        </div>
                    </div>
                    <div id="travel-cards-grid">
                        <!-- Injected by JS -->
                    </div>
                 </div>
            </main>
        </div>
    </div>
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="travel.js"></script>
</body>
</html>
