<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Login</title>
    <link rel="stylesheet" href="Reputation-Matrix2/global.css">
    <link rel="stylesheet" href="Reputation-Matrix2/components.css">
    <link rel="stylesheet" href="Reputation-Matrix2/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4",
    "vite": "https://esm.sh/vite@^7.1.2"
  }
}
</script>

</head>
<body>
    <div id="startup-screen">
        <div class="startup-container">
            <div class="startup-header">
                <img src="Reputation-Matrix2/logo.png" alt="Waluigi Logo" class="startup-logo">
                <h1 class="startup-title">Vigilance</h1>
                <p class="startup-subtitle">Next Session Briefing</p>
            </div>
            
            <div id="session-dashboard">
                <!-- Dashboard widgets will be dynamically injected here by login.js -->
            </div>

            <div class="startup-actions">
                <button id="enter-app-btn" class="startup-btn">Access Waluipedia Terminal</button>
                <button id="books-btn" class="startup-btn" onclick="location.href='Reputation-Matrix2/bookshelf.html'">📜 Inkwell's Scriptorium</button>
                <button id="currency-btn" class="startup-btn" onclick="location.href='Reputation-Matrix2/currency.html'">💱 Currency Bank</button>
                <button id="shop-btn" class="startup-btn" onclick="location.href='Reputation-Matrix2/shop.html'">🛒 Wario Shop</button>
                <button id="timeline-btn" class="startup-btn" onclick="location.href='timeline/index.html'">🕰️ Campaign Timeline</button>
                <button id="new-operator-btn" class="startup-btn">New Operator</button>
            </div>
        </div>
    </div>

    <div id="character-login-screen">
        <div class="login-container">
            <div class="login-header">
                <img src="Reputation-Matrix2/logo.png" alt="Waluigi Logo">
                <h1>Vigilance Terminal</h1>
                <p>Select Your Operator Profile</p>
            </div>
            <div id="character-select-grid">
                <!-- Character cards will be injected by login.js -->
            </div>
            <div class="login-options">
                <button id="generic-login-btn" class="login-option-btn">Generic Profile</button>
                <button id="skip-intro-btn" class="login-option-btn">Skip Intro</button>
            </div>
        </div>
    </div>

    <div id="intro-sequence-overlay" class="hidden">
        <div class="intro-content">
            <img src="Reputation-Matrix2/logo.png" alt="Waluigi Logo" class="intro-logo">
            <div id="intro-text" class="typewriter"></div>
            <div id="click-prompt" class="hidden">[Click anywhere to continue...]</div>
        </div>
    </div>

    <script>
        // Polyfill for structuredClone if not available
        if (typeof self.structuredClone === 'undefined') {
            self.structuredClone = (obj) => JSON.parse(JSON.stringify(obj));
        }
    </script>
    <script type="module" src="Reputation-Matrix2/common.js"></script>
    <script type="module" src="Reputation-Matrix2/login.js"></script>

</body>
</html>
