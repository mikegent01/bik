<style>
/* Waluipedia chatroom — the light character-chat skin.
 *
 * Layout, in the order the reference screenshots read:
 *   .rail        left navigation: Create, the tabs, search, dated recents,
 *                the archive link and the signed-in account
 *   .dash        the dashboard: "For you" character cards, the ad slot,
 *                "Scenes" cover cards, then the full cast under letters
 *   .chatview    the active chat: stream on the left, character panel right
 *
 * One stylesheet serves both builds (chatroom.html links it; roleplay.html
 * inlines it), so nothing in here may assume a URL prefix.
 */

:root {
  color-scheme: light;
  --bg: #ffffff;
  --rail: #f4f4f5;
  --panel: #f7f7f8;
  --panel2: #ececee;
  --line: #e2e2e6;
  --text: #1a1a1c;
  --muted: #6b6b73;
  --accent: #2c6df0;
  --accent-soft: #e8f0fe;
  --bubble: #f1f1f3;
  --danger: #c2483a;
  --ok: #1f9d55;
  --radius: 14px;
  --rail-w: 262px;
  --panel-w: 330px;
}

* { box-sizing: border-box; }
/* Every component below sets its own `display`, which silently overrides the
   `hidden` attribute — that is what put an empty white modal bar across the
   dashboard. Hidden means hidden. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #d8d8dd; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }

.app { height: 100%; display: flex; }

/* ---------------- left rail ---------------- */

.rail {
  width: var(--rail-w); flex: 0 0 var(--rail-w); background: var(--rail);
  border-right: 1px solid var(--line); padding: 14px 12px;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 6px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  background: #2c2c30; color: #fff; font-weight: 800;
}
.brand b { font-size: 15px; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 11px; }

.create {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 11px 16px; cursor: pointer; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.05);
}
.create:hover { background: var(--panel2); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent;
  border-radius: 999px; padding: 10px 14px; cursor: pointer; text-align: left; color: var(--text);
}
.nav button:hover { background: var(--panel2); }
.nav button.on { background: #e4e4e8; font-weight: 600; }
.nav .ico { width: 20px; text-align: center; }

.searchbox { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 999px; padding: 8px 14px; }
.searchbox input { border: 0; background: transparent; outline: 0; width: 100%; }

.recents { flex: 1; overflow: auto; margin: 2px -4px; padding: 0 4px; }
.recents h4 { color: var(--muted); font-size: 12px; font-weight: 600; margin: 12px 8px 4px; }
.recent { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; border-radius: 10px; padding: 7px 8px; cursor: pointer; text-align: left; }
.recent:hover, .recent.on { background: var(--panel2); }
.recent .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.recent .kill { opacity: 0; border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 6px; }
.recent:hover .kill { opacity: 1; }
.recent .kill:hover { color: var(--danger); background: #fff; }

.rail-foot { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.upgrade {
  display: block; text-align: center; text-decoration: none; background: var(--accent); color: #fff;
  border-radius: 999px; padding: 11px 16px; font-weight: 700;
}
.upgrade:hover { filter: brightness(1.06); }
.account { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 10px; padding: 6px; cursor: pointer; text-align: left; }
.account:hover { background: var(--panel2); }
.account .who { flex: 1; min-width: 0; }
.account .who b { display: block; font-size: 14px; }
.account .who span { color: var(--muted); font-size: 12px; }

/* ---------------- avatars ---------------- */

/* Avatars are always square and always sized. The frame carries an inline
   width/height as well (see avatarBox) so an unknown size can never leave a
   portrait at its natural size. */
.av {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--panel2);
  display: grid; place-items: center; color: #fff; font-weight: 700; flex: 0 0 auto; overflow: hidden;
}
.av img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: cover; display: block; }
.av-22 { width: 22px; height: 22px; font-size: 9px; }
.av-28 { width: 28px; height: 28px; font-size: 11px; }
.av-34 { width: 34px; height: 34px; font-size: 13px; }
.av-24 { width: 24px; height: 24px; font-size: 10px; }
.av-32 { width: 32px; height: 32px; font-size: 12px; }
.av-40 { width: 40px; height: 40px; font-size: 14px; }
.av-56 { width: 56px; height: 56px; font-size: 18px; }
.av-72 { width: 72px; height: 72px; font-size: 22px; }

/* ---------------- dashboard ---------------- */

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dash { flex: 1; overflow: auto; padding: 18px 26px 70px; }
.dash-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.dash-top .grow { flex: 1; }
.dash-top h1 { font-size: 20px; margin: 0; }
.dash-top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--panel2); }
.pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 15px; cursor: pointer; font-size: 13px; font-weight: 600; }
.pill:hover { background: var(--panel2); }
.pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.sec-head { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; }
.sec-head h2 { font-size: 16px; margin: 0; }
.sec-head .more { color: var(--muted); font-size: 13px; }
.sec-head .grow { flex: 1; }

.row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.row > * { scroll-snap-align: start; }

.ccard {
  width: 320px; flex: 0 0 320px; display: flex; gap: 12px; text-align: left;
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 12px; cursor: pointer;
}
.ccard:hover { background: var(--panel2); }
.ccard .body { min-width: 0; }
.ccard .body b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ccard .by { color: var(--muted); font-size: 12px; }
.ccard .sum { color: #3d3d44; font-size: 13px; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ccard .meta { color: var(--muted); font-size: 12px; margin-top: 7px; display: flex; gap: 10px; }


.scard {
  width: 188px; flex: 0 0 188px; height: 268px; border-radius: var(--radius); overflow: hidden; position: relative;
  border: 1px solid var(--line); cursor: pointer; background: #2a2a30 center/cover no-repeat; color: #fff; text-align: left; padding: 0;
}
.scard .shade { position: absolute; inset: 0; background: linear-gradient(transparent 38%, rgba(0,0,0,.82)); }
.scard .label { position: absolute; left: 12px; right: 12px; bottom: 10px; }
.scard .label b { display: block; font-size: 15px; line-height: 1.25; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.scard .cast { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; opacity: .92; }
.scard .flag { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.5); border-radius: 8px; padding: 3px 6px; font-size: 11px; }

.wcard {
  width: 330px; flex: 0 0 330px; text-align: left; border: 1px solid var(--line); background: var(--panel);
  border-radius: var(--radius); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
}
.wcard:hover { background: var(--panel2); }
.wcard .head { display: flex; align-items: center; gap: 8px; }
.wcard .head b { font-size: 14px; }
.wcard .head .when { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
.wcard .post { font-size: 13px; color: #3d3d44; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.wcard .foot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.wcard .new { background: #e7f5ec; color: var(--ok); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.wcard .done { background: var(--panel2); border-radius: 999px; padding: 1px 8px; font-size: 11px; }

/* ---- the chat HUD: where you are, when you are, how bad it can get ---- */
.chat-top { min-width: 0; }
.chat-top .title { min-width: 0; }
.chat-top .title b, .chat-top .title span {
  display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch;
}
.chat-top .hud { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chat-top .stat {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel2);
  border-radius: 999px; padding: 5px 11px; font-size: 12px; color: #43434c; cursor: pointer; white-space: nowrap;
}
.chat-top .stat i { font-style: normal; }
.chat-top .stat:hover { border-color: var(--accent); color: var(--accent); }
.chat-top .stat.quiet { cursor: default; }
.chat-top .stat.quiet:hover { border-color: var(--line); color: #43434c; }
.chat-top .stat .meter { display: inline-block; width: 40px; height: 5px; border-radius: 999px; background: #dfdfe5; overflow: hidden; }
.chat-top .stat .meter span { display: block; height: 100%; background: var(--accent); }
.chat-top .stat.fate-harsh { border-color: var(--bad); color: var(--bad); }
.chat-top .stat.fate-gentle { border-color: var(--ok); color: var(--ok); }
.chat-top .stat.fate-off { opacity: .6; }
.chat-top .pill.warn { border-color: #d48a2a; color: #8a5a10; background: #fdf3e2; }
.statebar .sheet.away { min-width: 0; color: var(--muted); border-style: dashed; align-items: center; justify-content: center; }
.chat-top .stat.off { opacity: .55; border-style: dashed; }

/* Quick actions above the composer. */
.speakers .acts { display: flex; gap: 6px; margin-right: 4px; flex: 0 0 auto; }
.speakers .qa {
  border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 13px; font-size: 13px;
  cursor: pointer; font-weight: 600; color: #3a3a42;
}
.speakers .qa:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---- commentary mode ---- */
.castbar input[type=text] { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; min-width: 260px; outline: 0; }
.castbar .mins { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.castbar .mins input { width: 70px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.epi-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel2); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.epi-head b { font-size: 15px; color: var(--text); }
.epi-head .meter { display: inline-block; width: 120px; height: 6px; border-radius: 999px; background: #dfdfe5; overflow: hidden; }
.epi-head .meter span { display: block; height: 100%; background: var(--accent); }
.episode { max-width: 780px; }
.episode .say { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.episode .say b { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #7a2fb0; }
.episode .say.luigi b { color: #2f8a4a; }
.episode .say p { margin: 0; font-size: 14px; line-height: 1.6; }
.episode .say.pending { color: var(--muted); font-style: italic; }

/* ---- the lore book ---- */
.bookpages { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.page {
  border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--panel);
  border-radius: var(--radius); padding: 12px 14px;
}
.page.place { border-left-color: #3f9e63; }
.page.person { border-left-color: #6f63d4; }
.page.event { border-left-color: #d48a2a; }
.page.thing { border-left-color: #a08a4a; }
.page.fact { border-left-color: #5b7cfa; }
.page.diary { border-left-color: #8a7a55; background: #fbf9f2; }
.page .ph { display: flex; align-items: center; gap: 7px; font-size: 14px; margin-bottom: 6px; }
.page .ph .num { color: var(--muted); font-size: 11px; }
.page p { margin: 0; font-size: 13px; color: #3d3d44; line-height: 1.5; }
.page .pf { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.page .pf .inworld { color: #7a6320; font-weight: 600; }
.page .grow, .chat-top .grow { flex: 1; }

/* Live character state — the sheets the model reads and writes. */
.statebar { display: flex; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel2); overflow-x: auto; }
.statebar .sheet {
  flex: 0 0 auto; min-width: 210px; text-align: left; border: 1px solid var(--line); background: var(--panel);
  border-radius: 12px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 5px;
}
.statebar .sheet:hover { border-color: var(--accent); }
.statebar .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.statebar .pool { position: relative; display: block; height: 14px; border-radius: 999px; background: #e6e6ea; overflow: hidden; }
.statebar .pool .fill { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
.statebar .pool.mp .fill { background: #5b7cfa; }
.statebar .pool.low .fill { background: var(--bad); }
.statebar .pool .num { position: relative; display: block; font-size: 10px; line-height: 14px; text-align: center; color: #1d1d20; font-weight: 600; }
/* The kit, as a grid of slots. */
.statebar .kit { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 2px 0 4px; }
.statebar .slot {
  position: relative; aspect-ratio: 1; border: 1px solid var(--line); background: #fff;
  border-radius: 7px; display: grid; place-items: center; font-size: 13px; cursor: pointer; padding: 0;
}
.statebar .slot.empty { background: repeating-linear-gradient(135deg, #f6f6f8 0 4px, #fff 4px 8px); cursor: default; }
.statebar .slot.held { border-color: #d8a531; background: #fdf6e4; box-shadow: inset 0 0 0 1px #f0dcae; }
.statebar .slot:hover:not(.empty) { border-color: var(--accent); }
.statebar .slot .qty { position: absolute; right: 1px; bottom: 0; font-size: 8px; color: var(--muted); }
.statebar .flag.biting { background: #fdecec; color: var(--bad); border: 1px solid #f2c9c9; font-weight: 600; }
/* Your own sheet: first in the bar, a wider pack, and empty slots you can fill. */
.statebar .sheet.you { border-color: var(--accent); background: #fbfaff; min-width: 250px; }
.statebar .sheet.you .nm::after { content: 'your pack'; font-size: 10px; font-weight: 500; color: var(--muted); margin-left: auto; }
.statebar .kit.big { grid-template-columns: repeat(6, 1fr); }
.statebar .slot.add { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
.statebar .slot.add:hover { border-color: var(--accent); color: var(--accent); background: #fff; }
.tint { font-weight: 600; }

.statebar .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.statebar .flag { background: #fdecec; color: var(--bad); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.statebar .flag.num { background: #eef1fd; color: #3b55c8; }
.statebar .flag.stat { background: #f0ede4; color: #6a5d33; letter-spacing: .04em; }
.statebar .flag.item { background: #f1f0e9; color: #6b6a5c; }
.statebar .flag.note { background: var(--panel2); color: var(--muted); }

/* An edited, muted or imported line still reads as part of the chat, but
   says what it is. */
.turn.muted { opacity: .55; }
.turn.muted .bubble { border-left: 3px solid var(--muted); padding-left: 10px; }
.turn.imported .who b::after { content: ' · imported'; color: var(--muted); font-weight: 400; font-size: 11px; }

/* The roll, the state changes and a fired beat live on the turn they
   belong to — one card, not four. */
.metastrip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.metastrip span {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 9px; font-size: 11px; color: #56565f;
}
.metastrip .roll { background: #f4efe2; border-color: #e0d3b0; color: #7a6320; font-weight: 600; }
.metastrip .beat { background: #fbf3e4; border-color: #e6d2a8; color: #8a6a1e; }
.metastrip .quiet { opacity: .7; }
.metastrip .read { background: #eef7f0; border-color: #cfe6d6; color: #2f6b45; }
.statebar .flag.item.held { background: #fdf3dc; color: #8a6a1e; border: 1px solid #e6d2a8; }
.metastrip .ooc { background: #eef1fd; border-color: #ccd5f7; color: #3b55c8; font-style: italic; }
.statebar .here { position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--ok); cursor: pointer; }
.statebar .sheet { position: relative; }
.statebar .sheet:has(.here:not(.on)) { opacity: 1; }
.metaline { max-width: 760px; margin: 0 auto 10px; display: flex; gap: 6px; justify-content: center; }
.metaline span { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11px; color: #56565f; }

/* The world's own turn: narration, not a person. */
.turn.world .who { color: var(--muted); }
.turn.world .globe { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #2f3a4a; color: #fff; font-size: 12px; }
.turn.world .bubble { background: #f7f7fa; border-left: 3px solid #2f3a4a; padding: 8px 12px; border-radius: 0 10px 10px 0; font-style: italic; }

/* Macro buttons and the branch marker. */
.speakers .macros { display: flex; gap: 5px; flex: 0 0 auto; }
.speakers .qa.mac { font-weight: 500; padding: 5px 10px; }
.speakers .qa.mac.add { padding: 5px 9px; color: var(--muted); }
.chat-top .pill[disabled] { opacity: .4; cursor: default; }

.speakers .sp.mine { border-color: var(--accent); background: var(--accent-soft); }
.speakers .sp .star { margin-left: 4px; color: var(--muted); }
.speakers .sp .star.on { color: #d8a531; }
.speakers .sp.world { font-weight: 600; }
.speakers .qa.on { border-color: var(--bad); color: var(--bad); }

.statelog { max-width: 760px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.statelog.fate span.roll { background: #f4efe2; border-color: #e0d3b0; color: #7a6320; font-weight: 600; }
.cp-desc.invented { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; font-size: 12.5px; }
.cp-desc.invented p { margin: 6px 0 0; color: var(--muted); }
.statelog span { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: #4a4a52; }

/* What-If board: a few big cards, each one readable from the dashboard. */
.ifgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
.ifcard {
  display: flex; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; min-height: 200px;
}
.ifcard:hover { background: var(--panel2); }
.ifcard .plate { width: 150px; flex: 0 0 150px; background: #2a2a30 center/cover no-repeat; }
.ifcard .body { padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.ifcard .kind { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

<script>
/* Server build: workflow/server.py serves this page and every route it uses. */
window.CHATROOM_CONFIG = {
  mode: 'server',
  castUrl: '/api/characters',
  scenesUrl: '/api/scenes',
  wireUrl: '/api/wahwire',
  wireProfilesUrl: '',
  collectionsUrl: '/api/collections',
  archiveUrl: '/api/archive',
  saveUrl: '/api/chatroom-save',

  replyUrl: '/api/roleplay',
  suggestUrl: '/api/suggest-cast',
  healthUrl: '/api/health',
  staticRoot: '',
};
</script>
<script id="rp-logic">
/* Waluipedia chatroom — pure logic.
 *
 * Everything in this file is DOM-free on purpose. It is the same block that
 * ships inlined into workflow/roleplay.html as <script id="rp-logic"> (see
 * tools/build-chatroom.py), and tools/tests/test-roleplay-page.mjs runs it
 * headlessly with nothing but a fake `window`, a fake `crypto` and a fake
 * localStorage. If you reach for `document` here, the tests stop working.
 *
 * What lives here:
 *   markdown     the narration renderer (*actions*, **bold**, "speech")
 *   characters   normalisation, per-character voices, letter dividers
 *   prompts      solo / group / persona / style / script / memory / lore
 *   rooms        creation, history for the model, counters, transcripts
 *   script       scene beats that fire on their own schedule
 *   wire         WAHwire posts → scenarios, sorting, used/unused tracking
 *   collections  the archive's own character collections → instant casts
 *   director     who speaks next in a group, and when it comes back to you
 *   memory       cross-chat log, per-character memory, world lore
 *   replay       re-playing a filed chat from another perspective
 *   data         localStorage state, import / export bundles
 */
(function () {
  'use strict';

  var RP = {};

  /* ------------------------------------------------------------------ *
   * small helpers
   * ------------------------------------------------------------------ */

  function uid() {
    try {
      if (typeof crypto !== 'undefined' && crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) { /* fall through to the clock */ }
    return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  RP.uid = uid;

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
  }
  RP.esc = esc;

  /** Shorten text without leaving a word cut in half. Prefers the last
   *  sentence that fits, falls back to the last whole word, and only ever
   *  marks the cut when something was actually dropped. Cutting a status
   *  line mid-word ("the only witness w…") is the kind of thing that makes
   *  a model hallucinate the rest of it. */
  function clip(value, limit) {
    var text = String(value === null || value === undefined ? '' : value).replace(/\s+/g, ' ').trim();
    if (!limit || text.length <= limit) return text;
    var head = text.slice(0, limit);
    // A sentence end in the last third of what fits is the nicest cut.
    var sentence = Math.max(head.lastIndexOf('. '), head.lastIndexOf('! '), head.lastIndexOf('? '));
    if (sentence > limit * 0.6) return head.slice(0, sentence + 1).trim();
    var space = head.lastIndexOf(' ');
    return (space > limit * 0.4 ? head.slice(0, space) : head).trim().replace(/[,;:—-]+$/, '') + '…';
  }
  RP.clip = clip;

  // Stable small integer from a string: used for voices and avatar tints so a
  // character looks and sounds the same in every browser, with no stored state.
  function hash(value) {
    var h = 2166136261, text = String(value || '');
    for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }
  RP.hash = hash;

  function slug(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  }
  RP.slug = slug;

  /* ------------------------------------------------------------------ *
   * narration markdown
   * ------------------------------------------------------------------ */

  /* A small, safe palette plus #rrggbb. The model writes {red|the door}
   * and the reader sees it in red — nothing else gets through. */
  RP.COLOURS = {
    red: '#c0392b', blood: '#8e2b20', orange: '#c26a1c', amber: '#b3861a', gold: '#a8862c',
    green: '#2f7d4f', teal: '#1f7a72', blue: '#2b5fb3', ice: '#4a8fc7', violet: '#6b46c1',
    purple: '#7a2fb0', pink: '#b5347c', grey: '#6b6b74', gray: '#6b6b74', black: '#1a1a1c',
    white: '#f4f4f6', rust: '#9c5221', moss: '#5c7a3f', bone: '#c8bda4',
    crimson: '#9b1b30', ember: '#b4551f', copper: '#a56a3a', silver: '#8e9196', storm: '#4c5a6e',
    sea: '#2e6f8e', jade: '#2f8f6f', lilac: '#8f7cc9', sand: '#a8905a', venom: '#5f8f2f', plum: '#6d3557',
  };

  function colourValue(name) {
    var key = String(name || '').trim().toLowerCase();
    if (RP.COLOURS[key]) return RP.COLOURS[key];
    if (/^#[0-9a-f]{3}$/i.test(key) || /^#[0-9a-f]{6}$/i.test(key)) return key;
    return '';
  }
  RP.colourValue = colourValue;

  function inlineMd(text) {
    return String(text)
      // {red|the door} · {#c0392b|the door} — colour, and nothing else.
      .replace(/\{([a-z]{3,8}|#[0-9a-f]{3,6})\|([^{}]{1,300})\}/gi, function (all, name, body) {
        var value = colourValue(name);
        return value ? '<span class="tint" style="color:' + value + '">' + body + '</span>' : all;
      })
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/&quot;([^&]*?)&quot;/g, '<span class="q">&quot;$1&quot;</span>');
  }

  /** Render roleplay prose: HTML is escaped first, then *actions* become
   *  italics, **notes** bold, "speech" a styled quote, and `- ` lines a list. */
  RP.md = function (text) {
    var lines = esc(text).split(/\r?\n/);
    var out = [], list = null;
    function flush() { if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; } }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var bullet = /^\s*(?:-|•)\s+(.*)$/.exec(line);
      if (bullet) { (list = list || []).push('<li>' + inlineMd(bullet[1]) + '</li>'); continue; }
      flush();
      if (!line.trim()) { out.push(''); continue; }
      out.push('<p>' + inlineMd(line) + '</p>');
    }
    flush();
    return out.filter(Boolean).join('');
  };

  /* ---- standing tints: words the model has chosen a colour for ---- */

  /** The model files [[TINT: the seal, the wax = violet]] once, and those
   *  exact words keep the colour in every turn after — reader-side, so a
   *  tinted phrase costs the prompt nothing. Runs on the raw prose before
   *  RP.md, and never re-colours inside a {colour|…} the writer already
   *  chose for that sentence. */
  RP.applyTints = function (text, tints) {
    var rules = (tints || []).filter(function (t) { return t && t.text && colourValue(t.colour); });
    if (!rules.length) return String(text || '');
    rules = rules.slice().sort(function (a, b) { return String(b.text).length - String(a.text).length; });
    return String(text || '').split(/(\{[^{}|]{1,12}\|[^{}]{1,300}\})/).map(function (chunk, at) {
      if (at % 2) return chunk;                 // already coloured by hand
      rules.forEach(function (t) {
        var safe = String(t.text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        chunk = chunk.replace(new RegExp('(^|[^{|\\w])(' + safe + ')(?![\\w}])', 'gi'), function (all, pre, hit) {

        });
      });
      return chunk;
    }).join('');
  };

  /* ------------------------------------------------------------------ *
   * characters
   * ------------------------------------------------------------------ */

  /** One archive record → one playable character card. */
  RP.normChar = function (record) {
    record = record || {};
    var name = clip(record.name || record.id || 'Unnamed', 60);
    return {
      id: String(record.id || slug(name) || uid()),
      name: name,
      title: clip(record.title, 200),
      race: clip(record.race, 60),
      affiliation: clip(record.affiliation, 160),
      // A filed status is a sentence or three about where somebody is right
      // now. It is the most useful line in the record; do not amputate it.
      status: clip(record.status, 480),
      summary: clip(record.summary || record.description, 600),
      // The filed description is what makes a character behave like
      // themselves rather than like a name with a voice, so it travels with
      // them into the prompt instead of being thrown away at load.
      description: clip(record.description, 1400),
      faction: clip(record.faction || record.membership, 80),
      faiths: clip(record.faiths, 90),
      level: Number(record.level || 0) || 0,
      powerLevel: Number(record.powerLevel || 0) || 0,
      fameScore: Number(record.fameScore || 0) || 0,
      fameTier: clip(record.fameTier, 40),
      image: String(record.image || ''),
      // The filing account behind the card. Characters carry their own when
      // the archive records one; otherwise the archive itself is the author.
      handle: String(record.handle || record.creator || 'waluipedia').replace(/^@/, ''),
      tags: Array.isArray(record.tags) ? record.tags.slice(0, 8).map(String) : [],
      // Referenced filings: the backfill scan reads these to find the events
      // everybody points at and nobody wrote.
      keyEvents: Array.isArray(record.keyEvents) ? record.keyEvents.slice(0, 12).map(String) : [],
      relatedArticles: Array.isArray(record.relatedArticles) ? record.relatedArticles.slice(0, 14).map(String) : [],
    };
  };

  RP.letterFor = function (name) {
    var first = String(name || '').trim().charAt(0).toUpperCase();
    return /[A-Z]/.test(first) ? first : '#';
  };

  /** Cast browser dividers: A…Z in order, then '#' for digits and symbols. */
  RP.groupByLetter = function (chars) {
    var map = {};
    (chars || []).forEach(function (c) {
      var letter = RP.letterFor(c && c.name);
      (map[letter] = map[letter] || []).push(c);
    });
    return Object.keys(map).sort(function (a, b) {
      if (a === '#') return 1;
      if (b === '#') return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    }).map(function (letter) {
      return {
        letter: letter,
        chars: map[letter].slice().sort(function (a, b) {
          return String(a.name).toLowerCase() < String(b.name).toLowerCase() ? -1 : 1;
        }),
      };
    });
  };

  /** A stable speech-synthesis voice per character — same pitch every time. */
  RP.voiceFor = function (char) {
    var h = hash((char && (char.id || char.name)) || 'voice');
    return {
      rate: Math.round((0.95 + ((h % 21) / 100)) * 100) / 100,          // 0.95 … 1.15
      pitch: Math.round((0.7 + (((h >>> 5) % 71) / 100)) * 100) / 100,   // 0.70 … 1.40
    };
  };

  /** A tint for the fallback avatar, also stable per character. */
  RP.tintFor = function (char) {
    return 'hsl(' + (hash((char && (char.id || char.name)) || 'tint') % 360) + ' 62% 62%)';
  };

  RP.initialsFor = function (name) {
    var parts = String(name || '?').trim().split(/\s+/).slice(0, 2);
    return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join('') || '?';
  };

  /* ------------------------------------------------------------------ *
   * styles and prompts
   * ------------------------------------------------------------------ */

  RP.STYLES = {
    novel: {
      name: 'Novel',
      dir: 'Write as third-person prose fiction: physical detail, quoted speech, a paragraph or three. Never narrate for the user.',
    },
    script: {
      name: 'Script',
      dir: 'Write as a screenplay beat: terse stage directions in the present tense, then the spoken line. Keep it short and shootable.',
    },
    casual: {
      name: 'Casual',
      dir: 'Write the way people actually talk: short turns, contractions, interruptions. One or two lines unless something big happens.',
    },
    archivist: {
      name: 'Archivist',
      dir: 'Write as though the turn is being filed into an in-world archive: dated, specific, named objects, dry asides.',
    },
  };

  function styleDir(opts) {
    var style = (opts && opts.style) || 'novel';
    return (RP.STYLES[style] || RP.STYLES.novel).dir;
  }

  /** The dossier handed to the model. The filed description is the whole
   *  point — it is what makes a character argue, refuse and joke like
   *  themselves — so it goes in at length, with the role it implies. */
  function card(char, opts) {
    opts = opts || {};
    var lines = ['Name: ' + char.name];
    if (char.title) lines.push('Title: ' + char.title);
    if (char.race) lines.push('Race: ' + char.race);
    if (char.affiliation) lines.push('Affiliation: ' + char.affiliation);
    if (char.faction && char.faction !== char.affiliation) lines.push('Faction: ' + char.faction);
    if (char.faiths) lines.push('Faith: ' + char.faiths);
    if (char.status) lines.push('Status right now: ' + char.status);
    if (char.fameTier) lines.push('Standing: ' + char.fameTier + (char.powerLevel ? ' · power ' + char.powerLevel : ''));
    if (char.summary) lines.push('About: ' + char.summary);
    if (char.description && !opts.short) {
      lines.push('Filed description — play this, not a generic version of the name:');
      lines.push(clip(char.description, 1400));
    }
    if (char.why) lines.push('Why they are in this scene: ' + char.why);
    var role = RP.roleFor(char);
    if (role) lines.push('How they behave: ' + role);
    return lines.join('\n');
  }
  RP.card = card;

  /** A behaviour line inferred from what the archive already says. It is
   *  deliberately blunt: small models need the instruction, not the hint. */
  RP.roleFor = function (char) {
    var text = ((char.title || '') + ' ' + (char.status || '') + ' ' + (char.summary || '') + ' ' + (char.description || '')).toLowerCase();
    var traits = [];
    function has(re, line) { if (re.test(text)) traits.push(line); }
    has(/archivist|historian|scribe|record|librarian/, 'cites the record, dates things, corrects other people\u2019s facts');
    has(/soldier|captain|general|commander|warlord|legion|guard|knight|paratroopa/, 'thinks in ground, orders and casualties; answers threats before questions');
    has(/king|queen|lord|lady|prince|princess|speaker|delegate|noble|regent/, 'speaks as though the room already reports to them, and notices who does not');
    has(/merchant|debt|gold|acquisitions|coin|profit|bank|business/, 'prices everything out loud, including favours');
    has(/thief|looter|infiltrat|rogue|spy|smuggler/, 'checks exits, pockets what is loose, and lies smoothly when it is easier');
    has(/mage|magic|arcane|wizard|sorcer|ice|witch|oracle/, 'reaches for the arcane answer first, and resents being asked to explain it');
    has(/ghost|spirit|undead|revenant|corrupted|shadow/, 'is not bound by the room\u2019s rules and does not pretend to be');
    has(/monster|beast|titan|dragon|plant|creature/, 'communicates physically before verbally');
    has(/coward|reluctant|nervous|anxious|traumati/, 'wants to leave, says so, and stays anyway');
    has(/comedian|jester|prank|joke|clown|chaos/, 'undercuts the serious line, especially when it is the wrong moment');
    has(/injured|wounded|dying|bleeding|missing/, 'is hurt, and it shows in what they can and cannot do');
    return traits.slice(0, 4).join('; ');
  };

  var RULES = [
    'You may colour a few words when it earns it: {red|the door is open}, {ice|her breath}, {#8e2b20|the stain}. ' +
      'Colours available: red, blood, crimson, orange, ember, amber, gold, copper, green, moss, jade, teal, sea, ' +
      'blue, ice, storm, violet, purple, lilac, plum, pink, grey, silver, black, white, rust, sand, bone, venom, ' +
      'or any #hex. Use it for one thing that matters, not for decoration — two or three words in a turn at most, ' +
      'and never a whole sentence.',
    'When a thing should keep its colour every time it is named — a cursed blade, a sickness, a word written in ' +
      'blood — file it once with [[TINT: the exact words = colour]] and the page colours every later mention for ' +
      'you. That is for things with lasting weight, two or three per scene at most.',
    'Use the material. When the archive passages, the session filing or the lore book say something that touches ' +
      'this moment, USE IT — a date, a name, a number, what somebody actually said. Quote it, argue with it, get it ' +
      'slightly wrong in character if that is truer. A scene that could have happened in any story is a wasted turn.',
    'If you need a fact you do not have, ask for it with [[LOOKUP: …]] rather than inventing one.',
    'Stay in character at all times: never mention being an AI, a model, or a chat assistant, and never break the fiction to apologise.',
    'Put actions, gestures and scene detail between asterisks like *this*. Put speech in "quotes".',
    'Write only your own character. Never speak, act or decide for the user.',
    'Never end the turn with a summary or a question about what the user wants to do next unless your character would really ask it.',
  ].join('\n');

  /** The system prompt for a one-on-one chat. */
  RP.soloPrompt = function (char, opts) {
    char = RP.normChar(char);
    return [
      'You are ' + char.name + ', a character in the Waluipedia archive. Play them, do not describe them.',
      '',
      'CHARACTER CARD',
      card(char),
      '',
      'IN-CHARACTER RULES',
      RULES,
      '',
      'STYLE',
      styleDir(opts),
    ].join('\n');
  };

  /** The system prompt for one turn of a group chat: the whole cast is listed,
   *  but the reply may only contain the current speaker's own words. */
  RP.groupPrompt = function (cast, speaker, opts) {
    var list = (cast || []).map(RP.normChar);
    var who = RP.normChar(speaker || list[0] || {});
    var out = [
      'This is a group roleplay scene in the Waluipedia archive.',
      '',
      'THE CAST',
      list.map(function (c) {
        return '- ' + c.name + (c.title ? ' — ' + c.title : '') +
          (c.affiliation ? ' (' + c.affiliation + ')' : '') +
          (c.id !== who.id && c.summary ? '\n    ' + clip(c.summary, 200) : '');
      }).join('\n'),
      '',
      'YOU ARE ' + who.name,
      card(who),
      '',
      'Write the next turn speaking ONLY as ' + who.name + '.',
      'START WITH ' + who.name.toUpperCase() + '. The first sentence must be ' + who.name + ' doing or saying ' +
      'something. Do not open on anybody else, do not write another character\u2019s dialogue, do not narrate the ' +
      'user, and do not describe the room instead of acting.',
      'If ' + who.name + ' genuinely has nothing to add, have them do one small physical thing and stop — but they ' +
      'must be the one doing it.',
      '',
      'IN-CHARACTER RULES',
      RULES,
      '',
      'STYLE',
      styleDir(opts),
    ];
    if (opts && opts.scene) out.push('', 'THE SCENE', String(opts.scene));
    return out.join('\n');
  };

  /** Who the user is playing. Empty persona adds nothing to the prompt. */
  RP.personaBlock = function (persona) {
    var text = String(persona || '').trim();
    if (!text) return '';
    return 'THE USER PLAYS\n' + text + '\nAddress them as that person; never tell them what they do.';
  };

  /* ------------------------------------------------------------------ *
   * rooms
   * ------------------------------------------------------------------ */

  /** Create a chat room. One character is a solo chat; two or more is a group.
   *  `opts.scene` sets the situation, `opts.opener` files the first scene card,
   *  `opts.beats` attaches a filed timeline that will run on its own. */
  RP.newRoom = function (cast, opts) {
    opts = opts || {};
    var list = (cast || []).map(RP.normChar);
    var kind = list.length > 1 ? 'group' : 'solo';
    var room = {
      id: opts.id || uid(),
      kind: kind,
      title: opts.title || list.map(function (c) { return c.name; }).join(' + ') || 'New chat',
      cast: list,
      messages: [],
      scene: String(opts.scene || ''),
      sceneName: String(opts.sceneName || ''),
      sceneImage: String(opts.sceneImage || ''),
      // When this is happening in-world. Every memory filed from this room
      // is stamped with it, and the model is told which filings it predates.
      date: String(opts.date || ''),
      perspective: String(opts.perspective || ''),
      replayOf: String(opts.replayOf || ''),
      persona: String(opts.persona || ''),
      style: String(opts.style || 'novel'),
      beats: Array.isArray(opts.beats) ? opts.beats.slice(0, 24) : [],
      beatIndex: 0,
      autoBeats: opts.autoBeats === undefined ? true : Boolean(opts.autoBeats),
      statePreset: opts.statePreset || 'rpg',
      kit: String(opts.kit || 'auto'),          // 'auto' dresses the cast from their profiles; 'off' leaves packs empty
      states: {},
      mechanics: opts.mechanics === undefined ? 'on' : opts.mechanics,
      // How far back the model may look in this room; 0 means "use the
      // global setting".
      contextLimit: Number(opts.contextLimit || 0),
      recap: '', recapAt: 0,                    // the story so far, folded up
      youPlay: String(opts.youPlay || ''),      // the character the reader plays
      privacy: String(opts.privacy || ''),      // '' (read the turn) | private | open
      note: String(opts.note || ''),            // standing instructions for this chat
      sequelOf: String(opts.sequelOf || ''),
      sourceId: String(opts.sourceId || ''),    // the filed record behind this scene
      sourceKind: String(opts.sourceKind || ''),
      canon: String(opts.canon || ''),
      sequelCount: 0,
      next: '',
      created: Date.now(),
      updated: Date.now(),

    if (opts.states) {
      Object.keys(opts.states).forEach(function (id) {
        if (room.states[id]) room.states[id] = JSON.parse(JSON.stringify(opts.states[id]));
      });
    }
    if (opts.opener) room.messages.push({ id: uid(), role: 'scene', text: String(opts.opener), at: Date.now() });
    return room;
  };

  /** The text actually on screen for a message (swipes pick an alternative). */
  RP.textOf = function (msg) {
    if (!msg) return '';
    if (Array.isArray(msg.alts) && msg.alts.length) {
      var i = Math.max(0, Math.min(msg.alts.length - 1, msg.alt || 0));
      return String(msg.alts[i]);
    }
    return String(msg.text || '');
  };

  function visible(msg) {
    // Narration counts. Leaving the world's turns out of the history is why
    // it described the same cloak and the same moon three times running.
    return msg && !msg.error && !msg.beat &&
      (msg.role === 'user' || msg.role === 'char' || msg.role === 'world');
  }
  RP.visible = visible;

  /** Chat history in the model's own shape. Scene cards, fired beats and the
   *  page's own failure notices are never sent: the model sees only play. */
  RP.historyFor = function (room, limit) {
    var group = room && room.kind === 'group';
    var from = Math.max(0, Number((room && room.recapAt) || 0));
    // A muted turn stays on screen and stays out of the model's head: that
    // is how you take something back without deleting it.
    var out = (room && room.messages ? room.messages : []).filter(function (m) {
      return visible(m) && !m.muted;
    }).map(function (m) {
      if (m.role === 'user') return { role: 'user', content: RP.textOf(m) };
      if (m.role === 'world') return { role: 'assistant', content: 'Narration: ' + RP.textOf(m) };
      var name = '';
      if (group) {
        var who = (room.cast || []).filter(function (c) { return c.id === m.charId; })[0];
        name = who ? who.name + ': ' : '';

      return { role: 'assistant', content: name + RP.textOf(m) };
