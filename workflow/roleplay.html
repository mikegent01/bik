<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waluipedia Roleplay</title>
<style>
/* character.ai-styled light theme — palette taken from the reference
   screenshots: #f4f4f5 page, #ececee sidebar, #111720 ink, #68676f muted. */
:root{color-scheme:light;--bg:#f4f4f5;--panel:#ececee;--card:#fafafa;--ink:#111720;--ink2:#3e3536;--muted:#68676f;--line:#c7c7c8;--line2:#e2e2e4;--accent:#5b5bd6;--accent-ink:#fff;--soft:#e8e8f6;--danger:#d9534f;--ok:#2fae8a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100%;display:flex}
/* ---- sidebar ---- */
.sidebar{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line2);padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5b5bd6,#8b5bd6);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:11px}
.side-btn{width:100%;border:0;border-radius:11px;background:transparent;color:var(--ink2);padding:10px 12px;text-align:left;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:9px;align-items:center}
.side-btn:hover{background:#e2e2ea}
.side-btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px rgba(91,91,214,.35)}
.side-btn.primary:hover{filter:brightness(1.08)}
.side-btn svg{flex:0 0 auto}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 2px}
.recents{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.recent-row{display:flex;align-items:center;gap:2px;border-radius:9px}
.recent-row:hover{background:#e2e2ea}
.recent{flex:1;min-width:0;border:0;background:transparent;color:var(--ink2);padding:8px 10px;text-align:left;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:9px}
.recent.active{background:var(--soft);color:var(--ink);font-weight:700}
.recent-act{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:7px;font-size:12px;line-height:1;opacity:0}
.recent-row:hover .recent-act,.recent-act:focus-visible{opacity:1}
.recent-act:hover{color:var(--ink);background:#dcdce4}
.recent-act.danger:hover{color:var(--danger)}
.side-foot{border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.backlink{color:var(--muted);font-size:12.5px;text-decoration:none;padding:4px 10px;border-radius:8px}
.backlink:hover{background:#e2e2ea;color:var(--ink)}
.me{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line2)}
.me-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e0b400,#d9534f);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.me b{font-size:13px;display:block;line-height:1.15}
.me small{color:var(--muted);font-size:11px}
/* ---- main / discover ---- */
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}
.topbar{padding:18px 26px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:21px;margin:0;font-weight:800}
.topbar .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.search{flex:1;min-width:220px;max-width:430px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
.scroll{flex:1;overflow:auto;padding:6px 26px 40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 12px}
.section-head h2{font-size:16.5px;margin:0;font-weight:800}
.section-head a{color:var(--accent);font-size:12.5px;text-decoration:none;cursor:pointer}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ccard{background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.ccard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(17,23,32,.12);border-color:var(--line)}
.ccard-art{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#dcdce8,#c8c8d8);overflow:hidden}
.ccard-art img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.ccard-init{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:900;color:#9a9ab8}
.ccard-byline{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 8px;background:linear-gradient(transparent,rgba(17,23,32,.72));color:#fff;font-size:12.5px;font-weight:700}
.ccard-body{padding:10px 13px 12px}
.ccard-body h3{margin:0;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard-body p{margin:4px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard-meta{display:flex;gap:10px;margin-top:7px;font-size:10.5px;color:var(--muted)}
.ccard-select{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:12px;font-weight:700;padding:9px 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.ccard:hover .ccard-select{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ccard-tag{position:absolute;top:9px;right:9px;background:rgba(17,23,32,.75);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:7px;padding:3px 8px}
/* ---- chat view ---- */
.chatwrap{flex:1;display:flex;min-height:0}
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column}
.chat-head{padding:12px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;background:var(--card)}
.chat-head h2{font-size:15.5px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cast-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:3px 10px 3px 4px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink2)}
.cast-chip img,.cast-chip .mini-init{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--accent)}
.cast-chip.next{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.next-hint{font-size:11px;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:26px 22px 20px}
.msg{display:flex;gap:12px;margin-bottom:22px;max-width:820px}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg-av{width:38px;height:38px;flex:0 0 38px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:15px;border:1px solid var(--line2)}
.msg-av img{width:100%;height:100%;object-fit:cover;object-position:top center}
.msg-main{min-width:0}
.msg-name{font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 3px 2px;display:flex;gap:8px;align-items:center}
.msg-body{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .msg-body{background:var(--soft);border-color:#d8d8f0}
.msg-body em{color:var(--ink2);font-style:italic}
.msg-body .q{color:var(--ink)}
.msg-tools{display:flex;gap:4px;margin-top:4px;opacity:0;transition:.12s}
.msg:hover .msg-tools{opacity:1}
.tool{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:6px}
.tool:hover{background:var(--panel);color:var(--ink)}
.tool.on{color:var(--accent)}
.msg.scene{max-width:none;margin:0 auto 22px}
.scene-card{background:linear-gradient(135deg,#fff,#f0effa);border:1px solid var(--line);border-radius:16px;padding:14px 18px;text-align:center;font-style:italic;color:var(--ink2)}
.scene-card b{font-style:normal;display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.composer-wrap{padding:10px 22px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;color:var(--ink);min-height:24px;max-height:170px;padding:4px}
.cbtn{border:0;border-radius:10px;background:var(--panel);color:var(--ink2);font:inherit;font-size:12.5px;font-weight:700;padding:9px 13px;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:#e2e2ea}
.cbtn.send{background:var(--accent);color:#fff}
.cbtn.send:disabled{opacity:.4;cursor:default}
.composer-note{max-width:820px;margin:7px auto 0;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.counter{font-variant-numeric:tabular-nums}
/* ---- right panel ---- */
.rpanel{width:300px;flex:0 0 300px;border-left:1px solid var(--line2);background:var(--card);overflow:auto;padding:16px}
.rp-card{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.rp-av{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:2px auto 10px;background:var(--soft);display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--accent);border:1px solid var(--line)}
.rp-av img{width:100%;height:100%;object-fit:cover;object-position:top center}
.rp-card h3{margin:0;font-size:16px}
.rp-card .by{color:var(--muted);font-size:11.5px;margin:3px 0 0}
.rp-card .desc{color:var(--ink2);font-size:12px;margin:10px 0 0;text-align:left}
.rp-btn{width:100%;border:0;border-radius:11px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:10px;margin-top:8px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px}
.rp-btn:hover{background:#e2e2ea}
.rp-btn.on{background:var(--soft);color:var(--accent);font-weight:800}
.rp-btn .val{color:var(--muted);font-weight:400;font-size:11.5px}
.rp-list{margin:8px 0 0;padding:0;list-style:none}
.rp-list li{font-size:12px;color:var(--ink2);padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.rp-list li:hover{background:var(--panel)}
.rp-list li small{color:var(--muted)}
.rp-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.rp-field{width:100%;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:12.5px;padding:8px 10px;margin-top:6px;background:#fff;color:var(--ink);resize:vertical}
.rp-cast{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rp-cast-row{display:flex;gap:10px;align-items:center;font-size:12.5px}
.rp-cast-row img,.rp-cast-row .mini-init{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:12px}
/* ---- modal (group picker / create) ---- */
.overlay{position:fixed;inset:0;background:rgba(17,23,32,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(17,23,32,.35)}
.modal-head{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16.5px}
.modal-x{border:0;background:var(--panel);border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--muted)}
.modal-body{padding:8px 20px;overflow:auto}
.modal-foot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 0 12px}
.pick-item{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line2);border-radius:12px;padding:7px 9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2);background:#fff}
.pick-item img,.pick-item .mini-init{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.pick-item.on{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.pick-item span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-row{margin:10px 0}
.form-row label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.form-row input,.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:10px;font:inherit;padding:9px 11px;background:#fff;color:var(--ink)}
.form-row textarea{min-height:90px;resize:vertical}
.empty{max-width:560px;margin:12vh auto 0;text-align:center;color:var(--ink2)}
.empty h2{font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0}
.statusline{padding:8px 22px;font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#b9b9c2}
.dot.online{background:var(--ok)}
@media(max-width:900px){.rpanel{display:none}.sidebar{width:74px;flex-basis:74px;padding:10px 8px}.brand div:last-child,.side-btn span.lbl,.nav-group,.recents,.side-foot .backlink,.me div{display:none}.side-btn{justify-content:center}.ccard-select{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">W</div><div><b>Roleplay</b><small>Waluipedia local cast</small></div></div>
    <button class="side-btn" id="btnDiscover"><span>🔍</span><span class="lbl">Discover characters</span></button>
    <button class="side-btn primary" id="btnGroup"><span>👥</span><span class="lbl">Group chat</span></button>
    <button class="side-btn" id="btnCreate"><span>✨</span><span class="lbl">Create a character</span></button>
    <div class="nav-group">Chats</div>
    <div class="recents" id="recents"></div>
    <div class="side-foot">
      <a class="backlink" href="/">← Assistant chat</a>
      <div class="me"><div class="me-av">m</div><div><b>mike</b><small>@mikegent1</small></div></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Discover</h1><p class="sub" id="pageSub"></p></div>
      <div class="search" id="searchWrap"><span>🔍</span><input id="search" placeholder="Search the cast — name, race, title…"></div>
      <div class="statusline"><i class="dot" id="dot"></i><span id="serviceText">checking the local model…</span></div>
    </div>
    <div class="scroll" id="scroll"><div id="view"></div></div>
  </main>
</div>
<div id="modalHost"></div>

<script id="rp-logic">
/* Pure logic for the roleplay page — no DOM, no fetch. Everything the page
   does to data lives here so it can be tested headless (tools/tests/
   test-roleplay-page.mjs). The wiring script below calls into window.RP. */
(function(){
"use strict";
const RP={};
RP.STORAGE_KEY="waluipedia-roleplay-v1";
RP.ROOM_CAP=30;
RP.CONTINUE_MARKER="[continue]";

RP.STYLES={
  novel:{label:"Novel",dir:"Write immersive novel prose: third person, present tense, actions and narration wrapped in *asterisks*, spoken lines in quotation marks."},
  script:{label:"Script",dir:"Write like a screenplay: a short scene-setting line, then dialogue as NAME: line. Keep narration minimal and punchy."},
  casual:{label:"Casual",dir:"Write short, chatty replies the way a person texts — one to three sentences, asterisks for the occasional action."},
  archive:{label:"Archivist",dir:"Write as if filing field notes into the Waluipedia archive: dry, precise, faintly judgemental, with observations in *asterisks*."}
};

RP.esc=function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));};

/* narration markdown: *actions* italic, "speech" emphasised, HTML-safe */
RP.md=function md(text){
  let s=RP.esc(text);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s=s.replace(/&quot;([^&\n]{1,400})&quot;/g,'<span class="q">\u201C$1\u201D</span>');
  return s;
};

RP.uid=function uid(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));};

RP.normChar=function normChar(c){
  return {
    id:String(c&&c.id||RP.uid()),
    name:String(c&&c.name||"Unnamed"),
    title:String(c&&c.title||"").slice(0,90),
    summary:String(c&&c.summary||c&&c.description||"").slice(0,600),
    image:String(c&&c.image||""),
    source:c&&c.source||"archive",
    prompt:String(c&&c.prompt||"")
  };
};

RP.charCard=function charCard(c){
  const parts=[];
  if(c.title)parts.push(c.title);
  if(c.summary)parts.push(c.summary);
  return parts.join(" ");
};

RP.soloPrompt=function soloPrompt(char,opts){
  opts=opts||{};
  const lines=[];
  lines.push("You are "+char.name+(char.title?" — "+char.title:"")+".");
  if(char.summary)lines.push(char.summary);
  lines.push("Stay fully in character as "+char.name+". This is a roleplay: never mention being an AI or a model, never break character, never narrate the user's actions for them.");
  lines.push((RP.STYLES[opts.style]||RP.STYLES.novel).dir);
  return lines.join("\n");
};

RP.groupPrompt=function groupPrompt(cast,speaker,opts){
  opts=opts||{};
  const lines=[];
  lines.push("This is a group roleplay with several characters sharing one scene.");
  lines.push("The cast:");
  cast.forEach(c=>{lines.push("- "+c.name+(c.title?" — "+c.title:"")+". "+String(c.summary||"").slice(0,220));});
  lines.push("You are speaking ONLY as "+speaker.name+" right now. The other characters are played separately; you may notice them and react to them, but never write their lines.");
  lines.push("Stay fully in character. Never mention being an AI or a model, never narrate the user's actions for them.");
  if(opts.scene)lines.push("The scene: "+opts.scene);
  lines.push((RP.STYLES[opts.style]||RP.STYLES.novel).dir);
  return lines.join("\n");
};

RP.personaBlock=function personaBlock(persona){
  const p=String(persona||"").trim();
  return p?("The person you are talking to plays: "+p):"";
};

RP.styleFor=function styleFor(room){return (room&&RP.STYLES[room.style])?room.style:"novel";};

RP.historyFor=function historyFor(room){
  const group=RP.isGroup(room);
  const out=[];
  (room&&room.messages||[]).forEach(m=>{
    if(m.error||m.role==="scene")return;
    const text=String(m.text||"");
    if(!text.trim())return;
    if(m.role==="user"){
      if(text===RP.CONTINUE_MARKER)return;
      out.push({role:"user",content:text});
    }else if(m.charId){
      const c=(room.cast||[]).find(x=>x.id===m.charId);
      const name=c?c.name:"Character";
      out.push({role:"assistant",name:name,content:(group?name+": ":"")+text});
    }
  });
  return out;
};

RP.stripSpeaker=function stripSpeaker(text,expected){
  let s=String(text||"").trim();
  const name=String(expected||"").trim();
  if(name){
    const re=new RegExp("^"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*:\\s*","i");
    s=s.replace(re,"");
  }
  s=s.replace(/^\s*[A-Z][a-z0-9_-]{0,20}\s*:\s+/,"");
  return s.trim();
};

RP.isGroup=function isGroup(room){return (room&&room.cast||[]).length>1;};

RP.rotationAfter=function rotationAfter(cast,charId){
  if(!cast||!cast.length)return null;
  const i=cast.findIndex(c=>c.id===charId);
  return cast[(i+1)%cast.length];
};

RP.nextSpeaker=function nextSpeaker(room,preferred){
  const cast=room&&room.cast||[];
  if(!cast.length)return null;
  if(preferred&&cast.some(c=>c.id===preferred))return cast.find(c=>c.id===preferred);
  if(room.next&&cast.some(c=>c.id===room.next))return cast.find(c=>c.id===room.next);
  const last=[...(room.messages||[])].reverse().find(m=>m.charId);
  if(last){const nxt=RP.rotationAfter(cast,last.charId);if(nxt)return nxt;}
  return cast[0];
};

RP.voiceFor=function voiceFor(char){
  let h=0;const s=String(char&&char.id||"");
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return {rate:0.95+(h%10)/50,pitch:0.7+(h%7)/10};
};

RP.roomCountFor=function roomCountFor(rooms,charId){
  return (rooms||[]).filter(r=>(r.cast||[]).some(c=>c.id===charId)).length;
};

RP.groupBuckets=function groupBuckets(rooms){
  const now=Date.now(),DAY=86400000;
  const cut={today:new Date(new Date().toDateString()).getTime(),month:new Date(now-30*DAY).getTime()};
  const out={today:[],yesterday:[],month:[],older:[]};
  (rooms||[]).slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(r=>{
    const t=r.updated||0;
    if(t>=cut.today)out.today.push(r);
    else if(t>=cut.today-DAY)out.yesterday.push(r);
    else if(t>=cut.month)out.month.push(r);
    else out.older.push(r);
  });
  return out;
};

RP.newRoom=function newRoom(cast,opts){
  opts=opts||{};
  const norm=(cast||[]).map(RP.normChar);
  return {
    id:RP.uid(),
    title:opts.title||(norm.length===1?norm[0].name:norm.length?"Group: "+norm.map(c=>c.name).join(" + "):"New chat"),
    kind:norm.length>1?"group":"solo",
    cast:norm,
    messages:opts.opener?[{id:RP.uid(),role:"scene",text:String(opts.opener),ts:Date.now()}]:[],
    persona:opts.persona||"",
    style:opts.style||"novel",
    scene:opts.scene||"",
    renamed:false,created:Date.now(),updated:Date.now(),
    next:""
  };
};

RP.transcript=function transcript(room){
  const lines=[];
  lines.push("# "+(room.title||"Roleplay transcript"));
  lines.push("");
  if(room.cast&&room.cast.length){
    lines.push("**Cast:** "+room.cast.map(c=>c.name+(c.title?" — *"+c.title+"*":"")).join(" · "));
    lines.push("");
  }
  if(room.scene){lines.push("> "+room.scene.replace(/\n/g,"\n> "));lines.push("");}
  (room.messages||[]).forEach(m=>{
    if(m.error)return;
    if(m.role==="scene"){lines.push("> "+m.text.replace(/\n/g,"\n> "));lines.push("");}
    else if(m.role==="user"){lines.push("**You:** "+m.text);lines.push("");}
    else{
      const c=(room.cast||[]).find(x=>x.id===m.charId);
      lines.push("**"+(c?c.name:"Character")+":** "+m.text);lines.push("");
    }
  });
  lines.push("*Exported from Waluipedia Roleplay — "+new Date().toISOString().slice(0,10)+"*");
  return lines.join("\n");
};

RP.loadState=function loadState(storage){
  try{
    const v=JSON.parse((storage&&storage.getItem(RP.STORAGE_KEY))||"null");
    if(v&&Array.isArray(v.rooms))return v;
  }catch(e){}
  return {v:1,rooms:[],chars:[],active:"",settings:{autoSpeak:false}};
};

RP.saveState=function saveState(storage,state){
  state.rooms=(state.rooms||[]).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,RP.ROOM_CAP);
  try{storage&&storage.setItem(RP.STORAGE_KEY,JSON.stringify(state));}catch(e){}
  return state;
};

RP.touch=function touch(room){room.updated=Date.now();};
RP.counter=function counter(room){return (room&&room.messages||[]).filter(m=>!m.error&&m.role!=="scene").length;};

window.RP=RP;
})();
</script>

<script id="rp-app">
/* DOM wiring: renders views, talks to the server, keeps state in RP. */
(function(){
"use strict";
const $=id=>document.getElementById(id);
const state=RP.loadState(window.localStorage);
if(!state.rooms.length)state.rooms=[];
let view="discover";
let archiveCast=[];
let scenes=[];
let speakerPick="";        // explicit group speaker choice (modal in progress)
let groupSeed=[];
let groupScene="";
let busy=false;

/* ---------- api ---------- */
async function api(path,payload){
  const res=await fetch(path,payload?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}:undefined);
  const val=await res.json().catch(()=>({}));
  if(!res.ok||val.error)throw new Error(val.error||("request failed: "+res.status));
  return val;
}
async function health(){
  try{
    const d=await api("/api/health");
    const on=!!(d.lm_studio&&d.lm_studio.online);
    $("dot").classList.toggle("online",on);
    $("serviceText").textContent=on?"local model online":"local model offline — start LM Studio";
  }catch(e){$("serviceText").textContent="server unreachable";}
}

/* ---------- helpers ---------- */
function room(){return state.rooms.find(r=>r.id===state.active)}
function avatarHtml(c,size){
  if(c&&c.image)return '<img src="'+RP.esc(c.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  return RP.esc((c&&c.name||"?").trim().charAt(0).toUpperCase());
}
function allChars(){return archiveCast.concat((state.chars||[]).map(RP.normChar));}
function findBy(id){return allChars().find(c=>c.id===id)}

/* ---------- sidebar ---------- */
function renderRecents(){
  const b=RP.groupBuckets(state.rooms);
  const label={today:"Today",yesterday:"Yesterday",month:"This month",older:"Older"};
  let html="";
  Object.keys(b).forEach(k=>{
    if(!b[k].length)return;
    html+='<div class="nav-group">'+label[k]+'</div>';
    b[k].forEach(r=>{
      html+='<div class="recent-row"><button class="recent'+(r.id===state.active?" active":"")+'" data-id="'+RP.esc(r.id)+'" title="'+RP.esc(r.title)+'">'+(r.kind==="group"?"👥 ":"")+RP.esc(r.title)+'</button>'+
        '<button class="recent-act" data-rename="'+RP.esc(r.id)+'" title="Rename">✎</button>'+
        '<button class="recent-act danger" data-remove="'+RP.esc(r.id)+'" title="Delete">✕</button></div>';
    });
  });
  $("recents").innerHTML=html||'<div class="rp-note" style="padding:8px 10px">No roleplay chats yet. Pick a character or start a group chat.</div>';
  $("recents").querySelectorAll("button.recent").forEach(el=>el.onclick=()=>{if(!busy){state.active=el.dataset.id;view="chat";render();}});
  $("recents").querySelectorAll("[data-rename]").forEach(el=>el.onclick=()=>renameRoom(el.dataset.rename));
  $("recents").querySelectorAll("[data-remove]").forEach(el=>el.onclick=()=>removeRoom(el.dataset.remove));
}
function renameRoom(id){
  if(busy)return;
  const r=state.rooms.find(x=>x.id===id);if(!r)return;
  const name=prompt("Rename chat",r.title);if(name===null)return;
  const clean=name.replace(/\s+/g," ").trim().slice(0,60);if(!clean)return;
  r.title=clean;r.renamed=true;RP.saveState(window.localStorage,state);render();
}
function removeRoom(id){
  if(busy)return;
  const r=state.rooms.find(x=>x.id===id);if(!r)return;
  if(!confirm('Delete chat "'+r.title+'"? This cannot be undone.'))return;
  state.rooms=state.rooms.filter(x=>x.id!==id);
  if(state.active===id){state.active="";view="discover";}
  RP.saveState(window.localStorage,state);render();
}

/* ---------- discover ---------- */
function cardHtml(c){
  const talks=RP.roomCountFor(state.rooms,c.id);
  const tag=c.source==="custom"?"yours":"archive";
  return '<article class="ccard" data-id="'+RP.esc(c.id)+'">'+
    '<div class="ccard-art"><span class="ccard-init">'+RP.esc(c.name.charAt(0).toUpperCase())+'</span>'+
    (c.image?'<img src="'+RP.esc(c.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':"")+
    '<span class="ccard-byline">'+RP.esc(c.name)+'</span><span class="ccard-tag">'+tag+'</span>'+
    '<button class="ccard-select" data-start="'+RP.esc(c.id)+'">Select character</button></div>'+
    '<div class="ccard-body"><h3>'+RP.esc(c.name)+'</h3><p>'+RP.esc(c.title||c.summary.slice(0,120))+'</p>'+
    '<div class="ccard-meta"><span>'+(c.source==="custom"?"by you":"by @waluipedia")+'</span>'+(talks?'<span>💬 '+talks+'</span>':"")+'</div></div></article>';
}
function sceneHtml(s){
  return '<article class="ccard" data-scene="'+RP.esc(s.id)+'">'+
    '<div class="ccard-art"><span class="ccard-init">🎬</span>'+
    (s.image?'<img src="'+RP.esc(s.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':"")+
    '<span class="ccard-byline">'+RP.esc(s.name)+'</span>'+
    '<button class="ccard-select">Start scene</button></div>'+
    '<div class="ccard-body"><h3>'+RP.esc(s.name)+'</h3><p>'+RP.esc(String(s.summary||"").slice(0,140))+'</p>'+
    '<div class="ccard-meta"><span>'+RP.esc(String(s.era||s.date||"").slice(0,40))+'</span></div></div></article>';
}
function renderDiscover(){
  const q=$("search").value.trim().toLowerCase();
  const cast=allChars().filter(c=>!q||(c.name+" "+c.title+" "+c.summary+" "+(c.race||"")).toLowerCase().includes(q));
  const featured=cast.filter(c=>c.source!=="custom").slice(0,24);
  const mine=cast.filter(c=>c.source==="custom");
  const sc=q?scenes.filter(s=>(s.name+" "+s.summary).toLowerCase().includes(q)):scenes;
  let html='<div class="section-head"><h2>For you</h2><a data-go="create">Create a character →</a></div>';
  html+='<div class="cardgrid">'+(featured.map(cardHtml).join("")||'<p class="rp-note">No characters match.</p>')+'</div>';
  if(mine.length){
    html+='<div class="section-head"><h2>Your characters</h2></div><div class="cardgrid">'+mine.map(cardHtml).join("")+'</div>';
  }
  if(sc.length){
    html+='<div class="section-head"><h2>Scenes from the archive</h2><a href="#" onclick="return false" style="cursor:default">start from a filed event</a></div><div class="cardgrid">'+sc.map(sceneHtml).join("")+'</div>';
  }
  $("view").innerHTML=html;
  $("view").querySelectorAll("[data-start]").forEach(b=>b.onclick=e=>{e.stopPropagation();startSolo(b.dataset.start);});
  $("view").querySelectorAll(".ccard[data-id]").forEach(el=>el.onclick=()=>startSolo(el.dataset.id));
  $("view").querySelectorAll(".ccard[data-scene]").forEach(el=>el.onclick=()=>openGroupPicker([],el.dataset.scene));
  const goCreate=$("view").querySelector("[data-go]");
  if(goCreate)goCreate.onclick=()=>{view="create";render();};
}

/* ---------- create ---------- */
function renderCreate(){
  $("view").innerHTML='<div style="max-width:520px;margin:20px auto">'+
    '<div class="form-row"><label>Name</label><input id="cName" placeholder="e.g. Promo Mario" maxlength="60"></div>'+
    '<div class="form-row"><label>Tagline / title</label><input id="cTitle" placeholder="The main host of Nintendo Mania!" maxlength="90"></div>'+
    '<div class="form-row"><label>Who they are (the model reads this)</label><textarea id="cSum" placeholder="Personality, speech style, how they treat the user, what they want…"></textarea></div>'+
    '<div class="form-row"><label>Portrait URL (optional)</label><input id="cImg" placeholder="/rm/portraits/… or https://…"></div>'+
    '<div class="form-row"><label>Extra direction (optional)</label><textarea id="cPrompt" placeholder="Anything extra injected into every reply, e.g. always mentions ratings."></textarea></div>'+
    '<button class="cbtn send" id="cSave" style="width:100%;text-align:center">Save character</button></div>';
  $("cSave").onclick=()=>{
    const name=$("cName").value.trim();
    if(!name)return;
    state.chars=state.chars||[];
    state.chars.push({id:"custom-"+RP.uid(),name,title:$("cTitle").value.trim(),summary:$("cSum").value.trim(),image:$("cImg").value.trim(),source:"custom",prompt:$("cPrompt").value.trim()});
    RP.saveState(window.localStorage,state);
    view="discover";render();
  };
}

/* ---------- group picker ---------- */
function openGroupPicker(seed,sceneId){
  groupSeed=(seed||[]).slice();
  const scene=sceneId?scenes.find(s=>s.id===sceneId):null;
  groupScene=scene?((scene.name||"")+". "+String(scene.summary||"").slice(0,400)):"";
  const cast=allChars();
  $("modalHost").innerHTML='<div class="overlay"><div class="modal">'+
    '<div class="modal-head"><h3>'+(scene?("Cast the scene: "+RP.esc(scene.name)):"Start a group chat")+'</h3><button class="modal-x" id="mClose">✕</button></div>'+
    '<div class="modal-body"><p class="rp-note">Pick 2–6 characters. In a group chat they take turns — click an avatar in the chat to choose who speaks next.</p>'+
    '<input id="pickSearch" placeholder="Filter the cast…" style="width:100%;border:1px solid var(--line);border-radius:10px;font:inherit;padding:8px 11px;margin-top:8px">'+
    '<div class="pick" id="pickList"></div></div>'+
    '<div class="modal-foot"><button class="cbtn" id="mCancel">Cancel</button><button class="cbtn send" id="mGo">Start group chat</button></div></div></div>';
  const draw=()=>{
    const q=$("pickSearch").value.trim().toLowerCase();
    $("pickList").innerHTML=cast.filter(c=>!q||c.name.toLowerCase().includes(q)).map(c=>{
      const on=groupSeed.includes(c.id);
      return '<div class="pick-item'+(on?" on":"")+'" data-pick="'+RP.esc(c.id)+'">'+avatarHtml(c)+'<span>'+RP.esc(c.name)+'</span></div>';
    }).join("");
    $("pickList").querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{
      const id=el.dataset.pick;
      if(groupSeed.includes(id))groupSeed=groupSeed.filter(x=>x!==id);
      else if(groupSeed.length<6)groupSeed.push(id);
      draw();
    });
  };
  draw();
  $("pickSearch").oninput=draw;
  const close=()=>{$("modalHost").innerHTML="";groupSeed=[];groupScene="";};
  $("mClose").onclick=$("mCancel").onclick=close;
  $("mGo").onclick=()=>{
    if(groupSeed.length<2){alert("Pick at least two characters for a group chat.");return;}
    const cast=groupSeed.map(findBy).filter(Boolean);
    const r=RP.newRoom(cast,{scene:groupScene,opener:groupScene?("Scene — "+groupScene):""});
    state.rooms.unshift(r);state.active=r.id;RP.saveState(window.localStorage,state);
    close();view="chat";render();
  };
}

/* ---------- chat ---------- */
function startSolo(id){
  const c=findBy(id);if(!c)return;
  const r=RP.newRoom([c],{});
  state.rooms.unshift(r);state.active=r.id;RP.saveState(window.localStorage,state);
  view="chat";render();
}
function msgHtml(m,room_){
  if(m.hidden)return "";
  if(m.role==="scene")return '<div class="msg scene"><div class="scene-card"><b>Scene</b>'+RP.md(m.text)+'</div></div>';
  if(m.role==="user")return '<div class="msg user" id="msg-'+RP.esc(m.id)+'"><div class="msg-av">m</div><div class="msg-main"><div class="msg-name">You'+(m.pinned?' 📌':"")+'</div><div class="msg-body">'+RP.md(m.text)+'</div>'+
    '<div class="msg-tools"><button class="tool" data-speak="'+RP.esc(m.id)+'">🔊</button><button class="tool" data-pin="'+RP.esc(m.id)+'">'+(m.pinned?"unpin":"pin")+'</button></div></div></div>';
  const c=(room_.cast||[]).find(x=>x.id===m.charId)||{name:"…"};
  return '<div class="msg" id="msg-'+RP.esc(m.id)+'"><div class="msg-av">'+avatarHtml(c)+'</div><div class="msg-main"><div class="msg-name">'+RP.esc(c.name)+(m.pinned?' 📌':"")+'</div><div class="msg-body">'+RP.md(m.text)+'</div>'+
    '<div class="msg-tools"><button class="tool" data-speak="'+RP.esc(m.id)+'">🔊</button><button class="tool" data-pin="'+RP.esc(m.id)+'">'+(m.pinned?"unpin":"pin")+'</button></div></div></div>';
}
function renderChat(){
  const r=room();
  if(!r){view="discover";renderDiscover();return;}
  const group=RP.isGroup(r);
  const next=group?RP.nextSpeaker(r):null;
  $("pageTitle").textContent=r.title;
  $("pageSub").textContent=group?(r.cast.length+" characters · click an avatar to choose who speaks next"):(r.cast[0]&&r.cast[0].title||"");
  const castBar=group?'<div class="castbar">'+r.cast.map(c=>{
    const isNext=next&&c.id===next.id;
    return '<button class="cast-chip'+(isNext?" next":"")+'" data-speak-as="'+RP.esc(c.id)+'" title="'+(isNext?"Speaking next — click to change":"Click to make "+RP.esc(c.name)+" speak next")+'">'+avatarHtml(c)+RP.esc(c.name)+'</button>';
  }).join("")+'<span class="next-hint">next: '+(next?RP.esc(next.name):"—")+'</span></div>':"";
  const msgs=(r.messages||[]).map(m=>msgHtml(m,r)).join("")||
    '<div class="empty"><h2>'+(group?"Cast the first line.":"Say something to "+(r.cast[0]?RP.esc(r.cast[0].name):"them")+".")+'</h2><p>Actions in *asterisks* become italics. The model stays in character and never sees your other chats.</p></div>';
  $("view").innerHTML='<div class="chatwrap"><div class="chatcol">'+
    '<div class="chat-head"><h2>'+RP.esc(r.title)+'</h2>'+castBar+'</div>'+
    '<div class="msgs" id="msgs">'+msgs+'</div>'+
    '<div class="composer-wrap"><form class="composer" id="composer">'+
    '<textarea id="input" rows="1" placeholder="'+(group?("Message — "+(next?RP.esc(next.name):"the cast")+" replies"):"Message "+(r.cast[0]?RP.esc(r.cast[0].name):""))+'" aria-label="Message"></textarea>'+
    '<button class="cbtn" type="button" id="continueBtn" title="Let the character continue without your input">➤ Continue</button>'+
    '<button class="cbtn send" id="send" type="submit" disabled>↑</button></form>'+
    '<div class="composer-note"><span>Roleplay goes straight to the local model — no repository tools.</span><span class="counter">&lt;'+RP.counter(r)+'&gt;</span></div></div>'+
    '</div><aside class="rpanel" id="rpanel"></aside></div>';
  renderPanel(r);
  const box=$("msgs");box.scrollTop=box.scrollHeight;
  $("composer").onsubmit=e=>{e.preventDefault();send();};
  const ta=$("input");
  ta.oninput=()=>{$("send").disabled=!ta.value.trim();ta.style.height="auto";ta.style.height=Math.min(170,ta.scrollHeight)+"px";};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}};
  $("continueBtn").onclick=()=>send(true);
  $("view").querySelectorAll("[data-speak-as]").forEach(b=>b.onclick=()=>{
    r.next=b.dataset.speakAs;RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
  });
  $("view").querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speakMsg(r,b.dataset.speak));
  $("view").querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{
    const m=(r.messages||[]).find(x=>x.id===b.dataset.pin);if(!m)return;
    m.pinned=!m.pinned;RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
  });
}
function renderPanel(r){
  const group=RP.isGroup(r);
  const solo=group?null:r.cast[0];
  const history=state.rooms.filter(x=>x.id!==r.id&&x.cast.some(c=>solo?c.id===solo.id:false)).slice(0,6);
  const pins=(r.messages||[]).filter(m=>m.pinned);
  $("rpanel").innerHTML=
    (solo?'<div class="rp-card"><div class="rp-av">'+avatarHtml(solo)+'</div><h3>'+RP.esc(solo.name)+'</h3><p class="by">'+(solo.source==="custom"?"by you":"by @waluipedia")+' · '+RP.roomCountFor(state.rooms,solo.id)+' chats</p><p class="desc">'+RP.esc(solo.summary.slice(0,300))+'</p></div>'
      :'<div class="rp-card"><h3>👥 Group scene</h3><p class="by">'+r.cast.length+' characters</p></div><div class="rp-cast">'+r.cast.map(c=>'<div class="rp-cast-row">'+avatarHtml(c)+'<span>'+RP.esc(c.name)+'</span></div>').join("")+'</div>')+
    '<button class="rp-btn" id="pNew">✨ New chat</button>'+
    '<button class="rp-btn'+(state.settings.autoSpeak?" on":"")+'" id="pVoice">🔊 Voice <span class="val">'+(state.settings.autoSpeak?"auto-read on":"off")+'</span></button>'+
    (history.length?'<button class="rp-btn" id="pHist">🕘 History <span class="val">'+history.length+'</span></button><ul class="rp-list" id="histList" style="display:none">'+history.map(h=>'<li data-hist="'+RP.esc(h.id)+'">'+RP.esc(h.title)+'<small>'+(h.kind==="group"?"group":"solo")+'</small></li>').join("")+'</ul>':"")+
    (pins.length?'<button class="rp-btn" id="pPin">📌 Pinned <span class="val">'+pins.length+'</span></button><ul class="rp-list" id="pinList" style="display:none">'+pins.map(m=>'<li data-scroll="'+RP.esc(m.id)+'">'+RP.esc(String(m.text).slice(0,40))+'…</li>').join("")+'</ul>':"")+
    '<button class="rp-btn" id="pCustom">🎭 Persona <span class="val">'+(r.persona?"set":"who you play")+'</span></button>'+
    '<button class="rp-btn" id="pStyle">✍️ Style <span class="val">'+(RP.STYLES[r.style]||RP.STYLES.novel).label+'</span></button>'+
    '<button class="rp-btn" id="pExport">⬇ Export transcript</button>'+
    '<p class="rp-note">Transcripts stay in this browser. Export before clearing site data.</p>';
  $("pNew").onclick=()=>{if(solo)startSolo(solo.id);else openGroupPicker(r.cast.map(c=>c.id));};
  $("pVoice").onclick=()=>{state.settings.autoSpeak=!state.settings.autoSpeak;RP.saveState(window.localStorage,state);renderPanel(r);};
  const hb=$("pHist");if(hb)hb.onclick=()=>{const l=$("histList");l.style.display=l.style.display==="none"?"block":"none";};
  $("view").querySelectorAll("[data-hist]").forEach(li=>li.onclick=()=>{state.active=li.dataset.hist;render();});
  const pb=$("pPin");if(pb)pb.onclick=()=>{const l=$("pinList");l.style.display=l.style.display==="none"?"block":"none";};
  $("view").querySelectorAll("[data-scroll]").forEach(li=>li.onclick=()=>{
    const n=document.getElementById("msg-"+li.dataset.scroll);if(n)n.scrollIntoView({behavior:"smooth",block:"center"});
  });
  $("pCustom").onclick=()=>{
    const v=prompt("Persona — who are you in this scene?\n(e.g. a studio stagehand who saw too much)",r.persona||"");
    if(v===null)return;r.persona=v.trim().slice(0,300);RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
  };
  $("pStyle").onclick=()=>{
    const keys=Object.keys(RP.STYLES);
    const v=prompt("Narration style: "+keys.map(k=>k+" = "+RP.STYLES[k].label).join(", "),r.style||"novel");
    if(v===null)return;
    const clean=v.trim().toLowerCase();
    if(!RP.STYLES[clean])return;
    r.style=clean;RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
  };
  $("pExport").onclick=()=>{
    const blob=new Blob([RP.transcript(r)],{type:"text/markdown"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(r.title||"roleplay").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".md";
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
}

/* ---------- speaking ---------- */
function speak(text,char){
  if(!("speechSynthesis" in window))return;
  const u=new SpeechSynthesisUtterance(String(text).replace(/\*/g,""));
  const v=RP.voiceFor(char);u.rate=v.rate;u.pitch=v.pitch;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function speakMsg(r,id){
  const m=(r.messages||[]).find(x=>x.id===id);if(!m)return;
  speak(m.text,(r.cast||[]).find(c=>c.id===m.charId));
}

/* ---------- send ---------- */
async function send(isContinue){
  if(busy)return;
  const r=room();if(!r)return;
  const text=isContinue?"":$("input").value.trim();
  if(!isContinue&&!text)return;
  const group=RP.isGroup(r);
  const speaker=RP.nextSpeaker(r);
  if(!speaker){alert("This chat has no characters.");return;}
  if(!isContinue){
    r.messages.push({id:RP.uid(),role:"user",text,ts:Date.now()});
    if(!r.renamed&&(r.title==="New chat"||(!group&&r.cast[0]&&r.title===r.cast[0].name))){
      r.title=String(text).replace(/\s+/g," ").slice(0,42)||r.title;
    }
  }
  RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
  $("input").value="";$("send").disabled=true;
  busy=true;$("send").disabled=true;
  try{
    const system=group?RP.groupPrompt(r.cast,speaker,{style:r.style,scene:r.scene}):RP.soloPrompt(r.cast[0],{style:r.style});
    const persona=RP.personaBlock(r.persona);
    const history=RP.historyFor(r);
    if(isContinue)history.push({role:"user",content:RP.CONTINUE_MARKER+" Let the scene move forward; do not acknowledge this instruction."});
    const data=await api("/api/roleplay",{
      system:[system,persona].filter(Boolean).join("\n\n"),
      messages:history,
      temperature:0.85,max_tokens:700
    });
    const reply=RP.stripSpeaker(data.text,speaker.name);
    r.messages.push({id:RP.uid(),role:"char",charId:speaker.id,text:reply,ts:Date.now()});
    if(group)r.next=(RP.rotationAfter(r.cast,speaker.id)||{}).id||"";
    RP.touch(r);RP.saveState(window.localStorage,state);renderChat();
    if(state.settings.autoSpeak)speak(reply,speaker);
  }catch(err){
    r.messages.push({id:RP.uid(),role:"char",charId:speaker.id,text:err.message,error:true,ts:Date.now()});
    RP.saveState(window.localStorage,state);renderChat();
  }finally{busy=false;$("send").disabled=false;$("input").focus();}
}

/* ---------- root render ---------- */
function render(){
  renderRecents();
  const titles={discover:"Discover",create:"Create a character",chat:""};
  if(view!=="chat"){$("pageTitle").textContent=titles[view]||"";$("pageSub").textContent=view==="discover"?"The archive's cast, ready to roleplay. Pick a card or start a group chat.":"";}
  if(view==="discover")renderDiscover();
  else if(view==="create")renderCreate();
  else if(view==="chat")renderChat();
  $("searchWrap").style.visibility=view==="discover"?"visible":"hidden";
}

/* ---------- boot ---------- */
(async function boot(){
  $("btnDiscover").onclick=()=>{view="discover";render();};
  $("btnGroup").onclick=()=>openGroupPicker([]);
  $("btnCreate").onclick=()=>{view="create";render();};
  $("search").oninput=()=>{if(view==="discover")renderDiscover();};
  render();
  health();
  try{
    const [chars,sc]=await Promise.all([api("/api/characters"),api("/api/scenes")]);
    archiveCast=(chars.characters||[]).map(RP.normChar);
    scenes=sc.scenes||[];
    if(view==="discover")renderDiscover();
  }catch(e){/* the page still works with custom characters */}
  if(state.active&&state.rooms.some(r=>r.id===state.active)){view="chat";render();}
})();
})();
</script>
