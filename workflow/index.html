<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArenaLLM · Waluipedia</title>
<style>
:root{color-scheme:dark;--bg:#212121;--sidebar:#171717;--surface:#2f2f2f;--surface2:#252525;--line:#414141;--text:#ececec;--muted:#a7a7a7;--subtle:#737373;--accent:#10a37f;--accent2:#7dd3fc;--warn:#f5c76b;--danger:#f08080}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{height:100%;display:flex;min-height:600px}.sidebar{width:260px;background:var(--sidebar);border-right:1px solid #303030;display:flex;flex-direction:column;padding:12px}.brand{display:flex;align-items:center;gap:10px;padding:10px 9px 18px;font-weight:700;font-size:16px}.brand-mark{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:#061e17;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.new-chat{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:transparent;border:1px solid #4b4b4b;border-radius:8px;text-align:left}.new-chat:hover,.side-item:hover{background:#2a2a2a}.plus{font-size:20px;line-height:14px;font-weight:300}.sidebar-label{color:var(--subtle);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:22px 10px 7px}.side-item{display:flex;align-items:center;gap:9px;border-radius:7px;padding:9px 10px;color:#d1d1d1}.side-item.active{background:#2b2b2b}.sidebar-bottom{margin-top:auto}.local-pill{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:10px}.dot{width:8px;height:8px;border-radius:50%;background:#6b7280}.dot.online{background:var(--accent)}.settings{border-top:1px solid #303030;padding-top:12px;margin-top:8px}.settings summary{cursor:pointer;color:var(--muted);padding:6px 9px;font-size:12px}.settings-body{padding:3px 9px 4px}.settings label{display:block;color:var(--muted);font-size:12px;margin-top:10px}.settings input[type=text],.settings input[type=number]{width:100%;background:#242424;border:1px solid #444;border-radius:6px;color:var(--text);padding:7px}.toggle{display:flex!important;gap:8px;align-items:flex-start}.toggle input{margin-top:4px;accent-color:var(--accent)}.service-btn{width:100%;margin-top:11px;border-radius:6px;background:#303030;padding:8px;color:var(--muted);font-size:12px;text-align:left}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:58px;border-bottom:1px solid #343434;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--muted)}.model-name{color:var(--text);font-weight:600}.model-name span{font-size:11px;color:var(--subtle);font-weight:400;margin-left:7px}.top-status{font-size:12px}.chat-scroll{flex:1;overflow-y:auto}.chat{max-width:900px;margin:0 auto;padding:30px 24px 145px}.welcome{min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:100px}.welcome-mark{font-size:38px;margin-bottom:16px}.welcome h1{font-size:31px;letter-spacing:-.03em;margin:0 0 10px}.welcome p{max-width:560px;color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px;width:min(650px,100%)}.suggestion{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;color:#d4d4d4}.suggestion:hover{border-color:#6b6b6b;background:#333}.message{display:flex;gap:15px;margin:26px 0}.message.user{justify-content:flex-end}.avatar{flex:0 0 31px;width:31px;height:31px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800}.assistant .avatar{background:var(--accent);color:#041e16}.user .avatar{background:#6b5c93;color:white;order:2}.message-body{min-width:0;max-width:760px}.user .message-body{background:#343434;border-radius:16px;padding:10px 14px;max-width:650px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere}.message-meta{color:var(--subtle);font-size:11px;margin-top:6px}.tool-details{margin-top:12px;border:1px solid #3b3b3b;border-radius:8px;background:rgba(0,0,0,.12)}.tool-details summary{cursor:pointer;color:var(--muted);padding:7px 10px;font-size:12px}.tool-log{border-top:1px solid #3b3b3b;padding:8px 10px;max-height:240px;overflow:auto}.tool-log-item{padding:5px 0;border-bottom:1px solid #373737;color:var(--muted);font-size:11px;white-space:pre-wrap}.tool-log-item:last-child{border-bottom:0}.tool-name{color:var(--accent2);font-family:ui-monospace,monospace}.approval-card{margin-top:13px;padding:12px;border:1px solid rgba(245,199,107,.45);background:rgba(245,199,107,.08);border-radius:9px;color:#f4d99b}.approval-card button{margin-top:9px;background:var(--warn);color:#241b09;border-radius:7px;padding:8px 11px;font-weight:700}.typing{display:flex;align-items:center;gap:10px;color:var(--muted);margin:25px 0}.typing-dots{display:flex;gap:4px}.typing-dots i{width:6px;height:6px;border-radius:50%;background:#999;animation:bounce 1.2s infinite}.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}.composer-wrap{position:fixed;bottom:0;right:0;left:260px;background:linear-gradient(transparent,var(--bg) 28%);padding:28px 24px 18px}.composer{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid #555;border-radius:15px;box-shadow:0 4px 28px rgba(0,0,0,.25);display:flex;align-items:flex-end;padding:9px 10px 9px 15px}.composer:focus-within{border-color:#777}.composer textarea{flex:1;min-height:25px;max-height:180px;resize:none;background:transparent;border:0;outline:0;color:var(--text);padding:5px 0;line-height:1.45}.composer textarea::placeholder{color:#9b9b9b}.send{width:34px;height:34px;border-radius:8px;background:#676767;color:#1e1e1e;font-size:20px;line-height:1}.send.ready{background:#f4f4f4}.composer-note{max-width:900px;margin:7px auto 0;color:var(--subtle);font-size:11px;text-align:center}.hidden{display:none!important}.error-text{color:var(--danger)}@media(max-width:760px){.sidebar{width:62px;padding:8px}.brand{justify-content:center;padding:7px 0 17px}.brand-copy,.new-chat span,.sidebar-label,.side-item span,.local-pill span,.settings{display:none}.new-chat{justify-content:center;padding:10px 0}.side-item{justify-content:center}.local-pill{justify-content:center}.composer-wrap{left:62px;padding-left:10px;padding-right:10px}.topbar{padding:0 14px}.top-status{display:none}.chat{padding-left:13px;padding-right:13px}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">A</div><div class="brand-copy">ArenaLLM<small>Waluipedia local</small></div></div>
    <button class="new-chat" id="newChat"><span class="plus">＋</span><span>New chat</span></button>
    <div class="sidebar-label">Workspace</div>
    <div class="side-item active"><span>◌</span><span>Archive assistant</span></div>
    <div class="side-item"><span>⌕</span><span>Repository search</span></div>
    <div class="sidebar-bottom">
      <div class="local-pill"><i class="dot" id="serviceDot"></i><span id="serviceText">Local services not checked</span></div>
      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-body">
          <label for="model">LM Studio model</label>
          <input id="model" type="text" placeholder="Uses loaded model">
          <label for="maxSteps">Maximum tool turns</label>
          <input id="maxSteps" type="number" value="30" min="1" max="60">
          <label class="toggle"><input id="allowWrites" type="checkbox"><span>Allow ArenaLLM to apply local file edits and queue images. It never commits or pushes.</span></label>
          <button class="service-btn" id="healthBtn">Check local services</button>
        </div>
      </details>
    </div>
  </aside>

  <section class="main">
    <header class="topbar"><div><span class="model-name">ArenaLLM <span>Local archive assistant</span></span></div><div class="top-status">No GitHub push access · local workspace only</div></header>
    <div class="chat-scroll" id="scroll">
      <main class="chat" id="chat"></main>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message ArenaLLM" aria-label="Message ArenaLLM"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">↑</button>
      </form>
      <div class="composer-note">ArenaLLM can read, search, edit approved local files, and validate changes. It cannot push to GitHub.</div>
    </div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
const STORAGE="arenallm-chat-v2";
let messages=[];
let activeJob="";
let activeRun="";
let polling=false;
let pendingApproval=null;
let working=false;
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(STORAGE,JSON.stringify(messages.slice(-80)))}
function toolSummary(events){const names=[...new Set((events||[]).filter(e=>e.kind==="action").map(e=>e.action?.action).filter(Boolean))];return names.length?`Tools used: ${names.join(", ")}`:"Work trace"}
function toolHtml(events){if(!events||!events.some(e=>["action","result","error"].includes(e.kind)))return "";const rows=events.filter(e=>["action","result","error"].includes(e.kind)).map(e=>{let text=e.kind==="action"?JSON.stringify(e.action?.args||{},null,2):(e.result||e.message||"");if(text.length>1300)text=text.slice(0,1300)+"…";return `<div class="tool-log-item"><span class="tool-name">${esc(e.kind==="action"?(e.action?.action||"tool"):e.kind)}</span>${text?"\n"+esc(text):""}</div>`}).join("");return `<details class="tool-details"><summary>${esc(toolSummary(events))}</summary><div class="tool-log">${rows}</div></details>`}
function approvalHtml(msg){if(!msg)return "";return `<div class="approval-card">${esc(msg)}<br><button onclick="approveCurrent()">Approve local changes and continue</button></div>`}
function render(){const box=$("chat");if(!messages.length){box.innerHTML=`<section class="welcome"><div class="welcome-mark">◉</div><h1>What can I help you with?</h1><p>Ask about the archive, the latest session, a character, or a file change. ArenaLLM will search the local repository and answer with evidence.</p><div class="suggestions"><button class="suggestion" data-prompt="What is the latest current filing?">What is the latest current filing?</button><button class="suggestion" data-prompt="Find the historical Bowser sessions and explain their order.">Find the historical Bowser sessions</button><button class="suggestion" data-prompt="Inspect the repository status and summarize any unfinished work.">Summarize unfinished work</button><button class="suggestion" data-prompt="Review the home page archive cards and tell me what is current versus historical.">Review current versus historical</button></div></section>`;box.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{$("input").value=b.dataset.prompt;send()});return}box.innerHTML=messages.map((m,i)=>{const user=m.role==="user";return `<article class="message ${user?"user":"assistant"}"><div class="avatar">${user?"You":"A"}</div><div class="message-body"><div class="message-text">${esc(m.content)}</div>${m.meta?.approval?approvalHtml(m.meta.message):""}${m.meta?.events?toolHtml(m.meta.events):""}${m.meta?.error?"<div class=\"message-meta error-text\">The local run stopped with an error.</div>":""}</div></article>`}).join("")+ (working?`<div class="typing"><div class="avatar" style="background:var(--accent);color:#041e16">A</div><span>ArenaLLM is checking the local workspace</span><span class="typing-dots"><i></i><i></i><i></i></span></div>`:"");$("scroll").scrollTop=$("scroll").scrollHeight}
function add(role,content,meta={}){messages.push({role,content,meta});save();render()}
function setService(online){$("serviceDot").classList.toggle("online",online);$("serviceText").textContent=online?"LM Studio online":"Local services offline"}
async function post(path,value){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)});const data=await r.json();if(!r.ok||data.error)throw new Error(data.error||`HTTP ${r.status}`);return data}
function conversation(){return messages.filter(m=>m.role==="user"||m.role==="assistant").slice(-20).map(m=>({role:m.role,content:m.content}))}
async function send(){if(working)return;const text=$("input").value.trim();if(!text)return;$("input").value="";add("user",text);working=true;render();try{const data=await post("/api/chat",{text,messages:conversation(),model:$("model").value,allow_writes:$("allowWrites").checked,max_steps:Number($("maxSteps").value)||30});activeJob=data.job;pollJob(activeJob)}catch(e){working=false;add("assistant",e.message,{error:true})}}
async function pollJob(job){if(polling)return;polling=true;try{const r=await fetch("/api/agent/status?job="+encodeURIComponent(job));const data=await r.json();activeRun=data.run||activeRun;if(data.status==="running"){setTimeout(()=>{polling=false;pollJob(job)},650);return}polling=false;working=false;const events=data.events||[];if(data.status==="done")add("assistant",data.answer||"The request completed, but no final response was returned.",{events});else if(data.status==="approval_required"){pendingApproval={run:data.run,events};add("assistant","I’m ready to apply a local change, but I need your approval before writing to the repository.",{approval:true,message:"The agent stopped before the file change. Review the tool trace, then approve to continue.",events})}else if(data.status==="needs_input"){const q=(data.message||"").replace(/^QUESTION:\s*/i,"");add("assistant",q||"I need one more detail before I continue.",{events})}else add("assistant",data.message||"The local agent stopped before completing the request.",{events,error:true})}catch(e){polling=false;working=false;add("assistant",e.message,{error:true})}}
async function approveCurrent(){if(!pendingApproval||working)return;const run=pendingApproval.run;pendingApproval=null;working=true;render();try{const data=await post("/api/chat",{run,messages:conversation(),model:$("model").value,allow_writes:true,max_steps:Number($("maxSteps").value)||30});activeJob=data.job;pollJob(activeJob)}catch(e){working=false;add("assistant",e.message,{error:true})}}
async function health(){try{const data=await (await fetch("/api/health")).json();setService(Boolean(data.lm_studio?.online));return data}catch(e){setService(false);return null}}
$("composer").onsubmit=e=>{e.preventDefault();send()};$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("newChat").onclick=()=>{messages=[];activeJob="";activeRun="";pendingApproval=null;working=false;save();render();$("input").focus()};$("healthBtn").onclick=async()=>{const b=$("healthBtn");b.textContent="Checking…";const data=await health();b.textContent=data?`LM Studio: ${data.lm_studio?.online?"online":"offline"}`:"Check local services"};$("input").oninput=()=>{$("send").classList.toggle("ready",Boolean($("input").value.trim()))};try{messages=JSON.parse(localStorage.getItem(STORAGE)||"[]");if(!Array.isArray(messages))messages=[]}catch(e){messages=[]}render();health();
</script>
</body>
</html>
