<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex of the Mages' Guild — C.C.D.</title>
<link rel="stylesheet" href="Reputation-Matrix2/app/styles/systems/mages-codex-reader.css">
<link rel="stylesheet" href="Reputation-Matrix2/app/styles/systems/mages-codex-index.css">
<style>
  :root {
    --bg: #1a1224;
    --paper: #f4efe3;
    --ink: #211810;
    --border: #c4ad84;
    --accent: #6d28d9;
    --accent-light: #c4b5fd;
    --meta: #5d4a35;
    --kicker: #6d28d9;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: #f3ead8;
    font: 16px/1.6 Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    gap: 0;
    align-items: flex-start;
  }

  /* ── Sidebar TOC ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 24px 14px 40px;
    border-right: 1px solid #3b2d52;
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
  }

  .sidebar-title {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent-light);
    font-weight: 800;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #3b2d52;
  }

  .sidebar-part {
    margin: 12px 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent-light);
    font-weight: 700;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 3px;
    transition: background .15s;
  }
  .sidebar-part:hover { background: #2d1f42; }

  .sidebar-sec {
    display: block;
    color: #b8a9d4;
    padding: 2px 6px 2px 14px;
    border-radius: 3px;
    text-decoration: none;
    line-height: 1.4;
    transition: background .15s, color .15s;
  }
  .sidebar-sec:hover {
    background: #2d1f42;
    color: #fff;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: #3b2d52; border-radius: 4px; }

  /* ── Main content ── */
  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 24px 80px;
  }

  .breadcrumb {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .breadcrumb a { color: var(--accent-light); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb span { color: #7c6b9a; margin: 0 6px; }

  /* ── Paper ── */
  .paper {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 36px 40px 56px;
    box-shadow: 0 18px 48px rgba(0,0,0,.45);
  }

  .kicker {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--kicker);
    font-weight: 800;
    font-family: system-ui, sans-serif;
    margin-bottom: 6px;
  }

  .paper h1 {
    font-size: 24px;
    line-height: 1.25;
    margin-bottom: 4px;
    letter-spacing: .02em;
  }

  .meta-block {
    font-size: 13px;
    color: var(--meta);
    margin: 8px 0 24px;
    line-height: 1.7;
    font-family: system-ui, sans-serif;
  }

  .meta-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .pill {
    background: #ede5d0;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11.5px;
    color: var(--meta);
    font-family: system-ui, sans-serif;
  }

  /* ── Part headings ── */
  .part-heading {
    margin: 40px 0 6px;
    padding-top: 22px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    font-variant: small-caps;
    letter-spacing: .1em;
    color: #3d2a00;
    font-family: system-ui, sans-serif;
  }

  .part-blurb {
    font-size: 13px;
    color: var(--meta);
    font-style: italic;
    margin-bottom: 16px;
    font-family: system-ui, sans-serif;
  }

  /* ── Sections ── */
  .sec {
    margin: 20px 0;
    padding: 16px 0 0;
    border-top: 1px solid #ddd0b8;
  }

  .sec:first-of-type { border-top: none; }

  .cite-heading {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 8px;
    color: #1a0f00;
  }

  .cite-num {
    color: var(--accent);
    font-family: system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
  }

  .body-row {
    margin: 6px 0 6px 1.4em;
    font-size: 14.5px;
    line-height: 1.6;
  }

  .codex-page {
    margin: 18px 0 28px;
    padding: 0 0 8px;
    border-bottom: 1px dotted #c4ad84;
  }
  .codex-page-head {
    font-variant: small-caps;
    letter-spacing: .06em;
    font-size: 15px;
    margin-bottom: 10px;
    color: #3d2a00;
  }
  .codex-page p {
    font-size: 15.5px;
    line-height: 1.78;
    margin: 0 0 12px;
    text-align: justify;
    color: #2a1c08;
  }

  .body-key {
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
    color: #5d4a35;
    font-weight: 700;
    margin-right: 4px;
  }

  .body-heading {
    font-weight: 700;
    margin-right: 4px;
  }

  .body-text { color: #2a1c08; }

  a.ref {
    color: #5b21b6;
    text-decoration: underline;
    text-underline-offset: 2px;
    position: relative;
  }
  a.ref:hover { color: #3b0f8a; }
  a.ref.unresolved { color: #9a7a3a; text-decoration-style: dashed; cursor: help; }

  /* ── Section cross-ref footer (larger sections → rules) ── */
  .sec-refs {
    margin: 14px 0 4px;
    padding: 10px 12px;
    background: #ede5d0;
    border: 1px solid #d8c9a8;
    border-radius: 6px;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: #3d2a00;
  }
  .sec-refs-title {
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 800;
    color: #6d28d9;
    margin-bottom: 6px;
  }
  .sec-refs a {
    display: inline-block;
    margin: 2px 4px 2px 0;
    padding: 2px 8px;
    background: #f4efe3;
    border: 1px solid #c4ad84;
    border-radius: 12px;
    color: #5b21b6;
    text-decoration: none;
    font-size: 11.5px;
  }
  .sec-refs a:hover { background: #fff; border-color: #6d28d9; }

  /* ── Hover tooltip for § links ── */
  #cite-tip {
    position: fixed;
    z-index: 99;
    max-width: 360px;
    padding: 10px 12px;
    background: #211810;
    color: #f3ead8;
    border: 1px solid #3b2d52;
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .12s, transform .12s;
  }
  #cite-tip.show { opacity: 1; transform: translateY(0); }
  #cite-tip .tip-cite { font-weight: 800; color: #c4b5fd; }
  #cite-tip .tip-title { color: #f3ead8; }
  #cite-tip .tip-brief { color: #b8a9d4; font-style: italic; margin-top: 4px; }

  /* ── Loading / Error ── */
  .status {
    padding: 40px;
    text-align: center;
    color: var(--meta);
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }

  .error {
    background: #fff0f0;
    border: 1px solid #f4a0a0;
    border-radius: 4px;
    padding: 16px 20px;
    color: #7a1010;
    font-family: system-ui, sans-serif;
    font-size: 13px;
  }

  /* ── QoL toolbar ── */
  .qol-bar {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin: 8px 0 18px; padding: 10px 12px;
    background:#ede5d0; border:1px solid #d8c9a8; border-radius:8px;
    font-family: system-ui, sans-serif; font-size:12.5px; color:#3d2a00;
  }
  .qol-bar input[type="search"]{
    flex:1; min-width:180px; padding:7px 10px; border:1px solid #c4ad84; border-radius:6px;
    background:#f4efe3; font-size:13px; color:#211810;
  }
  .qol-bar button{
    padding:6px 10px; border:1px solid #c4ad84; border-radius:6px; background:#f4efe3;
    font-size:12px; cursor:pointer; color:#3d2a00;
  }
  .qol-bar button:hover{ background:#fff; border-color:#6d28d9; }
  .qol-bar .qol-stat{ font-size:11.5px; color:#5d4a35; white-space:nowrap; }
  #read-progress{ position:fixed; top:0; left:0; height:3px; width:0; background:linear-gradient(90deg,#6d28d9,#e0b400); z-index:100; transition:width .1s; }
  .sec.hidden{ display:none; }
  .sec mark{ background:#ffe7a0; padding:0 1px; border-radius:2px; }
  .copy-cite{ float:right; font-family:system-ui,sans-serif; font-size:11px; padding:2px 8px; border:1px solid #c4ad84; border-radius:12px; background:#ede5d0; cursor:pointer; }
  .copy-cite:hover{ background:#fff; border-color:#6d28d9; }
  a.form-ref{ color:#065f46; background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.32); border-radius:4px; padding:0 4px; text-decoration:none; font-weight:700; font-family:system-ui,sans-serif; font-size:12.5px; }
  a.form-ref:hover{ background:rgba(16,185,129,.22); border-color:#065f46; }
  #form-modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:200; background:rgba(0,0,0,.55); padding:20px; }
  #form-modal.open{ display:flex; }
  #form-modal .form-box{ max-width:640px; width:100%; max-height:90vh; overflow:auto; background:#f4efe3; color:#211810; border:2px solid #6d28d9; border-radius:12px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5); font-family:system-ui,sans-serif; }
  #form-modal .form-box h2{ font-size:18px; margin:0 0 4px; color:#1a0f00; }
  #form-modal .form-box .form-meta{ font-size:12px; color:#5d4a35; margin-bottom:10px; }
  #form-modal .form-field{ border:1px solid #c4ad84; border-radius:8px; padding:8px 10px; margin:8px 0; background:#fff; }
  #form-modal .form-field b{ font-size:12px; color:#6d28d9; }

  /* ── Reader upgrades ── */
  .reader-tools { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 14px; font-family:system-ui,sans-serif; }
  .reader-tools button, .section-actions button { cursor:pointer; border:1px solid var(--border); background:#fffaf0; color:#3d2a00; border-radius:7px; padding:5px 9px; font-size:11px; }
  .reader-tools button:hover, .section-actions button:hover { background:#ede5d0; }
  .section-actions { float:right; display:flex; gap:4px; }
  .sec.bookmarked .cite-heading { border-left:4px solid #d97706; padding-left:8px; background:#fff7df; }
  .sec.collapsed > :not(.cite-heading) { display:none !important; }
  .bookmark-list { display:none; margin:8px 0 16px; padding:10px 12px; border:1px solid #d97706; border-radius:8px; background:#fff7df; font:12px system-ui,sans-serif; }
  .bookmark-list.show { display:block; }
  .reading-focus .sidebar, .reading-focus .breadcrumb { display:none; }
  .reading-focus .layout { max-width:850px; }
  .reading-focus .main { padding-top:12px; }

  body.warm-reader { --bg:#302719; --paper:#fffaf0; --accent:#9a3412; --kicker:#9a3412; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .layout { display: block; width: 100%; }
    .main { width: 100%; }
    .paper { max-width: 920px; margin: 0 auto; }
  }
  @media print {
    body { background: #fff; color: #000; }
    .sidebar, .breadcrumb, .qol-bar, .reader-tools, #read-progress, .section-actions, #forms-registry { display:none !important; }
    .layout, .main { display:block; max-width:none; width:100%; }
    .main { padding:0; }
    .paper { box-shadow:none; border:0; padding:12mm 15mm; }
    .sec { break-inside: avoid; }
  }
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .paper { padding: 20px 16px 40px; }
    .main { padding: 16px 12px 60px; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">C.C.D. Contents</div>
    <div id="sidebar-toc"><div class="status">Loading…</div></div>
  </nav>

  <div id="read-progress"></div>
  <!-- Main -->
  <main class="main">
    <div class="breadcrumb">
      <a href="index.html#/cultures">← Cultures &amp; Laws</a>
      <span>·</span>
      <a href="index.html#/home">Home</a>
      <span>·</span>
      <a href="index.html#/books">Books (Thornbury's Journal moved here)</a>
    </div>

    <div class="paper" id="paper">
      <div class="status">Loading Codex…</div>
    </div>
  </main>
</div>

<section class="codex-reader" id="codex-reader" aria-hidden="true" aria-label="Codex book reader">
  <header class="codex-reader-toolbar">
    <div class="codex-reader-toolbar-group">
      <button type="button" class="codex-reader-tool" id="codex-reader-index" aria-label="Open complete index">☰ <span class="tool-label">Index</span></button>
      <button type="button" class="codex-reader-tool codex-reader-tool--copy" id="codex-reader-copy">Copy citation</button>
    </div>
    <div class="codex-reader-title">
      <strong>Codex of the Mages' Guild</strong>
      <span id="codex-reader-subtitle">C.C.D. · Volume I</span>
    </div>
    <div class="codex-reader-toolbar-group">
      <button type="button" class="codex-reader-tool codex-reader-tool--close" id="codex-reader-close" aria-label="Close book and return to scroll view">×</button>
    </div>
  </header>

  <div class="codex-reader-stage" id="codex-reader-stage">
    <button type="button" class="codex-reader-side-turn codex-reader-side-turn--prev" id="codex-reader-side-prev" aria-label="Previous page">‹</button>
    <div id="codex-reader-page" aria-live="polite"></div>
    <button type="button" class="codex-reader-side-turn codex-reader-side-turn--next" id="codex-reader-side-next" aria-label="Next page">›</button>
  </div>

  <footer class="codex-reader-footer">
    <button type="button" class="codex-reader-nav-button" id="codex-reader-prev">← <span class="nav-label">Previous page</span></button>
    <div class="codex-reader-status" id="codex-reader-status">Cover</div>
    <button type="button" class="codex-reader-nav-button" id="codex-reader-next"><span class="nav-label">Next page</span> →</button>
  </footer>

  <div class="codex-index-shade" id="codex-index-shade"></div>
  <aside class="codex-index-panel" id="codex-index-panel" aria-hidden="true" aria-label="Complete Codex index">
    <div class="codex-index-panel-header">
      <div>
        <h2>Complete Index</h2>
        <div class="codex-index-panel-subtitle">Every filed section and its first printed page</div>
      </div>
      <button type="button" class="codex-index-close" id="codex-index-close" aria-label="Close index">×</button>
    </div>
    <input class="codex-index-search" id="codex-index-search" type="search" placeholder="Find a section or citation…" aria-label="Search the Codex index">
    <div id="codex-index-list"></div>
    <div class="codex-index-empty" id="codex-index-empty">No index entries match that search.</div>
  </aside>
</section>

<div id="form-modal" onclick="if(event.target===this) closeFormModal()"><div class="form-box" id="form-box"></div></div>
<div id="cite-tip" role="tooltip" aria-hidden="true"></div>
<script src="Reputation-Matrix2/app/pages/mages-codex-reader.js"></script>
<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// forms -> {title, cite} — fetched alongside Codex
let FORMS_MAP = {};
let FORMS_BY_CITE = {};
function buildFormsMap(forms){
  const m={};
  FORMS_BY_CITE={};
  (forms||[]).forEach(f=>{
    m[f.id]=f;
    m[f.id.replace('MG-','')] = f;
    m['Form '+f.id.replace('MG-','')] = f;
    if(f.cite) FORMS_BY_CITE[String(f.cite)] = f;
  });
  return m;
}
function renderInlineForm(cite){
  const f=FORMS_BY_CITE[String(cite)];
  if(!f) return '';
  const fields=(f.fields||[]).slice(0,4).map(fd=>`<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;background:#fff;border:1px solid #c4ad84;border-radius:4px;font-size:11px">${esc(fd.label)}${fd.required?'*':''}</span>`).join('');
  return `<div class="form-inline" id="form-inline-${esc(f.id)}" style="margin:10px 0 12px;padding:12px 14px;background:linear-gradient(135deg,#ecfdf5,#f4efe3);border:1px solid #10b981;border-left:4px solid #065f46;border-radius:8px;font-family:system-ui,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="color:#065f46;font-size:13px">📋 Form ${esc(f.id)} — ${esc(f.title)}</b><button onclick="openFormModal('${esc(f.id)}')" style="font-size:11px;padding:3px 8px;border:1px solid #065f46;border-radius:12px;background:#fff;color:#065f46;cursor:pointer">Open full form →</button></div>
    <div style="font-size:11.5px;color:#5d4a35;margin:4px 0">${esc(f.description||'').slice(0,140)}${(f.description||'').length>140?'…':''}</div>
    <div style="font-size:11px;color:#065f46">Fee: ${esc(f.fee||'—')} · Authority: ${esc(f.authority||'—')} · Status: ${esc(f.status)}</div>
    <div style="margin-top:6px">${fields}${(f.fields||[]).length>4?`<span style="font-size:11px;color:#5d4a35"> +${(f.fields||[]).length-4} more fields</span>`:''}</div>
  </div>`;
}
function renderFormsRegistry(){
  const unique=[...new Map(Object.values(FORMS_MAP).filter(f=>f&&f.id).map(f=>[f.id,f])).values()];
  if(!unique.length) return '';
  unique.sort((a,b)=> String(a.cite).localeCompare(String(b.cite), undefined, {numeric:true}));
  const cards=unique.map(f=>`<a href="#form-${esc(f.id)}" onclick="openFormModal('${esc(f.id)}');return false;" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:1px solid #c4ad84;border-radius:8px;text-decoration:none;color:#211810"><span><b style="color:#065f46">${esc(f.id)}</b> — ${esc(f.title.slice(0,45))}${f.title.length>45?'…':''}<span style="display:block;font-size:11px;color:#5d4a35">§${esc(f.cite)} · ${esc(f.status)} · ${esc(f.fee||'no fee')}</span></span><span style="font-size:11px;color:#6d28d9">open →</span></a>`).join('');
  return `<div class="card" id="forms-registry" style="margin:12px 0 18px;padding:14px 16px;background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(244,239,227,1));border:1px solid #10b981;border-left:5px solid #065f46;border-radius:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0;font-size:15px;color:#065f46">📋 Forms Registry — ${unique.length} hyperlinked forms</h2><span style="font-size:11px;color:#5d4a35">Attached directly under their § — click any Form pill in the text or here to open the actual form</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:10px">${cards}</div>
    <div style="font-size:11px;color:#5d4a35;margin-top:8px">Forms are validated JSON (no invalid saves) and indexed in main search — try <code>Form 400-A</code> in Waluipedia search.</div>
  </div>`;
}
// Linkify Form references. Normalises "MG-400A", "Form 400A" and the
// hyphenated "Form 400-A" (the registry id is MG-400A with no hyphen) to the
// same link target so none of the three phrasings is left as dead text.
function linkForms(escaped){
  return escaped.replace(/\b(?:Form\s+)?MG-?(\d+)-?([A-Z])\b/g, (_, digits, letter)=>{
    const fid='MG-'+digits+letter;
    const known=FORMS_MAP.hasOwnProperty(fid);
    const cls=known?'form-ref':'form-ref unresolved';
    const tip=known?` title="${esc(FORMS_MAP[fid].title)} — click to open form"`:' title="Form not yet filed"';
    // Keep the author's original phrasing on screen, but always point at MG-<digits><letter>.
    const label = known ? `Form ${digits}-${letter}` : `Form ${digits}${letter}`;
    return `<a class="${cls}" href="#form-${fid}" data-form="${fid}" onclick="openFormModal('${fid}');return false;"${tip}>${label}</a>`;
  });
}
// cite -> {title, brief, part} — filled in render() before linkCites is used
let CITE_MAP = {};
function buildCiteMap(sections) {
  const m = {};
  sections.forEach(s => { m[String(s.cite)] = { title: s.title || '', brief: s.brief || '', part: s.part || '' }; });
  return m;
}
// Linkify §X.Y refs — larger sections → governing rules (hover shows target)
function linkCites(raw) {
  const escaped = esc(raw);
  let html = escaped.replace(/§\s*(\d+(?:\.\d+)*)/g, (_, num) => {
    const known = CITE_MAP.hasOwnProperty(num);
    const cls = known ? 'ref' : 'ref unresolved';
    const tip = known ? ` title="${esc(CITE_MAP[num].title)}"` : ' title="Not yet filed — reserved"';
    return `<a class="${cls}" href="#s-${num}" data-cite="${num}"${tip}>§\u202F${num}</a>`;
  });
  html = linkForms(html);
  return html;
}
function renderFormField(fd, idx){
  const req = fd.required ? ' <span style="color:#b91c1c">*</span>' : '';
  const id = 'ff-'+idx;
  const v = (fd.value !== undefined && fd.value !== null) ? String(fd.value) : '';
  let control = '';
  const ctl = 'style="width:100%;padding:6px 8px;border:1px solid #c4ad84;border-radius:6px;font:13px system-ui"';
  if (fd.type === 'textarea') {
    control = `<textarea id="${id}" data-fname="${esc(fd.name)}" rows="3" ${ctl}>${esc(v)}</textarea>`;
  } else if (fd.type === 'select') {
    const opts = (fd.options || []).map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('');
    control = `<select id="${id}" data-fname="${esc(fd.name)}" ${ctl}>${opts}</select>`;
  } else if (fd.type === 'checkbox') {
    control = `<input id="${id}" type="checkbox" data-fname="${esc(fd.name)}" ${fd.value ? 'checked' : ''} style="width:18px;height:18px">`;
  } else if (fd.type === 'number') {
    control = `<input id="${id}" type="number" data-fname="${esc(fd.name)}" value="${esc(v)}" ${ctl}>`;
  } else if (fd.type === 'date') {
    control = `<input id="${id}" type="date" data-fname="${esc(fd.name)}" value="${esc(v)}" style="padding:6px 8px;border:1px solid #c4ad84;border-radius:6px">`;
  } else {
    control = `<input id="${id}" type="text" data-fname="${esc(fd.name)}" value="${esc(v)}" ${ctl}>`;
  }
  const optsHint = (fd.type === 'select' && fd.options)
    ? `<div style="font-size:11px;color:#5d4a35;margin-top:3px">Options: ${esc(fd.options.join(' · '))}</div>` : '';
  return `<div class="form-field"><label for="${id}"><b>${esc(fd.label)} ${req}</b></label> <span style="font-size:11px;color:#5d4a35">(${esc(fd.type)} · ${esc(fd.name)})</span>${control}${optsHint}</div>`;
}
function openFormModal(fid){
  const f=FORMS_MAP[fid];
  const box=document.getElementById('form-box');
  const modal=document.getElementById('form-modal');
  if(!f || !box || !modal) return;
  const fields=(f.fields||[]).map((fd,i)=>renderFormField(fd,i)).join('');
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><h2>📋 ${esc(f.title)}</h2><button onclick="closeFormModal()" style="border:1px solid #c4ad84;border-radius:6px;padding:4px 8px;background:#ede5d0;cursor:pointer">✕</button></div><div class="form-meta">Form <b>${esc(f.id)}</b> · §${esc(f.cite)} · <span style="color:#065f46">${esc(f.status)}</span> · Fee: ${esc(f.fee||'—')} · Authority: ${esc(f.authority||'—')}</div><p style="font-size:13px;line-height:1.6">${esc(f.description||'')}</p><p style="font-size:12px;color:#5d4a35"><em>${esc(f.instructions||'')}</em></p><div style="margin-top:12px">${fields||'<em>No fields defined for this form.</em>'}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="copyFilledForm('${esc(fid)}')" style="font-size:12px;padding:6px 10px;border:1px solid #065f46;border-radius:6px;background:#fff;color:#065f46;cursor:pointer">📋 Copy filled form (JSON)</button><a href="#s-${esc(f.cite)}" onclick="closeFormModal()" style="font-size:12px;color:#6d28d9;padding:6px 4px">→ See §${esc(f.cite)} in Codex</a></div>`;
  modal.classList.add('open');
  if(location.hash!== '#form-'+fid) history.pushState(null,'','#form-'+fid);
}
// Read the controls the user filled in and copy a JSON copy of the form (with
// a `value` on each field) to the clipboard — a real, fillable form instead of
// a read-only label list.
function copyFilledForm(fid){
  const f=FORMS_MAP[fid]; if(!f) return;
  const out=JSON.parse(JSON.stringify(f));
  (f.fields||[]).forEach((fd,i)=>{
    const el=document.getElementById('ff-'+i); if(!el) return;
    let v;
    if(fd.type==='checkbox') v=el.checked;
    else if(fd.type==='number') v = el.value==='' ? (fd.value||'') : Number(el.value);
    else v = el.value;
    out.fields[i].value = v;
  });
  const txt=JSON.stringify(out,null,2);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  const tip=document.getElementById('cite-tip');
  if(tip){ tip.innerHTML=`<div class="tip-cite">Copied filled form ${esc(fid)}</div><div class="tip-brief">${esc((f.fields||[]).filter(x=>x.required).length)} required · ${esc(f.fields.length)} total fields</div>`; tip.classList.add('show'); setTimeout(()=>tip.classList.remove('show'),1600); }
}
function closeFormModal(){ const m=document.getElementById('form-modal'); if(m) m.classList.remove('open'); if(location.hash.startsWith('#form-')) history.replaceState(null,'',location.pathname+location.search); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeFormModal(); });
function sectionRefs(section) {
  if (Array.isArray(section.refs) && section.refs.length) return section.refs;
  const cites = new Set();
  (section.body || []).forEach(b => {
    const txt = (b.text || '') + ' ' + (b.heading || '');
    const re = /§\s*(\d+\.\d+(?:\.\d+)?)/g; let m;
    while ((m = re.exec(txt)) !== null) cites.add(m[1]);
  });
  cites.delete(String(section.cite));
  return [...cites].sort((a,b) => {
    const pa=a.split('.').map(Number), pb=b.split('.').map(Number);
    for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0); if(d) return d;}
    return 0;
  });
}
function renderSectionRefs(section) {
  const refs = sectionRefs(section);
  if (!refs.length) return '';
  const pills = refs.map(c => {
    const info = CITE_MAP[c];
    const label = info ? `§ ${c} — ${info.title}` : `§ ${c} — (reserved)`;
    const extra = info ? '' : ' style="opacity:.6;border-style:dashed"';
    return `<a href="#s-${esc(c)}" data-cite="${esc(c)}"${extra}>${esc(label)}</a>`;
  }).join('');
  return `<div class="sec-refs"><div class="sec-refs-title">Cites — this topic → governing rules</div>${pills}</div>`;
}
function attachCiteTips() {
  const tip = document.getElementById('cite-tip');
  if (!tip) return;
  let hideTimer = null;
  document.addEventListener('mouseover', e => {
    const a = e.target.closest('a.ref'); if (!a) return;
    const cite = a.getAttribute('data-cite'); const info = CITE_MAP[cite]; if (!info) return;
    clearTimeout(hideTimer);
    tip.innerHTML = `<div class="tip-cite">§ ${esc(cite)}</div><div class="tip-title">${esc(info.title)}</div>${info.brief ? `<div class="tip-brief">${esc(info.brief.slice(0,160))}</div>` : ''}`;
    tip.classList.add('show');
    const r = a.getBoundingClientRect();
    let left = r.left + r.width/2 - 180;
    left = Math.max(8, Math.min(left, window.innerWidth - 368));
    tip.style.left = left + 'px'; tip.style.top = (r.bottom + 10) + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (!e.target.closest('a.ref')) return;
    hideTimer = setTimeout(() => tip.classList.remove('show'), 80);
  });
}

// Roman numeral sort order helper
const ROMAN_ORDER = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
function romanRank(r) {
  const i = ROMAN_ORDER.indexOf(String(r).toUpperCase());
  return i === -1 ? 99 : i;
}

// ── Render ───────────────────────────────────────────────────────────────────

function render(data) {
  const parts    = data.parts    || [];
  const sections = data.sections || [];
  const meta     = data.meta     || {};
  CITE_MAP = buildCiteMap(sections);

  // Sort parts by roman numeral order
  const sortedParts = [...parts].sort((a, b) => romanRank(a.roman) - romanRank(b.roman));

  // Group sections by part
  const byPart = {};
  sections.forEach(s => {
    (byPart[s.part] = byPart[s.part] || []).push(s);
  });

  // Sort sections within each part by cite number
  Object.values(byPart).forEach(arr => {
    arr.sort((a, b) => {
      const [aM, aN] = String(a.cite).split('.').map(Number);
      const [bM, bN] = String(b.cite).split('.').map(Number);
      return aM !== bM ? aM - bM : (aN || 0) - (bN || 0);
    });
  });

  // ── Sidebar TOC ──
  let tocHtml = '';
  sortedParts.forEach(p => {
    const list = byPart[p.id] || [];
    if (!list.length) return;
    tocHtml += `<div class="sidebar-part" onclick="document.getElementById('part-${esc(p.id)}')
      ?.scrollIntoView({behavior:'smooth'})">
      Part ${esc(p.roman)}: ${esc(p.title)}
    </div>`;
    list.forEach(s => {
      const mark = (s.body && s.body.length) ? '' : ' · reserved';
      tocHtml += `<a class="sidebar-sec" href="#s-${esc(s.cite)}">
        § ${esc(s.cite)} ${esc(s.title)}${mark}
      </a>`;
    });
  });
  // add Forms Registry to sidebar top
  const formsForToc=[...new Map(Object.values(FORMS_MAP).filter(f=>f&&f.id).map(f=>[f.id,f])).values()].sort((a,b)=> String(a.cite).localeCompare(String(b.cite), undefined, {numeric:true}));
  if(formsForToc.length){
    let formsToc=`<div class="sidebar-part" style="color:#10b981" onclick="document.getElementById('forms-registry')?.scrollIntoView({behavior:'smooth'})">📋 Forms Registry — ${formsForToc.length}</div>`;
    formsForToc.forEach(f=>{ formsToc+=`<a class="sidebar-sec" href="#form-${esc(f.id)}" onclick="openFormModal('${esc(f.id)}');return false;" style="color:#a7f3d0" title="${esc(f.title)}">Form ${esc(f.id.replace('MG-',''))} — §${esc(f.cite)}</a>`; });
    tocHtml = formsToc + tocHtml;
  }
  document.getElementById('sidebar-toc').innerHTML = tocHtml || '<div class="status">No sections.</div>';

  // ── Paper (with live word count + reading time) ──
  let totalWords = 0; let totalPages = 0;
  sections.forEach(s=> (s.body||[]).forEach(b=>{
    const w = (b.text||'').split(/\s+/).filter(Boolean).length;
    totalWords += w; totalPages += 1;
  }));
  const readMins = Math.max(1, Math.round(totalWords/200));
  const readHours = readMins>=60 ? `${Math.floor(readMins/60)}h ${readMins%60}m` : `${readMins}m`;
  let html = `
    <div class="kicker">${esc(meta.short || 'C.C.D.')}</div>
    <h1>${esc(meta.title || 'Codex')}</h1>
    <div class="meta-block">
      ${meta.subtitle  ? `<div>${esc(meta.subtitle)}</div>`  : ''}
      ${meta.issuer    ? `<div>${esc(meta.issuer)}</div>`    : ''}
      ${meta.edition   ? `<div>${esc(meta.edition)}</div>`   : ''}
      <div class="meta-pills">
        <span class="pill">${sections.length} sections</span>
        <span class="pill">${totalPages} pages</span>
        <span class="pill">${totalWords.toLocaleString()} words</span>
        <span class="pill">~${readHours} read</span>
        ${meta.approxPages ? `<span class="pill">~${esc(String(meta.approxPages))} ledger pages</span>` : ''}
        <span class="pill">${sortedParts.filter(p => (byPart[p.id]||[]).length).length} parts</span>
      </div>
    </div>
    <div class="qol-bar" id="qol-bar">
      <input type="search" id="codex-search" placeholder="Filter Codex — try 'pocket', 'Quiet List', '§ 1.6' …" oninput="filterCodex(this.value)" />
      <span class="qol-stat" id="qol-stat">${totalWords.toLocaleString()} words · ${totalPages} pages · ${readHours}</span>
      <button onclick="window.print()" title="Print this Codex">🖨️ Print</button>
      <button onclick="copyCodexLink()" title="Copy link to current section">🔗 Copy link</button>
      <button onclick="toggleCodexFont()" title="Toggle dyslexia-friendly font">Aa</button>
      <button onclick="toggleTheme()" title="Toggle paper theme">☼ Theme</button>
      <button onclick="toggleFocus()" title="Distraction-free reading">▣ Focus</button>
      <button onclick="setBookMode(true)" title="Open the page-at-a-time Codex reader">▤ Read book</button>
      <button onclick="jumpRandom()" title="Jump to a drafted section">↯ Random</button>
    </div>
    <div class="reader-tools"><button onclick="toggleBookmarks()">🔖 Bookmarks <span id="bookmark-count">0</span></button><button onclick="expandAll()">Expand all</button><button onclick="collapseAll()">Collapse all</button><span style="font:11px system-ui;color:#5d4a35;padding:6px 2px">Shortcuts: / search · f focus · r random</span></div>
    <div id="bookmark-list" class="bookmark-list"></div>
    ${renderFormsRegistry()}
  `;

  sortedParts.forEach(p => {
    const list = byPart[p.id] || [];
    if (!list.length) return;

    html += `<h2 class="part-heading" id="part-${esc(p.id)}">
      Part ${esc(p.roman)}: ${esc(p.title)}
    </h2>`;

    if (p.blurb) {
      html += `<p class="part-blurb">${esc(p.blurb)}</p>`;
    }

    list.forEach(s => {
      const secWords = (s.body||[]).reduce((n,b)=> n + (b.text||'').split(/\s+/).filter(Boolean).length, 0);
      const secPages = (s.body||[]).length;
      html += `<section class="sec" id="s-${esc(s.cite)}" data-words="${secWords}" data-title="${esc((s.title||'').toLowerCase())}">
        <div class="cite-heading">
          <span class="cite-num">§ ${esc(s.cite)}</span>
          &ensp;${esc(s.title)}
          <button class="copy-cite" onclick="copyCite('${esc(s.cite)}')" title="Copy § ${esc(s.cite)} link">Copy §</button>
          <span style="float:right;font-family:system-ui,sans-serif;font-size:11px;color:#5d4a35;margin-top:4px">${secWords.toLocaleString()}w · ${secPages}p</span>
          <span class="section-actions"><button onclick="toggleSection('${esc(s.cite)}')" title="Collapse section">−</button><button onclick="bookmarkSection('${esc(s.cite)}')" title="Save bookmark">🔖</button></span>
        </div>`;

      // inline attached form for this § (if any) — makes forms impossible to miss
      html += renderInlineForm(s.cite);
      if (!(s.body || []).length) {
        html += `<p class="part-blurb">[Reserved — not yet drafted. ${esc(s.brief || '')}]</p>`;
      } else {
        const items = s.body || [];
        const book = items.some(b => (b.text || '').length > 180);
        if (!book) {
          html += `<article class="codex-page"><div class="codex-page-head">${esc(s.title)}</div>` +
            items.map(b => `<p><strong>${esc(b.heading || '')}.</strong> ${linkCites(b.text || '')}</p>`).join('') +
            `</article>`;
        } else {
          items.forEach(b => {
            const paras = String(b.text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
            const letter = /^[a-z]+$/i.test(String(b.key || '')) ? `(${esc(b.key)}) ` : '';
            html += `<article class="codex-page"><div class="codex-page-head">${letter}${esc(b.heading || '')}</div>` +
              paras.map(p => `<p>${linkCites(p)}</p>`).join('') + `</article>`;
          });
        }
        html += renderSectionRefs(s);
      }

      html += `</section>`;
    });
  });

  document.getElementById('paper').innerHTML = html;
  CodexReader.build(data, sortedParts, byPart);
  attachCiteTips();
  renderBookmarks();
  // deep-link highlight if hash present — '.' in IDs like s-1301.1 needs getElementById, not querySelector
  if (location.hash) {
    try {
      const raw = decodeURIComponent(location.hash.slice(1));
      if(raw.startsWith('form-')){
        const fid=raw.replace('form-','');
        // forms may be MG-400A or 400-A — normalize
        const tryId = fid.startsWith('MG-') ? fid : 'MG-'+fid;
        if(FORMS_MAP[tryId]) openFormModal(tryId);
        else if(FORMS_MAP[fid]) openFormModal(fid);
      } else {
        const el = document.getElementById(raw) || document.querySelector(`[id="${CSS.escape ? CSS.escape(raw) : raw.replace(/"/g,'\\"')}"]`);
        if (el) el.scrollIntoView({behavior:'instant'});
      }
    } catch(e) { /* ignore bad hash */ }
  }
  // QoL: reading progress + stats live update
  requestAnimationFrame(()=>{
    const bar=document.getElementById('read-progress');
    if(bar){
      const onScroll=()=>{ const h=document.documentElement; const s=h.scrollTop/(h.scrollHeight-h.clientHeight); bar.style.width=(isFinite(s)?s*100:0)+'%'; };
      document.addEventListener('scroll', onScroll, {passive:true});
      onScroll();
    }
  });
}
// Reader upgrades: persistent bookmarks, focus mode, section density, and keyboard navigation.
const BOOKMARK_KEY='mages-codex-bookmarks';
function bookmarks(){ try{return JSON.parse(localStorage.getItem(BOOKMARK_KEY)||'[]')}catch(e){return[]} }
function bookmarkSection(c){ let b=bookmarks(); b=b.includes(c)?b.filter(x=>x!==c):[...b,c]; localStorage.setItem(BOOKMARK_KEY,JSON.stringify(b)); renderBookmarks(); document.getElementById('s-'+c)?.classList.toggle('bookmarked',b.includes(c)); }
function renderBookmarks(){const b=bookmarks(), box=document.getElementById('bookmark-list'), count=document.getElementById('bookmark-count'); if(count) count.textContent=b.length; if(box) box.innerHTML=b.length?'<b>Saved sections</b> '+b.map(c=>`<a href="#s-${c}" style="margin-left:10px;color:#6d28d9">§ ${c}</a>`).join(''):'No saved sections yet — use 🔖 on any heading.'; b.forEach(c=>document.getElementById('s-'+c)?.classList.add('bookmarked'));}
function toggleBookmarks(){document.getElementById('bookmark-list')?.classList.toggle('show');renderBookmarks()}
function toggleSection(c){document.getElementById('s-'+c)?.classList.toggle('collapsed')}
function expandAll(){document.querySelectorAll('.sec').forEach(x=>x.classList.remove('collapsed'))}
function collapseAll(){document.querySelectorAll('.sec').forEach(x=>x.classList.add('collapsed'))}
function toggleTheme(){document.body.classList.toggle('warm-reader');localStorage.setItem('mages-theme',document.body.classList.contains('warm-reader')?'warm':'dark')}
function toggleFocus(){document.body.classList.toggle('reading-focus')}
function jumpRandom(){const a=[...document.querySelectorAll('.sec:not(.hidden)')].filter(x=>x.querySelector('.codex-page'));if(a.length)a[Math.floor(Math.random()*a.length)].scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('codex-search')?.focus()}if(e.key.toLowerCase()==='f'&&document.activeElement.tagName!=='INPUT')toggleFocus();if(e.key.toLowerCase()==='r'&&document.activeElement.tagName!=='INPUT')jumpRandom()});
if(localStorage.getItem('mages-theme')==='warm')document.body.classList.add('warm-reader');

// QoL helpers: filter, copy, font toggle — fixed empty-cite false positive
function filterCodex(q){
  const needle=(q||'').toLowerCase().trim();
  const secs=[...document.querySelectorAll('.sec')];
  let shown=0;
  secs.forEach(sec=> sec.querySelectorAll('mark').forEach(m=>{ const t2=document.createTextNode(m.textContent); m.replaceWith(t2); }));
  if(!needle){
    secs.forEach(sec=> sec.classList.remove('hidden'));
    shown=secs.length;
  } else {
    const citeNeedle = needle.replace(/[^0-9.]/g,'');
    const hasCite = /\d/.test(citeNeedle) && citeNeedle.length>=2;
    secs.forEach(sec=>{
      const hay=(sec.textContent||'').toLowerCase();
      const idHit = hasCite && sec.id.toLowerCase().includes(citeNeedle);
      const hit = hay.includes(needle) || idHit;
      sec.classList.toggle('hidden', !hit);
      if(hit){
        shown++;
        if(needle.length>2){
          sec.querySelectorAll('.codex-page p').forEach(p=>{
            const raw=p.textContent;
            try{
              const escRe = needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
              const re=new RegExp('('+escRe+')','gi');
              if(re.test(raw)) p.innerHTML=esc(raw).replace(re,'<mark>$1</mark>').replace(/&lt;mark&gt;/g,'<mark>').replace(/&lt;\/mark&gt;/g,'</mark>');
            }catch(e){}
          });
        }
      }
    });
  }
  const stat=document.getElementById('qol-stat');
  if(stat){
    if(!needle) stat.textContent = document.querySelectorAll('.codex-page').length + ' pages · in-browser filter — also try main search';
    else if(shown===0) stat.innerHTML = '0 / '+secs.length+' sections match — <a href="index.html#search='+encodeURIComponent(needle)+'" style="color:#6d28d9;text-decoration:underline">Search whole Waluipedia for \u201c'+needle.replace(/"/g,'&quot;')+'\u201d →</a>';
    else stat.textContent = shown+' / '+secs.length+' sections match';
  }
  try{ history.replaceState(null,'', needle ? '#search='+encodeURIComponent(needle) : location.pathname+location.search); }catch(e){}
}
function copyCite(cite){
  const url=location.origin+location.pathname+'#s-'+cite;
  navigator.clipboard?.writeText(url).then(()=>{
    const tip=document.getElementById('cite-tip');
    if(tip){ tip.innerHTML=`<div class="tip-cite">Copied § ${cite}</div><div class="tip-brief">${url}</div>`; tip.classList.add('show'); setTimeout(()=>tip.classList.remove('show'),1200); }
  }).catch(()=> prompt('Copy link:', url));
}
function copyCodexLink(){
  const hash=location.hash||'';
  const url=location.origin+location.pathname+(hash||'#s-1.1');
  navigator.clipboard?.writeText(url).catch(()=> prompt('Copy link:', url));
}

// ── Fetch ─────────────────────────────────────────────────────────────────────

Promise.all([
  fetch('Reputation-Matrix2/data/laws/mages-guild-code.json', { cache: 'no-cache' }).then(r=>{ if(!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`); return r.json(); }),
  fetch('Reputation-Matrix2/data/laws/mages-forms.json', { cache: 'no-cache' }).then(r=> r.ok ? r.json() : {forms:[]}).catch(()=>({forms:[]}))
]).then(([codeData, formsData])=>{
  FORMS_MAP = buildFormsMap((formsData && formsData.forms) || []);
  // also hydrate sidebar with form count if present
  const formsCount = (formsData && formsData.forms || []).length;
  if(formsCount){
    const tip=document.getElementById('cite-tip');
    // no-op, just ensure FORMS_MAP ready before render
  }
  return codeData;
}).then(render)
  .catch(err => {
    const msg = esc(String(err));
    document.getElementById('paper').innerHTML =
      `<div class="error">⚠ Could not load <code>mages-guild-code.json</code><br><br>${msg}</div>`;
    document.getElementById('sidebar-toc').innerHTML =

  });
</script>
