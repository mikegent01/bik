<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex of the Mages' Guild — C.C.D.</title>
<style>
  :root {
    --bg: #1a1224;
    --paper: #f4efe3;
    --ink: #211810;
    --border: #c4ad84;
    --accent: #6d28d9;
    --accent-light: #c4b5fd;
    --meta: #5d4a35;
    --kicker: #6d28d9;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: #f3ead8;
    font: 16px/1.6 Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    gap: 0;
    align-items: flex-start;
  }

  /* ── Sidebar TOC ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 24px 14px 40px;
    border-right: 1px solid #3b2d52;
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
  }

  .sidebar-title {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent-light);
    font-weight: 800;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #3b2d52;
  }

  .sidebar-part {
    margin: 12px 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent-light);
    font-weight: 700;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 3px;
    transition: background .15s;
  }
  .sidebar-part:hover { background: #2d1f42; }

  .sidebar-sec {
    display: block;
    color: #b8a9d4;
    padding: 2px 6px 2px 14px;
    border-radius: 3px;
    text-decoration: none;
    line-height: 1.4;
    transition: background .15s, color .15s;
  }
  .sidebar-sec:hover {
    background: #2d1f42;
    color: #fff;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: #3b2d52; border-radius: 4px; }

  /* ── Main content ── */
  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 24px 80px;
  }

  .breadcrumb {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .breadcrumb a { color: var(--accent-light); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb span { color: #7c6b9a; margin: 0 6px; }

  /* ── Paper ── */
  .paper {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 36px 40px 56px;
    box-shadow: 0 18px 48px rgba(0,0,0,.45);
  }

  .kicker {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--kicker);
    font-weight: 800;
    font-family: system-ui, sans-serif;
    margin-bottom: 6px;
  }

  .paper h1 {
    font-size: 24px;
    line-height: 1.25;
    margin-bottom: 4px;
    letter-spacing: .02em;
  }

  .meta-block {
    font-size: 13px;
    color: var(--meta);
    margin: 8px 0 24px;
    line-height: 1.7;
    font-family: system-ui, sans-serif;
  }

  .meta-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .pill {
    background: #ede5d0;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11.5px;
    color: var(--meta);
    font-family: system-ui, sans-serif;
  }

  /* ── Part headings ── */
  .part-heading {
    margin: 40px 0 6px;
    padding-top: 22px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    font-variant: small-caps;
    letter-spacing: .1em;
    color: #3d2a00;
    font-family: system-ui, sans-serif;
  }

  .part-blurb {
    font-size: 13px;
    color: var(--meta);
    font-style: italic;
    margin-bottom: 16px;
    font-family: system-ui, sans-serif;
  }

  /* ── Sections ── */
  .sec {
    margin: 20px 0;
    padding: 16px 0 0;
    border-top: 1px solid #ddd0b8;
  }

  .sec:first-of-type { border-top: none; }

  .cite-heading {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 8px;
    color: #1a0f00;
  }

  .cite-num {
    color: var(--accent);
    font-family: system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
  }

  .body-row {
    margin: 6px 0 6px 1.4em;
    font-size: 14.5px;
    line-height: 1.6;
  }

  .codex-page {
    margin: 18px 0 28px;
    padding: 0 0 8px;
    border-bottom: 1px dotted #c4ad84;
  }
  .codex-page-head {
    font-variant: small-caps;
    letter-spacing: .06em;
    font-size: 15px;
    margin-bottom: 10px;
    color: #3d2a00;
  }
  .codex-page p {
    font-size: 15.5px;
    line-height: 1.78;
    margin: 0 0 12px;
    text-align: justify;
    color: #2a1c08;
  }

  .body-key {
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
    color: #5d4a35;
    font-weight: 700;
    margin-right: 4px;
  }

  .body-heading {
    font-weight: 700;
    margin-right: 4px;
  }

  .body-text { color: #2a1c08; }

  a.ref {
    color: #5b21b6;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  a.ref:hover { color: #3b0f8a; }

  /* ── Loading / Error ── */
  .status {
    padding: 40px;
    text-align: center;
    color: var(--meta);
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }

  .error {
    background: #fff0f0;
    border: 1px solid #f4a0a0;
    border-radius: 4px;
    padding: 16px 20px;
    color: #7a1010;
    font-family: system-ui, sans-serif;
    font-size: 13px;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .paper { padding: 20px 16px 40px; }
    .main { padding: 16px 12px 60px; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">C.C.D. Contents</div>
    <div id="sidebar-toc"><div class="status">Loading…</div></div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="breadcrumb">
      <a href="index.html#/cultures">← Cultures &amp; Laws</a>
      <span>·</span>
      <a href="index.html#/home">Home</a>
    </div>

    <div class="paper" id="paper">
      <div class="status">Loading Codex…</div>
    </div>
  </main>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// Linkify §X.Y references AFTER escaping
function linkCites(raw) {
  const escaped = esc(raw);
  return escaped.replace(/§\s*(\d+(?:\.\d+)*)/g,
    (_, num) => `<a class="ref" href="#s-${num}">§\u202F${num}</a>`
  );
}

// Roman numeral sort order helper
const ROMAN_ORDER = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
function romanRank(r) {
  const i = ROMAN_ORDER.indexOf(String(r).toUpperCase());
  return i === -1 ? 99 : i;
}

// ── Render ───────────────────────────────────────────────────────────────────

function render(data) {
  const parts    = data.parts    || [];
  const sections = data.sections || [];
  const meta     = data.meta     || {};

  // Sort parts by roman numeral order
  const sortedParts = [...parts].sort((a, b) => romanRank(a.roman) - romanRank(b.roman));

  // Group sections by part
  const byPart = {};
  sections.forEach(s => {
    (byPart[s.part] = byPart[s.part] || []).push(s);
  });

  // Sort sections within each part by cite number
  Object.values(byPart).forEach(arr => {
    arr.sort((a, b) => {
      const [aM, aN] = String(a.cite).split('.').map(Number);
      const [bM, bN] = String(b.cite).split('.').map(Number);
      return aM !== bM ? aM - bM : (aN || 0) - (bN || 0);
    });
  });

  // ── Sidebar TOC ──
  let tocHtml = '';
  sortedParts.forEach(p => {
    const list = byPart[p.id] || [];
    if (!list.length) return;
    tocHtml += `<div class="sidebar-part" onclick="document.getElementById('part-${esc(p.id)}')
      ?.scrollIntoView({behavior:'smooth'})">
      Part ${esc(p.roman)}: ${esc(p.title)}
    </div>`;
    list.forEach(s => {
      const mark = (s.body && s.body.length) ? '' : ' · reserved';
      tocHtml += `<a class="sidebar-sec" href="#s-${esc(s.cite)}">
        § ${esc(s.cite)} ${esc(s.title)}${mark}
      </a>`;
    });
  });
  document.getElementById('sidebar-toc').innerHTML = tocHtml || '<div class="status">No sections.</div>';

  // ── Paper ──
  let html = `
    <div class="kicker">${esc(meta.short || 'C.C.D.')}</div>
    <h1>${esc(meta.title || 'Codex')}</h1>
    <div class="meta-block">
      ${meta.subtitle  ? `<div>${esc(meta.subtitle)}</div>`  : ''}
      ${meta.issuer    ? `<div>${esc(meta.issuer)}</div>`    : ''}
      ${meta.edition   ? `<div>${esc(meta.edition)}</div>`   : ''}
      <div class="meta-pills">
        <span class="pill">${sections.length} sections</span>
        ${meta.approxPages ? `<span class="pill">~${esc(String(meta.approxPages))} pages</span>` : ''}
        <span class="pill">${sortedParts.filter(p => (byPart[p.id]||[]).length).length} parts</span>
      </div>
    </div>`;

  sortedParts.forEach(p => {
    const list = byPart[p.id] || [];
    if (!list.length) return;

    html += `<h2 class="part-heading" id="part-${esc(p.id)}">
      Part ${esc(p.roman)}: ${esc(p.title)}
    </h2>`;

    if (p.blurb) {
      html += `<p class="part-blurb">${esc(p.blurb)}</p>`;
    }

    list.forEach(s => {
      html += `<section class="sec" id="s-${esc(s.cite)}">
        <div class="cite-heading">
          <span class="cite-num">§ ${esc(s.cite)}</span>
          &ensp;${esc(s.title)}
        </div>`;

      if (!(s.body || []).length) {
        html += `<p class="part-blurb">[Reserved — not yet drafted. ${esc(s.brief || '')}]</p>`;
      } else {
        const items = s.body || [];
        const book = items.some(b => (b.text || '').length > 180);
        if (!book) {
          html += `<article class="codex-page"><div class="codex-page-head">${esc(s.title)}</div>` +
            items.map(b => `<p><strong>${esc(b.heading || '')}.</strong> ${linkCites(b.text || '')}</p>`).join('') +
            `</article>`;
        } else {
          items.forEach(b => {
            const paras = String(b.text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
            const letter = /^[a-z]+$/i.test(String(b.key || '')) ? `(${esc(b.key)}) ` : '';
            html += `<article class="codex-page"><div class="codex-page-head">${letter}${esc(b.heading || '')}</div>` +
              paras.map(p => `<p>${linkCites(p)}</p>`).join('') + `</article>`;
          });
        }
      }

      html += `</section>`;
    });
  });

  document.getElementById('paper').innerHTML = html;
}

// ── Fetch ─────────────────────────────────────────────────────────────────────

fetch('Reputation-Matrix2/data/laws/mages-guild-code.json', { cache: 'no-cache' })
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
    return r.json();
  })
  .then(render)
  .catch(err => {
    const msg = esc(String(err));
    document.getElementById('paper').innerHTML =
      `<div class="error">⚠ Could not load <code>mages-guild-code.json</code><br><br>${msg}</div>`;
    document.getElementById('sidebar-toc').innerHTML =
      `<div class="status" style="color:#f87171">Load failed</div>`;
  });
</script>
</body>
</html>
