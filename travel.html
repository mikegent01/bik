<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Terminal | Societal Values</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="societal-values.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            
            <main id="main-content">
                <h2 class="page-title">Societal Values & Ideology Analysis</h2>
                <p class="page-subtitle">Comparative analysis of faction ideologies across multiple value dimensions. Assess cultural alignment, potential alliances, and ideological fault lines.</p>
                
                <div id="dashboard-grid">
                    <!-- Summary Stats Row -->
                    <div id="values-stats-container" class="chart-container full-width" style="flex-direction: row; justify-content: space-around; padding: 20px;">
                        <!-- Injected by JS -->
                    </div>
                    
                    <!-- Main Values System Container -->
                    <div id="values-system-container" class="chart-container full-width">
                        <!-- Main system injected here -->
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Global function for faction modals -->
    <script>
        window.showFactionModal = (factionId) => {
            console.log('Opening faction details for:', factionId);
            alert(`Faction Profile: ${factionId}\n\nFull faction details would appear in a modal.`);
        };
    </script>
    
    <script type="module" src="common.js"></script>
    <script type="module" src="navigation.js"></script>
    <script type="module" src="societal-values.js"></script>
    <script type="module">
        import { renderSocietalValues, initSocietalValuesListeners, getAllFactionsWithValues } from './societal-values.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Render summary stats
            const statsContainer = document.getElementById('values-stats-container');
            if (statsContainer) {
                const factions = getAllFactionsWithValues();
                statsContainer.innerHTML = `
                    <div class="vital-stat">
                        <span class="vital-stat-icon">🏴</span>
                        <div class="vital-stat-info">
                            <span class="vital-stat-value">${factions.length}</span>
                            <span class="vital-stat-label">Analyzed Factions</span>
                        </div>
                    </div>
                    <div class="vital-stat">
                        <span class="vital-stat-icon">📐</span>
                        <div class="vital-stat-info">
                            <span class="vital-stat-value">12</span>
                            <span class="vital-stat-label">Value Axes</span>
                        </div>
                    </div>
                    <div class="vital-stat">
                        <span class="vital-stat-icon">⚖️</span>
                        <div class="vital-stat-info">
                            <span class="vital-stat-value">${factions.length * 12}</span>
                            <span class="vital-stat-label">Data Points</span>
                        </div>
                    </div>
                    <div class="vital-stat">
                        <span class="vital-stat-icon">🔥</span>
                        <div class="vital-stat-info">
                            <span class="vital-stat-value">${Math.floor(factions.length * 0.4)}</span>
                            <span class="vital-stat-label">Potential Conflicts</span>
                        </div>
                    </div>
                `;
            }
            
            // Render main system
            const systemContainer = document.getElementById('values-system-container');
            if (systemContainer) {
                try {
                    systemContainer.innerHTML = renderSocietalValues();
                    initSocietalValuesListeners();
                    console.log('Societal Values System initialized');
                } catch (error) {
                    console.error('Error initializing system:', error);
                    systemContainer.innerHTML = `
                        <div style="padding: 40px; text-align: center; color: var(--warning-color);">
                            <p>⚠️ Error loading Societal Values System</p>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">${error.message}</p>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
